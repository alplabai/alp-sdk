<text class="t h" x="294.0" y="337" font-size="12" text-anchor="middle">hal_alif</text>
<text class="t mono q" x="294.0" y="356" font-size="11.5" text-anchor="middle">v2.3.0</text>
<rect class="rec" x="396" y="316" width="168" height="50" rx="8"/>
<text class="t h" x="480.0" y="337" font-size="12" text-anchor="middle">Yocto</text>
<text class="t mono q" x="480.0" y="356" font-size="11.5" text-anchor="middle">kirkstone · scarthgap</text>
<rect class="rec" x="582" y="316" width="168" height="50" rx="8"/>
<text class="t h" x="666.0" y="337" font-size="12" text-anchor="middle">Renesas BSP</text>
<text class="t mono q" x="666.0" y="356" font-size="11.5" text-anchor="middle">v6.30</text>
