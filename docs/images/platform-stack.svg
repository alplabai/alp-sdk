<text class="t h" x="852.0" y="337" font-size="12" text-anchor="middle">Renesas AI SDK</text>
<text class="t mono q" x="852.0" y="356" font-size="11.5" text-anchor="middle">7.1</text>
<text class="t q h" x="24" y="400" font-size="11.5" text-anchor="start">VALIDATED HARDWARE — bench-run with exactly this set</text>
<rect class="hw" x="24" y="412" width="260" height="44" rx="8"/>
<text class="t h mono" x="154" y="439" font-size="13" text-anchor="middle">E1M-AEN801  2626-R2</text>
<text class="t q" x="300" y="439" font-size="12" text-anchor="start">rev = EEPROM hw_rev form &lt;board_datecode&gt;-&lt;rev key&gt;, printed as on the PCB</text>
</svg>
