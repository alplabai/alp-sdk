# Reviewed, time-boxed exceptions for scripts/check_abidiff.py (#2851).
#
# A list; each entry waives ONE ABI change that `abidiff` reports on the
# built libalp_sdk.so.  Keys (all required):
#   symbol  exact name as abidiff reports it: `gone` for a function or
#           variable, `struct cfg` for a type
#   kind    function | variable | type.  A `type` waiver covers a changed
#           function only when ALL of that function's reported changes are
#           indirect sub-type changes of waived types (a function that also
#           gained a parameter needs its own `function` waiver).
#   reason  non-empty: why the break is acceptable
#   issue   "#N" -- the tracking issue (quote it: a bare #N is a YAML comment)
#   until   "X.Y" -- SDK minor at which the waiver expires, i.e. when
#           metadata/sdk_version.yaml reaches it (quote it: 0.10 is a float)
#
# The gate FAILS on a malformed entry, a missing reason/issue, or an
# expired waiver.  Every change in a report must be covered or the gate
# still fails.  Typedef/anonymous types and array variables are not parsed,
# so they cannot be waived (the gate fails closed).  A waiver that matched
# nothing prints a warning; remove it.  Example:
#
#   - symbol: alp_foo_legacy
#     kind: function
#     reason: removed in the same minor before any release shipped it
#     issue: "#1234"
#     until: "0.19"
- symbol: alp_yocto_alsa_out_write_core
  kind: function
  reason: >-
    internal test seam of the Yocto ALSA audio backend (declared only in
    tests/yocto/audio_alsa.c, in no public header); it gained a wait-context
    parameter so a concurrent close() can wake a blocked write (#2977)
  issue: "#2977"
  until: "0.19"
