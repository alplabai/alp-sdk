# SPDX-License-Identifier: Apache-2.0
#
# alp-sdk west manifest.
#
# This is the manifest a Zephyr workspace uses when alp-sdk itself is
# the topdir.  Most application repos will instead add alp-sdk as a
# project in their own west.yml and let *that* manifest drive Zephyr.
#
# Pin policy:
#   - zephyr: the stable release the SDK is verified against.  Currently
#     v4.4.1 (the same revision pr-twister.yml + the nightly AEN HIL
#     workflow exercise).  v0.5 bumped from v3.7.0 LTS to v4.4.0 to
#     pick up mainline LVGL v9, upstream Alif Ensemble board files,
#     and the I2S inclusive-language rename.  Bumps are deliberate,
#     not automatic -- each major upgrade ships as a minor alp-sdk
#     release after re-verifying every wrapped peripheral on the
#     target SoMs.  See docs/zephyr-version-policy.md for the full
#     policy + LTS migration notes.
#   - hal_renesas / hal_nxp: imported via Zephyr's own west.yml (the
#     name-allowlist below lets them through the import filter).
#     Zephyr v4.4 pins specific revisions; we follow what Zephyr ships.
#     hal_renesas covers the RZ/V2N + RZ/V2L + RZ/V2H BSP under
#     `drivers/rz/fsp/src/rzv/bsp/mcu/rzv2n/`; hal_nxp covers
#     i.MX 93 (MIMX9301..9352) and i.MX 95 under
#     `mcux/mcux-sdk-ng/devices/i.MX/i.MX93/`.
#   - hal_alif: NOT in Zephyr's modules tree as of v3.7, but Alif
#     publishes a fully Apache-2.0-licensed Zephyr module of their
#     own at github.com/alifsemi/hal_alif (zephyr/module.yml shape,
#     standard cmake/kconfig hookup).  We import it directly here
#     as a top-level project at the latest tagged release.
#
#     IMPORTANT (current as of the v4.4.1 pin): upstream Zephyr v4.4
#     DOES ship the stock Alif Ensemble board files under
#     boards/alif/ -- ensemble_e8_dk (incl. our E8 part
#     ae822fa0e5597ls0; targets rtss_he / rtss_hp), ensemble_e1c_dk,
#     balletto_b1_dk.  So the DEFAULT AEN path is plain upstream
#     Zephyr + this hal_alif module -- no fork needed.  hal_alif
#     supplies the HAL drivers; the upstream boards/alif/ files give
#     the Alif-EVK board targets.  An E1M-AEN *carrier* still needs
#     its own board overlay (generated by alp-sdk, shipped in-tree
#     under zephyr/boards/alp/ via zephyr/module.yml's board_root)
#     because the upstream files target
#     Alif's own EVKs, not the E1M board.  Alif's complete fork
#     (`sdk-alif` / `zephyr_alif`) is the OPT-IN path (vendor-sdks
#     group) for customers who want Alif's whole Zephyr tree or its
#     newest fork-only bits; alp-sdk deliberately does NOT base on it
#     -- one upstream Zephyr base serves Alif + Renesas + NXP.  See
#     docs/getting-started.md §8 for the decision tree.
#
#     Two more Alif-specific pieces (alif_dave2d-driver,
#     alif_image-processing-lib) are vendor-licensed (Alif
#     Semiconductor Software License Agreement, source-visible);
#     they sit in the `vendor-sdks` group below alongside the
#     `sdk-alif` aggregate manifest for opt-in consumption by
#     AEN customers.
#
# When upgrading the Zephyr pin: change `revision:` below, rerun
# `west update`, verify the modules/hal/{renesas,nxp} revs that
# ship with the new Zephyr tag still satisfy the SoMs we target
# (see docs/os-support-matrix.md), bump pr-twister.yml's `--mr` to
# match, and add a CHANGELOG entry.

manifest:
  defaults:
    remote: zephyrproject

  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
    - name: majerle
      url-base: https://github.com/MaJerle
    - name: nanopb
      url-base: https://github.com/nanopb
    - name: alifsemi
      url-base: https://github.com/alifsemi
    - name: renesas
      url-base: https://github.com/renesas
    - name: nxp-mcuxpresso
      url-base: https://github.com/nxp-mcuxpresso
    # extras-tier1 community-library remotes (§D.lib batch).
    - name: olikraus           # u8g2
      url-base: https://github.com/olikraus
    - name: obgm               # libcoap
      url-base: https://github.com/obgm
    - name: warmcat            # libwebsockets
      url-base: https://github.com/warmcat
    - name: zserge             # jsmn
      url-base: https://github.com/zserge
    - name: lieff              # minimp3
      url-base: https://github.com/lieff
    - name: xiph               # opus
      url-base: https://github.com/xiph
    - name: catchorg           # Catch2
      url-base: https://github.com/catchorg
    - name: stephane           # libmodbus
      url-base: https://github.com/stephane
    - name: freertos-org       # coreMQTT-SN
      url-base: https://github.com/FreeRTOS
    - name: xio-technologies   # Madgwick AHRS reference
      url-base: https://github.com/xioTechnologies
    - name: bearssl-upstream   # BearSSL upstream git server -- non-GitHub
      url-base: https://bearssl.org/git
                              # https remote.  Upstream runs a real git
                              # server (not tarball-only, despite an
                              # earlier comment here claiming otherwise).
    - name: micro-ROS
      url-base: https://github.com/micro-ROS
    - name: arm-software    # CMSIS-Stream, CMSIS-CV, Arm-2D
      url-base: https://github.com/ARM-software
    # extras-cpp remotes (Task 0 3p-library-examples batch): three
    # header-only C++ libraries with no Zephyr module.yml, so they
    # can't ride the extras-tier1 mechanism.  Pins here are the
    # audit trail / version source-of-truth; the actual build
    # resolves against the vendored copies under vendors/<lib>/
    # (see vendors/{etl,fmt,doctest}/README.md) because `west
    # update` cannot run against an out-of-workspace worktree.
    - name: etlcpp
      url-base: https://github.com/ETLCPP
    - name: fmtlib
      url-base: https://github.com/fmtlib
    - name: doctest-org
      url-base: https://github.com/doctest

  # Groups disabled by default.  Entries pinned below for audit
  # in source control, but `west update` on a v0.3 workspace does
  # not fetch them and the Zephyr build does not auto-import them.
  # Flip via `west update --group-filter +<group>` (or by editing
  # this filter line) when the consuming work lands.
  #
  # `extras-lwrb-nanopb` - lwrb + nanopb pins for the SDK-internal
  #                    consumers (UART RX ring buffer, mproc IPC
  #                    framing).  Deferred / interim as of v0.9 --
  #                    no committed release swaps this group on; see
  #                    vendors/lwrb/README.md + vendors/nanopb/README.md.
  # `extras-tier1`   - upstream pins for the Tier 1 §D.lib batch
  #                    libraries that aren't in Zephyr's modules
  #                    tree (u8g2, libcoap, libwebsockets,
  #                    jsmn, bearssl, minimp3, opus,
  #                    catch2, libmodbus, madgwick_ahrs,
  #                    coremqtt_sn, cmsisstream (repo CMSIS-Stream),
  #                    CMSIS-CV, Arm-2D).  Disabled by default so v0.5
  #                    workspaces stay light; customers flip via
  #                    `west update --group-filter +extras-tier1`
  #                    when they list any of those libraries in
  #                    `board.yaml` `libraries:`.  Revisions below
  #                    are maintainer-verified-as-of 2026-05-14;
  #                    bumps land alongside the library knob in that
  #                    library's `integration.zephyr.hw_backends:` block
  #                    in `metadata/libraries/<name>.yaml`.
  # `vendor-sdks`    - public vendor SDK repos pinned to the
  #                    verified tags (Alif sdk-alif, Renesas
  #                    rzv-fsp, NXP mcuxsdk-manifests).  Carries
  #                    vendor-specific licensing -- see
  #                    docs/getting-started.md §8 and
  #                    docs/vendor-partnerships.md for the licence
  #                    story before enabling on a customer build.
  # `extras-cpp`     - etl / fmt / doctest.  Header-only C++ libs
  #                    with no Zephyr module.yml.  Disabled by
  #                    default like extras-tier1; unlike
  #                    extras-tier1 the SDK does NOT wait for this
  #                    group to build against them -- the vendored
  #                    copies under vendors/{etl,fmt,doctest}/
  #                    always satisfy the #include regardless of
  #                    this group's state.  Pinned here purely as
  #                    the audit trail / version source-of-truth;
  #                    see vendors/{etl,fmt,doctest}/README.md.
  #
  # `+optional`      - re-enables Zephyr's own "optional" group,
  #                    which its west.yml disables by default
  #                    (`group-filter: [-babblesim, -optional,
  #                    -testing]`, submanifests/optional.yaml).
  #                    tflite-micro lives in that group. The
  #                    name-allowlist below selects tflite-micro by
  #                    NAME, but name-allowlist and group-filter are
  #                    independent gates -- being allowlisted does
  #                    NOT activate a project sitting in an inactive
  #                    group. Without this, `west update` never
  #                    clones the actual TFLM library source (no
  #                    `optional/modules/lib/tflite-micro`); the
  #                    zephyr-tree-committed Kconfig glue
  #                    (modules/tflite-micro/Kconfig) still sources
  #                    fine either way, so CONFIG_TENSORFLOW_LITE_MICRO=y
  #                    silently downgrades to n ("unsatisfied
  #                    dependencies: 0 (=n)") instead of failing
  #                    loudly at manifest time, and the build only
  #                    dies later on a missing
  #                    tensorflow/lite/micro/*.h header (#1076,
  #                    surfaced by pr-twister-aen; the example that
  #                    surfaced it was the Renode-sim aen-sim-vision,
  #                    since deleted -- see docs/adr/0022 Amendment 2
  #                    -- but the five aen-npu-inference* apps still
  #                    set CONFIG_TENSORFLOW_LITE_MICRO=y, so the
  #                    allowlist entry stays load-bearing).
  #                    canopennode/chre/thrift/zephyr-lang-rust are
  #                    the group's other members but aren't
  #                    name-allowlisted, so this only pulls in
  #                    tflite-micro -- it does not widen the fetch
  #                    set. hal_ethos_u does NOT need this: it's in
  #                    Zephyr's "hal" group, which is active by
  #                    default.
  group-filter:
    - -extras-lwrb-nanopb
    - -extras-tier1
    - -extras-cpp
    - -vendor-sdks
    - +optional

  projects:
    # hal_alif lands directly from Alif's GitHub at Apache-2.0
    # because Zephyr's own west.yml doesn't include it (the Alif
    # Ensemble SoC + boards ARE in the upstream Zephyr tree as of
    # v4.4, but the hal_alif module is not a Zephyr-managed project).
    # Default-enabled (no group) so AEN builds work out of the
    # box -- matches how Zephyr's own west.yml ships hal_renesas /
    # hal_nxp for the other vendor families.  Pinned to a verified
    # tagged release; bumps coordinate with the Zephyr-LTS cycle.
    - name: hal_alif
      remote: alifsemi
      revision: v2.3.0
      path: modules/hal/alif

    - name: zephyr
      revision: v4.4.1        # Latest stable; see docs/zephyr-version-policy.md
      west-commands: scripts/west-commands.yml
      import:
        # Pull in only the modules we actually need.  Filtering keeps
        # CI fast; expand as new libraries land in the SDK.
        name-allowlist:
          # Vendor HALs imported via Zephyr's own west.yml.  Alif's
          # hal_alif is NOT here -- Zephyr's west.yml doesn't list it;
          # we import it as a separate top-level project below
          # against the Alif-maintained release at
          # github.com/alifsemi/hal_alif (Apache-2.0).
          # hal_renesas covers RZ/V2N (V2N + V2N-M1 SoMs);
          # hal_nxp covers i.MX 93 (E1M-NX9101).
          - hal_renesas
          - hal_nxp
          # Upstream littlefs C library (modules/fs/littlefs, group
          # "fs" in Zephyr's own west.yml).  Backs
          # CONFIG_FILE_SYSTEM_LITTLEFS (config FILE_SYSTEM_LITTLEFS
          # `depends on ZEPHYR_LITTLEFS_MODULE`, auto-set by Zephyr's
          # module-resolution pass once this module is present) --
          # was missing from the allowlist, so `libraries: [littlefs]`
          # emitted the right CONFIG_* lines (the manifest's own
          # `integration.zephyr.kconfig` array, transcribed by
          # scripts/alp_orchestrate/libraries.py's zephyr_kconfig_lines)
          # but `west update` never actually
          # fetched the module a real Kconfig solve needs (#3p-lib-examples
          # Task 0). NOTE: as of this fix, any <zephyr-workspace> topdir
          # this SDK is verified against that was set up before this
          # allowlist entry landed predates it -- a `west update` in
          # that workspace's own topdir manifest is required before
          # littlefs-keyvalue
          # actually builds; see the Task 0 completion report.
          - littlefs
          - cmsis
          # cmsis_6 provides cmsis_core.h for Cortex-M targets on Zephyr
          # v4.4 (the legacy `cmsis` module now serves Cortex-A/R only).
          # Required by the RZ/V2N + i.MX93 M33/M-class cores.
          - cmsis_6
          - cmsis-dsp
          # cmsis-nn (modules/lib/cmsis-nn) is CMSIS-DSP's Cortex-M
          # inference-kernel companion, `libraries: [cmsis-nn]`
          # (metadata/libraries/cmsis-nn.yaml, CONFIG_CMSIS_NN). Sits
          # right beside cmsis-dsp in Zephyr's own west.yml, same
          # unconditioned (default-active) shape -- was simply missed when
          # cmsis-dsp was added. Caught by
          # scripts/check_west_manifest_module_resolution.py (#1136).
          - cmsis-nn
          - lvgl
          - mbedtls
          - mcuboot
          # tflite-micro powers <alp/inference.h>'s TFLM backend.
          # Pulled in unconditionally so apps that flip
          # CONFIG_ALP_SDK_INFERENCE_TFLM=y just work; the module
          # is small enough that the cost-of-presence is negligible.
          - tflite-micro
          # hal_ethos_u is Arm's Ethos-U NPU driver (ethosu_driver +
          # the arm,ethos-u Zephyr device).  Without it CONFIG_ETHOS_U
          # is never DEFINED, so tflite-micro silently compiles its STUB
          # Register_ETHOSU() (returns nullptr) instead of the real
          # NPU kernel -- every Ethos-U inference then open()s fine but
          # fails at invoke, never reaching the E8 NPU (and the raw
          # DEVICE_DT_GET(ethosu_npu) apps fail to link on the absent
          # __device_dts_ord_33).  Pulling it in makes CONFIG_ETHOS_U /
          # CONFIG_ETHOS_U_ARM build for real so the Ethos-U55/U85 on
          # the AEN family is actually dispatchable through the SDK.
          # (An alp-sdk-topdir workspace set up before this entry needs
          # a `west update` before it builds -- same as the littlefs
          # note above.)
          - hal_ethos_u
          # zcbor backs the `.alpmodel` container reader
          # (CONFIG_ALP_SDK_MODEL_READER selects CONFIG_ZCBOR).
          # Without this allowlist entry an alp-sdk-topdir workspace
          # never fetches the module and the Kconfig select aborts
          # every MODEL_READER build.
          - zcbor
          # open-amp + libmetal back the Zephyr ipc_service RPMsg
          # (static-vrings) backend -- the HE<->HP dual-core RPC on
          # AEN (examples/aen/aen-rpc-pingpong, the alif,mhuv2-mbox
          # MBOX transport).  Pinned by Zephyr v4.4; allowlisted so the
          # OpenAMP RPC builds out of the box without a manual
          # -DEXTRA_ZEPHYR_MODULES.  libmetal (modules/hal/libmetal) is
          # open-amp's HAL/OS-abstraction dependency.
          - open-amp
          - libmetal
          # tf-psa-crypto is mbedTLS 4.x's split-out PSA crypto core
          # (modules/crypto/tf-psa-crypto, pinned by Zephyr v4.4, group
          # crypto).  Allowlisted so the PSA crypto path (the SE-CryptoCell
          # backend's MbedTLS-PSA fallthrough, examples/aen/aen-se-crypto)
          # resolves on `west update` without the bench-side symlink.
          - tf-psa-crypto
          # nanopb (modules/lib/nanopb, unconditioned -- default-active --
          # in Zephyr's own west.yml) backs `libraries: [nanopb]`
          # (metadata/libraries/nanopb.yaml, CONFIG_NANOPB) and
          # examples/connectivity/nanopb-encode-decode/CMakeLists.txt,
          # which FATAL_ERRORs at configure time if
          # ZEPHYR_NANOPB_MODULE_DIR isn't set -- unlike lwrb below (which
          # has a working in-tree stub covering the group-disabled case,
          # vendors/lwrb/src/lwrb_stub_impl.c), nanopb's vendor stub is
          # pure ABI scaffolding with no functional fallback.
          #
          # #1136: a previous pass (#650) reverted this exact allowlist
          # entry as "dead weight", because at the time alp-sdk's own
          # manifest ALSO defined a top-level project literally named
          # `nanopb` (below, under the disabled-by-default
          # `extras-lwrb-nanopb` group, pinned for the SDK-internal mproc
          # IPC framing rewrite). West's project-name dedup lets a
          # directly-listed project suppress a same-named imported one
          # even while sitting in an inactive group -- confirmed with
          # `west manifest --resolve` against both states of this file --
          # so the allowlist entry alone truly was inert. The fix is
          # both halves: allowlist `nanopb` here AND rename the
          # SDK-internal pin below to `nanopb-mproc-pin` so it no longer
          # shadows the name. That internal pin is genuine dead code
          # today regardless (src/common/proto/alp_mproc_frame.c
          # hand-rolls the wire format and never calls pb_encode/
          # pb_decode -- see vendors/nanopb/README.md), so renaming it
          # costs nothing.
          #
          # pr-twister.yml never caught this gap because it inits its
          # topdir straight from Zephyr's own west.yml
          # (`west init -m zephyr`), never consulting this manifest at
          # all -- see scripts/check_west_manifest_module_resolution.py,
          # which resolves THIS manifest's own module set for every
          # scenario Kconfig actually selects, to catch the next one.
          - nanopb

    # SDK-internal dependencies pinned ahead of their consumers landing
    # for real.  Behind the `extras-lwrb-nanopb` group (disabled above)
    # so a default workspace never sees them on `west update`.  The
    # vendor stub headers under `vendors/{lwrb,nanopb}/include/` keep
    # SDK source link-clean until the group is flipped on and the real
    # upstream sources swap in -- interim/deferred as of v0.9, no
    # committed release date.
    - name: lwrb
      remote: majerle
      revision: v3.2.0
      path: modules/lib/lwrb
      groups:
        - extras-lwrb-nanopb
    # Named `nanopb-mproc-pin`, not `nanopb` (#1136): this is a SEPARATE
    # pin (its own revision, for the not-yet-landed mproc IPC framing
    # generator swap) from the upstream `nanopb` project allowlisted
    # above for examples/connectivity/nanopb-encode-decode. Giving both
    # the same west project name would let this one (even disabled)
    # silently shadow that one -- see the allowlist comment above.
    # `repo-path` keeps the real upstream URL (github.com/nanopb/nanopb)
    # under the renamed local project name.
    - name: nanopb-mproc-pin
      remote: nanopb
      repo-path: nanopb
      revision: nanopb-0.4.9
      path: modules/lib/nanopb-mproc-pin
      groups:
        - extras-lwrb-nanopb

    # micro-ROS Zephyr module for the ADR 0018 Zephyr+ROS 2 flagship.
    # Pinned to the Humble branch revision verified on 2026-07-05; the
    # module's modules/libmicroros/Kconfig exposes the real master enable
    # symbol CONFIG_MICROROS.  Kept default-enabled so a board.yaml
    # `libraries: [micro-ros]` selection can build in the standard
    # alp-sdk workspace without an out-of-band EXTRA_ZEPHYR_MODULES path.
    - name: micro_ros_zephyr_module
      remote: micro-ROS
      revision: cfbddc5e4334317a1036e883ce8f6af12b1da66a
      path: modules/lib/micro_ros_zephyr_module

    # ---------------------------------------------------------------
    # extras-tier1 -- §D.lib batch.  Libraries that aren't in
    # Zephyr's modules tree, pinned to maintainer-verified tagged
    # releases (or a commit SHA where upstream has no semver releases --
    # bearssl, minimp3).  No project in this group floats a branch
    # revision (main/master/HEAD) -- see
    # tests/scripts/test_library_layer.py's
    # test_no_west_manifest_extras_tier1_tracks_a_floating_branch.
    # Disabled by default; consumers
    # flip via `west update --group-filter +extras-tier1` when their
    # board.yaml's `libraries:` lists any of these.  Each library
    # ships its compile-time profile + HW-accelerator binding under
    # metadata/library-profiles/<name>/.
    # ---------------------------------------------------------------
    - name: u8g2
      remote: olikraus
      repo-path: u8g2
      revision: 2.36.5            # Apr 2024; matches metadata/library-profiles/u8g2/.
      path: modules/lib/u8g2
      groups:
        - extras-tier1
    - name: libcoap
      remote: obgm
      repo-path: libcoap
      revision: v4.3.5            # Mar 2024.
      path: modules/lib/libcoap
      groups:
        - extras-tier1
    - name: libwebsockets
      remote: warmcat
      repo-path: libwebsockets
      revision: v4.3.4            # Mar 2024.
      path: modules/lib/libwebsockets
      groups:
        - extras-tier1
    - name: jsmn
      remote: zserge
      repo-path: jsmn
      revision: v1.1.0            # Header-only; latest tagged release.
      path: modules/lib/jsmn
      groups:
        - extras-tier1
    - name: minimp3
      remote: lieff
      repo-path: minimp3
      revision: ea99364f61c14656440e8d77e9c233ccf3124633 # master HEAD,
                                  # 2026-07-27.  No versioned releases.
                                  # `main` (the prior pin) does not exist on
                                  # this repo -- the default branch is
                                  # `master` -- so `west update
                                  # --group-filter +extras-tier1` could not
                                  # fetch this project at all.
      path: modules/lib/minimp3
      groups:
        - extras-tier1
    - name: opus
      remote: xiph
      repo-path: opus
      revision: v1.5.2            # Apr 2024 stable.
      path: modules/lib/opus
      groups:
        - extras-tier1
    - name: Catch2
      remote: catchorg
      repo-path: Catch2
      revision: v3.7.1            # Oct 2024.
      path: modules/lib/catch2
      groups:
        - extras-tier1
    - name: libmodbus
      remote: stephane
      repo-path: libmodbus
      revision: v3.1.10           # Aug 2023; v3.1.x stable.
      path: modules/lib/libmodbus
      groups:
        - extras-tier1
    - name: coreMQTT-SN
      remote: freertos-org
      repo-path: coreMQTT-SN
      revision: v1.0.1            # Aug 2024.
      path: modules/lib/coremqtt_sn
      groups:
        - extras-tier1
    - name: madgwick_ahrs
      remote: xio-technologies
      repo-path: Fusion           # The maintained successor lib (Madgwick
                                  # reference + Fusion are bundled).
      revision: v1.3.2            # 2026-07-20 tagged release, SHA
                                  # 015d68494274b479b5996bff2530ecbcfdc266f2.
                                  # Default branch is `main`; pinned to the
                                  # tag instead now that maintainer audit
                                  # is done.  Licence MIT, verified from
                                  # LICENSE.md at this ref.
      path: modules/lib/madgwick_ahrs
      groups:
        - extras-tier1
    - name: BearSSL
      remote: bearssl-upstream
      repo-path: BearSSL          # Upstream git server, not a mirror.
      revision: 7bea48e5e850ab4cafbe68d3765cdaba13a86d6f # refs/heads/master
                                  # HEAD on https://bearssl.org/git/BearSSL.
                                  # The prior `bearssl-mirror` remote
                                  # (github.com/bearsslmirror/BearSSL) does
                                  # not exist -- 404 -- so this project
                                  # could not be fetched at all.
      path: modules/lib/bearssl
      groups:
        - extras-tier1
    # CMSIS-Stream: static-scheduled streaming/dataflow graph runtime for
    # DSP/AI/audio/video. Ships its OWN Zephyr module glue AT this tag
    # (zephyr/module.yml -> module name `cmsisstream`, zephyr/Kconfig,
    # zephyr/CMakeLists.txt); pinned to the latest tagged release.
    # The project NAME must be the Zephyr module name `cmsisstream` (not the
    # GitHub repo name) so that metadata/libraries/cmsis-stream.yaml's
    # `integration.zephyr.module: cmsisstream` resolves against a real
    # top-level project -- otherwise an alp-sdk-owned workspace
    # (`west init -l alp-sdk`) can never fetch it in ANY group-filter
    # configuration, the #1136 shape that
    # scripts/check_west_manifest_module_resolution.py gates.  `repo-path`
    # carries the actual GitHub repo name.
    - name: cmsisstream
      remote: arm-software
      repo-path: CMSIS-Stream
      revision: v3.2.0            # Apr 2026; matches metadata/libraries/cmsis-stream.yaml.
      path: modules/lib/cmsis-stream
      groups:
        - extras-tier1
    # CMSIS-CV: optimised computer-vision kernels for Cortex-M
    # (Helium/Neon vectorised variants). Upstream has cut NO tags and NO
    # releases as of this pin -- SHA-pinned to `main`, not a floating
    # branch. Upstream's own README states verbatim "It is a work in
    # progress and has just started"; no zephyr/ directory, no
    # zephyr/module.yml, no Kconfig exist at this SHA, so this pin is an
    # audit trail only (recipe-only, tier B) until upstream ships Zephyr
    # integration -- see metadata/libraries/cmsis-cv.yaml.
    - name: CMSIS-CV
      remote: arm-software
      repo-path: CMSIS-CV
      revision: 25c6c111ee04dcfb0ae9093fd6dee4586872982c   # main @ 2026-07-15; no tags exist upstream.
      path: modules/lib/cmsis-cv
      groups:
        - extras-tier1
    # Arm-2D: 2D graphics library optimised for Cortex-M with Helium (MVE)
    # acceleration. Stable v1.2.x tagged series (more mature than
    # CMSIS-CV's tagless upstream); no zephyr/ directory, no
    # zephyr/module.yml, no Kconfig at this tag -- recipe-only (tier B)
    # like CMSIS-CV, see metadata/libraries/arm-2d.yaml. Upstream carries
    # one git submodule (examples/common/loader/freetype_loader/freetype)
    # scoped under examples/ only -- deliberately NOT set `submodules:
    # true` here, since alp-sdk never builds Arm-2D's example tree.
    - name: Arm-2D
      remote: arm-software
      repo-path: Arm-2D
      revision: v1.2.6            # Mar 2026; matches metadata/libraries/arm-2d.yaml.
      path: modules/lib/arm-2d
      groups:
        - extras-tier1
    # gfx_compat is maintainer-written and ships in-tree under
    # src/lib/gfx_compat/ -- no west pin needed.

    # ---------------------------------------------------------------
    # extras-cpp -- 3 header-only C++ libraries with no Zephyr
    # module.yml (so they can't ride extras-tier1's west-project
    # mechanism the way u8g2/libcoap/etc. do).  Disabled by default;
    # pinned here as the audit trail / version source-of-truth for
    # the vendored copies under vendors/{etl,fmt,doctest}/ -- see
