description: |
  ipc_service backend for the RZ/V2N / V2M Cortex-M33 system manager.  The
  CM33 is the OpenAMP remote (virtio device) of the Cortex-A55/Linux master:
  it publishes a vendor-shaped resource table + the Alp AMP beacon in the
  `rsctbl` memory node, takes its vring addresses from the `vring_ctrl0` /
  `vring_ctrl1` nodes and its buffer pool from `chosen { zephyr,ipc_shm }`
  (board dts, generated by scripts/gen_zephyr_board.py).  Upstream's
  zephyr,ipc-openamp-static-vrings cannot be used here: it lays its own
  vrings out inside one region and has no resource table, whereas the A55
  attach path (src/backends/rpc/yocto_uio_drv.c) reads both from the table.

  Endpoints are created at fixed rpmsg addresses 1024 + registration index
  (the A55 names the CM33 service address explicitly as dst_ept).

compatible: "alp,ipc-v2n-rpmsg"

include: base.yaml

properties:
  mboxes:
    required: true
    description: |
      MHU-B mailbox (renesas,rz-mhu-b-mbox).  "rx" is the A55 -> CM33
      doorbell; "tx" is declared for MBOX_DT_SPEC_GET() users, the CM33 ->
      A55 doorbell is a direct MHU-B register write
      (<alp/protocol/v2n_mhu_doorbell.h>).

  mbox-names:
    required: true
    description: Must be "tx" and "rx".
