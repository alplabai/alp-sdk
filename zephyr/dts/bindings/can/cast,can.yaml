description: Cast CAN

include: [can-controller.yaml, can-fd-controller.yaml, pinctrl-device.yaml]

compatible: "cast,can"

properties:
  reg:
    required: true

  reg-names:
    required: true

  interrupt-parent:
    required: true

  interrupts:
    required: true

  interrupt-names:
    required: true

  clocks:
    required: true
    description: Includes Clock Controller module

  clock-frequency:
    type: int
    required: true
    description: |
      CAN core clock in Hz. The driver programs CANFD_CTRL.CKDIV (bits [7:0]) =
      160 MHz / clock-frequency (integer divisor 2..255), so the value should divide
      160 MHz exactly (bench-verified at 20 MHz, CKDIV 8).

  can-fd:
    type: boolean
    description: |
     Enable CAN FD support.
     When enabled, can-fd-ctrl-reg and can-fd-bit must be specified.

  can-fd-ctrl-reg:
    type: int
    description: |
      Address of the CAN FD control register.
      Required when can-fd is true.

  can-fd-bit:
    type: int
    description: |
      Bit position within can-fd-ctrl-reg that enables CAN FD mode.
      Required when can-fd is true.
