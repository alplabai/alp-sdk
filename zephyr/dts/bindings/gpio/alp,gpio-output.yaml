description: |
  alp-sdk ad hoc GPIO-output consumer. Carries a single `gpios` phandle an app
  resolves directly via GPIO_DT_SPEC_GET(), for a board-specific signal the
  portable <alp/*> peripheral surface has no concept of (so alp_gpio_open()'s
  `alp,pin-array` id space is not the right fit either). Mirrors
  alp,adc-input.yaml's reasoning: a `compatible` (rather than the bare
  `zephyr,user` node shape) is required for edtlib to type the property as
  phandle-array at all, since infer_binding_for_paths only special-cases the
  literal "/zephyr,user" node path (gen_edt.py) -- see
  examples/aen/aen-camera-firstlight/boards/trigger_gpio.overlay for the first
  consumer.

compatible: "alp,gpio-output"

include: [base.yaml]

properties:
  gpios:
    type: phandle-array
    required: true
    description: The GPIO pin this consumer drives.
