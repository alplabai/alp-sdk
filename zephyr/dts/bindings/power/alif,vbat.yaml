#
# Alif Ensemble VBAT block (VBAT_Type: GPIO_CTRL, TIMER_CLKSEL, PWR_CTRL, RET_CTRL, RTC_CLK_EN).
#
# Plumbing for the SoM power layer (alp-sdk#2784): a bare register window the
# power code addresses through the devicetree instead of a hard-coded literal.
# No driver binds it, no clocks, no pinctrl.  Base and size are from the Alif
# DFP Device/soc/<part>/include/rtss_he/soc.h and rtss_hp/soc.h (VBAT_BASE 0x1A609000,
# 20-byte block).

description: |
  Alif Ensemble VBAT block (VBAT_Type: GPIO_CTRL, TIMER_CLKSEL, PWR_CTRL, RET_CTRL, RTC_CLK_EN).  Always-on; a register window only.

compatible: "alif,vbat"

include: [base.yaml]

properties:
  reg:
    required: true
