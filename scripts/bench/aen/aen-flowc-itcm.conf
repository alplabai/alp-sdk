# Flow-C-ONLY AEN801 (E8, M55-HE) link-offset override -- forces an app back
# to the ITCM base (0x0) for a J-Link RAM-run. NOT for Flow A/D (production
# MRAM boot): a slot0-by-design app that picks this fragment up on a Flow A/D
# build gets silently relocated to 0x0 and, if flashed, produces a broken
# image.
#
# EVERY AEN app is slot0-by-design now (alp-sdk#1067): the board _defconfig
# sets CONFIG_USE_DT_CODE_PARTITION=y, so a plain `west build` links into MRAM
# slot0 and this fragment (plus aen-flowc-itcm.overlay) is REQUIRED for any
# Flow C RAM-run, not just for the apps that hard-code the offset. ram-run.sh
# refuses a slot0-linked image with exit 5 rather than mis-running it.
#
# Seven examples ALSO hard-code CONFIG_FLASH_LOAD_OFFSET=0x10000 in their own
# files -- redundant since #1067 but harmless (Kconfig resolves the same
# 0x10000, no warning) -- and they are the reason the second line below
# exists: the five aen-cc3501e-* apps (aen-cc3501e-ble-gatt,
# aen-cc3501e-bringup, aen-cc3501e-companion-tour, aen-cc3501e-gatt-register,
# aen-cc3501e-gpio) and aen-eeprom-manifest, all via their own prj.conf, plus
# examples/peripheral-io/alp-console, which sets it via a BOARD-scoped conf
# instead (boards/alp_e1m_aen801_m55_he_ae822fa0e5597ls0_rtss_he.conf).
#
# Layer this ON TOP of scripts/bench/aen/aen-bench-shared.conf for a Flow C
# RAM-run, e.g.:
#     west build ... -- \
#         -DEXTRA_CONF_FILE="scripts/bench/aen/aen-bench-shared.conf;scripts/bench/aen/aen-flowc-itcm.conf"
#
# Why both lines: the Flow C ITCM retarget overlay (zephyr,flash = &itcm;)
# only changes the ROM *region*; it does not undo a literal
# CONFIG_FLASH_LOAD_OFFSET one of the seven apps above hard-codes for its
# normal slot0 boot. CONFIG_USE_DT_CODE_PARTITION=n alone undoes the board
# _defconfig's DERIVED offset; a hard-coded literal survives it untouched and
# silently re-links the ITCM build at 0x10000, not 0x0. Both lines here are
# needed to force it back.
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x0
