# Shared AEN801 (E8, M55-HE) bench conf: RAM-console observability + DCACHE off.
# GENERIC across all four flows (A/B/C/D) -- it carries no link-offset override.
# For a Flow C ITCM RAM-run you ALSO need scripts/bench/aen/aen-flowc-itcm.conf
# (see that file); do not fold its CONFIG_USE_DT_CODE_PARTITION=n /
# CONFIG_FLASH_LOAD_OFFSET=0x0 back in here -- a Flow D (production MRAM,
# slot0-by-design) app built with this fragment alone must still link at its
# real slot0 offset, and re-merging them silently relocates it to 0x0.
#
# Add this to a bench app with, e.g.:
#     west build ... -- -DEXTRA_CONF_FILE=scripts/bench/aen/aen-bench-shared.conf
#
# Why the RAM console: the app UART5 IS USB-routed on this bench since
# 2026-07-03 (labgrid `console` resource), so a Flow A/D MRAM boot streams the
# app's output there normally.  But a Flow C ITCM RAM-run produces ZERO bytes on
# UART5 -- confirmed on hardware where that capture is otherwise proven working,
# with the core reaching arch_cpu_idle at IPSR=0, i.e. it ran fine and the output
# simply did not route (issue #935).  So for Flow C the observable is
# 'ram_console_buf' read over SWD and the console must be the RAM buffer, NOT a
# UART.  CONFIG_DCACHE=n because the E8 D-cache maintenance loop hangs on this
# silicon.
#
# Why the buffer is 16 KiB and not something tighter: ram_console_out() WRAPS.
# It advances with `pos = (pos + 1) % (CONFIG_RAM_CONSOLE_BUFFER_SIZE - 1)`
# (zephyr/drivers/console/ram_console.c), so an app that emits more than the
# buffer holds does not truncate cleanly at the end -- it overwrites its own
# beginning, and the SWD read-back decodes as garbage interleaved from two
# different points in the run.  That reads like a crash or a corrupted image
# when the app in fact ran perfectly.  The previous 2048 was already too small
# for examples/aen/aen-evk-demo (~6 KiB of phase output), which is how the
# hazard surfaced.  Raise this rather than trimming an app's output: the cost is
# RAM on a bench build only, and the failure it prevents is one that misleads
# rather than merely losing data.
CONFIG_ALP_SDK=y
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=y
CONFIG_DCACHE=n
