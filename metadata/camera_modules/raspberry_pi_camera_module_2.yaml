# Alp SDK camera module: Raspberry Pi Camera Module 2 (Sony IMX219).
# No Zephyr shield in this tree.  Values from the retired
# hand-written IMX219 Linux fragment (the generated
# meta-alp-sdk/recipes-kernel/linux/linux-renesas/e1m-x-evk-cam0-raspberry_pi_camera_module_2.dtsi
# replaces it), which was BENCH-UNVERIFIED (its 24 MHz xclk, 0x10 address and 2-lane
# wiring are assumptions, not bench facts).
schema_version: 1
module_id:      raspberry_pi_camera_module_2
display_name:   "Raspberry Pi Camera Module 2 (IMX219, 2-lane CSI-2)"
chip:           imx219
i2c_addr_7bit:  0x10
xclk_hz:        24000000
lanes:          2
