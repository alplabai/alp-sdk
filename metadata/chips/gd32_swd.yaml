# Alp SDK chip manifest: bit-bang SWD controller for the GD32G553.
schema_version:   1
chip_id:          gd32_swd
driver_status:    partial          # Packet layer + DPIDR + halt + FMC erase/write/verify
                                   # all coded.  V2N pad assignments resolved (P70/P71/P74).
                                   # Flips to "complete" once exercised on real silicon.
display_name:     "Bit-banged SWD controller (GD32G553 target, V2N host-driven)"
vendor:           alplab           # Implementation owned by Alp Lab; the underlying SWD
                                   # protocol is Arm Coresight (Arm DDI 0316C).
mpn_population:
  - "N/A (host-side software; no on-module silicon)"
datasheet:
  primary:        "Arm DDI 0316C -- ADIv5 Architecture Specification"
  reference:      "Arm DUI 0552A -- Coresight DAP Bit-bang Algorithms"
  target:         "GigaDevice GD32G553 User Manual Rev. 1.2 (FMC §3)"

notes: |
  The companion GD32G553MEY7TR on V2N / V2N-M1 carries the standard
  Arm Coresight SWD debug port.  Per the 2026-05-12 hardware
  decision the V2N board routes GD32_SWDIO + GD32_SWCLK + GD32_NRST
  back to the Renesas RZ/V2N host so the host can reflash the
  supervisor MCU in the field without an external probe.

  This chip module implements the SWD packet layer + the GD32G553
  FMC flash sequence (KEY1 / KEY2 unlock, PER + PNB sector erase,
  doubleword PG write).  No vendor SDK pulled in; only public
  algorithms from the Arm spec + the GD32G553 user manual.

  V2N pad assignments (maintainer-confirmed, see signals: below):
  SWDIO on Renesas P70, SWCLK on Renesas P71, NRST on Renesas P74
  (shared with the primary PMIC reset-out, open-drain).  P70 and
  P71 displace what were E1M PWM2 and E1M PWM3 on the Renesas
  side -- those PWMs remain available via the GD32-driven path
  (GD32 PB14 / PC5) since the V2N SoM selects PWM source SoM-wide
  via the resistor-strap option, not per-channel.  The driver
  still doesn't encode the pad mapping -- the caller hands in
  three pre-opened alp_gpio_t handles.

bus:              gpio              # bit-bang SWD on three GPIOs

signals:
  - { name: SWDIO, type: bidir,        v2n_route: "Renesas P70 <-> GD32 PA13",
      notes: "host switches between input and output during data phase + ACK" }
  - { name: SWCLK, type: output,       v2n_route: "Renesas P71 <-> GD32 PA14",
      notes: "host-driven; default ~1 MHz; configurable via gd32_swd_set_clock_delay" }
  - { name: NRST,  type: open_drain,   v2n_route: "P74 <-> GD32 NRST",
      notes: "shared with primary PMIC reset out; host pad MUST be open-drain" }

# target_expected_idcode is deliberately ABSENT, not just unset to a
# placeholder -- same stance metadata/schemas/soc-spec-v1.schema.json's
# own `expect_dpidr` field guidance takes for every Alif Ensemble SoC
# variant (#1355): an absent key is the correct published "unknown",
# and a guessed value is strictly worse than absent, because a
# wrong-board guard armed with it can pass on exactly the board it
# exists to exclude (see metadata/socs/alif/ensemble/e8.json's
# `expect_dpidr` note for the live, actually-measured instance of that
# stance). This field is not consumed as a guard by anything today --
# neither gd32_swd_connect() (chips/gd32_swd/gd32_swd.c) nor the field
# itself is read by any generator or validate_metadata.py check -- so
# leaving it absent breaks no consumer.
#
# Two candidate values circulate elsewhere in this repo, neither
# attested on a GD32 with a probe attached: `0x0BE12477` (no
# attribution at all -- no bench transcript, no datasheet reference, no
# commit message) and `0x6BA02477` (the bench-measured V2N CM33 DAP on
# a V2N bench unit, and separately the generic architectural default for
# ANY Cortex-M33 r0p1 SW-DPv2 part -- retained for that reason as
# GD32_SWD_GENERIC_CM33_R0P1_IDCODE in include/alp/chips/gd32_swd.h,
# which `chips/gd32_swd/gd32_swd.c` and the v2n-gd32-swd-flash example
# log informationally and never gate on). Do not repopulate this field
# from either candidate; it needs a measurement (#1369).

physical:
  # gd32_swd is a host-side bit-bang SWD *controller*, not a physical
  # part -- there is no on-module silicon of its own (mpn_population
  # above is explicitly "N/A").  The real silicon it targets is the
  # GD32G553MEY7TR, whose footprint/pinout lives in gd32g553.yaml
  # (physical.package: WLCSP-81).  This minimal block only records
  # that gd32_swd is a debug-interface software entry, not a BOM line.
  package:     "n/a -- debug-interface software module; no dedicated silicon (target: GD32G553MEY7TR, see gd32g553.yaml)"
  visibility:  public
  provenance:  web_provisional

kconfig:
  zephyr:         ALP_SDK_CHIP_GD32_SWD
  baremetal:      ALP_SDK_CHIP_GD32_SWD
  yocto:          n/a

families:
  - v2n
  - v2n-m1

verification:
  hil_silicon:    untested        # paper-correct only until v1.0 verification sweep.
  smoke_tests:    null_arg_guard
