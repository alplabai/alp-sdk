# Alp SDK chip manifest: TI DP83825 10/100 Mbps RMII Ethernet PHY.
schema_version:   1
chip_id:          dp83825
driver_status:    none              # no alp-sdk chip driver exists (ADR 0023
                                     # layer 3 gap, #1241). The bench-verified
                                     # PASS (examples/aen/aen-ethernet-link)
                                     # reaches the PHY via the upstream
                                     # eth_dwmac_alif_ensemble Tier-1.5 MAC
                                     # glue + raw MDIO register reads in
                                     # application code, not a PHY driver. The
                                     # managed-MDIO alternative
                                     # (MDIO_DWMAC_ALIF + upstream
                                     # phy_ti_dp83825,
                                     # zephyr/kconfigs/vendor-alif-peripherals.kconfig:139-158)
                                     # has been exercised on real E8 silicon
                                     # at the MDIO layer only (#1244: PHY-ID
                                     # + register reads at address 0);
                                     # link/traffic over it is still unproven.
display_name:     "TI DP83825 10/100 Mbps RMII Ethernet PHY (exact order code TBD)"
vendor:           ti
mpn_population:
  - "DP83825"                       # family only; exact order-code suffix
                                     # (temp/package grade, e.g. "I"
                                     # industrial) NOT confirmed against the
                                     # netlist/BOM -- see #1241 "Blocked on".
                                     # Do not promote the "DP83825I" label the
                                     # devicetree used to carry (dropped from
                                     # zephyr/dts/alif/ensemble_e8_peripherals.dtsi:538-560
                                     # with the #1244 address fix) into this
                                     # field as fact: the bench-read
                                     # id=2000a140 is die/OUI identity only.
datasheet:
  primary:        TBD               # netlist/BOM would confirm the exact
                                     # order code and unlock the matching TI
                                     # datasheet variant.

bus:              mdio              # clause-22 MDIO management bus, shared
                                     # with the GMAC's embedded MDIO
                                     # controller (MDIO_DWMAC_ALIF)

phy_id_pattern:   0x2000a140         # PHYID1+PHYID2, bench-confirmed via
                                     # MDIO PHY@0 id=2000a140 read on real E8
                                     # silicon
                                     # (examples/aen/aen-ethernet-link/README.md:39).
                                     # This is the die/OUI identity only -- it
                                     # does not distinguish DP83825
                                     # grade/package suffixes, so it cannot
                                     # settle the order-code blocker above.

notes: |
  On-module TI RMII PHY (zephyr/dts/alif/ensemble_e8_peripherals.dtsi:467),
  listed as "TI DP83825 Ethernet PHY" in
  metadata/e1m_modules/aen/CHANGELOG.md:16 (family only, no order code).
  Real hardware, not theoretical:
  examples/aen/aen-ethernet-link/README.md:35-47 records an end-to-end
  RESULT PASS on real E8 silicon (link up, DHCP lease acquired, confirmed on
  the server's ARP table too).

  PHY MDIO address: 0, confirmed on real E8 silicon and now correct in the
  devicetree. The bench log above reads the PHY at MDIO address 0
  (`[eth] MDIO PHY@0 id=2000a140`, matching the DP83825's published id
  2000a140), and zephyr/dts/bindings/ethernet/alif,ethernet.yaml:47's own
  binding example agrees ("e.g. ti,dp83825 at addr 0").

  This paragraph previously recorded the disagreement as open: the DT carried
  `reg = <1>` with a "fork reference ... verify" self-flag, and this manifest
  said the address was "wrong and tracked separately (#1244), not fixed by
  this manifest". #1244 fixed it — `zephyr/dts/alif/ensemble_e8_peripherals.dtsi`
  now declares `ethernet-phy@0` with `reg = <0>`. Leaving the old wording in
  place would have left this manifest asserting a fix had not happened while
  shipping in the same commit that made it.

  Exact order code: unresolved, see `mpn_population` above and #1241
  "Blocked on".

families:
  - aen

verification:
  hil_silicon:    verified          # link + DHCP bench-confirmed on real E8
                                     # silicon
                                     # (examples/aen/aen-ethernet-link,
                                     # RESULT PASS). Confirms the PHY
                                     # hardware path, not an alp-sdk driver
                                     # surface -- none exists
                                     # (driver_status above).
  smoke_tests:    none              # no alp-sdk driver surface exists to
                                     # unit-test.

kconfig:
  zephyr:         n/a               # no ALP_SDK_CHIP_DP83825 symbol; PHY
                                     # reached via the eth_dwmac_alif_ensemble
                                     # Tier-1.5 MAC glue + raw MDIO reads in
                                     # application code, or the upstream
                                     # MDIO_DWMAC_ALIF/phy_ti_dp83825
                                     # managed-MDIO path (BUILD-ONLY).
  baremetal:      n/a               # no baremetal (CMSIS, no-RTOS) AEN
                                     # Ethernet target exists in this tree.
  yocto:          n/a               # no A32/Linux Ethernet enablement exists
                                     # for AEN in this tree.
