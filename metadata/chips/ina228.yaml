# Alp SDK chip manifest: TI INA228 power / energy / charge monitor.
schema_version:   1
chip_id:          ina228
driver_status:    partial           # chips/ina228/ (#2645): probe + identity check, ADC_CONFIG,
                                     # SHUNT_CAL, shunt / bus / die-temp / current / power /
                                     # energy / charge reads, accumulator reset, DIAG_ALRT read.
                                     # Alert limit registers and SHUNT_TEMPCO are not exposed.
                                     # ADR 0017: upstream Zephyr v4.4.1 ships `ti,ina228`
                                     # (drivers/sensor/ti/ina2xx, CONFIG_INA228) and is the path
                                     # for a bus a Zephyr core masters. This portable driver covers
                                     # the E1M-X EVK, where the INA228 is on E1M-X I2C0, owned by
                                     # Linux on the A55 (i2c-0), and the 6.1.141-cip43 kernel has no
                                     # INA228 driver (`ina238` matches `ti,ina238` only): read over
                                     # i2c-dev, same position as chips/ina236.
display_name:     "TI INA228 85 V 20-bit power / energy / charge monitor"
vendor:           ti
mpn_population:
  - "INA228AIDGS"

datasheet:
  primary:        "TI INA228 SLYS021A (May 2022)"

notes: |
  +5V input-rail monitor on the E1M-X EVK sensor bus (XEVK_I2C_BUS_SENSORS =
  E1M_X_I2C0), address macro XEVK_I2C_ADDR_INA228_5V (0x42) from
  metadata/boards/e1m-x-evk.yaml.

  Driver: chips/ina228 (portable, integer math) for the Linux i2c-dev path
  on the EVK; upstream Zephyr's `ti,ina228` for a bus a Zephyr core masters.
  The register facts were checked against SLYS021A: MANUFACTURER_ID (0x3E)
  reads 0x5449, DEVICE_ID (0x3F) DIEID[15:4] = 0x228 (reset value 0x2281);
  shunt LSB 312.5 nV (ADCRANGE = 0) or 78.125 nV (ADCRANGE = 1); bus
  195.3125 uV/LSB; die temperature 7.8125 m degC/LSB; SHUNT_CAL = 13107.2e6 x
  CURRENT_LSB x R_SHUNT (x4 for ADCRANGE = 1), CURRENT_LSB = max current /
  2^19; power = 3.2 x CURRENT_LSB x POWER; energy = 16 x 3.2 x CURRENT_LSB x
  ENERGY; charge = CURRENT_LSB x CHARGE.

  Sense shunt: 100 mOhm, 1 %, 1 W (from the carrier design data). With it
  the shunt-voltage full scale is 1.6384 A (ADCRANGE = 0, +/-163.84 mV) or
  0.4096 A (ADCRANGE = 1, +/-40.96 mV). The board metadata passes the
  ADCRANGE = 0 full-scale value as the reporting scale: it is derived from
  the shunt, not from a limit of the rail.

  Hardware caveat: on the current E1M-X EVK revision this device's I2C bus
  pins are documented as swapped in the design data and are corrected by a
  hand rework on the board. It answers at 0x42 only on carriers with that
  rework applied; a carrier without it will not answer, so a consumer must
  treat "no ACK at 0x42" as the part being absent, not as a fault.

  Bench status: address 0x42 answered a read-probe on E1M-V2M103 units in the
  E1M-X EVK on 2026-10-02, and did not answer on an earlier unit (2026-09-26,
  #2343). No identity register has been read at 0x42, so `hil_silicon` stays
  `untested`.

bus:              i2c
i2c:
  addresses:
    - { addr_7bit: 0x42, scope: "A1 = GND, A0 = SDA (E1M-X EVK +5V input monitor)" }
  address_strap_range: "0x40..0x4F (A1 and A0 each to GND, VS, SDA or SCL)"
  max_clock_hz:   2940000

monitoring:
  voltage_range_v: [0, 85]
  current_resolution_bits: 20

kconfig:
  zephyr:         ALP_SDK_CHIP_INA228   # chips/ina228; upstream CONFIG_INA228 is the separate Zephyr-bus path
  baremetal:      ALP_SDK_CHIP_INA228

signals:
  - { name: SCL,   type: input,  scope: "I2C" }
  - { name: SDA,   type: bidir,  scope: "I2C" }
  - { name: A0,    type: input,  scope: "I2C address strap; tie to GND, VS, SDA or SCL" }
  - { name: A1,    type: input,  scope: "I2C address strap; tie to GND, VS, SDA or SCL" }
  - { name: ALERT, type: output, scope: "multifunction alert, open-drain" }
  - { name: VS,    type: power }
  - { name: GND,   type: ground }
  - { name: VBUS,  type: analog, scope: "bus-voltage sense input" }
  - { name: IN+,   type: analog, scope: "current-sense positive input" }
  - { name: IN-,   type: analog, scope: "current-sense negative input" }

physical:
  # pins per TI INA228 datasheet SLYS021A (May 2022), Section 5 "Pin
  # Configuration and Functions", Table 5-1, DGS (VSSOP-10) -- matches
  # mpn_population INA228AIDGS.
  refdes_prefix: U
  package:       VSSOP-10
  footprint:     vssop_10_3x3mm
  visibility:    public
  provenance:    web_provisional
  pins:
    - { pad: "1",  signal: "A1" }
    - { pad: "2",  signal: "A0" }
    - { pad: "3",  signal: "ALERT" }
    - { pad: "4",  signal: "SDA" }
    - { pad: "5",  signal: "SCL" }
    - { pad: "6",  signal: "VS" }
    - { pad: "7",  signal: "GND" }
    - { pad: "8",  signal: "VBUS" }
    - { pad: "9",  signal: "IN-" }
    - { pad: "10", signal: "IN+" }
  passives:
    - { role: decouple, value: 100nF, net: VS,  refdes_prefix: C }
    - { role: pullup,   value: 4k7,   net: SCL, refdes_prefix: R }
    - { role: pullup,   value: 4k7,   net: SDA, refdes_prefix: R }

families:
  - v2n
  - v2n-m1

verification:
  hil_silicon:    untested
  smoke_tests:    fake_i2c_register_protocol   # tests/zephyr/chips/src/test_ina228.c (fake i2c-emul target)
tracking:
  issue: 2645
