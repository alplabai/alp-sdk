# zcbor -- low-footprint CBOR codec (ADR 0018 library manifest).
#
# The CBOR half of the serialization story (pairs with nanopb); used by
# LwM2M/CoAP and SUIT/OTA metadata paths, and (issue #1254) by
# src/common/alp_model.c's .alpmodel manifest reader on every OS.
#
# Grounding (pinned Zephyr v4.4.0 workspace):
#   * west module `zcbor`, path modules/lib/zcbor,
#     west.yml revision 9164bd18dcd88ff9d9ef98279501fc1093571017
#   * enable symbol CONFIG_ZCBOR
#     ($ZEPHYR_BASE/modules/zcbor/Kconfig: `config ZCBOR`)
#   * upstream version 0.9.1  (modules/lib/zcbor/zcbor/VERSION -> "0.9.1";
#     `git describe --tags` -> 0.9.1-2-g9164bd1)
#   * licence Apache-2.0  (modules/lib/zcbor/LICENSE -- Apache License 2.0)
#
# yocto grounding (issue #1254): meta-alp-sdk/recipes-devtools/zcbor/
# zcbor_0.9.1.bb builds the SAME upstream commit as a shared library for
# the A55/Linux side -- confirmed against a real bitbake build (do_fetch
# through do_package_qa all green) rather than assumed.  src/common/
# alp_model.c (the .alpmodel CBOR-manifest reader behind <alp/model.h>)
# is now compiled unconditionally in src/yocto/CMakeLists.txt in place of
# the former ALP_ERR_NOSUPPORT stub (src/common/stub/stub_model.c),
# gated on the SAME zcbor find_path/find_library the recipe satisfies --
# there is no separate Kconfig-style symbol on this OS the way
# CONFIG_ZCBOR gates the Zephyr side; the library is a hard build
# dependency instead (DEPENDS += "zcbor" in meta-alp-sdk/recipes-core/
# alp-sdk/alp-sdk_0.6.bb), because Yocto carries no NOSUPPORT fallback
# to degrade to once the stub was dropped.
#
# No `requires:` -- pure-C, no capability/core/RAM floor of note.
schema_version: 1
name: zcbor
description: "zcbor -- low-footprint CBOR (RFC 8949) encoder/decoder + code generator."
tier: A
version: "0.9.1"
license: Apache-2.0

integration:
  zephyr:
    module: zcbor
    kconfig:
      - CONFIG_ZCBOR=y
  yocto:
    # No image_install entry (unlike ros2.yaml's rclcpp, which
    # alp-image-common.inc lists in IMAGE_INSTALL by hand): zcbor is a
    # BUILD-time dependency of the alp-sdk recipe (DEPENDS += "zcbor"
    # in meta-alp-sdk/recipes-core/alp-sdk/alp-sdk_0.6.bb), dynamically
    # linked into libalp_sdk.so; its runtime libzcbor.so.0 package lands
    # on the image automatically via OE's own shlibs RDEPENDS scan of
    # that link, same as libc/libgcc_s -- no manual IMAGE_INSTALL pick
    # (see that recipe's own comment for the identical libc/libgcc_s
    # reasoning).
    recipe_include: "meta-alp-sdk/recipes-devtools/zcbor/zcbor_0.9.1.bb"
