# AWS IoT Device SDK for Embedded C (ADR 0018 library manifest).
#
# Part of the ADR 0018 cloud / connectivity Tier-B group: the AWS-managed MQTT /
# device-shadow / jobs client stack for constrained devices.  Upstream is the
# AWS IoT Device SDK for Embedded C (github.com/aws/aws-iot-device-sdk-embedded-C),
# an umbrella of the coreMQTT / coreHTTP / device-shadow / jobs libraries.
#
# West pin + Kconfig grounding (verified 2026-07-05):
#   AWS IoT embedded-C is NOT in the pinned Zephyr v4.4.0 workspace.  Verified:
#   `west list` shows only cmsis / cmsis-dsp / cmsis_6 / lvgl / mbedtls /
#   nanopb-not-listed / open-amp / zcbor (+ hals + mcuboot); there is no
#   aws / iot entry, and `ls $ZEPHYR_BASE/../modules/lib` has none.  The
#   manifest therefore carries its own west project pin:
#     https://github.com/aws/aws-iot-device-sdk-embedded-C.git @ 202412.00
#     (annotated tag object 6d82c0be02db96c3df6da9e1295bb9e33dc006da; peeled
#      commit da99638ec373c791a45557b0cd91fc20968d492d).
#   202412.00 is the current LTS release.  Its coreMQTT / coreHTTP / coreJSON /
#   corePKCS11 / backoffAlgorithm / device-shadow / jobs / device-defender /
#   fleet-provisioning / SigV4 libraries are git SUBMODULES (.gitmodules).  The
#   repo's west.yml project sets `submodules: true`, so `west update
#   --group-filter +extras-cloud` initialises them.  The `west:` block below
#   cannot carry that key, so a project entry emitted by `--emit west-libraries`
#   must add `submodules: true` by hand.  One umbrella pin (not per-library
#   west projects) keeps the pin identical to what AWS tests together.
#   The AWS SDK is a generic CMake C SDK with NO official upstream Zephyr
#   module.yml or Kconfig symbol; the Zephyr build glue is in-tree
#   (vendors/aws-iot/).
#
# Enablement: `CONFIG_ALP_AWS_IOT=y` (zephyr/Kconfig.alp-libraries, `depends on
# ALP_SDK`).  The upstream SDK has no zephyr/module.yml or Kconfig of its own,
# so the symbol is alp-sdk's own gate over in-tree build glue under
# vendors/aws-iot/ that compiles the west-pinned checkout; see that README.
# Needs `west update --group-filter +extras-cloud`.
#
# Version:  `202412.00` -- exact upstream LTS release tag from
#   github.com/aws/aws-iot-device-sdk-embedded-C.
# License:  MIT -- verified from the LICENSE blob at tag 202412.00 ("MIT License",
#   Copyright Amazon.com, Inc.); not an in-tree file (SDK is not in this checkout).
#
# TLS note: coreMQTT has no network transport.  `CONFIG_ALP_CLOUD_TRANSPORT=y`
# builds <alp/cloud_transport.h> and, in vendors/aws-iot/, a
# `TransportInterface_t` over it (Zephyr TLS sockets and mbedtls, #2581).  A connection to a live AWS IoT Core endpoint is
# still bench-gated.
schema_version: 1
name: aws-iot
description: "AWS IoT Device SDK for Embedded C -- MQTT / device-shadow / jobs client (202412.00 LTS umbrella)."
tier: B
version: "202412.00"
license: MIT

requires:
  # Only the Zephyr integration path is expressible today (see header), so
  # `os: [zephyr]` rejects a selection whose live cores run no Zephyr with the
  # constraint named.  No core_class: the SDK is arch-neutral generic C, not a
  # Cortex-M-only library, so pinning a class would over-claim.
  os: [zephyr]

integration:
  zephyr:
    # Alp-owned enable symbol over in-tree glue (vendors/aws-iot/); the real
    # upstream repo is named by `module:` + the exact west pin below.
    kconfig:
      - CONFIG_ALP_AWS_IOT=y
    module: aws-iot-device-sdk-embedded-C
    west:
      name: aws-iot-device-sdk-embedded-C
      url: https://github.com/aws/aws-iot-device-sdk-embedded-C.git
      revision: "202412.00"
      path: modules/lib/aws-iot-device-sdk-embedded-C
