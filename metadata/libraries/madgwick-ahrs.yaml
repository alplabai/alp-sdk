# madgwick-ahrs -- Madgwick/x-io AHRS sensor-fusion filter (ADR 0018 library
# manifest; WS6-c Phase-1 canonical manifest for the legacy per-core token
# `madgwick_ahrs`).
#
# Grounding (this checkout):
#   * scripts/alp_orchestrate/libraries.py:321-359 (zephyr_kconfig_lines) --
#     the per-library Kconfig mechanism is the manifest's own
#     `integration.zephyr.kconfig` array below, spliced verbatim into a
#     Zephyr slice's alp.conf.  (A prior version of this header cited
#     scripts/alp_project_emit/__init__.py:247 / `_LIBRARY_KCONFIG`; that
#     symbol is gone, but the alp_project_emit package itself does still
#     exist -- corrected here.)
#   * west.yml:464-474 -- west module `madgwick_ahrs`, remote
#     xio-technologies, repo-path Fusion ("the maintained successor lib --
#     Madgwick reference + Fusion are bundled"), path
#     modules/lib/madgwick_ahrs, group `extras-tier1` (disabled by
#     default). revision: v1.3.2 (SHA
#     015d68494274b479b5996bff2530ecbcfdc266f2, 2026-07-20) -- pinned to a
#     tagged release now that the maintainer audit is done; no longer a
#     floating branch pin.
#   * licence: MIT, verified from source -- LICENSE.md at ref v1.3.2 begins
#     "The MIT License (MIT)".  The prior best-effort citation (upstream's
#     published licence, not independently re-verified from a LICENSE
#     file) is superseded.
#
# HW-backends: this manifest's own `integration.zephyr.hw_backends:`
# block below carries per-accelerator priority binding (FPU SIMD floor
# is universal -- every target carries an FPU -- plus an optional TMU
# CORDIC fast path); folded in from the retired standalone
# metadata/library-profiles/madgwick_ahrs/hw-backends.yaml in WS6-c
# Phase 3.
#
# No `requires:` -- CONFIG_ALP_MADGWICK_LIBM=y (libm trig) is the
# always-available floor; the FPU SIMD backend is universal across every
# target this SDK supports (no capability key to name), and the CORDIC
# fast path is opportunistic per-SoM (see `hw_backends:` above).
#
# `tier: B` for this Phase-1 pass: madgwick_ahrs is NOT listed in
# metadata/registries/tier-a-library-ci.json's hostBuild.libraries or
# excludedLibraries, even though it already has real teaching examples
# (examples/display/drone-hud, examples/peripheral-io/drone-autopilot).
# Promotion to Tier A is a named follow-up (add the CI-contract entry).
#
# RESOLVED: west.yml previously pinned this project to the floating branch
# `main` ("TBD: pin SHA after maintainer audit"), violating ADR 0017's
# "pin, don't float" rule. Now pinned to the v1.3.2 tagged release
# (015d68494274b479b5996bff2530ecbcfdc266f2, 2026-07-20); `version:` below
# is a reproducible upstream revision.
schema_version: 1
name: madgwick-ahrs
description: "Madgwick/x-io AHRS -- gyroscope + accelerometer (+ magnetometer) sensor-fusion orientation filter."
tier: B
version: "v1.3.2"
license: MIT

integration:
  zephyr:
    module: madgwick_ahrs
    kconfig:
      - CONFIG_ALP_SDK_AHRS=y
      - CONFIG_ALP_MADGWICK_LIBM=y
    hw_backends:
      class: sensor fusion
      upstream_source: "xioTechnologies"
      accelerators:
        - class: simd
          priority:
            - { backend: fpu, kconfig: CONFIG_ALP_MADGWICK_FPU=y }
        - class: cordic
          priority:
            - { requires_cap: tmu_cordic, backend: tmu_cordic, kconfig: CONFIG_ALP_MADGWICK_TMU=y }
      sw_fallback:
        required: true
        kconfig: CONFIG_ALP_MADGWICK_LIBM=y

      verification:
        hil_silicon: untested        # paper-correct only until v1.0 verification sweep.
        smoke_tests: build_only
