# Stock preset for E1M-AEN801 (the SoM, NOT the EVK board).
#
# Customer board.yaml files reference this preset by setting:
#   som:
#     sku: E1M-AEN801
#
# This file lists ONLY components physically populated on the
# E1M-AEN module PCB. Board-side parts live in metadata/boards/<name>.yaml.
#
# Per the project memory note, any SKU-specific hardware value not
# supplied authoritatively stays TBD rather than being inferred.

schema_version: 1

sku: E1M-AEN801
family: alif-ensemble
silicon: alif:ensemble:e8
silicon_variant: AE822FA0E5597LS0        # see metadata/socs/alif/ensemble/e8.json variants[]

display_name: "E1M-AEN801 (Alif Ensemble E8 -- 2x A32 + 2x M55 + 3x Ethos-U, preliminary)"

on_module:
  # POR_N / ER004: the module carries NO reset or brownout supervisor.  The
  # E1M-AEN-2626-R2 netlist routes the SoC POR_N only to a pull-up and to the
  # E1M edge connector, so satisfying the supervisor requirement is the
  # CARRIER's job, not the module's.
  #
  # This is a hardware-damage requirement, not a robustness nicety.  Errata
  # AERR0012 v2.0 ER004 applies to every E4/E6/E8 revision with no fix
  # planned: "the voltage on the VDD_MAIN and VDD_BUCK pins must never drop
  # below 1.65V once 1.65V is reached.  If this cannot be guaranteed, an
  # external reset supervisor device must be used to drive (active low) the
  # Ensemble system reset pin, POR_N" -- and, if it is not, "there is
  # potential to damage the Ensemble SoC rendering it non-functional".
  # Datasheet ADTS0013 v1.2 5.2.1 has since made it normative: "An external
  # brownout supervisor must be connected to VDD_MAIN/VDD_BUCK.  The brownout
  # supervisor must assert before voltage input to the chip falls below
  # 1.65V."  (#1810)
  silicon:              alif:ensemble:e8       # 2x A32, 2x Cortex-M55, 2x U55 + 1x U85
  wifi_ble:             cc3501e
  secure_element:       optiga_trust_m
  rtc_external:         rv3028c7
  temperature_sensor:   tmp112
  eeprom:               eeprom_24c128
  # Single RMII PHY (metadata/socs/alif/ensemble/e8.json "ethernet": 1);
  # families with a single PHY omit ethernet_phy_count: (schema). Real
  # hardware: examples/aen/aen-ethernet-link RESULT PASS on E8 silicon
  # (link up, DHCP lease). Exact order-code suffix is data-gated on the
  # netlist/BOM -- see metadata/chips/dp83825.yaml and #1241 "Blocked on".
  ethernet_phy:         dp83825
  ospi_memories:
    ospi0:
      chip:           MX25UM25645GXDI00   # Macronix OctaFlash (xSPI NOR)
      assembled:      optional            # BOM variant
      capacity_mbit:  256                 # 256 Mbit (32 MiB)
      chip_select:    0                   # OSPI0 CS0
      role:           app_storage
    ospi1:
      chip:           TBD            # OSPI1 controller unused on this SoM: both OSPI devices
      assembled:      optional       # share the OSPI0 octal bus (NOR = CS0, HyperRAM = CS1)
      capacity_mbit:  TBD
      role:           data_log
  # External HyperRAM -- volatile XIP / scratch RAM, separate from the
  # NOR flash above.  Shares the OSPI0 octal controller with the flash,
  # separated only by chip-select (NOR flash = CS0, HyperRAM = CS1).
  hyperram:
    chip:           W958D8NBYA5I    # Winbond OctalRAM (HyperBus)
    capacity_mbit:  256             # 256 Mbit (32 MiB)
    interface:      ospi0
    chip_select:    1

  i2c_devices:
    # Tier-3 housekeeping bus, NOT reachable from the application core --
    # `bus_master` is omitted per the schema's `i2c_bus.bus_master`
    # description because what drives it is not documented.
    #
    # This comment used to say the bus was LPI2C0 and that "the SoC can only be
    # a slave on it (hardcoded address 0x40), so the Secure Enclave masters it".
    # Wrong on the premise (#1848): the R2 netlist puts BRD_I2C_SCL on P7_1 and
    # BRD_I2C_SDA on P7_0, while the datasheet's LPI2C0 pads are P7_4/P7_5 --
    # which carry different nets on this module.  P7_0/P7_1 have no documented
    # I2C alternate function at all, and the pinned hal_alif SE services expose
    # no I2C service to route through.  The conclusion (the M55 cannot reach
    # this trio) still holds; the reason is an open question with Alif.
    brd_i2c:
      devices:
        - { chip: rv3028c7,         role: rtc,             address_7bit: "0x52" }
        - { chip: optiga_trust_m,   role: secure_element,  address_7bit: "0x30" }
        - { chip: tmp112,           role: temp_sensor,     address_7bit: "0x48" }
    # SoC I2C2, bridge/DNP-selected onto the E1M portable I2C0 pads -- the
    # SoM-manifest EEPROM only, a SEPARATE bus from the trio above (see
    # docs/bring-up-aen.md §5.1: "Two separate buses -- don't assume a
    # single shared bus.").
    e1m_i2c0:
      bus_master: alif-ensemble
      devices:
        - { chip: eeprom_24c128,    role: eeprom,          address_7bit: "0x50" }

# Off-SoC module memory in the canonical cross-family shape (see
# som-preset-v1.schema.json `memory:`).  Values are DERIVED from the
# on_module facts above, never invented:
#   dram_mbit  <- on_module.hyperram.capacity_mbit (populated on every
#                 AEN BOM variant).
#   flash_mbit <- TBD: the OSPI0 NOR (256 Mbit) is `assembled: optional`
#                 (per-BOM variant), so a single number would be wrong
#                 for the DNI variant.
memory:
  dram_mbit:            256
  flash_mbit:           TBD

inference:
  preferred_backend:    ethos_u                # E8 ships Ethos-U85 alongside two U55s.
  ethos_u_variant:      u85                    # primary.

capabilities:
  optiga_trust_m:       true

topology:
  a32_cluster:
    app: alp-image-edge
    machine: e1m-aen801-a32             # Yocto MACHINE
    toolchain: poky-glibc
  m55_hp:
    app: alp-stock-shim
    # Qualified Zephyr board target: the Ensemble E8 die is multi-cluster
    # (RTSS-HE + RTSS-HP), so `west build -b` needs the <soc>/<cpucluster>
    # qualifiers -- the bare name is ambiguous and fails to resolve under
    # Zephyr 4.4 (#720).  Must match the generated board tree's twister
    # identifier (zephyr/boards/alp/e1m_aen801_m55_hp/...).
    board: alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
    toolchain: arm-zephyr-eabi
    zephyr_full_name: "E1M-AEN801 (Alif Ensemble E8) Cortex-M55 HP carrier"
  m55_he:
    app: alp-stock-shim
    board: alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    toolchain: arm-zephyr-eabi
    zephyr_full_name: "E1M-AEN801 (Alif Ensemble E8) Cortex-M55 HE carrier"

# Memory layout (SRAM banks + MRAM) is normally derived from the SoC
# variant resolved via `silicon_variant:` -- see
# metadata/socs/<vendor>/<family>/<part>.json `variants[].sram_banks_kb`
# + `mram_mb`. E1M-AEN801 is the one SKU (of 11) that overrides it: both
# M55 cores boot from the SAME physical App MRAM, and a stock symmetric
# two-slot partition map puts HE and HP slot0 at the SAME address
# (0x80010000) -- flashing both cores then silently overwrites one image
# (#1069, bench-confirmed on e1m-aen-evk-01).  This is SDK build policy,
# not a silicon fact (see scripts/gen_zephyr_board.py's memory_map: vs
# metadata/socs/ split), so the fix lives here rather than in the SoC JSON.
#
# DECIDED layout (maintainer, #1069): disjoint per-core slot0 windows,
# OTA DEFERRED on both cores (CONFIG_SINGLE_APPLICATION_SLOT=y, no
# secondary/scratch slot).  Keeping swap-OTA on both cores would force
# slot0_HP + slot0_HE = 2688 KiB each, which breaks the ~2.6 MiB NPU
# MRAM-model budget on at least one core; zephyr/sysbuild/aen/README.md
# records CONFIG_SINGLE_APPLICATION_SLOT=y as the only silicon-proven
# MCUboot chain on this part, so nothing proven is lost by dropping the
# untested swap path.  HE keeps the low window (unchanged address)
# because everything else canonical is HE: the runner's default core,
# the factory MCUboot ATOC (cpu_id M55_HE), the canonical person_detect
# slot0, and the MRAM-XIP NPU example overlays -- Alif's own DevKit-e8
# dual-core example (`M55_HP_HE_mram_cfg.json`) also orders HE low.
#
#   region     offset      size      absolute      accessible_from
#   mcuboot    0x000000    64 KiB    0x80000000    m55_he, m55_hp
#   he_slot0   0x010000    2688 KiB  0x80010000    m55_he   (unchanged)
#   hp_slot0   0x2b0000    2688 KiB  0x802b0000    m55_hp   (was slot1/OTA)
#   reserved   0x550000    64 KiB    0x80550000    m55_he, m55_hp  (ex-scratch)
#   storage    0x560000    96 KiB    0x80560000    m55_he, m55_hp
#   atoc       0x578000    32 KiB    0x80578000    m55_he, m55_hp  (SE-owned)
#   64 + 2688 + 2688 + 64 + 96 + 32 = 5632 KiB == the full 5.5 MiB App MRAM.
#
# `atoc` is the SE-owned band at the very top of the App MRAM window
# (#1289).  Alif's SETOOLS (`app-gen-toc` / `app-write-mram`) top-anchors
# the generated ATOC application package at 0x80580000 and grows it
# DOWNWARD, sized to the package -- placement happens at provisioning
# time, not link time, so there is no fixed address to carve around, only
# a band to reserve.  It was carved out of `storage` (128 -> 96 + 32)
# rather than out of a slot, so every other region above is byte-identical
# to the #1069 layout and no image geometry moved.
#
# Sizing evidence (all against window top 0x80580000):
#   5552 B   bench-observed 2026-08-08 -- ATOC magic `ckBS` (0x53426B63)
#            read at 0x8057EA50, intact, while an app erased 0x80560000
#            inside what was then the SAME `storage` partition
#   13552 B  E7 SETOOLS transcript, Alif DFP docs/Overview.md:193-224
#   23696 B  worst case from SETOOLS' build/app-package-map.txt sizing
#            rule at the 8-image maximum (that rule reproduces the 5552 B
#            above exactly)
# 32 KiB leaves 9072 B spare at 8 images.  UNVERIFIED: no documented
# maximum TOC entry count was found, so 8 images is an assumption -- widen
# the band, never narrow it, if a larger configuration appears.
#
# `mcuboot`/`he_slot0`/`hp_slot0` are marked `cacheable: true` (real XIP
# code, matches the auto-derived `mram_main` region's default); `reserved`/
# `storage`/`atoc` are left non-cacheable (NVS/settings-style access at the
# register level -- `atoc` is boot-table, not settings, despite sharing the
# access mode).
#
# All six fine-grained regions are MRAM (behind `alif,mram-flash-controller`
# -- 16-byte program granularity, finite write endurance), not RAM, even
# though `mcuboot`/`reserved`/`storage`/`atoc` publish a real `base` (needed so
# scripts/gen_zephyr_board.py's `_aen_flash_partitions()` can lay out the
# DTS partition table).  A real `base` alone would make them look like
# legitimate IPC carve-out candidates to scripts/alp_orchestrate/carveout.py
# resolve_carve_outs() -- an `ipc: raw_shmem`/`rpmsg` entry ranks a
# cacheable-mismatch region behind a matching one, so a non-cacheable
# carve-out (e.g. examples/multicore/mproc-mailbox/board.yaml) would prefer
# the smaller `reserved` region over `storage`/`mcuboot` and silently place
# a shared-memory ring inside non-volatile flash.  Note the allocator
# allocates TOP-DOWN within a region (carveout.py step 4) -- the same
# direction the ATOC grows -- so for `atoc` the flag is belt-and-braces
# only; what actually makes that band safe is being a declared, named,
# non-storage region (#1289).  `carveout: false` marks
# all six as ineligible for that allocator (schema field, see
# metadata/schemas/som-preset-v1.schema.json `memory_region.carveout`)
# while leaving their `base` available for the DTS/partition-table use above.
#
# `mram_main` is kept alongside the six fine-grained regions above,
# `base: TBD` and unchanged from the auto-derived shape it replaces
# (whole-MRAM, all three cores, cacheable) -- this is the coarse
# generic-storage-carve-out device name (`board.yaml storage[].flash_device:
# mram_main`, e.g. examples/connectivity/production-deployment/board.yaml)
# that predates this fine-grained MCUboot map and isn't part of the
# sysbuild/aen boot chain.  Since `resolve_storage_partitions()` only reads
# `size_kib` (never `base`) it keeps resolving; `base: TBD` deliberately
# keeps it BLOCKED for `ipc:` carve-out allocation (which does read `base`)
# too, belt-and-suspenders alongside `carveout: false` above.  Bottom line:
# every `ipc:` entry on this SoM stays `status: blocked` until a real SRAM
# region with a real `base` exists in this table.
memory_map:
  - { name: mcuboot,   base: 0x80000000, size_kib: 64,   accessible_from: [m55_he, m55_hp], cacheable: true, carveout: false }
  - { name: he_slot0,  base: 0x80010000, size_kib: 2688, accessible_from: [m55_he],          cacheable: true, carveout: false }
  - { name: hp_slot0,  base: 0x802b0000, size_kib: 2688, accessible_from: [m55_hp],          cacheable: true, carveout: false }
  - { name: reserved,  base: 0x80550000, size_kib: 64,   accessible_from: [m55_he, m55_hp],                  carveout: false }
  - { name: storage,   base: 0x80560000, size_kib: 96,   accessible_from: [m55_he, m55_hp],                  carveout: false }
  - { name: atoc,      base: 0x80578000, size_kib: 32,   accessible_from: [m55_he, m55_hp],                  carveout: false }
  - { name: mram_main, base: "TBD",      size_kib: 5632, accessible_from: [a32_cluster, m55_he, m55_hp], cacheable: true }

# Inter-core mailbox IP: ARM MHUv2.  Confirmed via the alifsemi/zephyr_alif
# fork DTS (dts/arm/alif/ensemble/common/e1.dtsi plus ensemble_rtss_{hp,he}.dtsi),
# corroborated by the Alif Linux BSP (meta-alif-ensemble + linux_alif:
# apss-mhu -> mhuv2.cfg).  The earlier `alif_mhu` candidate /
# MHUv2-vs-mhuv3 uncertainty is RESOLVED: it is MHUv2.
#
# `controller: alif_mhuv2` is the node/driver-family token (matches alp-sdk's
# distinct `alif,mhuv2-mbox` compatible).  The E1M-AEN801 bench validated the
# MHUv2 MBOX driver with a dual-M55 OpenAMP RPMsg ping/pong on 2026-06-19
# (#225); endpoint-specific overlays still choose the appropriate MHU pair
# (A32<->M55 or M55-HP<->M55-HE).
mailbox:
  controller: alif_mhuv2                    # ARM MHUv2 (compatible alif,mhuv2-mbox)
  channels:
    - { id: 0, reserved_for: alp_default_rpmsg }
    - { id: 1, reserved_for: app }
    - { id: 2, reserved_for: app }
    - { id: 3, reserved_for: power_mgmt }

# E1M pads / instances that route through the on-module CC3501E
# coprocessor instead of through the Alif Ensemble silicon.  Apps
# using these pads via `alp_gpio_open()` / `alp_spi_open()` etc.
# get CC3501E command dispatch automatically; the board-side
# role (e.g. EVK_PIN_BMI323_INT1) stays SoM-agnostic.
#
# Source of truth:
#   - metadata/e1m_modules/aen/from-cc3501e.tsv
#   - AEN family hardware design (CC3501E-owned GPIO pads)
pad_routes:
  # SPI1 inter-chip bus -- CC3501E hosts the SPI peripheral.
  - { e1m: E1M_SPI1,      dispatch: cc3501e,
      doc: "Inter-chip SPI1 fast path; CC3501E acts as SPI peripheral." }

  # GPIO pads that physically terminate on CC3501E (not on Alif silicon).
  - { e1m: E1M_GPIO_IO8,  dispatch: cc3501e, dispatch_pin: 30,
      doc: "CC3501E GPIO_30 (board 2626-R2; GPIO30 moved here from IO21)." }
  - { e1m: E1M_GPIO_IO9,  dispatch: cc3501e, dispatch_pin: 12,
      doc: "CC3501E GPIO_12." }
  - { e1m: E1M_GPIO_IO10, dispatch: cc3501e, dispatch_pin: 35,
      doc: "CC3501E GPIO_35 (board 2626-R2)." }
  - { e1m: E1M_GPIO_IO11, dispatch: cc3501e, dispatch_pin: 2,
      doc: "CC3501E GPIO_2." }
  - { e1m: E1M_GPIO_IO13, dispatch: cc3501e, dispatch_pin: 13,
      doc: "CC3501E GPIO_13." }
  - { e1m: E1M_GPIO_IO15, dispatch: cc3501e, dispatch_pin: 14,
      doc: "CC3501E GPIO_14." }
  - { e1m: E1M_GPIO_IO16, dispatch: cc3501e, dispatch_pin: 17,
      doc: "CC3501E GPIO_17 (bridge READY/host-IRQ on current firmware)." }
  - { e1m: E1M_GPIO_IO17, dispatch: cc3501e, dispatch_pin: 16,
      doc: "CC3501E GPIO_16 (bridge SPI0 CS on current firmware)." }
  - { e1m: E1M_GPIO_IO18, dispatch: cc3501e, dispatch_pin: 18,
      doc: "CC3501E GPIO_18." }
  - { e1m: E1M_GPIO_IO19, dispatch: cc3501e, dispatch_pin: 19,
      doc: "CC3501E GPIO_19." }
  - { e1m: E1M_GPIO_IO20, dispatch: cc3501e, dispatch_pin: 26,
      doc: "CC3501E GPIO_26." }
  - { e1m: E1M_GPIO_IO21, dispatch: unrouted,
      doc: "Physically open on board 2626-R2 (no CC3501E or Alif termination); r1 routed it to CC3501E GPIO_30 -- see aen/hw-revisions.yaml pad_route_overrides (#1854)." }

# On-module helper MCUs.  CC3501E (TI Wi-Fi 6 + BLE 5.4) is wired
# on the AEN module; firmware is embedded in alp-sdk at
# `firmware/cc3501e/` (ADR 0015).
helper_firmware:
  - name:          cc3501e_otp
    chip:          cc3501e
    # firmware_path is deliberately OMITTED: the CC3501E firmware and its
    # signed artefacts moved to alplabai/cc3501e-bridge-firmware (ADR 0031),
    # so there is no repo-relative file to point at.  Obtain the image from
    # that repo's prebuilt/ directory, and verify it against the .sha256 and
    # .sig shipped beside it before flashing.  The schema and
    # scripts/check_helper_firmware_path.py both treat an absent key as
    # meaningful rather than missing -- a stale path that no longer resolves
    # would be worse, because it stays indistinguishable from a good one
    # until someone tries to flash it.
    # CC3501E firmware is Alp-released, applied over the bridge SPI
    # programming OTP.  Alp Lab programs it in production; a customer
    # flash is permitted only to recover a bricked device, using
    # Alp Lab-supplied binaries -- `flash_policy: recovery_only` states
    # that directly instead of leaving a tool to infer it from the
    # presence of an OTA channel -- the two are independent facts
    # (#1357).  `tan flash` DOES decline this entry: `flash_policy:
    # recovery_only` is checked ahead of any `flash_method` presence
    # (`python/tan/core/flash_plan.py::helper_flash_gate`, tan-cli#611) --
    # the same shape as `gd32_bridge` (see docs/gd32-bridge.md's "Who
    # flashes it, and when" section).
    flash_policy:   recovery_only
    update_channel: alp_ota_spi_otp

default_hw_rev:         r2                  # see metadata/e1m_modules/<family>/hw-revisions.yaml

default_board:        E1M-EVK

status:
  preliminary:          true                   # E8 datasheet v0.51 (preliminary)
  partial_hw_config:    true
