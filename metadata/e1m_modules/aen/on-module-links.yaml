# On-module (non-edge) SoC pad wiring for the E1M-AEN family (Alp Lab
# hand-authored source -- not vendor pinout data and not generated).
#
# WHY THIS FILE EXISTS.  metadata/pinmux/aen.yaml is a generated
# projection of from-alif.tsv + from-cc3501e.tsv, and both of those are
# E1M EDGE pad tables: they answer "which SoC pad backs E1M pin X".  The
# pads below back nothing on the edge connector -- they run between the
# Alif SoC and chips soldered on the module itself -- so they have no row
# there and never will.  This file is their authority, in the same role
# metadata/e1m_modules/v2n/supervisor-links.yaml plays for the RZ/V2N
# family's on-module GD32G553 supervisor links.
#
# It carries the pad <-> signal facts AND the DT-node-shape facts the
# pad tables do not model: dt_label, pinctrl group label, portable
# alp-i2cN alias, the on-bus device nodes (compatible + 7-bit address +
# binding properties), and the RTC alarm's GPIO controller/pin/IRQ.
#
# EXCEPTION: `e1m_i2c0` (SoC I2C2, below).  Unlike brd_i2c/rtc_alarm its
# pads (P5_6/P5_7) DO have a row in metadata/pinmux/aen.yaml -- I2C2
# also rides the E1M edge connector as ALP_E1M_I2C0/EVK_I2C_BUS_SENSORS,
# carrying the EVK carrier's sensor/IO-expander/INA236 parts.  It still
# belongs here because the SoM's own 24C128 manifest EEPROM (see
# metadata/e1m_modules/E1M-AEN801.yaml on_module.i2c_devices.e1m_i2c0)
# is bridge/DNP-selected onto this SAME physical bus, and the board
# layer -- not a per-app overlay -- is the right place to enable the
# controller + pinctrl for an on-module chip present on every board
# built from this SoM (docs/bring-up-aen.md §5.1: "Two separate buses").
#
# SECOND EXCEPTION: `backlight` (below).  A31/B31 DO have E1M edge-
# connector identity (metadata/e1m/pinout-v1.json silkscreen names
# BL_LED_A / BL_LED_K) but, unlike e1m_i2c0, deliberately carry NO row in
# metadata/pinmux/aen.yaml: neither pad is backed by any SoC silicon pad.
# Both are the on-module backlight driver's own LED output/feedback pins
# -- a boost-converter output well above logic level -- reaching the edge
# connector straight from the driver, bypassing the SoC entirely.  Only
# the driver's ENABLE input is a real SoC pad (P5_5), and it is
# SoM-internal like brd_i2c/rtc_alarm above: no edge route of its own.
# Previously A31 was wrongly listed as an Alif-owned pad at P5_5 in
# from-alif.tsv / pinmux/aen.yaml; corrected in alp-sdk#2203.
#
# scripts/gen_zephyr_board.py's `_aen_pinctrl_dtsi()` / `_aen_dts()`
# emitters read this file to produce the AEN `<board>-pinctrl.dtsi` and
# `<board>.dts`; every pad, macro, address and alias in those generated
# files comes from here.  Edit here, then regenerate (see
# docs/porting-new-som.md, "Regenerating a board").
#
# v2 (alp-sdk#2784) adds the `power_domains:` block at the end of this file:
# the SoM's quiesce-able power domains (Wi-Fi/BLE, Ethernet PHY, external
# flash/RAM, temperature sensor, RTC, backlight), their control pads, and the
# measured savings.  scripts/gen_zephyr_board.py projects it into the
# generated board dts as the `alp,som-power` node;
# scripts/check_som_power_domains.py pins every control pad to the pad TSVs
# beside this file (inter-chip.tsv, alif-ethernet-phy.tsv, alif-ospi.tsv).
#
# Every entry carries an `evidence:` string citing a NON-DERIVATIVE
# source -- the E1M-AEN-2626-R2 netlist, the AE822 DFP pin table, or a
# dated bench measurement -- never a generated file.
schemaVersion: on-module-links-v2
families:
  - aen

on_module_links:
  # BRD_I2C -- the on-module housekeeping bus.  SoC I2C0 in its function-C
  # muxing, NOT the slave-only LPI2C0 it was believed to be before #1848.
  brd_i2c:
    peripheral: "I2C0"
    dt_label: i2c0
    pinctrl_group_label: pinctrl_i2c0
    status: enabled
    # Portable bus index 2: 0 and 1 are the E1M EDGE buses (ALP_E1M_I2C0 /
    # ALP_E1M_I2C1).  BRD_I2C has no E1M route of its own, so it takes the
    # next free portable index rather than one an edge bus already claims
    # (#1848; docs/bring-up-aen.md).
    alias: alp-i2c2
    # 100 kHz standard mode.  This net has no external pull-up anywhere
    # (see the pins' evidence), so it relies on the pad's own internal
    # pull-up + push-pull drive; no fast-mode rise-time margin exists.
    clock_frequency_macro: I2C_BITRATE_STANDARD
    pins:
      - silicon_peripheral: "I2C0_SDA_C"
        silicon_pad: "P7_0"
        net: "BRD_I2C_SDA"
        evidence: >-
          E1M-AEN-2626-R2 netlist pinmap CSV row
          "BRD_I2C_SDA",U6,B8,"P7_0/SCP0_A"; AE822 DFP pin table
          (AE822FA0E5597LS0_M55_HE/RTE/BSP pins.h) gives P7_0 alt-fn [4] =
          I2C0_SDA_C.  Bench-proven 2026-09-05 on E1M-AEN801 2626-R2
          (Flow A, cold-cycle proven): every non-response is a clean
          rc=-5 (-EIO) NACK, zero -ETIMEDOUT, zero "User Abort".
      - silicon_peripheral: "I2C0_SCL_C"
        silicon_pad: "P7_1"
        net: "BRD_I2C_SCL"
        evidence: >-
          E1M-AEN-2626-R2 netlist pinmap CSV row
          "BRD_I2C_SCL",U6,B3,"P7_1/SCP1_A"; AE822 DFP pin table gives
          P7_1 alt-fn [4] = I2C0_SCL_C.  Alif's own DFP sets
          PADCTRL_READ_ENABLE on BOTH P7_0 and P7_1 -- with input-enable
          on SDA only the controller NACKs every address for a reason
          that looks electrical (cost one bench run, 2026-09-05).
    devices:
      # U21 -- Micro Crystal RV-3028-C7 32.768KHZ 1PPM-TA-QA.
      - chip: rv3028c7
        node_label: rv3028
        node_name: "rtc@52"
        compatible: "microcrystal,rv3028"
        address_7bit: 0x52
        alias: rtc
        int_gpio_link: rtc_alarm
        properties:
          # REQUIRED by dts/bindings/rtc/microcrystal,rv3028.yaml, and
          # "disabled" is the only correct value on this module: VBACKUP
          # (U21 pin 6) has NO supply fitted -- its only other net members
          # are R4 and R68, both 0-ohm DNP=1.  No backup cell means no
          # switchover to select and (see below) no trickle source.
          backup-switch-mode: "disabled"
        # trickle-resistor-ohms is deliberately ABSENT: charging into an
        # unpopulated VBACKUP would be wrong.
        # clkout-frequency is deliberately ABSENT: RTC_CLKOUT (U21 pin 1)
        # goes ONLY to the E1M edge connector (E1 pin AH16) and never
        # reaches the SoC, so firmware cannot consume it.  Omitting it
        # leaves the pin LOW; it is a CARRIER-facing choice.
        evidence: >-
          E1M-AEN-2626-R2 components CSV: U21 = RV-3028-C7, DNP=0 fitted.
          Bench 2026-09-05: ACKs at 0x52, ID register 0x28 reads 0x44, and
          the seconds register advanced 0x01 -> 0x02, so the oscillator is
          RUNNING.  CAVEAT for docs and examples: with no VBACKUP cell the
          RTC does NOT retain time or a pending alarm across a power cycle
          on this batch.
      # U20 -- TI TMP112DIDPWR, ADD0 tied to 0V.
      - chip: tmp112
        node_label: tmp112
        node_name: "tmp112@40"
        compatible: "ti,tmp112"
        address_7bit: 0x40
        # alp-prefixed to join the existing portable-alias namespace
        # (alp-i2c2 above, alp-lprtc-counter) -- <alp/temperature.h>'s
        # Zephyr backend resolves DT_ALIAS(alp_temp0) (alp-sdk#2066).
        alias: alp-temp0
        evidence: >-
          E1M-AEN-2626-R2 components CSV: U20 = TMP112DIDPWR, DNP=0 fitted,
          ADD0 tied to 0V.  Per TI SBOS473L p.44 (package option addendum),
          the exact orderable MPN TMP112DIDPWR is X2SON (DPW), 5 pins -- no
          SOT563-6 orderable carries that MPN (the SOT563-6 parts are
          TMP112AIDRLR / TMP112BIDRLR / TMP112NAIDRLR).  Per TI SBOS473L Table
          7-4, the X2SON-5 "Address Variant Only" TMP112D row straps ADD0->GND
          = 0x40 (->V+ = 0x41, ->SDA = 0x42, ->SCL = 0x43); the SOT563-6
          "Address + Alert Variant" row (ADD0->GND = 0x48) does not apply to
          this MPN.  So 0x40 is the DESIGN address for the part this board
          specifies, and the bench observation matches that design rather than
          being an anomaly to explain away: two bench units answered at 0x40
          instead of 0x48 (28.062 degC, 2026-09-05; 27.687 degC, 2026-09-07,
          serial 2026W36-0002), each confirming a three-of-three TMP112
          register fingerprint (CONFIG=0x60a0, T_LOW=0x4b00, T_HIGH=0x5000,
          the datasheet power-on defaults).  Design and silicon agree, so this
          entry and the devicetree node it emits now both carry 0x40; the
          earlier 0x48 was simply wrong, which is also why the stock
          CONFIG_TMP112 driver never bound -- the node put it at an address
          nothing answers.  Recorded under alp-sdk#1978.
      # IC1 (OPTIGA Trust M, SLS32AIA010MLUSON10XTMA2, @0x30) is DNP=1 --
      # NOT fitted on this batch, so it gets no node.  It must not ACK; its
      # silence is a negative control, not a fault.

  # e1m_i2c0 -- SoC I2C2 (function C), portable alp-i2c0 (E1M edge bus 0:
  # ALP_E1M_I2C0 / EVK_I2C_BUS_SENSORS / BOARD_I2C_SENSORS).  Carries the
  # SoM's own 24C128 manifest EEPROM (metadata/e1m_modules/E1M-AEN801.yaml
  # on_module.i2c_devices.e1m_i2c0) plus, on the same physical bus once it
  # leaves the module, the EVK carrier's sensor/IO-expander/INA236 parts --
  # see docs/bring-up-aen.md Sec 5.1.  No device child nodes here: every
  # part this board layer would otherwise declare is EVK-carrier silicon,
  # not SoM-resident, except the EEPROM, which the SDK addresses by 7-bit
  # address over the bus (no DT device node) the same way
  # examples/aen/aen-i2c2-eeprom-regcheck and examples/aen/aen-eeprom-manifest
  # already do.
  #
  # BEFORE this entry existed, `zephyr/dts/alif/ensemble_e8_peripherals.dtsi`
  # left i2c2 `status = "disabled"` with no board-layer pinctrl_i2c2, so
  # DT_ALIAS(alp_i2c0) resolved to nothing, src/backends/i2c/zephyr_drv.c's
  # `_devs[0]` stayed NULL, and alp_i2c_open(.bus_id = ALP_E1M_I2C0)
  # returned ALP_ERR_NOT_READY (-2) before touching any device --
  # bench-observed on `examples/peripheral-io/i2c-device-hub` (alp-sdk,
  # 2026-09-07): "[devhub] bus open failed: alp_last_error=-2".
  e1m_i2c0:
    peripheral: "I2C2"
    dt_label: i2c2
    pinctrl_group_label: pinctrl_i2c2
    status: enabled
    # Portable bus index 0: this is one of the two E1M EDGE buses
    # (ALP_E1M_I2C0), unlike BRD_I2C which has no edge route and takes
    # index 2 (see the brd_i2c entry's alias comment above).
    alias: alp-i2c0
    # 100 kHz standard mode, matching the bench-validated
    # aen-i2c2-eeprom-regcheck / aen-eeprom-manifest overlays.
    clock_frequency_macro: I2C_BITRATE_STANDARD
    # Pad config (input-enable + bias-pull-down) is bench-validated ONLY on
    # the part(s) keyed below -- same per-part-map pattern rtc_alarm.risk
    # uses (#1988).  Keyed by the SoC's own `part` designator ("E8", "E3",
    # ...), NOT by family: this file's `families: [aen]` scope covers every
    # AEN SKU, but a bench run against one part's silicon is not evidence
    # for another's.  Unlike rtc_alarm.risk, a part with no key here does
    # NOT get silence in the generated comment -- gen_zephyr_board.py's
    # `_aen_e1m_i2c0_pinctrl_group()` still cites the E8 run and states
    # explicitly that it was not repeated on that part, because the
    # emitted pad VALUE is unchanged and still correct for every part
    # (#2046).  Do not add an entry without an actual bench run against
    # that part's own silicon.
    bench_validation:
      E8: >-
        bench-validated 2026-06-15 on the E8, matching Alif's own
        reference I2C pinctrl -- see the identical, verbatim-copied group
        in examples/aen/aen-i2c2-eeprom-regcheck's board overlay and
        examples/aen/aen-eeprom-manifest's overlay, both of which cite
        the same date.
    pins:
      - silicon_peripheral: "I2C2_SDA_C"
        silicon_pad: "P5_7"
        evidence: >-
          metadata/e1m_modules/aen/from-alif.tsv row AD2 I2C0_SDA
          I2C2_SDA_C P5_7 (projected, byte-for-byte, into
          metadata/pinmux/aen.yaml's e1m_pad "AD2" row) gives the AE822
          DFP alt-function assignment P5_7 = I2C2_SDA_C.  NO
          E1M-AEN-2626-R2 netlist net name has been read for this ball
          yet (unlike BRD_I2C_SDA/SCL above) -- do not infer one; add it
          only from an actual netlist row.  Pad-config bench evidence is
          this entry's own `bench_validation:` map above, not here
          (#2046).
      - silicon_peripheral: "I2C2_SCL_C"
        silicon_pad: "P5_6"
        evidence: >-
          metadata/e1m_modules/aen/from-alif.tsv row AE2 I2C0_SCL
          I2C2_SCL_C P5_6 (projected, byte-for-byte, into
          metadata/pinmux/aen.yaml's e1m_pad "AE2" row) gives the AE822
          DFP alt-function assignment P5_6 = I2C2_SCL_C.  Same
          netlist-net-name caveat as I2C2_SDA_C above; same
          `bench_validation:` map for the pad-config bench evidence
          (#2046).

  # RV-3028 /INT (U21 pin 2) -> net RTC_ALARM -> SoC pad P15_0_FLEX.
  rtc_alarm:
    net: "RTC_ALARM"
    silicon_peripheral: "LPGPIO"
    silicon_pad: "P15_0"
    gpio_node: lpgpio
    gpio_pin: 0
    gpio_irq: 171
    active_low: true
    status: enabled
    evidence: >-
      E1M-AEN-2626-R2 netlist: U21 pin 2 (/INT) -> RTC_ALARM -> SoC pad U6
      V2 = P15_0_FLEX, with R98 = 100k to +1V8 FITTED as the open-drain
      pull-up; active LOW.  P15_0 is LPGPIO bit 0, so its interrupt is the
      first of the lpgpio controller's eight, IRQ 171 (gpio@42002000,
      interrupts = <171 3>, <172 3> ... in
      zephyr/dts/alif/ensemble_e8_peripherals.dtsi).  Pinctrl macro
      PIN_P15_0__LPGPIO = ALIF_PINMUX(15, 0, 0).
    # Keyed by the SoC's own `part` designator ("E8", "E3", ...), NOT by
    # family: this file's `families: [aen]` scope covers every AEN SKU, but
    # each part's DFP is a SEPARATE document, so a warning evidenced against
    # one part's DFP is not evidence for another's silicon.  A part with no
    # key here gets no risk paragraph emitted at all (#1988) -- an absent
    # DFP citation is not a hedge-worded restatement, it is silence.
    risk:
      E8: >-
        The AE822 DFP warns for port 15: "Note that LPGPIO_CTRL_n register
        has a different layout!".  That is the most likely bench failure on
        this alarm path and must NOT be mistaken for an RTC fault -- if the
        alarm never fires, suspect the port-15 control-register layout
        before suspecting U21.
    # MODULE_STBY (U21 pin 8, EVI) is a CARRIER-driven external event
    # input (E1M edge pin O2, R43 100k to +1V8) -- no SoC pad, so no link
    # here.

  # On-module backlight LED driver.  Not consumed by any board emitter
  # today -- bring-up is alp-sdk#2199 -- this entry exists purely to
  # record the fact so nothing re-derives A31/B31 as Alif-owned again
  # (alp-sdk#2203).
  backlight:
    # The driver's enable input: a real SoC pad, SoM-internal like
    # brd_i2c/rtc_alarm above (no E1M edge route of its own).
    enable:
      silicon_peripheral: "UT2_T1_B"
      silicon_pad: "P5_5"
      status: enabled
      evidence: >-
        Per the E1M-AEN-2626-R2 SoM netlist (internal): P5_5 is the
        on-module backlight driver's enable input.  It is SoM-internal --
        not routed to any E1M edge pad.  The only path from P5_5 toward
        the edge connector is an unpopulated (DNP) option, not a live
        connection, so it must never be projected into from-alif.tsv /
        metadata/pinmux/aen.yaml.
    # The driver's LED string: reaches the E1M edge connector on its OWN
    # two pins, direct from the driver, never through the SoC.  Carries a
    # boost-converter output far above logic level -- a carrier must
    # never wire a logic-level signal here.
    led_pins:
      - { e1m_pad: "A31", e1m_function: "BL_LED_A" }
      - { e1m_pad: "B31", e1m_function: "BL_LED_K" }
    evidence: >-
      Per the E1M-AEN-2626-R2 SoM netlist (internal): A31 (`BL_LED_A`)
      and B31 (`BL_LED_K`) are the on-module backlight driver's LED
      output/feedback pair, reaching the panel through the carrier's
      display connector.  Neither pad is backed by Alif (or any other)
      silicon, so neither belongs in from-alif.tsv / pinmux/aen.yaml, and
      neither is assignable as a general-purpose GPIO/PWM pad by any app.

# ---------------------------------------------------------------------------
# power_domains -- the SoM's quiesce-able domains (alp-sdk#2784).
#
# DATA ONLY at this layer: nothing in the SDK reads these controls at run time
# yet; the generator turns them into the `alp,som-power` devicetree node.
#
# `chip` is omitted where the part differs per SKU (ext_flash, ext_ram) or the
# SKU presets name none (backlight); the generator then reads the SKU's own
# `on_module` chip name.
#
# Per-domain shape (metadata/schemas/on-module-links-v2.schema.json):
#   presence       which SKU `on_module` key decides whether the domain exists.
#                  A string-valued key (wifi_ble, ethernet_phy, ...) is present
#                  when it names a real part; a block with `assembled:` (the
#                  OSPI0 NOR, the HyperRAM) follows that tri-state field --
#                  true = present, "optional" = present but BOM-variant (the
#                  generated node carries `alp,bom-optional`), false = omitted.
#   controls[]     the SoC pads that gate the domain.  `source` names the TSV
#                  row the pad comes from; check_som_power_domains.py re-reads
#                  that row and fails on any disagreement.  `holds_through_stop`
#                  is "unproven" for every LPGPIO (VBAT-domain, P15_n) pad --
#                  whether an LPGPIO output holds through STOP and through the
#                  Secure Enclave's wake boot is a bench question (#2784 U8) --
#                  and "no" for main-domain pads, which are powered down in STOP.
#                  `polarity_basis` says how the asserted level was decided:
#                  `bench_verified` (measured on hardware, see evidence),
#                  `net_name` (an n/N suffix in the netlist name), `datasheet`,
#                  or `assumed` (NOT yet confirmed -- bench-verify before relying).
#   actions{}      what the SDK may do; `default_action` is the AUTO choice for
#                  `default_modes`.  `opt_in` actions are never AUTO.  `measured`
#                  figures are dated and input-referred.
#   restore        the wake-side inverse of the default action.
#   dependents[]   other nets the domain's chip drives.
# ---------------------------------------------------------------------------
power_domains:
  # TI CC3501E Wi-Fi 6 + BLE 5.4 coprocessor.
  wifi_ble:
    chip: cc3501e
    presence: { on_module_key: wifi_ble }
    controls:
      - signal: E_WIFI_NRST
        net: "E_WIFI_NRST"
        silicon_pad: "P15_1"
        gpio_node: lpgpio
        gpio_pin: 1
        direction: out
        polarity: active_low
        polarity_basis: bench_verified
        role: reset
        holds_through_stop: unproven
        source: { file: inter-chip.tsv, signal: E_WIFI_NRST }
      - signal: WIFI_EN
        net: "WIFI_EN"
        silicon_pad: "P15_5"
        gpio_node: lpgpio
        gpio_pin: 5
        direction: out
        polarity: active_high
        polarity_basis: net_name
        role: rail_enable
        holds_through_stop: unproven
        source: { file: inter-chip.tsv, signal: WIFI_EN }
    default_modes: [stop, standby]
    default_action: hold_reset
    actions:
      hold_reset:
        control: E_WIFI_NRST
        opt_in: false
        measured:
          - { saving: "≈2 mA", input_voltage: "16 V", bench: "E1M-AEN803 on E1M-EVK", date: "2026-10-08",
              method: ram-run,
              note: "CC3501E nRESET held low; board-input PSU telemetry at 16.0 V, 1 mA resolution" }
      rail_off:
        control: WIFI_EN
        opt_in: true
        requires_kconfig: CONFIG_ALP_SDK_SOM_PD_WIFI_RAIL_OFF
        hazard: >-
          Cutting WIFI_EN removes the CC3501E supply.  On units whose
          CC3501E is activated (`vendor_sbl_container_enable=1`) the vendor
          bootloader may never relaunch after the rail returns, leaving the
          radio dead until it is re-flashed.  Opt-in only; validated on
          non-activated units first.  NOT measured.
    restore:
      method: nreset_release
      note: >-
        Release E_WIFI_NRST through `cc3501e_hard_reset()` (50 ms nRESET
        pulse, rails stay up).  NEVER `cc3501e_reset()`: it drops WIFI_EN for
        50 ms, i.e. a supply cold cycle -- the exact path that may never
        relaunch on a `vendor_sbl_container_enable=1` unit.
    dependents:
      # The CC3501E drives the carrier's camera LDO enables from its own
      # GPIO_0/GPIO_1, so quiescing it switches those camera rails.
      - { kind: cam_ldo, net: CAM_EN_LDO0, driver_pin: GPIO_0,
          source: { file: inter-chip.tsv, signal: CAM_EN_LDO0 } }
      - { kind: cam_ldo, net: CAM_EN_LDO1, driver_pin: GPIO_1,
          source: { file: inter-chip.tsv, signal: CAM_EN_LDO1 } }
      # The carrier SD-enable line the CC3501E also drives is NOT listed:
      # inter-chip.tsv carries no row for it and no netlist net name has been
      # read, so there is nothing to cite.  Add it from an actual netlist row.
    evidence: >-
      E_WIFI_NRST / WIFI_EN pads: inter-chip.tsv rows E_WIFI_NRST (P15_1_FLEX)
      and WIFI_EN (P15_5); roles per docs/cc3501e-bridge.md ("WIFI_EN gates
      VPA", "E_WIFI.NRST: Alif resets the CC3501E").  Savings: bench
      2026-10-08, E1M-AEN803 on an E1M-EVK (board-input PSU telemetry at 16.0 V,
      1 mA resolution, RAM-run).  E_WIFI_NRST is active-low, bench-verified the
      same run: held LOW the CC3501E PING returns -5, released it returns 0.
      Restore semantics:
      chips/cc3501e/cc3501e_core.c cc3501e_reset() vs cc3501e_hard_reset().

  # DP83825 RMII Ethernet PHY.  The three methods below are ALTERNATIVES, not
  # additive: each saves the same ≈10 mA.  An unpowered PHY reads stale MDIO
  # data, so power state is tracked in software, never inferred from MDIO.
  eth_phy:
    chip: dp83825
    presence: { on_module_key: ethernet_phy }
    controls:
      - signal: E_PHY_PWRDWN
        net: "E_PHY_PWRDWN"
        silicon_pad: "P15_4"
        gpio_node: lpgpio
        gpio_pin: 4
        direction: out
        polarity: active_low
        polarity_basis: bench_verified
        role: powerdown
        holds_through_stop: unproven
        source: { file: alif-ethernet-phy.tsv, signal: E_PHY_PWRDWN }
      - signal: E_PHY_RESET
        net: "E_PHY_RESET"
        silicon_pad: "P11_6"
        gpio_node: gpio11
        gpio_pin: 6
        direction: out
        polarity: active_low
        polarity_basis: bench_verified
        role: reset
        holds_through_stop: "no"
        source: { file: alif-ethernet-phy.tsv, signal: E_PHY_RESET }
    default_modes: [stop, standby]
    default_action: powerdown_pin
    actions:
      powerdown_pin:
        control: E_PHY_PWRDWN
        opt_in: false
        measured:
          - { saving: "≈10 mA", input_voltage: "16 V", bench: "E1M-AEN803 on E1M-EVK", date: "2026-10-08",
              method: ram-run }
      hold_reset:
        control: E_PHY_RESET
        opt_in: false
        measured:
          - { saving: "≈10 mA", input_voltage: "16 V", bench: "E1M-AEN803 on E1M-EVK", date: "2026-10-08",
              method: ram-run }
      bmcr_powerdown:
        opt_in: false
        note: >-
          BMCR bit 11 over MDIO.  Needs a live PHY and MDIO, so it cannot be
          held across STOP (P11_6 is main-domain and not held either); only
          P15_4 can hold.
        measured:
          - { saving: "≈10 mA", input_voltage: "16 V", bench: "E1M-AEN803 on E1M-EVK", date: "2026-10-08",
              method: ram-run }
    dependents:
      # Y3 (KC2016Z50.0000C15XXK, 50 MHz) is the PHY reference oscillator: OUT ->
      # R40 -> E_PHY_REFCLK (SoC P11_0 and the DP83825 XI / 50MHzIn).  Its TRI pin
      # is E_PHY_PWRDWN (P15_4), so driving P15_4 low also tri-states the clock
      # (E1M-AEN-2626-R2 netlist, 2026-10-08).
      - { kind: phy_refclk, net: E_PHY_REFCLK, driver_pin: "Y3 TRI (E_PHY_PWRDWN)",
          source: { file: alif-ethernet-phy.tsv, signal: E_PHY_PWRDWN } }
    restore:
      method: pin_release
      note: Release E_PHY_PWRDWN, then let the PHY re-negotiate the link.
    evidence: >-
      alif-ethernet-phy.tsv rows E_PHY_RESET (P11_6) and E_PHY_PWRDWN (P15_4);
      docs/aen-bench-bringup.md ("PHY power E_PHY_PWRDWN = P15_4 lpgpio, PHY
      reset E_PHY_RESET = P11_6 gpio11").  Polarity bench-verified 2026-10-08
      (E1M-AEN803 on an E1M-EVK, RAM-run, MDIO): E_PHY_PWRDWN HIGH powers the
      PHY (ID 2000a140 reads), LOW turns it off (ID gone, stale reads);
      E_PHY_RESET held LOW reads every MDIO register as 0xffff, release brings
      the ID back.  Savings: bench 2026-10-08,
      RAM-run, all three methods.

  # External NOR flash: the U10 footprint, chip-select OSPI0_SS1, reset/INT on
  # the nets named OSPI1_RESETn / OSPI1_INTn (a labelling quirk of U10's own
  # pins, not an OSPI1 device -- CHANGELOG "OSPI1_INTn/OSPI1_RESETn").
  ext_flash:
    presence: { on_module_key: ospi_memories.ospi0 }
    controls:
      - signal: OSPI1_RESETn
        net: "OSPI1_RESETn"
        silicon_pad: "P15_7"
        gpio_node: lpgpio
        gpio_pin: 7
        direction: out
        polarity: active_low
        polarity_basis: net_name
        role: reset
        holds_through_stop: unproven
        source: { file: alif-ospi.tsv, signal: OSPI1_RESETn }
    default_modes: [stop, standby]
    default_action: hold_reset
    actions:
      hold_reset:
        control: OSPI1_RESETn
        opt_in: false
        note: >-
          flash_ospi_alif (zephyr/drivers/flash/flash_ospi_alif.c) exposes no
          power-management or deep-power-down hook, so reset-hold is the
          action.  The reset returns the part to its power-on 1-1-1 framing and
          the driver is held out of service across the reset (flash_ospi_alif_suspend / flash_ospi_alif_resume): it takes the driver lock and waits for WIP to clear before RESETn is asserted, so a write or erase is never cut off.
    restore:
      method: driver_release
      note: Release OSPI1_RESETn, then the flash driver re-enters Octal DDR on its next write or erase.
    evidence: >-
      alif-ospi.tsv row OSPI1_RESETn (P15_7); net-to-part mapping per
      E1M-AEN-2626-R2 (U10 NOR) as recorded in CHANGELOG.md (the OSPI1_INTn/OSPI1_RESETn entry).

  # External HyperRAM: the U9 footprint, chip-select OSPI0_SS0.
  ext_ram:
    presence: { on_module_key: hyperram }
    controls:
      - signal: OSPI0_RESETn
        net: "OSPI0_RESETn"
        silicon_pad: "P15_6"
        gpio_node: lpgpio
        gpio_pin: 6
        direction: out
        polarity: active_low
        polarity_basis: net_name
        role: reset
        holds_through_stop: unproven
        source: { file: alif-ospi.tsv, signal: OSPI0_RESETn }
    default_modes: [stop, standby]
    default_action: hold_reset
    actions:
      hold_reset:
        control: OSPI0_RESETn
        opt_in: false
        note: >-
          No HyperRAM driver exists in the tree to issue the part's own
          low-power command, so reset-hold is the action.
    restore:
      method: pin_release
      note: Release OSPI0_RESETn, then re-run the HyperRAM init.
    evidence: >-
      alif-ospi.tsv row OSPI0_RESETn (P15_6); U9 -> OSPI0_SS0 per the
      E1M-AEN-2626-R2 netlist (metadata/e1m_modules/E1M-AEN803.yaml
      `ospi_memories` comment).

  # TI TMP112 on BRD_I2C (see on_module_links.brd_i2c.devices).  No control
  # pad: the shutdown bit is in its configuration register.
  temp_sensor:
    chip: tmp112
    presence: { on_module_key: temperature_sensor }
    device_label: tmp112
    controls: []
    default_modes: [stop, standby]
    default_action: shutdown_reg
    actions:
      shutdown_reg:
        opt_in: false
        note: TMP112 configuration-register SD bit.
    restore:
      method: register_write
      note: Clear the SD bit; the first conversion follows.
    evidence: >-
      Part and bus per on_module_links.brd_i2c.devices (U20 TMP112DIDPWR).

  # Micro Crystal RV-3028-C7 (0x52 on BRD_I2C): the PRIMARY RTC and the
  # primary RTC wake source.  The internal LPRTC is not trusted for time or
  # accurate timed wake (see the evidence).  Stays powered: KEEP_ALIVE with
  # CLKOUT off (CLKOUT reaches only the E1M edge pin).  Powered from +1V8, so it
  # lives while MODULE_EN is high; VBACKUP is not populated, so nothing persists
  # once MODULE_EN is low.
  rtc:
    chip: rv3028c7
    presence: { on_module_key: rtc_external }
    device_label: rv3028
    controls:
      # RV-3028 /INT -> RTC_ALARM -> P15_0 (LPGPIO0): the wake INPUT.
      - signal: RTC_ALARM
        net: "RTC_ALARM"
        silicon_pad: "P15_0"
        gpio_node: lpgpio
        gpio_pin: 0
        direction: in
        polarity: active_low
        polarity_basis: net_name
        role: wake_in
        holds_through_stop: n/a
        source: { file: inter-chip.tsv, signal: RTC_ALARM }
    default_modes: [stop, standby]
    default_action: keep_alive
    actions:
      keep_alive:
        opt_in: false
        note: >-
          Never powered down; only CLKOUT is switched off.  Alarm or
          countdown-timer interrupt on RTC_ALARM (P15_0) is the primary
          ALP_POWER_WAKE_RTC source; long wake_after_ms intervals (>= 1 s)
          use the countdown timer.
    restore:
      method: none
    secondary_rtc: >-
      Internal LPRTC (rtc0) is SECONDARY and not trusted for time or timed
      wake: Alif ER001 (A0: a STOP wake resets the prescaler) and ER002 (A1:
      falls back to LFRC).  The SES boot leaves the LF clock on LFRC
      (`[SES] No LF XTAL`, about 5 % error); LFXO works when selected (about
      32785 Hz measured) but selecting it via `se_service_set_run_cfg` has side
      effects, so LPRTC stays secondary until the full-profile backend (U5/U7).
      See the CHANGELOG alp-sdk#1814 section.
    evidence: >-
      Part per on_module_links.brd_i2c.devices (U21); /INT -> P15_0 per
      on_module_links.rtc_alarm and the inter-chip.tsv RTC_ALARM row.  VBACKUP
      unpopulated: see the rv3028 device evidence.

  # On-module backlight driver.  Family-wide: one PCB, and no SKU preset
  # carries a backlight key to read.
  backlight:
    presence: { family_invariant: true }
    controls:
      - signal: BACKLIGHT_EN
        silicon_pad: "P5_5"
        gpio_node: gpio5
        gpio_pin: 5
        direction: out
        polarity: active_high
        polarity_basis: assumed
        role: enable
        holds_through_stop: "no"
        source: { file: on-module-links.yaml, key: backlight.enable }
    default_modes: [stop, standby]
    default_action: enable_low
    actions:
      enable_low:
        control: BACKLIGHT_EN
        opt_in: false
        note: P5_5 is main-domain and does not hold through STOP.
    restore:
      method: pin_release
    evidence: >-
      on_module_links.backlight.enable (P5_5, E1M-AEN-2626-R2 netlist).
      `BACKLIGHT_EN` is this file's label, not a netlist name; the asserted
      polarity is `assumed`.

# ---------------------------------------------------------------------------
# wired_lpgpio_pads -- LPGPIO (P15_n) pads the module wires to an on-module
# chip that no power domain controls.  The generator emits them as the
# `alp,wired-lpgpio-pads` property of the `alp,som-power` node; the SDK refuses
# them as application wake pads (alp,power-wake-gpios).  The list is the same
# for every AEN SoM because the memory footprints (U9 HyperRAM, U10 NOR) and
# their nets exist on the one E1M-AEN-2626-R2 PCB whether or not the part is
# populated.  check_som_power_domains.py pins each pad to its alif-ospi.tsv row.
# ---------------------------------------------------------------------------
wired_lpgpio_pads:
  - { signal: OSPI1_INTn,   silicon_pad: "P15_2", source: { file: alif-ospi.tsv, signal: OSPI1_INTn } }
  - { signal: OSPI0_INTn,   silicon_pad: "P15_3", source: { file: alif-ospi.tsv, signal: OSPI0_INTn } }
  - { signal: OSPI0_RESETn, silicon_pad: "P15_6", source: { file: alif-ospi.tsv, signal: OSPI0_RESETn } }
  - { signal: OSPI1_RESETn, silicon_pad: "P15_7", source: { file: alif-ospi.tsv, signal: OSPI1_RESETn } }
