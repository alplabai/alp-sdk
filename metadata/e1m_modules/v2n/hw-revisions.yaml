# E1M-X V2N family hardware revisions.
#
# The runtime hw_info reader (src/zephyr/hw_info_zephyr.c) reads the
# SoM's actual hw_rev off the on-module EEPROM and compares it with
# strict equality (alp_hw_info_assert_matches_build()) against the
# single hw_rev the firmware was built for -- a build-time constant
# baked from `board.yaml`'s `som.hw_rev`, not this table.  It does not
# read this file, does not iterate `hw_revisions`, and does not
# reference `metadata/sdk_version.yaml`.  The per-rev
# `min_sdk_version`/`max_sdk_version` bounds below are declarative
# only from the runtime reader's point of view -- see
# `metadata/sdk_version.yaml` and #1025.
#
# Both bounds AND `status:` ARE build-time load-bearing, separately:
# `scripts/alp_orchestrate/sdk_compat.py` refuses an out-of-range SDK
# version (`SdkRevisionUnsupported`) and, distinctly, refuses a
# revision whose `status:` is `reserved`, `tbd`, or missing
# (`SdkRevisionNotBuildable`, #1025).  Every `status: reserved` entry
# below is refused at build time for that reason, not merely
# documentation of a future revision.

family: v2n
display_name: "E1M-X-V2N (Renesas RZ/V2N)"

# Altium board-number datecode (YYWW) shared by every revision of this PCB.  The
# V2N101/102 and V2M101/102 SKUs are ONE physical board (2625), variant-populated,
# so the datecode matches v2n-m1.  scripts/program_eeprom.py composes
# `<board_datecode>-<rev key>` into the manifest's hw_rev field.
#
# BUDGET: the manifest's hw_rev field is ALP_HW_INFO_HW_REV_LEN = 8 bytes, so the
# composed string may be at most 7 characters plus its NUL.  `2625-r2` is exactly
# 7 -- there is NO slack.  A future revision key of `r10` (`2625-r10`, 8 chars)
# will not fit and program_eeprom.py will refuse to pack it.  Widening the field
# is a schema_version bump; see docs/board-id.md.
board_datecode: "2625"

hw_revisions:
  r1:
    min_sdk_version: "0.3.0"
    max_sdk_version: ~
    status: production
    board_rev: "R1"
    released: "2026-05-12"
    summary: |
      First production V2N revision.  See CHANGELOG.md for the
      full per-rev component / pin manifest.
    changes:
      - "Initial release."
  r2:
    min_sdk_version: ~
    max_sdk_version: ~
    status: production
    board_rev: "R2"
    summary: |
      Board rev `2625-R2`, provisioned from the 2026-W38 V2M103 batch onward.
  r3:
    min_sdk_version: ~
    max_sdk_version: ~
    status: reserved
  r4:
    min_sdk_version: ~
    max_sdk_version: ~
    status: reserved
  r5:
    min_sdk_version: ~
    max_sdk_version: ~
    status: reserved
  r6:
    min_sdk_version: ~
    max_sdk_version: ~
    status: reserved
  r7:
    min_sdk_version: ~
    max_sdk_version: ~
    status: reserved
  r8:
    min_sdk_version: ~
    max_sdk_version: ~
    status: reserved
