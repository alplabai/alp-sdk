# AMP core ownership for RZ/V2N pads (Alp Lab policy fact, not vendor
# pinout data -- kept separate from renesas-peripheral-map.tsv on purpose;
# see issue #1157).
#
# Each entry attributes ONE (peripheral, pad) row emitted from
# metadata/e1m_modules/v2n/renesas-peripheral-map.tsv to the Cortex-A55
# (Linux) or Cortex-M33 (Zephyr) core that actually drives it.  An entry
# that matches zero rows, or more than one, is a hard generator error --
# see scripts/gen_pinmux_capability.py.
#
# Rows whose evidence cites a Linux devicetree claim (or an audit finding
# marked "not re-verified here") are BENCH-PENDING: source-verified against
# the A55 tree, not a fresh bench result.  Otherwise only silicon-verified
# pads belong here, with one explicit exception:
# a row whose evidence is marked BENCH-PENDING is source-verified (the
# driving code exists and applies/builds against its stated context) but
# not yet compiled and/or run on real hardware -- callers must not treat
# it as silicon-confirmed until the marker is removed.  Every row below
# has a citation.
# Carrier-only claims (the E1M-X EVK RIIC0/RIIC1, I2S0/I2S1, SD1 pads) are
# NOT recorded here: this file is SoM-wide and a carrier's use of an E1M pad
# must not fix policy on every carrier.  They wait for a per-board mechanism.
# Absence means "not attributed" -- never "shared" and never "a55 by
# elimination" (an earlier attempt derived unlisted pads as a55-by-default
# from the CM33 devicetree and got 5 pads wrong: pads a chip driver or
# src/zephyr/v2n_power_mgmt.c claims at runtime via alp_gpio_* never
# appear in the CM33 DT, so elimination silently mislabelled them a55).
# Do not add an entry without a citation as solid as the ones below.
core_ownership:
  - peripheral: "GD32_SPI.MOSI"
    pad: "P76"
    core: "m33"
    evidence: "RZ/V2N PFC Table 1.2-3: P76 = TXD7_MOSI7 (func1); CM33-owned per metadata/e1m_modules/v2n/supervisor-links.yaml gd32_spi link"
  - peripheral: "GD32_SPI.MISO"
    pad: "P77"
    core: "m33"
    evidence: "RZ/V2N PFC Table 1.2-3: P77 = RXD7_MISO7 (func1); CM33-owned per metadata/e1m_modules/v2n/supervisor-links.yaml gd32_spi link"
  - peripheral: "GD32_SPI.SCLK"
    pad: "P96"
    core: "m33"
    evidence: "RZ/V2N PFC Table 1.2-3: P96 = SCK7 (func2); CM33-owned per metadata/e1m_modules/v2n/supervisor-links.yaml gd32_spi link. Also docs/errata-e1m-x-v2n.md:76-79 -- the E3 P9.6 hog REGRESSED when the CM33-owned GD32 supervisor SPI took P96/SCK7 (2026-06-03)"
  - peripheral: "GD32_SPI.CS0"
    pad: "P97"
    core: "m33"
    evidence: "metadata/chips/gd32g553.yaml spi.renesas_pads.cs = P97 / gd32_pads.cs = PA8; master Simple-SPI has no hardware slave-select, so P97 stays GPIO for per-transaction framing of the GD32's PA8 CS-EXTI (gpio9 pin 7, GPIO_ACTIVE_LOW -- alp_e1m_v2n101_m33_sm_r9a09g056n48gbg_cm33.dts:62, :93-94 names it the GD32 chip-select via cs-gpios)"
  - peripheral: "RIIC8_SCL8"
    pad: "P07"
    core: "a55"
    evidence: "Maintainer decision 2026-09-24 (rv3028 RTC bring-up, alp-sdk fix/v2n-rtc-rv3028-linux): CA55/Linux is the sole master of the WHOLE RIIC8/BRD_I2C bus -- every device on it (rv3028c7 RTC @0x52, da9292 @0x1E, gd32g553 GD32 I2C slave @0x70, tmp112, clk_5l35023b, act8760), not just the one this SoM fix touches; the CM33 must not master RIIC8 at all. RESOLVED (feat/v2m-deepx-rail-uboot, same day): the CM33-owned CPG clock patch (now meta-alp-sdk/recipes-kernel/linux/linux-renesas/0001-clk-renesas-rzv2h-cpg-cm33-owned-clocks.patch, DT-driven) dropped its riic_8_ckm clock (RSCI7 only); metadata/e1m_modules/v2n/supervisor-links.yaml's brd_i2c link is status: disabled and the CM33 Zephyr board no longer claims i2c8 or the alp-i2c0 alias (scripts/gen_zephyr_board.py _v2n_dts()); src/zephyr/v2n_power_mgmt.c (DA9292 bring-up) and examples/v2n/v2n-rtc-multi-alarm (both drove m33_sm i2c on this bus) are both retired."
  - peripheral: "RIIC8_SDA8"
    pad: "P06"
    core: "a55"
    evidence: "Maintainer decision 2026-09-24 (rv3028 RTC bring-up, alp-sdk fix/v2n-rtc-rv3028-linux): CA55/Linux is the sole master of the WHOLE RIIC8/BRD_I2C bus -- every device on it, not just the one this SoM fix touches; the CM33 must not master RIIC8 at all. RESOLVED (feat/v2m-deepx-rail-uboot, same day): same follow-up scope as RIIC8_SCL8 above, all closed there."
  - peripheral: "DEEPX_CORE_0P75_EN"
    pad: "P64"
    core: "a55"
    evidence: "Bench-verified (2026-09-24, feat/v2m-deepx-rail-uboot, E1M-V2M103): U-Boot's board_late_init() (meta-alp-sdk/recipes-bsp/u-boot/u-boot/0004-rzv2n-dev-ALP-E1M-DEEPX-rail-bringup.patch) is the sole driver of P64: drives it high only after the DA9292 CH2 = 0.75V rail is confirmed power-good over RIIC8/BRD_I2C, and low on any failure path. U-Boot runs on the A55 before Linux or the CM33 image starts. No CM33 board file may claim this pad. Flashed and booted end to end on real silicon (v4 u-boot.bin, WSL Ubuntu-22.04: rzv2n-dev_defconfig + deepx-rail.cfg + fdtfile-v2m.cfg + no-dirty-version.cfg + gigadevice-xspi.cfg, aarch64-linux-gnu gcc 11.4.0, rc=0, 0 warnings): console showed `ALP: DA9292 programmed CTRL_01=0x01 VOUT_CH2=0x96/0x96` then `ALP: DEEPX rail 0.75V up (PG)`; post-boot readback CTRL_01=0x03, VOUT_CH2=0x96/0x96, STATUS_00=0x03 (CH2_PG set, no UV/OV/OC), STATUS_01=0x00, and the DEEPX bucks surfaced on BRD_I2C once P64 went high (0x44=0x82, 0x48=0x5a, 0x4F=0x14). See changelog.d/2045."
  - peripheral: "DEEPX_PWR_EN_REQ"
    pad: "P65"
    core: "a55"
    evidence: "Bench-verified (2026-09-24, feat/v2m-deepx-rail-uboot, E1M-V2M103): U-Boot's board_late_init() (same patch as DEEPX_CORE_0P75_EN above) is the sole reader of P65 (input, polled up to 500ms) before enabling the DA9292's CH2_EN. No CM33 board file may claim this pad. Flashed and booted end to end on real silicon (v4 u-boot.bin, WSL Ubuntu-22.04: rzv2n-dev_defconfig + deepx-rail.cfg + fdtfile-v2m.cfg + no-dirty-version.cfg + gigadevice-xspi.cfg, aarch64-linux-gnu gcc 11.4.0, rc=0, 0 warnings): P65 read live and confirmed DEEPX_PWR_EN_REQ before console showed `ALP: DA9292 programmed CTRL_01=0x01 VOUT_CH2=0x96/0x96` then `ALP: DEEPX rail 0.75V up (PG)`; post-boot readback CTRL_01=0x03, VOUT_CH2=0x96/0x96, STATUS_00=0x03 (CH2_PG set, no UV/OV/OC), STATUS_01=0x00. See changelog.d/2045."
  - peripheral: "eMMC_V_SEL"
    pad: "PA0"
    core: "a55"
    evidence: "Maintainer decision 2026-09-29 (#1142): the A55 owns PA0. U-Boot drives eMMC_V_SEL (PA0) high in board_init before the first MMC access (meta-alp-sdk/recipes-bsp/u-boot/u-boot_%.bbappend:63-68), and Linux keeps it there with the emmc_v_sel_1v8 gpio-hog (meta-alp-sdk/recipes-kernel/linux/linux-renesas/e1m-v2n-som.dtsi:658-661) so the eMMC stays at 1.8 V I/O for HS200. Boot-critical rail select: no CM33 board file may claim this pad (none does; the CM33 GD32 SPI uses P76/P77/P96/P97). eMMC HS200 boot bench-verified on E1M-V2M103 with this pairing."
