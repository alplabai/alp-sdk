# AMP core ownership for RZ/V2N pads (Alp Lab policy fact, not vendor
# pinout data -- kept separate from renesas-peripheral-map.tsv on purpose;
# see issue #1157).
#
# Each entry attributes ONE (peripheral, pad) row emitted from
# metadata/e1m_modules/v2n/renesas-peripheral-map.tsv to the Cortex-A55
# (Linux) or Cortex-M33 (Zephyr) core that actually drives it.  An entry
# that matches zero rows, or more than one, is a hard generator error --
# see scripts/gen_pinmux_capability.py.
#
# Only silicon-verified pads belong here, with one explicit exception:
# a row whose evidence is marked BENCH-PENDING is source-verified (the
# driving code exists and applies/builds against its stated context) but
# not yet compiled and/or run on real hardware -- callers must not treat
# it as silicon-confirmed until the marker is removed.  Every row below
# has a citation.
# Absence means "not attributed" -- never "shared" and never "a55 by
# elimination" (an earlier attempt derived unlisted pads as a55-by-default
# from the CM33 devicetree and got 5 pads wrong: pads a chip driver or
# src/zephyr/v2n_power_mgmt.c claims at runtime via alp_gpio_* never
# appear in the CM33 DT, so elimination silently mislabelled them a55).
# Do not add an entry without a citation as solid as the ones below.
#
# `boot_mode_core` (optional): a per-boot-mode override of `core`, for a
# pad whose driving core is TIME-SLICED across the two RZ/V2N boot modes
# (metadata/e1m_modules/v2n/power-tree.yaml `boot_modes:`) rather than
# fixed.  `core` stays the pad's steady-state / default-config value (what
# scripts/gen_pinmux_capability.py projects into metadata/pinmux/v2n.yaml
# and what scripts/check_amp_pad_claims.py checks a Linux DT claim
# against -- UNCHANGED by this field); `boot_mode_core`, when present, is
# read ONLY by scripts/gen_power_tree.py's cross_check() to verify a boot
# mode's `bus_master` / `deepx_sequence_owner` against the core that
# actually masters the pad DURING that mode.  A boot mode absent from
# `boot_mode_core` falls back to the flat `core` value, so every row
# without this field behaves exactly as before.
core_ownership:
  - peripheral: "GD32_SPI.MOSI"
    pad: "P76"
    core: "m33"
    evidence: "RZ/V2N PFC Table 1.2-3: P76 = TXD7_MOSI7 (func1); CM33-owned per metadata/e1m_modules/v2n/supervisor-links.yaml gd32_spi link"
  - peripheral: "GD32_SPI.MISO"
    pad: "P77"
    core: "m33"
    evidence: "RZ/V2N PFC Table 1.2-3: P77 = RXD7_MISO7 (func1); CM33-owned per metadata/e1m_modules/v2n/supervisor-links.yaml gd32_spi link"
  - peripheral: "GD32_SPI.SCLK"
    pad: "P96"
    core: "m33"
    evidence: "RZ/V2N PFC Table 1.2-3: P96 = SCK7 (func2); CM33-owned per metadata/e1m_modules/v2n/supervisor-links.yaml gd32_spi link. Also docs/errata-e1m-x-v2n.md:76-79 -- the E3 P9.6 hog REGRESSED when the CM33-owned GD32 supervisor SPI took P96/SCK7 (2026-06-03)"
  - peripheral: "GD32_SPI.CS0"
    pad: "P97"
    core: "m33"
    evidence: "metadata/chips/gd32g553.yaml spi.renesas_pads.cs = P97 / gd32_pads.cs = PA8; master Simple-SPI has no hardware slave-select, so P97 stays GPIO for per-transaction framing of the GD32's PA8 CS-EXTI (gpio9 pin 7, GPIO_ACTIVE_LOW -- alp_e1m_v2n101_m33_sm_r9a09g056n48gbg_cm33.dts:62, :93-94 names it the GD32 chip-select via cs-gpios)"
  - peripheral: "RIIC8_SCL8"
    pad: "P07"
    core: "a55"
    boot_mode_core: { a55_boot: "a55", cm33_boot: "m33" }
    evidence: "Maintainer decision 2026-09-24 (rv3028 RTC bring-up, alp-sdk fix/v2n-rtc-rv3028-linux): CA55/Linux is the sole master of the WHOLE RIIC8/BRD_I2C bus -- every device on it (rv3028c7 RTC @0x52, da9292 @0x1E, gd32g553 GD32 I2C slave @0x70, tmp112, clk_5l35023b, act8760), not just the one this SoM fix touches; the CM33 must not master RIIC8 at all. RESOLVED (feat/v2m-deepx-rail-uboot, same day): meta-alp-sdk/recipes-kernel/linux/linux-renesas/0001-clk-renesas-r9a09g056-keep-CM33-owned-RSCI7-on.patch dropped its riic_8_ckm hunk + retitled (RSCI7 only now); metadata/e1m_modules/v2n/supervisor-links.yaml's brd_i2c link is status: disabled and the CM33 Zephyr board no longer claims i2c8 or the alp-i2c0 alias (scripts/gen_zephyr_board.py _v2n_dts()); src/zephyr/v2n_power_mgmt.c (DA9292 bring-up) and examples/v2n/v2n-rtc-multi-alarm (both drove m33_sm i2c on this bus) are both retired. RESOLVED further (same branch, same day): that decision was steady-state-only -- RZ/V2N HW manual R01UH1071EJ0110 Rev.1.10 S1.9 Table 1.9-1 (BOOTSELCPU low = CM33 cold boot) means the CM33 masters RIIC8 in cm33_boot mode UNTIL it releases the CA55 (metadata/e1m_modules/v2n/power-tree.yaml boot_modes.cm33_boot); `boot_mode_core` above records that TIME-SLICED (not concurrent) fact for scripts/gen_power_tree.py's cross_check() only -- the flat `core: \"a55\"` (what scripts/gen_pinmux_capability.py projects and scripts/check_amp_pad_claims.py checks Linux DT claims against) is unchanged, since Linux never runs until after the CM33 has already released."
  - peripheral: "RIIC8_SDA8"
    pad: "P06"
    core: "a55"
    boot_mode_core: { a55_boot: "a55", cm33_boot: "m33" }
    evidence: "Maintainer decision 2026-09-24 (rv3028 RTC bring-up, alp-sdk fix/v2n-rtc-rv3028-linux): CA55/Linux is the sole master of the WHOLE RIIC8/BRD_I2C bus -- every device on it, not just the one this SoM fix touches; the CM33 must not master RIIC8 at all. RESOLVED (feat/v2m-deepx-rail-uboot, same day): same follow-up scope as RIIC8_SCL8 above, all closed there. RESOLVED further (same branch, same day): same time-sliced `boot_mode_core` fact as RIIC8_SCL8 above -- see its evidence for the BOOTSELCPU citation."
  - peripheral: "DEEPX_CORE_0P75_EN"
    pad: "P64"
    core: "a55"
    boot_mode_core: { a55_boot: "a55", cm33_boot: "m33" }
    evidence: "Bench-verified in a55_boot mode (2026-09-24, feat/v2m-deepx-rail-uboot, E1M-V2M103): U-Boot's board_late_init() (meta-alp-sdk/recipes-bsp/u-boot/u-boot/0004-rzv2n-dev-ALP-E1M-DEEPX-rail-bringup.patch) is the sole driver of P64 in a55_boot mode: drives it high only after the DA9292 CH2 = 0.75V rail is confirmed power-good over RIIC8/BRD_I2C, and low on any failure path. U-Boot runs on the A55 before Linux or the CM33 image starts. Flashed and booted end to end on real silicon (v4 u-boot.bin, WSL Ubuntu-22.04: rzv2n-dev_defconfig + deepx-rail.cfg + fdtfile-v2m.cfg + no-dirty-version.cfg + gigadevice-xspi.cfg, aarch64-linux-gnu gcc 11.4.0, rc=0, 0 warnings): console showed `ALP: DA9292 programmed CTRL_01=0x01 VOUT_CH2=0x96/0x96` then `ALP: DEEPX rail 0.75V up (PG)`; post-boot readback CTRL_01=0x03, VOUT_CH2=0x96/0x96, STATUS_00=0x03 (CH2_PG set, no UV/OV/OC), STATUS_01=0x00, and the DEEPX bucks surfaced on BRD_I2C once P64 went high (0x44=0x82, 0x48=0x5a, 0x4F=0x14). See changelog.d/2045. RESOLVED further (same branch, same day): in cm33_boot mode (RZ/V2N HW manual R01UH1071EJ0110 Rev.1.10 S1.9 Table 1.9-1, BOOTSELCPU low) the CM33 is the sole driver of P64 UNTIL it releases the CA55 -- examples/v2n/v2n-cm33-deepx-rail, da9292_ch2_sequence(). BENCH-PENDING on the cm33_boot path specifically (build-only Twister so far, no on-silicon cm33_boot run yet); the a55_boot bench pass above does not cover it. `boot_mode_core` records this for scripts/gen_power_tree.py's cross_check() only; the flat `core` a Linux DT claim is checked against is unaffected, because U-Boot/Linux in a55_boot never runs concurrently with the CM33's cm33_boot window."
  - peripheral: "DEEPX_PWR_EN_REQ"
    pad: "P65"
    core: "a55"
    boot_mode_core: { a55_boot: "a55", cm33_boot: "m33" }
    evidence: "Bench-verified in a55_boot mode (2026-09-24, feat/v2m-deepx-rail-uboot, E1M-V2M103): U-Boot's board_late_init() (same patch as DEEPX_CORE_0P75_EN above) is the sole reader of P65 (input, polled up to 500ms) before enabling the DA9292's CH2_EN, in a55_boot mode. Flashed and booted end to end on real silicon (v4 u-boot.bin, WSL Ubuntu-22.04: rzv2n-dev_defconfig + deepx-rail.cfg + fdtfile-v2m.cfg + no-dirty-version.cfg + gigadevice-xspi.cfg, aarch64-linux-gnu gcc 11.4.0, rc=0, 0 warnings): P65 read live and confirmed DEEPX_PWR_EN_REQ before console showed `ALP: DA9292 programmed CTRL_01=0x01 VOUT_CH2=0x96/0x96` then `ALP: DEEPX rail 0.75V up (PG)`; post-boot readback CTRL_01=0x03, VOUT_CH2=0x96/0x96, STATUS_00=0x03 (CH2_PG set, no UV/OV/OC), STATUS_01=0x00. See changelog.d/2045. RESOLVED further (same branch, same day): same time-sliced `boot_mode_core` fact as DEEPX_CORE_0P75_EN above; unlike P64, the request source itself doesn't change per boot mode -- power-tree.yaml's `gpios:` list has DEEPX_PWR_EN_REQ as ACT88760 GPIO7 (Buck5 power-good, autonomous PMIC hardware, `writable: []`), so the same signal is readable identically in either boot mode -- only which CM33/A55 code reads it changes. BENCH-PENDING on the cm33_boot path specifically, same as DEEPX_CORE_0P75_EN above."
