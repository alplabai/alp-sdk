# Decisions still open (renesas-audit plan section 7) -- deliberately NO row
# until the maintainer picks ONE owner, so nothing here is attributed by
# guess:
#   - DRP1 / OpenCVA: whether to enable it at all is open (audit NPU-03).
#
# Resources whose owner is a PER-PRODUCT choice are NOT `core_ownership`
# facts (a default must never be frozen as fact) -- they live in
# `assignable:` below.  A project overrides the default with a top-level
# `ownership: {<instance>: <core>}` in board.yaml; the override is rejected
# unless the core is in `candidates`.  Rows are REFERENCES to the
# (peripheral, pad) pairs of metadata/pinmux/v2n.yaml, never copied pins,
# and a pair listed here must NOT also be a `core_ownership` row.
# Core tokens use the same vocabulary as `core_ownership`: "a55" = Linux on
# the Cortex-A55 cluster, "m33" = Zephyr on the Cortex-M33 system manager
# (board.yaml core id m33_sm).  `candidates` lists only cores with a real
# backend TODAY; widen it only when the backend lands.
assignable:
  # `linux_enable` (default false): whether the generated Linux fragment may
  # turn the node on when the resolved owner is a55.  Flipping it needs
  # `linux_evidence` (bench proof).  False keeps the vendor status, so the
  # shipped image changes no behaviour.
  e1m_uart0:
    soc_instance: "UART0"
    # No Linux enable: an alias-less rz-rsci port registers as ttySC0 and
    # steals the SCIF console + getty (bench 2026-09-26, see
    # e1m-v2n-som.dtsi serial4), and P51 (RXD0) floats without a Pmod.
    linux_enable: false
    default: "a55"
    # "m33" is added once the P51 (UART0_RXD0) RX pull-up is bench-proven:
    # an unpulled RXD floats into the sci0 receive-error ISR (NVIC 114) and
    # the CM33 takes a Zephyr fatal (see the sci0 note in the generated
    # alp_e1m_v2n101_m33_sm_r9a09g056n48gbg_cm33.dts).
    candidates: ["a55"]
    rows:
      - { peripheral: "UART0_RXD0", pad: "P51" }
      - { peripheral: "UART0_TXD0", pad: "P50" }
    note: "Only one core's tree may carry the sci0 pin group on P50/P51 (audit IO-M3 / IO-04 / CM33-01)."
  e1m_uart1:
    soc_instance: "UART1"
    default: "a55"
    # The CM33 board tree has no sci1 node or pinctrl group for P52/P53, so
    # there is no CM33 backend for this instance today.
    candidates: ["a55"]
    rows:
      - { peripheral: "UART1_RXD1", pad: "P53" }
      - { peripheral: "UART1_TXD1", pad: "P52" }
    note: "Audit IO-M3 / CM33-01."
  e1m_spi0:
    soc_instance: "RSPI0"
    # P90-P92 are not 3.3 V tolerant (see note): no core may enable the node
    # until the carrier is confirmed 1.8 V.  Drop this block (with evidence)
    # to release it; the Linux and Zephyr generators both honour it.
    hw_blocked:
      reason: "P90-P92 are not 3.3 V tolerant (R01UH1071EJ0120 4.2.3.1.1 Note 1) and the carrier parts on E1M SPI0 are not yet confirmed 1.8 V (audit IO-05 / IO-M2 / CM33-13)"
    default: "a55"
    # "m33" is added once the `m33:` devicetree block exists (the driver is
    # zephyr/drivers/spi/spi_renesas_rz_spi_b.c + hal_renesas rzv r_spi_b, but
    # the RSPI0 PFC codes, SPI_B CM33 interrupt routing and the Zephyr node
    # are not in metadata) and hw_blocked is released.
    candidates: ["a55"]
    rows:
      - { peripheral: "RSPI0_MISOA", pad: "P91" }
      - { peripheral: "RSPI0_MOSIA", pad: "P90" }
      - { peripheral: "RSPI0_RSPCKA", pad: "P92" }
      - { peripheral: "RSPI0_SSLA0", pad: "P93" }
      - { peripheral: "RSPI0_SSLA1", pad: "P94" }
    note: "P90-P92 are NOT 3.3 V tolerant (R01UH1071EJ0120 4.2.3.1.1 Note 1): never enable an rspi0 node on either core until the carrier parts on E1M SPI0 are confirmed not to drive 3.3 V (audit IO-05 / IO-M2 / CM33-13)."
  e1m_can0:
    soc_instance: "CANFD3"
    default: "a55"
    # a55 only: hal_renesas rzv has no r_canfd module, so the CM33 cannot
    # drive CAN-FD.  E1M CAN0 = CANFD3 (B21/B22).
    candidates: ["a55"]
    rows:
      - { peripheral: "CANFD3_CRX3", pad: "P87" }
      - { peripheral: "CANFD3_CTX3", pad: "P86" }
    note: "Audit CM33-07 / CAN-1; the Linux tree does not claim these pads yet."
  e1m_can1:
    soc_instance: "CANFD2"
    default: "a55"
    candidates: ["a55"]
    rows:
      - { peripheral: "CANFD2_CRX2", pad: "P85" }
      - { peripheral: "CANFD2_CTX2", pad: "P84" }
    note: "E1M CAN1 = CANFD2 (B24/B25). Same backend limit as e1m_can0."

# Resources with no row in v2n/renesas-peripheral-map.tsv (so they cannot be
# a `core_ownership` entry above, which must match an emitted row) are
# recorded under `a55_only_resources` instead.  Nothing consumes this list
# yet: scripts/check_amp_pad_claims.py only compares port-pad claims (Linux DT
# vs CM33-resolved pads, enabled CM33 board nodes vs A55-resolved pads) and
# has no IRQ or address awareness, so a CM33
# claim of the DRP-AI IRQSELs below is NOT caught by any gate today.
a55_only_resources:
  - resource: "DRP-AI3 AI-MAC + DRP0"
    core: "a55"
    irq: "GIC SPI 914-917 (FSP IRQSEL 571-574: DRPAI_NMLINT, DRPAI_ERRINT, DRPAI_MAC_NMLINT, DRPAI_MAC_ERRINT)"
    evidence: "Audit NPU-15: manual memory map p.166 lists AI-MAC at 0x56800000 and DRP0 at 0x57000000 in the CM33 non-secure view, but Renesas ships DRP-AI only as a Linux driver (manual Table 2.3-1 p.228) and the FSP rzv tree has no DRP-AI module (hal_renesas bsp_irq_id.h:1107-1110 only defines the IRQ ids). No CM33 board file references DRP-AI. A CM33 claim of these IRQs or addresses is a conflict"
  - resource: "P80 (PCIe.MUX_PD), PCIe0 lane mux"
    core: "a55"
    evidence: "U-Boot (A55, before Linux and the CM33 image) drives P80 low: meta-alp-sdk/recipes-bsp/u-boot/u-boot/0001-rzv2n-dev-EEPROM-gated-DEEPX-DX-M1-PCIe-bring-up.patch (alp_deepx_pcie_bringup, alp_gpio_output(8, 0, 0)); Linux re-hogs it in e1m-v2m-deepx.dtsi:47-52. V2M (v2n-m1 family) only; audit PCIE-4. The pad is in v2n-m1/m1-additions.tsv, not in the v2n pinmux table"
  - resource: "P95 (PCIe.MUX_SEL)"
    core: "a55"
    evidence: "V2M only. U-Boot drives P95 low (same patch, alp_gpio_output(9, 5, 0)) and Linux re-hogs it (e1m-v2m-deepx.dtsi:61-66, deepx-pcie-mux-sel-hog). HAZARD kept visible (audit CM33-04 / IO-10): P95 shares the P9/PM9/PMC9/PFC9 byte registers and PWPR with the CM33-owned P96/P97 (GD32 SPI), and the Linux hog's non-atomic read-modify-write lands at ~1.9 s, inside the CM33 pin-setup window; the DT itself calls it a KNOWN RACE. Proposed fix (audit PCIE-4): drop the Linux hog, U-Boot already sets it"
  - resource: "PA6 (M1_RESET)"
    core: "a55"
    evidence: "V2M only. Released by U-Boot board_late_init() only after the DA9292 CH2 rail is power-good (0004-rzv2n-dev-ALP-E1M-DEEPX-rail-bringup.patch); e1m-v2m-deepx.dtsi:69-73 documents that Linux must not hog it. Audit PCIE-4"
  - resource: "USB (hsusb / usb3 phy)"
    core: "a55"
    evidence: "Linux devicetree enables &hsusb, &usb2_phy0, &usb3_phy0 (e1m-x-evk.dtsi:731-781); no FSP USB module in the Renesas rzv tree (audit XSPI-2, OWN-1)"
  - resource: "PCIe0"
    core: "a55"
    evidence: "Linux node &pcie0 (disabled on V2N, e1m-v2n101-x-evk.dts:32; enabled for the DX-M1 on V2M, e1m-v2m-deepx.dtsi:36); no FSP PCIe module in the Renesas rzv tree (audit XSPI-2, OWN-1)"
  - resource: "CRU / CSI-2 / ISP (cru0, csi20)"
    core: "a55"
    evidence: "Camera capture is the Linux rzg2l-cru / csi2 driver; the FSP rzv tree has no CRU, CSI or ISP module (audit MM-06). The CM33 camera/ISP backend (src/backends/camera/v2n_n44_isp.c) must not drive them"
