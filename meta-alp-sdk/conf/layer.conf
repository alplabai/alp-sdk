# SPDX-License-Identifier: Apache-2.0
# meta-alp-sdk: Yocto layer for the Alp SDK runtime + chips +
# examples + ROS nodes on the V2N / V2N-M1 / i.MX 93 SoM family.

BBPATH .= ":${LAYERDIR}"

# Absolute path of this layer, kept past layer.conf parsing (LAYERDIR is only
# valid while the layer's own layer.conf is read). conf/distro/alp.conf reads
# the SDK version from ${ALP_SDK_LAYERDIR}/../include/alp/version.h with it.
ALP_SDK_LAYERDIR := "${LAYERDIR}"

# Two-level recipes (recipes-<category>/<pkg>/<recipe>.bb) plus flat
# recipes directly under a category dir (e.g. recipes-images/*.bb for
# image recipes) -- the latter pattern is what makes alp-image-edge.bb
# discoverable.
BBFILES += "${LAYERDIR}/recipes-*/*.bb         \
            ${LAYERDIR}/recipes-*/*/*.bb       \
            ${LAYERDIR}/recipes-*/*.bbappend   \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Bbappends for recipes that live in an OPTIONAL vendor layer go under
# dynamic-layers/<collection>/ and are pulled in via BBFILES_DYNAMIC, so they
# are parsed ONLY when that collection is in bblayers.  A plain .bbappend with
# no matching recipe is a hard parse error, so this keeps builds that drop the
# vendor layer clean.  kernel-module-mali (the Mali-G31 GPU DDK) lives in the
# RZ AI SDK's meta-rz-graphics; our GPU clock-ownership fix only applies there.
# dx-driver (the DX-M1 kernel-module recipe) lives in DEEPX's own
# meta-deepx-m1 layer; our udev device-node permission fix only
# applies there -- see dynamic-layers/meta-deepx-m1/.../dx-driver_%.bbappend.
# v4l2-init (a Renesas-EVK OV5645 CRU setup unit) lives in meta-rz-distro; we
# only stop it auto-starting on boards without that camera.
# linux-alif (the Alif Ensemble kernel) lives in meta-alif-ensemble; our E1M-AEN
# console-routing bbappend only applies there (#2504 -- it used to sit in
# recipes-kernel/ and dangled on every non-AEN MACHINE).
# The ROS 2 recipes (the alp-perception / alp-ros2-temperature nodes and
# packagegroup-alp-ros) `inherit ros_distro_humble`, a class that only exists
# once upstream meta-ros2-humble is in bblayers -- and that layer's
# BBFILE_COLLECTIONS name is `ros2-humble-layer`, NOT its directory name.
# They live under dynamic-layers/ros2-humble-layer/ so a build WITHOUT meta-ros
# still parses (no BBMASK needed); see docs/bring-up-ros2.md.
BBFILES_DYNAMIC += " \
    ros2-humble-layer:${LAYERDIR}/dynamic-layers/ros2-humble-layer/recipes-*/*/*.bb \
    meta-rz-graphics:${LAYERDIR}/dynamic-layers/meta-rz-graphics/recipes-*/*/*.bbappend \
    meta-deepx-m1:${LAYERDIR}/dynamic-layers/meta-deepx-m1/*/*/*.bbappend \
    meta-rz-distro:${LAYERDIR}/dynamic-layers/meta-rz-distro/*/*/*.bbappend \
    meta-alif-ensemble:${LAYERDIR}/dynamic-layers/meta-alif-ensemble/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "alp-sdk"
BBFILE_PATTERN_alp-sdk = "^${LAYERDIR}/"
BBFILE_PRIORITY_alp-sdk = "8"

LAYERSERIES_COMPAT_alp-sdk = "kirkstone scarthgap"

# Hard layer deps only.  meta-ros2-humble moved to LAYERRECOMMENDS so
# non-ROS images (e.g. core-image-minimal) build without the ROS layer.
LAYERDEPENDS_alp-sdk = "core openembedded-layer"

# Optional vendor layers.  Builds that only target one family can
# drop the others from bblayers.conf -- and, since #1176's follow-up
# fix, can also leave a family's layers IN bblayers.conf while building
# a MACHINE outside that family: the RZ/V-specific RDEPENDS in
# alp-image-common.inc / packagegroup-alp-camera.bb are gated on BOTH
# the layer's collection AND MACHINE_FEATURES containing "v2n", so they
# stay empty (not a hard, unsatisfiable dependency) on AEN / NX91 even
# with e.g. meta-rz-codecs present. Before that fix this section's
# "can drop" was closer to "MUST drop, or a shared bblayers.conf across
# machines breaks do_rootfs on the non-RZ ones" -- verify with a real
# `bitbake alp-image-prod` for a non-RZ MACHINE with the RZ layers
# present before relying on this in production; nobody in this repo's
# working environment can run that build to confirm it.
#
# Renesas RZ/V2N (covers e1m-v2n101-a55 + e1m-v2n102-a55 + e1m-v2n103-a55 +
# e1m-v2m101-a55 + e1m-v2m102-a55 + e1m-v2m103-a55):
#   `meta-renesas` is the canonical RZ base BSP.  The four
#   `meta-rz-features/*` sublayers come bundled together inside
#   the RZ/V2N AI SDK BSP v6.30 Source Code package (see README.md).
#
#   meta-rz-drpai in particular is what CREATES the `drpai0` DT label
#   (via its 0001-add-drpai-property-to-devicetree.patch against
#   r9a09g056.dtsi) and the DRP-AI driver behind it.  Keep it a SOFT dep:
#   the linux-renesas bbappend gates the `&drpai0` overlay on this
#   collection being in bblayers, so dropping the layer compiles a board
#   dtb with the NPU simply unclaimed instead of failing dtc.  A hard
#   LAYERDEPENDS would force an RZ/V-only layer on the AEN and NX91
#   machines, which have no DRP-AI silicon at all.
#
# DEEPX DX-M1 (covers e1m-v2m101-a55 + e1m-v2m102-a55 + e1m-v2m103-a55):
#   `meta-deepx-m1` carries the DX-M1 kernel module + userspace
#   runtime recipes (dx-driver, dx-rt).  Source + real collection name
#   verified at github.com/DEEPX-AI/meta-deepx-m1, branch scarthgap.
#
# NXP i.MX 93 (covers e1m-nx9101-a55):
#   `meta-imx` is the canonical i.MX BSP.
#
# Alif Ensemble E8 / E7 (covers e1m-aen801-a32 + e1m-aen701-a32) --
#   BROKEN today, see #264:
#   `meta-alif-ensemble` was meant to be the canonical Alif Ensemble
#   BSP providing the `devkit-e8` (AEN801) / `devkit-e7` (AEN701)
#   MACHINEs those carriers `require`.  As of 2026-09-05 the public
#   repo has exactly one branch (`devkit-ex-b0`, no `scarthgap` --
#   #1967); `devkit-e8.conf` does not exist there at all, so AEN801's
#   ACTIVE `require` fails BitBake's own parse step (#1968).
#   `devkit-e7.conf` DOES exist there, but AEN701's `require` on it is
#   commented out in-tree pending this layer being vendored, so AEN701
#   parses with no base tune/kernel-provider/TF-A set at all -- a
#   different gap from AEN801's. Both are unbuildable regardless: the
#   layer is zeus-era (`LAYERSERIES_COMPAT = "warrior zeus"`),
#   incompatible with this repo's Scarthgap baseline (#1971).  The
#   orchestrator refuses to emit `bitbake` for either MACHINE for the
#   same reason (#1982).  Source at
#   github.com/alifsemi/meta-alif-ensemble; track the rebuild at #264.
#
# Mender OTA (covers every machine when OTA is opted in):
#   `meta-mender-core` provides the .mender artefact generator
#   + A/B rootfs partitioning + the on-target Mender client.
#   Builds that don't ship OTA can drop it from bblayers.conf;
#   the meta-alp-sdk recipes parse cleanly without it.  See
#   conf/distro/include/mender.inc + README.md for the wiring.
#
# ROS 2 (covers images that ship the alp-sdk ROS nodes -- opt-in, ALP_ENABLE_ROS2):
#   upstream `meta-ros` (ros/meta-ros, branch scarthgap): its
#   `meta-ros-common`, `meta-ros2` and `meta-ros2-humble` sublayers provide
#   rclcpp + the ROS message packages (collection `ros2-humble-layer`).
#   Renesas' `meta-rzv2-ros-humble` (github.com/renesas-rz/rzv_ros,
#   yocto/meta-rz-features-ros/, collection `rzv2-ros-humble`) is the
#   RZ/V2N-specific compat layer for that Humble set on the AI SDK BSP; it
#   is optional here and must only ever be added TOGETHER with meta-ros AND
#   meta-rz-graphics (its bbappends are plain BBFILES, not dynamic, so they
#   dangle and fail the parse without either).  Soft deps, so non-ROS
#   images build without them -- the ROS recipes sit in
#   dynamic-layers/ros2-humble-layer/ and are simply not parsed.
#   DEEPX's dx-driver/dx-rt recipes live entirely in the external
#   meta-deepx-m1 layer (not under meta-alp-sdk/recipes-*), so a non-DEEPX
#   build simply leaves that layer out of bblayers.conf -- no BBMASK needed.
# NOTE: LAYERRECOMMENDS matches BBFILE_COLLECTIONS names, not layer
# directory names -- they differ for several entries here (also
# meta-ros2-humble -> `ros2-humble-layer`, meta-rzv2-ros-humble ->
# `rzv2-ros-humble`). Verified against
# each layer's own conf/layer.conf: meta-rz-drpai's BBFILE_COLLECTIONS
# is "rz-drpai" and meta-rz-opencva's is "rz-opencva" (meta-rz-codecs
# and meta-rz-graphics happen to match their directory names). The two
# corrected entries below are the ones ALP_RZ_DRPAI_INSTALL /
# ALP_RZ_OPENCVA_RDEPENDS actually gate on (alp-image-common.inc,
# packagegroup-alp-camera.bb) -- before this fix this list silently
# recommended two names nothing provides.
LAYERRECOMMENDS_alp-sdk = " \
    ros2-humble-layer         \
    rzv2-ros-humble           \
    meta-renesas              \
    meta-rz-graphics          \
    rz-drpai                  \
    rz-opencva                \
    meta-rz-codecs            \
    meta-econsys              \
    meta-deepx-m1             \
    meta-imx                  \
    meta-alif-ensemble        \
    meta-mender-core          \
"

LAYERVERSION_alp-sdk = "2"
