#@TYPE: Machine
#@NAME: E1M-AEN801 A32 cluster (Alif Ensemble E8)
#@DESCRIPTION: Alp Lab E1M-AEN801 SoM (Alif Ensemble E8: dual
#              Cortex-A32 + Cortex-M55 HP/HE + Ethos-U85 + 2x
#              Ethos-U55, plus ISP + JPEG encoder) on the E1M EVK.
#              This MACHINE targets the A32 application cluster
#              (Linux); the two M55 system cores build via Zephyr
#              (see the SoM preset's topology.m55_hp / topology.m55_he
#              boards).
#
#              NON-BUILDABLE PLACEHOLDER -- but no longer for want of
#              first light.  Observed 2026-09-05 on two E1M-AEN803
#              modules: the A32 boots Linux 6.12.6 to a live shell on
#              the carrier console (#1972).  Observed chain: Secure
#              Enclave -> TF-A BL32 (SP_MIN, AArch32 Secure World) ->
#              Linux as BL33; no BL1/BL2/BL31, no U-Boot, kernel XIP
#              from MRAM, kernel RAM in on-chip SRAM.  That boot was
#              produced from hand-built TF-A + kernel + cramfs
#              artefacts, NOT through any Yocto layer: no bitbake build
#              has ever been run against this MACHINE, the rootfs was a
#              hand-rolled statically-linked busybox cramfs rather than
#              an alp-image-*, and the TF-A console knobs it used are a
#              local patch to the vendor tree (#1979), so the build is
#              not reproducible from a clean checkout.  What parks this
#              MACHINE is therefore the Yocto path, not the silicon: no
#              base machine exists (#1968, #1971) and nothing here has
#              ever been built.
#
#              Measured 2026-09-05 against the public host:
#              github.com/alifsemi/meta-alif-ensemble publishes exactly
#              ONE branch, devkit-ex-b0.  There is no scarthgap branch.
#              Whether a portal-gated scarthgap layer exists has NOT
#              been confirmed either way.  The branch that does exist
#              declares LAYERSERIES_COMPAT_meta-alif-ensemble =
#              "warrior zeus" and pins LINUX_VERSION ?= "5.4.25", and
#              its conf/machine/ holds only appkit-e7.conf,
#              devkit-e5.conf and devkit-e7.conf -- there is NO
#              devkit-e8.conf to require.
#
#              The E8 Linux support that DOES exist upstream lives in
#              the git trees, not the layer:
#                * github.com/alifsemi/linux_alif branch v6.12-dev --
#                  devkit_e8_defconfig, devkit_e8_unicore_defconfig,
#                  devkit-e8.dts, devkit-e8-unicore.dts
#                * github.com/alifsemi/trusted-firmware-a_alif branch
#                  alif_lts-v2.10.8 -- PLAT=devkit_e7 with ALIF_SOC_E8=1
#                  builds BL32 for the E8
#              Wiring those two trees into a buildable base is tracked
#              in #1968 / #1971 / #1972.  Per ADR-0017 we still intend
#              to ride OVER the vendor BSP rather than fork it.
#
#              SKELETON: the carrier dtb, TF-A platform/memory map,
#              and boot media are Alp-Lab-SoM-specific and supplied by
#              the maintainer's AEN HW config; every such value is
#              marked "# TBD(alif-hw-config)" per the no-invented-
#              values rule.  (E8 silicon order code is also flagged
#              status.preliminary / status.partial_hw_config = true in
#              metadata/e1m_modules/E1M-AEN801.yaml.)

# ---- Inherit an upstream Alif E8 base machine (none exists yet) ----
#
# There is no upstream E8 MACHINE to require: the only public branch of
# meta-alif-ensemble, devkit-ex-b0, ships appkit-e7.conf, devkit-e5.conf
# and devkit-e7.conf only (#1968).  So the require below stays COMMENTED
# OUT -- same treatment as e1m-aen701-a32.conf, which comments out its
# own base require and names the real branch.
#
# What that costs, stated plainly: with the require commented out there
# is no missing file and this conf PARSES.  Nothing below sets a tune, a
# PREFERRED_PROVIDER_virtual/kernel or a kernel image type, and no base
# supplies them, so a user who selects MACHINE = "e1m-aen801-a32" does
# NOT get a clear "devkit-e8.conf not found".  The expected failure mode
# is a later one, in bitbake's parse / dependency resolution, on an
# unset tune (no DEFAULTTUNE, empty TARGET_ARCH) and an unprovided
# virtual/kernel -- expected, not observed: no bitbake run has been
# performed against this MACHINE.  Such a failure would point at the
# tune machinery instead of at the real cause: no Yocto base machine
# exists yet (#1968, #1971) and no bitbake build has ever been run
# here.  The A32 silicon is no longer part of that cause -- it has been
# observed booting Linux 6.12.6 to a shell from hand-built artefacts
# (#1972).
#
# A louder failure would be better than an unset-tune error, but a
# machine conf cannot carry one: .conf files are read by bitbake's
# ConfHandler, which accepts only assignments, include, require,
# export, unset and addpylib.  An anonymous `python () { bb.fatal(...) }`
# is BBHandler syntax (.bb / .bbclass) and ParseErrors here -- which
# would point at a syntax error in alp-sdk's own file, i.e. at an even
# more misleading cause than the tune error it was meant to replace.
# So the prose above is the record, and there is no guard.
#
# Un-comment the require once a base machine really exists -- either
# from a confirmed scarthgap-series
# layer (the one public branch is zeus-era, #1971; the branch the
# meta-alp-sdk README names does not exist at all, #1967) or from an
# alp-sdk-authored base assembled over linux_alif @v6.12-dev +
# trusted-firmware-a_alif @alif_lts-v2.10.8 (#1971, #1972).  Whatever
# supplies it owes the cortexa32 tune,
# PREFERRED_PROVIDER_virtual/kernel, the kernel image type, the
# defconfig + dtb, TF-A and the serial console -- alp-sdk does not
# re-author those.
#require conf/machine/devkit-e8.conf       # does not exist on meta-alif-ensemble @devkit-ex-b0 (#1968)

# ---- Alp-Lab E1M-AEN801 carrier overrides ----

MACHINEOVERRIDES =. "e1m-aen801-a32:e1m-aen801:e1m-e8:e1m:"
MACHINE_FEATURES += "alp-sdk e1m aen801 ethos-u85 ethos-u55"

# Carrier device tree: a dedicated board dtb composed from the Alif E8
# SoC dtsi + the E1M SoM dtsi + the E1M-EVK carrier dtsi.  Would
# override (not append) the Alif reference dtb -- devkit-e8.dts and
# devkit-e8-unicore.dts live in linux_alif @v6.12-dev -- so only the
# ALP board dtb is built; mirrors the V2N / NX9101 carriers.
# TBD(alif-hw-config): the carrier .dts is Alp-Lab-authored, pending
# the maintainer's AEN HW config; the filename below is the intended
# convention, NOT a value transcribed from a ref.
#KERNEL_DEVICETREE = "alif/ensemble/e1m/e1m-aen801.dtb"   # TBD(alif-hw-config)

# Trusted Firmware-A platform + memory map.  No base supplies TF-A here
# yet.  Upstream, trusted-firmware-a_alif @alif_lts-v2.10.8 builds the
# E8 BL32 as PLAT=devkit_e7 with ALIF_SOC_E8=1 -- that pair, not a
# "devkit_e8" platform string, is what exists.  The E1M carrier would
# reuse it, but its DDR/MRAM layout is HW-config-determined.
# TBD(alif-hw-config): confirm the TF-A platform string + the carrier
# memory map (the E1M-AEN801 MRAM is 5.5 MB and SRAM is 9984 KB per
# metadata/socs/alif/ensemble/e8.json variants[AE822FA0E5597LS0], but
# the BL2/BL31/BL33 + DTB load addresses are carrier-specific).

# Serial console + boot media are unset -- with the base require
# commented out there is nothing to inherit them from.  Boot
# flash on the E1M-AEN801 SoM is the on-module Macronix MX25UM25645
# OctaFlash (xSPI NOR, 32 MiB), used as app_storage
# (metadata/e1m_modules/E1M-AEN801.yaml on_module.ospi_memories.ospi0).
# Its OSPI0 chip-select is UNMEASURED -- see issue #1973: the
# E1M-AEN-2626-R2 netlist places the HyperRAM on OSPI0_SS0 and the NOR
# on OSPI0_SS1, while the SKU preset asserts the opposite, and nobody
# has read the assignment off silicon (probing OSPI0 needs code
# executing on an M55, and the bench module's slot0 is blank).  Do not
# code a chip-select in until it has been read off real silicon.
# E8 also exposes an SD/eMMC controller (SD v4.2 / eMMC v5.1, per
# e8.json external_memory_interfaces).
# TBD(alif-hw-config): confirm the E1M carrier debug UART + boot flash
# routing before setting any console/boot-device value here.
#ALP_BOOT_DEVICE ?= "ospi-nor"            # TBD(alif-hw-config)

# Install the alp-sdk runtime alongside the ROS 2 base packages,
# mirroring the other A-cluster machines.  AEN801 carries no DEEPX /
# DRP-AI silicon, so no vendor NPU runtime is installed here -- the
# Ethos-U path lives inside the alp-sdk library.
IMAGE_INSTALL:append = " alp-sdk rclcpp sensor-msgs"

# Inference runtime selection is silicon-determined.  The SoM preset
# (metadata/e1m_modules/E1M-AEN801.yaml inference:) declares
# preferred_backend ethos_u / variant u85; E8 carries one Ethos-U85
# (NPU-HG, Generative AI / Transformers) alongside two Ethos-U55s
# (NPU-HP + NPU-HE).  The alp-sdk library compiles the
# <alp/inference.h> dispatcher; apps pick per-handle at runtime via
# alp_inference_open().  No build-time backend pin.
#
# NOTE: E8 also ships an ISP + JPEG encoder (e8.json peripherals);
# userspace recipes for those come from the Alif BSP.

# OTA via Mender (opt-in).  Uncomment to inherit Mender image
# generation + A/B rootfs partitioning.  Requires meta-mender-core
# in bblayers.conf; reference flow in docs/ota.md.
#
#     require conf/distro/include/mender.inc
