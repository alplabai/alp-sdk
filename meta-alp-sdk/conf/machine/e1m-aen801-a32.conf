#@TYPE: Machine
#@NAME: E1M-AEN801 A32 cluster (Alif Ensemble E8)
#@DESCRIPTION: Alp Lab E1M-AEN801 SoM (Alif Ensemble E8: dual
#              Cortex-A32 + Cortex-M55 HP/HE + Ethos-U85 + 2x
#              Ethos-U55, plus ISP + JPEG encoder) on the E1M EVK.
#              This MACHINE targets the A32 application cluster
#              (Linux); the two M55 system cores build via Zephyr
#              (see the SoM preset's topology.m55_hp / topology.m55_he
#              boards) -- that Zephyr side IS upstream-native today
#              (`ensemble_e8_dk`, alp-sdk Zephyr v4.4.1); this A32/
#              Yocto MACHINE is NOT.
#
#              NON-BUILDABLE PLACEHOLDER.  This MACHINE was meant to
#              `require` the real Alif BSP (github.com/alifsemi/
#              meta-alif-ensemble)'s devkit-e8 MACHINE, matching
#              alp-sdk's Scarthgap Yocto series.  Neither half of that
#              plan holds:
#
#              - No scarthgap-series meta-alif-ensemble exists
#                publicly.  Verified 2026-09-05 against a fresh clone:
#                the repo has exactly one branch, devkit-ex-b0, and
#                its conf/machine/ carries only appkit-e7.conf,
#                devkit-e5.conf, devkit-e7.conf -- no devkit-e8.conf
#                on that branch or anywhere else public (#1968).
#              - Even granting a devkit-e8.conf existed, devkit-ex-b0
#                is Scarthgap-incompatible: its conf/layer.conf
#                declares LAYERSERIES_COMPAT_meta-alif-ensemble =
#                "warrior zeus" (Yocto 3.0, 2019) against this repo's
#                Scarthgap (5.0.11) baseline (#1971).
#
#              Whether a scarthgap-series layer with a devkit-e8.conf
#              exists behind Alif's login-gated support portal is
#              UNCONFIRMED -- that needs asking Alif directly, not
#              assuming either answer, before anyone writes a
#              replacement or forward-ports the layer.  Per ADR-0017
#              the INTENT remains to ride OVER the vendor BSP (Tier-1
#              upstream-native base + a thin in-tree override), not
#              fork meta-alif-ensemble -- but there is no upstream
#              base to ride over today.  See meta-alp-sdk/README.md's
#              "Alif Ensemble E8" section and issue #264 for the
#              rebuild.
#
#              SKELETON: the carrier dtb, TF-A platform/memory map,
#              and boot media are Alp-Lab-SoM-specific and supplied by
#              the maintainer's AEN HW config; every such value is
#              marked "# TBD(alif-hw-config)" per the no-invented-
#              values rule.  (E8 silicon order code is also flagged
#              status.preliminary / status.partial_hw_config = true in
#              metadata/e1m_modules/E1M-AEN801.yaml.)

# ---- Would inherit the upstream Alif E8 DevKit base machine -- but
#      there is no such file to inherit; see the header above ----
#
# If a Scarthgap-compatible meta-alif-ensemble with a devkit-e8.conf
# ever ships, it would need to be on bblayers.conf and registered in
# conf/layer.conf's LAYERRECOMMENDS_alp-sdk first (see the README's
# "Alif Ensemble E8" section).  That require would then pull the Alif
# E8 reference values (cortexa32 tune, PREFERRED_PROVIDER_virtual/
# kernel = linux-alif, xipImage, the devkit_e8 defconfig + devkit-
# e8.dtb, TF-A, the serial console, SMP) -- alp-sdk would not
# re-author any of them.  Commented out: the file does not exist on
# any public branch, so MACHINE=e1m-aen801-a32 does not parse until
# #1968 and #1971 are both resolved.
#require conf/machine/devkit-e8.conf      # meta-alif-ensemble -- no such branch/file exists publicly; #1968 #1971

# ---- Alp-Lab E1M-AEN801 carrier overrides ----

MACHINEOVERRIDES =. "e1m-aen801-a32:e1m-aen801:e1m-e8:e1m:"
MACHINE_FEATURES += "alp-sdk e1m aen801 ethos-u85 ethos-u55"

# Carrier device tree: a dedicated board dtb composed from the Alif E8
# SoC dtsi + the E1M SoM dtsi + the E1M-EVK carrier dtsi.  Overrides
# (not appends) the Alif reference dtb (devkit-e8.dtb) so only the ALP
# board dtb is built -- mirrors the V2N / NX9101 carriers.
# TBD(alif-hw-config): the carrier .dts is Alp-Lab-authored, pending
# the maintainer's AEN HW config; the filename below is the intended
# convention, NOT a value transcribed from a ref.
#KERNEL_DEVICETREE = "alif/ensemble/e1m/e1m-aen801.dtb"   # TBD(alif-hw-config)

# Trusted Firmware-A platform + memory map.  TF-A comes from the
# devkit-e8 base; the E1M carrier reuses it but its DDR/MRAM layout is
# HW-config-determined.  The base's TF-A platform string is NOT
# transcribed here because the real meta-alif-ensemble devkit-e8.conf
# is not vendored in this tree (the only local Alif ref is the
# proprietary DFP, which carries no Yocto/TF-A platform name).
# TBD(alif-hw-config): confirm the TF-A platform string + the carrier
# memory map (the E1M-AEN801 MRAM is 5.5 MB and SRAM is 9984 KB per
# metadata/socs/alif/ensemble/e8.json variants[AE822FA0E5597LS0], but
# the BL2/BL31/BL33 + DTB load addresses are carrier-specific).

# Serial console + boot media inherit the devkit-e8 defaults.  Boot
# flash on the E1M-AEN801 SoM is the on-module Macronix MX25UM25645
# OctaFlash (xSPI NOR, 32 MiB) on OSPI0 CS0, used as app_storage
# (metadata/e1m_modules/E1M-AEN801.yaml on_module.ospi_memories.ospi0);
# E8 also exposes an SD/eMMC controller (SD v4.2 / eMMC v5.1, per
# e8.json external_memory_interfaces).
# TBD(alif-hw-config): confirm the E1M carrier routes the same debug
# UART + boot flash as devkit-e8 before relying on the inherited
# console/boot-device values.
#ALP_BOOT_DEVICE ?= "ospi-nor"            # TBD(alif-hw-config)

# Install the alp-sdk runtime alongside the ROS 2 base packages,
# mirroring the other A-cluster machines.  AEN801 carries no DEEPX /
# DRP-AI silicon, so no vendor NPU runtime is installed here -- the
# Ethos-U path lives inside the alp-sdk library.
IMAGE_INSTALL:append = " alp-sdk rclcpp sensor-msgs"

# Inference runtime selection is silicon-determined.  The SoM preset
# (metadata/e1m_modules/E1M-AEN801.yaml inference:) declares
# preferred_backend ethos_u / variant u85; E8 carries one Ethos-U85
# (NPU-HG, Generative AI / Transformers) alongside two Ethos-U55s
# (NPU-HP + NPU-HE).  The alp-sdk library compiles the
# <alp/inference.h> dispatcher; apps pick per-handle at runtime via
# alp_inference_open().  No build-time backend pin.
#
# NOTE: E8 also ships an ISP + JPEG encoder (e8.json peripherals);
# userspace recipes for those come from the Alif BSP.

# OTA via Mender (opt-in).  Uncomment to inherit Mender image
# generation + A/B rootfs partitioning.  Requires meta-mender-core
# in bblayers.conf; reference flow in docs/ota.md.
#
#     require conf/distro/include/mender.inc
