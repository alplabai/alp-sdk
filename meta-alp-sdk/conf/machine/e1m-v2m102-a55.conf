#@TYPE: Machine
#@NAME: E1M-V2M102 A55 cluster (V2N + DEEPX DX-M1, variant)
#@DESCRIPTION: Alp Lab E1M-V2M102 SoM -- second V2M variant (V2N
#              base + on-module DEEPX DX-M1 NPU over PCIe).
#              Differs from V2M101 in DRAM density only (the V2N
#              family shares one PCB). A55 Linux cluster MACHINE;
#              M33 system core builds via Zephyr.

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2m102-a55:e1m-v2m102:e1m-v2m101-a55:e1m-v2m101:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n deepx-dxm1"

# STATUS: expected buildable (not yet baked or booted as this MACHINE).
# V2M102 reuses the V2M101 carrier dtb BY DESIGN: the V2N's DDR
# connections are identical on V2N and V2M boards (maintainer,
# 2026-06-12), and U-Boot overwrites the kernel dtb's /memory node
# anyway (ARCH_FIXUP_FDT_MEMORY) with the size from its OWN control DT
# inside the FIP -- so no per-tier kernel dts exists or is needed.
# TODO(firmware-pack): before V2M102 ships, its per-SKU FIP must carry
# the 64 Gbit DRAM size (U-Boot control dts memory@ node + TF-A DDR
# parameters); the shared FIP is currently built for the 8 GiB tier.
# The DEEPX dx-rt runtime remains license-gated
# (recipes-deepx/dx-rt/dx-rt_2.4.bb), opt-in via ALP_ENABLE_DEEPX_DXM1.

PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is image-owned, not set here; this
# machine adds only the silicon-gated DEEPX runtime below.

# DEEPX DX-M1 userspace runtime + PCIe kernel driver. GATED behind an
# explicit opt-in because dx-rt is license-gated + blacklisted (it has no
# redistributable source/LICENSE in this public layer). Set
# ALP_ENABLE_DEEPX_DXM1 = "1" in local.conf only after you have provided a
# licensed dx_rt source + sha256 + LICENSE and cleared SKIP_RECIPE[dx-rt].
ALP_ENABLE_DEEPX_DXM1 ?= "0"
IMAGE_INSTALL:append = "${@' dx-rt kernel-module-dx-rt-npu' if d.getVar('ALP_ENABLE_DEEPX_DXM1') == '1' else ''}"

# DRP-AI3 (RZ/V2N on-die NPU) is the other half of V2M102's dual-NPU
# `capabilities:` declaration, and it is a single opt-in that drives BOTH
# sides of the hardware fact together: the userspace runtime (lib-tvm +
# kernel-module-mmngr, from meta-rz-drpai) AND alp-sdk's compiled-in
# backend (PACKAGECONFIG[drpai], which flips ALP_SDK_USE_DRPAI_V2N=ON in
# src/yocto/CMakeLists.txt). ALP_ENABLE_DRPAI is the RECOMMENDED switch
# for that -- one knob, both halves. It is not enforced: the manual route
# (PACKAGECONFIG:append:pn-alp-sdk = " drpai" in local.conf, with
# ALP_ENABLE_DRPAI left at "0") still compiles the backend in while
# installing neither lib-tvm nor kernel-module-mmngr -- that is the route
# the docs currently instruct, and the route the first successful bake
# (see below) used. Set ALP_ENABLE_DRPAI = "1" in
# local.conf; requires meta-rz-drpai in bblayers.conf (lib-tvm does not
# exist without it -- opting in with the layer absent is caught by an
# anonymous-python guard in alp-image-edge.bb, which fails loudly with a
# named cause instead of an obscure missing-recipe error).  The guard
# lives in the RECIPE, not here: bitbake's ConfHandler.feeder() accepts
# only data assignments, include/require, export, unset and addpylib --
# a `python () { }` block in a .conf raises
# "ParseError: unparsed line: 'python () {'" and kills the machine.
ALP_ENABLE_DRPAI ?= "0"

IMAGE_INSTALL:append = "${@' lib-tvm kernel-module-mmngr' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"
PACKAGECONFIG:append:pn-alp-sdk = "${@' drpai' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"

# Inference runtime selection is silicon-determined (same as V2M101 --
# `capabilities:` declares DRP-AI3 + DEEPX DXM1; the app picks per-handle at
# runtime via alp_inference_open()).  No build-time backend pin.  As on
# V2M101, each vendor dispatcher stays out on THIS (Yocto/BitBake) path
# unless its own opt-in above is set: DEEPX needs ALP_ENABLE_DEEPX_DXM1 =
# "1" (plus a licensed source), DRP-AI3 needs ALP_ENABLE_DRPAI = "1"
# (plus meta-rz-drpai) -- neither is a fallback for ops the other doesn't
# accelerate unless both are enabled.  (The capabilities.drp_ai auto-emit
# of -DALP_SDK_USE_DRPAI_V2N=ON in scripts/alp_orchestrate/kconfig.py is
# the OTHER, direct-cmake enable path -- it does not apply here.)
# src/yocto/inference_drpai.cpp is real MeraDrpRuntimeWrapper code.  A
# drpai-enabled alp-image-edge bake HAS completed twice -- but for
# MACHINE = "e1m-v2m101-a55" (V2M102's sibling), not this machine:
# first with the backend enabled MANUALLY via
# PACKAGECONFIG:append:pn-alp-sdk = " drpai" in local.conf (not via
# ALP_ENABLE_DRPAI, which did not exist at that bake) -- 12118/12118
# tasks attempted, all succeeded; second with that manual override
# commented out so ALP_ENABLE_DRPAI = "1" was the only source of the
# enable -- 12118 tasks attempted, 11223 already satisfied and not
# rerun, all succeeded, producing
# alp-image-edge-e1m-v2m101-a55.rootfs-20260805211027.wic.gz
# (716220145 bytes) with lib-tvm, kernel-module-mmngr, libmmngr1,
# libmmngrbuf1 and mera2-drpai-tvm in the rootfs manifest. Both bakes
# cross-linked libalp_sdk.so against the DRP-AI wrapper library (see
# meta-alp-sdk/recipes-renesas/mera2-drpai-tvm/mera2-drpai-tvm_2.7.0.bb
# for the exported/matched/unresolved symbol counts -- re-derivable
# from a build, not a one-time snapshot). The ALP_ENABLE_DRPAI wiring on
# THIS machine conf -- the IMAGE_INSTALL append, the PACKAGECONFIG
# append, and alp-image-edge.bb's anonymous-python guard -- is
# PARSE-VERIFIED: with the manual PACKAGECONFIG append commented out,
# `bitbake -e alp-sdk` resolves PACKAGECONFIG="mqtt security audio
# drpai" and `bitbake -e alp-image-edge` carries lib-tvm and
# kernel-module-mmngr in IMAGE_INSTALL, both from ALP_ENABLE_DRPAI =
# "1" alone (0 parse errors); with meta-rz-drpai removed from
# bblayers.conf the parse halts and the guard fires with its intended
# text.  The switch itself is BAKE-VERIFIED on the sibling machine
# e1m-v2m101-a55 above, not yet on THIS machine.  NOT proven either
# way: on-silicon inference has never run, and the compiled model was
# quantised against 8 random frames rather than a real calibration set
# (the vendor's 200 calibration images ship as Git LFS pointer stubs in
# this checkout).

ALP_BOOT_DEVICE ?= "emmc"

# Carrier DTB: shared with V2M101 by design -- one family PCB, identical
# DDR connections, and DRAM size comes from the firmware handoff, so a
# memory-tier variant needs no dts of its own.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2m101-x-evk.dtb"

# OTA via Mender (opt-in).
#
#     require conf/distro/include/mender.inc
