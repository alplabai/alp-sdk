#@TYPE: Machine
#@NAME: E1M-V2M102 A55 cluster (V2N + DEEPX DX-M1, variant)
#@DESCRIPTION: Alp Lab E1M-V2M102 SoM -- second V2M variant (V2N
#              base + on-module DEEPX DX-M1 NPU over PCIe).
#              Differs from V2M101 in DRAM density only (the V2N
#              family shares one PCB). A55 Linux cluster MACHINE;
#              M33 system core builds via Zephyr.

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2m102-a55:e1m-v2m102:e1m-v2m101-a55:e1m-v2m101:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n deepx-dxm1"

# STATUS: expected buildable (not yet baked or booted as this MACHINE).
# V2M102 reuses the V2M101 carrier dtb BY DESIGN: the V2N's DDR
# connections are identical on V2N and V2M boards (maintainer,
# 2026-06-12), and U-Boot overwrites the kernel dtb's /memory node
# anyway (ARCH_FIXUP_FDT_MEMORY) with the size from its OWN control DT
# inside the FIP -- so no per-tier kernel dts exists or is needed.
# TODO(firmware-pack): before V2M102 ships, its per-SKU FIP must carry
# the 64 Gbit DRAM size (U-Boot control dts memory@ node + TF-A DDR
# parameters); the shared FIP is currently built for the 8 GiB tier.
# The DEEPX runtime is consumed from DEEPX's own meta-deepx-m1 Yocto
# layer (see conf/machine/include/e1m-v2m-deepx.inc), on by default once that
# layer is in bblayers.conf (ALP_ENABLE_DEEPX_DXM1).

PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is image-owned, not set here; this
# machine adds only the silicon-gated DEEPX runtime below.

require conf/machine/include/e1m-v2m-deepx.inc

# ALP_ENABLE_DRPAI is the other half of V2M102's dual-NPU
# `capabilities:` declaration: it opts in to the DRP-AI3 (RZ/V2N on-die
# NPU) in two ways -- it enables the kernel devicetree node (via
# linux-renesas_%.bbappend's ALP_DRPAI_DT_ENABLE), and -- alp-image-edge
# only -- gates installing the alp-drpai-inference demo
# (alp-image-edge.bb:50-51). It installs no userspace runtime package
# itself. The userspace runtime pair (lib-tvm + kernel-module-mmngr) is
# NOT installed from here or from any ALP_ENABLE_DRPAI gate:
# alp-image-common.inc's ALP_RZ_DRPAI_INSTALL (issue #1176) installs
# that pair, independent of this switch, on every alp-image-* image
# (those that require alp-image-common.inc -- alp-image-base/-edge/
# -prod) once meta-rz-drpai is in bblayers.conf; a non-alp core-image-*
# build does not get that pair from alp-sdk's tree at all. This is one
# of two independent, both-required switches -- the other is alp-sdk's
# PACKAGECONFIG[drpai], set separately in local.conf -- see
# docs/bring-up-drpai-v2n.md section 4 for the full contract. Requires
# meta-rz-drpai in bblayers.conf; opting in without it is caught by a
# guard in alp-image-edge.bb, not here -- bitbake's ConfHandler.feeder()
# cannot parse a `python () { }` block in a .conf.
# On by default whenever meta-rz-drpai is in bblayers.conf: every
# V2N/V2M SKU carries the same on-die DRP-AI3, so a V2x image that has
# the vendor layer gets a working /dev/drpai0.  Set "0" to opt out.
ALP_ENABLE_DRPAI ?= "${@'1' if 'rz-drpai' in (d.getVar('BBFILE_COLLECTIONS') or '').split() else '0'}"

# alp-drpai-inference (the issue #1268 exhibition demo) is NOT
# installed from this MACHINE conf -- that would reach alp-image-prod
# too. It rides the same ALP_ENABLE_DRPAI opt-in via an IMAGE-level
# append in alp-image-edge.bb instead (the IMAGE-level install pattern
# follows the alp-lvgl-dashboard precedent there; the ALP_ENABLE_DRPAI
# gate itself does not -- alp-lvgl-dashboard installs unconditionally).

# Inference runtime selection is silicon-determined (same as V2M101 --
# `capabilities:` declares DRP-AI3 + DEEPX DXM1; the app picks
# per-handle at runtime via alp_inference_open()).  No build-time
# backend pin.  As on V2M101, each vendor dispatcher stays out on THIS
# (Yocto/BitBake) path unless its own opt-in is set.  (The
# capabilities.drp_ai auto-emit of -DALP_SDK_USE_DRPAI_V2N=ON in
# scripts/alp_orchestrate/kconfig.py is the OTHER, direct-cmake enable
# path -- it does not apply here.)
#
# BENCH-UNVERIFIED: no drpai-enabled alp-image-edge bake has completed
# on any host, including V2M101 -- see mera2-drpai-tvm_2.7.0.bb for
# what compile-level checking has (and has not) been done.

ALP_BOOT_DEVICE ?= "emmc"

# Carrier DTB: shared with V2M101 by design -- one family PCB, identical
# DDR connections, and DRAM size comes from the firmware handoff, so a
# memory-tier variant needs no dts of its own.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2m101-x-evk.dtb"

# OTA via Mender (opt-in).
#
#     require conf/distro/include/mender.inc

# CPU inference floor (#1259): opt in to ONNX Runtime (meta-alp-sdk's own
# onnxruntime recipe) via alp-sdk's `ort` PACKAGECONFIG.  It is the LAST
# entry of resolve_auto(), so it never displaces an NPU backend under
# AUTO; it exists so an `.onnx` graph can be opened with an explicit
# ALP_INFERENCE_BACKEND_CPU.  Set "0" to keep it out of the image.
# With the DEEPX runtime on (default with meta-deepx-m1) the default is "0":
# dx-rt already builds against and installs its own libonnxruntime 1.20.1
# (the ORT #1255 was proven on silicon with), and that collides with the
# layer's 1.28.0 package (same libonnxruntime.so files).  Set "1" to force.
ALP_ENABLE_ORT_CPU ?= "${@'0' if d.getVar('ALP_ENABLE_DEEPX_DXM1') == '1' else '1'}"
