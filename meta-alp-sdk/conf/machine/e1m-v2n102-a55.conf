#@TYPE: Machine
#@NAME: E1M-V2N102 A55 cluster (V2N variant)
#@DESCRIPTION: Alp Lab E1M-V2N102 SoM -- second V2N base variant
#              (Renesas RZ/V2N quad-A55 + M33 + DRP-AI3).  Differs
#              from V2N101 in carrier wiring / DDR config per the
#              hand-written HW config (TBD pending the user's
#              authoritative writeup).  This MACHINE targets the
#              A55 Linux cluster; the M33 system core builds via
#              Zephyr (see topology.m33_sm.board in the SoM preset).

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2n102-a55:e1m-v2n102:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n"

PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is image-owned, not set here.

# DRP-AI3 (RZ/V2N on-die NPU) is a single opt-in that drives BOTH sides of
# the hardware fact together: the userspace runtime (lib-tvm +
# kernel-module-mmngr, from meta-rz-drpai) AND alp-sdk's compiled-in
# backend (PACKAGECONFIG[drpai], which flips ALP_SDK_USE_DRPAI_V2N=ON in
# src/yocto/CMakeLists.txt). ALP_ENABLE_DRPAI is the RECOMMENDED switch
# for that -- one knob, both halves. It is not enforced: the manual route
# (PACKAGECONFIG:append:pn-alp-sdk = " drpai" in local.conf, with
# ALP_ENABLE_DRPAI left at "0") still compiles the backend in while
# installing neither lib-tvm nor kernel-module-mmngr -- that is the route
# the docs currently instruct, and the route the first successful bake
# (see below) used. Set ALP_ENABLE_DRPAI = "1" in
# local.conf; requires meta-rz-drpai in bblayers.conf (lib-tvm does not
# exist without it -- opting in with the layer absent is caught by an
# anonymous-python guard in alp-image-edge.bb, which fails loudly with a
# named cause instead of an obscure missing-recipe error).  The guard
# lives in the RECIPE, not here: bitbake's ConfHandler.feeder() accepts
# only data assignments, include/require, export, unset and addpylib --
# a `python () { }` block in a .conf raises
# "ParseError: unparsed line: 'python () {'" and kills the machine.
ALP_ENABLE_DRPAI ?= "0"

IMAGE_INSTALL:append = "${@' lib-tvm kernel-module-mmngr' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"
PACKAGECONFIG:append:pn-alp-sdk = "${@' drpai' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"

# Inference runtime selection is otherwise silicon-determined (same as
# V2N101).  The alp-sdk library compiles the <alp/inference.h> dispatcher
# + portable stubs regardless; src/yocto/inference_drpai.cpp is real
# MeraDrpRuntimeWrapper code, not a stub.  A drpai-enabled alp-image-edge
# bake HAS completed: MACHINE = "e1m-v2m101-a55", backend enabled
# MANUALLY via PACKAGECONFIG:append:pn-alp-sdk = " drpai" in local.conf
# (not via ALP_ENABLE_DRPAI, which did not exist at bake time) --
# 12118/12118 tasks attempted, all succeeded, and libalp_sdk.so
# cross-linked against the DRP-AI wrapper library (see
# meta-alp-sdk/recipes-renesas/mera2-drpai-tvm/mera2-drpai-tvm_2.7.0.bb
# for where that cross-link measurement was recorded). The
# ALP_ENABLE_DRPAI wiring on THIS machine conf -- the IMAGE_INSTALL
# append, the PACKAGECONFIG append, and alp-image-edge.bb's anonymous-
# python guard -- is PARSE-VERIFIED: with the manual PACKAGECONFIG
# append commented out, `bitbake -e alp-sdk` resolves
# PACKAGECONFIG="mqtt security audio drpai" and `bitbake -e
# alp-image-edge` carries lib-tvm and kernel-module-mmngr in
# IMAGE_INSTALL, both from ALP_ENABLE_DRPAI = "1" alone (0 parse
# errors); with meta-rz-drpai removed from bblayers.conf the parse
# halts and the guard fires with its intended text.  The switch itself
# is BAKE-VERIFIED -- on the sibling machine e1m-v2m101-a55, not on
# THIS machine: with the manual PACKAGECONFIG override commented out so
# ALP_ENABLE_DRPAI = "1" was the only source of the enable, a second
# alp-image-edge bake completed (12118 tasks attempted, 11223 already
# satisfied and not rerun, all succeeded), producing
# alp-image-edge-e1m-v2m101-a55.rootfs-20260805211027.wic.gz
# (716220145 bytes) with lib-tvm, kernel-module-mmngr, libmmngr1,
# libmmngrbuf1 and mera2-drpai-tvm in the rootfs manifest and
# libalp_sdk.so.0.15.0 cross-linked against the DRP-AI wrapper library
# (mera2-drpai-tvm_2.7.0.bb, cited above, carries the exported/matched/
# unresolved symbol counts -- re-derivable from a build, not a
# one-time snapshot).  NOT proven either way: on-silicon inference has
# never run, and the compiled model was quantised against 8 random
# frames rather than a real calibration set (the vendor's 200
# calibration images ship as Git LFS pointer stubs in this checkout).
# Apps pick at runtime via alp_inference_open(); the customer cannot
# pin a backend at build time.

ALP_BOOT_DEVICE ?= "emmc"

# Carrier DTB: TBD pending the V2N102 carrier writeup.  Default
# falls back to the V2N101 DTB so the build stays reproducible
# without a V2N102-specific overlay; override when the carrier
# DTB lands.
# Carrier device tree. TODO: V2N102 is a different memory tier -- it
# reuses the V2N101 board dtb for now; create e1m-v2n102-x-evk.dts with
# the correct memory@ size once the V2N102 DDR map is confirmed.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2n101-x-evk.dtb"

