#@TYPE: Machine
#@NAME: E1M-V2N102 A55 cluster (V2N variant)
#@DESCRIPTION: Alp Lab E1M-V2N102 SoM -- second V2N base variant
#              (Renesas RZ/V2N quad-A55 + M33 + DRP-AI3).  Differs
#              from V2N101 in carrier wiring / DDR config per the
#              hand-written HW config (TBD pending the user's
#              authoritative writeup).  This MACHINE targets the
#              A55 Linux cluster; the M33 system core builds via
#              Zephyr (see topology.m33_sm.board in the SoM preset).

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2n102-a55:e1m-v2n102:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n"

PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is image-owned, not set here.

# DRP-AI3 (RZ/V2N on-die NPU) is a single opt-in that drives BOTH sides of
# the hardware fact together: the userspace runtime (lib-tvm +
# kernel-module-mmngr, from meta-rz-drpai) AND alp-sdk's compiled-in
# backend (PACKAGECONFIG[drpai], which flips ALP_SDK_USE_DRPAI_V2N=ON in
# src/yocto/CMakeLists.txt). ALP_ENABLE_DRPAI is the RECOMMENDED switch
# for that -- one knob, both halves. Set ALP_ENABLE_DRPAI = "1" in
# local.conf; requires meta-rz-drpai in bblayers.conf (lib-tvm does not
# exist without it -- opting in with the layer absent is caught by an
# anonymous-python guard in alp-image-edge.bb, which fails loudly with a
# named cause instead of an obscure missing-recipe error).  The guard
# lives in the RECIPE, not here: bitbake's ConfHandler.feeder() accepts
# only data assignments, include/require, export, unset and addpylib --
# a `python () { }` block in a .conf raises
# "ParseError: unparsed line: 'python () {'" and kills the machine.
ALP_ENABLE_DRPAI ?= "0"

# alp-drpai-inference (the issue #1268 exhibition demo -- still-frame
# inference through <alp/inference.h>) rides the SAME opt-in: no second
# switch, so the demo binary can't drift out of sync with the backend it
# needs. It IMAGE_INSTALLs whenever ALP_ENABLE_DRPAI = "1" does, exactly
# like lib-tvm / kernel-module-mmngr above.
IMAGE_INSTALL:append = "${@' lib-tvm kernel-module-mmngr alp-drpai-inference' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"
PACKAGECONFIG:append:pn-alp-sdk = "${@' drpai' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"

# Inference runtime selection is otherwise silicon-determined (same as
# V2N101).  The alp-sdk library compiles the <alp/inference.h> dispatcher
# + portable stubs regardless; src/yocto/inference_drpai.cpp is real
# MeraDrpRuntimeWrapper code, not a stub.  ALP_ENABLE_DRPAI and
# PACKAGECONFIG[drpai] are both new with this change (#1145) and NO
# drpai-enabled alp-image-edge bake has completed with them yet on any
# machine -- see mera2-drpai-tvm_2.7.0.bb for exactly what IS established
# (do_compile succeeds cross-compiling MeraDrpRuntimeWrapper.cpp on an
# x86_64 host up to the final aarch64 link) and what is UNTESTED (the
# final link against the real aarch64 payload, packaging QA, symbol
# resolution, and everything downstream of it: on-silicon inference and
# the compiled model's quantisation accuracy, which used 8 random frames
# rather than RUHMI's real calibration set -- its 200 images ship as
# 129-byte Git LFS pointer stubs in this checkout).  Treat the whole
# switch as BENCH-UNVERIFIED.  Apps pick at runtime via
# alp_inference_open(); the customer cannot pin a backend at build time.
#
# ALP_ENABLE_DRPAI also gates the DRP-AI3 KERNEL node, separately from
# the alp-sdk recipe's "drpai" PACKAGECONFIG above: the same flag decides
# whether the devicetree CLAIMS the NPU (installing the &drpai0 override
# that binds drp_reserved -- consumed by
# recipes-kernel/linux/linux-renesas_%.bbappend's ALP_DRPAI_DT_ENABLE),
# while the PACKAGECONFIG decides whether the SDK BACKEND is compiled in.
# Kept apart on purpose: the backend without the node fails at open()
# with a clear error, the node without the backend is an idle device --
# neither silently half-works. BENCH-UNVERIFIED on DRP-AI silicon.

ALP_BOOT_DEVICE ?= "emmc"

# Carrier DTB: TBD pending the V2N102 carrier writeup.  Default
# falls back to the V2N101 DTB so the build stays reproducible
# without a V2N102-specific overlay; override when the carrier
# DTB lands.
# Carrier device tree. TODO: V2N102 is a different memory tier -- it
# reuses the V2N101 board dtb for now; create e1m-v2n102-x-evk.dts with
# the correct memory@ size once the V2N102 DDR map is confirmed.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2n101-x-evk.dtb"

# OTA via Mender (opt-in).
#
#     require conf/distro/include/mender.inc

