#@TYPE: Machine
#@NAME: E1M-V2M103 A55 cluster (V2N + DEEPX DX-M1, 4 GB / 16 GB)
#@DESCRIPTION: Alp Lab E1M-V2M103 SoM -- V2N base + on-module
#              DEEPX DX-M1 NPU over PCIe, the 4 GB RAM / 16 GB
#              eMMC memory tier of the V2M101 PCB.  This MACHINE
#              targets the A55 Linux cluster; the M33 system core
#              builds via Zephyr (see topology.m33_sm.board in the
#              SoM preset).

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2m103-a55:e1m-v2m103:e1m-v2m101-a55:e1m-v2m101:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n deepx-dxm1"

# STATUS: trusted-firmware-a + u-boot (+ firmware-pack: bl2_bp_*/fip) baked
# clean via bitbake for this MACHINE on alplab-gw (2026-09-24) with the D8S32
# DDR param + 4 GB SDRAM config confirmed in the compiled source/DTB; not yet
# baked into a full alp-image-edge image or booted on real V2M103 silicon.
# V2M103 reuses the V2M101 carrier dtb BY DESIGN: the V2N's DDR
# connections are identical on V2N and V2M boards (maintainer,
# 2026-06-12), and U-Boot overwrites the kernel dtb's /memory node
# anyway (ARCH_FIXUP_FDT_MEMORY) with the size from its OWN control DT
# inside the FIP -- so no per-tier kernel dts exists or is needed.
# Firmware pack: this MACHINE's FIP carries the 4 GB RAM / 16 GB eMMC tier's
# own BL2 DDR param (recipes-bsp/trusted-firmware-a/trusted-firmware-a_%.bbappend,
# ALP_TFA_DDR_SRC keyed on this exact MACHINE) and 4 GB U-Boot SDRAM-size +
# control-DT memory-node patch (recipes-bsp/u-boot/u-boot_%.bbappend,
# 0003-rzv2n-dev-ALP-E1M-4gb-memory-tier.patch, also keyed on this exact
# MACHINE) -- the firmware pack is keyed per SKU, not shared across memory
# tiers, even though this MACHINE's dram_mbit (32768 / 4 GB, metadata/
# e1m_modules/E1M-V2M103.yaml) matches E1M-V2M101's OWN catalogued
# dram_mbit. V2M101 itself still ships the family-default D16S32 (8 GB)
# firmware -- DECIDED, not a placeholder (maintainer, 2026-09-24): firmware
# stays D16S32 for V2M101. Whether the catalogue or the firmware reflects
# V2M101's real production DRAM part/tier remains undecided and is a
# PRODUCTION BLOCKER (see the OPEN comment in e1m-v2m101-a55.conf and
# trusted-firmware-a_%.bbappend). Don't read "V2M101 is 4 GB" as settled.
# The DEEPX runtime is consumed from DEEPX's own meta-deepx-m1 Yocto
# layer (see conf/machine/include/e1m-v2m-deepx.inc), opt-in via
# ALP_ENABLE_DEEPX_DXM1.

PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is image-owned, not set here; this
# machine adds only the silicon-gated DEEPX runtime below.

require conf/machine/include/e1m-v2m-deepx.inc

# Inference runtime selection is silicon-determined (same as V2M101 --
# `capabilities:` declares DRP-AI3 + DEEPX DXM1; the app picks per-handle at
# runtime via alp_inference_open()).  No build-time backend pin.  As on
# V2M101, neither vendor dispatcher is compiled in on THIS (Yocto/BitBake)
# path by default: the alp-sdk recipe passes no ALP_SDK_USE_DEEPX_DXM1, and
# DRP-AI3 is compile-gated behind the recipe's "drpai" PACKAGECONFIG, which
# defaults OFF.  (The capabilities.drp_ai auto-emit of
# -DALP_SDK_USE_DRPAI_V2N=ON in scripts/alp_orchestrate/kconfig.py is the
# OTHER, direct-cmake enable path -- it does not apply here.)
# src/yocto/inference_drpai.cpp is real MeraDrpRuntimeWrapper code, but it
# has never run on DRP-AI silicon and no full alp-image-edge bake has
# completed with it enabled: BENCH-UNVERIFIED.

ALP_BOOT_DEVICE ?= "emmc"

# Carrier DTB: shared with V2M101 by design -- one family PCB, identical
# DDR connections, and DRAM size comes from the firmware handoff, so a
# memory-tier variant needs no dts of its own.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2m101-x-evk.dtb"

# OTA via Mender (opt-in).
#
#     require conf/distro/include/mender.inc

# DRP-AI3 kernel node (on-die NPU).  GATED behind an explicit opt-in,
# separate from the alp-sdk recipe's "drpai" PACKAGECONFIG: this one
# decides whether the devicetree CLAIMS the NPU (installing the &drpai0
# override that binds drp_reserved), the PACKAGECONFIG decides whether
# the SDK BACKEND is compiled in.  Kept apart on purpose -- the backend
# without the node fails at open() with a clear error, the node without
# the backend is an idle device; neither silently half-works.
#
# It is NOT enough for meta-rz-drpai to be in bblayers.conf: that layer
# ships bundled in the RZ/V2N AI SDK BSP, so keying off its presence
# would turn the NPU on for every image built from this MACHINE.  Set
# ALP_ENABLE_DRPAI = "1" in local.conf to opt in.  Consumed by
# recipes-kernel/linux/linux-renesas_%.bbappend (ALP_DRPAI_DT_ENABLE).
# BENCH-UNVERIFIED on DRP-AI silicon -- see #1145.
ALP_ENABLE_DRPAI ?= "0"
