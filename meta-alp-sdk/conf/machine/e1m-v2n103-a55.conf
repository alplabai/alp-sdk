#@TYPE: Machine
#@NAME: E1M-V2N103 A55 cluster (V2N variant, 4 GB / 16 GB)
#@DESCRIPTION: Alp Lab E1M-V2N103 SoM (Renesas RZ/V2N quad-A55 +
#              M33 + DRP-AI3) on the E1M-X-EVK carrier -- the
#              4 GB RAM / 16 GB eMMC memory tier of the V2N101 PCB.
#              This MACHINE targets the A55 Linux cluster; the M33
#              system core builds via Zephyr (see the SoM preset's
#              topology.m33_sm.board).

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2n103-a55:e1m-v2n103:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n"

# Bootloader + kernel + dtb come straight from meta-renesas.
PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is image-owned, not set here.

# DEEPX runtime is NOT installed on V2N103 -- the SoM has no DEEPX
# silicon.  The V2M10x sibling machine confs add dx-rt.

# Inference runtime selection is silicon-determined (same as V2N101).
# The alp-sdk library compiles the <alp/inference.h> dispatcher + portable
# stubs.  The DRP-AI3 backend (src/yocto/inference_drpai.cpp) is real
# MeraDrpRuntimeWrapper code, not a stub, but it is compile-gated behind
# ALP_SDK_USE_DRPAI_V2N and stays OFF unless the alp-sdk recipe's "drpai"
# PACKAGECONFIG is enabled -- it has never run on DRP-AI silicon and no
# full alp-image-edge bake has completed with it enabled, so it is
# BENCH-UNVERIFIED. Apps pick at runtime via alp_inference_open(); the
# customer cannot pin a backend at build time.

# Boot media default -- same as V2N101/V2N102.
ALP_BOOT_DEVICE ?= "emmc"

# Carrier DTB: shared with V2N101 by design -- one family PCB, identical
# DDR connections, and DRAM size comes from the firmware handoff, so a
# memory-tier variant needs no dts of its own (same rationale as the
# V2M102 conf's KERNEL_DEVICETREE comment).
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2n101-x-evk.dtb"

# Firmware pack: the 4 GB RAM / 16 GB eMMC x103 memory tier gets its own
# BL2 DDR param (recipes-bsp/trusted-firmware-a/trusted-firmware-a_%.bbappend,
# ALP_TFA_DDR_SRC keyed on this exact MACHINE) and 4 GB U-Boot SDRAM-size +
# control-DT memory-node patch (recipes-bsp/u-boot/u-boot_%.bbappend,
# 0003-rzv2n-dev-ALP-E1M-4gb-memory-tier.patch, also keyed on this exact
# MACHINE) -- the firmware pack is keyed per SKU, not shared across memory
# tiers, even though this MACHINE's dram_mbit (32768 / 4 GB, metadata/
# e1m_modules/E1M-V2N103.yaml) matches E1M-V2N101's OWN catalogued
# dram_mbit. V2N101 itself still ships the family-default D16S32 (8 GB)
# firmware -- DECIDED, not a placeholder (maintainer, 2026-09-24): firmware
# stays D16S32 for V2N101. Whether the catalogue or the firmware reflects
# V2N101's real production DRAM part/tier remains undecided and is a
# PRODUCTION BLOCKER (see the OPEN comment in e1m-v2n101-a55.conf and
# trusted-firmware-a_%.bbappend). Don't read "V2N101 is 4 GB" as settled.

# OTA via Mender (opt-in).
#
#     require conf/distro/include/mender.inc

# DRP-AI3 kernel node (on-die NPU).  GATED behind an explicit opt-in,
# separate from the alp-sdk recipe's "drpai" PACKAGECONFIG: this one
# decides whether the devicetree CLAIMS the NPU (installing the &drpai0
# override that binds drp_reserved), the PACKAGECONFIG decides whether
# the SDK BACKEND is compiled in.  Kept apart on purpose -- the backend
# without the node fails at open() with a clear error, the node without
# the backend is an idle device; neither silently half-works.
#
# It is NOT enough for meta-rz-drpai to be in bblayers.conf: that layer
# ships bundled in the RZ/V2N AI SDK BSP, so keying off its presence
# would turn the NPU on for every image built from this MACHINE.  Set
# ALP_ENABLE_DRPAI = "1" in local.conf to opt in.  Consumed by
# recipes-kernel/linux/linux-renesas_%.bbappend (ALP_DRPAI_DT_ENABLE).
# BENCH-UNVERIFIED on DRP-AI silicon -- see #1145.
ALP_ENABLE_DRPAI ?= "0"
