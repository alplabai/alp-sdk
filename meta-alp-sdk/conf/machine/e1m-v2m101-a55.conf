#@TYPE: Machine
#@NAME: E1M-V2M101 A55 cluster (V2N + DEEPX DX-M1)
#@DESCRIPTION: Alp Lab E1M-V2M101 SoM -- V2N base + on-module
#              DEEPX DX-M1 NPU over PCIe.  This MACHINE targets
#              the A55 Linux cluster; the M33 system core builds
#              via Zephyr (see topology.m33_sm.board in the SoM
#              preset).

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2m101-a55:e1m-v2m101:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n deepx-dxm1"

# STATUS: buildable -- the V2M carrier device tree
# (renesas/e1m-v2m101-x-evk.dts, see KERNEL_DEVICETREE below) ships via
# the linux-renesas bbappend; first local alp-image-edge bake for this
# MACHINE: 2026-06-12 (boot on the bench still pending). The DEEPX
# dx-rt runtime remains license-gated (recipes-deepx/dx-rt/dx-rt_2.4.bb),
# opt-in via ALP_ENABLE_DEEPX_DXM1 below; without it the image builds
# minus the DX-M1 inference path.

PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is owned by the IMAGE recipe, not
# this hardware conf. This machine adds only the silicon-gated DEEPX runtime
# below.

# DEEPX DX-M1 userspace runtime + PCIe kernel driver. GATED behind an
# explicit opt-in because dx-rt is license-gated + blacklisted (it has no
# redistributable source/LICENSE in this public layer). Set
# ALP_ENABLE_DEEPX_DXM1 = "1" in local.conf only after you have provided a
# licensed dx_rt source + sha256 + LICENSE and cleared SKIP_RECIPE[dx-rt].
ALP_ENABLE_DEEPX_DXM1 ?= "0"
IMAGE_INSTALL:append = "${@' dx-rt kernel-module-dx-rt-npu' if d.getVar('ALP_ENABLE_DEEPX_DXM1') == '1' else ''}"

# Inference runtime selection is silicon-determined -- V2M101's
# `capabilities:` block declares BOTH DRP-AI3 AND DEEPX DXM1, and the app
# picks per-handle at runtime via alp_inference_open(.backend = ...).  No
# build-time backend pin.  But on THIS (Yocto/BitBake) path neither vendor
# dispatcher is compiled in by default: the alp-sdk recipe passes no
# ALP_SDK_USE_DEEPX_DXM1, and DRP-AI3 is compile-gated behind the recipe's
# "drpai" PACKAGECONFIG, which defaults OFF -- so NO DRP-AI3 dispatcher is
# built at all and it is NOT available as a fallback for ops DEEPX doesn't
# accelerate.  The other enable path -- capabilities.drp_ai auto-emitting
# -DALP_SDK_USE_DRPAI_V2N=ON from scripts/alp_orchestrate/kconfig.py --
# drives direct-cmake builds, not this recipe.
# src/yocto/inference_drpai.cpp is real MeraDrpRuntimeWrapper code, not a
# stub, but it has never run on DRP-AI silicon and no full alp-image-edge
# bake has completed with it enabled: BENCH-UNVERIFIED.

ALP_BOOT_DEVICE ?= "emmc"

# V2M board dtb (V2N + DEEPX DXM1). Composed from SoC + SoM + carrier +
# DEEPX dtsi. Override so only the ALP board dtb builds.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2m101-x-evk.dtb"

# OTA via Mender (opt-in).  Uncomment to inherit Mender image
# generation + A/B rootfs partitioning.  Requires meta-mender-core
# in bblayers.conf; reference flow in docs/ota.md.
#
#     require conf/distro/include/mender.inc

# DRP-AI3 kernel node (on-die NPU).  GATED behind an explicit opt-in,
# separate from the alp-sdk recipe's "drpai" PACKAGECONFIG: this one
# decides whether the devicetree CLAIMS the NPU (installing the &drpai0
# override that binds drp_reserved), the PACKAGECONFIG decides whether
# the SDK BACKEND is compiled in.  Kept apart on purpose -- the backend
# without the node fails at open() with a clear error, the node without
# the backend is an idle device; neither silently half-works.
#
# It is NOT enough for meta-rz-drpai to be in bblayers.conf: that layer
# ships bundled in the RZ/V2N AI SDK BSP, so keying off its presence
# would turn the NPU on for every image built from this MACHINE.  Set
# ALP_ENABLE_DRPAI = "1" in local.conf to opt in.  Consumed by
# recipes-kernel/linux/linux-renesas_%.bbappend (ALP_DRPAI_DT_ENABLE).
# BENCH-UNVERIFIED on DRP-AI silicon -- see #1145.
ALP_ENABLE_DRPAI ?= "0"
