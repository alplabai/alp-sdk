#@TYPE: Machine
#@NAME: E1M-V2M101 A55 cluster (V2N + DEEPX DX-M1)
#@DESCRIPTION: Alp Lab E1M-V2M101 SoM -- V2N base + on-module
#              DEEPX DX-M1 NPU over PCIe.  This MACHINE targets
#              the A55 Linux cluster; the M33 system core builds
#              via Zephyr (see topology.m33_sm.board in the SoM
#              preset).

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2m101-a55:e1m-v2m101:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n deepx-dxm1"

# STATUS: buildable -- the V2M carrier device tree
# (renesas/e1m-v2m101-x-evk.dts, see KERNEL_DEVICETREE below) ships via
# the linux-renesas bbappend; first local alp-image-edge bake for this
# MACHINE: 2026-06-12 (boot on the bench still pending). The DEEPX
# dx-rt runtime remains license-gated (recipes-deepx/dx-rt/dx-rt_2.4.bb),
# opt-in via ALP_ENABLE_DEEPX_DXM1 below; without it the image builds
# minus the DX-M1 inference path.

PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is owned by the IMAGE recipe, not
# this hardware conf. This machine adds only the silicon-gated DEEPX runtime
# below.

# DEEPX DX-M1 userspace runtime + PCIe kernel driver. GATED behind an
# explicit opt-in because dx-rt is license-gated + blacklisted (it has no
# redistributable source/LICENSE in this public layer). Set
# ALP_ENABLE_DEEPX_DXM1 = "1" in local.conf only after you have provided a
# licensed dx_rt source + sha256 + LICENSE and cleared SKIP_RECIPE[dx-rt].
ALP_ENABLE_DEEPX_DXM1 ?= "0"
IMAGE_INSTALL:append = "${@' dx-rt kernel-module-dx-rt-npu' if d.getVar('ALP_ENABLE_DEEPX_DXM1') == '1' else ''}"

# DRP-AI3 (RZ/V2N on-die NPU) is the other half of V2M101's dual-NPU
# `capabilities:` declaration, and it is a single opt-in that drives BOTH
# sides of the hardware fact together: the userspace runtime (lib-tvm +
# kernel-module-mmngr, from meta-rz-drpai) AND alp-sdk's compiled-in
# backend (PACKAGECONFIG[drpai], which flips ALP_SDK_USE_DRPAI_V2N=ON in
# src/yocto/CMakeLists.txt). ALP_ENABLE_DRPAI is the RECOMMENDED switch
# for that -- one knob, both halves. It is not enforced: the manual route
# (PACKAGECONFIG:append:pn-alp-sdk = " drpai" in local.conf, with
# ALP_ENABLE_DRPAI left at "0") still compiles the backend in while
# installing neither lib-tvm nor kernel-module-mmngr -- that is the route
# the docs currently instruct, and the route the first successful bake
# (see below) used. Set ALP_ENABLE_DRPAI = "1" in
# local.conf; requires meta-rz-drpai in bblayers.conf (lib-tvm does not
# exist without it -- opting in with the layer absent is caught by an
# anonymous-python guard in alp-image-edge.bb, which fails loudly with a
# named cause instead of an obscure missing-recipe error).  The guard
# lives in the RECIPE, not here: bitbake's ConfHandler.feeder() accepts
# only data assignments, include/require, export, unset and addpylib --
# a `python () { }` block in a .conf raises
# "ParseError: unparsed line: 'python () {'" and kills the machine.
ALP_ENABLE_DRPAI ?= "0"

IMAGE_INSTALL:append = "${@' lib-tvm kernel-module-mmngr' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"
PACKAGECONFIG:append:pn-alp-sdk = "${@' drpai' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"

# Inference runtime selection is silicon-determined -- V2M101's
# `capabilities:` block declares BOTH DRP-AI3 AND DEEPX DXM1, and the app
# picks per-handle at runtime via alp_inference_open(.backend = ...).  No
# build-time backend pin.  On THIS (Yocto/BitBake) path each vendor
# dispatcher stays out unless its own opt-in above is set: DEEPX needs
# ALP_ENABLE_DEEPX_DXM1 = "1" (plus a licensed source), DRP-AI3 needs
# ALP_ENABLE_DRPAI = "1" (plus meta-rz-drpai) -- neither is a fallback
# for ops the other doesn't accelerate unless both are enabled.  The
# other DRP-AI3 enable path -- capabilities.drp_ai auto-emitting
# -DALP_SDK_USE_DRPAI_V2N=ON from scripts/alp_orchestrate/kconfig.py --
# drives direct-cmake builds, not this recipe.
# src/yocto/inference_drpai.cpp is real MeraDrpRuntimeWrapper code, not a
# stub.  A drpai-enabled alp-image-edge bake HAS completed for THIS
# MACHINE (e1m-v2m101-a55) twice: first with the backend enabled
# MANUALLY via PACKAGECONFIG:append:pn-alp-sdk = " drpai" in local.conf
# (not via ALP_ENABLE_DRPAI, which did not exist at that bake) --
# 12118/12118 tasks attempted, all succeeded; second with that manual
# override commented out so ALP_ENABLE_DRPAI = "1" was the only source
# of the enable -- 12118 tasks attempted, 11223 already satisfied and
# not rerun, all succeeded, producing
# alp-image-edge-e1m-v2m101-a55.rootfs-20260805211027.wic.gz
# (716220145 bytes). Both bakes cross-linked libalp_sdk.so against the
# DRP-AI wrapper library (see
# meta-alp-sdk/recipes-renesas/mera2-drpai-tvm/mera2-drpai-tvm_2.7.0.bb
# for the exported/matched/unresolved symbol counts -- re-derivable
# from a build, not a one-time snapshot); the second bake's rootfs
# manifest carries lib-tvm, kernel-module-mmngr, kernel-module-mmngrbuf,
# libmmngr1, libmmngrbuf1 and mera2-drpai-tvm from the ALP_ENABLE_DRPAI
# opt-in alone. BAKE-VERIFIED: ALP_ENABLE_DRPAI = "1" alone -- the
# IMAGE_INSTALL append, the PACKAGECONFIG append, and alp-image-edge.bb's
# anonymous-python guard -- builds and links the DRP-AI payload on THIS
# machine.  NOT proven either way: on-silicon inference has never run,
# and the compiled model was quantised against 8 random frames rather
# than a real calibration set (the vendor's 200 calibration images ship
# as Git LFS pointer stubs in this checkout).

ALP_BOOT_DEVICE ?= "emmc"

# V2M board dtb (V2N + DEEPX DXM1). Composed from SoC + SoM + carrier +
# DEEPX dtsi. Override so only the ALP board dtb builds.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2m101-x-evk.dtb"

# OTA via Mender (opt-in).  Uncomment to inherit Mender image
# generation + A/B rootfs partitioning.  Requires meta-mender-core
# in bblayers.conf; reference flow in docs/ota.md.
#
#     require conf/distro/include/mender.inc
