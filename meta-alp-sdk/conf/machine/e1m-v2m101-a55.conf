#@TYPE: Machine
#@NAME: E1M-V2M101 A55 cluster (V2N + DEEPX DX-M1)
#@DESCRIPTION: Alp Lab E1M-V2M101 SoM -- V2N base + on-module
#              DEEPX DX-M1 NPU over PCIe.  This MACHINE targets
#              the A55 Linux cluster; the M33 system core builds
#              via Zephyr (see topology.m33_sm.board in the SoM
#              preset).

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2m101-a55:e1m-v2m101:e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n deepx-dxm1"

# OPEN: production V2x101 DRAM part/tier undecided (catalogue says 4 GB,
# metadata/e1m_modules/E1M-V2M101.yaml dram_mbit: 32768; firmware is the
# 8 GB D16S32 config, recipes-bsp/trusted-firmware-a/trusted-firmware-a_%.bbappend)
# -- production blocker. Firmware stays D16S32 until this resolves.

# STATUS: buildable -- the V2M carrier device tree
# (renesas/e1m-v2m101-x-evk.dts, see KERNEL_DEVICETREE below) ships via
# the linux-renesas bbappend; first local alp-image-edge bake for this
# MACHINE: 2026-06-12, `drpai` OFF -- the same "first ever" bake
# docs/bring-up-drpai-v2n.md's status banner describes (boot on the bench
# still pending). The DEEPX dx-rt runtime remains license-gated
# (recipes-deepx/dx-rt/dx-rt_2.4.bb),
# opt-in via ALP_ENABLE_DEEPX_DXM1 below; without it the image builds
# minus the DX-M1 inference path.

PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# Runtime payload (alp-sdk + opt-in ROS) is owned by the IMAGE recipe, not
# this hardware conf. This machine adds only the silicon-gated DEEPX runtime
# below.

# DEEPX DX-M1 userspace runtime + PCIe kernel driver. GATED behind an
# explicit opt-in because dx-rt is license-gated + blacklisted (it has no
# redistributable source/LICENSE in this public layer). Set
# ALP_ENABLE_DEEPX_DXM1 = "1" in local.conf only after you have provided a
# licensed dx_rt source + sha256 + LICENSE and cleared SKIP_RECIPE[dx-rt].
ALP_ENABLE_DEEPX_DXM1 ?= "0"
IMAGE_INSTALL:append = "${@' dx-rt kernel-module-dx-rt-npu' if d.getVar('ALP_ENABLE_DEEPX_DXM1') == '1' else ''}"

# ALP_ENABLE_DRPAI is the other half of V2M101's dual-NPU
# `capabilities:` declaration: it opts in to the DRP-AI3 (RZ/V2N on-die
# NPU) userspace runtime install below, and (via
# linux-renesas_%.bbappend's ALP_DRPAI_DT_ENABLE) the kernel devicetree
# node. It is one of two independent, both-required switches -- the
# other is alp-sdk's PACKAGECONFIG[drpai], set separately in
# local.conf -- see docs/bring-up-drpai-v2n.md section 4 for the full
# contract. Requires meta-rz-drpai in bblayers.conf; opting in without
# it is caught by a guard in alp-image-edge.bb, not here -- bitbake's
# ConfHandler.feeder() cannot parse a `python () { }` block in a .conf.
ALP_ENABLE_DRPAI ?= "0"

# alp-drpai-inference (the issue #1268 exhibition demo) is NOT
# installed from this MACHINE conf -- that would reach alp-image-prod
# too. It rides the same ALP_ENABLE_DRPAI opt-in via an IMAGE-level
# append in alp-image-edge.bb instead (the IMAGE-level install pattern
# follows the alp-lvgl-dashboard precedent there; the ALP_ENABLE_DRPAI
# gate itself does not -- alp-lvgl-dashboard installs unconditionally).
IMAGE_INSTALL:append = "${@' lib-tvm kernel-module-mmngr' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"

# Inference runtime selection is silicon-determined -- V2M101's
# `capabilities:` block declares BOTH DRP-AI3 AND DEEPX DXM1, and the
# app picks per-handle at runtime via alp_inference_open(.backend =
# ...).  No build-time backend pin.  On THIS (Yocto/BitBake) path each
# vendor dispatcher stays out unless its own opt-in is set: DEEPX needs
# ALP_ENABLE_DEEPX_DXM1 = "1" (plus a licensed source) above, DRP-AI3
# needs both switches named above -- neither is a fallback for ops the
# other doesn't accelerate unless both are enabled.  The OTHER DRP-AI3
# enable path -- capabilities.drp_ai auto-emitting
# -DALP_SDK_USE_DRPAI_V2N=ON from scripts/alp_orchestrate/kconfig.py --
# drives direct-cmake builds, not this recipe.
#
# BENCH-UNVERIFIED: no drpai-enabled alp-image-edge bake has completed
# on any host, including this one -- see mera2-drpai-tvm_2.7.0.bb for
# what compile-level checking has (and has not) been done.

ALP_BOOT_DEVICE ?= "emmc"

# V2M board dtb (V2N + DEEPX DXM1). Composed from SoC + SoM + carrier +
# DEEPX dtsi. Override so only the ALP board dtb builds.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile).
KERNEL_DEVICETREE = "renesas/e1m-v2m101-x-evk.dtb"

# OTA via Mender (opt-in).  Uncomment to inherit Mender image
# generation + A/B rootfs partitioning.  Requires meta-mender-core
# in bblayers.conf; reference flow in docs/ota.md.
#
#     require conf/distro/include/mender.inc
