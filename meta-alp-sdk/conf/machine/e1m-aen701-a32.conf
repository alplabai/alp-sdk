#@TYPE: Machine
#@NAME: E1M-AEN701 A32 cluster (Alif Ensemble E7)
#@DESCRIPTION: Alp Lab E1M-AEN701 SoM (Alif Ensemble E7: dual
#              Cortex-A32 + Cortex-M55 HP/HE + 2x Ethos-U55) on the
#              E1M EVK.  This MACHINE targets the A32 application
#              cluster (Linux); the two M55 system cores build via
#              Zephyr (see the SoM preset's topology.m55_hp /
#              topology.m55_he boards).
#
#              NON-BUILDABLE PLACEHOLDER -- but no longer for want of
#              first light.  Observed 2026-09-05 on two E1M-AEN803
#              modules, i.e. on E8 silicon and not on E7: the A32 boots
#              Linux 6.12.6 to a live shell on the carrier console, via
#              Secure Enclave -> TF-A BL32 (SP_MIN, AArch32 Secure
#              World) -> Linux as BL33, kernel XIP from MRAM (#1972).
#              That boot was produced from hand-built TF-A + kernel +
#              cramfs artefacts, NOT through any Yocto layer: no
#              bitbake build has ever been run against this MACHINE and
#              no Yocto base machine a Scarthgap build could require
#              exists (#1971).  That is what parks it, not the silicon.
#              No A32 boot has been observed on E7 silicon at all, and
#              E7 is deprioritised on the Alp Lab side on top of that
#              -- we lead with AEN801/E8.  Kept here as the reference
#              E7 carrier path; if E7 is never produced this MACHINE
#              can be dropped.
#
#              Measured 2026-09-05 against a fresh clone of the public
#              repo: github.com/alifsemi/meta-alif-ensemble publishes
#              exactly ONE branch, devkit-ex-b0 (also origin/HEAD).
#              There is no scarthgap branch (#1967); whether a
#              portal-gated scarthgap layer exists behind Alif's login
#              has NOT been confirmed either way.  On the branch that
#              does exist, conf/machine/ holds exactly appkit-e7.conf,
#              devkit-e5.conf and devkit-e7.conf, so devkit-e7 is
#              present and active.
#
#              What actually blocks the require is the layer series,
#              not a missing E7 machine: meta-alif-ensemble declares
#              LAYERSERIES_COMPAT_meta-alif-ensemble = "warrior zeus"
#              and pins LINUX_VERSION ?= "5.4.25", so it cannot be
#              used with the meta-alp-sdk Scarthgap baseline (#1971).
#
#              SKELETON: carrier dtb, TF-A platform/memory map, and boot
#              media are Alp-Lab-specific and marked "# TBD" pending the
#              AEN HW config.

# Inherit the upstream Alif E7 DevKit machine, then override below.  The
# target file does exist -- conf/machine/devkit-e7.conf on the one public
# branch of meta-alif-ensemble, devkit-ex-b0 (there is no scarthgap
# branch, #1967).  The require nevertheless stays COMMENTED OUT: that
# layer is warrior/zeus-era (LAYERSERIES_COMPAT_meta-alif-ensemble =
# "warrior zeus", LINUX_VERSION ?= "5.4.25") and cannot be added to a
# Scarthgap bblayers.conf, so requiring it would not give a buildable
# MACHINE (#1971).
#
# What that costs, stated plainly: with the require commented out there
# is no missing file and this conf PARSES.  Nothing below sets a tune, a
# PREFERRED_PROVIDER_virtual/kernel or a kernel image type, and no base
# supplies them, so a user who selects MACHINE = "e1m-aen701-a32" does
# NOT get a clear "devkit-e7.conf not found".  The expected failure mode
# is a later one, in bitbake's parse / dependency resolution, on an
# unset tune (no DEFAULTTUNE, empty TARGET_ARCH) and an unprovided
# virtual/kernel.  No bitbake run has been performed against this
# MACHINE -- that is the expected behaviour, not an observed one.
#require conf/machine/devkit-e7.conf        # meta-alif-ensemble @devkit-ex-b0 (zeus-era, #1971)

# ---- Alp-Lab E1M-AEN701 carrier overrides ----

MACHINEOVERRIDES =. "e1m-aen701-a32:e1m-aen701:e1m-e7:e1m:"
MACHINE_FEATURES += "alp-sdk e1m aen701 ethos-u55"

# Carrier device tree: a dedicated board dtb composed from the Alif E7
# SoC dtsi + the E1M SoM dtsi + the E1M-EVK carrier dtsi.  Overrides the
# Alif reference dtb (devkit-e7.dtb).
# TBD(alif-hw-config): the carrier .dts is Alp-Lab-authored, pending the
# AEN HW config.
#KERNEL_DEVICETREE = "alif/ensemble/e1m/e1m-aen701.dtb"

# Trusted Firmware-A platform + memory map.  The Alif E7 base uses
# TF-A_PLATFORM "devkit_e7"; the E1M carrier reuses TF-A but its memory
# layout is HW-config-determined.
# TBD(alif-hw-config): confirm TF-A_PLATFORM + the carrier memory map.

# Serial console + boot media inherit the Alif E7 defaults (115200;ttyS0;
# OSPI via the base's OSPI_BOOT switches).  TBD(alif-hw-config): confirm
# the E1M carrier routing before relying on the inherited values.

# Install the alp-sdk runtime alongside the ROS 2 base packages,
# mirroring the other A-cluster machines.  AEN701 carries no DEEPX /
# DRP-AI silicon, so no vendor NPU runtime is installed here -- the
# Ethos-U path lives inside the alp-sdk library.
IMAGE_INSTALL:append = " alp-sdk rclcpp sensor-msgs"

# Inference runtime selection is silicon-determined.  The SoM preset
# (metadata/e1m_modules/E1M-AEN701.yaml) declares preferred_backend
# ethos_u / variant u55; E7 carries two Ethos-U55s (NPU-HP + NPU-HE)
# and no U85.  The alp-sdk library compiles the <alp/inference.h>
# dispatcher; apps pick per-handle at runtime via alp_inference_open().
# No build-time backend pin.

# OTA via Mender (opt-in).  Uncomment to inherit Mender image
# generation + A/B rootfs partitioning.  Requires meta-mender-core
# in bblayers.conf; reference flow in docs/ota.md.
#
#     require conf/distro/include/mender.inc
