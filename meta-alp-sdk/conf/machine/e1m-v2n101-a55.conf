#@TYPE: Machine
#@NAME: E1M-V2N101 A55 cluster (V2N base)
#@DESCRIPTION: Alp Lab E1M-V2N101 SoM (Renesas RZ/V2N quad-A55 +
#              M33 + DRP-AI3) on the E1M-X-EVK carrier.  This
#              MACHINE targets the A55 Linux cluster; the M33
#              system core builds via Zephyr (see the SoM preset's
#              topology.m33_sm.board).

# BSP v6.30 derives carriers from the full EVK machine (the old
# rzv2n.inc include was dropped); override only what differs below.
require conf/machine/rzv2n-evk.conf

MACHINEOVERRIDES =. "e1m-v2n101-a55:e1m-v2n101:"
MACHINE_FEATURES += "alp-sdk e1m v2n"

# Bootloader + kernel + dtb come straight from meta-renesas.
PREFERRED_PROVIDER_virtual/kernel = "linux-renesas"

# NB: runtime payload (alp-sdk, and the opt-in ROS stack) is owned by the
# IMAGE recipe, not this hardware conf -- alp-sdk ships in every alp-image-*,
# ROS is the opt-in alp-ros feature group. A machine conf contributes only
# silicon-determined runtime (e.g. the DEEPX dx-rt append on the V2M confs).

# DEEPX runtime is NOT installed on V2N101 -- the SoM has no DEEPX
# silicon.  V2M101 / V2M102 (sibling machine confs) add dx-rt.

# DRP-AI3 (RZ/V2N on-die NPU) is a single opt-in that drives BOTH sides of
# the hardware fact so they cannot diverge: the userspace runtime
# (lib-tvm + kernel-module-mmngr, from meta-rz-drpai) AND alp-sdk's
# compiled-in backend (PACKAGECONFIG[drpai], which flips
# ALP_SDK_USE_DRPAI_V2N=ON in src/yocto/CMakeLists.txt). A builder must
# not be able to get the runtime libraries without the backend, or the
# reverse -- one source per hardware fact. Set ALP_ENABLE_DRPAI = "1" in
# local.conf; requires meta-rz-drpai in bblayers.conf (lib-tvm does not
# exist without it -- opting in with the layer absent is caught by an
# anonymous-python guard in alp-image-edge.bb, which fails loudly with a
# named cause instead of an obscure missing-recipe error).  The guard
# lives in the RECIPE, not here: bitbake's ConfHandler.feeder() accepts
# only data assignments, include/require, export, unset and addpylib --
# a `python () { }` block in a .conf raises
# "ParseError: unparsed line: 'python () {'" and kills the machine.
ALP_ENABLE_DRPAI ?= "0"

IMAGE_INSTALL:append = "${@' lib-tvm kernel-module-mmngr' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"
PACKAGECONFIG:append:pn-alp-sdk = "${@' drpai' if d.getVar('ALP_ENABLE_DRPAI') == '1' else ''}"

# Inference runtime selection is otherwise silicon-determined.  The
# alp-sdk library compiles the <alp/inference.h> dispatcher + portable
# stubs regardless; src/yocto/inference_drpai.cpp is real
# MeraDrpRuntimeWrapper code, not a stub.  PROVEN (2026-08 bake, with
# ALP_ENABLE_DRPAI = "1"): the alp-image-edge bake completes (12118/12118
# tasks, all succeeded) and libalp_sdk.so cross-links against
# libmera_drpai_wrapper.so (9 symbols matched, 0 unresolved) -- the
# backend builds and links correctly.  NOT proven: on-silicon inference
# has never run, and the compiled model was quantised against 8 random
# frames rather than a real calibration set (the vendor's 200 calibration
# images ship as Git LFS pointer stubs in this checkout).  Builds and
# links; unproven on silicon.  Apps pick at runtime via
# alp_inference_open(); the customer cannot pin a backend at build time.

# Boot media on the V2N101 SoM is eMMC by default; SD-card boot via
# the EVK's microSD slot is supported but not the default.
ALP_BOOT_DEVICE ?= "emmc"

# Carrier device tree: dedicated board dtb composed from the SoC dtsi +
# SoM dtsi + E1M-X-EVK carrier dtsi (meta-alp-sdk/recipes-kernel/linux).
# Override (not append) so only the ALP board dtb is built, not the EVK's.
# NOTE: the U-Boot bootcmd must load this filename (set fdtfile) instead
# of the stock renesas/r9a09g056n48-rzv2n-evk.dtb.
KERNEL_DEVICETREE = "renesas/e1m-v2n101-x-evk.dtb"

# OTA via Mender (opt-in).  Uncomment to inherit Mender image
# generation + A/B rootfs partitioning.  Requires meta-mender-core
# in bblayers.conf; reference flow in docs/ota.md.  Production
# fleets MUST also override MENDER_SERVER_URL + MENDER_TENANT_TOKEN
# in local.conf.
#
#     require conf/distro/include/mender.inc
