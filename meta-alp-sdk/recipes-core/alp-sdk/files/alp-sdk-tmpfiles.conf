#
# /run/alp holds the DRP-AI one-process-per-board lock (drpai.lock).  Root and
# non-root processes MUST lock the same file, so the directory is created at
# boot with the group the drpai udev rule uses (video, alp-drpai-udev), group
# writable, so a video-group process can create/open drpai.lock (mode 0660).
d /run/alp 0775 root video -
