#
# /run/alp holds the DRP-AI one-process-per-board lock (drpai.lock).  Root and
# non-root processes MUST lock the same file, so the directory is created at
# boot with the group the drpai udev rule uses (drpai, alp-drpai-udev), group
# writable, so a drpai-group process can create/open drpai.lock (mode 0660).
# alp-sdk_0.6.bb substitutes the group at install time: "drpai", or "video"
# when the image has no DRP-AI backend (and therefore no drpai group).
d /run/alp 0775 root @ALP_RUN_GROUP@ -
