# Consider the system online once ANY managed link is online.
#
# The E1M-V2N/V2M SoM has two GbE ports (end0/end1) and 80-alp-wired-dhcp
# manages both. Stock systemd-networkd-wait-online waits for every managed
# link, so an image with only one port cabled timed out, failed the unit
# and left the system "degraded" on every boot. --any keeps the "wait for
# the network" guarantee (a board with no link at all still fails) without
# requiring both ports.
[Service]
ExecStart=
ExecStart=@WAIT_ONLINE@ --any
