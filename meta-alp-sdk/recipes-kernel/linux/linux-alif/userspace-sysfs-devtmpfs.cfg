# Make userspace work on the AEN803 A32 (Alif Ensemble E8, AE822).
#
# Deltas on top of linux_alif v6.12-dev's
# arch/arm/configs/devkit_e8_unicore_defconfig.  Both were measured on
# target on 2026-09-05, on Linux 6.12.6 booted to an interactive shell
# on two E1M-AEN803 modules (chain: Secure Enclave -> TF-A BL32
# SP_MIN (AArch32) -> Linux as BL33; no BL1/BL2/BL31, no U-Boot;
# kernel XIP from MRAM, kernel RAM in on-chip SRAM, 7528 kB).
#
#   CONFIG_SYSFS           The E8 defconfig ships
#                          "# CONFIG_SYSFS is not set", so /sys cannot
#                          be mounted at all.  Observed on target:
#                            mount: mounting sysfs on /sys failed: No such device
#                          Cost: enabling sysfs grew xipImage from
#                          2234093 to 2290045 bytes.  The whole MRAM
#                          chain still fits -- it ends at 0x80580000,
#                          the 5.5 MB MRAM top -- but this fragment is
#                          why the margin is what it is, so re-measure
#                          the layout after any further kernel growth.
#   CONFIG_DEVTMPFS_MOUNT  The defconfig has CONFIG_DEVTMPFS=y but
#                          "# CONFIG_DEVTMPFS_MOUNT is not set", so /dev
#                          is not populated automatically.  The rootfs
#                          is a 1 MiB static-busybox-1.36.1 cramfs --
#                          read-only, no mdev/udev -- so the kernel
#                          mounting devtmpfs itself is what gives the
#                          shell its device nodes.
CONFIG_SYSFS=y
CONFIG_DEVTMPFS_MOUNT=y
