# *** DO NOT WIDEN THIS WINDOW WITHOUT RE-MEASURING THE MRAM LAYOUT. ***
#
# The MTD physmap window is what lets the kernel reach the cramfs in
# MRAM, and it is also the only thing keeping a writable MTD device off
# the Secure-Enclave-signed ATOC that sits just above the rootfs.  The
# defconfig value overlaps that ATOC.
#
# MRAM layout measured on 2026-09-05, verified byte-for-byte after a
# cold power cycle on two E1M-AEN803 modules:
#
#   0x80002000  bl32.bin (TF-A SP_MIN, XIP)          20621 B  in ATOC (BOOTLOAD)
#   0x80010000  carrier .dtb                         36462 B  NOT in ATOC
#   0x80020000  xipImage                           2290045 B  in ATOC (A32_APP)
#   0x80380000  rootfs.cramfs (static busybox)     1048576 B  NOT in ATOC
#   0x8057a8f0  AppTocPackage.bin                    22288 B
#                                        ends at 0x80580000 = MRAM top
#
# CONFIG_MTD_PHYSMAP_START is 0x80380000 (the cramfs base).  The E8
# defconfig's CONFIG_MTD_PHYSMAP_LEN=0x200000 runs the window to
# 0x80580000 and so OVERLAPS AppTocPackage.bin at 0x8057a8f0 by 22288
# bytes -- the whole ATOC.  0x1FA000 stops the window 2288 bytes below
# it.  Observed on target with this value:
#
#   physmap platform flash device: [mem 0x80380000-0x80579fff]
#
# The dtb and the cramfs are outside the ATOC by design: the dtb reaches
# the kernel in r2 via TF-A's ARM_PRELOADED_DTB_BASE and the cramfs is
# found through this physmap, so the Secure Enclave inspects neither.
# (That is also why a pure SETOOLS/Flow-A flash cannot place this chain
# -- SETOOLS writes only what the ATOC describes.  Both boards were
# flashed with Flow D, the J-Link MRAM loader.)
CONFIG_MTD_PHYSMAP_LEN=0x1FA000
