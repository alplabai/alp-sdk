# Display stack for the E1M-X carrier RK055HDMIPI4MA0 panel on Display 1
# (himax HX8394-F over the V2N DSI, GPT PWM backlight, GD32-bridge GPIO expander
# for the panel-reset sideband).
#
CONFIG_DRM_PANEL_HIMAX_HX8394=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_PWM=y
CONFIG_GPIO_GD32_BRIDGE=y
CONFIG_CRC_ITU_T=y

# E1M-X I2C3 is proxied by the GD32 IO-MCU (gpio-gd32-bridge's i2c adapter,
# bridge protocol >= 0.17), so the devices on it are ordinary Linux I2C clients:
# the SN65DSI83 DSI-to-LVDS bridge and the ILI210x touch controller.  Their
# interrupts come from the bridge's polled irqchip.
CONFIG_DRM_TI_SN65DSI83=y
CONFIG_TOUCHSCREEN_ILI210X=y

# No TOUCHSCREEN_GOODIX here: the GT911 is a different panel stack; a product
# that carries one enables it itself.
