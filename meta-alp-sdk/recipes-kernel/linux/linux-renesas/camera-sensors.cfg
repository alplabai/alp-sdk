# Camera capture stack + every supported sensor driver, built in for every
# V2N/V2M machine (unconditional, see linux-renesas_%.bbappend), so any camera
# works once its DT is selected -- no rebuild per sensor.  Built in (=y), not
# modules: alp-image-* installs no kernel-modules package, so =m drivers would
# never reach the rootfs.  The CSI-2 receiver / CRU nodes stay disabled in DT
# unless a camera is selected, so building them in costs nothing otherwise.
# A follow-up PR generates this file from metadata/chips/*.yaml.
CONFIG_VIDEO_RZG2L_CSI2=y
CONFIG_VIDEO_RZG2L_CRU=y
CONFIG_VIDEO_IMX219=y
CONFIG_VIDEO_IMX296=y
CONFIG_VIDEO_IMX335=y
CONFIG_VIDEO_OV5647=y
CONFIG_VIDEO_OV9282=y
