# USB device (gadget) support for the E1M-X EVK USB 2.0 port (hsusb node,
# dr_mode = "otg" in e1m-x-evk.dtsi). configfs composite gadget with the
# Ethernet (NCM) and serial (ACM) functions; docs/v2n-usb-otg.md.
#
# Merged only when ALP_ENABLE_USB_GADGET = "1".
#
# BENCH-UNVERIFIED: the symbol names are the mainline ones. Confirm with
# do_kernel_configcheck that the Renesas USBHS controller symbols below
# were not dropped for being unmet, then boot-check /sys/class/udc.
CONFIG_USB_GADGET=y
CONFIG_USB_RENESAS_USBHS=y
CONFIG_USB_RENESAS_USBHS_UDC=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_CONFIGFS_FS=y
