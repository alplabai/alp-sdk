# TAS2563 smart-amp pair on the E1M-X-EVK carrier (U27/U28, I2C0 @0x4D/0x4E,
# I2S0). The mainline ASoC `tas2562` driver covers the TAS2563
# (compatible = "ti,tas2563"); CONFIG_SND_SOC_RCAR is already `=y` in this
# BSP's defconfig. The card is an audio-graph-card2 `multi` link (see
# e1m-x-evk.dtsi), also `=y` in the defconfig -- pinned here so the DT never
# silently loses its card driver.
#
# Re-added after #1171 removed an earlier copy: a codec driver with no DT
# consumer cannot bind. The `ti,tas2563` nodes now land with it in
# e1m-x-evk.dtsi (&i2c0's tas2563_left/tas2563_right).
CONFIG_SND_SOC_TAS2562=y
CONFIG_SND_AUDIO_GRAPH_CARD2=y
