# ALP e1m-x carrier: TAS2563 smart-amp codec (2x U27/U28 on the carrier,
# on E1M_X_I2C0 @ 0x4D/0x4E, I2S0 via the TMUX1574 path-mux).
#
# The mainline ASoC `tas2562` driver covers the TAS2563; it is NOT enabled
# in the linux-renesas 6.1.141-cip43 (AI SDK platform 7.1 / BSP v6.30, kernel SHA 6717c06c)
# defconfig, so turn it on here.
#
# STATUS: e1m-x-evk.dtsi now adds the ti,tas2563 codec nodes + audio-graph
# playback path (issue #1171) -- SSI1/SSI2 pinmux is flagged there as an
# unresolved conflict against i2c6_pins/i2c7_pins pending schematic
# confirmation, and amp shutdown/fault GPIOs + IV-sense capture are still
# open TODOs, so this remains dtc-clean/build-only, not bench-verified.
CONFIG_SND_SOC_TAS2562=y
