# On-module real-time clock: Micro Crystal RV-3028-C7 on BRD_I2C (0x52).
# The SoC's own RTC (rtca3, RTXIN/RTXOUT) has no crystal fitted on the
# E1M V2N-family SoM and is disabled in the devicetree (e1m-v2n-som.dtsi);
# this is the RTC of record instead. Built-in (=y), not a module, so
# hwclock has a working /dev/rtc0 at early boot (initramfs-less rootfs
# time-sync) rather than racing module load order.
CONFIG_RTC_DRV_RV3028=y
