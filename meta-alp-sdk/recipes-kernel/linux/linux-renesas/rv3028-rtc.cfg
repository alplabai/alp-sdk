# On-module real-time clock: Micro Crystal RV-3028-C7 on BRD_I2C (0x52).
# This is the RTC of record (rtc0 alias, e1m-v2n-som.dtsi). The SoC's
# own RTC (rtca3, RTXIN/RTXOUT) is ALSO enabled in the devicetree -- see
# e1m-v2n-som.dtsi's &rtc comment -- but is a second, SoC-internal
# timebase, not a replacement. Built-in (=y), not a module, so hwclock
# has a working /dev/rtc0 at early boot (initramfs-less rootfs
# time-sync) rather than racing module load order.
CONFIG_RTC_DRV_RV3028=y
