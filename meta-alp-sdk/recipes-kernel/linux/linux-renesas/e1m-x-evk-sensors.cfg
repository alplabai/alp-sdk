# E1M-X-EVK carrier sensor bus (XEVK_I2C_BUS_SENSORS / E1M_X_I2C0, Linux
# i2c-0) driver enables. See metadata/boards/e1m-x-evk.yaml `i2c_devices:`
# and meta-alp-sdk/recipes-kernel/linux/linux-renesas/e1m-x-evk.dtsi's
# &i2c0 child nodes for the addresses these bind.
#
# TCAL9538 (U35 @0x73, U37 @0x71) needs no entry here: GPIO_PCA953X is
# already =y in this kernel's defconfig and its in-tree "nxp,pca9538"
# compatible binds both register-compatible expanders as-is (ADR 0017
# Tier-1 -- no patch, just the &i2c0 DT nodes).
#
# BMP581 (0x47) and ICM-42670 (0x69) are NOT enabled here: no upstream
# driver binds either part today at this kernel version -- see this
# change's changelog fragment / the tracking issue for what was checked
# and why. No DT child node is added for them either, to avoid shipping
# a devicetree compatible string with no matching binding.
CONFIG_IIO=y

# INA236 x5 (U21/U30/U31/U32/U34) -- TI INA236 is register- and
# electrically-compatible with TI INA232 (both 1.6 mV bus-voltage LSB,
# 2.5 uV shunt LSB); ina2xx has no dedicated INA236 entry, so the DT
# nodes bind "ti,ina232". See 0008-hwmon-ina2xx-add-ina232-ina236-compat.patch
# (backport of upstream commit d1db9b08fbf3, adapted for this driver's
# 6.1.141-cip43 struct shape).
CONFIG_SENSORS_INA2XX=y

