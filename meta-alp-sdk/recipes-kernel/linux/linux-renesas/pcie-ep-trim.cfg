# Trim PCIe endpoint-mode and test options that no E1M product uses.  The
# Renesas BSP defconfig enables them for the EVK, which can switch pcie0
# between root-complex and endpoint mode; E1M-V2M uses root-complex mode only
# (the DEEPX DX-M1 on e1m-v2m-deepx.dtsi) through PCIE_RENESAS_RZG3S_HOST,
# which stays untouched.  Image hygiene only (audit PCIE-5).
# CONFIG_PCIE_RZ_EP is not set
# CONFIG_PCI_EPF_TEST is not set
# CONFIG_PCI_ENDPOINT_TEST is not set
# CONFIG_PCIE_RCAR_HOST is not set
# CONFIG_PCIE_RCAR_EP is not set
