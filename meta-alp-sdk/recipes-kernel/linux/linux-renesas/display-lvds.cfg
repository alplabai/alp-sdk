# DSI-to-LVDS bridge and I2C touch controller for a panel on the E1M-X
# I2C3 segment (Linux reaches that bus through the GD32 bridge I2C proxy,
# see 0022-gpio-gd32-bridge-i2c3-proxy-adapter-and-polled-irqchip.patch).
# Both options exist in linux-renesas 6.1.141.
CONFIG_DRM_TI_SN65DSI83=y
CONFIG_TOUCHSCREEN_ILI210X=y
