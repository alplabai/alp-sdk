# LVDS panel path for the E1M-X J6 display (bench): TI SN65DSI83 DSI-to-LVDS
# bridge and an Ilitek ILI210X-family touch controller, both on the I2C3
# adapter the GD32 bridge exposes (e1m_x_i2c3).  Built in (=y) so the probe
# runs without an initramfs module step.
CONFIG_DRM_TI_SN65DSI83=y
CONFIG_TOUCHSCREEN_ILI210X=y
