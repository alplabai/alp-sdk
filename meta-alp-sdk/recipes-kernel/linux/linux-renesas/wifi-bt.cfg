# On-module Murata LBEE5HY2FY-922 (Infineon CYW55513) Wi-Fi + BT.
#
# The Wi-Fi side is driven by the OUT-OF-TREE cyw-fmac backports kmod
# (meta-alp-sdk/recipes-kernel/cyw-fmac/), not the in-tree brcmfmac: the
# stock 6.1-cip43 brcmfmac has no CYW55513/CYW55500 chip ID. Two config
# facts make that possible:
#
#   - CONFIG_CFG80211=m (NOT unset, NOT builtin=y). The backports tree's
#     brcmfmac needs net_device.ieee80211_ptr, which only exists when
#     CFG80211 is configured at all; and its own cfg80211.ko must be able
#     to install under .../updates/ and win depmod priority over an
#     in-tree module -- which requires the in-tree one to BE a module.
#   - CONFIG_BRCMFMAC is unset. Leaving the in-tree brcmfmac enabled would
#     let it grab the SDIO device first (wrong chip ID, would just fail
#     probe) and, worse, its own in-tree cfg80211 dependency link confuses
#     depmod's module-vs-module priority the backports tree relies on.
#
# CONFIG_CFG80211_REQUIRE_SIGNED_REGDB is left unset deliberately: turning
# it on needs CONFIG_SYSTEM_DATA_VERIFICATION wired through the whole
# regulatory-database load path, and a kernel/module build mismatch during
# 2026-06 bench bring-up surfaced it as "Unknown symbol
# verify_pkcs7_signature" at cfg80211.ko load -- the exact class of break
# this SoC's older 6.1.141-cip43 base does not need for basic wireless-regdb
# to load. Revisit only alongside a real requirement to verify a signed
# regulatory.db.
CONFIG_CFG80211=m
# CONFIG_CFG80211_REQUIRE_SIGNED_REGDB is not set
# CONFIG_BRCMFMAC is not set
# CONFIG_BRCMUTIL is not set
# brcmfmac (backports tree, same as in-tree) is a FullMAC driver -- it
# talks to CFG80211 directly and never links against mac80211, which is
# only for SoftMAC drivers. Leaving it on would build a module nothing
# here loads.
# CONFIG_MAC80211 is not set

# Bluetooth: hci_uart with the H4 + Broadcom vendor extension (baud-rate
# ramp, .hcd patch load, shutdown-gpios) for the on-module CYW55513 BT
# core on SCI4 (see e1m-v2n-som.dtsi's `bluetooth` child node under &sci4).
#
# Modules (=m), NOT built in: built in, hci_uart_bcm probes before the
# root filesystem is mounted, its request for the brcm/BCM.hcd patch fails
# ("Patch file not found") and hci0 setup then times out on opcode 0x1003
# (bench, E1M-V2M103, 2026-09-27). As modules they load after rootfs. The
# image installs them explicitly: kernel-module-bluetooth / -hci-uart /
# -btbcm in ALP_V2N_WIFI_BT_INSTALL (alp-image-common.inc). The crypto the
# BT core needs is built in, so bluetooth.ko never fails with "Unknown
# symbol crypto_ecdh_key_len".
CONFIG_BT=m
CONFIG_BT_HCIUART=m
CONFIG_BT_HCIUART_H4=y
CONFIG_BT_HCIUART_BCM=y
CONFIG_BT_BCM=m
CONFIG_CRYPTO_ECDH=y
CONFIG_CRYPTO_ECC=y

# The gpio-gd32-bridge driver (0005 patch, WL_REG_ON/BT_REG_ON lines
# 18/19) already selects this via its Kconfig `select CRC_ITU_T`; listed
# here too so the dependency is visible next to the Wi-Fi/BT fragment
# that actually needs those two GPIO lines up.
CONFIG_CRC_ITU_T=y

# CONFIG_GPIO_GD32_BRIDGE is also set in display.cfg, but that fragment
# is only appended on e1m-v2n101/e1m-v2m101 (the two SKUs with Display 1
# wired). wifi-bt.cfg is unconditional across all six V2N-family SKUs
# (see the bbappend), and every one of them has WL_REG_ON/BT_REG_ON on
# gd32_gpio lines 19/18 (&sdhi2 mmc-pwrseq, &sci4 shutdown-gpios) -- so
# this fragment must select the driver itself rather than depend on
# display.cfg having done it on a subset of machines.
CONFIG_GPIO_GD32_BRIDGE=y
