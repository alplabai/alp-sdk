# CSI-2 receiver + CRU + IMX219 / OV9281 sensor drivers for the opt-in CAM0
# path (ALP_ENABLE_CAM0_IMX219 or ALP_ENABLE_CAM0_OV9281 = "1", #1149, #2612).  Config symbols are the RZ/G2L-
# family names carried by the Renesas BSP kernel; the OV9282 and RZG2L CSI2/CRU
# configs are confirmed in 6.1.141-cip43 on V2M103 (IMX219 still unverified).
CONFIG_VIDEO_RZG2L_CSI2=y
CONFIG_VIDEO_RZG2L_CRU=y
# Also built in by camera-sensors.cfg; repeated here so this opt-in fragment
# stays self-contained.
CONFIG_VIDEO_IMX219=y
CONFIG_VIDEO_OV9282=y
