# On-module temperature sensor: TI TMP112 on BRD_I2C (0x40, ADD0 strap
# on the fitted TMP112DIDPWR package -- see temp_sensor in each
# metadata/e1m_modules/E1M-V2{N,M}10{1,2,3}.yaml). Upstream binds the
# "ti,tmp112" compatible in the lm75 hwmon driver; without it the part
# ACKs on the bus but no /sys/class/hwmon entry exists.
CONFIG_SENSORS_LM75=y
