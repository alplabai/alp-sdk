# ALP boot fixups -- V2M101 / V2M102 (issue #1175).
#
# CONFIG_ALP_FDT_FILE selects the board dtb that CONFIG_BOOTCOMMAND (patch
# 0002, include/configs/rzv2n-dev.h) reloads after bootcmd_check on BOTH the
# microSD and the eMMC branch, overwriting the vendor sd2load / emmcload
# env's hardcoded (and wrong) boot/r9a09g056n44-dev.dtb.  Must match the
# basename of KERNEL_DEVICETREE for these MACHINEs -- see
# conf/machine/e1m-v2m101-a55.conf / e1m-v2m102-a55.conf
# (renesas/e1m-v2m101-x-evk.dtb; V2M102 reuses the V2M101 board dtb by
# design -- one family PCB, identical DDR connections).
CONFIG_ALP_FDT_FILE="e1m-v2m101-x-evk.dtb"

# CONFIG_ALP_SD_ROOT: root device for the microSD branch.  The vendor
# default (/dev/mmcblk2p2, from prodsdbootargs) does not match this carrier
# -- the ALP board DT enables exactly two MMC hosts and states the carrier
# card is /dev/mmcblk1p2 (e1m-x-evk.dtsi:88-89).
# NOT BENCH-CONFIRMED: the microSD boot path appears never to have been
# exercised on real hardware.  One console boot settles it.
CONFIG_ALP_SD_ROOT="/dev/mmcblk1p2"
