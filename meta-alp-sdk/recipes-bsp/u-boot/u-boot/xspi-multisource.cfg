# Multi-source xSPI NOR support (E1M V2N-family SoMs).
#
# The on-module xSPI NOR is a multi-source slot (several approved vendors,
# see metadata/e1m_modules/E1M-V2*.yaml on_module.nor_flash_class; the
# approved-MPN list lives in the private BOM). U-Boot identifies the part
# from its JEDEC id, so every vendor family a approved part can come from
# must have its vendor-select symbol on: spi-nor-ids.c carries the ids
# upstream, only the per-vendor Kconfig select gates them. Winbond and
# STMicro/Micron are already on in rzv2n-dev_defconfig; repeated here so
# this fragment is the one complete list.
#
# NOT enabled: CONFIG_SPI_FLASH_SFDP_SUPPORT (generic SFDP probe for ids not
# in the table). It `depends on !SPI_FLASH_BAR`, and BAR must stay on: the
# Renesas xSPI driver (drivers/spi/rzv2h-xspi.c, a legacy spi_xfer driver)
# hard-codes a 3-byte address (ADDSIZE 3, 24-bit offset), so >16 MiB is
# reached only through the bank/extended-address register. Dropping BAR
# would make the SPI-NOR core issue 4-byte-address commands this driver
# cannot encode. Enabling SFDP is therefore gated on 4-byte-address support
# in that driver (follow-up).
#
# KNOWN LIMIT: reads crossing the 16 MiB boundary fail in this U-Boot's
# Renesas xSPI driver (bench-observed "Read: ERROR 1" at 0xFFFF00 + 0x200
# -- i.e. spanning 0x1000000). Writes above 16 MiB are untested. Boot
# content (FIP, env, any xSPI-resident stage) must stay below 16 MiB
# until that driver limit is fixed upstream.
CONFIG_SPI_FLASH_GIGADEVICE=y
CONFIG_SPI_FLASH_MACRONIX=y
CONFIG_SPI_FLASH_WINBOND=y
CONFIG_SPI_FLASH_ISSI=y
CONFIG_SPI_FLASH_STMICRO=y
