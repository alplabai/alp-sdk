# meta-alp-sdk: force the DA9292 DEEPX 0.75V rail bring-up step in
# board_late_init() (see 0004-rzv2n-dev-ALP-E1M-DEEPX-rail-bringup.patch)
# even before the on-module EEPROM manifest is checked.
#
# WHY forced here rather than relying solely on the patch's own
# alp_som_is_v2n_m1() EEPROM-manifest gate: this .cfg is wired ONLY for
# the V2M MACHINEs (physically V2N-M1 hardware by construction), so the
# rail step must run regardless of whether that unit's EEPROM has been
# burned with a valid "v2n-m1" family manifest yet.  It is redundant,
# not a relaxation, on any board whose manifest already matches --
# alp_deepx_pcie_bringup() (mux + M1_RESET release) keeps its OWN
# unchanged alp_som_is_v2n_m1() gate, so this Kconfig alone can never
# release M1_RESET on hardware the EEPROM does not confirm is V2N-M1.
#
# V2N base machines never get this fragment (no SRC_URI:append for
# them) -- the DA9292 program/enable sequence never runs there, and
# nothing on that build touches the PMIC.
CONFIG_ALP_E1M_DEEPX_RAIL=y
