# meta-alp-sdk: persistent, redundant U-Boot environment in eMMC boot partition 2
# (patch 0014 removes the "env default -a" that used to wipe it every boot),
# restricted to a write allowlist so only the OTA variables persist.
#
# Why persistent.  Issue #2637 first recorded env-nowhere (CONFIG_ENV_IS_NOWHERE)
# as the fix for "bad CRC, using default environment".  The maintainer's later
# decision (work ledger Q2, 2026-10-03: do the best as a SoM manufacturer)
# supersedes that: a redundant environment on the eMMC boot partition, with
# fw_setenv for OTA.  The write allowlist below keeps what env-nowhere gave --
# nothing that controls booting can be changed by a saved environment.
#
# Write allowlist.  CONFIG_ENV_WRITEABLE_LIST makes the compiled-in default the
# baseline on every boot and imports only the variables listed in
# CFG_ENV_FLAGS_LIST_STATIC (patch 0014, include/configs/rzv2n-dev.h) from the
# saved copy: the Mender variables and the alp_envinit marker.  bootcmd,
# bootargs, bootdelay, bootstopkey*, preboot and the vendor boot scripts
# (bootcmd_check, emmcload, sd2load, ...) are always rebuilt from the binary, so
# a root shell's fw_setenv cannot reopen a locked production console or run a
# stale vendor script after a FIP upgrade.
#
# Placement.  Boot partition 2 (Linux /dev/mmcblk0boot1, CONFIG_SYS_MMC_ENV_PART
# = 2) is where provisioning writes the bootloader today
# (scripts/provision/linux_target.py emmc_boot1_write_verify: bl2_mmc from
# sector 1, the FIP from sector 0x300), and EXT_CSD[179] = 0x08 selects boot
# partition 1 (mmcblk0boot0) per JEDEC, so which one the BootROM reads is not
# settled here.  Either way the environment cannot collide with a boot image:
# the copies sit above the largest image the provisioning gate accepts and
# the Linux write refuses to reach them.
#
#     0x220000  copy 1   (CONFIG_ENV_OFFSET)
#     0x230000  copy 2   (CONFIG_ENV_OFFSET_REDUND)
#
# each CONFIG_ENV_SIZE = 0x10000 bytes, so the pair ends at 0x240000
# (2.25 MiB).  The offsets are positive (relative to the start of the
# partition) on purpose: 0x220000 is above the end of the largest FIP the
# provisioning gate accepts (sector 0x300 = 0x60000, plus 0x1A0000).  The
# layout is the SoM preset's on_module.emmc_boot block (metadata/e1m_modules/
# E1M-V2*.yaml); this file, /etc/fw_env.config in the image
# (recipes-core/alp-system/files/fw_env.config), mender.inc's
# MENDER_UBOOT_ENV_STORAGE_DEVICE_OFFSET_1/_2 and provisioning's gates.py
# are held equal to it by tests/scripts/test_uboot_env_layout.py.  That the
# boot partition holds the pair (BOOT_SIZE_MULT of the populated part) is
# the preset's emmc_boot.partition_bytes; while it reads TBD,
# docs/bring-up-v2n.md section 7a step 1 is the gate (saveenv fails on a
# smaller partition).
#
# CONFIG_ENV_SIZE / CONFIG_ENV_OFFSET override the vendor defconfig
# (0x20000 / 0xFFFE0000, the end of the eMMC user area).
CONFIG_ENV_IS_IN_MMC=y
CONFIG_SYS_MMC_ENV_DEV=0
CONFIG_SYS_MMC_ENV_PART=2
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_SIZE=0x10000
CONFIG_ENV_OFFSET=0x220000
CONFIG_ENV_OFFSET_REDUND=0x230000
CONFIG_ENV_APPEND=y
CONFIG_ENV_WRITEABLE_LIST=y
