# meta-alp-sdk: persistent, redundant U-Boot environment in eMMC boot
# partition 2 (patch 0014 removes the "env default -a" that used to wipe it
# every boot).
#
# Placement.  eMMC boot partition 1 (Linux /dev/mmcblk0boot0) is the one
# the BootROM boots from (EXT_CSD[179] = 0x08) and holds the bootloader;
# boot partition 2 (Linux /dev/mmcblk0boot1, CONFIG_SYS_MMC_ENV_PART = 2)
# is otherwise unused, so the environment cannot collide with an image
# written for boot.  Both copies live there:
#
#     0x220000  copy 1   (CONFIG_ENV_OFFSET)
#     0x230000  copy 2   (CONFIG_ENV_OFFSET_REDUND)
#
# each CONFIG_ENV_SIZE = 0x10000 bytes, so the pair ends at 0x240000
# (2.25 MiB).  The offsets are positive (relative to the start of the
# partition) on purpose: 0x220000 is above the end of the largest FIP the
# provisioning gate accepts (sector 0x300 = 0x60000, plus 0x1A0000), which
# keeps a bootloader written to the partition well clear of them, and well
# inside any boot partition of 4 MiB.  /etc/fw_env.config in the image
# (recipes-core/alp-system/files/fw_env.config) must carry the same
# offsets and size (tests/scripts/test_uboot_env_layout.py).
#
# CONFIG_ENV_SIZE / CONFIG_ENV_OFFSET override the vendor defconfig
# (0x20000 / 0xFFFE0000, the end of the eMMC user area).
CONFIG_ENV_IS_IN_MMC=y
CONFIG_SYS_MMC_ENV_DEV=0
CONFIG_SYS_MMC_ENV_PART=2
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_SIZE=0x10000
CONFIG_ENV_OFFSET=0x220000
CONFIG_ENV_OFFSET_REDUND=0x230000
