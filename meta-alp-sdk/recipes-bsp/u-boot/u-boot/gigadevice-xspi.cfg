# GigaDevice LX-family xSPI NOR support (production E1M V2N-family SKUs).
#
# Some production E1M V2N-family modules carry a GigaDevice LX-family
# octal xSPI NOR in the "NOR flash (variant per SKU)" slot
# (docs/soms/v2n.md) -- bench-proven: U-Boot's `sf probe`
# detects the part and reports the correct capacity once this symbol
# is on. This U-Boot's `drivers/mtd/spi/spi-nor-ids.c` already carries
# the GigaDevice LX-family JEDEC IDs upstream; only the vendor-select
# Kconfig symbol is off in rzv2n-dev_defconfig.
#
# KNOWN LIMIT (bench-proven): reads/writes crossing the 16 MiB boundary
# fail in this U-Boot's Renesas xSPI driver ("Read: ERROR 1" at
# 0xFFFF00 + 0x200 -- i.e. spanning 0x1000000). Boot content (FIP,
# env, any xSPI-resident stage) must stay below 16 MiB until that
# driver limit is fixed upstream.
CONFIG_SPI_FLASH_GIGADEVICE=y
