# Verified kernel boot (ALP_FIT_SIGNED=1, conf/include/alp-fit-signing.inc).
# CONFIG_BOOTCOMMAND loads boot/fitImage and bootm's it (patch 0018).  With
# FIT_SIGNATURE bootm verifies the configuration node against the "required"
# RSA key that the build adds to this U-Boot's control dtb (Yocto
# uboot-sign.bbclass), and refuses to boot a configuration that does not
# verify.
CONFIG_ALP_E1M_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
# Only FITs are bootable: no legacy uImage fallback (patch 0018 #errors if
# this is left on).
CONFIG_LEGACY_IMAGE_FORMAT=n
# Nothing to boot around the signature check, and no way to stop autoboot
# (-2 = autoboot, a keypress cannot interrupt it): the raw-image boot
# commands and go are not built, and a failed boot resets (patch 0018).
CONFIG_CMD_BOOTI=n
CONFIG_CMD_BOOTZ=n
CONFIG_CMD_GO=n
CONFIG_BOOTDELAY=-2
# bootelf, EFI, the network / serial-download commands and "source" would
# also run code that is not covered by the FIT signature.
CONFIG_CMD_ELF=n
CONFIG_CMD_BOOTEFI=n
CONFIG_EFI_LOADER=n
CONFIG_BOOTMETH_EFILOADER=n
CONFIG_CMD_NET=n
CONFIG_CMD_LOADB=n
CONFIG_CMD_LOADS=n
CONFIG_CMD_SOURCE=n
