# meta-alp-sdk: read the carrier microSD card-detect pad in U-Boot
# (0013-rzv2n-dev-ALP-E1M-sd-card-detect.patch). Included only when the
# carrier wires a card-detect switch to the SoM's SD1_SD1CD pad
# (metadata sd_slots.SD1.card_detect; ALP_CARRIER_SD1_CARD_DETECT in
# u-boot_%.bbappend). Bank/pin are that pad on the E1M-V2N/V2M:
# metadata/e1m_modules/v2n/renesas-peripheral-map.tsv, SD1_SD1CD = PA1
# (bank 10 = PA); tests/scripts/test_uboot_sd_card_detect.py enforces it.
CONFIG_ALP_E1M_SD1_CD=y
CONFIG_ALP_E1M_SD1_CD_BANK=10
CONFIG_ALP_E1M_SD1_CD_PIN=1
