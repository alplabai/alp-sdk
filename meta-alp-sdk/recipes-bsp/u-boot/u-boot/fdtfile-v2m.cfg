# ALP: V2M board dtb selection for CONFIG_BOOTCOMMAND (alp-sdk#1252).
#
# The V2M MACHINEs build renesas/e1m-v2m101-x-evk.dtb
# (meta-alp-sdk/conf/machine/e1m-v2m101-a55.conf and
# e1m-v2m102-a55.conf -- v2m102 reuses the v2m101 dtb today), while the
# u-boot default suits the V2N SKUs.  Both families share one u-boot
# binary, so the dtb name has to come from the build rather than from a
# literal in include/configs/rzv2n-dev.h.
#
# Basename only: KERNEL_DEVICETREE's "renesas/" prefix is stripped by the
# deploy step, so the file lands at boot/<basename> on the target.
#
# Failure mode this closes: ext4load of a filename the image does not
# contain used to be non-fatal, so a V2M board loaded nothing and booted
# whatever dtb already sat at 0x48000000.
CONFIG_ALP_E1M_FDTFILE="e1m-v2m101-x-evk.dtb"
