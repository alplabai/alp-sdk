# ALP: V2M fallback board dtb for CONFIG_BOOTCOMMAND (alp-sdk#1252).
#
# The dtb U-Boot loads is normally chosen at boot from the on-module EEPROM
# manifest family by the alp_fdtfile command (patch 0014).
# CONFIG_ALP_E1M_FDTFILE is only the fallback: it is used when the manifest
# is missing or invalid (a blank-EEPROM unit), the family is unknown, or the
# derived file is absent from the image.  A V2M MACHINE's image holds
# renesas/e1m-v2m101-x-evk.dtb (meta-alp-sdk/conf/machine/e1m-v2m101-a55.conf,
# e1m-v2m102-a55.conf, and e1m-v2m103-a55.conf -- v2m102/v2m103 reuse the
# v2m101 dtb today), while the u-boot default suits the V2N SKUs, so a V2M
# build overrides the default here.  Both families share one u-boot binary,
# so the fallback has to come from the build rather than from a literal in
# include/configs/rzv2n-dev.h.
#
# Basename only: KERNEL_DEVICETREE's "renesas/" prefix is stripped by the
# deploy step, so the file lands at boot/<basename> on the target.
#
# The final load attempt is fatal: if neither the derived name nor this
# fallback loads, bootcmd stops at the prompt instead of booting whatever dtb
# already sat at 0x48000000.
CONFIG_ALP_E1M_FDTFILE="e1m-v2m101-x-evk.dtb"
