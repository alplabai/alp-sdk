# Mender A/B boot (meta-alp-sdk conf/distro/include/mender.inc), selected by
# u-boot_%.bbappend only when Mender's U-Boot integration (MENDER_FEATURES
# mender-uboot) is on.  CONFIG_BOOTCOMMAND then boots the slot Mender chose
# (patch 0018).  meta-mender's config_mender.h refuses to build without the
# two bootcount symbols: U-Boot counts every boot in the environment
# ("bootcount") and runs altbootcmd (a slot swap) once it passes "bootlimit"
# while upgrade_available=1.
CONFIG_ALP_E1M_MENDER=y
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y
