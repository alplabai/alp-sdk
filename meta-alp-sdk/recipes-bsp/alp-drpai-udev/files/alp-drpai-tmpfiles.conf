#
# /run/alp holds the DRP-AI one-process-per-board lock (drpai.lock).  Root and
# non-root processes MUST lock the same file, so the directory is created at
# boot group-writable for the drpai group (created by this recipe), letting a
# drpai-group process create/open drpai.lock (mode 0660).
d /run/alp 0775 root drpai -
