# Template downstream product layer on top of meta-alp-sdk. Copy the
# directory, rename "example-product" everywhere, and see
# docs/v2n-custom-carrier.md.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "example-product"
BBFILE_PATTERN_example-product = "^${LAYERDIR}/"
# Above meta-alp-sdk (8), so this layer's files shadow the SDK's of the
# same name (the carrier dts below relies on that).
BBFILE_PRIORITY_example-product = "9"

LAYERSERIES_COMPAT_example-product = "kirkstone scarthgap"
LAYERDEPENDS_example-product = "alp-sdk"
