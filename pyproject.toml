[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alp-sdk-cli"
version = "0.16.0"
description = "Command-line front-end for the Alp SDK"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
    "cryptography>=41.0",
    "click>=8.1",
    "cbor2>=5.0",
    "questionary>=2.0",
    "colorama>=0.4.6",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-snapshot>=0.9",
    "pytest-mock>=3.10",
]
# Full host model-compile toolchain (adds the Vela Ethos-U compiler). Still
# needed post-ADR-0028: scripts/gen_npu_ops.py regenerates
# metadata/npu_ops/ethos_u/*.json from a real `vela` report, and
# tests/fixtures/models/gen_tiny_model.py (re)builds tiny_int8.tflite -- the
# NPU fixture examples/aen/aen-npu-inference{,-alif}/CMakeLists.txt compile
# for real silicon. `model-io` (the lighter tflite+flatbuffers-only extra
# that used to sit beside this one) is gone: it existed solely for
# scripts/alp_model/'s tensor-I/O tests, which moved to tan.model (ADR-0028)
# along with the package that needed them.
model-compile = [
    "ethos-u-vela>=3.9",
    "tflite>=2.10",
    "flatbuffers>=23.1.21",
]
# Customer-facing MCP (Model Context Protocol) server -- exposes the SDK
# catalog + validator/emit runtime to an MCP-capable agent.  Optional: only
# needed to run the `alp-mcp` stdio server.
mcp = [
    "mcp>=1.2",
]

# No `alp` console-script: standalone Python Tan is the user-facing command
# surface (ADR-0020). The `alp_cli` package remains an SDK-internal reference
# and parity CLI for direct maintenance, never a user-installed `alp` binary.
[project.scripts]
alp-mcp = "alp_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["alp_cli*", "alp_mcp*"]
