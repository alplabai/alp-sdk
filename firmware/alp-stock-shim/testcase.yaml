#
# build_only on the two CM33 boards that ship this image (needs the real
# RZ/V2N devicetree and hal_renesas, which native_sim does not provide).

sample:
  name: alp-stock-shim
  description: CM33 stock image with a memory liveness beacon.

tests:
  alp_sdk.firmware.alp_stock_shim:
    platform_allow:
      - alp_e1m_v2n101_m33_sm/r9a09g056n48gbg/cm33
      - alp_e1m_v2m101_m33_sm/r9a09g056n48gbg/cm33
    tags:
      - alp-sdk
      - firmware
      - v2n
    build_only: true
