#
# Nothing to configure: the beacon is plain memory stores plus k_sleep(), and
# the CM33 has no console on these SoMs.  No CONFIG_ALP_SDK -- the shim calls
# no <alp/*> API.

# Release the GD32 link (SCI7 SPI on P96 SCK7 / P97 CS): the board defconfig
# enables SPI and the board DTS enables &sci7 and &gpio9 for real CM33
# firmware, which would mux P96/P97 and drive the chip-select at boot.  The
# idle shim must leave them untouched until a real CM33 image takes the link
# (app.overlay disables the nodes as well).
CONFIG_SPI=n
CONFIG_GPIO=n
