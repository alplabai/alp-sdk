# SPDX-License-Identifier: Apache-2.0
#
# Renode --sim-mode smoke: the studio hardware-simulator contract
# (github.com/alplabai/alp-sdk#674), on the FAITHFUL RZ/V2N M33 model.
#
# Builds a headless V2N M33 Zephyr image (samples/hello_world +
# tests/renode/v2n_m33_ramconsole.conf -- the ram_console backend, since
# the M33-SM has no UART console), plus an AEN M55-HP image and the
# aen-sim-vision (TFLM) image.  These three `west build -p always` steps are
# REAL builds, not stubs -- they still prove the firmware compiles for the
# sim-mode targets, and are why this job keeps its place as a required
# status check even with the e2e steps below dormant.
#
# DORMANT (maintainer decision, docs/adr/0022-python-executor-renode-
# retirement.md): the socket-contract e2e that used to boot each image in
# Renode via `west alp-renode --sim-mode --board E1M-V2N101` and drive the
# published sockets exactly the way alp-studio's RealRenodeAdapter will --
#   - the UART socket must stream the firmware console (polled out of the
#     ram_console_buf RAM ring), and
#   - the control socket must round-trip WriteBytes -> ReadBytes (in M33
#     SRAM) and apply the tmp112 inject on iic8 (read back the value)
# -- was ADR-0020 Phase 4's SDK-side executor
# (scripts/west_commands/alp_renode.py + tests/scripts/test_alp_renode_sim.py,
# both retired, no longer present in this repo).  `tan renode --sim-mode`
# (github.com/alplabai/tan-cli) is NOT a stub any more -- it shipped a full
# port of the socket contract in tan v0.5.0, closing tan-cli#77 on
# 2026-08-03.  The steps below stay no-ops anyway: tan-cli#448 has the
# `tan renode` command surface itself scheduled to go support-paused right
# after the v0.5.0 tag.  That is a `tan`-VERB decision only: alp-sdk's own
# Renode CI is NOT disabled -- pr-renode-aen-smoke, pr-renode-dual-os,
# pr-renode-v2n-sci0-smoke and this job's own three `west build -p always`
# steps all still run, and pr-renode-aen-smoke boots the pinned Renode
# v1.16.1 directly (`renode --console --disable-xwt --plain`, no `tan`
# involved).  Only these three `--sim-mode` steps are no-ops, because they
# are the only ones that would go through the `tan renode` verb -- do not
# delete this block silently; flip each step back to a real
# `tan renode --sim-mode ...` invocation if that verb is un-paused.
#
# The renesas_rzv2n model boots the REAL V2N M33 firmware (faithful
# SRAM@0x08003000 map + a coarse CPG stub for the FSP clock/reset
# handshakes + iic8/tmp112) -- retained for whenever these steps are wired
# back to a live `tan renode --sim-mode` run.

name: pr-renode-sim-mode

# The trigger is INTENTIONALLY unfiltered on paths.  This gate is a REQUIRED
# status check on dev/main, and a path-filtered `pull_request` trigger leaves
# the required check permanently in the "expected" state on any PR that doesn't
# touch a renode path -- GitHub then BLOCKS the PR forever (a never-posted
# required check can't be cleared, not even by --admin).  Instead we always run
# a cheap `detect` job and let the heavy `renode-sim-mode` job SKIP when no
# renode-relevant path changed: GitHub counts a skipped required check as
# passing, so the contract still posts on every PR without a 40-min boot.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path detector -- NOT a required context itself.  Always succeeds fast;
  # its output gates the heavy boot below.
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      renode: ${{ steps.filter.outputs.renode }}
    steps:
      - name: Detect renode-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        timeout-minutes: 2
        with:
          filters: |
            renode:
              - 'metadata/renode/renesas_rzv2n.*'
              - 'tests/scripts/test_alp_renode_sim.py'
              - 'tests/renode/v2n_m33_ramconsole.conf'
              - 'tests/renode/aen_m55_itcm_run.overlay'
              - 'tests/renode/aen_m55_sim.conf'
              - 'metadata/renode/alif_ensemble_e8.*'
              - 'examples/aen/aen-sim-vision/**'
              - '.github/workflows/pr-renode-sim-mode.yml'

  renode-sim-mode:
    name: renode · V2N101 --sim-mode socket contract
    needs: detect
    # Skipped (== passing, for branch protection) unless a renode path changed
    # or the run was dispatched by hand.
    if: needs.detect.outputs.renode == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # #1477: this job is `detect`-gated (above) and never fired in the 30
    # most-recent successful runs of this file sampled for #1477 -- every
    # per-step timeout-minutes below is therefore a default, not a
    # measurement, matched to the equivalent step class on this file's
    # sibling renode gates (pr-renode-aen-smoke.yml,
    # pr-renode-v2n-sci0-smoke.yml) where real timings exist. Raised from
    # 40 -> 45 to keep headroom over the sum-of-step-caps model (44min)
    # after giving the three `west build` steps below 5min each instead
    # of a flat 3min.
    timeout-minutes: 70

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          path: alp-sdk
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version-file: alp-sdk/.python-version

      - name: Install host build tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y --no-install-recommends \
              ninja-build gperf ccache dfu-util device-tree-compiler \
              python3-dev python3-pip python3-setuptools python3-wheel \
              libffi-dev libssl-dev xz-utils file make gcc \
              ca-certificates curl gnupg

      - name: Install west + Python deps
        timeout-minutes: 5
        run: pip3 install west jsonschema pyyaml pytest

      - name: Bootstrap Zephyr workspace
        working-directory: ${{ github.workspace }}/alp-sdk
        run: bash scripts/bootstrap.sh

      # Zephyr's build scripts (gen_kobject_list.py etc.) need pyelftools +
      # friends; install the pinned Zephyr build requirements now that the
      # workspace exists.
      - name: Install Zephyr build requirements
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pip3 install -r "${GITHUB_WORKSPACE}/zephyr/scripts/requirements-base.txt"

      # metadata/toolchains.json (issue #949 item 3) is the single source
      # for the pinned Zephyr SDK version/URL/sha256 -- scripts/
      # check_toolchain_lock.py gates this file staying in lockstep with it.
      - name: Read Zephyr SDK toolchain pin (metadata/toolchains.json)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -c '
          import json
          d = json.load(open("alp-sdk/metadata/toolchains.json"))
          sdk = d["zephyrSdk"]
          art = next(a for a in sdk["artifacts"] if a["host"] == "linux-x86_64" and a["component"] == "minimal-sdk")
          version = sdk["version"]
          url = sdk["baseUrl"] + art["filename"]
          sha256 = art["sha256"]
          print(f"ZEPHYR_SDK_VERSION={version}")
          print(f"ZEPHYR_SDK_URL={url}")
          print(f"ZEPHYR_SDK_SHA256={sha256}")
          ' >> "$GITHUB_ENV"

      - name: Install Zephyr SDK (arm-zephyr-eabi)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/zephyr-sdk.tar.xz "${ZEPHYR_SDK_URL}"
          ACTUAL_SHA256="$(sha256sum /tmp/zephyr-sdk.tar.xz | awk '{print $1}')"
          if [ "${ACTUAL_SHA256}" != "${ZEPHYR_SDK_SHA256}" ]; then
            echo "::error::sha256 mismatch for zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz: expected ${ZEPHYR_SDK_SHA256}, got ${ACTUAL_SHA256}"
            exit 1
          fi
          mkdir -p "$HOME/zephyr-sdk"
          tar -xJf /tmp/zephyr-sdk.tar.xz -C "$HOME/zephyr-sdk" --strip-components=1
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      # Same v1.16.1 pin as the other Renode gates.
      - name: Install Renode
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz \
              -o /tmp/renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf /tmp/renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          "$HOME/renode/renode" --version

      # Build a headless V2N M33 image whose console lands in ram_console.
      # #1477: no measurable run history (see the job-level comment
      # above); defaulted to 5min, matching a real `west build` step's
      # cap on the sibling renode gates rather than the flat 3min this
      # job's other (non-build) setup steps use.
      - name: Build headless V2N M33 ram_console image
        id: build_fw
        working-directory: ${{ github.workspace }}/alp-sdk
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Register alp-sdk as a Zephyr module so its board_root/dts_root
          # (zephyr/module.yml) expose the generated M33-SM board -- raw
          # `west build` doesn't auto-discover the manifest repo the way
          # `west alp-build` does.
          west build -p always \
              -b alp_e1m_v2n101_m33_sm/r9a09g056n48gbg/cm33 \
              "${ZEPHYR_BASE}/samples/hello_world" \
              -d /tmp/v2n-m33-build \
              -- -DEXTRA_ZEPHYR_MODULES="${GITHUB_WORKSPACE}/alp-sdk" \
                 -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/alp-sdk/tests/renode/v2n_m33_ramconsole.conf"
          test -f /tmp/v2n-m33-build/zephyr/zephyr.elf

      # Build a real AEN M55-HP image, ITCM-linked (chosen zephyr,flash =
      # &itcm) so it runs from the CPU-local 0x0 -- dodging Renode 1.16.1's
      # high-VTOR Cortex-M55 bug.  The M55 has a wired UART5 console (#687).
      # #1477: no measurable run history; same 5min default as the
      # V2N build step above.
      - name: Build AEN M55 ITCM-run image
        working-directory: ${{ github.workspace }}/alp-sdk
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        timeout-minutes: 5
        run: |
          set -euo pipefail
          west build -p always \
              -b alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp \
              "${ZEPHYR_BASE}/samples/hello_world" \
              -d /tmp/aen-m55-build \
              -- -DEXTRA_ZEPHYR_MODULES="${GITHUB_WORKSPACE}/alp-sdk" \
                 -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/alp-sdk/tests/renode/aen_m55_itcm_run.overlay" \
                 -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/alp-sdk/tests/renode/aen_m55_sim.conf"
          test -f /tmp/aen-m55-build/zephyr/zephyr.elf

      # tflite-micro is an OPTIONAL Zephyr module (not fetched by default);
      # clone it at the manifest-pinned revision for the vision demo.
      - name: Fetch tflite-micro (optional module)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          TFLM_REV=fcc760af130f3a595b5802cdebcc77461e54f382
          git clone --quiet https://github.com/zephyrproject-rtos/tflite-micro \
              "${GITHUB_WORKSPACE}/tflite-micro"
          git -C "${GITHUB_WORKSPACE}/tflite-micro" checkout --quiet "${TFLM_REV}"
          test -f "${GITHUB_WORKSPACE}/tflite-micro/zephyr/module.yml"

      # Build the aen-sim-vision demo (real TFLM inference on the M55).
      # #1477: no measurable run history; same 5min default -- this
      # was previously 3min, LOWER than the plain hello_world build cap
      # on the sibling gate, which was backwards for a TFLM-inference
      # image that does strictly more work.
      - name: Build aen-sim-vision (TFLM) ITCM-run image
        working-directory: ${{ github.workspace }}/alp-sdk
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        timeout-minutes: 5
        run: |
          set -euo pipefail
          west build -p always \
              -b alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp \
              examples/aen/aen-sim-vision \
              -d /tmp/aen-vision-build \
              -- -DEXTRA_ZEPHYR_MODULES="${GITHUB_WORKSPACE}/alp-sdk;${GITHUB_WORKSPACE}/tflite-micro" \
                 -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/alp-sdk/tests/renode/aen_m55_itcm_run.overlay"
          test -f /tmp/aen-vision-build/zephyr/zephyr.elf

      # DORMANT (maintainer decision, docs/adr/0022-python-executor-renode-
      # retirement.md): the deterministic sim-mode harness this used to
      # drive -- scripts/west_commands/alp_renode.py +
      # tests/scripts/test_alp_renode_sim.py -- was the SDK-side executor
      # ADR-0020 Phase 4 retired; neither file exists in this repo any
      # more.  `tan renode --sim-mode` (github.com/alplabai/tan-cli) is NOT
      # a stub any more -- it shipped a full port of the socket contract
      # (UART-poll + control-socket WriteBytes/ReadBytes/tmp112-inject) in
      # tan v0.5.0, closing tan-cli#77 on 2026-08-03.  The three ELF builds
      # above are kept (they still prove the firmware compiles); the live
      # socket-contract e2e below stays a no-op because tan-cli#448 has
      # `tan renode` itself scheduled to go support-paused right after the
      # v0.5.0 tag.  That is a `tan`-VERB decision only -- alp-sdk's Renode
      # CI is NOT disabled; pr-renode-aen-smoke boots the pinned Renode
      # v1.16.1 directly and this job's own builds above still run.  These
      # three steps are dormant only because they are the ones that would
      # go through the `tan renode` verb -- do not delete this block
      # silently; flip each step back to a real
      # `tan renode --sim-mode ...` invocation if that verb is un-paused.
      - name: --sim-mode e2e (real V2N M33 firmware, ram_console) [DORMANT -- tan renode verb support-paused]
        run: echo "::notice::sim-mode e2e (V2N M33 ram_console) skipped -- the tan renode VERB is support-paused (tan-cli#448); alp-sdk Renode CI itself still runs -- see docs/adr/0022"

      - name: --sim-mode e2e (real AEN M55 firmware, UART5 console) [DORMANT -- tan renode verb support-paused]
        run: echo "::notice::sim-mode e2e (AEN M55 UART5) skipped -- the tan renode VERB is support-paused (tan-cli#448); alp-sdk Renode CI itself still runs -- see docs/adr/0022"

      - name: --sim-mode e2e (aen-sim-vision, real TFLM inference) [DORMANT -- tan renode verb support-paused]
        run: echo "::notice::sim-mode e2e (aen-sim-vision TFLM) skipped -- the tan renode VERB is support-paused (tan-cli#448); alp-sdk Renode CI itself still runs -- see docs/adr/0022"
