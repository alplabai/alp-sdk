# SPDX-License-Identifier: Apache-2.0
#
# Grade changelog.d/ citations against the tree a merge-queue entry is
# about to land on `dev` (#2206).
#
# `pr-metadata-validate.yml`'s `validate` job already runs
# scripts/check_changelog_citations.py on `pull_request`, checked out at
# `refs/pull/N/merge` -- so it grades the PR's merge commit as it stood at
# the PR's LAST PUSH. #2186 made a citation on an added line hard-fail
# unless anchored, keyed off `DIFF_BASE`, default `origin/dev`. If `dev`
# moves after that push but before the merge queue lands the entry, a
# citation the move just broke is never graded before it reaches `dev` --
# it only turns the gate red on the next unrelated PR (the #2122
# treadmill). `pr-metadata-validate.yml` has no `merge_group` trigger at
# all, unlike `pr-twister.yml` / `pr-static-analysis.yml` /
# `cross-platform-zephyr.yml`.
#
# Adding `merge_group:` to `pr-metadata-validate.yml` would close that gap
# too, but it would put the whole ~18-minute job on every queue entry. This
# gate is a checkout and a few seconds of pure-stdlib Python, so it gets its
# own small workflow instead -- triggered ONLY on `merge_group`, not on
# `pull_request`/`push` (those are already covered by
# `pr-metadata-validate.yml`; duplicating them here would just be a second,
# differently-based verdict on every ordinary PR).
#
# DIFF_BASE is `github.event.merge_group.base_sha` -- the merge queue's own
# base. Two rejected alternatives, for two different reasons:
#
#   * NOT `HEAD^1`: this checkout's first parent may be a PREVIOUS queue
#     entry stacked ahead of this one, not `dev` itself.
#   * NOT the script's `origin/dev` default. The reason is NOT that the ref
#     is missing -- under `fetch-depth: 0` below, actions/checkout uses the
#     all-history refspec (`+refs/heads/*:refs/remotes/origin/*`), so
#     `refs/remotes/origin/dev` IS created in this job. (That "no such ref"
#     reasoning holds only for a SHALLOW checkout, which is why
#     `pr-metadata-validate.yml` can correctly say it of a PR checkout.) The
#     real reason is freshness: `origin/dev` is fetched at JOB time, so if
#     `dev` moved after this entry was enqueued, it is AHEAD of the base
#     this entry is actually landing on -- grading against a tree that is
#     not the merge result. `base_sha` is the queue's own deterministic
#     base and cannot drift under the run.
#
# check_changelog_citations.py resolves DIFF_BASE in `_resolve_base()` with
# `git rev-parse --verify DIFF_BASE^{commit}`, then diffs added lines in
# `_added_lines()` with `git merge-base DIFF_BASE HEAD`. A raw SHA satisfies
# both, provided the object is present locally. (Named by function, not by
# line number, on purpose: that script is not in the set this very gate
# grades, so a line citation into it would drift silently -- the exact
# failure class #2206 exists to close.)
#
# `fetch-depth: 0` is required, not merely generous: a shallow checkout
# grafts HEAD's history, and `git merge-base` over grafted history can miss
# or misresolve the common ancestor. Depth 0 fetches this ref's full history,
# which always contains `base_sha` as an ancestor (it is the base branch's
# own tip at enqueue time), so both git calls above resolve.
#
# concurrency: shape copied from pr-twister.yml / pr-static-analysis.yml /
# cross-platform-zephyr.yml, all three of which already carry a
# `merge_group:` trigger. `cancel-in-progress: true` is inert on a
# merge_group run -- `github.ref` there is the unique
# `refs/heads/gh-readonly-queue/dev/pr-N-<sha>`, so the group never collides
# across queue entries and nothing is cancelled mid-queue.
#
# `pull_request:` is present but PATH-FILTERED to this file alone. Without
# it the workflow would get ZERO validation before landing: its first real
# execution would be this PR's own queue entry, where -- being deliberately
# not a required context -- a broken job blocks nothing and notifies no one.
# The path filter is what keeps that from becoming the "second,
# differently-based verdict on every ordinary PR" objection above: ordinary
# PRs do not match it.
#
# `workflow_dispatch:` takes an optional `diff_base` input. Without one a
# dispatch cannot exercise the behaviour this gate exists for: DIFF_BASE
# would be empty, `_resolve_base()` treats empty exactly like unset and
# falls back to `origin/dev`, and dispatched on `dev` that makes
# `merge-base(origin/dev, HEAD) == HEAD` -- zero added lines, so the
# new-citation rule runs vacuously and reports OK. Passing a real base ref
# makes the dispatch a genuine smoke test.
#
# NOT a required context (deciding that is a branch-protection / ruleset
# edit on GitHub's side, out of scope for this change -- see #2206). Until
# it is required, this carries the same weakness #2201 exposed: the queue
# does not wait for a non-required check, so a red
# `changelog citations · merge queue` here does not by itself stop the
# entry from landing.

name: merge-queue-changelog-citations

on:
  merge_group:
  pull_request:
    paths:
      - '.github/workflows/merge-queue-changelog-citations.yml'
  workflow_dispatch:
    inputs:
      diff_base:
        description: >-
          Base ref or SHA to grade new citations against. Leave empty to use
          the script's own `origin/dev` default -- but note that dispatching
          on `dev` itself then grades zero added lines.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-citations:
    name: changelog citations · merge queue
    runs-on: ubuntu-latest
    # Worst-case budget for a checkout of ~3.4k commits plus a pure-stdlib
    # Python script that reads changelog.d/ -- generous headroom over the
    # few-seconds cost the issue describes, not a measured ceiling.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          # Full history: the new-citation rule's merge-base(DIFF_BASE, HEAD)
          # lookup needs base_sha's ancestry, not just its tip commit.
          fetch-depth: 0

      - name: "Gate — changelog.d/ path:line citations resolve against dev's tip (#2206)"
        timeout-minutes: 2
        env:
          # merge_group -> the queue's own base (the case this gate exists for).
          # workflow_dispatch -> whatever the operator passed, possibly empty.
          # pull_request (this file only) -> empty, so _resolve_base() falls back
          # to `origin/dev`, which fetch-depth: 0 has fetched. That is the same
          # base pr-metadata-validate.yml grades an ordinary PR against, which is
          # what makes this leg a faithful self-test of the workflow.
          DIFF_BASE: ${{ github.event.merge_group.base_sha || inputs.diff_base }}
        run: python3 scripts/check_changelog_citations.py --verbose
