# SPDX-License-Identifier: Apache-2.0
#
# AEN801 real-silicon twister gate (issue #1076).
#
# The problem this closes: examples/aen/** now carries 61 testcase.yaml
# files, 52 of which name AEN board targets in platform_allow
# (alp_e1m_aen801_m55_he/... and /_hp/...), contributing 59 of the tree's
# 69 scenarios. The other 9 files are native_sim/native/64-only by design
# (aen-analog-validate, the five aen-cc3501e-* companion examples,
# aen-eeprom-manifest, aen-secure-element-sign, edgeai-vision-aen) and are
# not this gate's business. Of the 61 files, 25 predate this gate, 35 were
# added by the #1076 metadata sweep (#1095), and 1 (aen-sdcard-readout,
# renamed aen-sdhc-probe by #2051) by #1097 once its driver linked; PR #1085
# added the workflow itself, not the
# metadata. (The counts were 62/53/60/70 and a 36-file #1095 bucket until
# docs/adr/0022 Amendment 2 deleted the Renode-sim aen-sim-vision example,
# which carried one HP-only scenario from that sweep.)
# pr-twister.yml's shards run
# `-p native_sim/native/64` only (by design -- see that file's own header
# comment: it deliberately skips the Zephyr SDK to dodge a disk-space
# failure mode), so every AEN-only scenario is statically filtered out of
# that gate on every PR. Nothing else picks up the slack: pr-alp-build.yml's
# AEN jobs only emit a system-manifest (continue-on-error, no west
# build/cmake/ninja), and the only real AEN-board compile in CI was one
# path-gated example (pr-renode-aen-smoke.yml). This job runs twister
# itself against the two AEN801 board targets so those 59 scenarios
# actually build.
#
# New workflow, not a pr-twister.yml shard: that file's shards are
# ZEPHYR_TOOLCHAIN_VARIANT=host / native_sim-only on purpose (see its
# header comment) precisely to avoid installing the ~1.5 GB Zephyr SDK.
# An AEN801 build is a real arm-zephyr-eabi cross-compile -- adding that
# to a twister-shard job would reintroduce the exact disk-budget risk
# that design note exists to avoid, for every PR, not just AEN ones.
# A sibling job is the wrong shape for a toolchain the other shards must
# never carry. The Zephyr SDK install recipe below is copied verbatim
# from pr-renode-aen-smoke.yml / pr-getting-started-aen801.yml (the two
# workflows that already do a real AEN801 cross-compile in CI) rather
# than re-invented here.
#
# ADVISORY, not required: a local run of the exact command below against
# the full post-#1095 metadata sweep selected 69 scenarios (138
# configurations), with 59 left after platform_allow filtering -- all 59
# built clean, 0 failed, 0 errored. That sweep (#1095) is also what fixed
# the 5 build breaks it exposed on its own first local run (a missing-braces
# nested initializer in aen-spi-regcheck, an uninitialized psa_alg in
# src/backends/security/zephyr_drv.c, two unused-function driver statics in
# zephyr/drivers/video/video_alif.c, a deprecated I2S option macro repeated
# in both aen-i2s-amp-alif and zephyr/drivers/i2s/i2s_dw.c, and an
# unused-variable in zephyr/drivers/spi/spi_dw_alif.c) -- all PRE-EXISTING
# bugs this gate was the first thing to ever compile far enough to see, not
# regressions from the metadata itself. A brand-new gate over
# previously-unbuilt code cannot be required from its first PR without
# instantly reddening unrelated work; promote it once it has run clean
# across a handful of AEN-touching PRs (same graduation criteria as
# pr-renode-aen-smoke.yml).
#
# aen-npu-inference-alp-u55 (the tflite-micro/Ethos-U family) has a
# testcase.yaml since #916, so this job pip-installs `ethos-u-vela` below;
# tflite-micro and hal_ethos_u are already unconditional west.yml groups.
# Its build uses Vela's built-in system config (no proprietary Alif .ini in
# CI), so it proves the build, not the bench command stream. `aen-sdcard-readout`
# (renamed aen-sdhc-probe by #2051) was the one example #1095 left without a
# testcase.yaml, because its driver
# (zephyr/drivers/sdhc/sdhc_dwc.c) expanded
# `Z_GENERIC_SECTION(CONFIG_SDHC_DESCRIPTOR_SECTION)` to an empty linker
# section name (`default ""` in
# zephyr/kconfigs/vendor-alif-peripherals.kconfig), which orphan-sections
# under `-Wl,--fatal-warnings`. #1097 fixed that generically -- the section
# attribute is now opt-in -- and this gate carries its testcase.yaml. Note
# the paths: filters above now include zephyr/drivers/sdhc/** and that
# kconfig: without them a regression in the very files that caused #1097
# would not trigger this job at all.
#
# Split per SKU (issue #2209): #2198 declared the AEN803 target for 12
# scenarios (~92 builds total for both SKUs, 24m21s against the twister
# step's 30min cap) and held back ~50 more because the combined job had no
# headroom left. Those ~50, plus 9 more scenarios that ship no boards/
# directory at all (an app.overlay-only or overlay-free shape, safe to
# declare AEN803 for without a matching boards/ file), are declared now,
# taking a `--dry-run` count AT THAT TIME (#2209) over examples/aen +
# firmware-update-log + drone-autopilot to 153 configurations total (78
# AEN801, 75 AEN803) -- past the single-job cap on any linear projection.
# This count is a historical snapshot, not current -- the tree has grown
# since; the AUTHORITATIVE current count lives in the camera-mjpeg-stream
# comment further down this job's twister step (search AUTHORITATIVE), not
# here. The `twister-aen` job below is now a 2-way SKU matrix (AEN801,
# AEN803) instead of one job building all four board targets, so the two
# SKUs build in parallel and each job's own twister step only ever selects
# its own SKU's two platforms (`-p` flags). Neither is a required
# branch-protection check on `dev` (the required contexts are
# `twister · native_sim/native/64` (aggregator of `twister-shard i/N`), `clang-format · diff-only` and `distro
# install · all`), so the split blocks nothing. The `--testsuite-root`
# list stays a single block below, shared by both matrix legs, rather than
# duplicated per SKU.

name: pr-twister-aen

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'examples/aen/**'
      - 'examples/connectivity/camera-mjpeg-stream/**'
      - 'examples/connectivity/firmware-update-log/**'
      - 'examples/connectivity/iot-dashboard/**'
      - 'examples/connectivity/iot-fleet-ota/**'
      - 'examples/connectivity/mqtt-telemetry/**'
      - 'examples/peripheral-io/drone-autopilot/**'
      - 'zephyr/boards/alp/e1m_aen801_m55_he/**'
      - 'zephyr/boards/alp/e1m_aen801_m55_hp/**'
      - 'zephyr/boards/alp/e1m_aen803_m55_he/**'
      - 'zephyr/boards/alp/e1m_aen803_m55_hp/**'
      - 'zephyr/boards/shields/**'
      - 'zephyr/soc-bridge/**'
      - 'src/backends/mproc/**'
      - 'src/backends/power/alif_se_profile.c'
      - 'src/backends/soc_info/alif_se.c'
      - 'src/backends/update_log/**'
      - 'zephyr/drivers/display/**'
      - 'zephyr/drivers/mipi_dsi/**'
      - 'zephyr/drivers/sdhc/**'
      - 'zephyr/dts/alif/**'
      - 'zephyr/include/zephyr/dt-bindings/clock/**'
      - 'zephyr/kconfigs/vendor-alif-peripherals.kconfig'
      - 'zephyr/CMakeLists.txt'
      - 'zephyr/Kconfig.alp-libraries'
      - 'west.yml'
      - 'metadata/toolchains.json'
      - '.github/workflows/pr-twister-aen.yml'
  push:
    branches: [main, dev]
    paths:
      - 'examples/aen/**'
      - 'examples/connectivity/camera-mjpeg-stream/**'
      - 'examples/connectivity/firmware-update-log/**'
      - 'examples/connectivity/iot-dashboard/**'
      - 'examples/connectivity/iot-fleet-ota/**'
      - 'examples/connectivity/mqtt-telemetry/**'
      - 'examples/peripheral-io/drone-autopilot/**'
      - 'zephyr/boards/alp/e1m_aen801_m55_he/**'
      - 'zephyr/boards/alp/e1m_aen801_m55_hp/**'
      - 'zephyr/boards/alp/e1m_aen803_m55_he/**'
      - 'zephyr/boards/alp/e1m_aen803_m55_hp/**'
      - 'zephyr/boards/shields/**'
      - 'zephyr/soc-bridge/**'
      - 'src/backends/mproc/**'
      - 'src/backends/power/alif_se_profile.c'
      - 'src/backends/soc_info/alif_se.c'
      - 'src/backends/update_log/**'
      - 'zephyr/drivers/display/**'
      - 'zephyr/drivers/mipi_dsi/**'
      - 'zephyr/drivers/sdhc/**'
      - 'zephyr/dts/alif/**'
      - 'zephyr/include/zephyr/dt-bindings/clock/**'
      - 'zephyr/kconfigs/vendor-alif-peripherals.kconfig'
      - 'zephyr/CMakeLists.txt'
      - 'zephyr/Kconfig.alp-libraries'
      - 'west.yml'
      - 'metadata/toolchains.json'
  workflow_dispatch:
  # #2541: nightly run on the default branch (dev), so the ccache PR runs
  # restore is refreshed regardless of what changed. A dev push saves it
  # only when it touches the path list above -- which does not list this
  # file, so not even the merge that adds the cache would seed it -- while
  # every alp-sdk source file compiled into these apps (src/**, chips/**)
  # can move on dev without triggering a save. Offset from
  # pr-twister.yml's 02:17 so the two nightly runs do not contend for the
  # same runner slots. Best-effort: the concurrency group below is per
  # ref, so a dev push landing mid-run cancels the nightly one (that push
  # run then saves instead, if its paths matched).
  schedule:
    - cron: '47 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twister-aen:
    # #2209: one job per SKU, running in parallel, instead of one job
    # building all four board targets. Each leg selects only its own SKU's
    # two platforms (M55-HE + M55-HP) via matrix.platform_flags -- see the
    # twister step below. At #2209 landing time a `--dry-run` over
    # examples/aen + firmware-update-log + drone-autopilot on that tree
    # counted 78 AEN801 configurations and 75 AEN803 (153 total), against
    # the pre-split single-job worst case of 92 that took 24m21s (#2198);
    # scaling that 1461s/92-build rate linearly projected both legs
    # comfortably under the 30min twister-step cap and the 41min job
    # ceiling below. That snapshot is not current -- do not read 78/75/153
    # as today's count; see the AUTHORITATIVE `--dry-run` count in the
    # camera-mjpeg-stream comment further down this job's twister step for
    # the current figure and margin. Neither is the 41min job ceiling
    # tightened here; a job-level timeout tighter than that shared ceiling
    # would need its own re-derivation per SKU for a margin this change
    # does not need yet.
    # #2541: each SKU leg is further split in two with twister's
    # `--subset ${{ matrix.subset }}/2` (four jobs). Measured on PR #2553,
    # one leg's ~100 configurations took anywhere from 1521s to 2172s
    # depending on the runner, so a cold leg could not reliably fit any
    # step cap the 41min job ceiling leaves room for, and a warm ccache
    # cannot help a PR that touches Kconfig or the AEN DTS, since those
    # change every configuration's generated headers. `--subset` is a
    # deterministic partition of the same test list (pr-twister.yml's
    # shards rely on the same property), so the two halves' union is the
    # full SKU leg and coverage is unchanged. Split by subset rather than
    # by platform: the configurations are ~85% M55-HE (88 HE + 15 HP on
    # AEN801 at #2239's head), so a per-platform split leaves one half
    # nearly as long as the whole. Neither context is required on dev,
    # so the renamed jobs need no branch-protection edit.
    strategy:
      fail-fast: false
      matrix:
        sku: [aen801, aen803]
        subset: [1, 2]
        include:
          - sku: aen801
            label: AEN801 (M55-HE + M55-HP)
            platform_flags: >-
              -p alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
              -p alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
          - sku: aen803
            label: AEN803 (M55-HE + M55-HP)
            platform_flags: >-
              -p alp_e1m_aen803_m55_he/ae822fa0e5597ls0/rtss_he
              -p alp_e1m_aen803_m55_hp/ae822fa0e5597ls0/rtss_hp
    name: twister · ${{ matrix.label }} · ${{ matrix.subset }}/2
    runs-on: ubuntu-latest
    # #1477: raised from 30 -> 41 (corrected from a 3-run sample that
    # overstated this to 60). True worst observed job wall, pre-split, was
    # 1337s/22.28min across 10 sampled runs of the single combined job --
    # 30min was genuinely unreachable because the twister step alone
    # measured 1167s/19.45min (see that step's own comment below). The
    # test suite's actual invariant is max-based, not sum-based
    # (test_job_ceiling_exceeds_its_longest_step_timeout requires only
    # ceiling > the single LONGEST step cap, i.e. > 30 here -- 31 would
    # already satisfy it); 41 is not derived from that test, it is kept
    # because it comfortably exceeds the real 22.28min observed total for
    # the old, larger combined job, leaving headroom this repo's own
    # timeout-flakiness history (#1549) says is worth keeping. Unchanged
    # for both SKU legs post-split rather than tightened per leg (see the
    # per-SKU build/time estimate in the job comment above) -- each leg's
    # own worst case, ~20min, is well inside it either way.
    timeout-minutes: 41

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      # #2541: Zephyr's cmake/modules/ccache.cmake launches every compile
      # through ccache whenever the binary is on PATH (the apt step below
      # installs it), so this job always filled a ccache -- in the runner's
      # default $HOME/.cache/ccache, thrown away with the runner. Point it
      # at a directory the restore/save steps below persist, per SKU leg and
      # subset half.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Rewrite absolute paths under the workspace to relative ones before
      # hashing, so an object compiled in one run's checkout still hits in
      # the next run's.
      CCACHE_BASEDIR: ${{ github.workspace }}
      # arm-zephyr-eabi compiles pass --specs=<file> (picolibc); leave it
      # out of the hash the way upstream Zephyr's own twister.yaml does.
      CCACHE_IGNOREOPTIONS: '-specs=* --specs=*'
      # The repo's 10 GB Actions cache was already at 10.6 GB on
      # 2026-09-30 (six native_sim shard caches, the tier-a caches and
      # the Zephyr workspace caches), so each leg's set is capped
      # tighter than pr-twister.yml's shards leave theirs. Measured on PR
      # #2553's cold runs, a whole (pre-split) SKU leg filled 0.4-0.5 GB,
      # so one subset half sits well under this cap; the stats step below
      # keeps reporting the real size and hit rate.
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # #1477: worst observed successful run 4s across 10 sampled runs.
        timeout-minutes: 5
        with:
          persist-credentials: false
          path: alp-sdk
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # #1477: worst observed successful run 1s across 10 sampled runs.
        timeout-minutes: 5
        with:
          # Repo is checked out under alp-sdk/ (path:), but setup-python (a
          # uses: step) resolves python-version-file from GITHUB_WORKSPACE.
          python-version-file: alp-sdk/.python-version

      - name: Install host build tools
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        # Worst observed successful run 32s across 10 sampled runs, but
        # #1477's 1-minute cap derived from that TIMED OUT on a real PR
        # (2026-08-18, run 32129302570): apt-get against a slow mirror
        # routinely exceeds it. The cap is here to catch a hang, not to
        # police apt, so it now carries ~10x the observed time.
        run: |
          "$GITHUB_WORKSPACE"/alp-sdk/scripts/ci/apt-bounded.sh update
          "$GITHUB_WORKSPACE"/alp-sdk/scripts/ci/apt-bounded.sh install -y --no-install-recommends \
              ninja-build gperf ccache dfu-util device-tree-compiler \
              python3-dev python3-pip python3-setuptools python3-wheel \
              libffi-dev libssl-dev xz-utils file make gcc \
              ca-certificates curl gnupg

      - name: Install west + Python deps
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        # #1477: worst observed successful run 7s across 10 sampled runs.
        run: pip3 install west jsonschema pyyaml

      # Zephyr workspace lives next to alp-sdk.  bootstrap.sh is
      # idempotent -- mirrors pr-renode-aen-smoke.yml / pr-alp-build.yml /
      # pr-twister.yml.  Unlike pr-twister.yml's temp `west init` (plain
      # Zephyr only, no hal_alif -- native_sim doesn't need it), this uses
      # alp-sdk's own manifest so hal_alif (an AEN801 cross-build
      # dependency) lands as a sibling module too.
      - name: Bootstrap Zephyr workspace
        working-directory: ${{ github.workspace }}/alp-sdk
        run: bash scripts/bootstrap.sh

      # `bootstrap.sh` above runs `west patch apply` itself as of #1392 -- it
      # used to be a manual step documented only in docs/aen-bench-bringup.md
      # §3 and replicated here, which is a step a user running the script
      # misses. This job still needs the patches: the mproc/SE-boot examples
      # it builds pull in hal_alif's se_service.c, which calls
      # ipm_poll_out()/ipm_poll_in() -- fields
      # zephyr/patches/zephyr/0002-ipm-add-poll-out-poll-in.patch adds to
      # upstream Zephyr's ipm_driver_api; vanilla v4.4.1 doesn't have them.
      # Without them a clean-checkout CI run fails on `.poll_out`/`.poll_in`
      # with no member by that name.
      #
      # `west patch apply` exits 0 on three paths that apply nothing (#1392):
      # patches.yml not found, an empty `patches:` list, and -- per patch -- a
      # `module:` that resolves to nothing, which patch.py skips with
      # `if mod is None: continue` and no message. Its exit status is
      # therefore not evidence. This step reads the tree instead, with
      # `git apply --reverse --check` per patch, and is what stops a silently
      # unpatched workspace reaching twister. bootstrap.sh only WARNS on exit
      # 3 (a module absent from a narrower workspace); this job compiles those
      # modules, so any non-zero is a failure here.
      #
      # Not a `scripts/check_*.py` gate: those run in pr-metadata-validate.yml
      # on a bare clone with no west workspace, where the only thing they
      # could do is skip.
      - name: verify zephyr/patches.yml actually applied
        working-directory: ${{ github.workspace }}/alp-sdk
        run: |
          set -euo pipefail
          python3 scripts/verify_west_patches.py

      # twister itself (not just `west build`) needs Zephyr's full Python
      # dependency set under the runner's hosted interpreter -- e.g.
      # requirements-run-test.txt's `natsort` (twisterlib/hardwaremap.py).
      # requirements-base.txt (what pr-renode-aen-smoke.yml installs for its
      # plain `west build`, no twister) is NOT enough here and fails at
      # import before a single scenario is selected. pr-twister.yml already
      # runs twister successfully in CI with this exact install -- copied
      # verbatim rather than guessing a requirements file name.
      - name: pip install Zephyr requirements
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        # #1477: worst observed successful run 26s across 10 sampled runs.
        run: |
          set -euo pipefail
          pip3 install -r "${GITHUB_WORKSPACE}/zephyr/scripts/requirements.txt"

      # aen-npu-inference-alp-u55's testcase.yaml (#916) Vela-compiles its
      # model at CMake time, so `vela` must be on PATH or every leg that
      # selects it fails "vela not found". Same release pyproject.toml pins
      # for the committed NPU op tables -- read from there, not repeated.
      - name: pip install ethos-u-vela (pyproject.toml pin)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          pin=$(grep -o '"ethos-u-vela==[0-9.]*"' "${GITHUB_WORKSPACE}/alp-sdk/pyproject.toml" | tr -d '"')
          test -n "$pin"
          pip3 install "$pin"
          vela --version

      # metadata/toolchains.json (issue #949 item 3) is the single source
      # for the pinned Zephyr SDK version/URL/sha256 -- scripts/
      # check_toolchain_lock.py gates this file staying in lockstep with it.
      - name: Read Zephyr SDK toolchain pin (metadata/toolchains.json)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -c '
          import json
          d = json.load(open("alp-sdk/metadata/toolchains.json"))
          sdk = d["zephyrSdk"]
          art = next(a for a in sdk["artifacts"] if a["host"] == "linux-x86_64" and a["component"] == "minimal-sdk")
          version = sdk["version"]
          url = sdk["baseUrl"] + art["filename"]
          sha256 = art["sha256"]
          print(f"ZEPHYR_SDK_VERSION={version}")
          print(f"ZEPHYR_SDK_URL={url}")
          print(f"ZEPHYR_SDK_SHA256={sha256}")
          ' >> "$GITHUB_ENV"

      # Both AEN801 board targets (M55-HE and M55-HP) are real
      # arm-zephyr-eabi cross builds, unlike the native_sim twister gate.
      - name: Install Zephyr SDK (arm-zephyr-eabi)
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}
        # #1477: worst observed successful run 9s across 10 sampled runs.
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/zephyr-sdk.tar.xz "${ZEPHYR_SDK_URL}"
          ACTUAL_SHA256="$(sha256sum /tmp/zephyr-sdk.tar.xz | awk '{print $1}')"
          if [ "${ACTUAL_SHA256}" != "${ZEPHYR_SDK_SHA256}" ]; then
            echo "::error::sha256 mismatch for zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz: expected ${ZEPHYR_SDK_SHA256}, got ${ACTUAL_SHA256}"
            exit 1
          fi
          mkdir -p "$HOME/zephyr-sdk"
          tar -xJf /tmp/zephyr-sdk.tar.xz -C "$HOME/zephyr-sdk" --strip-components=1
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      # #2541: restore this SKU leg's ccache. Restore-only on PRs; the
      # save step after twister runs on a dev push or the nightly run
      # alone, the same split pr-twister.yml uses and for the same
      # reason: a PR can only restore
      # its own ref's, its base branch's and the default branch's caches,
      # so a PR-saved set would only evict dev's from the 10 GB budget.
      # restore-keys falls back to the newest dev set for this SKU.
      - name: Restore ccache objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-twister-aen-${{ matrix.sku }}-subset${{ matrix.subset }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-twister-aen-${{ matrix.sku }}-subset${{ matrix.subset }}-

      # Run twister against this matrix leg's own SKU only -- both its
      # M55-HE and M55-HP board targets (matrix.platform_flags, see the
      # job-level `strategy:` above). alp-sdk#2084 -- a board's generated
      # tree gets no real CI coverage without a -p flag AND a matching
      # platform_allow entry; a testcase.yaml change alone selects nothing
      # here. The --testsuite-root list below is scoped to examples/aen --
      # the testcase.yaml files whose platform_allow names an AEN target
      # are the entire point; nothing outside that tree is in scope for
      # this job. examples/connectivity/firmware-update-log is a second,
      # bounded root (issue #1101): it is the one non-examples/aen example
      # with AEN801 platform_allow entries, kept as its own
      # --testsuite-root rather than widened to all of examples/ (this
      # job's stated disk-budget concern, see the header comment) or moved
      # under examples/aen (it is a portable <alp/update_log.h> demo, not
      # AEN-only). Every AEN803 scenario is build_only: true -- so they add
      # compile scenarios, not bench runs. #2209 declared the AEN803
      # target across the rest of examples/aen (the two SKUs' scenario
      # counts diverge slightly: some scenarios remain SKU-specific, e.g.
      # the aen-sdhc-probe / aen-ethernet-link twins whose
      # extra_dtc_overlay_files names one SKU's board file explicitly) and
      # split this job into the AEN801/AEN803 matrix above to keep the
      # combined scenario count within budget.
      # This list stays a SINGLE block shared by both matrix legs -- do not
      # duplicate it per SKU.
      # examples/peripheral-io/drone-autopilot is a third, bounded root
      # (issue #2106, same #1101 precedent as firmware-update-log above):
      # its AEN hardware scenario named a board target it shipped no
      # overlay for, so the alp-i2c0/alp-uart1/alp-pwm0..3 aliases its
      # overlay wires were silently dropped and nothing built to notice.
      # Bounded to this one example, not widened to examples/peripheral-io/
      # -- every other example there is native_sim-only (see #2106).
      # examples/connectivity/mqtt-telemetry and .../iot-fleet-ota are the
      # fourth and fifth bounded roots (issue #2173). Neither had ANY AEN
      # coverage here: mqtt-telemetry shipped no AEN scenario at all, and
      # iot-fleet-ota's named `ensemble_e8_dk/...` -- the stock Alif DevKit
      # board, which no -p flag in this repo selects -- so the apps'
      # real-silicon build was ungated and stayed broken (they did not
      # compile at all until the mbedtls PSA floor landed). Both now name
      # the alp_e1m_aen801_m55_hp target their own board.yaml describes
      # (som.sku E1M-AEN801, preset e1m-evk), build_only, so a regression
      # in the CC3501E/TLS build path fails a PR instead of a bench run.
      # Both are AEN801-only, so they contribute scenarios to the AEN801
      # matrix leg and select nothing on the AEN803 one -- these two apps
      # have no AEN803 coverage, and #2209's per-SKU declaration sweep did
      # not reach them (they sit outside examples/aen).
      # examples/connectivity/iot-dashboard is the third `--testsuite-root`
      # line below, also issue #2173 item (3): its AEN scenario named
      # `ensemble_e8_dk/...` the same way iot-fleet-ota's did, and had no
      # panel wired at all (LVGL needs a `zephyr,display` chosen node, and
      # the ST7789 its board.yaml used to declare has no working SPI route
      # on the EVK). The example's own
      # CMakeLists.txt now applies the e1m_evk_rk055hdmipi4ma0 DSI shield
      # (the #2204 panel) for the AEN M55-HP board targets, and the scenario
      # names BOTH alp_e1m_aen801_m55_hp and alp_e1m_aen803_m55_hp -- unlike
      # mqtt-telemetry/iot-fleet-ota above, this one contributes a scenario
      # to BOTH matrix legs.
      # examples/connectivity/camera-mjpeg-stream is the sixth bounded root
      # (issue #2265): before this, its AEN801/AEN803 build-only scenario
      # (real camera + Hantro JPEG + interim Ethernet, needing both the
      # e1m_evk_rpi_csi carrier shield and raspberry_pi_camera_module_1)
      # never ran in CI at all -- nothing in this repo's CI selected an AEN
      # board target for it, so a regression in that pipeline would only
      # surface on the next real bench flash. Same shape as the roots
      # above: one example, bounded, build_only, not widened to any other
      # directory. AUTHORITATIVE scenario count for this job's root list --
      # re-derived 2026-09-27 (#2173) with a single `--dry-run` per leg over
      # the exact roots + `-p` flags this step uses, at HEAD after the dev
      # merge and this change's own iot-dashboard AEN board overlay
      # backfill: 96 AEN801 configurations (both HE + HP), 91 AEN803 (187
      # total). This is the only current count in this file; every other
      # scenario count in it (header, ADVISORY note, job comments) describes
      # the tree when its cited issue landed, not HEAD -- trust this one.
      # The timeout-minutes comment below does the latter -- it does not
      # carry its own count.
      - name: twister · ${{ matrix.label }} · ${{ matrix.subset }}/2 on examples/aen + firmware-update-log + drone-autopilot + mqtt-telemetry + iot-fleet-ota + camera-mjpeg-stream + iot-dashboard
        id: twister
        working-directory: ${{ github.workspace }}
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
          EXTRA_ZEPHYR_MODULES: ${{ github.workspace }}/alp-sdk
        # #1477: worst observed successful run 1167s/19.45min across 10
        # sampled runs of the PRE-#2209 combined job (both SKUs, ~92
        # builds). 30min was already ~1.54x that, kept under the job's own
        # 41min ceiling (see that job-level comment). Scenario count is not
        # re-derived here -- see the AUTHORITATIVE `--dry-run` count in the
        # camera-mjpeg-stream comment above this step, not restated here.
        # Scaled linearly off the 1461s/92-build #2198 measurement
        # (15.9 s/build) at that count: AEN801 projects to about
        # 1525s/25.4min (~15% headroom under this 30min cap), AEN803 to
        # about 1445s/24.1min (~20% headroom) -- inside the cap, but not
        # the wide margin an earlier draft of this comment claimed.
        # Revisit if a future scenario count pushes either leg closer to
        # it -- the AEN801 leg in particular has less room left than
        # AEN803.
        # #2541: that projection turned out optimistic. On PR #2239's
        # merged head (103 AEN801 + 101 AEN803 configurations) the step
        # measured 1730s/28.8min on AEN801 and 1659s/27.7min on AEN803,
        # 70s under the old 30min cap. Raised to 34: with the ~3min of
        # setup ahead of it that leaves ~4min under the 41min job ceiling
        # for the stats, upload, trim and save steps behind it -- if the
        # job ceiling fired first the run would count as cancelled and
        # the timed-out leg would save nothing. Since the --subset split
        # above (one half of a SKU leg per job) the cap has wide headroom;
        # it stays at 34 as the ceiling a hang trips, not a performance
        # target.
        timeout-minutes: 34
        run: |
          # Zero the counters so the summary below reports this run only.
          ccache -z >/dev/null
          # Each example's testcase.yaml points EXTRA_CONF_FILE at its
          # generated/alp.conf; twister configures from the source tree, so
          # write those fragments first (#866).
          python3 "$GITHUB_WORKSPACE/alp-sdk/scripts/gen_example_alp_conf.py"
          python3 zephyr/scripts/twister \
            ${{ matrix.platform_flags }} \
            --subset ${{ matrix.subset }}/2 \
            --testsuite-root "$GITHUB_WORKSPACE/alp-sdk/examples/aen" \
            --testsuite-root "$GITHUB_WORKSPACE/alp-sdk/examples/connectivity/firmware-update-log" \
            --testsuite-root "$GITHUB_WORKSPACE/alp-sdk/examples/connectivity/iot-dashboard" \
            --testsuite-root "$GITHUB_WORKSPACE/alp-sdk/examples/peripheral-io/drone-autopilot" \
            --testsuite-root "$GITHUB_WORKSPACE/alp-sdk/examples/connectivity/mqtt-telemetry" \
            --testsuite-root "$GITHUB_WORKSPACE/alp-sdk/examples/connectivity/iot-fleet-ota" \
            --testsuite-root "$GITHUB_WORKSPACE/alp-sdk/examples/connectivity/camera-mjpeg-stream" \
            --inline-logs \
            --no-detailed-test-id

      # Hit rate in the log, so a cold or ineffective cache is visible,
      # not guessed (#2541 decides its next step on this number). Its own
      # step so it also prints after a red or timed-out twister run.
      - name: ccache statistics
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        run: ccache -s -v

      # Persist the twister REPORTS regardless of pass/fail, same
      # rationale (and same NOT-the-whole-twister-out/-tree caveat) as
      # pr-twister.yml. Named per SKU and subset
      # (twister-out-${{ matrix.sku }}-${{ matrix.subset }}) --
      # `upload-artifact` names must be unique within a workflow run, and
      # the matrix runs four jobs in the same run.
      - name: Upload twister reports artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        # #1477: worst observed successful run 2s across 10 sampled runs.
        timeout-minutes: 1
        with:
          name: twister-out-${{ matrix.sku }}-${{ matrix.subset }}
          path: |
            twister-out/*.json
            twister-out/*.xml
            twister-out/*.log
          retention-days: 14
          if-no-files-found: ignore

      # #2541: save this leg's ccache on a dev push or the nightly run
      # only (see the restore step). `!cancelled()` rather than pr-twister.yml's implicit
      # success(): a twister step that goes red or hits its cap has still
      # compiled most of its configurations, and ccache is content-
      # addressed, so a partial set is valid and is exactly what the next
      # run needs to get back under the cap. The twister step must have
      # run, though: a run that failed in setup restored a warm set it
      # never touched, and trimming + saving that would publish a
      # near-empty set as the newest key every later run restores. Trim to this run's working
      # set first so the saved set does not grow across saves (ccache
      # refreshes an entry's mtime on every hit).
      - name: Trim ccache to this run's working set (dev push + nightly only)
        if: ${{ !cancelled() && steps.twister.outcome != 'skipped' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        timeout-minutes: 5
        # 10800s, not 3h: ubuntu-latest's apt ccache (4.9.1) accepts only
        # the d and s suffixes and exits 1 on "3h" (#2541).
        run: ccache --evict-older-than 10800s
      - name: Save ccache objects (dev push + nightly only)
        if: ${{ !cancelled() && steps.twister.outcome != 'skipped' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-twister-aen-${{ matrix.sku }}-subset${{ matrix.subset }}-${{ github.sha }}
