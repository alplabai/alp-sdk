# SPDX-License-Identifier: Apache-2.0
#
# Container-job proof for metadata/bootstrap.json's prerequisites.install.linux
# (issue #1464): the single hard constraint that issue set is "verification
# is the only admission ticket" -- an unverified package name IS the defect
# being fixed, so this job actually RUNS every command install.linux.<pm>
# declares, on a real (non-GitHub-hosted-image) container for that package
# manager, and asserts the tool lands on PATH afterwards. Nothing here is
# derived from a second, hardcoded copy of the tool set -- both jobs read
# prerequisites.install.linux.<pm> straight out of metadata/bootstrap.json at
# run time (the same discipline the existing onramp-clean-container.yml
# macOS job already uses for install.macos), so a manifest edit that adds or
# drops a tool is proven or un-proven here automatically, with nothing to
# keep in sync by hand.
#
# apt (Debian/Ubuntu) already has continuous proof from
# onramp-clean-container.yml's ubuntu:24.04 job (issue #949/#1033) -- not
# duplicated here. This file covers what #1464 actually added: dnf
# (Fedora + RHEL-derivatives).
#
# fedora-dnf proves the FULL install.linux.dnf map (all 5 declared tools).
# rockylinux-dnf proves the SAME map on a RHEL-derivative -- this is the
# job that matters: Fedora's own repos carry `ninja-build`, but Rocky's
# default repos (BaseOS/AppStream/Extras, no EPEL) do not carry ninja under
# any name, which is exactly why install.linux.dnf ships no `ninja` key at
# all (see metadata/schemas/bootstrap-v1.schema.json's install.linux
# description). Running the SAME derived-from-the-manifest tool set on both
# distros, with no `ninja` in it, is what proves the manifest's own choice
# to leave `ninja` unshipped is correct rather than merely convenient --
# adding a `ninja` key back to install.linux.dnf without this job proving it
# on rockylinux:9 too would be exactly the regression #1464 fixes.
#
# pacman (Arch) is deliberately NOT a job here: metadata/bootstrap.json
# ships no install.linux.pacman entry at all (an unattended `pacman -S`
# against a sync database staler than the target system risks a partial
# upgrade -- see the schema's own rationale), so there is nothing this job
# could run and assert without inventing the same guessed command #1464
# exists to remove.

name: pr-bootstrap-distro-install

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'metadata/bootstrap.json'
      - 'metadata/schemas/bootstrap-v1.schema.json'
      - 'scripts/bootstrap.sh'
      - 'scripts/check_bootstrap_manifest.py'
      - '.github/workflows/pr-bootstrap-distro-install.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distro-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora-dnf
            image: fedora:42
          - name: rockylinux-dnf
            image: rockylinux/rockylinux:9
    name: distro install · ${{ matrix.name }} (prerequisites.install.linux.dnf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # python3 itself is one of the tracked prerequisites.posix tools, so
      # this container legitimately starts without it -- install it (plus
      # ca-certificates, needed for actions/checkout's own HTTPS fetch on a
      # bare image) as the one bootstrap step this job does NOT derive from
      # the manifest, the same chicken-and-egg exemption
      # scripts/bootstrap.sh's own REQUIRED_BINS check documents.
      - name: Install ca-certificates + python3 (needed to read the manifest itself)
        run: dnf install -y -q ca-certificates python3

      # Derive both the install script AND the tool list to verify from
      # metadata/bootstrap.json's prerequisites.install.linux.dnf at run
      # time -- never a hardcoded copy in this workflow. This container
      # already runs as root, so the manifest's literal `sudo ` prefix
      # (load-bearing for tan-cli#650's root-strip on a customer's non-root
      # host) is dropped the same way tan's --fix does before executing.
      - name: Render prerequisites.install.linux.dnf as a runnable script
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dnf-install.sh
          import json
          d = json.load(open("metadata/bootstrap.json"))
          dnf = d["prerequisites"]["install"]["linux"]["dnf"]
          if not dnf:
              raise SystemExit("prerequisites.install.linux.dnf is empty -- nothing to prove")
          print("set -euo pipefail")
          for tool, cmd in sorted(dnf.items()):
              cmd = cmd[len("sudo "):] if cmd.startswith("sudo ") else cmd
              print(f"echo '--- installing {tool} ({cmd}) ---'")
              print(cmd)
          PY
          echo "--- rendered script ---"
          cat /tmp/dnf-install.sh

      - name: Run every prerequisites.install.linux.dnf command
        run: bash -e /tmp/dnf-install.sh

      # The actual admission bar: every tool the manifest's dnf sub-map
      # DECLARES must be resolvable on PATH afterwards -- a command that
      # exits 0 without actually installing the binary (e.g. a metapackage
      # that pulls in something else entirely) would otherwise slip through
      # the previous step unnoticed.
      - name: Assert every declared dnf tool landed on PATH
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dnf-tools.txt
          import json
          d = json.load(open("metadata/bootstrap.json"))
          print("\n".join(sorted(d["prerequisites"]["install"]["linux"]["dnf"])))
          PY
          failed=0
          while IFS= read -r tool; do
            [ -n "${tool}" ] || continue
            if command -v "${tool}" >/dev/null 2>&1; then
              echo "OK   ${tool} -> $(command -v "${tool}")"
            else
              echo "::error::${tool} did not land on PATH after prerequisites.install.linux.dnf.${tool} ran"
              failed=1
            fi
          done < /tmp/dnf-tools.txt
          exit "${failed}"
