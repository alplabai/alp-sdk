# SPDX-License-Identifier: Apache-2.0
#
# Refreshes metadata/issue-state-snapshot.json -- the committed cache
# scripts/check_issue_citations.py (#1950) reads instead of calling `gh`
# inside every PR run (that would make check_issue_citations.py a
# network-flake gate on every metadata/** PR).
#
# Runs weekly + on demand. scripts/refresh_issue_state_snapshot.py
# re-harvests the same #NNNN driver-status citations the gate looks at and
# records each one's current `gh issue view` state. When that changes the
# committed snapshot, this workflow opens a PR against dev rather than
# pushing straight to it (dev requires a PR -- branch protection has no
# direct-push exemption for the Actions bot); when nothing changed, it exits
# without opening anything. check_issue_citations.py itself degrades a
# stale/missing snapshot to a warning rather than a hard fail, so a missed
# run here does not brick the PR gate -- see that script's own docstring.

name: refresh-issue-state-snapshot

on:
  schedule:
    # Monday 07:00 UTC -- ahead of nightly-extras-tier1-pins.yml's Monday
    # 06:00 UTC slot by an hour, cheap and low-noise like that one.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        timeout-minutes: 5
        with:
          python-version-file: .python-version

      - name: Refresh the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh_issue_state_snapshot.py

      - name: Open a PR if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- metadata/issue-state-snapshot.json; then
            echo "No change to metadata/issue-state-snapshot.json -- nothing to do."
            exit 0
          fi

          branch="chore/refresh-issue-state-snapshot-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add metadata/issue-state-snapshot.json
          git commit -m "chore(metadata): refresh issue-state-snapshot.json"
          git push origin "$branch"

          gh pr create \
            --base dev \
            --head "$branch" \
            --title "chore(metadata): refresh issue-state-snapshot.json" \
            --body "Scheduled refresh of the snapshot \`scripts/check_issue_citations.py\` (#1950) checks driver-status issue citations against. Generated by \`scripts/refresh_issue_state_snapshot.py\`; no manual edits."
