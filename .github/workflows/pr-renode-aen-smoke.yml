# SPDX-License-Identifier: Apache-2.0
#
# Renode single-core (Alif Ensemble E8 / E1M-AEN801) smoke test.
#
# Builds examples/peripheral-io/hello-world for the M55-HP Zephyr
# slice LOCALLY (plain `west build`, mirroring pr-renode-sim-mode.yml's
# AEN M55 ITCM-run image step), then actually boots the resulting ELF
# under the pinned Renode v1.16.1 and asserts on the log (issue #974).
# `tan renode` is NOT needed for this: the .resc descriptor is
# hand-runnable by its own header, so the e2e below drives Renode
# directly with plain `renode --console --disable-xwt --plain`.
#
# What the e2e asserts, and why (metadata/renode/alif_ensemble_e8.resc
# documents the derivation these lines come from):
#   - PRESENT "Setting initial values: PC = 0x" -- Renode read SP/PC
#     from the seeded vector table (CortexM.cs, logged synchronously
#     inside the .resc's own `start`, so pause+quit right after the
#     include is not a race against this line).
#   - ABSENT  "CPU was halted" -- the seed was usable (PC/SP nonzero
#     and PC lands in loaded memory); this is the failure string from
#     the same code path.
#   - ABSENT  "Guessing VectorTableOffset value to be 0x" -- the
#     descriptor's own `$vtor` seed applied; this string means Renode
#     fell back to inferring VTOR from the lowest LOAD vaddr, exactly
#     the condition #947 exists to eliminate (and the condition that
#     shipped green before this gate existed -- #953's first attempt
#     hardcoded `$vtor ?= 0x80010000`, 64 KiB inside the image's own
#     `.text`, and nothing here contradicted it).
#
# !! ADVISORY, not required, while this pattern proves itself. It
#    graduates to required (folding into `renode ·
#    V2N101 --sim-mode socket contract`, the actual required context)
#    once it has run green across a handful of PRs that touch a
#    renode path -- see issue #974's recommended order. Until then a
#    flaky emulator run here cannot block anyone's merge.

name: pr-renode-aen-smoke

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'metadata/renode/**'
      - 'examples/peripheral-io/hello-world/**'
      # The boot assertion is now downstream of these: the overlay picks
      # the ITCM link that dodges the v1.16.1 high-VTOR defect, the conf
      # enables the banner the job's build step relies on existing, and
      # the board tree determines the link layout `_vector_table`
      # actually resolves against (a `.dts` memory/`chosen` edit changes
      # the ELF's link shape the same way the overlay can). All three
      # were already `west build` inputs before this change but weren't
      # gated -- now that a change to any of them can change what the
      # e2e boots (and so what it asserts), they belong in the filter
      # too. Nothing else under tests/renode/ is consumed by this job.
      - 'tests/renode/aen_m55_itcm_run.overlay'
      - 'tests/renode/aen_m55_sim.conf'
      - 'zephyr/boards/alp/e1m_aen801_m55_hp/**'
      - '.github/workflows/pr-renode-aen-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renode-aen-smoke:
    name: renode · AEN801 M55-HP hello-world
    runs-on: ubuntu-latest
    # #1477: worst observed successful run 205s/3.42min across 8 sampled
    # runs (corrected from a 3-run sample that produced an unnecessary
    # 30->35 raise -- see per-step comments below). 30min is unchanged
    # from before this issue; per-step caps sized off the 8-run data keep
    # their sum (14min incl. the 1min/step budget for the 2 remaining
    # uncapped steps) well under it.
    timeout-minutes: 55

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        # #1477: worst observed successful run 5s across 8 sampled runs.
        timeout-minutes: 5
        with:
          path: alp-sdk
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        # #1477: worst observed successful run 1s across 8 sampled runs.
        timeout-minutes: 5
        with:
          # Repo is checked out under alp-sdk/ (path:), but setup-python (a
          # uses: step) resolves python-version-file from GITHUB_WORKSPACE.
          python-version-file: alp-sdk/.python-version

      - name: Install host build tools
        # #1477: worst observed successful run 17s across 8 sampled runs.
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y --no-install-recommends \
              ninja-build gperf ccache dfu-util device-tree-compiler \
              python3-dev python3-pip python3-setuptools python3-wheel \
              libffi-dev libssl-dev xz-utils file make gcc \
              ca-certificates curl gnupg

      - name: Install west + Python deps
        # #1477: worst observed successful run 12s across 8 sampled runs.
        timeout-minutes: 5
        run: pip3 install west jsonschema pyyaml

      # Zephyr workspace lives next to alp-sdk.  bootstrap.sh is
      # idempotent (skips work already done) -- mirrors pr-alp-build.yml
      # and pr-twister.yml.
      - name: Bootstrap Zephyr workspace
        working-directory: ${{ github.workspace }}/alp-sdk
        run: bash scripts/bootstrap.sh

      # Zephyr's build scripts (gen_kobject_list.py etc.) need pyelftools +
      # friends; install the pinned Zephyr build requirements now that the
      # workspace exists.  bootstrap.sh installs them into the workspace venv,
      # but `west build` here runs under the runner's hosted interpreter, so
      # they have to be present there too -- same step, same reason, as
      # pr-renode-sim-mode.yml.  Without it the build died at
      # `ModuleNotFoundError: No module named 'elftools'`, which
      # `continue-on-error: true` swallowed for as long as the e2e below was a
      # no-op echo: the job reported success having never produced an ELF.
      - name: Install Zephyr build requirements
        # #1477: worst observed successful run 3s across 8 sampled runs.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pip3 install -r "${GITHUB_WORKSPACE}/zephyr/scripts/requirements-base.txt"

      # metadata/toolchains.json (issue #949 item 3) is the single source
      # for the pinned Zephyr SDK version/URL/sha256 -- scripts/
      # check_toolchain_lock.py gates this file staying in lockstep with it.
      - name: Read Zephyr SDK toolchain pin (metadata/toolchains.json)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -c '
          import json
          d = json.load(open("alp-sdk/metadata/toolchains.json"))
          sdk = d["zephyrSdk"]
          art = next(a for a in sdk["artifacts"] if a["host"] == "linux-x86_64" and a["component"] == "minimal-sdk")
          version = sdk["version"]
          url = sdk["baseUrl"] + art["filename"]
          sha256 = art["sha256"]
          print(f"ZEPHYR_SDK_VERSION={version}")
          print(f"ZEPHYR_SDK_URL={url}")
          print(f"ZEPHYR_SDK_SHA256={sha256}")
          ' >> "$GITHUB_ENV"

      # The M55-HP slice is a real arm-zephyr-eabi cross build (unlike
      # the native_sim twister gate), so the Zephyr SDK is required.
      - name: Install Zephyr SDK (arm-zephyr-eabi)
        working-directory: ${{ github.workspace }}
        # #1477: worst observed successful run 9s across 8 sampled runs.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/zephyr-sdk.tar.xz "${ZEPHYR_SDK_URL}"
          ACTUAL_SHA256="$(sha256sum /tmp/zephyr-sdk.tar.xz | awk '{print $1}')"
          if [ "${ACTUAL_SHA256}" != "${ZEPHYR_SDK_SHA256}" ]; then
            echo "::error::sha256 mismatch for zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz: expected ${ZEPHYR_SDK_SHA256}, got ${ACTUAL_SHA256}"
            exit 1
          fi
          mkdir -p "$HOME/zephyr-sdk"
          tar -xJf /tmp/zephyr-sdk.tar.xz -C "$HOME/zephyr-sdk" --strip-components=1
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      # Renode's published GitHub release carries the pinned .deb.
      # Same v1.16.1 pin as pr-renode-dual-os.yml so both Renode gates
      # exercise identical emulator behaviour.
      - name: Install Renode
        # #1477: no per-step measurement isolated this step from
        # "Install Zephyr SDK" in the 8-run sample; kept at 2min (real
        # work is a single curl + tar, same class as the 1min steps
        # above with headroom for the larger download).
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # v1.16.1 portable-dotnet build: self-contained .NET, no Mono/GTK#
          # system deps.  The .deb needs gtk-sharp2 / *-cil-dev packages that
          # Ubuntu 24.04 (== ubuntu-latest) dropped, breaking apt install (#339).
          curl -fsSL --retry 3 --retry-delay 5 https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz \
              -o /tmp/renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf /tmp/renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          # $GITHUB_PATH only applies to later steps, so smoke-check by full path.
          "$HOME/renode/renode" --version

      # Build the M55-HP slice locally (west, not tan).  ITCM-linked
      # (chosen zephyr,flash = &itcm), same overlay/conf pair as
      # pr-renode-sim-mode.yml's AEN M55 image -- dodges Renode 1.16.1's
      # high-VTOR Cortex-M55 bug so the ELF stays boot-ready for the
      # e2e boot below.
      #
      # No `continue-on-error` here (there used to be one): the e2e
      # step now actually boots this ELF, so a build failure must fail
      # the job, not be swallowed and handed to a no-op next step that
      # always went green regardless.
      - name: Build hello-world (M55-HP ITCM-run image)
        id: build_fw
        working-directory: ${{ github.workspace }}/alp-sdk
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        # #1477: worst observed successful run 25s across 8 sampled runs.
        timeout-minutes: 1
        run: |
          set -euo pipefail
          west build -p always \
              -b alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp \
              examples/peripheral-io/hello-world \
              -d /tmp/aen-smoke-build \
              -- -DEXTRA_ZEPHYR_MODULES="${GITHUB_WORKSPACE}/alp-sdk" \
                 -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/alp-sdk/tests/renode/aen_m55_itcm_run.overlay" \
                 -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/alp-sdk/tests/renode/aen_m55_sim.conf"
          test -f /tmp/aen-smoke-build/zephyr/zephyr.elf

      # Boot the ELF headless and assert on the log (issue #974). This
      # drives Renode directly, no `tan renode` involved -- the .resc is
      # hand-runnable by its own header (metadata/renode/
      # alif_ensemble_e8.resc:1-16).
      #
      # Termination: the .resc ends in `start`, which is non-blocking,
      # so control returns to the monitor as soon as the CPU is seeded
      # -- and the three lines this step greps for are all logged
      # SYNCHRONOUSLY inside that `start` call, before it returns
      # (CortexM.cs seeds/reports PC+SP or halts at machine-start, not
      # on a later tick). So `pause` immediately after the include is
      # not racing those log lines -- they're already flushed by the
      # time `i @resc` returns. `pause` is used instead of `emulation
      # RunFor` because the descriptor already called `start`: RunFor
      # errors ("this action is not available when emulation is already
      # started") against a running emulation, `pause` does not. The
      # outer `timeout 120` is a backstop for a genuine hang, not the
      # normal exit path -- pause+quit has exited 0 on every observed
      # run.
      - name: AEN801 M55-HP Renode boot e2e
        # #1477: worst observed successful run 4s across 8 sampled runs
        # (was a pre-existing 5min guess predating this issue).
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}/alp-sdk
        run: |
          set -uo pipefail
          ELF=/tmp/aen-smoke-build/zephyr/zephyr.elf
          LOG="${RUNNER_TEMP:-/tmp}/renode-boot.log"
          if [ ! -f "${ELF}" ]; then
            echo "::error::AEN801 M55-HP Renode boot e2e: ${ELF} is missing -- the 'Build hello-world (M55-HP ITCM-run image)' step did not produce it."
            exit 1
          fi

          # `run:` steps execute under `bash -e {0}` with no `shell:`
          # override, and `set -uo pipefail` above does NOT clear
          # errexit. A bare `cmd; RC=$?` would exit AT the failing
          # command -- `RC=$?` and every check below it would never
          # run, and the ::error:: lines naming this artifact are
          # exactly the ones that couldn't fire. `|| RC=$?` keeps the
          # nonzero status from tripping errexit.
          RC=0
          timeout 120 "$HOME/renode/renode" --console --disable-xwt --plain \
              -e "\$repl=@metadata/renode/alif_ensemble_e8.repl" \
              -e "\$elf=@${ELF}" \
              -e "i @metadata/renode/alif_ensemble_e8.resc" \
              -e "pause" \
              -e "quit" > "${LOG}" 2>&1 || RC=$?
          if [ "${RC}" -ne 0 ]; then
            echo "::error::AEN801 M55-HP Renode boot e2e: renode exited ${RC} -- see the renode-boot-log artifact."
            exit 1
          fi

          if ! grep -q "Setting initial values: PC = 0x" "${LOG}"; then
            echo "::error::AEN801 M55-HP Renode boot e2e: 'Setting initial values: PC = 0x' not found -- the vector table was never seeded. See the renode-boot-log artifact."
            exit 1
          fi
          if grep -q "CPU was halted" "${LOG}"; then
            echo "::error::AEN801 M55-HP Renode boot e2e: 'CPU was halted' found -- the PC/SP seed was unusable. See the renode-boot-log artifact."
            exit 1
          fi
          if grep -q "Guessing VectorTableOffset value to be 0x" "${LOG}"; then
            echo "::error::AEN801 M55-HP Renode boot e2e: 'Guessing VectorTableOffset value to be 0x' found -- the descriptor's \$vtor seed did not apply and Renode fell back to inference (the condition #947 exists to eliminate). See the renode-boot-log artifact."
            exit 1
          fi

          echo "::notice::AEN801 M55-HP Renode boot e2e: vector table seeded, no halt, no VTOR guess fallback."

      - name: Upload Renode boot log
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 2
        with:
          name: renode-boot-log
          path: ${{ runner.temp }}/renode-boot.log
          retention-days: 14
          if-no-files-found: ignore
