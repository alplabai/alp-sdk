# SPDX-License-Identifier: Apache-2.0
#
# Cross-platform Zephyr-on-M smoke gate for the Alp SDK.
#
# Per ADR 0012 (docs/adr/0012-cross-platform-developer-host.md)
# the Zephyr-on-M-class developer workflow is first-class on
# Win + Mac + Linux.  This workflow is the mechanical CI proof
# of that claim: every PR runs the metadata validator, the
# cross-platform lint, public/private classifier, a bash-3.2 parse
# sweep of every shipped shell script, and a single-board native_sim
# build on Ubuntu + macOS + Windows runners.
#
# Linux remains the canonical baseline (the shipped pr-twister.yml
# + pr-metadata-validate.yml + pr-bitbake.yml gates stay on
# ubuntu-latest).  This workflow ADDS Mac + Win coverage; it does
# not replace any existing gate.
#
# Operating mode:
#
#   - EVERY leg fails the JOB, Linux + macOS + Windows alike, on
#     its own defect -- see the NOTE below for whether that also
#     fails the PR (it does not, yet).  A macOS-only or Windows-only
#     failure is a REAL defect on a host ADR 0012 calls first-class.
#
#     This was scaffolding until 2026-07-29 (alp-sdk#1023): the Mac
#     and Win legs carried `continue-on-error: true`, so a job-level
#     `continue-on-error` made the check report SUCCESS no matter
#     what its steps did -- the ADR 0012 claim was unenforced and a
#     host-specific regression landed green.  Note what that means
#     for the run history: while the override was in place, a green
#     tick on these legs proved nothing, so "it has always passed"
#     was never evidence.  The flip was made on the back of four
#     consecutive runs (30457062916, 30455621379, 30450805406,
#     30441032872) whose per-STEP conclusions -- not the job
#     conclusions the override forged -- were 24/24 clean.
#
#     NOTE: this workflow's jobs (python-smoke, loader-smoke) are not
#     in dev's or main's required-status-check list (verified via
#     `.../branches/{dev,main}/protection/required_status_checks`,
#     neither of which lists these six contexts), so a red run here
#     is visible but does not block merge yet -- removing
#     continue-on-error buys a real signal, not enforcement. Whether
#     to promote all six of these contexts (three OSes x two jobs),
#     or only the two ubuntu-latest ones, is a separate follow-up
#     requiring the maintainer's decision (alp-sdk#1528 leaves this
#     open). `dev` runs an active merge-queue ruleset ("dev merge
#     queue", confirmed via `gh api repos/alplabai/alp-sdk/rulesets`),
#     so before EITHER promotion happens the workflow ALSO needs
#     `merge_group` in its own trigger list -- otherwise a queued PR
#     would wait on a check this workflow can never raise on a
#     `merge_group` ref (#1415), exactly the trap `pr-twister.yml` and
#     `pr-static-analysis.yml` already document for their own required
#     contexts. Added below, but capped to the ubuntu-latest leg on
#     `merge_group` (see the trigger comment) to avoid billing the
#     full 3-OS matrix on every queue entry -- that cap PRESUMES the
#     ubuntu-latest-only promotion. If the maintainer instead requires
#     the macOS/Windows contexts too, this cap must be widened to run
#     those legs on `merge_group` FIRST, or the queue will hang in
#     AWAITING_CHECKS on the four contexts that can then never report
#     on a queue ref -- the same #1415 trap, reintroduced by the cap
#     itself.
#     What #1528 does NOT fix: `pull_request`/`push` below still
#     `paths:`-filter this workflow, so a PR that touches none of
#     those paths never runs it at all -- promoting python-smoke to
#     required without ALSO resolving that (widen the filter, or add
#     a `pr-bootstrap-distro-install.yml`-style unfiltered trigger +
#     fail-closed skip) reproduces the alp-sdk#1474 permanently-
#     blocked-PR incident. Still the maintainer's call.
#
#   - check_cross_platform.py: runs with --fail-on-warning on every
#                               runner. The existing-doc cleanup this
#                               was waiting on is done (2 bash-shebang
#                               findings in tests/yocto/*.sh, fixed by
#                               whitelisting them with header notes --
#                               see INTENTIONALLY_BASH_HELPERS in the
#                               script); 0 findings as of this change.
#
# Twister + bitbake are NOT exercised here:
#   - Twister is the load-bearing Zephyr coverage gate -- it lives
#     in pr-twister.yml and stays Linux-only (the SDK + Zephyr
#     toolchain image is Linux-only on the CI side; Win + Mac
#     would download a different toolchain set).
#   - Bitbake is Linux-only by upstream constraint (ADR 0012 §8.1)
#     and lives in pr-bitbake.yml.
#
# This workflow is the minimum cross-platform smoke that says
# "yes, alp-sdk's Zephyr-on-M workflow really does work on a
# Mac / Windows host" -- it is intentionally cheap (no Zephyr
# workspace setup, no real-silicon toolchain pull) so PR latency
# stays low.

name: cross-platform-zephyr

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'metadata/**'
      - 'scripts/**'
      - 'examples/**'
      - 'include/**'
      - 'firmware/**'
      - 'zephyr/**'
      - 'meta-alp-sdk/**'
      - 'tests/scripts/**'
      - 'docs/**/*.md'
      - 'README.md'
      # Every workflow, not just this one. `pytest tests/scripts/` also
      # runs in pr-metadata-validate.yml's `validate` job, but that
      # workflow's `pull_request` `paths:` list has exactly one
      # '.github/workflows/' entry -- its own file -- so an edit to a
      # DIFFERENT workflow file doesn't trigger it. This is the only
      # workflow where an edit to ANY workflow file reaches
      # test_workflows_are_loadable.py, which lives under tests/scripts/
      # and is exercised by this job's pytest step. Narrowing this back to
      # a single filename is how two unparseable workflows reached `dev`
      # unnoticed.
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'metadata/**'
      - 'scripts/**'
      - 'examples/**'
      - 'include/**'
      - 'firmware/**'
      - 'zephyr/**'
      - 'meta-alp-sdk/**'
      - 'tests/scripts/**'
      - 'docs/**/*.md'
      - 'README.md'
      # Every workflow, not just this one. `pytest tests/scripts/` also
      # runs in pr-metadata-validate.yml's `validate` job, but that
      # workflow's `push` `paths:` list has no '.github/workflows/' entry
      # at all -- not even its own file -- so an edit to ANY workflow
      # file, including a DIFFERENT one, doesn't trigger it on push. This
      # is the only workflow where an edit to ANY workflow file reaches
      # test_workflows_are_loadable.py, which lives under tests/scripts/
      # and is exercised by this job's pytest step. Narrowing this back to
      # a single filename is how two unparseable workflows reached `dev`
      # unnoticed.
      - '.github/workflows/**'
  # NOT yet load-bearing -- python-smoke/loader-smoke are not required
  # contexts on `dev` or `main` today (see the NOTE above, alp-sdk#1528).
  # Added ahead of that promotion anyway: `dev` runs an active merge-queue
  # ruleset, and GitHub raises `merge_group` -- not `push` or
  # `pull_request` -- for a queued entry. pr-twister.yml and
  # pr-static-analysis.yml already needed this for their own required
  # contexts (#1415); a future required-context here would hit the same
  # AWAITING_CHECKS hang without it. Bare (no `paths:`): `merge_group`
  # doesn't support the same path-filter semantics `pull_request`/`push`
  # get above. `merge_group` also can't be scoped by matrix leg at the
  # trigger level, so each job below scopes its own `strategy.matrix.os`
  # (a job-level `if:` can't do this -- `matrix` isn't in the context list
  # `jobs.<job_id>.if` gets) to just `ubuntu-latest` on that event -- this
  # PRESUMES the eventual required context ends up ubuntu-latest-only
  # (alp-sdk#1528 leaves that open) -- since `merge_group` fires
  # unconditionally on every `dev` merge-queue entry with no `paths:` to
  # narrow it, and the other two legs would otherwise bill full matrix
  # cost (macOS 10x, Windows 2x) on every queue entry while gating
  # nothing. If the maintainer instead requires the macOS/Windows
  # contexts, widen this cap to include those legs FIRST -- promoting
  # them as required while they're capped out of `merge_group` reproduces
  # the #1415 AWAITING_CHECKS hang this trigger exists to avoid.
  merge_group:
  workflow_dispatch:

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ---------------------------------------------------------------
  # Pure-Python smoke: metadata validation + cross-platform lint +
  # public/private classifier + pytest sweep.  Runs identically on
  # every host OS.
  # ---------------------------------------------------------------
  python-smoke:
    name: python-smoke
    runs-on: ${{ matrix.os }}
    # #1477: worst observed successful run 1068s/17.8min (windows-latest,
    # across 9 sampled runs) -- driven by the `pytest tests/scripts/`
    # step below, which is pure local Python and so (per this file's own
    # network/compile heuristic) carries no timeout-minutes of its own;
    # the job ceiling is what actually bounds it. 40min = ~2.2x that
    # observed worst case.
    timeout-minutes: 40

    strategy:
      # Every leg reports independently: a Windows-only break must not
      # cancel the macOS leg that would have shown the same defect from
      # a second angle.
      fail-fast: false
      matrix:
        # merge_group has no paths: filter (see the trigger comment above), so
        # cap it to the ubuntu-latest leg -- this PRESUMES the eventual
        # required context ends up ubuntu-latest-only (alp-sdk#1528 leaves
        # that open; widen this cap first if macOS/Windows get required
        # instead, or the queue hangs on those contexts per #1415) --
        # rather than billing the full macOS (10x)/Windows (2x) matrix
        # cost on every dev merge-queue entry.
        # The cap has to live here, not in a job-level `if:` -- `matrix` is
        # not in the context list `jobs.<job_id>.if` gets (only `github`,
        # `inputs`, `needs`, `vars`); `jobs.<job_id>.strategy` does get
        # `github`, so the conditional selects the matrix values instead.
        os: ${{ github.event_name == 'merge_group' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        timeout-minutes: 3

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 2
        with:
          python-version-file: .python-version

      - name: Install Python deps
        # model-io adds tflite + flatbuffers so the .alpmodel tensor-I/O
        # tests run here (they importorskip otherwise); cbor2 is a base dep.
        timeout-minutes: 3
        run: pip install -e ".[dev,model-io]"

      # ---------------------------------------------------------
      # 1. Metadata validation.
      #    Pure-Python, no Zephyr / west / toolchain needed.
      #    Runs identically on every host OS.
      # ---------------------------------------------------------
      - name: validate metadata (all SoCs)
        run: python scripts/validate_metadata.py

      - name: validate board.yaml example
        run: |
          python scripts/validate_board_yaml.py --input metadata/templates/board.yaml.example

      # ---------------------------------------------------------
      # 2. Cross-platform lint (this slice, ADR 0012).
      #    --fail-on-warning: the existing-doc cleanup this was
      #    waiting on is done (0 findings); a new Linux-only idiom
      #    now fails the job instead of passing silently.
      # ---------------------------------------------------------
      - name: check_cross_platform lint
        run: python scripts/check_cross_platform.py --fail-on-warning

      - name: check public/private classifier
        run: python scripts/check_public_private.py

      # ---------------------------------------------------------
      # 3. bash -n parse gate over every shell script the repo ships,
      #    parsed with the runner's SYSTEM bash.  Runs BEFORE pytest
      #    so a parse error is reported as bash's own file+line+token,
      #    not buried 100+ lines deep in a pytest assertion repr.
      #
      #    macos-latest's SYSTEM bash is 3.2.57 (Apple has frozen it
      #    on the last GPLv2 release since ~2007) -- that's real,
      #    unmodified bash 3.2 coverage with no container needed on
      #    this leg, BUT only because the step pins the interpreter to
      #    /bin/bash there: `shell: bash` resolves via PATH and the
      #    runner image ships a Homebrew bash 5.x ahead of the system
      #    one, so a bare `bash -n` would quietly parse with 5.x and
      #    cover nothing this gate exists for.  The step asserts the
      #    macOS interpreter really reports 3.2 and fails loudly if a
      #    future image moves it.  The step runs on every OS rather
      #    than being macOS-only: a script that's actually valid
      #    shell parses clean under any bash version, so there is no
      #    reason to special-case which leg checks it, and Ubuntu +
      #    Windows(Git Bash) catch the ordinary syntax-error class the
      #    same way.
      #
      #    Why this matters (PR #1050, 2026-07): bash 3.2 has a real
      #    parser quirk newer bash does not -- it keeps tracking
      #    single-quote state ACROSS a heredoc body while scanning for
      #    the closing `)` of an enclosing `$( )`, even though the
      #    heredoc tag itself is quoted (`<<'PY'`). An ODD number of
      #    apostrophes inside such a heredoc desyncs the parser, which
      #    then fails much later at a token with nothing to do with
      #    the real defect. scripts/bootstrap.sh:271's
      #    `_facts="$(python3 - … <<'PY' … PY)"` hit exactly this: a
      #    single added apostrophe in a comment inside the heredoc
      #    (making the count 7 instead of 6) broke parsing 131 lines
      #    later, at an unrelated `(` in a plain `ok "…"` call. Two
      #    hypotheses were disproved and `bash -n` on bash 5.2 stayed
      #    clean before the real cause was found -- shellcheck does
      #    not catch this either (it doesn't parse under bash 3.2).
      #    This step exists so the NEXT one is named directly instead
      #    of re-derived by hand on a borrowed Mac.
      #
      #    (bash 3.2.57 itself cannot be rebuilt from source here for
      #    local reproduction -- its shipped y.tab.c is stale against
      #    parse.y and the build fails without `bison`. Use the
      #    `docker.io/library/bash:3.2` container image instead, e.g.
      #    `podman run --rm -v "$PWD":/w:ro docker.io/library/bash:3.2
      #    bash -n /w/scripts/bootstrap.sh` -- see stage_bash32_parse
      #    in scripts/test-all.sh for the local-CI equivalent of this
      #    step.)
      # ---------------------------------------------------------
      - name: bash -n parse gate (bash 3.2 compat)
        shell: bash
        run: |
          set -u
          # PIN THE INTERPRETER ON macOS. `shell: bash` resolves via PATH,
          # and the macos-latest runner image ships a Homebrew bash 5.x
          # AHEAD of the system one -- so a bare `bash -n` here would parse
          # with 5.x and this gate would silently stop covering the only
          # thing it exists for. Apple's frozen 3.2.57 is at /bin/bash.
          PARSER=bash
          if [ "$(uname -s)" = "Darwin" ]; then
              PARSER=/bin/bash
          fi
          PARSER_VERSION="$("${PARSER}" --version | head -1)"
          echo "parsing with: ${PARSER} -- ${PARSER_VERSION}"
          # On macOS, refuse to run rather than downgrade in silence: if a
          # future runner image moves /bin/bash off 3.2, this gate stops
          # being bash-3.2 coverage and must SAY SO, not pass quietly.
          if [ "$(uname -s)" = "Darwin" ]; then
              case "${PARSER_VERSION}" in
                  *"version 3.2"*) ;;
                  *)
                      echo "::error::${PARSER} is '${PARSER_VERSION}', not bash 3.2 -- this leg is the repo's ONLY real bash-3.2 parse coverage (see the comment above and PR #1050). Point PARSER at a 3.2 interpreter or move this gate to the docker.io/library/bash:3.2 container before removing this check."
                      exit 1
                      ;;
              esac
          fi
          count=0
          rc=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! "${PARSER}" -n "${f}"; then
              echo "::error file=${f}::bash -n parse error under ${PARSER_VERSION} (see bash output above)"
              rc=1
            fi
          done < <(git ls-files '*.sh')
          # `git ls-files` failing (wrong cwd, not a checkout) discards its
          # exit status through the pipe into `read` -- the loop body would
          # just never run and this step would exit 0 having "parsed" zero
          # files, the exact silent-empty-loop shape this gate exists to
          # rule out one level down. Fail loudly instead.
          if [ "${count}" -eq 0 ]; then
            echo "::error::git ls-files '*.sh' returned NO files -- refusing to report a silent pass."
            exit 1
          fi
          exit "${rc}"

      # ---------------------------------------------------------
      # 4. Test sweep -- the same pytest battery the Linux PR
      #    gate runs.  ~370 tests; <30 s on every OS on Linux/macOS, but
      #    Windows is far slower (worst observed successful run 1009s/
      #    16.8min across the sampled history) -- #1477 gave this step an
      #    explicit timeout-minutes rather than leaving it to the
      #    uncapped-step 1min/step budget
      #    test_job_ceiling_exceeds_the_sum_of_its_step_timeouts assumes,
      #    which was never true for this step (see that constant's own
      #    comment in the test file).
      # ---------------------------------------------------------
      - name: pytest tests/scripts/
        timeout-minutes: 25
        run: python -m pytest tests/scripts/ -q

  # ---------------------------------------------------------------
  # Loader smoke: every emit mode of alp_project.py produces
  # non-empty output.  Cross-checks the loader's cross-platform
  # path handling (forward-slash vs backslash, line endings, …).
  # ---------------------------------------------------------------
  loader-smoke:
    name: loader-smoke
    runs-on: ${{ matrix.os }}
    # #1477: worst observed successful run 26s across 9 sampled runs.
    # Raised from the formula's 15min to 20min so the job ceiling stays
    # strictly above the sum of its own step timeouts plus the 1min/step
    # budget test_job_ceiling_exceeds_the_sum_of_its_step_timeouts assigns
    # every uncapped `emit *` step (6 of them; only the flagged setup
    # steps above carry their own cap).
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # merge_group has no paths: filter (see the trigger comment above), so
        # cap it to the ubuntu-latest leg -- this PRESUMES the eventual
        # required context ends up ubuntu-latest-only (alp-sdk#1528 leaves
        # that open; widen this cap first if macOS/Windows get required
        # instead, or the queue hangs on those contexts per #1415) --
        # rather than billing the full macOS (10x)/Windows (2x) matrix
        # cost on every dev merge-queue entry.
        # The cap has to live here, not in a job-level `if:` -- `matrix` is
        # not in the context list `jobs.<job_id>.if` gets (only `github`,
        # `inputs`, `needs`, `vars`); `jobs.<job_id>.strategy` does get
        # `github`, so the conditional selects the matrix values instead.
        os: ${{ github.event_name == 'merge_group' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        timeout-minutes: 3

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 2
        with:
          python-version-file: .python-version

      - name: Install Python deps
        timeout-minutes: 3
        run: pip install jsonschema pyyaml

      # Exercise every emit mode against the canonical template.
      # Using `python -m` + explicit args keeps the invocation
      # shell-agnostic (works on PowerShell + bash + zsh).
      - name: emit zephyr-conf
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit zephyr-conf

      - name: emit cmake-args
        timeout-minutes: 2
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit cmake-args

      - name: emit hw-info-h
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit hw-info-h

      - name: emit dts-overlay
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit dts-overlay

      - name: emit west-libraries
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit west-libraries

      - name: emit yocto-conf
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit yocto-conf
