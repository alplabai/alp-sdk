# SPDX-License-Identifier: Apache-2.0
#
# Cross-platform Zephyr-on-M smoke gate for the Alp SDK.
#
# Per ADR 0012 (docs/adr/0012-cross-platform-developer-host.md)
# the Zephyr-on-M-class developer workflow is first-class on
# Win + Mac + Linux.  This workflow is the mechanical CI proof
# of that claim: every PR runs the metadata validator, the
# cross-platform lint, public/private classifier, a bash-3.2 parse
# sweep of every shipped shell script, and a single-board native_sim
# build on Ubuntu + macOS + Windows runners.
#
# Linux remains the canonical baseline (the shipped pr-twister.yml
# + pr-metadata-validate.yml + pr-bitbake.yml gates stay on
# ubuntu-latest).  This workflow ADDS Mac + Win coverage; it does
# not replace any existing gate.
#
# Operating mode:
#
#   - EVERY leg fails the JOB, Linux + macOS + Windows alike, on
#     its own defect -- see the NOTE below for whether that also
#     fails the PR (it does not, yet).  A macOS-only or Windows-only
#     failure is a REAL defect on a host ADR 0012 calls first-class.
#
#     This was scaffolding until 2026-07-29 (alp-sdk#1023): the Mac
#     and Win legs carried `continue-on-error: true`, so a job-level
#     `continue-on-error` made the check report SUCCESS no matter
#     what its steps did -- the ADR 0012 claim was unenforced and a
#     host-specific regression landed green.  Note what that means
#     for the run history: while the override was in place, a green
#     tick on these legs proved nothing, so "it has always passed"
#     was never evidence.  The flip was made on the back of four
#     consecutive runs (30457062916, 30455621379, 30450805406,
#     30441032872) whose per-STEP conclusions -- not the job
#     conclusions the override forged -- were 24/24 clean.
#
#     NOTE: this workflow's jobs are not in dev's or main's
#     required-status-check list (verified via
#     `.../branches/{dev,main}/protection/required_status_checks`,
#     neither of which lists any of the six real check-run names --
#     `python-smoke (ubuntu-latest)`, `python-smoke (macos-latest)`,
#     `python-smoke (windows-latest)`, `loader-smoke (ubuntu-latest)`,
#     `loader-smoke (macos-latest)`, `loader-smoke (windows-latest)`,
#     confirmed via `gh api .../actions/runs/<run>/jobs --jq
#     '.jobs[].name'` against a completed run), so a red run here is
#     visible but does not block merge yet -- removing
#     continue-on-error buys a real signal, not enforcement.
#
#     Those six names are matrix-interpolated (`${{ matrix.os }}`) and
#     therefore UNREQUIRABLE on their own: GitHub can only resolve the
#     interpolation while the matrix job actually runs, and when it
#     SKIPS (as `python-smoke`/`loader-smoke` now legitimately do --
#     see the `detect` job below) GitHub reports under the literal,
#     uninterpolated name `python-smoke (${{ matrix.os }})` instead,
#     which never matches a required-context string built from the
#     six real names above. Requiring any of the six directly
#     reproduces the alp-sdk#1474 permanently-blocked-PR incident
#     `pr-bootstrap-distro-install.yml`'s own `summary:` job comment
#     documents (that file is where this pattern was proven; copied
#     here, not reinvented). The fix applied below is the same one:
#     a static-named `python-smoke · all` summary job that depends on
#     the matrix and reports its aggregate result, fail-closed on any
#     `skipped` result that doesn't match the one legitimate skip
#     condition. THAT is the context a future promotion should
#     require -- never the six raw matrix-interpolated names.
#     `loader-smoke` gets the same `detect`-gating for cost parity but
#     no summary job of its own: #1528 only asks about promoting
#     `python-smoke`; a `loader-smoke · all` aggregator is left for
#     whoever actually proposes requiring `loader-smoke` (this
#     branch's own earlier commits already went further than #1528
#     asked by capping `loader-smoke`'s `merge_group` matrix too --
#     that stays, since it's a correctness fix for whichever job
#     needs the cap, not a promotion).
#
#     Whether to eventually require all six underlying legs (three
#     OSes x two jobs, surfaced only via a `loader-smoke · all`
#     aggregator someone still has to add) or only the two
#     ubuntu-latest ones, is a separate follow-up requiring the
#     maintainer's decision (alp-sdk#1528 leaves this open). `dev`
#     runs an active merge-queue ruleset ("dev merge queue", confirmed
#     via `gh api repos/alplabai/alp-sdk/rulesets`), so before that
#     promotion happens the workflow ALSO needs `merge_group` in its
#     own trigger list -- otherwise a queued PR would wait on a check
#     this workflow can never raise on a `merge_group` ref (#1415),
#     exactly the trap `pr-twister.yml` and `pr-static-analysis.yml`
#     already document for their own required contexts. Added below,
#     but capped to the ubuntu-latest leg on `merge_group` (see the
#     trigger comment) to avoid billing the full 3-OS matrix on every
#     queue entry -- that cap PRESUMES the ubuntu-latest-only
#     promotion. If the maintainer instead requires the macOS/Windows
#     contexts too, this cap must be widened to run those legs on
#     `merge_group` FIRST, or the queue will hang in AWAITING_CHECKS
#     on the four contexts that can then never report on a queue ref
#     -- the same #1415 trap, reintroduced by the cap itself. This cap
#     has never actually been exercised by a `merge_group` run of this
#     workflow (none exists yet in this repo's Actions history, and
#     `grep -rn fromJSON .github/workflows/*.yml` shows no other
#     precedent to cross-check against) -- do not read the reasoning
#     above as proof it works, only as the intended behaviour. Its
#     failure mode if wrong is fail-OPEN (the full 3-OS matrix bills
#     on `merge_group` after all), not a hang -- the queue-hang class
#     this whole trigger addition exists to avoid stays avoided either
#     way, so a wrong cap costs money, not correctness.
#
#     What #1528 previously left unfixed -- `pull_request`/`push`
#     `paths:`-filtering this workflow so a PR touching none of those
#     paths never runs it at all, the same #1474 shape one level up --
#     is fixed below too: the trigger itself is now unfiltered, and a
#     cheap `detect` job (copied from `pr-bootstrap-distro-install.yml`,
#     same rationale) decides whether the heavy matrix needs to run at
#     all, with the `python-smoke · all` summary job treating a
#     legitimate detect-caused skip as a pass.
#
#   - check_cross_platform.py: runs with --fail-on-warning on every
#                               runner. The existing-doc cleanup this
#                               was waiting on is done (2 bash-shebang
#                               findings in tests/yocto/*.sh, fixed by
#                               whitelisting them with header notes --
#                               see INTENTIONALLY_BASH_HELPERS in the
#                               script); 0 findings as of this change.
#
# Twister + bitbake are NOT exercised here:
#   - Twister is the load-bearing Zephyr coverage gate -- it lives
#     in pr-twister.yml and stays Linux-only (the SDK + Zephyr
#     toolchain image is Linux-only on the CI side; Win + Mac
#     would download a different toolchain set).
#   - Bitbake is Linux-only by upstream constraint (ADR 0012 §8.1)
#     and lives in pr-bitbake.yml.
#
# This workflow is the minimum cross-platform smoke that says
# "yes, alp-sdk's Zephyr-on-M workflow really does work on a
# Mac / Windows host" -- it is intentionally cheap (no Zephyr
# workspace setup, no real-silicon toolchain pull) so PR latency
# stays low.

name: cross-platform-zephyr

# The `pull_request`/`push` triggers are INTENTIONALLY unfiltered on
# paths (issue #1528, MAJOR finding 4) -- a paths:-filtered trigger on a
# workflow meant to eventually produce a required context leaves that
# check permanently in the "expected" state on any PR that doesn't touch
# a watched path, and GitHub then blocks the PR forever (not even
# --admin clears it). `pr-bootstrap-distro-install.yml` hit exactly this
# on alp-sdk#1474 before its #1473 fix -- see that file's own `summary:`
# job comment. This workflow's jobs aren't required contexts yet, so it
# hasn't hit that failure mode in practice, but shipping the promotion
# without also fixing this would set the trap for whoever adds it later.
# Copied the fix from that file rather than inventing one: a cheap
# `detect` job (below, in `jobs:`) decides whether the heavy matrix
# actually needs to run, and the `python-smoke · all` summary job (also
# below) treats a legitimate detect-caused skip as a pass -- same shape,
# same reasoning, same job names as `pr-bootstrap-distro-install.yml`'s
# own `detect`/`summary` pair.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  # NOT yet load-bearing -- python-smoke/loader-smoke are not required
  # contexts on `dev` or `main` today (see the NOTE above, alp-sdk#1528).
  # Added ahead of that promotion anyway: `dev` runs an active merge-queue
  # ruleset, and GitHub raises `merge_group` -- not `push` or
  # `pull_request` -- for a queued entry. pr-twister.yml and
  # pr-static-analysis.yml already needed this for their own required
  # contexts (#1415); a future required-context here would hit the same
  # AWAITING_CHECKS hang without it. Bare (no `paths:`): `merge_group`
  # doesn't support the same path-filter semantics `pull_request`/`push`
  # get above, and the `detect` job below is gated OFF on `merge_group`
  # rather than trusted to resolve a merge-queue base/head pair correctly
  # (that isn't something this repo has verified -- same call
  # `pr-bootstrap-distro-install.yml`'s own `detect` job makes). `merge_group`
  # also can't be scoped by matrix leg at the trigger level, so each
  # matrix job below scopes its own `strategy.matrix.os` (a job-level
  # `if:` can't do this -- `matrix` isn't in the context list
  # `jobs.<job_id>.if` gets, enforced by scripts/check_workflow_expressions.py)
  # to just `ubuntu-latest` on that event -- this PRESUMES the eventual
  # required context ends up ubuntu-latest-only (alp-sdk#1528 leaves that
  # open) -- since `merge_group` fires unconditionally on every `dev`
  # merge-queue entry with no `paths:` to narrow it, and the other two
  # legs would otherwise bill full matrix cost (macOS 10x, Windows 2x) on
  # every queue entry while gating nothing. If the maintainer instead
  # requires the macOS/Windows contexts, widen this cap to include those
  # legs FIRST -- promoting them as required while they're capped out of
  # `merge_group` reproduces the #1415 AWAITING_CHECKS hang this trigger
  # exists to avoid. UNVERIFIED: no `merge_group` run of this workflow
  # exists in this repo's Actions history yet, so this cap's runtime
  # behaviour has never actually been observed -- its failure mode if
  # wrong is fail-OPEN (bills the full 3-OS matrix), not a hang.
  merge_group:
  workflow_dispatch:

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ---------------------------------------------------------------
  # Cheap path detector -- NOT a required context itself, same shape as
  # pr-bootstrap-distro-install.yml's own `detect` job (copied, not
  # reinvented -- see that file's comment for the full rationale).
  # Gated off on `merge_group` (see the trigger comment above); always
  # runs fast on `pull_request`/`push`/`workflow_dispatch`. Its output
  # gates the heavy matrix jobs below.
  # ---------------------------------------------------------------
  detect:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect cross-platform-zephyr-relevant changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3
        timeout-minutes: 2
        with:
          filters: |
            relevant:
              - 'metadata/**'
              - 'scripts/**'
              - 'examples/**'
              - 'include/**'
              - 'firmware/**'
              - 'zephyr/**'
              - 'meta-alp-sdk/**'
              - 'tests/scripts/**'
              - 'docs/**/*.md'
              - 'README.md'
              # `pytest tests/scripts/` also runs in
              # pr-metadata-validate.yml's `validate` job, but that
              # workflow's `pull_request` `paths:` list has exactly one
              # '.github/workflows/' entry -- its own file -- and its
              # `push` `paths:` list has none at all, not even its own
              # file. This is the only workflow where an edit to ANY
              # workflow file reaches test_workflows_are_loadable.py,
              # which lives under tests/scripts/ and is exercised by
              # python-smoke's pytest step. Narrowing this back to a
              # single filename is how two unparseable workflows reached
              # `dev` unnoticed before.
              - '.github/workflows/**'

  # ---------------------------------------------------------------
  # Pure-Python smoke: metadata validation + cross-platform lint +
  # public/private classifier + pytest sweep.  Runs identically on
  # every host OS.
  # ---------------------------------------------------------------
  python-smoke:
    name: python-smoke
    needs: detect
    # Fail CLOSED, not open -- mirrors pr-bootstrap-distro-install.yml's
    # `distro-install` job `if:` exactly (see that file's comment for the
    # full reasoning): skip ONLY when `detect` genuinely ran, genuinely
    # succeeded, AND genuinely found no watched path changed. Anything
    # else (workflow_dispatch, a merge-queue entry, a `detect`
    # non-success) runs the real job.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.detect.result != 'success' || needs.detect.outputs.relevant == 'true')
    runs-on: ${{ matrix.os }}
    # #1477: worst observed successful run 1068s/17.8min (windows-latest,
    # across 9 sampled runs) -- driven by the `pytest tests/scripts/`
    # step below, which is pure local Python and so (per this file's own
    # network/compile heuristic) carries no timeout-minutes of its own;
    # the job ceiling is what actually bounds it. 40min = ~2.2x that
    # observed worst case.
    timeout-minutes: 40

    strategy:
      # Every leg reports independently: a Windows-only break must not
      # cancel the macOS leg that would have shown the same defect from
      # a second angle.
      fail-fast: false
      matrix:
        # merge_group has no paths: filter (see the trigger comment above), so
        # cap it to the ubuntu-latest leg -- this PRESUMES the eventual
        # required context ends up ubuntu-latest-only (alp-sdk#1528 leaves
        # that open; widen this cap first if macOS/Windows get required
        # instead, or the queue hangs on those contexts per #1415) --
        # rather than billing the full macOS (10x)/Windows (2x) matrix
        # cost on every dev merge-queue entry.
        # The cap has to live here, not in a job-level `if:` -- `matrix` is
        # not in the context list `jobs.<job_id>.if` gets (only `github`,
        # `inputs`, `needs`, `vars`; enforced by
        # scripts/check_workflow_expressions.py); `jobs.<job_id>.strategy`
        # does get `github`, so the conditional selects the matrix values
        # instead. Accepted cost: making `matrix.os` a dynamic expression
        # here loses actionlint's matrix-value enumeration for this job
        # (and loader-smoke's, below) -- a typo'd `matrix.os` comparison
        # elsewhere in either job now type-checks as `any` instead of
        # being caught against the enumerated ["ubuntu-latest",
        # "macos-latest", "windows-latest"] set actionlint would otherwise
        # know.
        os: ${{ github.event_name == 'merge_group' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        timeout-minutes: 5
        with:
          python-version-file: .python-version

      - name: Install Python deps
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        # model-io adds tflite + flatbuffers so the .alpmodel tensor-I/O
        # tests run here (they importorskip otherwise); cbor2 is a base dep.
        run: pip install -e ".[dev,model-io]"

      # ---------------------------------------------------------
      # 1. Metadata validation.
      #    Pure-Python, no Zephyr / west / toolchain needed.
      #    Runs identically on every host OS.
      # ---------------------------------------------------------
      - name: validate metadata (all SoCs)
        run: python scripts/validate_metadata.py

      - name: validate board.yaml example
        run: |
          python scripts/validate_board_yaml.py --input metadata/templates/board.yaml.example

      # ---------------------------------------------------------
      # 2. Cross-platform lint (this slice, ADR 0012).
      #    --fail-on-warning: the existing-doc cleanup this was
      #    waiting on is done (0 findings); a new Linux-only idiom
      #    now fails the job instead of passing silently.
      # ---------------------------------------------------------
      - name: check_cross_platform lint
        run: python scripts/check_cross_platform.py --fail-on-warning

      - name: check public/private classifier
        run: python scripts/check_public_private.py

      # ---------------------------------------------------------
      # 3. bash -n parse gate over every shell script the repo ships,
      #    parsed with the runner's SYSTEM bash.  Runs BEFORE pytest
      #    so a parse error is reported as bash's own file+line+token,
      #    not buried 100+ lines deep in a pytest assertion repr.
      #
      #    macos-latest's SYSTEM bash is 3.2.57 (Apple has frozen it
      #    on the last GPLv2 release since ~2007) -- that's real,
      #    unmodified bash 3.2 coverage with no container needed on
      #    this leg, BUT only because the step pins the interpreter to
      #    /bin/bash there: `shell: bash` resolves via PATH and the
      #    runner image ships a Homebrew bash 5.x ahead of the system
      #    one, so a bare `bash -n` would quietly parse with 5.x and
      #    cover nothing this gate exists for.  The step asserts the
      #    macOS interpreter really reports 3.2 and fails loudly if a
      #    future image moves it.  The step runs on every OS rather
      #    than being macOS-only: a script that's actually valid
      #    shell parses clean under any bash version, so there is no
      #    reason to special-case which leg checks it, and Ubuntu +
      #    Windows(Git Bash) catch the ordinary syntax-error class the
      #    same way.
      #
      #    Why this matters (PR #1050, 2026-07): bash 3.2 has a real
      #    parser quirk newer bash does not -- it keeps tracking
      #    single-quote state ACROSS a heredoc body while scanning for
      #    the closing `)` of an enclosing `$( )`, even though the
      #    heredoc tag itself is quoted (`<<'PY'`). An ODD number of
      #    apostrophes inside such a heredoc desyncs the parser, which
      #    then fails much later at a token with nothing to do with
      #    the real defect. scripts/bootstrap.sh:271's
      #    `_facts="$(python3 - … <<'PY' … PY)"` hit exactly this: a
      #    single added apostrophe in a comment inside the heredoc
      #    (making the count 7 instead of 6) broke parsing 131 lines
      #    later, at an unrelated `(` in a plain `ok "…"` call. Two
      #    hypotheses were disproved and `bash -n` on bash 5.2 stayed
      #    clean before the real cause was found -- shellcheck does
      #    not catch this either (it doesn't parse under bash 3.2).
      #    This step exists so the NEXT one is named directly instead
      #    of re-derived by hand on a borrowed Mac.
      #
      #    (bash 3.2.57 itself cannot be rebuilt from source here for
      #    local reproduction -- its shipped y.tab.c is stale against
      #    parse.y and the build fails without `bison`. Use the
      #    `docker.io/library/bash:3.2` container image instead, e.g.
      #    `podman run --rm -v "$PWD":/w:ro docker.io/library/bash:3.2
      #    bash -n /w/scripts/bootstrap.sh` -- see stage_bash32_parse
      #    in scripts/test-all.sh for the local-CI equivalent of this
      #    step.)
      # ---------------------------------------------------------
      - name: bash -n parse gate (bash 3.2 compat)
        shell: bash
        run: |
          set -u
          # PIN THE INTERPRETER ON macOS. `shell: bash` resolves via PATH,
          # and the macos-latest runner image ships a Homebrew bash 5.x
          # AHEAD of the system one -- so a bare `bash -n` here would parse
          # with 5.x and this gate would silently stop covering the only
          # thing it exists for. Apple's frozen 3.2.57 is at /bin/bash.
          PARSER=bash
          if [ "$(uname -s)" = "Darwin" ]; then
              PARSER=/bin/bash
          fi
          PARSER_VERSION="$("${PARSER}" --version | head -1)"
          echo "parsing with: ${PARSER} -- ${PARSER_VERSION}"
          # On macOS, refuse to run rather than downgrade in silence: if a
          # future runner image moves /bin/bash off 3.2, this gate stops
          # being bash-3.2 coverage and must SAY SO, not pass quietly.
          if [ "$(uname -s)" = "Darwin" ]; then
              case "${PARSER_VERSION}" in
                  *"version 3.2"*) ;;
                  *)
                      echo "::error::${PARSER} is '${PARSER_VERSION}', not bash 3.2 -- this leg is the repo's ONLY real bash-3.2 parse coverage (see the comment above and PR #1050). Point PARSER at a 3.2 interpreter or move this gate to the docker.io/library/bash:3.2 container before removing this check."
                      exit 1
                      ;;
              esac
          fi
          count=0
          rc=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! "${PARSER}" -n "${f}"; then
              echo "::error file=${f}::bash -n parse error under ${PARSER_VERSION} (see bash output above)"
              rc=1
            fi
          done < <(git ls-files '*.sh')
          # `git ls-files` failing (wrong cwd, not a checkout) discards its
          # exit status through the pipe into `read` -- the loop body would
          # just never run and this step would exit 0 having "parsed" zero
          # files, the exact silent-empty-loop shape this gate exists to
          # rule out one level down. Fail loudly instead.
          if [ "${count}" -eq 0 ]; then
            echo "::error::git ls-files '*.sh' returned NO files -- refusing to report a silent pass."
            exit 1
          fi
          exit "${rc}"

      # ---------------------------------------------------------
      # 4. Test sweep -- the same pytest battery the Linux PR
      #    gate runs.  ~370 tests; <30 s on every OS on Linux/macOS, but
      #    Windows is far slower (worst observed successful run 1009s/
      #    16.8min across the sampled history) -- #1477 gave this step an
      #    explicit timeout-minutes rather than leaving it to the
      #    uncapped-step 1min/step budget
      #    test_job_ceiling_exceeds_the_sum_of_its_step_timeouts assumes,
      #    which was never true for this step (see that constant's own
      #    comment in the test file).
      # ---------------------------------------------------------
      - name: pytest tests/scripts/
        timeout-minutes: 25
        run: python -m pytest tests/scripts/ -q

  # ---------------------------------------------------------------
  # Loader smoke: every emit mode of alp_project.py produces
  # non-empty output.  Cross-checks the loader's cross-platform
  # path handling (forward-slash vs backslash, line endings, …).
  # ---------------------------------------------------------------
  loader-smoke:
    name: loader-smoke
    needs: detect
    # Same fail-closed shape as python-smoke's `if:` above -- see that
    # job's comment. No `loader-smoke · all` summary job exists (yet):
    # #1528 only asks about promoting python-smoke; this gating exists
    # for trigger-cost parity now that the workflow-level `paths:` filter
    # is gone, not because loader-smoke is on a path to being required.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || needs.detect.result != 'success' || needs.detect.outputs.relevant == 'true')
    runs-on: ${{ matrix.os }}
    # #1477: worst observed successful run 26s across 9 sampled runs.
    # Raised from the formula's 15min to 20min so the job ceiling stays
    # strictly above the sum of its own step timeouts plus the 1min/step
    # budget test_job_ceiling_exceeds_the_sum_of_its_step_timeouts assigns
    # every uncapped `emit *` step (6 of them; only the flagged setup
    # steps above carry their own cap).
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # merge_group has no paths: filter (see the trigger comment above), so
        # cap it to the ubuntu-latest leg -- this PRESUMES the eventual
        # required context ends up ubuntu-latest-only (alp-sdk#1528 leaves
        # that open; widen this cap first if macOS/Windows get required
        # instead, or the queue hangs on those contexts per #1415) --
        # rather than billing the full macOS (10x)/Windows (2x) matrix
        # cost on every dev merge-queue entry.
        # The cap has to live here, not in a job-level `if:` -- `matrix` is
        # not in the context list `jobs.<job_id>.if` gets (only `github`,
        # `inputs`, `needs`, `vars`; enforced by
        # scripts/check_workflow_expressions.py); `jobs.<job_id>.strategy`
        # does get `github`, so the conditional selects the matrix values
        # instead. Accepted cost: making `matrix.os` a dynamic expression
        # here loses actionlint's matrix-value enumeration for this job
        # (and python-smoke's, above) -- a typo'd `matrix.os` comparison
        # elsewhere in either job now type-checks as `any` instead of
        # being caught against the enumerated ["ubuntu-latest",
        # "macos-latest", "windows-latest"] set actionlint would otherwise
        # know.
        os: ${{ github.event_name == 'merge_group' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        timeout-minutes: 5
        with:
          python-version-file: .python-version

      - name: Install Python deps
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        run: pip install jsonschema pyyaml

      # Exercise every emit mode against the canonical template.
      # Using `python -m` + explicit args keeps the invocation
      # shell-agnostic (works on PowerShell + bash + zsh).
      - name: emit zephyr-conf
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit zephyr-conf

      - name: emit cmake-args
        timeout-minutes: 2
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit cmake-args

      - name: emit hw-info-h
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit hw-info-h

      - name: emit dts-overlay
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit dts-overlay

      - name: emit west-libraries
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit west-libraries

      - name: emit yocto-conf
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit yocto-conf

  # ---------------------------------------------------------------
  # Static-named summary gate -- THIS is the job a future promotion
  # should require, never the six `python-smoke (${{ matrix.os }})` /
  # `loader-smoke (${{ matrix.os }})` matrix-interpolated legs above.
  # Copies pr-bootstrap-distro-install.yml's own `summary:` job pattern
  # verbatim (see that file's comment for why a matrix-interpolated name
  # is unrequirable and how #1474 proved it). `if: always()` + a
  # literal, `${{ }}`-free name means this is always resolvable as a
  # required status check, whether python-smoke ran, skipped, or failed.
  #
  # Covers python-smoke only: #1528 asks about promoting python-smoke,
  # not loader-smoke (see the header NOTE's loader-smoke paragraph).
  # ---------------------------------------------------------------
  summary:
    name: python-smoke · all
    needs: [detect, python-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Verdict logic mirrors pr-bootstrap-distro-install.yml's own
      # `summary` job step, adapted to this workflow's job/output names --
      # same fail-closed reasoning: a bare `!= 'failure'` reading would
      # treat 'skipped' as an automatic pass, but 'skipped' is only a
      # legitimate pass under the one condition `detect` itself defines.
      - name: Compute verdict from python-smoke's + detect's results
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_RELEVANT: ${{ needs.detect.outputs.relevant }}
          MATRIX_RESULT: ${{ needs.python-smoke.result }}
        run: |
          set -euo pipefail
          echo "event=${EVENT_NAME} detect.result=${DETECT_RESULT} detect.relevant=${DETECT_RELEVANT} python-smoke.result=${MATRIX_RESULT}"

          case "${MATRIX_RESULT}" in
            success)
              echo "PASS: every python-smoke leg ran and succeeded"
              exit 0
              ;;
            skipped)
              if { [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "push" ]; } \
                 && [ "${DETECT_RESULT}" = "success" ] && [ "${DETECT_RELEVANT}" != "true" ]; then
                echo "PASS: python-smoke legitimately skipped -- detect ran, succeeded, and found no watched path changed"
                exit 0
              fi
              echo "::error::python-smoke reported 'skipped' but event=${EVENT_NAME} detect.result=${DETECT_RESULT} detect.relevant=${DETECT_RELEVANT} does not match the one legitimate-skip condition -- treating this as a broken gate, not a pass"
              exit 1
              ;;
            *)
              echo "::error::python-smoke concluded '${MATRIX_RESULT}' -- at least one leg did not run and pass"
              exit 1
              ;;
          esac
