# SPDX-License-Identifier: Apache-2.0
#
# Cross-platform Zephyr-on-M smoke gate for the Alp SDK.
#
# Per ADR 0012 (docs/adr/0012-cross-platform-developer-host.md)
# the Zephyr-on-M-class developer workflow is first-class on
# Win + Mac + Linux.  This workflow is the mechanical CI proof
# of that claim: every PR runs the metadata validator, the
# cross-platform lint, public/private classifier, and a single-board native_sim build on
# Ubuntu + macOS + Windows runners.
#
# Linux remains the canonical baseline (the shipped pr-twister.yml
# + pr-metadata-validate.yml + pr-bitbake.yml gates stay on
# ubuntu-latest).  This workflow ADDS Mac + Win coverage; it does
# not replace any existing gate.
#
# Operating mode:
#
#   - EVERY leg fails the JOB, Linux + macOS + Windows alike, on
#     its own defect -- see the NOTE below for whether that also
#     fails the PR (it does not, yet).  A macOS-only or Windows-only
#     failure is a REAL defect on a host ADR 0012 calls first-class.
#
#     This was scaffolding until 2026-07-29 (alp-sdk#1023): the Mac
#     and Win legs carried `continue-on-error: true`, so a job-level
#     `continue-on-error` made the check report SUCCESS no matter
#     what its steps did -- the ADR 0012 claim was unenforced and a
#     host-specific regression landed green.  Note what that means
#     for the run history: while the override was in place, a green
#     tick on these legs proved nothing, so "it has always passed"
#     was never evidence.  The flip was made on the back of four
#     consecutive runs (30457062916, 30455621379, 30450805406,
#     30441032872) whose per-STEP conclusions -- not the job
#     conclusions the override forged -- were 24/24 clean.
#
#     NOTE: this workflow's jobs (python-smoke, loader-smoke) are not
#     in dev's or main's required-status-check list (verified via
#     `gh api repos/alplabai/alp-sdk/rulesets` -> `[]` and
#     `.../branches/{dev,main}/protection/required_status_checks`,
#     neither of which lists these six contexts), so a red run here
#     is visible but does not block merge yet -- removing
#     continue-on-error buys a real signal, not enforcement. Adding
#     these six contexts (three OSes x two jobs) to branch protection
#     is a separate follow-up requiring the maintainer's decision.
#
#   - check_cross_platform.py: runs with --fail-on-warning on every
#                               runner. The existing-doc cleanup this
#                               was waiting on is done (2 bash-shebang
#                               findings in tests/yocto/*.sh, fixed by
#                               whitelisting them with header notes --
#                               see INTENTIONALLY_BASH_HELPERS in the
#                               script); 0 findings as of this change.
#
# Twister + bitbake are NOT exercised here:
#   - Twister is the load-bearing Zephyr coverage gate -- it lives
#     in pr-twister.yml and stays Linux-only (the SDK + Zephyr
#     toolchain image is Linux-only on the CI side; Win + Mac
#     would download a different toolchain set).
#   - Bitbake is Linux-only by upstream constraint (ADR 0012 §8.1)
#     and lives in pr-bitbake.yml.
#
# This workflow is the minimum cross-platform smoke that says
# "yes, alp-sdk's Zephyr-on-M workflow really does work on a
# Mac / Windows host" -- it is intentionally cheap (no Zephyr
# workspace setup, no real-silicon toolchain pull) so PR latency
# stays low.

name: cross-platform-zephyr

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'metadata/**'
      - 'scripts/**'
      - 'examples/**'
      - 'include/**'
      - 'firmware/**'
      - 'zephyr/**'
      - 'meta-alp-sdk/**'
      - 'tests/scripts/**'
      - 'docs/**/*.md'
      - 'README.md'
      - '.github/workflows/cross-platform-zephyr.yml'
  push:
    branches: [main]
    paths:
      - 'metadata/**'
      - 'scripts/**'
      - 'examples/**'
      - 'include/**'
      - 'firmware/**'
      - 'zephyr/**'
      - 'meta-alp-sdk/**'
      - 'tests/scripts/**'
      - 'docs/**/*.md'
      - 'README.md'
      - '.github/workflows/cross-platform-zephyr.yml'
  workflow_dispatch:

# Cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ---------------------------------------------------------------
  # Pure-Python smoke: metadata validation + cross-platform lint +
  # public/private classifier + pytest sweep.  Runs identically on
  # every host OS.
  # ---------------------------------------------------------------
  python-smoke:
    name: python-smoke
    runs-on: ${{ matrix.os }}

    strategy:
      # Every leg reports independently: a Windows-only break must not
      # cancel the macOS leg that would have shown the same defect from
      # a second angle.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install Python deps
        # model-io adds tflite + flatbuffers so the .alpmodel tensor-I/O
        # tests run here (they importorskip otherwise); cbor2 is a base dep.
        run: pip install -e ".[dev,model-io]"

      # ---------------------------------------------------------
      # 1. Metadata validation.
      #    Pure-Python, no Zephyr / west / toolchain needed.
      #    Runs identically on every host OS.
      # ---------------------------------------------------------
      - name: validate metadata (all SoCs)
        run: python scripts/validate_metadata.py

      - name: validate board.yaml example
        run: |
          python scripts/validate_board_yaml.py --input metadata/templates/board.yaml.example

      # ---------------------------------------------------------
      # 2. Cross-platform lint (this slice, ADR 0012).
      #    --fail-on-warning: the existing-doc cleanup this was
      #    waiting on is done (0 findings); a new Linux-only idiom
      #    now fails the job instead of passing silently.
      # ---------------------------------------------------------
      - name: check_cross_platform lint
        run: python scripts/check_cross_platform.py --fail-on-warning

      - name: check public/private classifier
        run: python scripts/check_public_private.py

      # ---------------------------------------------------------
      # 3. Test sweep -- the same pytest battery the Linux PR
      #    gate runs.  ~370 tests; <30 s on every OS.
      # ---------------------------------------------------------
      - name: pytest tests/scripts/
        run: python -m pytest tests/scripts/ -q

  # ---------------------------------------------------------------
  # Loader smoke: every emit mode of alp_project.py produces
  # non-empty output.  Cross-checks the loader's cross-platform
  # path handling (forward-slash vs backslash, line endings, …).
  # ---------------------------------------------------------------
  loader-smoke:
    name: loader-smoke
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install Python deps
        run: pip install jsonschema pyyaml

      # Exercise every emit mode against the canonical template.
      # Using `python -m` + explicit args keeps the invocation
      # shell-agnostic (works on PowerShell + bash + zsh).
      - name: emit zephyr-conf
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit zephyr-conf

      - name: emit cmake-args
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit cmake-args

      - name: emit hw-info-h
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit hw-info-h

      - name: emit dts-overlay
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit dts-overlay

      - name: emit west-libraries
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit west-libraries

      - name: emit yocto-conf
        run: python scripts/alp_project.py --input metadata/templates/board.yaml.example --emit yocto-conf
