# SPDX-License-Identifier: Apache-2.0
#
# ADR-0020 parity gate, seam 1 (plan-shape) -- runs IN alp-sdk's own CI, no
# token/App/cross-repo dispatch. seam1 is pure Python: it emits this checkout's
# own `--emit build-plan` and diffs it (checkout-root + sdkCommit normalized)
# against the frozen oracle at tests/parity/oracle (captured at df312cec^ =
# 97ad481b, the last SHA with both fan_out and the Phase-1 fields). The only
# allowed delta is debug.probe "openocd"->null (#848, hand-reviewed); any other
# emit change fails the gate ON THIS PR -- which is exactly where the ADR wants
# it surfaced. seam2 (real build + Renode smoke, needs a toolchain runner) is a
# separate follow-up. Tracked in #855.
name: parity-seam1

on:
  pull_request:
    paths:
      - "scripts/alp_orchestrate/**"
      - "metadata/**"
      - "examples/**/board.yaml"
      - "tests/parity/**"
  push:
    branches: [dev, main]
    paths:
      - "scripts/alp_orchestrate/**"
      - "metadata/**"
      - "examples/**/board.yaml"
      - "tests/parity/**"

permissions:
  contents: read

jobs:
  seam1:
    name: "seam1 -- build-plan shape parity"
    runs-on: ubuntu-latest
    # #1477: worst observed successful run 14s across 3 sampled runs.
    # Raised from the formula's 10min to 15min so the ceiling stays
    # strictly above the sum of its capped steps plus the 1min/step
    # budget for the uncapped ones below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        timeout-minutes: 3
        with:
          python-version: "3.x"
      - name: install emit deps
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        run: pip install jsonschema pyyaml pytest
      # The comparator's own unit tests, BEFORE the live comparison it guards.
      # These 15 ran in no workflow on either side: this job invoked only
      # `seam1_field_diff.py` itself, and `test-all.sh`'s pytest stage is scoped
      # to `tests/scripts/`, so `tests/parity/` was excluded from both. A gate
      # whose comparator is unverified reports whatever that comparator happens
      # to do -- and tan-cli#156 is the proof this is not theoretical: a
      # tolerance there accepted a slice's `command` vanishing with NO warning,
      # so seam 1 could go green on a silently dropped command.
      #
      # Ordered first on purpose. If the comparator is broken, the live diff
      # below is not evidence of anything, and its result should not be the
      # thing anyone reads.
      - name: seam1 comparator unit tests
        run: python3 -m pytest tests/parity/test_seam1_field_diff.py -q

      - name: seam1 field-diff (own emit vs frozen oracle)
        run: python3 tests/parity/seam1_field_diff.py --sdk . --oracle tests/parity/oracle
