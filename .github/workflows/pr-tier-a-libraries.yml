# SPDX-License-Identifier: Apache-2.0
#
# ADR 0018 Tier-A library gate.
#
# Tier A means the library is version-pinned and CI-built for each
# supported SoM family.  This workflow generates the per-family
# alp.conf from a synthetic board.yaml, then builds the shared Zephyr
# library_knobs smoke app with those real emitted CONFIG lines.
#
# native_sim can only prove the Tier-A libraries whose Zephyr Kconfig
# can build on the host architecture -- that set is
# metadata/registries/tier-a-library-ci.json's hostBuild.libraries (the
# single source; not hand-duplicated here so this comment can't go
# stale the way it did before #1274, when a 4-name list here missed
# Modbus joining as the 5th).  cmsis-nn is still Tier A, but upstream
# Zephyr gates it with `depends on CPU_CORTEX_M`; its metadata and
# emission stay covered by the Python tests until a real Cortex-M
# board build lane is available.

name: pr-tier-a-libraries

on:
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/workflows/pr-tier-a-libraries.yml'
      - 'metadata/libraries/**'
      - 'metadata/e1m_modules/**'
      - 'metadata/registries/tier-a-library-ci.json'
      - 'metadata/schemas/library-v1.schema.json'
      - 'metadata/schemas/tier-a-library-ci-v1.schema.json'
      - 'scripts/alp_project.py'
      - 'scripts/validate_metadata.py'
      - 'scripts/gen_tier_a_ci_matrix.py'
      - 'tests/scripts/test_library_layer.py'
      - 'tests/scripts/test_project_*.py'
      - 'tests/scripts/test_gen_tier_a_ci_matrix.py'
      - 'tests/zephyr/library_knobs/**'
      - 'west.yml'
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/pr-tier-a-libraries.yml'
      - 'metadata/libraries/**'
      - 'metadata/e1m_modules/**'
      - 'metadata/registries/tier-a-library-ci.json'
      - 'metadata/schemas/library-v1.schema.json'
      - 'metadata/schemas/tier-a-library-ci-v1.schema.json'
      - 'scripts/alp_project.py'
      - 'scripts/validate_metadata.py'
      - 'scripts/gen_tier_a_ci_matrix.py'
      - 'tests/scripts/test_library_layer.py'
      - 'tests/scripts/test_project_*.py'
      - 'tests/scripts/test_gen_tier_a_ci_matrix.py'
      - 'tests/zephyr/library_knobs/**'
      - 'west.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-family-matrix:
    name: tier-a-libraries · compute family matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      # #1274: a marketplace `uses:` step is its own network round trip
      # (fetch the action, then do its job) and can stall like any other
      # step here -- same reasoning as tier-a-library-build's caps below.
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          path: alp-sdk
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version-file: alp-sdk/.python-version

      # #1274: no timeout-minutes here -- pure local Python, not a
      # network/install/compile step per the same heuristic
      # test_tier_a_workflow_step_timeouts.py applies. It still costs real
      # time though (observed up to 2s across 44 sampled runs), which is
      # why the job's own ceiling carries a minute of headroom over the
      # two capped steps above it rather than fitting them exactly.
      - name: Derive build matrix from familyMatrix registry
        id: matrix
        working-directory: alp-sdk
        run: |
          echo "matrix=$(python3 scripts/gen_tier_a_ci_matrix.py)" >> "$GITHUB_OUTPUT"

  tier-a-library-build:
    name: tier-a-libraries · ${{ matrix.som }}
    needs: compute-family-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-family-matrix.outputs.matrix) }}

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      # #1274: every `uses:` step below is its own network round trip
      # (fetch the action, then do its job) and can stall the same way
      # `apt-get`/`pip`/`west` can -- same failure class as the run: steps
      # this job already caps.
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          path: alp-sdk
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version-file: alp-sdk/.python-version

      # #1274: apt-get stalled here long enough to consume the whole job's
      # 30-minute budget in one run, while sibling shards ran this same
      # step in under 30s (exact run/job IDs and timings: CHANGELOG.md's
      # #1274 entry). That's a runner/mirror hiccup, not this repo's
      # content -- left uncapped, the eventual timeout landed on the build
      # step instead of naming the actual stall. Every step below that does
      # real network/install/compile work now carries its own timeout,
      # re-derived from this step's own worst SUCCESSFUL run in 44 sampled
      # runs (214s) with real headroom (8min = 480s = 2.24x, not a cap that
      # fires on a slow-but-fine run -- CHANGELOG.md's #1274 entry); the sum
      # stays under the job's 45-minute ceiling so a step running late can
      # still be killed by its own timeout first.
      - name: Install host build tools
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y --no-install-recommends \
              ninja-build gperf ccache dfu-util device-tree-compiler \
              python3-dev python3-pip python3-setuptools python3-wheel \
              libffi-dev libssl-dev xz-utils file make gcc gcc-multilib \
              g++-multilib libsdl2-dev libmagic1

      # #1274: same failure class as "Install host build tools" above
      # (PyPI/mirror stall), same job, and it runs before the build.
      - name: Install west
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        run: pip3 install west

      # #1274: `west update` fetches every Zephyr module over the network,
      # so a slow mirror can hang here the same way. Cap it well short of
      # the job's ceiling so a network stall here is legible as this step,
      # not as the build -- worst SUCCESSFUL run in 44 sampled runs was
      # 383s (6m23s, run 30800710350); 13min = 780s = 2.04x headroom over
      # that (CHANGELOG.md's #1274 entry).
      - name: west init Zephyr workspace
        working-directory: ${{ github.workspace }}
        timeout-minutes: 13
        run: |
          mkdir -p zephyrproject
          cd zephyrproject
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.4.1 .
          west update --narrow -o=--depth=1
          west zephyr-export

      # #1274: actions/cache@ makes its own network round trip to the
      # cache service and can hang on a backend issue -- same class as the
      # steps above. Worst successful run in 44 sampled runs was 62s;
      # 3min = 180s = 2.9x headroom.
      - name: Cache Zephyr modules
        uses: actions/cache@v5
        timeout-minutes: 5
        with:
          path: |
            ${{ github.workspace }}/zephyrproject/modules
            ${{ github.workspace }}/zephyrproject/zephyr
          key: zephyr-v4.4.1-tier-a-${{ runner.os }}

      - name: Cache ccache objects
        uses: actions/cache@v5
        timeout-minutes: 5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-tier-a-${{ matrix.som }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-tier-a-${{ matrix.som }}-

      - name: pip install Zephyr + alp-sdk requirements
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}/zephyrproject
        run: |
          pip3 install -r zephyr/scripts/requirements.txt
          pip3 install jsonschema pyyaml

      - name: Generate Tier-A alp.conf for ${{ matrix.som }}
        working-directory: ${{ github.workspace }}/alp-sdk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tier-a"
          python3 - "$RUNNER_TEMP/tier-a/board.yaml" "${{ matrix.som }}" "${{ matrix.core }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          sku = sys.argv[2]
          core = sys.argv[3]
          registry = json.loads(
              Path("metadata/registries/tier-a-library-ci.json").read_text(encoding="utf-8")
          )
          libraries = "\n".join(f"  - {name}" for name in registry["hostBuild"]["libraries"])
          out.write_text(
              f"som:\n"
              f"  sku: {sku}\n"
              f"libraries:\n"
              f"{libraries}\n"
              f"cores:\n"
              f"  {core}:\n"
              f"    os: zephyr\n"
              f"    app: ./app\n",
              encoding="utf-8",
          )
          PY
          python3 scripts/alp_project.py \
            --input "$RUNNER_TEMP/tier-a/board.yaml" \
            --emit zephyr-conf \
            --core "${{ matrix.core }}" \
            > "$RUNNER_TEMP/tier-a/alp.conf"
          cat "$RUNNER_TEMP/tier-a/alp.conf" \
            tests/zephyr/library_knobs/prj_tier_a_native_sim.conf \
            > "$RUNNER_TEMP/tier-a/tier-a-extra.conf"

      # #1274: this is the step a job-level timeout lands on if an earlier
      # setup step stalls, so it inherited the blame for a slow apt-get
      # that had nothing to do with the build (see CHANGELOG.md's #1274
      # entry). The `library_knobs` app itself (5 Tier-A libraries --
      # metadata/registries/tier-a-library-ci.json hostBuild.libraries)
      # built in 1-2 minutes even on a cold ccache in every run inspected;
      # this timeout leaves headroom for growth while naming itself, not a
      # setup step, as the slow part if it ever is one.
      - name: Build Tier-A library smoke on native_sim
        working-directory: ${{ github.workspace }}/zephyrproject
        timeout-minutes: 6
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
          EXTRA_ZEPHYR_MODULES: ${{ github.workspace }}/alp-sdk
        run: |
          west build -p always \
            -b native_sim/native/64 \
            "$GITHUB_WORKSPACE/alp-sdk/tests/zephyr/library_knobs" \
            -- \
            -DEXTRA_CONF_FILE="$RUNNER_TEMP/tier-a/tier-a-extra.conf" \
            -DDTC_OVERLAY_FILE="$GITHUB_WORKSPACE/alp-sdk/tests/zephyr/library_knobs/overlays/native_sim_tier_a.overlay"

  cmsis-nn-metadata:
    name: tier-a-libraries · cmsis-nn metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # #1274: same reasoning as compute-family-matrix's Checkout/Set up
      # Python above -- a marketplace `uses:` step makes its own network
      # round trip and can stall.
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          path: alp-sdk
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version-file: alp-sdk/.python-version

      # #1274: same failure class as the tier-a-library-build job's own
      # pip/apt/west steps -- an uncapped install here can still eat this
      # job's 10-minute ceiling and land the timeout on the pytest step below.
      - name: Install Python deps
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        run: pip install click jsonschema pyyaml pytest

      # #1274: this job's `pytest` invocation is the only lane that runs
      # on a PR touching *only* this workflow file (the two lanes that run
      # the full `tests/scripts/` sweep -- pr-metadata-validate.yml and
      # cross-platform-zephyr.yml -- do not trigger on
      # `.github/workflows/pr-tier-a-libraries.yml`). Naming
      # test_tier_a_workflow_step_timeouts.py here is what makes the
      # regression gate itself run when someone edits this file.
      - name: Validate Tier-A library metadata and emit tests
        working-directory: ${{ github.workspace }}/alp-sdk
        run: |
          python3 scripts/validate_metadata.py
          python3 -m pytest tests/scripts/test_library_layer.py tests/scripts/test_project_*.py tests/scripts/test_tier_a_workflow_step_timeouts.py -q
