# SPDX-License-Identifier: Apache-2.0
#
# Verifies the plain-CMake (non-Zephyr) build paths.  Compiles the
# baremetal and yocto backends as host libraries with the host
# toolchain so the stub backend at src/common/stub_backend.c stays
# link-complete every PR.
#
# This catches:
#   - New public functions added to <alp/...>.h without a matching
#     stub in src/common/stub_backend.c (linker error on
#     undefined-reference).
#   - Header self-containment issues (missing forward declarations,
#     stale typedefs).
#   - Compile errors that only surface outside Zephyr's environment
#     (e.g. assumptions about ZEPHYR_BASE-defined macros).

name: pr-plain-cmake

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'meta-alp-sdk/recipes-devtools/zcbor/**'
      - '.github/workflows/pr-plain-cmake.yml'
  push:
    branches: [main, dev]
    paths:
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'meta-alp-sdk/recipes-devtools/zcbor/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baremetal:
    name: plain-cmake · baremetal stub backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      - name: Configure
        timeout-minutes: 2
        run: cmake -B build/baremetal -S . -DALP_OS=baremetal
      - name: Build
        timeout-minutes: 3
        run: cmake --build build/baremetal --parallel

  baremetal-aen:
    # ALP_OS=baremetal + ALP_SOM=aen activates the vendors/alif/
    # wrapper directory.  Without ALP_HAS_ALIF_HAL=ON the four
    # wrapper sources (i2c.c, spi.c, gpio.c, uart.c) compile to
    # empty translation units; stub_backend.c keeps providing the
    # NOSUPPORT defaults.  Verifies the dispatch + CMake wiring
    # without depending on the proprietary CMSIS pack -- the real
    # HAL link arrives in v0.2.x via cpackget AlifSemiconductor::Ensemble.
    name: plain-cmake · baremetal AEN (vendor scaffolding)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      - name: Configure
        timeout-minutes: 2
        run: cmake -B build/baremetal-aen -S . -DALP_OS=baremetal -DALP_SOM=aen
      - name: Build
        timeout-minutes: 2
        run: cmake --build build/baremetal-aen --parallel

  baremetal-v2n:
    # ALP_OS=baremetal + ALP_SOM=v2n activates the
    # vendors/renesas-rzv2n/ wrapper directory.  Same pattern as
    # baremetal-aen above -- without ALP_HAS_RENESAS_FSP=ON the
    # wrapper sources compile to empty TUs and stub_backend.c
    # provides the NOSUPPORT defaults.  Real FSP link arrives in
    # v0.4 alongside the V2N HIL bring-up.
    name: plain-cmake · baremetal V2N (vendor scaffolding)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      - name: Configure
        timeout-minutes: 2
        run: cmake -B build/baremetal-v2n -S . -DALP_OS=baremetal -DALP_SOM=v2n
      - name: Build
        timeout-minutes: 3
        run: cmake --build build/baremetal-v2n --parallel

  consumer-add-subdirectory:
    # Issue #598: the README documents add_subdirectory() as a first-class
    # consumption mode, but nothing built alp-sdk as a NESTED project until
    # this job -- every job above builds alp-sdk as the top-level project,
    # which can't catch a CMAKE_SOURCE_DIR-vs-CMAKE_CURRENT_SOURCE_DIR path
    # bug (they're identical at the top level).  This job configures/builds
    # tests/cmake-consumer/add-subdirectory-smoke, a separate top-level
    # CMake project that add_subdirectory()s alp-sdk the documented way.
    name: plain-cmake · add_subdirectory() consumer (#598)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        som: ["none", "aen"]
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      - name: Configure
        timeout-minutes: 2
        run: >
          cmake -B build/consumer-${{ matrix.som }}
          -S tests/cmake-consumer/add-subdirectory-smoke
          -DALP_OS=baremetal -DALP_SOM=${{ matrix.som }}
      - name: Build
        timeout-minutes: 3
        run: cmake --build build/consumer-${{ matrix.som }} --parallel

  yocto:
    name: plain-cmake · yocto backend + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      # libmosquitto-dev unlocks the iot_yocto.c MQTT wrapper;
      # libasound2-dev unlocks the audio_yocto.c ALSA wrapper;
      # libssl-dev unlocks the security_yocto.c OpenSSL wrapper.
      # Without these the CMakeLists falls back to the NOSUPPORT
      # stubs and we'd lose coverage in CI.
      - name: Install Yocto-side runtime deps
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y --no-install-recommends \
              libmosquitto-dev libasound2-dev libssl-dev pkg-config
      - name: Configure
        timeout-minutes: 5
        run: cmake -B build/yocto -S . -DALP_OS=yocto -DALP_BUILD_TESTS=ON
      - name: Build
        timeout-minutes: 2
        run: cmake --build build/yocto --parallel
      # ctest exercises the inference dispatcher's NULL/INVAL paths,
      # the I2C/SPI/UART/GPIO wrappers' failure-path coverage, and
      # the MQTT wrapper's URI-parse + NULL-arg paths.  Real-adapter
      # HIL coverage is parked behind docs/ci/HW-IN-LOOP.md.
      - name: Test
        run: ctest --test-dir build/yocto --output-on-failure

  yocto-zcbor:
    # Issue #1254 CI-coverage follow-up (adversarial review on PR #1280):
    # the `yocto` leg above configures with a bare -DALP_OS=yocto on a
    # stock Ubuntu runner that has no zcbor package at all, so
    # src/common/alp_model.c NEVER compiles and alp_test_alpmodel_onnx_cpu
    # is skipped every single run -- the branch #1254 exists to deliver
    # had zero CI coverage. This leg builds zcbor itself from the SAME
    # tag meta-alp-sdk's own recipe pins
    # (recipes-devtools/zcbor/zcbor_0.9.1.bb), stages that recipe's own
    # zcbor_abi_pin.h alongside the built headers (the same do_install
    # layout), and configures with -DALP_SDK_MODEL_ZCBOR_REQUIRED=ON --
    # the flag the recipe's EXTRA_OECMAKE is supposed to set -- so a
    # regression here fails the CMake configure/build instead of
    # silently degrading to the NOSUPPORT stub. Deliberately not XFAIL:
    # an XFAIL would just re-assert the stub this issue exists to
    # replace.
    name: plain-cmake · yocto + zcbor (#1254)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      - name: Install Yocto-side runtime deps
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y --no-install-recommends \
              libmosquitto-dev libasound2-dev libssl-dev pkg-config
      - name: Build zcbor at the recipe's own pin (tag 0.9.1)
        run: |
          set -e
          git clone --depth 1 --branch 0.9.1 \
              https://github.com/NordicSemiconductor/zcbor.git \
              "$RUNNER_TEMP/zcbor-src"
          got="$(git -C "$RUNNER_TEMP/zcbor-src" rev-parse HEAD)"
          want="9b07780aca6fb21f82a241ba386ad9b379809337"
          if [ "$got" != "$want" ]; then
            echo "::error::zcbor tag 0.9.1 resolved to $got, expected $want (meta-alp-sdk/recipes-devtools/zcbor/zcbor_0.9.1.bb's SRCREV) -- upstream moved the tag, re-verify before updating this pin"
            exit 1
          fi
          install -d "$RUNNER_TEMP/zcbor-prefix/include" "$RUNNER_TEMP/zcbor-prefix/lib"
          for src in zcbor_common zcbor_decode zcbor_encode zcbor_print; do
            cc -I"$RUNNER_TEMP/zcbor-src/include" -fPIC \
                -c "$RUNNER_TEMP/zcbor-src/src/${src}.c" -o "$RUNNER_TEMP/${src}.o"
          done
          # No -Wl,-soname here (unlike the recipe's do_compile, which
          # pairs -soname libzcbor.so.0 with do_install's matching
          # libzcbor.so.0/libzcbor.so symlinks): a single un-sonamed
          # libzcbor.so keeps its own filename as its DT_NEEDED entry,
          # and CMake's find_library(ZCBOR_LIB) resolves an absolute
          # path to it, so CMake auto-adds this prefix's lib/ to the
          # test binaries' RUNPATH -- no LD_LIBRARY_PATH/symlink
          # bookkeeping needed for a throwaway CI prefix.
          cc -shared \
              -o "$RUNNER_TEMP/zcbor-prefix/lib/libzcbor.so" \
              "$RUNNER_TEMP"/zcbor_common.o "$RUNNER_TEMP"/zcbor_decode.o \
              "$RUNNER_TEMP"/zcbor_encode.o "$RUNNER_TEMP"/zcbor_print.o
          install -m 0644 \
              "$RUNNER_TEMP/zcbor-src/include/zcbor_common.h" \
              "$RUNNER_TEMP/zcbor-src/include/zcbor_decode.h" \
              "$RUNNER_TEMP/zcbor-src/include/zcbor_encode.h" \
              "$RUNNER_TEMP/zcbor-src/include/zcbor_print.h" \
              "$RUNNER_TEMP/zcbor-src/include/zcbor_tags.h" \
              meta-alp-sdk/recipes-devtools/zcbor/files/zcbor_abi_pin.h \
              "$RUNNER_TEMP/zcbor-prefix/include/"
      - name: Configure
        timeout-minutes: 2
        run: >
          cmake -B build/yocto-zcbor -S . -DALP_OS=yocto -DALP_BUILD_TESTS=ON
          -DALP_SDK_MODEL_ZCBOR_REQUIRED=ON
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/zcbor-prefix"
      - name: Build
        timeout-minutes: 3
        run: cmake --build build/yocto-zcbor --parallel
      - name: Test (alp_test_alpmodel_onnx_cpu must run, not skip)
        run: |
          set -e
          ctest --test-dir build/yocto-zcbor --output-on-failure
          if ! ctest --test-dir build/yocto-zcbor -N | grep -q alp_test_alpmodel_onnx_cpu; then
            echo "::error::alp_test_alpmodel_onnx_cpu was not registered against build/yocto-zcbor -- the zcbor wiring regressed silently back to the skip path"
            exit 1
          fi

  strict-warnings:
    # Issue #634: first-party alp-sdk C (dispatchers + src/backends/**,
    # NEVER vendors/**) must compile warning-free under the Alp-maintainer
    # strict profile (cmake/alp-sdk-warnings.cmake).  -Werror turns that
    # into a hard gate.  Runs both plain-CMake backends -- baremetal (+
    # AEN/V2N vendor-scaffolding variants, to prove those sources stay
    # excluded) and yocto with every optional real backend (mosquitto/
    # ALSA/OpenSSL) wired in, so the strict profile actually sees them.
    name: plain-cmake · strict-warnings (#634)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baremetal
            args: -DALP_OS=baremetal -DALP_BUILD_TESTS=ON
          - name: baremetal-aen
            args: -DALP_OS=baremetal -DALP_SOM=aen
          - name: baremetal-v2n
            args: -DALP_OS=baremetal -DALP_SOM=v2n
          - name: yocto
            args: -DALP_OS=yocto -DALP_BUILD_TESTS=ON
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      - name: Install Yocto-side runtime deps
        if: matrix.name == 'yocto'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y --no-install-recommends \
              libmosquitto-dev libasound2-dev libssl-dev pkg-config
      - name: Configure
        timeout-minutes: 5
        run: >
          cmake -B build/strict-${{ matrix.name }} -S . ${{ matrix.args }}
          -DALP_SDK_STRICT_WARNINGS=ON -DALP_SDK_WERROR=ON
      # -Werror already fails the build on any first-party COMPILER warning;
      # the grep below is a belt-and-braces check for warnings that don't
      # come from the compiler proper (a CMake deprecation notice, a linker
      # warning) and so aren't turned into an -Werror build failure at all.
      # Both checks need the build's real exit code, not `tee`'s: `| tee`
      # alone makes the pipeline's exit status tee's (always 0), which
      # swallows a failing `cmake --build` -- including one that failed
      # BECAUSE -Werror promoted a warning to an error -- and let it read
      # as green (issue #634 follow-up). PIPESTATUS[0] recovers the real
      # exit code without needing `set -o pipefail` (which combined with
      # this step's default `bash -e {0}` would abort the script on that
      # line before the ::error:: below could ever run).
      - name: Build (warning-free)
        timeout-minutes: 3
        run: |
          cmake --build build/strict-${{ matrix.name }} --parallel 2>&1 | tee build.log
          build_rc=${PIPESTATUS[0]}
          if [ "${build_rc}" -ne 0 ]; then
            echo "::error::cmake --build failed (exit ${build_rc}) for strict-${{ matrix.name }}; see build.log above."
            exit "${build_rc}"
          fi
          if grep -q "warning:" build.log; then
            echo "::error::strict-${{ matrix.name }} build emitted a warning outside -Werror's reach; see build.log above."
            exit 1
          fi

  link-complete:
    # Issue #593: every public <alp/*.h> function must be a real symbol
    # in BOTH the baremetal and yocto plain-CMake libalp_sdk.a archives
    # (a dispatcher, a real backend, or an explicit stub_backend.c
    # NOSUPPORT stub) -- never silently absent, or a portable app that
    # links clean on Zephyr fails at final link switching to baremetal
    # or Yocto.  Cross-checks `nm`'s defined-symbol list for each
    # archive against metadata/catalog.json's portable_api inventory
    # (the same list the doc-drift / ABI-snapshot gates already treat
    # as the source of truth for the portable surface).
    name: plain-cmake · link-completeness (#593)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: '3.11'
      - name: Check
        timeout-minutes: 3
        run: python3 scripts/check_plain_cmake_link_complete.py

  find-package-consumer:
    # Issue #607: an INSTALLED alp-sdk (ALP_SDK_BUILD_SHARED=ON) must be
    # a real CMake package -- `find_package(alp-sdk 0.9 REQUIRED)`
    # resolves, `alp::sdk` links, and the reported version matches the
    # authoritative include/alp/version.h (not a stale hardcoded 0.1.0).
    # Installs to a throwaway prefix, then configures/builds
    # tests/cmake-consumer/find-package-smoke as a SEPARATE top-level
    # CMake project against that prefix (the same external-consumer
    # shape as consumer-add-subdirectory, but for the find_package()
    # path instead of add_subdirectory()).
    name: plain-cmake · find_package() consumer (#607)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 3
      - name: Install Yocto-side runtime deps
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y --no-install-recommends \
              libmosquitto-dev libasound2-dev libssl-dev pkg-config
      - name: Configure + build + install alp-sdk
        timeout-minutes: 5
        run: |
          cmake -B build/install-review -S . -DALP_OS=yocto \
              -DALP_SDK_BUILD_SHARED=ON \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/alp-prefix"
          cmake --build build/install-review --parallel
          cmake --install build/install-review
      - name: Configure + build the find_package() consumer
        timeout-minutes: 2
        run: |
          cmake -B build/consumer-findpkg \
              -S tests/cmake-consumer/find-package-smoke \
              -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/alp-prefix"
          cmake --build build/consumer-findpkg --parallel
      - name: Run + verify the reported version
        run: |
          out="$(LD_LIBRARY_PATH="$RUNNER_TEMP/alp-prefix/lib" \
              ./build/consumer-findpkg/find_package_smoke)"
          echo "$out"
          # Derive the expected version from the single source of truth so
          # this smoke check never goes stale on a release bump.
          ver="$(sed -n 's/^version:[[:space:]]*//p' metadata/sdk_version.yaml | head -1 | awk '{print $1}')"
          echo "expected: alp-sdk version: $ver"
          echo "$out" | grep -qx "alp-sdk version: $ver"
