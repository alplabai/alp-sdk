# SPDX-License-Identifier: Apache-2.0
#
# Static analysis on every PR.  v0.1 scope:
#   1. clang-format-diff — checks only the lines changed by the PR
#      against `.clang-format`.  Avoids forcing a repo-wide
#      reformat; CI tightens incrementally.
#   2. cppcheck — full tree under src/ + chips/, treats warnings as
#      informational (not fatal) until v0.2.
#
# Build-context-aware tools (clang-tidy + ABI snapshot) need a
# proper compile_commands.json — they land in v0.2 once we have a
# host CMake build wired with -DCMAKE_EXPORT_COMPILE_COMMANDS=ON.

name: pr-static-analysis

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  # `clang-format · diff-only` is the fifth of `dev`'s required contexts, and
  # GitHub raises `merge_group` -- not `push` or `pull_request` -- for a
  # merge-queue entry, so without this a queued PR waits on a check that can
  # never fire (#1415). Neither `clang-format-diff` nor `cppcheck` carries a
  # job-level `if:`. The "Determine diff base" step below already handles a
  # non-`pull_request` event: it falls back to `HEAD~1`, which on a queue ref
  # is this entry's own delta.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format-diff:
    name: clang-format · diff-only
    runs-on: ubuntu-latest
    # #1477: this job produces the required `clang-format · diff-only`
    # context and previously had no ceiling at all (GitHub's implicit
    # 360-minute default applied). Worst observed successful run 23s
    # across 3 sampled runs; 10min gives real headroom over that while
    # still failing fast on a PyPI/apt stall in the steps below.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        timeout-minutes: 3
        with:
          fetch-depth: 0  # need history so HEAD~ resolves

      - name: Install clang-format 22 (pinned)
        # Pinned to clang-format-22 via the pip wheel (clang-format==22.1.5),
        # which ships BOTH the `clang-format` binary and `clang-format-diff.py`.
        # We pin via pip, NOT apt: apt's `clang-format` floats with the runner
        # image (22.04 -> v14, 24.04 -> v18) and reflows differently, which used
        # to break this gate even when no source changed style.  The committed
        # tree is formatted against v22; .clang-format also locks
        # Cpp11BracedListStyle so designated-initialiser output stays
        # reproducible across patch releases.
        timeout-minutes: 3
        run: |
          python3 -m pip install --user 'clang-format==22.1.5'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/clang-format" --version

      - name: Determine diff base
        id: base
        # BASE_SHA is routed through env + a quoted shell variable rather
        # than spliced via ${{ }} into this run: block's source text --
        # same construct pr-bitbake.yml's Resolve step had to fix (#1475),
        # applied here too for consistency even though base.sha is a
        # commit hash of the PR's own target branch, not fork-controlled
        # data.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run clang-format-diff on changed lines
        # DIFF_BASE is routed through env, matching the producing step above
        # -- ${{ }} re-substitutes into every run: block's source text
        # independently, so quoting the value once at the producer does not
        # protect this consuming step on its own.
        env:
          DIFF_BASE: ${{ steps.base.outputs.ref }}
        timeout-minutes: 2
        run: |
          # clang-format-diff.py from the pinned pip wheel; it shells out to the
          # wheel's bundled v22 clang-format, so the diff check uses v22 too.
          DIFF_TOOL="$HOME/.local/bin/clang-format-diff.py"
          if [ ! -f "$DIFF_TOOL" ]; then
              echo "::error::clang-format-diff.py not found after the pip install"
              exit 1
          fi
          # vendors/** and zephyr/** are excluded: those subtrees keep
          # their UPSTREAM project's style (GigaDevice firmware library,
          # Zephyr/Renesas-FSP drivers) so they stay diffable against
          # their sources -- our .clang-format does not govern them.
          # tests/scripts/fixtures/rzv2n_svd/** is excluded for the same
          # reason and one more: those headers are verbatim BSD-3-Clause
          # excerpts of the Renesas FSP iodefines/iobitmasks, and
          # test_gen_rzv2n_cm33_svd.py asserts they stay byte-identical
          # to the real module headers.  Reformatting them would break
          # the very property the fixture exists to hold.
          git diff -U0 "$DIFF_BASE" -- '*.c' '*.h' \
              ':!vendors/**' ':!zephyr/**' \
              ':!tests/scripts/fixtures/rzv2n_svd/**' \
              | python3 "$DIFF_TOOL" -p1 \
              | tee clang-format-diff.txt
          if [ -s clang-format-diff.txt ]; then
              echo "::error::clang-format would change the diff above.  Run clang-format-22 on your changes before pushing."
              exit 1
          fi
          echo "clang-format clean on the diff."

  cppcheck:
    name: cppcheck · src + chips
    runs-on: ubuntu-latest
    # #1477: not a required context, and its own run step already ends
    # `|| true` with --error-exitcode=0 -- but it too had no ceiling
    # (360-minute implicit default). Worst observed successful run 42s
    # across 3 sampled runs; 15min gives headroom over that.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        timeout-minutes: 2

      - name: Install cppcheck
        timeout-minutes: 3
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -o Acquire::Retries=3 -y cppcheck

      - name: Run cppcheck
        # cppcheck without a build context misses some symbols
        # (it doesn't know which Zephyr / vendor headers are
        # available).  We pass --suppress=missingIncludeSystem to
        # skip those rather than report them.  Real type-checking
        # arrives with the v0.2 clang-tidy job.
        run: |
          cppcheck \
              --enable=warning,style,performance,portability \
              --inline-suppr \
              --suppress=missingInclude \
              --suppress=missingIncludeSystem \
              --suppress=unusedFunction \
              --suppress=unmatchedSuppression \
              --error-exitcode=0 \
              --quiet \
              --xml \
              --output-file=cppcheck.xml \
              -I include \
              src/ chips/ || true
          if [ -s cppcheck.xml ]; then
              n_errors=$(grep -c '<error ' cppcheck.xml || true)
              echo "::notice::cppcheck reported $n_errors finding(s) (informational; v0.2 will gate)"
          fi

      - name: Upload cppcheck.xml
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 2
        with:
          name: cppcheck
          path: cppcheck.xml
          retention-days: 14
          if-no-files-found: ignore
