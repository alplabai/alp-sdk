# SPDX-License-Identifier: Apache-2.0
#
# Heterogeneous orchestrator gate -- `alp_orchestrate --emit
# system-manifest` across the SoM x scenario matrix.  Per the v0.6
# heterogeneous-OS design at
# docs/superpowers/specs/2026-05-15-heterogeneous-os-orchestration-design.md
# (§7 Phase 5 + §11 acceptance), this workflow verifies:
#
#   1. The orchestrator fans out per-core slices for every supported
#      SoM (E1M-V2N101, E1M-AEN701, E1M-AEN801).  Each leg builds its OWN
#      SoM: the chosen example's `som.sku` is rewritten to matrix.som in a
#      CI-only copy of its board.yaml (same SoM family as the example).
#   2. `build/system-manifest.yaml` lands with per-slice entries
#      (per §5.2 fan-out + §6.1 carve-out resolution).
#   3. The manifest is *byte-stable* across rebuilds -- the spec's
#      §6.1 "Determinism" clause requires re-running the build to
#      produce identical layouts so CI can diff.
#
# ADR-0020 Phase 4 retired the SDK-side executor (`west alp-build` et al.).
# Python Tan now carries the normal relocated planner and executor; this job
# deliberately verifies alp-sdk's reference `alp_orchestrate --emit
# system-manifest` producer. Real slice compilation is exercised in tan-cli.
#
# Every cell's example MUST exist: a missing board.yaml fails the leg
# instead of auto-skipping it, so a moved example can never turn a leg
# green without running anything.

name: pr-alp-build

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'metadata/**'
      - 'scripts/**'
      - 'examples/**/board.yaml'
      - 'src/**'
      # Bootloader/sysbuild config. Added because a change to the AEN MCUboot
      # profile -- switching slot0 verification from SIGNATURE_TYPE_NONE to
      # ECDSA-P256 -- matched NONE of the filters above and so was merged past a
      # check list with zero build jobs in it. A bootloader config that nothing
      # builds in CI is exactly how a stale verdict survives for six weeks.
      - 'zephyr/sysbuild/**'
      - 'examples/**/sysbuild.conf'
      - 'examples/**/sysbuild/**'
      - '.github/workflows/pr-alp-build.yml'
  push:
    branches: [main, dev]
    paths:
      - 'metadata/**'
      - 'scripts/**'
      - 'examples/**/board.yaml'
      - 'src/**'
      - 'zephyr/sysbuild/**'
      - 'examples/**/sysbuild.conf'
      - 'examples/**/sysbuild/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alp-build:
    name: alp-build · ${{ matrix.som }} · ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Partial failures should surface every broken cell at once
      # rather than masking later legs behind an early `set -e` exit.
      fail-fast: false
      # Explicit cells: each example is only valid on its own SoM family
      # (the orchestrator rejects an AEN SoM on a V2N board preset and vice
      # versa), so pair every SoM with the examples of its family.
      matrix:
        include:
          - som: E1M-V2N101
            scenario: heterogeneous-default
            example: examples/multicore/rpmsg-v2n
          - som: E1M-AEN701
            scenario: heterogeneous-default
            example: examples/multicore/rpmsg-aen
          - som: E1M-AEN801
            scenario: heterogeneous-default
            example: examples/multicore/rpmsg-aen
          - som: E1M-AEN701
            scenario: zephyr-only-slice
            example: examples/peripheral-io/gpio-button-led
          - som: E1M-AEN801
            scenario: zephyr-only-slice
            example: examples/peripheral-io/gpio-button-led
          - som: E1M-V2N101
            scenario: yocto-only-slice
            example: examples/connectivity/iot-connected-camera

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          path: alp-sdk
          fetch-depth: 1

      # Mirror pr-metadata-validate.yml's Python setup -- same
      # toolchain version pin keeps the orchestrator behaviour
      # consistent across the metadata gate + this gate.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        timeout-minutes: 5
        with:
          # Repo is checked out under alp-sdk/ (path:), but setup-python (a
          # uses: step) resolves python-version-file from GITHUB_WORKSPACE.
          python-version-file: alp-sdk/.python-version

      - name: Install Python deps
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        run: pip install jsonschema pyyaml

      # Mirror pr-twister.yml's workspace pattern: Zephyr workspace
      # lives next to alp-sdk via scripts/bootstrap.sh.  The script
      # is idempotent + skips work that's already done, so re-runs
      # on the same cache hit are cheap.
      - name: Bootstrap Zephyr workspace
        working-directory: ${{ github.workspace }}/alp-sdk
        run: bash scripts/bootstrap.sh

      # Resolve the example for this (SoM, scenario) cell and write a CI-only
      # copy of its board.yaml whose `som.sku` is matrix.som, so each leg
      # exercises its own SoM rather than whatever SKU the example ships with.
      # The copy lives next to the original so relative references resolve.
      # A missing example fails the leg -- it must never skip as green.
      - name: Resolve example path + SoM-specific board.yaml for this matrix cell
        id: pick
        working-directory: ${{ github.workspace }}/alp-sdk
        env:
          SOM: ${{ matrix.som }}
          EXAMPLE_PATH: ${{ matrix.example }}
        run: |
          set -euo pipefail
          src="${EXAMPLE_PATH}/board.yaml"
          if [ ! -f "${src}" ]; then
            echo "::error::${src} not found -- the matrix cell points at a moved or deleted example."
            exit 1
          fi
          board_yaml="${EXAMPLE_PATH}/board.${SOM}.ci.yaml"
          python - "${src}" "${board_yaml}" "${SOM}" <<'PY'
          import re, sys
          src, dst, som = sys.argv[1:4]
          lines = open(src, encoding="utf-8").read().splitlines(keepends=True)
          in_som = False
          done = False
          for i, line in enumerate(lines):
              if re.match(r"som:", line):
                  in_som = True
              elif in_som and re.match(r"\S", line):
                  in_som = False
              elif in_som and re.match(r"\s+sku:\s*E1M-[A-Z0-9]+", line):
                  lines[i] = re.sub(r"E1M-[A-Z0-9]+", som, line, count=1)
                  done = True
                  break
          if not done:
              sys.exit("could not find som.sku in " + src)
          open(dst, "w", encoding="utf-8").write("".join(lines))
          PY
          grep -n "sku:" "${board_yaml}" | head -3
          echo "example_path=${EXAMPLE_PATH}" >> "$GITHUB_OUTPUT"
          echo "board_yaml=${board_yaml}" >> "$GITHUB_OUTPUT"
          echo "Selected example: ${EXAMPLE_PATH} (SoM ${SOM}) -> ${board_yaml}"

      # ADR-0020 Phase 4: alp_orchestrate is the SDK reference planner -- there
      # is no SDK-side executor (the wrapper at
      # scripts/west_commands/alp_build.py this comment used to
      # reference was deleted with the executor).  Invoke the
      # reference orchestrator's `--emit system-manifest` path
      # directly and capture its stdout at the same path the old
      # build-executor used to write.
      - name: alp-build (primary verification, orchestrator-direct)
        # v0.6: actual slice compilation requires Zephyr SDK +
        # bitbake on the runner, neither of which the standard
        # ubuntu-latest carries.  We tolerate slice-level failures
        # here; the manifest-shape + determinism checks below are
        # the actual gates for v0.6.  Promotes to required (no
        # continue-on-error) once self-hosted runners with the
        # toolchains land in v0.7.
        continue-on-error: true
        working-directory: ${{ github.workspace }}/alp-sdk
        run: |
          set -euo pipefail
          app_path="${{ steps.pick.outputs.example_path }}"
          board_yaml="${{ steps.pick.outputs.board_yaml }}"
          python scripts/validate_board_yaml.py --input "${board_yaml}"
          mkdir -p "${app_path}/build"
          PYTHONPATH="$PWD/scripts" python -m alp_orchestrate \
              --input "${board_yaml}" \
              --emit system-manifest > "${app_path}/build/system-manifest.yaml" || true

      - name: Assert system-manifest.yaml exists + has per-slice entries
        working-directory: ${{ github.workspace }}/alp-sdk
        run: |
          set -euo pipefail
          manifest="${{ steps.pick.outputs.example_path }}/build/system-manifest.yaml"
          test -s "${manifest}" || {
            echo "::error::system-manifest.yaml missing or empty at ${manifest}"
            exit 1
          }
          echo "--- system-manifest.yaml ---"
          cat "${manifest}"
          # Per §5.2 fan-out, the manifest must carry a `slices:`
          # block with at least one entry.  `yq` returns null (not
          # an empty list) if the key is absent -- guard both cases.
          # Was `yq '.slices | length // 0'`, which cost a 60 MB binary
          # downloaded from GitHub releases and run under sudo -- and which
          # failed ELEVEN times on 2026-08-12 alone (#1410), reddening five PRs
          # whose diffs could not have caused it. pyyaml is already installed by
          # "Install Python deps" two steps above, so the dependency was never
          # needed. `or {}` / `or []` reproduce yq's `// 0` for a missing, null
          # or empty `slices:` -- verified against all five cases.
          slice_count=$(python3 -c 'import sys,yaml; d=yaml.safe_load(open(sys.argv[1])) or {}; print(len(d.get("slices") or []))' "${manifest}")
          if [ "${slice_count}" -lt 1 ]; then
            echo "::error::system-manifest.yaml has no slices[] entries (got ${slice_count})"
            exit 1
          fi
          echo "Manifest declares ${slice_count} slice(s)."

      # Determinism check per §6.1 -- re-run the build into a
      # separate output dir and diff the two manifests.  Any byte
      # delta fails the gate (timestamps, sort-order drift, etc.).
      - name: Determinism check (rebuild + diff system-manifest.yaml)
        working-directory: ${{ github.workspace }}/alp-sdk
        timeout-minutes: 2
        run: |
          set -euo pipefail
          app_path="${{ steps.pick.outputs.example_path }}"
          board_yaml="${{ steps.pick.outputs.board_yaml }}"
          manifest_a="${app_path}/build/system-manifest.yaml"
          # Snapshot the first manifest before the rebuild clobbers
          # the file.
          cp "${manifest_a}" /tmp/system-manifest-run-a.yaml
          # Tear down + re-emit from scratch.  The spec requires
          # byte-stable output across re-runs regardless of build
          # dir state.  Remove the build dir + the orchestrator state
          # cache by hand (the `west alp-clean` executor command this
          # used to describe was retired in ADR-0020 Phase 4).
          rm -rf "${app_path}/build" "${app_path}/.alp-build-state.json"
          mkdir -p "${app_path}/build"
          PYTHONPATH="$PWD/scripts" python -m alp_orchestrate \
              --input "${board_yaml}" \
              --emit system-manifest > "${app_path}/build/system-manifest.yaml" || true
          cp "${manifest_a}" /tmp/system-manifest-run-b.yaml
          if ! diff -u /tmp/system-manifest-run-a.yaml /tmp/system-manifest-run-b.yaml; then
            echo "::error::system-manifest.yaml is NOT byte-stable across rebuilds (spec §6.1 violation)"
            exit 1
          fi
          echo "Manifest is byte-stable across rebuilds."

      - name: Upload system-manifest artefact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        timeout-minutes: 2
        with:
          name: system-manifest-${{ matrix.som }}-${{ matrix.scenario }}
          path: ${{ github.workspace }}/alp-sdk/${{ steps.pick.outputs.example_path }}/build/system-manifest.yaml
          retention-days: 14
          if-no-files-found: ignore
