# SPDX-License-Identifier: Apache-2.0
#
# ADR-0020 cross-repo trigger — SENDER half (alp-sdk → tan-cli).
#
# Fires a `repository_dispatch` at `alplabai/tan-cli` whenever this repo's
# CONTRACT SURFACE moves, carrying the SHA that just landed so tan's parity
# gate tests THAT ref instead of its hand-bumped `PINNED_SDK_TAG`.
#
# Why this exists, stated as the gap it closes rather than as the ADR line it
# satisfies:
#
#   * `parity-seam1.yml` (this repo) diffs our own `--emit build-plan` against
#     our OWN frozen oracle. It never runs tan. It cannot tell us that a
#     planner change broke tan's ability to EXECUTE the plan.
#   * tan's `parity.yml` on a pull_request tests against a PINNED alp-sdk ref,
#     bumped by hand. Until someone bumps it, tan is green against an alp-sdk
#     that no longer exists.
#
# So "alp-sdk changed and tan can no longer build from the plan" is invisible on
# both sides. tan's seam2 -- materialise, cross-compile through `tan build`,
# boot in Renode -- is exactly the check that sees it, and this is what points
# it at the right commit.
#
# Security model, following pr-bitbake.yml (read its header; the argument is the
# same one):
#   * The token is minted at RUNTIME from the org's GitHub App
#     (`actions/create-github-app-token`), scoped to tan-cli alone and valid
#     ~1h. The only long-lived secret is the App's private key -- org-owned and
#     revocable. A long-lived PAT was the alternative and is deliberately not
#     used: it would contradict the model the neighbouring workflow argues for.
#   * `repository_dispatch` needs Contents:write on the TARGET. That is the
#     whole grant; the App holds nothing else on tan-cli.
#   * Fork PRs receive no secrets, and this triggers on `push` to dev/main
#     only, so a fork cannot reach it at all.

name: dispatch-tan-parity

on:
  push:
    branches: [dev, main]
    # Kept in lockstep with parity-seam1.yml's path list ON PURPOSE: that job
    # decides when OUR plan shape is re-checked, and this decides when TAN
    # re-checks it. If the two lists drift, one side starts testing changes the
    # other ignores, which is the silent-divergence this whole gate exists to
    # prevent.
    paths:
      - "scripts/alp_orchestrate/**"
      - "metadata/**"
      - "examples/**/board.yaml"
      - "tests/parity/**"
  workflow_dispatch:

concurrency:
  # A burst of merges should leave tan testing the NEWEST contract surface, not
  # queue one run per commit against refs that are already superseded.
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    name: "dispatch · tan parity"
    runs-on: ubuntu-latest
    steps:
      - name: Mint a short-lived App token (scoped to tan-cli)
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ALP_CI_APP_ID }}
          private-key: ${{ secrets.ALP_CI_APP_PRIVATE_KEY }}
          owner: alplabai
          repositories: tan-cli

      - name: Dispatch planner-change to tan-cli
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          # `alp-sdk-planner-change` and `client_payload.sdk_ref` are the names
          # tan's `tests/parity/README.md` specifies and its `parity.yml`
          # listens for. Renaming either here silently stops the dispatch
          # arriving -- GitHub accepts an unrecognised event_type with a 204,
          # so the failure looks exactly like success from this side.
          gh api repos/alplabai/tan-cli/dispatches \
            -f event_type=alp-sdk-planner-change \
            -F "client_payload[sdk_ref]=${{ github.sha }}" \
            -F "client_payload[branch]=${{ github.ref_name }}"
          echo "::notice::dispatched alp-sdk-planner-change to tan-cli for ${{ github.sha }} (${{ github.ref_name }})"

      # The dispatch API answers 204 with no body whether or not anything is
      # listening, so "the call succeeded" is not evidence a run started. Look
      # for the run itself, and say plainly which of the two happened rather
      # than leaving a green step to imply the good one.
      - name: Confirm a run actually started
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -uo pipefail
          for _ in $(seq 1 10); do
            sleep 6
            count="$(gh api "repos/alplabai/tan-cli/actions/runs?event=repository_dispatch&per_page=5" \
                      -q '[.workflow_runs[] | select(.created_at > (now - 300 | todate))] | length' 2>/dev/null || echo 0)"
            if [ "${count:-0}" -gt 0 ]; then
              echo "::notice::tan-cli started ${count} repository_dispatch run(s)"
              exit 0
            fi
          done
          # Two DIFFERENT failures share this code path, and until #194 they
          # shared a message too. Separate them, because one is transient and
          # the other is the gate being dead:
          #
          #   * no run appeared THIS TIME, but tan has had dispatch runs before
          #     -> almost always Actions queueing. WARN. Failing this repo's
          #     push for tan's scheduler would be the wrong blame.
          #   * tan has had ZERO repository_dispatch runs in its LIFETIME
          #     -> the wiring is dead, not slow. A queue delay cannot produce a
          #     lifetime total of 0 once the seam has ever worked, so this is
          #     unambiguous and gets to FAIL.
          #
          # That distinction is the whole lesson of #194: the dispatch had never
          # fired even once, this step warned on every push, and green
          # everywhere else made it easy to keep not reading. A permanently dead
          # gate that only ever warns is a guard wearing a guard's name.
          lifetime="$(gh api "repos/alplabai/tan-cli/actions/runs?event=repository_dispatch&per_page=1"                         -q '.total_count' 2>/dev/null || echo unknown)"
          if [ "${lifetime}" = "0" ]; then
            echo "::error::tan-cli has NEVER had a repository_dispatch run (lifetime total_count=0). The dispatch is accepted with a 204 and goes nowhere, so the cross-repo parity gate is not running at all."
            echo "::error::Most likely cause, and the one that caused #194: parity.yml's 'repository_dispatch:' trigger is missing from tan-cli's DEFAULT branch. GitHub triggers repository_dispatch ONLY from the default branch's copy of a workflow -- having it on 'dev' alone does nothing. Check https://github.com/alplabai/tan-cli/blob/main/.github/workflows/parity.yml"
            echo "::error::Second possibility: the event_type no longer matches. This repo posts 'alp-sdk-planner-change'; tan's parity.yml must list that exact string under repository_dispatch.types."
            exit 1
          fi
          # WARN: tan has dispatched before, so the wiring works and this is a
          # timing miss rather than a broken seam.
          echo "::warning::dispatched, but no NEW tan-cli repository_dispatch run appeared within ~60s (lifetime runs: ${lifetime}). The wiring has worked before, so this is most likely Actions queueing -- confirm a run for this SHA appeared at https://github.com/alplabai/tan-cli/actions?query=event%3Arepository_dispatch"
