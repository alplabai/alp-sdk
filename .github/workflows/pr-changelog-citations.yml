# SPDX-License-Identifier: Apache-2.0
#
# Re-check changelog citations on the merge queue's speculative ref. A
# citation can still drift after its PR run when dev moves underneath it;
# grading the queued tree against the queue's base closes that last window
# without running the full metadata-validation workflow (#2206).

name: pr-changelog-citations

on:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-citations:
    # Static by design: this is the context branch protection can require.
    name: changelog citations · merge queue
    runs-on: ubuntu-latest
    # Checkout has its own 5-minute cap; the local Python check normally takes
    # seconds, leaving ample room before this job-level backstop fires.
    timeout-minutes: 10
    steps:
      - name: Checkout merge-group ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          # A merge group can contain several PRs. Fetch all history so its
          # base_sha resolves even when it is more than one parent behind HEAD.
          fetch-depth: 0

      - name: Grade changelog citations against merge-group base
        env:
          DIFF_BASE: ${{ github.event.merge_group.base_sha }}
        run: python3 scripts/check_changelog_citations.py
