# SPDX-License-Identifier: Apache-2.0
#
# Nightly + on-demand fetch check for the `extras-tier1` west group.
#
# The §D.lib batch added upstream library pins to `west.yml`
# behind the `extras-tier1` group (default off).  This workflow:
#   1. Derives the group's member project names + `modules/lib/`
#      path basenames directly from `west.yml` (the "Derive
#      extras-tier1 library list" step below) -- `west.yml` is the
#      single source of truth; nothing here hardcodes the roster.
#   2. Runs `west init -l . && west update --group-filter +extras-tier1`
#      with `--narrow --depth 1` to grab just the pinned revisions.
#   3. Asserts each derived library directory under `modules/lib/`
#      ends up populated.
#
# Status policy:
#   - Every extras-tier1 project is pinned to a tagged release or a
#     full commit SHA and FAILs the workflow if the pin breaks.
#     There is no warn-only exemption: a warn-only fetch check is
#     indistinguishable from no check, and this workflow is the
#     only place a dead remote or an unreachable SHA can surface
#     (the pytest guards are static and can't detect that). The
#     same logic applies to the roster itself: PR #1237 added three
#     libraries (cmsisstream, CMSIS-CV, Arm-2D) to west.yml's
#     extras-tier1 group without updating this workflow's
#     (formerly hardcoded) library list, so those three were never
#     fetched or verified -- a pin nothing checked.  Deriving the
#     list from west.yml at run time is what closes that hole for
#     good; a hardcoded count here would only reopen it.
#
# Runs nightly (06:00 UTC Mondays) + on PRs that touch west.yml or
# any library-profile YAML + manually via workflow_dispatch.

name: nightly-extras-tier1-pins

on:
  schedule:
    # Monday 06:00 UTC -- cheap, low-noise weekly heartbeat.
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'west.yml'
      - 'metadata/library-profiles/**'
      - '.github/workflows/nightly-extras-tier1-pins.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout alp-sdk
        uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          path: alp-sdk

      - name: Set up Python + west
        uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          # Repo is checked out under alp-sdk/ (path:), but setup-python (a
          # uses: step) resolves python-version-file from GITHUB_WORKSPACE.
          python-version-file: alp-sdk/.python-version

      - name: Install west
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        run: pip3 install --user west pyyaml

      - name: Derive extras-tier1 library list from west.yml
        id: extras-tier1
        working-directory: alp-sdk
        run: |
          set -e
          python3 - <<'PY'
          import os
          import sys

          import yaml

          with open("west.yml", encoding="utf-8") as f:
              manifest = yaml.safe_load(f)

          names = []
          paths = []
          for project in manifest["manifest"]["projects"]:
              if "extras-tier1" not in (project.get("groups") or []):
                  continue
              names.append(project["name"])
              paths.append(project["path"].rsplit("/", 1)[-1])

          if not names:
              print(
                  "::error::extras-tier1 group in west.yml derived to an "
                  "EMPTY list of projects -- this gate would silently pass "
                  "while fetching and checking nothing. Refusing to run.",
              )
              sys.exit(1)

          print(f"Derived {len(names)} extras-tier1 projects: {names}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"names={' '.join(names)}\n")
              out.write(f"paths={' '.join(paths)}\n")
          PY

      - name: West init + update with extras-tier1 enabled
        working-directory: alp-sdk
        env:
          # Passed via env, not interpolated straight into the run: body,
          # so a project name/path from west.yml (attacker-influenced on a
          # fork PR that edits west.yml -- see the pull_request paths:
          # trigger above) can't inject shell syntax. $EXTRAS_TIER1_NAMES
          # is left unquoted below on purpose: west update takes each
          # project name as a separate argument, so we want the shell's
          # normal word-splitting on the space-joined list, same as
          # before -- injection is prevented by using an env var
          # (runtime substitution) instead of a template (source
          # substitution), not by quoting.
          EXTRAS_TIER1_NAMES: ${{ steps.extras-tier1.outputs.names }}
        timeout-minutes: 5
        run: |
          set -e
          # #1549: see pr-twister.yml's `west init zephyr workspace` step
          # for the full rationale and the measurement.  `west init -l .`
          # is local and clones nothing, but the `west update` below is
          # git-over-https and had no transport timeout at all.
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          west init -l .
          # `--narrow --depth 1` bounds this to a shallow fetch of just
          # the pinned project tips (no history); `timeout-minutes: 20`
          # on the job is the actual ceiling this workflow enforces. The
          # library names come from the "Derive extras-tier1 library
          # list" step above, not a hardcoded list -- see the header
          # comment for why that matters.
          #
          # `|| echo ... ; continue-on-error: true` is deliberate: it
          # lets the per-library "Verify pins populated content" step
          # report WHICH library failed to fetch, rather than dying
          # here on the first bad project and hiding the rest.  #1549
          # adds a retry AROUND that, and deliberately does NOT convert
          # the final failure into a hard exit: this step's whole design
          # is to let the verify step name the culprit, so attempt 3
          # falls through to the same message and the same
          # continue-on-error path as before.  `west init` stays outside
          # the loop -- it refuses on an already-initialised workspace.
          for attempt in 1 2 3; do
            west update \
              --group-filter +extras-tier1 \
              --narrow \
              -o=--depth=1 \
              zephyr $EXTRAS_TIER1_NAMES \
              && break
            rc=$?
            if [ "$attempt" = 3 ]; then
              echo "west update returned non-zero"
              break
            fi
            echo "west update failed (exit $rc); retry $attempt/3 in 15s" >&2
            sleep 15
          done
        continue-on-error: true

      # NB: no `working-directory: alp-sdk`.  `west init -l .` (run in
      # the nested manifest repo) puts the workspace topdir at its
      # PARENT -- i.e. $GITHUB_WORKSPACE -- so west projects land in
      # $GITHUB_WORKSPACE/modules/lib/, NOT alp-sdk/modules/lib/.
      # These steps must resolve against the topdir (the default cwd).
      - name: Verify pins populated content
        env:
          # See the env: comment on the "West init + update" step above --
          # same injection rationale applies to this step's run: body.
          EXTRAS_TIER1_PATHS: ${{ steps.extras-tier1.outputs.paths }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          status=0
          libs="$EXTRAS_TIER1_PATHS"
          # If the derive step above got deleted, renamed, or its `id:`
          # typo'd, `steps.extras-tier1.outputs.paths` resolves to an
          # empty string and the `for lib in $libs; do ... done` loop
          # below would iterate zero times and exit 0 -- a gate that
          # passes having verified nothing, the exact failure class this
          # workflow exists to close. Refuse to run rather than silently
          # pass.
          [ -n "$libs" ] || {
            echo "::error::empty extras-tier1 roster -- derivation step missing or produced nothing"
            exit 1
          }
          # Every extras-tier1 project (derived from west.yml above, not
          # hardcoded here) now carries a real pin (tag or full SHA), so
          # every one of them gates here.  A warn-only fetch check is
          # indistinguishable from no check at all, and this workflow is
          # the only place a dead remote or an unreachable SHA can surface
          # -- the static pytest guards can't detect that.  (This FAIL
          # loop previously exempted minimp3/bearssl/madgwick_ahrs as
          # "TBD"; that exemption is exactly why minimp3's dead
          # `main`-branch pin and BearSSL's 404ing remote went undetected.
          # Separately, the list itself used to be hardcoded here and
          # drifted from west.yml -- see the header comment.)
          for lib in $libs; do
            if [ ! -d "modules/lib/${lib}" ]; then
              echo "::error::FAIL: modules/lib/${lib} missing after west update"
              status=1
              continue
            fi
            if [ -z "$(ls -A "modules/lib/${lib}" 2>/dev/null || true)" ]; then
              echo "::error::FAIL: modules/lib/${lib} populated empty"
              status=1
              continue
            fi
            echo "OK: modules/lib/${lib} populated"
          done
          exit $status

      - name: Upload artefact (per-lib README first line for audit)
        if: always()
        run: |
          set -e
          # nullglob: when no library dir is populated (e.g. a PR that
          # didn't fetch the extras-tier1 group), the loop must skip
          # rather than run once with the literal pattern -- otherwise
          # `basename` yields `*` and we create a file named `*.txt`,
          # which upload-artifact later rejects (`*` is an illegal path).
          # Path is topdir-relative (see the verify step's note above).
          shopt -s nullglob
          mkdir -p /tmp/extras-tier1-audit
          for d in modules/lib/*/; do
            lib=$(basename "$d")
            head -1 "${d}README.md" 2>/dev/null \
              > "/tmp/extras-tier1-audit/${lib}.txt" || \
              echo "(no README)" > "/tmp/extras-tier1-audit/${lib}.txt"
          done
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          name: extras-tier1-audit
          path: /tmp/extras-tier1-audit/
          if-no-files-found: ignore
