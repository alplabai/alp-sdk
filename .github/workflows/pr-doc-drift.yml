# SPDX-License-Identifier: Apache-2.0
#
# Doc-drift gate: fails a PR when customer docs reference SDK
# identifiers that no longer exist in any SDK source layer (public +
# internal headers, Kconfig, CMake, generators, schemas, Yocto), when a
# top-level docs/*.md isn't linked from the docs index, when a relative
# doc-to-doc link is dead, when VERSIONS.md carries no row for the
# released version, when an ALP-Bxxx diagnostic landing page is still a
# placeholder, or when docs/board-id.md's alp_hw_info_eeprom_t struct
# or scripts/program_eeprom.py's pack-format length constants disagree
# with include/alp/hw_info.h (#1231), when AGENTS.md names an
# ALP_E1M_*/ALP_E1M_X_* identifier or --emit choice the real generators
# don't produce (#1264), or when a doc-stated workflow name/count,
# ADR count, or chip/library count disagrees with the tree (#1265).
# Mirrors scripts/check_doc_drift.py + scripts/check_doc_links.py +
# scripts/check_diagnostic_narratives.py +
# scripts/check_version_doc_sync.py +
# scripts/check_board_id_doc_parity.py +
# scripts/check_agents_md_generators.py +
# scripts/check_doc_inventory.py, all runnable locally (see the
# running-local-ci skill + docs/local-ci.md).
name: pr-doc-drift

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'VERSIONS.md'
      - 'docs/**'
      - 'include/**'
<<<<<<< HEAD
      - 'chips/**'
