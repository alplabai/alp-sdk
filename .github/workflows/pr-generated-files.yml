# SPDX-License-Identifier: Apache-2.0
#
# Verifies generated files stay in sync with their inputs.  Catches:
#
#   - Metadata edits that didn't trigger a soc_caps.h regeneration.
#     scripts/gen_soc_caps.py reads metadata/socs/**.json and emits
#     include/alp/soc_caps.h plus the capability dispatch pair
#     include/alp/cap.h + src/cap.c; if a committed copy doesn't match
#     what the script would produce, the PR is asking reviewers to
#     accept stale capability tables.
#
#   - alp_status_t enum edits that didn't trigger a status_strings.c
#     regeneration.  scripts/gen_status_strings.py reads the
#     alp_status_t enum in include/alp/peripheral.h and emits
#     src/status_strings.c (alp_status_name / alp_status_description);
#     if a committed copy doesn't match what the script would produce,
#     the PR is asking reviewers to accept a stale status table.
#
#   - Board YAML edits that didn't trigger a routes-header regeneration.
#     scripts/gen_board_header.py reads metadata/boards/*.yaml
#     `e1m_routes:` blocks and emits
#     include/alp/boards/alp_<board>_routes.h.
#
#   - Public-header additions/removals that didn't bump the ABI
#     snapshot at docs/abi/v<N>-snapshot.json.  The snapshot's
#     fingerprint diff is the cheapest way to spot accidental
#     ABI changes.
#
#   - docs/test-plan.md ledger edits that didn't trigger a
#     docs/verification-status.md regeneration.
#     scripts/gen_verification_status.py reads docs/test-plan.md and
#     projects the status page from it verbatim (issue #1200); if a
#     committed copy doesn't match what the script would produce, the
#     PR is asking reviewers to accept a stale/hand-edited verification
#     claim.

name: pr-generated-files

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'metadata/**'
      - 'include/alp/**'
      - 'docs/diagnostics/**'
      - 'docs/abi/**'
      - 'examples/**'
      - 'src/cap.c'
      - 'src/status_strings.c'
      - 'scripts/gen_soc_caps.py'
      - 'scripts/gen_status_strings.py'
      - 'scripts/gen_board_header.py'
      - 'scripts/gen_pinmux_capability.py'
      - 'scripts/gen_support_matrix.py'
      - 'scripts/gen_catalog.py'
      - 'scripts/gen_error_catalog.py'
      # The portability matrix re-runs the som.sku swap-test through
      # scripts/alp_project.py + the alp_orchestrate/ package, so any
      # emit-pipeline change can move its generated block.
      - 'scripts/gen_portability_matrix.py'
      - 'scripts/alp_project.py'
      - 'scripts/alp_orchestrate/**'
      - 'docs/portability-matrix.md'
      - 'scripts/check_*.py'
      - 'scripts/abi_snapshot.py'
      # docs/verification-status.md is projected verbatim from
      # docs/test-plan.md (issue #1200) -- either changing means the
      # other must be regenerated in step, so both are gate triggers.
      - 'docs/test-plan.md'
      - 'docs/verification-status.md'
      - 'scripts/gen_verification_status.py'
      - '.github/workflows/pr-generated-files.yml'
  push:
    branches: [main, dev]
    paths:
      - 'metadata/**'
      - 'include/alp/**'
      - 'src/cap.c'
      - 'src/status_strings.c'
      - 'docs/diagnostics/**'
      - 'docs/abi/**'
      - 'examples/**'
      - 'scripts/abi_snapshot.py'
      - 'docs/test-plan.md'
      - 'docs/verification-status.md'
      - 'scripts/gen_verification_status.py'
      - '.github/workflows/pr-generated-files.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · generated files in sync
    runs-on: ubuntu-latest
    # #1477: worst observed successful run 32s across 3 sampled runs.
    # Raised from the formula's 10min to 25min so the ceiling stays
    # strictly above the sum of its capped steps plus the 1min/step
    # budget test_job_ceiling_exceeds_the_sum_of_its_step_timeouts assigns
    # each of the 13 uncapped (pure-Python regen/diff) steps below.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        timeout-minutes: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 2
        with:
          python-version-file: .python-version

      # gen_soc_caps.py formats its output with clang-format-22 (the same version
      # the diff-only style gate pins) so the generated headers match the repo
      # .clang-format byte-for-byte.  Pinned via the pip wheel (not apt, which
      # floats with the runner image).  Without it the regen below is unformatted
      # and the in-sync diff fails.
      - name: Install clang-format 22 (pinned)
        timeout-minutes: 2
        run: |
          python3 -m pip install --user 'clang-format==22.1.5'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/clang-format" --version

      # gen_board_header.py + gen_pinmux_capability.py (and the matrix /
      # catalog generators below) read YAML metadata; the pinmux generator
      # also schema-validates its output.  setup-python's interpreter ships
      # neither package, so install them explicitly.
      - name: Install generator dependencies
        timeout-minutes: 2
        run: python3 -m pip install --user pyyaml jsonschema

      # gen_soc_caps.py emits include/alp/soc_caps.h AND the capability
      # dispatch pair include/alp/cap.h + src/cap.c (CAP_H_OUT / CAP_C_OUT);
      # all three are diff-gated below.
      - name: Regenerate soc_caps.h + cap.h/cap.c from metadata
        run: python3 scripts/gen_soc_caps.py

      # alp_status_name() / alp_status_description() (src/status_strings.c)
      # are projected from the alp_status_t enum in include/alp/peripheral.h
      # by scripts/gen_status_strings.py.  Regenerate and let the diff gate
      # below flag any drift.
      - name: Regenerate status_strings.c from the alp_status_t enum
        run: python3 scripts/gen_status_strings.py

      # Board-macro routes headers: include/alp/boards/alp_<board>_routes.h
      # is projected from each metadata/boards/<name>.yaml `e1m_routes:`
      # block by scripts/gen_board_header.py.  Regenerate and let the diff
      # gate below flag any drift.
      - name: Regenerate board routes headers from board YAMLs
        run: python3 scripts/gen_board_header.py

      - name: Regenerate pin-mux capability tables from the pinout TSVs
        run: python3 scripts/gen_pinmux_capability.py

      # Same single-source contract as soc_caps.h: the peripheral-support
      # matrix is projected from metadata/e1m_modules/*.yaml + metadata/socs/
      # by scripts/gen_support_matrix.py.  Regenerate and let the diff gate
      # below flag any drift.
      - name: Regenerate peripheral-support matrix from metadata
        run: python3 scripts/gen_support_matrix.py

      # Same single-source contract: the intra-family portability matrix
      # (docs/portability-matrix.md, generated blocks only) is produced by
      # scripts/gen_portability_matrix.py.  It regenerates TWO blocks:
      #   1. the som.sku swap-test matrix (metadata/e1m_modules/E1M-*.yaml x
      #      the pinned portable examples) through scripts/alp_project.py;
      #   2. the ADR 0018 library-compatibility table -- rows are the
      #      manifests auto-discovered from metadata/libraries/*.yaml, each
      #      (library x SKU) cell reusing alp_orchestrate/libraries.py's own
      #      emit-side `requires:` resolution.
      # So a change to a manifest under metadata/libraries/ (covered by the
      # metadata/** path filter) or to the resolver (scripts/alp_orchestrate/**)
      # can move this doc.  Regenerate and let the diff gate below flag any
      # drift.  Hand-written prose outside the BEGIN/END markers is preserved.
      - name: Regenerate intra-family portability matrix from metadata
        run: python3 scripts/gen_portability_matrix.py

      # Same single-source contract again: metadata/catalog.json is the
      # machine-readable SDK map an agent / MCP server reads.  It is projected
      # from metadata/, examples/, include/alp/, and scripts/ by
      # scripts/gen_catalog.py; regenerate and let the diff gate flag drift.
      - name: Regenerate machine-readable SDK catalog
        run: python3 scripts/gen_catalog.py

      # Single-source error catalog: projected from the ALP_ERR_* enum in
      # include/alp/peripheral.h + the docs/diagnostics/ALP-B*.md landing
      # pages by scripts/gen_error_catalog.py (what `alp explain` reads).
      # Regenerate and let the diff gate below flag any drift.
      - name: Regenerate error catalog from headers + diagnostic docs
        run: python3 scripts/gen_error_catalog.py

      # docs/verification-status.md is projected verbatim from
      # docs/test-plan.md by scripts/gen_verification_status.py (issue
      # #1200: the status page must never assert a verdict the ledger
      # doesn't itself carry).  Regenerate and let the diff gate below
      # flag any drift.
      - name: Regenerate verification status page from the test-plan ledger
        run: python3 scripts/gen_verification_status.py

      # Single source: metadata/sdk_version.yaml declares MAJOR.MINOR.PATCH
      # and the CURRENT snapshot is docs/abi/vMAJOR.MINOR-snapshot.json
      # (docs/abi/README.md).  EVERY other docs/abi/v*-snapshot.json is a
      # FROZEN historical record -- restored from its release tag, never
      # regenerated against today's headers (docs/abi-markers.md).
      #
      # Deriving the version HERE, rather than naming it in a literal each
      # release has to remember to repoint, is what keeps this gate honest.
      # A stale literal fails in the worst way available: the step keeps
      # regenerating the PREVIOUS release's snapshot and diffing it against
      # its own committed copy, so the gate stays green while testing
      # nothing about the current snapshot at all (issue #826).  This is the
      # same derivation scripts/test-all.sh runs locally.
      - name: Resolve the current ABI snapshot from metadata/sdk_version.yaml
        id: abi
        run: |
          version=$(python3 scripts/abi_snapshot.py --print-current-version)
          snapshot="docs/abi/${version}-snapshot.json"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "snapshot=${snapshot}" >> "$GITHUB_OUTPUT"
          echo "Current ABI snapshot: ${snapshot}"
          # A version bump that forgot to add the new snapshot has to fail
          # HERE, because nothing downstream would catch it: the regen step
          # CREATES the missing file, and `git diff` does not report an
          # untracked file, so the in-sync gate would pass and the miss
          # would surface only at tag time in release.yml.
          if [ ! -f "${snapshot}" ]; then
            echo "::error::metadata/sdk_version.yaml declares ${version}, but ${snapshot} is not committed."
            echo "::error::Run: python3 scripts/abi_snapshot.py --version ${version} --output ${snapshot}"
            echo "::error::and commit it (see docs/abi/README.md)."
            exit 1
          fi

      - name: Regenerate ABI snapshot (current minor)
        # The snapshot's `generated` field is a date stamp, but
        # abi_snapshot.py only rewrites the file when re-serializing it
        # would NOT come out byte-identical to what's already committed
        # (issue #1232) -- a no-op rerun leaves the committed file's
        # bytes, generated date included, completely untouched.  The
        # diff below therefore no longer masks the "generated" line:
        # doing so would hide exactly the class of bug #1232's guard
        # exists to prevent (a spurious date-only rewrite slipping past
        # this gate) rather than defend against it.
        #
        # Reaches the shell as env, not spliced into the script text via ${{ }}.
        env:
          ABI_VERSION: ${{ steps.abi.outputs.version }}
          ABI_SNAPSHOT: ${{ steps.abi.outputs.snapshot }}
        run: |
          python3 scripts/abi_snapshot.py \
              --version "$ABI_VERSION" \
              --output "$ABI_SNAPSHOT"

      - name: Fail if generated files differ from committed copies
        env:
          ABI_VERSION: ${{ steps.abi.outputs.version }}
          ABI_SNAPSHOT: ${{ steps.abi.outputs.snapshot }}
        run: |
          # `git diff` alone is blind to a brand-new file the regen step
          # just created (a not-yet-tracked board header, an added
          # pinmux table, ...) -- `git status --porcelain` would show it
          # as `??`, but a plain diff -- exit-code reports 0 and the gate
          # stays green even though a newly-needed generated file is
          # missing from the PR (#1128a).  `git add -N` (intent-to-add)
          # marks each path as tracked-but-empty so the diff below picks
          # up new files as additions too, without staging real content.
          git add -N -- include/alp/soc_caps.h "$ABI_SNAPSHOT" \
                        include/alp/cap.h \
                        src/cap.c \
                        src/status_strings.c \
                        include/alp/boards/ \
                        metadata/pinmux/ \
                        metadata/catalog.json \
                        metadata/error-catalog.json \
                        docs/peripheral-support-matrix.md \
                        docs/portability-matrix.md \
                        docs/verification-status.md
          # No line-mask here: abi_snapshot.py's own write-skip guard
          # (above) is what keeps a no-op rerun from touching the
          # "generated" line at all, so this diff sees zero lines
          # changed for that case with no help needed.  A real content
          # change fails on its content lines regardless of the
          # "generated" line, so masking it would only ever hide a
          # regression in that guard -- never a false positive.
          if ! git diff --exit-code \
                  -- include/alp/soc_caps.h "$ABI_SNAPSHOT" \
                     include/alp/cap.h \
                     src/cap.c \
                     src/status_strings.c \
                     include/alp/boards/ \
                     metadata/pinmux/ \
                     metadata/catalog.json \
                     metadata/error-catalog.json \
                     docs/peripheral-support-matrix.md \
                     docs/portability-matrix.md \
                     docs/verification-status.md; then
            echo "::error::Generated files are stale.  Run:"
            echo "::error::  python3 scripts/gen_soc_caps.py"
            echo "::error::  python3 scripts/gen_status_strings.py"
            echo "::error::  python3 scripts/gen_board_header.py"
            echo "::error::  python3 scripts/gen_pinmux_capability.py"
            echo "::error::  python3 scripts/gen_support_matrix.py"
            echo "::error::  python3 scripts/gen_portability_matrix.py"
            echo "::error::  python3 scripts/gen_catalog.py"
            echo "::error::  python3 scripts/gen_error_catalog.py"
            echo "::error::  python3 scripts/gen_verification_status.py"
            echo "::error::  python3 scripts/abi_snapshot.py --version $ABI_VERSION --output $ABI_SNAPSHOT"
            echo "::error::and commit the result."
            exit 1
          fi

      # ABI freeze gate -- flags a public symbol silently dropped since
      # the last actual release.  This step used to diff against
      # docs/abi/v0.1-snapshot.json via `git show v0.1:...`, gated on
      # `refs/tags/v0.1` existing -- no such tag has ever existed (v0.1
      # predates scripts/bump_version.py and the vX.Y.Z release-tag
      # convention, docs/abi/README.md's footnote), so the step always
      # took the "no tag yet" branch and never once actually ran
      # (issue #996).
      #
      # Comparing straight against the committed docs/abi/v0.1-snapshot.json
      # (no tag needed -- it's a frozen file, never regenerated) fixes
      # the mechanical bug but not the design: 12+ releases of
      # legitimate pre-1.0 churn (header splits e.g. dac.h out of
      # adc.h in v0.8.0, capability/enum growth, field additions --
      # docs/contribution.md's ABI policy explicitly allows API changes
      # between pre-1.0 minors) leave ~200 REMOVED/CHANGED entries
      # against v0.1 today, none of them a real regression -- v0.1 does
      # not work as a permanent floor.  The baseline that actually
      # answers "did THIS PR silently drop something that shipped" is
      # the LAST RELEASED snapshot, not the first one ever taken.
      #
      # "Last released" = the newest docs/abi/v*-snapshot.json that
      # ISN'T the current (still-tracks-HEAD, kept in sync by the gate
      # above) one.  NOTE: docs/abi/README.md and pr-abi-snapshot.yml
      # reject `ls | sort -V | tail -1` as a way to find the CURRENT
      # snapshot -- that stays derived from metadata/sdk_version.yaml
      # (ABI_VERSION above), never guessed by listing.  sort -V is used
      # here only to rank the remaining, already-FROZEN snapshots once
      # CURRENT is excluded: frozen labels never change and releases
      # ship in increasing version order, so the highest label left
      # genuinely is the last release -- no coincidence, and nothing
      # else to derive it from (see docs/abi/README.md).
      #
      # Blocks on REMOVED only, not CHANGED: a signature/field change
      # is still allowed pre-1.0 (docs/contribution.md), and
      # pr-abi-snapshot.yml already owns full REMOVED+CHANGED
      # enforcement (with [ABI-STABLE]/[ABI-EXPERIMENTAL] awareness)
      # once it activates at v1.0 -- duplicating that here would just
      # be a second, cruder copy of the same job.  CHANGED entries are
      # still printed for review visibility, not silently dropped.
      - name: ABI freeze gate vs the last released snapshot
        id: abi_freeze_gate
        env:
          ABI_VERSION: ${{ steps.abi.outputs.version }}
        run: |
          baseline=$(ls -1 docs/abi/v*-snapshot.json | sort -V \
              | grep -v "/${ABI_VERSION}-snapshot\.json\$" | tail -1)
          if [ -z "${baseline}" ]; then
            echo "::notice::No prior released ABI snapshot to compare against yet -- skipping."
            exit 0
          fi
          echo "Comparing current ABI against ${baseline} (last released)."
          set +e
          diff_out=$(python3 scripts/abi_snapshot.py --diff "${baseline}")
          diff_rc=$?
          set -e
          echo "${diff_out}"
          if [ "${diff_rc}" -ge 2 ]; then
            echo "::error::abi_snapshot.py --diff failed (exit ${diff_rc}); see the output above."
            exit "${diff_rc}"
          fi
          if echo "${diff_out}" | grep -q '^  REMOVED '; then
            echo "::error::Public symbol(s) removed vs the last released ABI snapshot (${baseline})."
            echo "::error::A removal requires a major bump after v1.0; pre-1.0 it still needs a"
            echo "::error::deliberate CHANGELOG entry, not a silent drop."
            exit 1
          fi
