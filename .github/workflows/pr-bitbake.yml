# SPDX-License-Identifier: Apache-2.0
#
# Bitbake CI — DISPATCH BRIDGE (GitHub-hosted).
#
# The actual Yocto build runs on a self-hosted runner in the PRIVATE
# `alplabai/alp-sdk-internal` repo (which also hosts the license-gated
# RZ BSP the build needs).  A self-hosted runner NEVER attaches to this
# public repo — fork PRs would otherwise run untrusted code on it.  This
# job is GitHub-hosted: it sets a `pending` commit status, then fires a
# `repository_dispatch` to alp-sdk-internal with the target ref/sha.
# alp-sdk-internal runs `bitbake alp-image-edge` for every A-cluster
# MACHINE on its own runner and posts the per-MACHINE result back here as
# a commit status (`bitbake · <MACHINE>`), so the red-X still lands on
# the dev→main PR and can be a required check.
#
# Security model (see docs/ci/runner-architecture.md):
#   * Fork PRs receive NO secrets, so the App credentials are absent and
#     the guard below skips the dispatch entirely — a fork can never
#     trigger the private build.
#   * The dispatch token is minted at runtime from a GitHub App
#     (actions/create-github-app-token), scoped to alp-sdk-internal with
#     Contents:write ONLY and valid ~1h.  The only long-lived secret is
#     the App's private key (org-owned + revocable); worst case if leaked,
#     someone can kick off a build — no code execution, no host access.

name: pr-bitbake

on:
  pull_request:
    # Only gate the dev->main release PR: a hours-long Yocto bake on every
    # feature->dev PR is pure noise (non-required, red-X on unrelated changes).
    branches: [main]
    paths:
      - 'metadata/**'
      - 'scripts/**'
      - 'examples/**/board.yaml'
      # The example SOURCE that meta-alp-sdk recipes actually compile.  Listed
      # explicitly rather than as a blanket `examples/**`: a bake is hours long
      # and runs on the bench host, so a Zephyr-only example edit must not
      # trigger one.  Kept honest by tests/scripts/test_bitbake_paths_cover_recipe_sources.py,
      # which fails if a recipe's `S = ...examples/...` is not matched here --
      # otherwise adding a recipe silently drops it from CI.
      #
      # Why this exists: #818 fixed alp-lvgl-dashboard's do_compile, and its
      # merge triggered NO bake, because CMakeLists.txt -- the very file the
      # recipe compiles -- matched none of these paths.  Only board.yaml did.
      - 'examples/aen/edgeai-vision-aen/**'
      - 'examples/display/lvgl-dashboard-x-evk/**'
      - 'examples/v2n/v2n-m1-ros-perception/**'
      - 'src/**'
      - 'meta-alp-sdk/**'
      - '.github/workflows/pr-bitbake.yml'
  push:
    # Match the pull_request scope above — bake on main pushes only, not dev.
    branches: [main]
    paths:
      - 'metadata/**'
      - 'scripts/**'
      - 'examples/**/board.yaml'
      # Keep in lockstep with the pull_request list above.
      - 'examples/aen/edgeai-vision-aen/**'
      - 'examples/display/lvgl-dashboard-x-evk/**'
      - 'examples/v2n/v2n-m1-ros-perception/**'
      - 'src/**'
      - 'meta-alp-sdk/**'
      - '.github/workflows/pr-bitbake.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: bitbake · dispatch to alp-sdk-internal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write          # pending status on THIS repo (same-repo, no PAT)
    steps:
      # HEAD_SHA/HEAD_REF are attacker-controlled on a fork PR: a branch
      # named e.g. `x$(id)` is a valid git ref, and splicing
      # github.event.pull_request.head.ref directly into this run: block's
      # SOURCE TEXT via ${{ }} would let that shell-metacharacter payload
      # execute here -- before the fork guard below ever runs. Passed
      # through env + a quoted shell variable instead, so the value is only
      # ever *data*, never re-parsed as shell syntax. This step itself
      # mints no secret and stages no request, so it does not additionally
      # need the guard's `if:` -- it only has to not be an injection vector,
      # which the env indirection now guarantees regardless of event type.
      - name: Resolve target sha/ref
        id: t
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "sha=${HEAD_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Guard — internal events only (forks never dispatch)
        id: guard
        # HEAD_REPO is routed through env, matching every other
        # github.event.pull_request.* reference in this file -- GitHub
        # restricts a repo full_name's charset to have no shell
        # metacharacters, so this specific value cannot itself carry a
        # payload, but the blanket rule (never splice this context
        # directly into a run: block) is simpler to keep than an
        # exception, and it's what tests/scripts/test_workflows_are_loadable.py
        # mechanically enforces.
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "Fork PR detected — skipping private dispatch (secrets do not reach forks anyway)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set pending status on alp-sdk
        if: steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.t.outputs.sha }}
        run: |
          gh api repos/${{ github.repository }}/statuses/"$TARGET_SHA" \
            -f state=pending \
            -f context="bitbake (alp-sdk-internal)" \
            -f description="Dispatched to the private Yocto runner…"

      - name: Mint a short-lived App token (scoped to alp-sdk-internal)
        if: steps.guard.outputs.go == 'true'
        id: apptoken
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1
        timeout-minutes: 2
        with:
          app-id: ${{ secrets.ALP_CI_APP_ID }}
          private-key: ${{ secrets.ALP_CI_APP_PRIVATE_KEY }}
          owner: alplabai
          repositories: alp-sdk-internal

      # steps.t.outputs.ref is a branch name chosen by anyone with write
      # access, same as the raw github.event.pull_request.head.ref it was
      # derived from -- this step's own `if:` guard (forks never reach here)
      # does not change that. ${{ }} is substituted into every run: block's
      # source text independently, so quoting the value once at the
      # producing step (above) does not protect this consuming step; it
      # needs the same env indirection on its own account.
      - name: Dispatch build to alp-sdk-internal
        if: steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          TARGET_SHA: ${{ steps.t.outputs.sha }}
          TARGET_REF: ${{ steps.t.outputs.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          # -f (raw string) for sha/ref, not -F: -F reinterprets its value
          # after the shell hands it over -- a leading `@` reads a FILE
          # (`@-` reads stdin), `{owner}`/`{repo}`/`{branch}` are
          # substituted, and bare true/false/null/integers become JSON
          # non-strings -- and `@foo`, `{owner}`, `true`, `null` are all
          # legal git branch names. -F stays only for `pr`, which genuinely
          # wants a JSON number.
          gh api repos/alplabai/alp-sdk-internal/dispatches \
            -f event_type=bitbake \
            -f "client_payload[sha]=$TARGET_SHA" \
            -f "client_payload[ref]=$TARGET_REF" \
            -F "client_payload[pr]=$PR_NUMBER"
