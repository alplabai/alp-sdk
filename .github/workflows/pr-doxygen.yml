# SPDX-License-Identifier: Apache-2.0
#
# Builds the public-API Doxygen reference on every PR.
#
# Gate is hard: WARN_AS_ERROR=FAIL_ON_WARNINGS dumps the full
# warning log + the summarise step exits 1 on a non-empty log,
# so a regression fails PR CI immediately.  This matches the
# v1.0 acceptance bar (per VERSIONS.md "Quality bar"): "Doxygen
# build passes with zero warnings."  docs/doxygen/Doxyfile is the
# single source of the config (#970) -- scripts/test-all.sh's
# local doxygen stage consumes the SAME file, plus the per-run
# PROJECT_NUMBER appended on stdin.  INPUT covers include/alp/ +
# README.md + VERSIONS.md + CONTRIBUTING.md + the doc tree + the
# per-area README.md files (vendors/, firmware/, keys/,
# meta-alp-sdk/, examples/, metadata/library-profiles/,
# zephyr/sysbuild/aen/, chips/); CHANGELOG.md +
# docs/superpowers/* are excluded.

name: pr-doxygen

# Required-context shape (alp-sdk#2972, same as pr-metadata-validate.yml):
# `doxygen · all` (the `summary` job) is the context meant to be required on `dev` (merge queue) and `main`.
#   - No `paths:` on the triggers: a path-filtered trigger leaves a required
#     context "Expected" forever on a PR touching no watched path (#1474).
#     The path list lives in the `detect` job's filter instead.
#   - `merge_group:` is present so a queued PR never waits on a context this
#     workflow cannot raise on a queue ref (#1415).
#   - The summary name is static; it passes on a legitimate skip and fails on
#     failure / cancelled / any unexpected skip.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # merge_group refs are unique per queue entry, so queue runs never share
  # a group; never cancel one anyway.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Cheap path detector (same shape as cross-platform-zephyr.yml `detect`).
  # Not a required context. Skipped on merge_group / workflow_dispatch, where
  # the real jobs always run (see their `if:`).
  detect:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      # push / merge_group: dorny diffs with git, so it needs a checkout WITH
      # history (a bare runner has no repo: `fatal: not a git repository`, exit
      # 128, which reddened the summary on every push). pull_request uses the API.
      - name: Checkout (history for the git diff)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect doxygen-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        timeout-minutes: 2
        with:
          # merge_group: compare against the queue's base commit (empty on other
          # events, where dorny picks the PR / push base itself).
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            relevant:
            # This list must cover docs/doxygen/Doxyfile's INPUT -- the gate reads
            # every one of these, so a change to any of them can turn the build red.
            # It previously listed only include/**, docs/doxygen/** and docs/adr/**,
            # while INPUT already covered ALL of docs plus the root and component
            # READMEs, so a docs/ci/ edit could (and did, #1585) leave dev red with
            # nothing running to notice.  tests/scripts/test_doxygen_paths_cover_input.py
            # pins the two together.
            - 'include/**'
            - 'docs/**'
            # docs/superpowers/** is excluded from the Doxyfile INPUT but NOT negated
            # here: dorny/paths-filter ORs its entries, so a `!` entry would match
            # every other file and mark every PR relevant. A spurious run is harmless.
            - 'README.md'
            - 'VERSIONS.md'
            - 'CONTRIBUTING.md'
            - 'TRADEMARKS.md'
            - 'chips/README.md'
            - 'vendors/*/README.md'
            # All three firmware/*/README.md are in INPUT, so this glob matches it
            # exactly today and keeps matching when a fourth is added -- the gate
            # cannot go unreachable for a firmware README the way #1585 did.
            - 'firmware/*/README.md'
            - 'keys/README.md'
            - 'meta-alp-sdk/README.md'
            - 'examples/README.md'
            - 'metadata/library-profiles/README.md'
            - 'zephyr/sysbuild/aen/README.md'
            - '.github/workflows/pr-doxygen.yml'

  doxygen:
    needs: detect
    # Fail CLOSED: skip ONLY when `detect` ran, succeeded and found no watched
    # path changed. merge_group, workflow_dispatch and any `detect`
    # non-success run the real job.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect.result != 'success' || needs.detect.outputs.relevant == 'true')
    name: doxygen · public headers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        timeout-minutes: 5
        with:
          python-version-file: .python-version

      - name: Install Doxygen
        # 20min: generous for a slow package mirror, finite so a
        # HUNG fetch fails here and names this step (#1549).
        timeout-minutes: 20
        # #1477 set this to 3 from observed runs; it then TIMED OUT on a
        # real PR (2026-08-18, run 32129302623) -- the step fetches a
        # ~50 MB tarball from GitHub releases and a slow mirror blows a
        # tight cap. A step cap exists to catch a HANG, not to enforce a
        # download SLA, so this is deliberately generous.
        run: |
          scripts/ci/apt-bounded.sh update
          scripts/ci/apt-bounded.sh install -y doxygen graphviz

      # Fast pre-flight: catch a missing @brief before we spin up
      # the full Doxygen build.  Currently at 100% coverage on main;
      # the gate is hard so a regression fails CI immediately.
      - name: Public-API @brief coverage audit
        run: |
          python3 scripts/check_doxygen_coverage.py

      - name: Build HTML
        run: |
          # docs/doxygen/Doxyfile is the single source (#970) -- the
          # only per-run value it does NOT carry is PROJECT_NUMBER
          # (varies per commit), appended here on stdin rather than
          # templated into a second copy of the file.
          ALP_PROJECT_NUMBER="$(git describe --tags --always 2>/dev/null || echo 0.1.0-pre)"
          { cat docs/doxygen/Doxyfile; printf 'PROJECT_NUMBER = "%s"\n' "${ALP_PROJECT_NUMBER}"; } | doxygen -

      - name: Summarise warnings
        if: always()
        run: |
          if [ -s doxygen-warnings.log ]; then
            echo "::group::Doxygen warnings"
            cat doxygen-warnings.log
            echo "::endgroup::"
            echo "::error::Doxygen reported $(wc -l < doxygen-warnings.log) warning(s).  Gate is hard -- fix the warnings."
            exit 1
          else
            echo "Doxygen produced zero warnings."
          fi

      - name: Upload HTML artefact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        timeout-minutes: 2
        with:
          name: doxygen-html
          path: doxygen-out/html/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # THE context to require (#2972). Static name, always runs.
  # `skipped` is a pass ONLY when detect genuinely ran and found nothing.
  # ---------------------------------------------------------------
  summary:
    name: doxygen · all
    needs: [detect, doxygen]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compute verdict from doxygen's + detect's results
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_RELEVANT: ${{ needs.detect.outputs.relevant }}
          GATE_RESULT: ${{ needs.doxygen.result }}
        run: |
          set -euo pipefail
          echo "event=${EVENT_NAME} detect.result=${DETECT_RESULT} detect.relevant=${DETECT_RELEVANT} doxygen.result=${GATE_RESULT}"

          case "${DETECT_RESULT}" in
            failure|cancelled)
              echo "::error::detect concluded '${DETECT_RESULT}'"
              exit 1
              ;;
          esac

          case "${GATE_RESULT}" in
            success)
              echo "PASS: doxygen ran and succeeded"
              exit 0
              ;;
            skipped)
              if { [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "push" ] || [ "${EVENT_NAME}" = "merge_group" ]; } \
                 && [ "${DETECT_RESULT}" = "success" ] && [ "${DETECT_RELEVANT}" != "true" ]; then
                echo "PASS: doxygen legitimately skipped -- detect ran, succeeded, and found no watched path changed"
                exit 0
              fi
              echo "::error::doxygen reported 'skipped' but event=${EVENT_NAME} detect.result=${DETECT_RESULT} detect.relevant=${DETECT_RELEVANT} does not match the one legitimate-skip condition -- treating this as a broken gate, not a pass"
              exit 1
              ;;
            *)
              echo "::error::doxygen concluded '${GATE_RESULT}'"
              exit 1
              ;;
          esac
