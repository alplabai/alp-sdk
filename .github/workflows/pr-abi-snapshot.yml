# SPDX-License-Identifier: Apache-2.0
#
# ABI snapshot gate.  Activates post-1.0 when ABI stability is the
# release-gate contract; pre-1.0 the equivalent drift check runs
# inside `pr-generated-files.yml` (informational, not blocking).
#
# What this workflow does:
#
#   1. Regenerate the ABI snapshot from the working tree's
#      include/alp/*.h headers.
#   2. Diff against docs/abi/v<N>-snapshot.json, where <N> is the
#      version `metadata/sdk_version.yaml` currently declares (same
#      derivation `pr-generated-files.yml` and `test-all.sh` use, see
#      docs/abi/README.md).  If that snapshot isn't committed yet (a
#      release cut in flight bumped the version before its snapshot
#      landed), the diff step skips with a notice rather than failing
#      the job -- this workflow stays informational pre-1.0.
#   3. Classify each diff entry by [ABI-STABLE] vs
#      [ABI-EXPERIMENTAL] marker presence in the header comment:
#      - ADDED [ABI-STABLE]              -> minor bump required, PASS
#      - ADDED [ABI-EXPERIMENTAL]        -> any release, PASS
#      - CHANGED / REMOVED [ABI-STABLE]  -> major bump required, FAIL unless the PR also bumps sdk_version.yaml's major
#      - CHANGED / REMOVED [ABI-EXPERIMENTAL] -> any release, PASS with a warning
#
# This workflow is currently parked behind a no-op shim until v1.0
# tags.  The shim runs the snapshot diff and prints results without
# enforcing exit codes; flipping the `gate` job's
# `continue-on-error: true` to `false` after the v1.0 tag activates
# the gate.

name: pr-abi-snapshot

# Required-context shape (alp-sdk#2972, same as pr-metadata-validate.yml):
# `abi-snapshot · all` (the `summary` job) is the context meant to be required on `main` (direct PRs; `dev` has no PR-level ABI gate).
#   - No `paths:` on the triggers: a path-filtered trigger leaves a required
#     context "Expected" forever on a PR touching no watched path (#1474).
#     The path list lives in the `detect` job's filter instead.
#   - `merge_group:` is present so a queued PR never waits on a context this
#     workflow cannot raise on a queue ref (#1415).
#   - The summary name is static; it passes on a legitimate skip and fails on
#     failure / cancelled / any unexpected skip.
# Required on `main` only (not `dev`: the PR trigger never fires for dev PRs).
# The `merge_group:` trigger is kept so a queue entry can never hang on it.
# The snapshot diff stays PR-to-main/release/** only (informational pre-1.0).
# On merge_group the workflow reports but does no work: `snapshot-diff` is
# skipped and the summary passes with an explicit 'not applicable' log line,
# so a required context can never hang the queue.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
  merge_group:

permissions:
  contents: read
  pull-requests: write  # to post the diff as a comment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue refs are unique per entry; never cancel a merge_group run.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Cheap path detector (same shape as cross-platform-zephyr.yml `detect`).
  # Not a required context. Skipped on merge_group / workflow_dispatch, where
  # the real jobs always run (see their `if:`).
  detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Detect abi-snapshot-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        timeout-minutes: 2
        with:
          filters: |
            relevant:
            - 'include/alp/**'
            - 'metadata/sdk_version.yaml'
            - 'scripts/abi_snapshot.py'
            - 'docs/abi/**'
            - '.github/workflows/pr-abi-snapshot.yml'

  snapshot-diff:
    needs: detect
    # Fail CLOSED: skip ONLY when `detect` ran, succeeded and found no watched
    # path changed. merge_group, workflow_dispatch and any `detect`
    # non-success run the real job.
    if: always() && github.event_name == 'pull_request' && (needs.detect.result != 'success' || needs.detect.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    # #1477: worst observed successful run 11s across 3 sampled runs.
    # Raised from the formula's 10min to 15min so the ceiling stays
    # strictly above the sum of its capped steps plus the 1min/step
    # budget for the uncapped ones below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        timeout-minutes: 3
        with:
          python-version-file: .python-version

      - name: Locate the current snapshot
        id: snap
        run: |
          # Derived from metadata/sdk_version.yaml (docs/abi/README.md),
          # same as pr-generated-files.yml and test-all.sh -- not `ls |
          # sort -V | tail -1`, which only ever agreed with this by
          # coincidence of version-sort ordering and isn't protected by
          # the write guard the way this derivation is.
          VERSION=$(python3 scripts/abi_snapshot.py --print-current-version)
          LATEST="docs/abi/${VERSION}-snapshot.json"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Current snapshot: $LATEST"

      - name: Run snapshot diff
        id: diff
        run: |
          SNAPSHOT="${{ steps.snap.outputs.latest }}"
          # A release cut bumps metadata/sdk_version.yaml before its
          # docs/abi/v<N>-snapshot.json is generated + committed (that
          # commit lands in the same PR, sometimes a follow-up). Without
          # the guard below, a missing baseline doesn't redden this job
          # -- it can't: `abi_snapshot.py --diff` raises, but this step
          # pipes its output through `tee` with no pipefail, so the
          # step's exit code is `tee`'s (0) regardless of what python
          # did, and the job stays green with a raw traceback sitting in
          # an otherwise-clean log. The guard is a clarity fix, not a
          # red->green one: it swaps that traceback for a clean
          # `::notice::` skip.
          if [ ! -f "${SNAPSHOT}" ]; then
            echo "::notice::No committed snapshot at ${SNAPSHOT} yet (release cut in progress) -- skipping the ABI diff for this run."
            echo "ABI diff skipped: ${SNAPSHOT} is not committed yet." > abi_diff.txt
            echo "has_breaking=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/abi_snapshot.py --diff "${SNAPSHOT}" | tee abi_diff.txt
          # PIPESTATUS[0], not the pipeline's own exit code (that's
          # `tee`'s) -- otherwise a real abi_snapshot.py failure (exit
          # >=2: a corrupt snapshot, a parse error) leaves abi_diff.txt
          # empty, `grep` below finds nothing, and has_breaking=false
          # reports "no ABI change" for a check that never actually ran.
          diff_rc=${PIPESTATUS[0]}
          if [ "${diff_rc}" -ge 2 ]; then
            echo "::error::abi_snapshot.py --diff failed (exit ${diff_rc}); see the log above."
            exit "${diff_rc}"
          fi
          if grep -q "REMOVED\|CHANGED" abi_diff.txt; then
            echo "has_breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post diff to the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        timeout-minutes: 2
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('abi_diff.txt', 'utf8').trim();
            if (!diff || diff.includes('ABI unchanged')) return;
            const body = '### ABI snapshot diff\n\n```\n' + diff + '\n```\n\n' +
              'See [`docs/release-policy.md`](../blob/main/docs/release-policy.md#what-counts-as-breaking-for-the-sdk) ' +
              'for what counts as breaking.  `[ABI-STABLE]` removals require a major version bump.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Gate (post-1.0 only -- currently informational)
        # Flip this to remove `continue-on-error` after the v1.0
        # tag.  Until then the workflow runs to publish the diff
        # comment but does not fail the PR.
        continue-on-error: true
        run: |
          if [ "${{ steps.diff.outputs.has_breaking }}" = "true" ]; then
            echo "::warning::ABI-breaking change detected.  Post-1.0 this fails the PR unless the major version is also bumped."
            # Post-1.0: also assert metadata/sdk_version.yaml major
            # bumped vs main.  Logic lives in this block once the
            # gate flips active.
          fi

  # ---------------------------------------------------------------
  # THE context to require (#2972). Static name, always runs.
  # `skipped` is a pass ONLY when detect genuinely ran and found nothing.
  # ---------------------------------------------------------------
  summary:
    name: abi-snapshot · all
    needs: [detect, snapshot-diff]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compute verdict from snapshot-diff's + detect's results
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_RELEVANT: ${{ needs.detect.outputs.relevant }}
          GATE_RESULT: ${{ needs.snapshot-diff.result }}
        run: |
          set -euo pipefail
          echo "event=${EVENT_NAME} detect.result=${DETECT_RESULT} detect.relevant=${DETECT_RELEVANT} snapshot-diff.result=${GATE_RESULT}"

          case "${DETECT_RESULT}" in
            failure|cancelled)
              echo "::error::detect concluded '${DETECT_RESULT}'"
              exit 1
              ;;
          esac

          case "${GATE_RESULT}" in
            success)
              echo "PASS: snapshot-diff ran and succeeded"
              exit 0
              ;;
            skipped)
              if { [ "${EVENT_NAME}" = "pull_request" ] || [ "${EVENT_NAME}" = "push" ]; } \
                 && [ "${DETECT_RESULT}" = "success" ] && [ "${DETECT_RELEVANT}" != "true" ]; then
                echo "PASS: snapshot-diff legitimately skipped -- detect ran, succeeded, and found no watched path changed"
                exit 0
              fi
              if [ "${EVENT_NAME}" = "merge_group" ]; then
                echo "PASS: snapshot-diff is not applicable on merge_group (PR-to-main gate); nothing to grade"
                exit 0
              fi
              echo "::error::snapshot-diff reported 'skipped' but event=${EVENT_NAME} detect.result=${DETECT_RESULT} detect.relevant=${DETECT_RELEVANT} does not match the one legitimate-skip condition -- treating this as a broken gate, not a pass"
              exit 1
              ;;
            *)
              echo "::error::snapshot-diff concluded '${GATE_RESULT}'"
              exit 1
              ;;
          esac
