# SPDX-License-Identifier: Apache-2.0
#
# Advisory: alp-sdk `dev` tracks tan-cli `dev` during the coordinated Python
# port. The latest stable release remains the frozen Rust v0.4.1 line until
# v0.5 is cut, so installing `releases/latest` here would compare forward-
# looking port docs to the intentionally old oracle. This checks out the real
# Python source from tan-cli `dev`, installs it, then asserts every documented
# subcommand/flag/invocation exists in that binary's help grammar. See
# scripts/check_tan_docs_surface.py's docstring for
# the exact extraction rules and everything this deliberately does NOT check
# (whether a flag actually parses, output text, exit codes, semantic
# behaviour, Windows).
#
# Runs on a DAILY SCHEDULE because tan can drift with no alp-sdk commit at
# all -- the whole reason this gate needs to exist. Also runs path-filtered
# on PRs that touch the doc sources themselves, to catch a doc edit that
# invents a subcommand/flag that was never real.
#
# ADVISORY ONLY -- not a required context on dev or main. It surfaced real
# drift the day it was added (`tan emit` was renamed to `tan generate`);
# that drift was fixed in docs/retire-tan-emit, and this gate now runs
# green against `dev`.
name: tan-docs-drift

on:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - "README.md"
      - "docs/cli.md"
      - "docs/getting-started.md"
      - "docs/troubleshooting.md"
      # check_tan_docs_surface.py scans examples/**/README.md for full `tan ...`
      # invocations, so a rejected invocation added there must be able to
      # trigger this gate. Without this entry the scan existed and could never
      # fire on the files it covers -- which is how nine rejected `tan build`
      # spellings accumulated across the example READMEs unnoticed.
      - "examples/**/README.md"
      - "scripts/bootstrap.sh"
      - "scripts/check_tan_docs_surface.py"
      - ".github/workflows/tan-docs-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tan-docs-drift:
    name: "tan-docs-drift · Python Tan surface (advisory)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout tan-cli Python port
        uses: actions/checkout@v6
        with:
          repository: alplabai/tan-cli
          ref: dev
          path: .tan-cli

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install Python Tan from source
        run: python3 -m pip install ./.tan-cli/python

      - name: Sanity-check tan is really on PATH
        run: tan --version

      - name: TEMP-DEBUG dump raw help bytes
        run: |
          echo "=== env ==="
          env | sort
          echo "=== locale ==="
          locale
          echo "=== tan init --help (repr) ==="
          python3 -c "import subprocess; p = subprocess.run(['tan','init','--help'], capture_output=True, text=True); print('returncode', p.returncode); print(repr(p.stdout[:2000])); print('STDERR', repr(p.stderr[:2000]))"
          echo "=== tan init --help (hexdump head) ==="
          tan init --help | head -c 400 | xxd
          echo "=== tan build --help (repr, control) ==="
          python3 -c "import subprocess; p = subprocess.run(['tan','build','--help'], capture_output=True, text=True); print('returncode', p.returncode); print(repr(p.stdout[:500]))"

      - name: Documented tan surface still exists and is listed in --help
        run: python3 scripts/check_tan_docs_surface.py
