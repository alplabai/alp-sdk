# SPDX-License-Identifier: Apache-2.0
#
# Advisory: alp-sdk deliberately tracks tan-cli's `latest` (docs/cli.md
# explains why) -- a tan release changes documented CLI behaviour with no
# version pin to buffer alp-sdk's own docs from it. This installs `tan` by
# the EXACT path docs/cli.md itself documents (proving that path still
# works too), then asserts every `tan` subcommand + docs/cli.md-tabulated
# flag alp-sdk's docs name still exists and is listed in that real binary's
# `--help` output -- see scripts/check_tan_docs_surface.py's docstring for
# the exact extraction rules and everything this deliberately does NOT check
# (whether a flag actually parses, output text, exit codes, semantic
# behaviour, Windows).
#
# Runs on a DAILY SCHEDULE because tan can drift with no alp-sdk commit at
# all -- the whole reason this gate needs to exist. Also runs path-filtered
# on PRs that touch the doc sources themselves, to catch a doc edit that
# invents a subcommand/flag that was never real.
#
# ADVISORY ONLY -- not a required context on dev or main. It surfaced real
# drift the day it was added (`tan emit` was renamed to `tan generate`);
# that drift was fixed in docs/retire-tan-emit, and this gate now runs
# green against `dev`.
name: tan-docs-drift

on:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - "README.md"
      - "docs/cli.md"
      - "docs/getting-started.md"
      - "docs/troubleshooting.md"
      - "scripts/bootstrap.sh"
      - "scripts/check_tan_docs_surface.py"
      - ".github/workflows/tan-docs-drift.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tan-docs-drift:
    name: "tan-docs-drift · subcommand + flag existence (advisory)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install tan (docs/cli.md's own documented install.sh path)
        run: |
          curl -fsSL -o /tmp/tan-install.sh https://raw.githubusercontent.com/alplabai/tan-cli/main/install.sh
          sh /tmp/tan-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sanity-check tan is really on PATH
        run: tan --version

      - name: Documented tan surface still exists and is listed in --help
        run: python3 scripts/check_tan_docs_surface.py
