<?xml version="1.0"?>
<def format="2">
  <!-- Zephyr Kconfig/devicetree function-like macros used in `#if`. Without a
       Zephyr build context cppcheck cannot evaluate them, skips the whole file
       ("failed to evaluate #if condition") and reports it as severity=error.
       Defining them as 0 lets cppcheck pick the inactive branch and analyse
       the file. -->
  <define name="IS_ENABLED(x)" value="0"/>
  <define name="DT_NODE_HAS_STATUS(n,s)" value="0"/>
  <define name="DT_NODE_HAS_STATUS_OKAY(n)" value="0"/>
  <define name="DT_HAS_COMPAT_STATUS_OKAY(c)" value="0"/>
  <define name="DT_NODE_EXISTS(n)" value="0"/>
  <define name="DT_HAS_CHOSEN(n)" value="0"/>
  <define name="DT_NODE_HAS_COMPAT(n,c)" value="0"/>
  <define name="DT_PROP(n,p)" value="0"/>
  <define name="DT_NODE_HAS_PROP(n,p)" value="0"/>
  <define name="DT_HAS_ALIAS(a)" value="0"/>
  <define name="PARTITION_EXISTS(l)" value="0"/>
  <define name="__aligned(x)" value=""/>
  <!-- Shell subcommand tables name commands with C keywords (`register`), which
       cppcheck cannot parse as macro arguments; the table is data only. -->
  <define name="SHELL_STATIC_SUBCMD_SET_CREATE(name,...)" value=""/>
</def>
