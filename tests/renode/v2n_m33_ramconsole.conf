# Kconfig fragment for the --sim-mode Renode gate (tan-cli#77; the
# original alp-sdk#674 contract was closed by the Python west command
# that ADR-0020 Phase 4 then deleted).
#
# The shipping RZ/V2N M33-SM is HEADLESS (board defconfig CONFIG_CONSOLE=n;
# sci0 is not a CM33 console).  This enables Zephyr's `ram_console` backend
# -- the SAME headless-observability channel the alp-sdk AEN examples ship
# and the bench reads over SWD -- so the firmware's console lands in the
# `ram_console_buf` RAM ring that the `--sim-mode` gateway streams to
# the studio UART socket.  No UART, no fabricated console pin.  (That
# streaming half is not ported yet -- tan-cli#77.)
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
