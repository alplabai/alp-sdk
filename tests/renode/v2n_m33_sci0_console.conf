#
# Renode-only V2N M33-SM console (issue #1158). Pairs with
# v2n_m33_sci0_console.overlay, which enables sci0 as a real UART for the
# plain (non --sim-mode) Renode boot -- see that file's header for why this
# stays Renode-only and never applies to a real-hardware build.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
