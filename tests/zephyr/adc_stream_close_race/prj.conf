CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
# Streaming ADC (alp_adc_stream_open/_read_mv/_close -- src/zephyr/
# peripheral_adc.c) -- needed for alp_adc_stream_close() under test.
# CONFIG_ALP_SDK_V2N_SUPERVISOR / CONFIG_ALP_SDK_CHIP_GD32G553 stay OFF:
# alp_adc_stream_close() doesn't need the GD32 bridge path compiled in for
# this test, which manufactures its handle directly (via_bridge=false,
# see src/test_adc_stream_close_race.c) instead of going through
# alp_adc_stream_open() -- there is no software-fallback streaming-ADC
# backend and no simulated GD32 bridge under native_sim, so
# alp_adc_stream_open() never returns non-NULL here regardless.
CONFIG_ADC=y
CONFIG_ALP_SDK_PERIPH_ADC=y
# Force the streaming-ADC pool down to a single slot so a reopen after
# close() is *guaranteed* to hand back the exact same struct address the
# racing reader still points at -- the deterministic "1-slot pool forces
# identity" technique tests/yocto/gpu2d_slot_race.c uses for the same
# class of bug (issue #629 / #1634).
CONFIG_ALP_SDK_MAX_ADC_STREAM_HANDLES=1
