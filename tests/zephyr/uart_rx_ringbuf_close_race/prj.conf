CONFIG_ZTEST=y
CONFIG_ALP_SDK=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ALP_SDK_UART_RX_RINGBUF=y

# Force the ring-buffer pool down to a single slot so a reopen after
# detach() is *guaranteed* to hand back the exact same struct address the
# racing reader still points at -- the same deterministic "1-slot pool
# forces identity" technique tests/zephyr/adc_stream_close_race uses for
# the sibling bug (issue #1634).
CONFIG_ALP_SDK_MAX_UART_RX_RINGBUF_HANDLES=1
