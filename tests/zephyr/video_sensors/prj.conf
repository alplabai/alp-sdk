CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_ALP_SDK=y

# OV9281 runs a real ztest against an I2C emulator (ov9281_emul.c).
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

# Pin the SoC choice -- CONFIG_ALP_SDK=y needs one selected, same as the
# sibling tests/zephyr/display suite; unrelated to the video drivers here.
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y

CONFIG_I2C=y
CONFIG_VIDEO=y

# native_sim (32-bit) has SRAM_SIZE=0 -> Zephyr picks SYS_HEAP_SMALL_ONLY,
# whose heaps top out at 262136 B; shrink the pool below that instead of the
# 2 MiB default so camera_dispatch.c's BUILD_ASSERT doesn't trip here.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=65536
