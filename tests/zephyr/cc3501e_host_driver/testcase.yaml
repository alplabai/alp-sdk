# SPDX-License-Identifier: Apache-2.0
#
# Native-sim unit tests for the CC3501E companion host wrappers
# (chips/cc3501e/cc3501e.c: Wi-Fi / BLE / socket / GPIO-proxy / power /
# diagnostics), driven against a software model of the firmware SPI slave.
# Sibling of cc3501e_host_ota (the OTA wrappers).  Lives under tests/zephyr/
# (not tests/unit/) so the pr-twister gate actually runs it -- tests/unit/
# is not yet in any twister root (issue #90).

tests:
  alp_sdk.cc3501e.host_driver:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
      - native_sim/native/64
    tags:
      - alp-sdk
      - cc3501e
      - wifi
      - ble
      - sockets

  # issue #2126 review: this used to grow a second `.auto_recover_off`
  # scenario here, forcing CONFIG_ALP_SDK_CC3501E_AUTO_RECOVER off via a
  # plain CMake -D define instead of real Kconfig -- correctly rejected: a
  # bare -D proves nothing about the actual Kconfig path (Zephyr Kconfig
  # omits a disabled bool from autoconf.h entirely; that IS the bug this
  # whole change fixes). See CMakeLists.txt's own comment for why a REAL
  # Kconfig override can't work in THIS hermetic, glob-sourced target
  # without duplicating the whole alp-sdk Zephyr library. The real
  # Kconfig-off proof lives in tests/console instead (see the PR/task
  # notes: build it once at default and once with
  # CONFIG_ALP_SDK_CC3501E_AUTO_RECOVER=n and diff the compiled
  # cc3501e_core.c.obj's disassembly).
