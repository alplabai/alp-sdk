# Fake BMP581 emul target.  Lives in this test only.

description: |
  Fake Bosch BMP581 i2c-emul target used by the alp-sdk chips ztest.
  Pre-populates CHIP_ID (register 0x01) = 0x50 so bmp581_init()
  succeeds, and echoes register writes back on subsequent reads.

compatible: "alp,fake-bmp581"

include: i2c-device.yaml
