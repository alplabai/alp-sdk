# Fake INA228 emul target.  Lives in this test only.

description: |
  Fake TI INA228 i2c-emul target used by the alp-sdk chips ztest.
  Models the part's big-endian 16 / 24 / 40-bit register wire protocol;
  pre-populates MANUFACTURER_ID (register 0x3E) = 0x5449 ("TI") and
  DEVICE_ID (0x3F) = 0x2281 so ina228_init()'s identity probe succeeds.

compatible: "alp,fake-ina228"

include: i2c-device.yaml
