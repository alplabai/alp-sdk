# Fake TAS2563 emul target.  Lives in this test only.

description: |
  Fake TI TAS2563 i2c-emul target used by the alp-sdk chips ztest.
  Models the part's book/page-paged register map (SLASET3D §7.3.10,
  p.34) with datasheet POR values seeded on book 0 / page 0, the
  self-clearing CLR_INTP_LTCH bit, and an ordered write log so a test
  can assert write SEQUENCE as well as final register state.

compatible: "alp,fake-tas2563"

include: i2c-device.yaml
