# Fake ACT8760 emul target.  Lives in this test only.

description: |
  Fake Qorvo ACT88760 i2c-emul target used by the alp-sdk chips ztest.
  Two instances (ADD1 0x25, ADD2 0x26) share one two-page register
  image so the ztest can assert the driver's guarded write paths.

compatible: "alp,fake-act8760"

include: i2c-device.yaml
