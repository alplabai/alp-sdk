# Fake TPS628640 emul target.  Lives in this test only.

description: |
  Fake TI TPS628640 i2c-emul target used by the alp-sdk chips ztest.
  One instance per V2N-M1 buck address (0x44, 0x48, 0x4F); STATUS
  read-clears and the CONTROL reset bit self-clears.

compatible: "alp,fake-tps628640"

include: i2c-device.yaml
