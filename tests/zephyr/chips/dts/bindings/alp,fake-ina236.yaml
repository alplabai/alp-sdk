# Fake INA236 emul target.  Lives in this test only.

description: |
  Fake TI INA236 i2c-emul target used by the alp-sdk chips ztest.
  Models the part's 16-bit big-endian register wire protocol;
  pre-populates MFG_ID (register 0x3E) = 0x5449 ("TI") so
  ina236_init()'s identity probe succeeds.

compatible: "alp,fake-ina236"

include: i2c-device.yaml
