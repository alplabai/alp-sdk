# Fake BMI323 emul target.  Lives in this test only.

description: |
  Fake Bosch BMI323 i2c-emul target used by the alp-sdk chips ztest.
  Models the part's 16-bit-per-register, 2-dummy-byte-read wire
  protocol; pre-populates CHIP_ID (register 0x00, low byte) = 0x43
  so bmi323_init()'s soft-reset + ID probe succeeds.

compatible: "alp,fake-bmi323"

include: i2c-device.yaml
