# Fake DA9292 emul target.  Lives in this test only.

description: |
  Fake Renesas DA9292 i2c-emul target used by the alp-sdk chips ztest.
  Stateful: CH2_PG asserts a configurable number of STATUS_00 reads
  after CH2_EN rises, CHx_VSTEP writes are ignored while CHx_EN=1, and
  EVENT_00/01 are write-1-to-clear.

compatible: "alp,fake-da9292"

include: i2c-device.yaml
