# SPDX-License-Identifier: Apache-2.0
#
# Native-sim regression test for issue #1953: poll_by_repeat() must bound
# a worker-routed CC3501E op's wall time by its declared timeout_ms, not
# only its own back-off sleeps. Lives under tests/zephyr/ alongside the
# rest of the cc3501e host-driver suite (cc3501e_host_driver et al.),
# which also links the real driver -- tests/unit/ is ALSO a pr-twister
# --testsuite-root (.github/workflows/pr-twister.yml), so that is not a
# reason to place it here; this is purely a sibling-suite convention.

tests:
  alp_sdk.cc3501e.poll_deadline:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
      - native_sim/native/64
    tags:
      - alp-sdk
      - cc3501e
