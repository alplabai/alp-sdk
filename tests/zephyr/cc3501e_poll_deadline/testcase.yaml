# SPDX-License-Identifier: Apache-2.0
#
# Native-sim regression test for issue #1953: poll_by_repeat() must bound
# a worker-routed CC3501E op's wall time by its declared timeout_ms, not
# only its own back-off sleeps. Lives under tests/zephyr/ (not tests/unit/)
# so the pr-twister gate actually runs it -- tests/unit/ is not yet in any
# twister root (issue #90).

tests:
  alp_sdk.cc3501e.poll_deadline:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
      - native_sim/native/64
    tags:
      - alp-sdk
      - cc3501e
