#
# #1628: the decisive offline proof that src/backends/camera/zephyr_video.c
# and src/backends/camera/v2n_n44_isp.c compile against Zephyr v4.4.1's real
# drivers/video/ API.  No other in-repo CONFIG_VIDEO=y configuration enables
# either ALP_SDK_CAMERA_ZEPHYR_VIDEO or ALP_SDK_CAMERA_V2N_N44_ISP -- they
# all disable both, which is exactly why the pre-v4.4 API break went
# uncaught.  This scenario is the one place both are compiled.
#
# CONFIG_ALP_SDK_CAMERA_V2N_N44_ISP is compile-coverage only here: it only
# `depends on VIDEO` (no SoC gating), so it builds fine under native_sim,
# but zephyr_video still wins backend selection at this board's
# silicon_ref="*" -- the ztest below exercises zephyr_video, not this file.

CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_VIDEO=y
CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO=y
CONFIG_ALP_SDK_CAMERA_V2N_N44_ISP=y
CONFIG_LOG=y
