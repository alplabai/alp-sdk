#
# #1628: the decisive offline proof that src/backends/camera/zephyr_video.c
# compiles against Zephyr v4.4.1's real drivers/video/ API.  No other
# in-repo CONFIG_VIDEO=y configuration also enables
# ALP_SDK_CAMERA_ZEPHYR_VIDEO -- they all disable it, which is exactly why
# this backend's pre-v4.4 API break went uncaught.  This scenario is the
# one place that combination is compiled.

CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_VIDEO=y
CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO=y
CONFIG_LOG=y
