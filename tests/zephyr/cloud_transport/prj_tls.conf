# TLS handshake over loopback, the test acting as its own TLS server.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=4
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=8
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=2048
# One certificate ciphersuite matching the bundled RSA test PKI.  The option
# selects TLS 1.2, X.509 parsing and the PSA algorithms it needs.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_SSL_ALPN=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=80
CONFIG_NET_BUF_RX_COUNT=80

# native_sim has no real entropy source, so the SDK's weak-RNG guard refuses
# an mbedtls build by default.  This image is a loopback test against public
# test certificates and never ships; acknowledge that explicitly.
CONFIG_ALP_SDK_ALLOW_TEST_ENTROPY=y
