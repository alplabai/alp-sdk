#
# Build-only overlay for alp_sdk.iot.mqtt_build (issue #1938 item 2).
# Layers on top of prj.conf via EXTRA_CONF_FILE.  CONFIG_ALP_SDK_IOT_MQTT
# defaults y once CONFIG_MQTT_LIB + CONFIG_NET_TCP are both on (see
# zephyr/kconfigs/iot-audio-inference.kconfig) -- spelling it out below
# makes the intent visible to a reader who comes in cold, same as
# examples/connectivity/iot-connected-camera/overlay-aen.conf does.
#
# Deliberately omits that overlay's CONFIG_WIFI / wpa_supplicant stack --
# this scenario only needs to compile src/backends/mqtt/zephyr_drv.c's
# CONFIG_ALP_SDK_IOT_MQTT arm, which depends on the MQTT/TCP Kconfig
# symbols alone, not on a Wi-Fi driver.

CONFIG_NETWORKING=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_MQTT_LIB=y

CONFIG_ALP_SDK_IOT_MQTT=y
