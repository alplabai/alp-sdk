#
# Deliberately no CONFIG_BT -- this suite's own fake backend (registered
# in src/main.c at priority 200, ahead of zephyr_drv's 100) is the only
# ble backend that needs to open successfully; zephyr_drv's real body
# stays inert (see its file header on CONFIG_ALP_SDK_BLE gating).

CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_THREAD_LOCAL_STORAGE=y
CONFIG_MAIN_STACK_SIZE=4096
