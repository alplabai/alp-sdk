#
# Real TFLM backend on native_sim (CPU reference kernels).  Needs the
# tflite-micro module; testcase.yaml's `modules:` skips the scenario on a
# workspace without it instead of failing the Kconfig.

CONFIG_ZTEST=y
CONFIG_ALP_SDK=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_ALP_SDK_INFERENCE_BACKEND_TFLM=y
CONFIG_ALP_SDK_INFERENCE_TFLM_KERNEL_REF=y

CONFIG_THREAD_LOCAL_STORAGE=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=8192
