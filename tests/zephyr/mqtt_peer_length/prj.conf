#
# Regression coverage for #1645: src/backends/mqtt/zephyr_drv.c's
# alp_mqtt_evt_cb() bounded its copy into rx_buf correctly but never
# drained a broker payload past that bound, leaving Zephyr's
# mqtt_client.internal.remaining_payload > 0 forever -- every later
# mqtt_input() then returns -EBUSY and the connection stops
# delivering, even though the oversized message was already
# acknowledged.
#
# Unlike tests/zephyr/iot (which asserts the NOSUPPORT fallback
# because native_sim ships no MQTT-capable network stack by
# default), this suite turns real networking + CONFIG_MQTT_LIB on --
# same recipe Zephyr's own upstream
# tests/net/lib/mqtt/v3_1_1/mqtt_client uses to run a real MQTT
# client over a 127.0.0.1 TCP loopback under native_sim, adapted to
# IPv4 since alp_mqtt's zephyr_drv.c only resolves a broker_uri via
# numeric zsock_inet_pton(AF_INET, ...) (no CONFIG_DNS_RESOLVER, no
# IPv6, in this v0.2 wrapper).

CONFIG_ZTEST=y
CONFIG_ALP_SDK=y

CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_SOCKETS=y
# Two ZTEST cases in this suite each open a listen + accepted + client
# socket; the default pool (6) is tight once a prior test's sockets are
# still closing down. Cleaned up explicitly at each test's end too (see
# main.c's g_broker_client_sock), this is just headroom.
CONFIG_NET_MAX_CONTEXTS=12

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_MQTT_LIB=y
CONFIG_MQTT_VERSION_3_1_1=y
CONFIG_MQTT_LIB_TLS=n

# Deliberately NOT overriding CONFIG_ALP_SDK_MQTT_BUF_SIZE down:
# zephyr_drv.c sizes rx_buf AND tx_buf off the SAME symbol, and tx_buf
# also has to hold the client's own CONNECT/SUBSCRIBE packets --
# shrinking it made mqtt_connect() itself fail with -ENOMEM out of
# Zephyr's own mqtt_encoder.c (tx buffer too small to encode the
# CONNECT packet), before this test ever reached the defect under
# test. The test fixture's oversized PUBLISH payload is instead sized
# comfortably past the default (256).

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_THREAD_LOCAL_STORAGE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=65536
