#
# Turns on the CC3501E GPIO proxy so src/gpio_proxy.c's delegated-path
# test (issue #1618) compiles and runs.  The proxy registers at priority
# 200, above the platform gpio backend's 100, so alp_gpio_open() goes
# through px_open here.  With the shipped weak-EMPTY cc3501e_gpio_routes[]
# table and no alp_gpio_cc3501e_attach() call, EVERY pin takes the
# delegated path -- which is the path under test.
#
# Kept out of prj.conf on purpose: enabling the proxy for every scenario
# in this directory would route every existing GPIO test through it.
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y
