CONFIG_ALP_SDK=y
CONFIG_PRINTK=y

# The Zephyr watchdog class: pulls src/backends/wdt/zephyr_drv.c and, with the
# overlay's `&wdt0 { status = "okay"; }`, the renesas,rzv-wdt driver + the
# vendored FSP r_wdt module.  Both are needed for a build that proves the whole
# chain (alias alp-wdt0 -> wdt_renesas_rzv.c -> r_wdt.c).
CONFIG_WATCHDOG=y
CONFIG_ALP_SOC_RENESAS_RZV2N_N44=y
CONFIG_ALP_SDK_CHIP_GD32G553=y
