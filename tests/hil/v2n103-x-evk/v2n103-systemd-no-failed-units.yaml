# NOT BENCH-VERIFIED on E1M-V2N103: derived from the v2n101 spec of the same name
# (v2n101-x-evk); the SoM preset populates the same hardware.  UNVERIFIED on a V2N103 unit.
#
# E1M-V2N103: systemd reports no failed units.  systemd-networkd-wait-online
# is filtered out: the filter carries over from the V2M103 bench (end1
# unplugged, #2450) and is not confirmed on a V2N unit -- drop it when
# #2450 lands.  Read-only.

schema_version: 1
name: v2n103-systemd-no-failed-units
description: |
  No failed systemd units except the known #2450 wait-online failure.

flash_method: ssh-run
ssh_command: >-
  out=$(systemctl --failed --no-legend --plain) && echo HIL_SYSTEMCTL_OK;
  n=$(printf '%s\n' "$out" | grep -v systemd-networkd-wait-online | grep -c .);
  echo "HIL_UNEXPECTED_FAILED_UNITS=$n"

serial:
  duration_s: 10
  expect_contains:
    - "HIL_SYSTEMCTL_OK"
    - "HIL_UNEXPECTED_FAILED_UNITS=0"
