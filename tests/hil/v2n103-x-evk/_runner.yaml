# SPDX-License-Identifier: Apache-2.0
#
# Runner defaults for E1M-V2N103 + E1M-X-EVK.  Inherits the portable spec set
# from tests/hil/_common/.  This dir carries its own ssh-run specs, derived
# from v2n101-x-evk and NOT BENCH-VERIFIED on a E1M-V2N103 unit (the SoM preset
# populates the same hardware).  Memory tier differs only in DRAM/eMMC size; no spec asserts a size.

schema_version: 1
board: alp_e1m_v2n103_m33_sm
flash_method: westflash
defaults:
  serial:
    baud:       115200
    duration_s: 20
