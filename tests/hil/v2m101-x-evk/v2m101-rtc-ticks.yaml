# SPDX-License-Identifier: Apache-2.0
# NOT BENCH-VERIFIED on E1M-V2M101: derived from the v2m103 spec of the same name
# (v2m103-x-evk); the SoM preset populates the same hardware.  UNVERIFIED on a V2M101 unit.
#
# E1M-V2M101 RV3028 RTC (0x52) registered as a Linux rtc device and
# ticking: since_epoch advances across a 2 s sleep.  Read-only; the RTC is not
# set.  The DT alias pins rv3028 to rtc0.  The RV3028 sits on BRD_I2C
# (bus 8) at 0x52, so the i2c device node 8-0052 must exist too.

schema_version: 1
name: v2m101-rtc-ticks
description: |
  rtc0 (rv3028) exists and its clock advances.

flash_method: ssh-run
ssh_command: |-
  [ -e /sys/bus/i2c/devices/8-0052 ] && echo HIL_RTC_I2C_8_0052
  r=/sys/class/rtc/rtc0
  a=$(cat $r/since_epoch 2>/dev/null) || { echo "HIL_RTC_UNSET rtc0 unreadable (clock unset?)"; exit 0; }
  sleep 2; b=$(cat $r/since_epoch)
  echo "HIL_RTC $(cat $r/name) $a -> $b"
  [ "$b" -gt "$a" ] && echo HIL_RTC_TICKS_OK

serial:
  duration_s: 10
  expect_contains:
    - "HIL_RTC_I2C_8_0052"
    - "HIL_RTC_TICKS_OK"
