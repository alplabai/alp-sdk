#
# Runner defaults for E1M-V2N101 (Renesas RZ/V2N quad A55 + M33-SM +
# DRP-AI3) + E1M-X-EVK (45x65 board).  Inherits the portable spec
# set from tests/hil/_common/.  SoM-specific specs present alongside
# in this dir: v2n-gd32-bridge-ping.yaml (GD32 bridge ping),
# v2n-temp-sensor.yaml (on-module TMP112).
# TODO(#1160): not yet written — Ethernet, eMMC, xSPI, EEPROM, OPTIGA.

schema_version: 1
board: alp_e1m_v2n101_m33_sm        # V2N's M33 system-manager.
flash_method: westflash
defaults:
  serial:
    baud:       115200
    duration_s: 20                  # V2N M33 boot is slightly slower than AEN's M55.
