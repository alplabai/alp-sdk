#
# E1M-V2N101 xSPI NOR (xSPI0): mtd0 and mtd1 are registered with non-zero
# size, and the first 4 MiB of mtd0 hashes identically across two reads.
# Read-only: /dev/mtd0ro, never a write/erase node.  /proc/mtd is echoed
# so the partition names/sizes land in the run log.

schema_version: 1
name: v2n101-xspi-mtd
description: |
  mtd0/mtd1 present with size, mtd0 read is stable across two passes.

flash_method: ssh-run
ssh_command: |-
  cat /proc/mtd
  for m in mtd0 mtd1; do
    awk -v m="$m:" '$1==m && $2!="00000000"{f=1} END{exit !f}' /proc/mtd && echo HIL_${m}_OK
  done
  a=$(dd if=/dev/mtd0ro bs=65536 count=64 2>/dev/null | md5sum)
  b=$(dd if=/dev/mtd0ro bs=65536 count=64 2>/dev/null | md5sum)
  n=$(dd if=/dev/mtd0ro bs=65536 count=64 2>/dev/null | wc -c)
  echo "HIL_MTD0_BYTES $n"
  # d41d8cd98f00b204e9800998ecf8427e = md5 of empty input (failed read).
  [ "$n" -eq 4194304 ] && [ "${a%% *}" != d41d8cd98f00b204e9800998ecf8427e ] && [ "$a" = "$b" ] && echo HIL_MTD0_STABLE

serial:
  duration_s: 60
  expect_contains:
    - "HIL_mtd0_OK"
    - "HIL_mtd1_OK"
    - "HIL_MTD0_STABLE"
