#
# Runner defaults for E1M-V2M102 (V2N102 silicon + DEEPX DX-M1 +
# larger memory) + E1M-X-EVK.  Inherits the portable spec set
# from tests/hil/_common/.  No spec lives here: a run must target
# ../v2m103-x-evk/ explicitly for the v2m103-* and A55 ssh-run set
# (nothing includes it automatically).  Those specs are bench-observed on
# V2M103 only; on V2M102 they are UNVERIFIED, and v2m103-chosen-sku and
# v2m103-eeprom-manifest assert the E1M-V2M103 SKU string, so they fail by design.

schema_version: 1
board: alp_e1m_v2m102_m33_sm
flash_method: westflash
defaults:
  serial:
    baud:       115200
    duration_s: 20
