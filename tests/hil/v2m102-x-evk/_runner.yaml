#
# Runner defaults for E1M-V2M102 + E1M-X-EVK.  Inherits the portable spec set
# from tests/hil/_common/.  This dir carries its own ssh-run specs, derived
# from v2m103-x-evk and NOT BENCH-VERIFIED on a E1M-V2M102 unit (the SoM preset
# populates the same hardware).  Omitted: v2m103-chosen-sku and v2m103-eeprom-manifest (assert the V2M103 SKU string).  DX-M1 specs apply: the preset lists npu: deepx_dxm1.

schema_version: 1
board: alp_e1m_v2m102_m33_sm
flash_method: westflash
defaults:
  serial:
    baud:       115200
    duration_s: 20
