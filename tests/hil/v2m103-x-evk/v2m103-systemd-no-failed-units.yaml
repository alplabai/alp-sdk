#
# E1M-V2M103: systemd reports no failed units.  systemd-networkd-wait-online
# is filtered out: it fails on this EVK because end1 is unplugged (fix
# pending, #2450) -- drop the filter when that lands.  Read-only.

schema_version: 1
name: v2m103-systemd-no-failed-units
description: |
  No failed systemd units except the known #2450 wait-online failure.

flash_method: ssh-run
ssh_command: >-
  out=$(systemctl --failed --no-legend --plain) && echo HIL_SYSTEMCTL_OK;
  n=$(printf '%s\n' "$out" | grep -v systemd-networkd-wait-online | grep -c .);
  echo "HIL_UNEXPECTED_FAILED_UNITS=$n"

serial:
  duration_s: 10
  expect_contains:
    - "HIL_SYSTEMCTL_OK"
    - "HIL_UNEXPECTED_FAILED_UNITS=0"
