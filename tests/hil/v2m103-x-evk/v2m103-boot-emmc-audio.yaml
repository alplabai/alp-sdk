# SPDX-License-Identifier: Apache-2.0
#
# E1M-V2M103 booted from eMMC (root=/dev/mmcblk0p2) and the E1M-X EVK
# TAS2563 ALSA card registered (#2331 enabled it).  Read-only.

schema_version: 1
name: v2m103-boot-emmc-audio
description: |
  root=/dev/mmcblk0p2 on the kernel cmdline; TAS2563 ALSA card present.

flash_method: ssh-run
ssh_command: >-
  cat /proc/cmdline;
  if grep -q 'e1m-x-evk-tas2563' /proc/asound/cards 2>/dev/null;
  then echo HIL_ALSA_CARD_PRESENT; else echo HIL_ALSA_NO_CARD; fi

serial:
  duration_s: 10
  expect_contains:
    - "root=/dev/mmcblk0p2"
    - "HIL_ALSA_CARD_PRESENT"
  expect_absent:
    - "HIL_ALSA_NO_CARD"
