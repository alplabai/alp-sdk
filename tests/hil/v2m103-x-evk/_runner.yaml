# SPDX-License-Identifier: Apache-2.0
#
# Runner defaults for E1M-V2M103 (V2M101 silicon + DEEPX DX-M1;
# catalogued 4 GB RAM / 16 GB eMMC memory tier,
# metadata/e1m_modules/E1M-V2M103.yaml) + E1M-X-EVK.  Inherits the
# portable spec set from tests/hil/_common/.  SoM-specific specs
# in this dir (A55, ssh-run): v2n-temp-sensor.yaml,
# v2n-brd-i2c-bringup.yaml, v2n-secure-element-sign.yaml,
# v2n-power-monitor.yaml, v2n-drpai-inference.yaml; ssh_command image
# checks: v2m103-gd32-bridge-linux, v2m103-dx-m1-present,
# v2m103-boot-emmc-audio, v2m103-systemd-no-failed-units; read-only
# peripheral checks: v2m103-ethernet-link, v2m103-emmc-block,
# v2m103-xspi-mtd, v2m103-eeprom-read, v2m103-optiga-present,
# v2m103-gd32-getversion-i2c, v2m103-thermal-zones, v2m103-gd32-gpiochip,
# v2m103-rtc-ticks, v2m103-wifi-present, v2m103-bt-hci-up, v2m103-dx-m1-pcie,
# v2m103-audio-tas2563, v2m103-openamp-uio,
# v2m103-optiga-se-rst-line.
#
# NOTE: E1M-V2M101's OWN catalogue entry declares the same 4 GB
# dram_mbit as this SKU, yet V2M101 currently ships the family-default
# 8 GB (D16S32) bootloader DDR config, unchanged by the x103 firmware
# pack work. DECIDED (maintainer, 2026-09-24): firmware stays D16S32 for
# V2M101. Whether the catalogue or the firmware reflects V2M101's real
# production DRAM part/tier remains undecided and is a PRODUCTION
# BLOCKER (see the OPEN comment in meta-alp-sdk's e1m-v2m101-a55.conf and
# trusted-firmware-a_%.bbappend). Don't read this comment as settling it.

schema_version: 1
board: alp_e1m_v2m103_m33_sm
flash_method: westflash
defaults:
  serial:
    baud:       115200
    duration_s: 20
