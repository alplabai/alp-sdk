#
# E1M-V2M103 Bluetooth: hci0 is registered and, when hciconfig is on the
# image, reports UP.  Read-only.

schema_version: 1
name: v2m103-bt-hci-up
description: |
  hci0 present; UP when hciconfig can tell.

flash_method: ssh-run
ssh_command: |-
  [ -e /sys/class/bluetooth/hci0 ] && echo HIL_BT_HCI_OK
  if command -v hciconfig >/dev/null; then
    # bluetoothd may power the adapter a moment after boot: retry up to ~5 s.
    for t in 1 2 3 4 5; do
      hciconfig hci0 | grep -q 'UP RUNNING' && { echo HIL_BT_UP_OK; break; }
      [ $t = 5 ] && echo HIL_BT_DOWN || sleep 1
    done
  fi

serial:
  duration_s: 10
  expect_contains:
    - "HIL_BT_HCI_OK"
  expect_absent:
    - "HIL_BT_DOWN"
