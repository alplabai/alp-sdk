#
# E1M-V2M103 GD32 bridge firmware protocol version as reported by the kernel
# driver: gpio-gd32-bridge logs "GD32 bridge protocol X.Y.Z" at probe; accept
# protocol >= 0.14.  Read-only (kernel log only, nothing is sent to the GD32;
# the wire-level check is v2m103-gd32-getversion-i2c).  Falls back to the
# journal when the dmesg ring has wrapped.

schema_version: 1
name: v2m103-gd32-protocol-version
description: |
  dmesg "GD32 bridge protocol X.Y.Z" with X.Y >= 0.14.

flash_method: ssh-run
ssh_command: |-
  l=$( (dmesg; journalctl -k -b --no-pager) 2>/dev/null | grep 'GD32 bridge protocol' | tail -n 1)
  echo "HIL_GD32_PROTO_LINE $l"
  v=$(echo "$l" | sed -n 's/.*GD32 bridge protocol \([0-9]*\)\.\([0-9]*\).*/\1 \2/p')
  set -- $v
  if [ -z "$2" ]; then echo "HIL_GD32_PROTO_BAD no version line"
  elif [ "$1" -gt 0 ] || [ "$2" -ge 14 ]; then echo "HIL_GD32_PROTO_OK $1.$2"
  else echo "HIL_GD32_PROTO_BAD protocol $1.$2 < 0.14"; fi

serial:
  duration_s: 10
  expect_contains:
    - "HIL_GD32_PROTO_OK"
  expect_absent:
    - "HIL_GD32_PROTO_BAD"
