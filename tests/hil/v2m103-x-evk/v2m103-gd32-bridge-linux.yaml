# SPDX-License-Identifier: Apache-2.0
#
# E1M-V2M103 on E1M-X EVK, running Linux image alp-image-edge-e1m-v2m103-a55:
# the kernel's GD32 bridge driver probed the supervisor MCU on BRD_I2C
# (i2c-8, 0x70) and logged its GET_VERSION protocol (bench 2026-09-29:
# protocol 0.14.0, reply 00 00 0e 00 cf a7).  Read-only: dmesg only.
#
# ssh_command spec: no example binary, no scp.

schema_version: 1
name: v2m103-gd32-bridge-linux
description: |
  Kernel GD32 bridge driver answered GET_VERSION with protocol 0.14.0.

flash_method: ssh-run
ssh_command: "dmesg | grep -i 'GD32 bridge'"

serial:
  duration_s: 10
  expect_contains:
    - "GD32 bridge protocol 0.14.0"
  expect_absent:
    - "not answering"
