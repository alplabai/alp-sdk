# SPDX-License-Identifier: Apache-2.0
#
# E1M-V2M103 DRP-AI3 (drpai-rz, 17000000.drpai), model-free probe: the driver bound,
# and /dev/drpai0 exists.  Read-only; runs no inference and needs no model.
# The DRPAI_GET_DRPAI_AREA window (0xd0000000 / 0x20000000) is deliberately NOT
# checked: it needs python3 or a C helper, and no ALP image ships either.
# The /dev/drpai0 mode/group is deliberately NOT asserted: that access policy is
# undecided.  Not bench-run by this change.

schema_version: 1
name: v2m103-drpai-present
description: |
  drpai-rz bound to 17000000.drpai, /dev/drpai0 present.

flash_method: ssh-run
ssh_command: |-
  test -e /sys/bus/platform/drivers/drpai-rz/17000000.drpai && echo HIL_DRPAI_PROBED
  test -c /dev/drpai0 && echo HIL_DRPAI_DEV_OK

serial:
  duration_s: 20
  expect_contains:
    - "HIL_DRPAI_PROBED"
    - "HIL_DRPAI_DEV_OK"
