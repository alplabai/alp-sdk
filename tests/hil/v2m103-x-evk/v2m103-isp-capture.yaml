# SPDX-License-Identifier: Apache-2.0
#
# E1M-V2M103 + E1M-X-EVK CAM0: a Vision Components IMX568C module (colour,
# 2 lanes, RAW12) streaming colour frames through the RZ/V2N Arm Mali-C55 ISP.
#
# NOT BENCH-VERIFIED.  Written from the Renesas ISP Support Package's
# documented behaviour; it has never run on a board.
#
# PREREQUISITES (docs/v2n-isp.md):
#   - image built with the ISP Support Package V1.50 (meta-rz-isp) and the
#     IMX568C overlay layer (meta-alp-isp-imx568, private mirror), with
#     ALP_CAMERA_CAM0 = "vc_mipi_imx568c" and the shipped e1m-v2m101-x-evk
#     dtb (it carries the CAM0 and ISP nodes);
#   - the IQ data is UNTUNED, so image quality is not judged here, only that
#     the pipeline runs;
#   - the CSI-2 lane-polarity port (isp-0001) in the image: V2M103 + X-EVK J5
#     delivers no packets without it.
#
# Read-only apart from streaming 30 frames to /dev/null.  Needs v4l-utils.

schema_version: 1
name: v2m103-isp-capture
description: |
  IMX568C probed, ISP node /dev/video0fr + userspace daemon up, NV12 2464x2064
  negotiated, 30 frames streamed, no CSI/CRU errors in dmesg.

flash_method: ssh-run
ssh_command: |-
  fail=0
  dmesg | grep -qi vc-mipi && echo HIL_ISP_SENSOR_OK || { echo HIL_ISP_SENSOR_FAIL; fail=1; }
  [ -c /dev/video0fr ] && echo HIL_ISP_NODE_OK || { echo HIL_ISP_NODE_FAIL; fail=1; }
  ps | grep -q '[m]ali_iv021_isp' && echo HIL_ISP_DAEMON_OK || { echo HIL_ISP_DAEMON_FAIL; fail=1; }
  v4l2-ctl -d /dev/video0fr --set-fmt-video=width=2464,height=2064,pixelformat=NV12 >/dev/null 2>&1 \
    && echo HIL_ISP_FMT_OK || { echo HIL_ISP_FMT_FAIL; fail=1; }
  n=$(v4l2-ctl -d /dev/video0fr --stream-mmap --stream-count=30 --stream-to=/dev/null 2>&1 | tr -cd '<' | wc -c)
  echo "HIL_ISP_FRAMES $n"
  [ "$n" -ge 30 ] && echo HIL_ISP_CAPTURE_OK || { echo HIL_ISP_CAPTURE_FAIL; fail=1; }
  dmesg | grep -iE 'csi|cru|isp' | grep -iE 'err|fail|timeout' && { echo HIL_ISP_DMESG_FAIL; fail=1; } || echo HIL_ISP_DMESG_OK
  [ "$fail" = 0 ] && echo HIL_ISP_ALL_OK

serial:
  duration_s: 90
  expect_contains:
    - "HIL_ISP_SENSOR_OK"
    - "HIL_ISP_NODE_OK"
    - "HIL_ISP_DAEMON_OK"
    - "HIL_ISP_FMT_OK"
    - "HIL_ISP_CAPTURE_OK"
    - "HIL_ISP_DMESG_OK"
    - "HIL_ISP_ALL_OK"
