# SPDX-License-Identifier: Apache-2.0
#
# E1M-X EVK INA236 rail monitors on XEVK_I2C_BUS_SENSORS, read from the
# E1M-V2M103's A55.  3V3 (U21, 0x40), 1V8 (U31, 0x41) and VCAM3 (U34,
# 0x49) must initialise and print a row.  VCAM2 (U32, 0x48) is removed on
# the current E1M-X EVK V2 build batch (0x48 collides with the TAS2563
# broadcast address), so its "init failed" line is expected and not
# asserted either way.  The example loops forever; the runner stops it
# after duration_s.
#
# A55/Linux app: flash_method ssh-run.

schema_version: 1
name: v2n-power-monitor
description: |
  E1M-X EVK INA236 rail table (3V3, 1V8, VCAM3) from the E1M-V2M103 A55.

example: examples/v2n/v2n-power-monitor
flash_method: ssh-run

serial:
  duration_s: 8
  expect_contains:
    - "rail     bus_V     I_mA       P_mW"
    - "  3V3 "
    - "  1V8 "
    - "  VCAM3 "
  expect_absent:
    - "alp_i2c_open(sensor bus) failed"
    - "INA236 3V3"
    - "INA236 1V8"
    - "INA236 VCAM3"
