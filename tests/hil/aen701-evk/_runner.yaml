# SPDX-License-Identifier: Apache-2.0
#
# Per-directory runner defaults for E1M-AEN701 + E1M-EVK HiL specs.
# Inherited by every spec under this directory AND every shared
# spec in tests/hil/_common/ when the runner is invoked with this
# directory as the target.  Per-spec values override these.
# See tests/hil/README.md.

schema_version: 1

# Zephyr board target -- AEN701's M55-HP per the SoM preset's
# topology.m55_hp.board field.  No in-tree board dir exists yet
# under zephyr/boards/alp/ (unlike AEN401/AEN601/AEN801, which do)
# -- this target is not buildable until one is added.
# alp-zephyr-modules is an empty scaffold today, not a real source
# for it; treat this as a placeholder pending a real board port.
# Override per-spec with `board:` for tests that need M55-HE
# (alp_e1m_aen701_m55_he) or the A32 cluster.
board: alp_e1m_aen701_m55_hp

# No serial_port default here on purpose: the bench fronts UART
# devices with labgrid, which allocates a ser2net port fresh per
# reservation -- a fixed device path (Linux /dev/ttyUSB*/ttyACM*,
# macOS /dev/cu.usbmodem*, Windows COM<N>) would be wrong the moment
# a different session runs this spec.  Pass --serial-port or set
# ALP_HIL_SERIAL_PORT at run time; see docs/ci/HW-IN-LOOP.md.

# Flash command pattern.  `westflash` uses the SDK's existing
# `west flash` wrapper.  `pyocd-flash` is the J-Link / DAPLink path.
flash_method: westflash

defaults:
  serial:
    baud:       115200
    # 15 s is comfortable for the simple peripherals -- the example
    # apps print their banner + 2-3 iterations within 5 s; double
    # gives flake margin.
    duration_s: 15
