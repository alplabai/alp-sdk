#
# CONFIG_ALP_SDK + a pinned SoC ref + CONFIG_I2S link the real audio-out
# backend registry (audio_dispatch.c + src/backends/audio/zephyr_drv.c +
# src/backends/i2s/zephyr_drv.c) against the fake alp-i2s0 device the
# boards/*.overlay in this test supplies -- mirrors
# tests/unit/i2s_write_bounds' prj.conf (issue #1619) and
# tests/unit/audio_volume_guard's prj.conf (issue #2002).
CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y
CONFIG_I2S=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
