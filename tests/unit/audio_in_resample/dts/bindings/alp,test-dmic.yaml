#
# Fake DMIC controller used only by the audio_in_enomsg_timeout ztest.
# native_sim ships no DMIC emulation, so this test supplies its own minimal
# `struct device` behind the standard Zephyr dmic_* driver API -- enough
# for src/backends/audio/zephyr_drv.c's z_in_open()/z_in_read() to run for
# real instead of falling back to sw_fallback.c.

description: |
  Fake DMIC controller for the alp-sdk audio_in_enomsg_timeout unit test.
  configure() and trigger() always succeed; read() always returns -ENOMSG
  (issue #2133 round 4d), the same as a real driver's
  k_msgq_get(K_NO_WAIT) on an empty non-blocking read.

compatible: "alp,test-dmic"

include: base.yaml
