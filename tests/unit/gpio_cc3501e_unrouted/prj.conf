CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CONSOLE=n
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# Required for this suite's strong overrides of the WEAK
# cc3501e_gpio_unrouted[]/cc3501e_gpio_routes[] arrays to actually take
# effect: at CONFIG_SIZE_OPTIMIZATIONS (-Os, the default), GCC constant-
# folds a `const` weak array's OWN in-TU initializer into every read
# inside that same TU (cc3501e_proxy.c) before the linker ever resolves
# which definition wins -- so px_open() saw route_count/unrouted_count
# hard-folded to the WEAK default's 0, not this suite's override, and
# is_unrouted() disappeared entirely. Verified: this test's
# test_unrouted_pin_refused_nosupport case genuinely fails without this
# line (proving the fold, not a logic bug -- issue #1854 known-bad
# validation). Pre-existing in the codebase's only other user of this
# weak-array-override pattern (cc3501e_gpio_routes[]); out of this
# issue's scope to redesign.
CONFIG_NO_OPTIMIZATIONS=y
