CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_ALP_SDK=y

# Pin the SoC choice -- CONFIG_ALP_SDK=y needs one selected, same as
# tests/zephyr/video_sensors; unrelated to the camera backend under test.
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y

CONFIG_VIDEO=y
CONFIG_VIDEO_SW_GENERATOR=y

# native_sim (32-bit) has SRAM_SIZE=0 -> Zephyr picks SYS_HEAP_SMALL_ONLY,
# whose heaps top out at 262136 B; shrink the pool below that instead of the
# 2 MiB default, same as tests/zephyr/video_sensors.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=65536
