#
# alp-sdk issue #2149 (round 2 review finding 4): this test #includes
# zephyr/drivers/i2s/i2s_dw.c directly (see src/test_i2s_dw_underrun.c) to
# compile and exercise the real ISR/clock-keep-alive logic under test,
# instead of a fake device that only models the Zephyr I2S trigger
# contract. It does not go through CONFIG_I2S_DW (which depends on
# DT_HAS_SNPS_DESIGNWARE_I2S_ENABLED -- deliberately absent here, so
# DT_INST_FOREACH_STATUS_OKAY(I2S_DW_INIT) at the bottom of i2s_dw.c
# expands to nothing) or any alp-sdk backend, so this needs neither
# CONFIG_ALP_SDK nor a pinned SoC ref, unlike tests/unit/i2s_start_defer.
# CONFIG_PM_DEVICE is needed to compile and call i2s_suspend()/i2s_resume(),
# which the real driver only compiles under #if defined(CONFIG_PM_DEVICE).
CONFIG_ZTEST=y
CONFIG_I2S=y
CONFIG_PM=y
CONFIG_PM_DEVICE=y
