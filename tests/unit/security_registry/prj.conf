CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y
CONFIG_ALP_SDK_SECURITY_SW_FALLBACK=y

# CONFIG_MBEDTLS intentionally OFF here, but NOT for the reason this
# comment used to give.  It blamed a broken ssl_misc.h in Zephyr
# v4.4's mbedtls on every native_sim build; that was a misdiagnosis.
# The break was ours -- the library manifest emitted CONFIG_MBEDTLS=y
# without mbedtls' PSA core, which the pinned sources do not compile
# against -- and it is fixed at its root (ALP_SDK_MBEDTLS_PSA_CRYPTO,
# #2173).  mbedtls builds fine on native_sim today.
#
# It stays off because this test does not need it: the security
# sw_fallback is an OS-agnostic stub returning NOSUPPORT, so the
# registry test exercises the dispatcher contract end-to-end without
# pulling a TLS stack into a unit test.
