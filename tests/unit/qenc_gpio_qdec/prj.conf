CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_INPUT=y
# Runs input_process() inline on the reporting thread instead of the
# input subsystem's own worker thread -- lets the test observe the
# accumulator immediately after input_report_rel() returns, with no
# k_msleep() needed to wait for a separate thread to drain the queue.
CONFIG_INPUT_MODE_SYNCHRONOUS=y
# native_sim is not an Ensemble part: the test supplies alp_z_gpio_pad_input().
CONFIG_ALP_GPIO_PAD_INPUT=y
