CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CONSOLE=n
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# Records the hw_rev cc3501e_proxy_hw_rev_confirmed_match()'s "matching
# manifest" test case confirms against -- mirrors what a real board build
# would carry (issue #2144).
CONFIG_ALP_SDK_SOM_HW_REV="2626-r2"

# alp_hw_info_assert_matches_build()'s real compare body is compiled out
# (returns ALP_ERR_NOSUPPORT unconditionally) unless
# CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID is >= 0 AND
# CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y (src/zephyr/hw_info_zephyr.c
# ALP_HW_INFO_EEPROM_ENABLED) -- needed both for
# cc3501e_proxy_hw_rev_confirmed_match()'s "matching manifest" case to
# actually exercise the compare (most of this suite drives it directly with
# crafted status/alp_hw_info_t inputs, no real I2C transaction) AND for
# test_attach_resets_stale_forced_true_on_read_failure's REAL
# alp_gpio_cc3501e_attach() call, which does attempt one -- and fails, since
# native_sim has no devicetree I2C0 device backing this bus id, which is
# exactly the failure that test exercises.
CONFIG_I2C=y
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0

# No CONFIG_NO_OPTIMIZATIONS=y here (unlike gpio_cc3501e_unrouted's
# prj.conf): this suite does not strongly override any WEAK board-provided
# array in the same TU that reads it (issue #1860's -Os constant-fold
# trap), so it isn't exposed to that trap in the first place.
