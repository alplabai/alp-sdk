CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CONSOLE=n
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# Records the hw_rev cc3501e_proxy_hw_rev_confirmed_match()'s "matching
# manifest" test case confirms against -- mirrors what a real board build
# would carry (issue #2144).
CONFIG_ALP_SDK_SOM_HW_REV="2626-r2"

# alp_hw_info_assert_matches_build()'s real compare body is compiled out
# (returns ALP_ERR_NOSUPPORT unconditionally) unless
# CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID is >= 0 AND
# CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y (src/zephyr/hw_info_zephyr.c
# ALP_HW_INFO_EEPROM_ENABLED) -- needed for
# cc3501e_proxy_hw_rev_confirmed_match()'s "matching manifest" case to
# actually exercise the compare, even though this suite never performs a
# real I2C transaction (it drives alp_hw_info_read()'s RESULT directly with
# crafted status/alp_hw_info_t inputs, never alp_hw_info_read() itself, so
# no real EEPROM device is needed on this bus).
CONFIG_I2C=y
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0

# Required for this suite's strong override of the WEAK
# cc3501e_gpio_rev_dependent[]/cc3501e_gpio_rev_dependent_count arrays to
# actually take effect: at CONFIG_SIZE_OPTIMIZATIONS (-Os, the default), GCC
# constant-folds a `const` weak array's OWN in-TU initializer into every read
# inside that same TU (cc3501e_proxy.c) before the linker ever resolves
# which definition wins -- the same #1860/#1854 trap
# tests/unit/gpio_cc3501e_unrouted's prj.conf documents for
# cc3501e_gpio_unrouted[]/cc3501e_gpio_routes[].
CONFIG_NO_OPTIMIZATIONS=y
