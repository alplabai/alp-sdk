CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y

# CONFIG_WATCHDOG is deliberately LEFT OFF.  zephyr/CMakeLists.txt only
# links src/backends/wdt/zephyr_drv.c under CONFIG_WATCHDOG, so with the
# subsystem off the sw_fallback backend is the only wdt backend in the
# image and alp_wdt_open() actually SUCCEEDS on native_sim.  With
# CONFIG_WATCHDOG=y the priority-100 zephyr_drv wins selection, finds a
# NULL _devs[0] (native_sim has no alp-wdt0 DT alias) and returns
# ALP_ERR_NOT_READY -- every open fails and a dispatcher-level test can
# only skip, which proves nothing.  The exclusivity rule under test is
# pure dispatcher code, so exercising it over sw_fallback is faithful.
