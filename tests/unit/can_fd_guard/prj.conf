CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y
CONFIG_CAN=y

# The alp_testing CAN double is what makes this suite discriminating: its
# t_send() returns ALP_OK and CAPTURES the frame, so "refused by the dispatcher"
# and "reached the backend" are distinguishable.  sw_fallback answers
# ALP_ERR_NOSUPPORT to every send, which would make the same assertions pass
# with the guard removed -- a vacuous test.
#
# It lives in its own suite rather than in can_registry because the double
# registers at priority 255 and outranks every real backend, which changes
# backend SELECTION for any other test in the same binary.
CONFIG_ALP_SDK_TESTING=y
CONFIG_ALP_SDK_TESTING_CAN=y
