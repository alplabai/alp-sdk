CONFIG_ZTEST=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E7=y

# The real Zephyr power backend: its vtable carries the SoM domain ops.
CONFIG_PM=y
CONFIG_ALP_SDK_POWER_PM_POLICY=y

# CONFIG_ALP_SDK_SOM_POWER follows from the alp,som-power node + these.
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
CONFIG_EMUL=y
CONFIG_PINCTRL=y
CONFIG_CRC=y

# Keep the runtime restore short.
CONFIG_ALP_SDK_SOM_PD_WIFI_SETTLE_MS=10
