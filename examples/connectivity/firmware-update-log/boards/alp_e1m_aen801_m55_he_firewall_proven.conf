#
# E1M-AEN801 / Alif Ensemble E8: provisioned app-immutable update-log profile.
#
# Select this profile (-DALP_AEN_UPDATE_LOG_FIREWALL_PROVEN=ON) only for a
# board whose provisioning has already locked alp_ulog_partition so the HE
# application core cannot write or erase it, and where that direct-write
# rejection has been proven on silicon with the firewall-probe profile.
#
# This does not program the firewall. It is the one flag that lets the HE
# client report HW_ENFORCED after the HP owner also answers the MHU ready
# request. The Kconfig derives CONFIG_ALP_SDK_UPDATE_LOG_AEN_M55_FIREWALL_PROVEN
# and selects CONFIG_ALP_SDK_UPDATE_LOG_REQUIRE_HW_ENFORCED from it, so do not
# set either of those by hand.
#
CONFIG_ALP_SDK_UPDATE_LOG_AEN_M55_APP_IMMUTABLE_PROFILE=y
