# SPDX-License-Identifier: Apache-2.0
sample:
  name: firmware-update-log
  description: |
    Portable tamper-evident firmware-update audit log via
    <alp/update_log.h>. Native_sim exercises the software tier; TF-M
    builds report HW_ENFORCED only when a secure owner is present.
tests:
  alp_sdk.examples.connectivity.firmware_update_log.native_sim:
    platform_allow:
      - native_sim/native/64
    tags:
      - alp-sdk
      - example
      - update_log
      - security
    harness: console
    harness_config:
      type: one_line
      regex:
        - "verify: OK"
  alp_sdk.examples.connectivity.firmware_update_log.require_hw.native_sim:
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_ALP_SDK_UPDATE_LOG_REQUIRE_HW_ENFORCED=y
    tags:
      - alp-sdk
      - example
      - update_log
      - security
    harness: console
    harness_config:
      type: one_line
      regex:
        - "HW_ENFORCED required, but no secure owner/firewall-backed backend is active"

  alp_sdk.examples.connectivity.firmware_update_log.he_client.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - update_log
      - security
      - rtss-he
    build_only: true   # HW_ENFORCED needs the SE/device firewall; proven on the bench, not CI.

  alp_sdk.examples.connectivity.firmware_update_log.hp_owner.aen:
    platform_allow:
      - alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
    tags:
      - alp-sdk
      - example
      - aen
      - update_log
      - security
      - rtss-hp
    build_only: true   # HW_ENFORCED needs the SE/device firewall; proven on the bench, not CI.
