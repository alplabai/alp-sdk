# SPDX-License-Identifier: Apache-2.0
#
# E1M-AEN801 (Ensemble E8, M55-HE) hardware-path Kconfig for
# camera-mjpeg-stream: the ISP capture pipeline (mirrors
# examples/aen/aen-isp-ov5647-viewfinder's prj.conf), the Hantro VC9000E
# JPEG hardware encoder (mirrors examples/aen/aen-jpeg-regcheck's board
# conf), the interim Ethernet DMA-region glue (mirrors
# examples/aen/aen-ethernet-link's prj.conf), and CONFIG_DCACHE (shared
# by all three -- see below).
#
# All of it is board-scoped rather than in the shared prj.conf: these
# symbols come from the hal_alif west module -- only pulled into the
# Kconfig tree via EXTRA_ZEPHYR_MODULES for this board target -- so
# assigning them in the shared prj.conf is an undefined-symbol Kconfig
# warning that CI (warnings-as-errors) turns into a build failure on the
# native_sim scenario. See aen-jpeg-regcheck's board conf for the same
# trap, hit for real on an AEN801 bench run.

# --- ISP capture pipeline (examples/aen/aen-isp-ov5647-viewfinder) -------
# Same driver set: CSI-2 D-PHY, DesignWare CSI-2 bridge, Alif CPI capture
# controller, OV5647 sensor driver, ISP-Pico driver, through the portable
# <alp/camera.h> dispatcher (alif_isp_pico backend, priority 100 --
# outranks the portable zephyr_video backend on E8 builds, so that one is
# turned off explicitly rather than left to add dead code).
CONFIG_VIDEO=y
CONFIG_VIDEO_ISP_VSI=y
CONFIG_ALP_SDK_CAMERA_ALIF_ISP=y
CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO=n

# ISP library modules: DMSC+SCALAR+CSM (pipeline), WB+WBM (white balance),
# AE+EXPOSUREM (auto exposure), GAMMAOUT (colour output), BLS (black-level
# subtraction), CCM (colour-correction matrix) -- same set
# aen-isp-ov5647-viewfinder's prj.conf carries. BINNING/FLT stay off.
CONFIG_ISP_LIB_SCALAR_MODULE=y
CONFIG_ISP_LIB_DMSC_MODULE=y
CONFIG_ISP_LIB_CSM_MODULE=y
CONFIG_ISP_LIB_WB_MODULE=y
CONFIG_ISP_LIB_WBM_MODULE=y
CONFIG_ISP_LIB_AE_MODULE=y
CONFIG_ISP_LIB_EXPOSUREM_MODULE=y
CONFIG_ISP_LIB_GAMMAOUT_MODULE=y
CONFIG_ISP_LIB_BLS_MODULE=y
CONFIG_ISP_LIB_CCM_MODULE=y

# The ISP MI's AXI DMA master cannot reach the M55-HE's local DTCM at
# all, regardless of buffer size -- move the video-buffer pool into the
# global on-chip SRAM0 bank (4 MiB @ 0x02000000, AXI-visible) instead.
#
# Sized for THIS app, not copied from aen-isp-ov5647-viewfinder's own
# RGB565 math: src/main.c requests NV12 (1.5 bytes/pixel), not RGB565
# (2 bytes/pixel), at 640x480 -- one buffer is 460,800 bytes, not
# viewfinder's 614,400. There are only 3 REAL buffers' worth of bytes to
# pay for, not 5 (a previous pass over-counted this): 2 stay queued to
# the ISP MI and 1 converts (the AE-convergence fix, alif_isp_pico.c's
# file header) -- that is the whole cycle. When alp_camera_capture()
# hands one of those 3 to src/main.c for the encode, it is loaning out a
# POOL DESCRIPTOR (a small struct) against a buffer that already exists,
# not allocating a 4th buffer's worth of new heap bytes. NUM_MAX is kept
# one above the real count (4, not 3) purely for that descriptor
# headroom -- cheap (struct-sized, not buffer-sized) -- so the pool's own
# bookkeeping never runs an off-by-one against the 3 buffers it actually
# owns. 3 x 460,800 = 1,382,400 bytes; the heap size below adds ~13.7%
# slack for sys_heap chunk-header/alignment overhead, same proportion
# aen-isp-ov5647-viewfinder's own sizing note uses.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM0"
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=1572864
CONFIG_SYS_HEAP_AUTO=y

# --- JPEG hardware encoder (examples/aen/aen-jpeg-regcheck) --------------
# Video class + inline helpers, the Hantro VC9000E driver TU against the
# jpeg0 DT node the board overlay enables, and the hal_alif SW helper lib
# the driver links for quantization-table/JPEG-header work.
CONFIG_VIDEO_JPEG_HANTRO_VC9000E=y
CONFIG_USE_ALIF_JPEG_SW_LIB=y

# The alp-sdk backend that drives the driver through <alp/jpeg.h>
# (src/backends/jpeg/alif_hantro.c), silicon_ref="alif:ensemble:e8"
# priority 100 -- outranks sw_baseline on this SoC, so this app's runtime
# pixfmt_mask query (src/main.c) sees NV12 and builds the camera/JPEG
# request in that layout. 640x480 is well inside the driver's own
# CONFIG_VIDEO_JPEG_HANTRO_VC9000E_MAX_WIDTH/_MAX_HEIGHT (default 16384
# each, zephyr/drivers/video/Kconfig.jpeg_hantro_vc9000e).
CONFIG_ALP_SDK_JPEG_ALIF_HANTRO=y

# --- Ethernet DMA-region glue, INTERIM (examples/aen/aen-ethernet-link) --
# Board generation doesn't grow real Ethernet routing/Kconfig yet -- this
# board-scoped conf plus the board overlay's RMII pin group and PHY-power
# GPIOs are a stand-in until it does; drop both once board generation
# covers Ethernet.
CONFIG_ETH_DWMAC_ALIF=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DWMAC_ALIF_NET_BUF_IN_DMA_REGION=y
CONFIG_GPIO=y

# Bench-proven (run 203 vs 204): at the 128 B net_buf default, Ethernet
# frames over 896 B were dropped and no JPEG body arrived at all; 1536 B
# (a full Ethernet MTU per buffer) carried a real 15571 B /snapshot.jpg
# and a live /stream with zero loss. `zephyr/kconfigs/vendor-alif-peripherals.kconfig`
# now defaults CONFIG_NET_BUF_DATA_SIZE to 1536 whenever CONFIG_ETH_DWMAC_ALIF=y
# (#2260) -- no need to set it explicitly here.

# Ethernet TX/RX buffer sizing for streaming apps, bench-proven on its
# own (#2285, runs 224-228). The portable prj.conf defaults
# (CONFIG_NET_BUF_TX_COUNT=16, CONFIG_NET_PKT_TX_COUNT=8,
# CONFIG_NET_BUF_RX_COUNT=16, CONFIG_NET_PKT_RX_COUNT=8) starved the
# HTTP send path of in-flight buffers against this app's tens-of-KB
# JPEG frames: bench run 223 measured 24-30 ms send time per 32-41 KB
# frame, 45-51% of frames dropped against the camera's 60 fps capture
# rate. Raising the counts below took drops to 0% (run 224) on its
# own; combined with CONFIG_ALP_SDK_FAST_MEMCPY (below), the stream
# then reached 60.1 fps end to end -- the sensor's own rate (1803
# frames in 30 s, interval stdev 0.1 ms), but that 60.1 fps figure is
# the combined configuration's, not this buffer sizing's alone.
# Board-scoped, not portable prj.conf: an AEN target has the SRAM0
# headroom to spend on this; native_sim doesn't need it and keeps the
# smaller portable defaults.
#
# CAVEAT: the 60.1 fps run used a simpler scene with a smaller mean
# frame (14.7 KB) than the 223/205 runs it is compared against above --
# not a clean same-scene A/B against the earlier numbers. See this
# example's README Measured section.
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=65535
CONFIG_NET_TX_STACK_SIZE=2048

# CONFIG_ALP_SDK_FAST_MEMCPY (zephyr/kconfigs/core.kconfig) defaults to
# n -- a same-scene A/B on this exact target (E1M-AEN803, module
# 2026W36-0001, 640x480 @ 30 fps, camera-bound) found no measurable
# gain from it against the buffer-sizing-only baseline above: 30.03 fps
# / ~1.09 MB/s with it on and off alike, 0 drops either way. Enabled
# here anyway on the strength of the combined 60.1 fps figure above
# (runs 224-228, send-bound scene) -- the send-bound case is the one
# run 223 actually hit and is not covered by the camera-bound A/B. See
# this example's README Measured section for both numbers.
CONFIG_ALP_SDK_FAST_MEMCPY=y

# DHCP + TCP need sys_rand_get() (transaction IDs, ISNs) and there is no HW
# RNG wired on this SoM -- same non-crypto timer-PRNG choice
# aen-ethernet-link's prj.conf documents. native_sim gets an equivalent test
# entropy source automatically, so this is board-scoped, not shared.
CONFIG_TEST_RANDOM_GENERATOR=y

# E8 D-cache maintenance loop hangs on this silicon (shared bench rule,
# scripts/bench/aen/aen-bench-shared.conf) -- board-scoped, not shared
# prj.conf, purely because CONFIG_DCACHE's neighbours above already are;
# the symbol itself is generic and setting it off is harmless anywhere.
CONFIG_DCACHE=n
