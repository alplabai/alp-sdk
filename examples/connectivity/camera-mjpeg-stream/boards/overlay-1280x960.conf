#
# camera-mjpeg-stream 1280x960 variant (issue #2286) -- layered
# on TOP of either boards/alp_e1m_aen801_m55_he_ae822fa0e5597ls0_rtss_he.conf
# or boards/alp_e1m_aen803_m55_he_ae822fa0e5597ls0_rtss_he.conf via
# `-DEXTRA_CONF_FILE=overlay-1280x960.conf` (see testcase.yaml's
# aen_1280x960 scenario). AEN801 and AEN803 are the same PCB/SoC and the
# two board confs above are content-identical apart from their header
# comments (diff them) -- this overlay's SRAM0 accounting below applies
# unchanged to both. Sets CONFIG_CAMERA_MJPEG_STREAM_1280X960 (which
# switches src/main.c's FRAME_W/FRAME_H/FRAME_FPS and mjpeg_http.h's
# MJPEG_HTTP_MAX_JPEG) and re-derives every SRAM0 sizing knob that
# resolution needs -- the board conf's own NUM_MAX/HEAP_SIZE comment does
# the 640x480 math this comment mirrors at 1280x960.
#
# Not meaningful on native_sim (no camera/ISP there) and not applied to
# it in testcase.yaml.

CONFIG_CAMERA_MJPEG_STREAM_1280X960=y

# --- ISP raw buffer count: 2, not the board conf's inherited 3 -----------
# camera-mjpeg-stream requests NV12 (no CPU-side RGB565 conversion, see
# isp_capture() in src/backends/camera/alif_isp_pico.c), so the only
# buffer ever held outside the ISP MI's queue is the one src/main.c is
# mid-JPEG-encoding -- 1 buffer queued is enough to keep the MI fed while
# that happens (see ALP_SDK_CAMERA_ALIF_ISP_VBUF_COUNT's Kconfig help,
# zephyr/kconfigs/power-camera-display.kconfig, for the floor-of-2
# reasoning and why the RGB565 conversion path -- unused here -- needs 3).
# 3 raw buffers at this frame size (3 x 1,843,200 = 5,529,600 B) would not
# fit the 4 MiB SRAM0 bank at all; 2 is both correct for this app's
# pixel-format choice and the only count that fits.
CONFIG_ALP_SDK_CAMERA_ALIF_ISP_VBUF_COUNT=2

# --- Video buffer pool sizing --------------------------------------------
# One 1280x960 NV12 frame is 1280 x 960 x 1.5 = 1,843,200 B. With
# VBUF_COUNT=2 there are 2 REAL ISP raw buffers to pay for (not 3, unlike
# the 640x480 board conf), PLUS 1 more pool slot the JPEG encode path
# claims per call via video_import_buffer() for its output buffer
# (src/backends/jpeg/alif_hantro.c) -- that slot shares the SAME
# framework-wide pool (CONFIG_VIDEO_BUFFER_POOL_NUM_MAX-sized static
# array, drivers/video/video_common.c), not a second pool, so it counts
# against NUM_MAX too even though its bytes are NOT SRAM0-heap-backed
# (see below). 3 REAL slots in concurrent use -- NUM_MAX is kept one
# above that (4, not 3) for the same cheap struct-sized pool-descriptor
# headroom the board conf's own comment explains, not a 4th buffer's
# worth of bytes.
#
# 2 x 1,843,200 = 3,686,400 B minimum (this Kconfig's own default is
# 1,572,864, sized for the board conf's 640x480 case -- this OVERRIDES
# it). CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE backs only the REAL ISP raw
# buffers (2 of them) -- the pool-descriptor array NUM_MAX sizes is a
# small static struct array, not carved from this heap, so raising
# NUM_MAX 3->4 does not change the SRAM0 heap-size math below at all.
# Heap size below adds 65,536 B (~1.8%) of sys_heap chunk-header/
# alignment slack, not the board conf's ~13.7% -- SRAM0 has no room left
# for that much at this frame size once the JPEG output buffers below
# (2 x 160 KiB = 327,680 B) are also paid for: 3,751,936 + 327,680 =
# 4,079,616 B, inside the 4,194,288 B usable in the 4 MiB SRAM0 bank
# (0x02000000-0x023FFFF0; 0x02400000 upward is SRAM1, UNPOWERED on this
# silicon -- never place anything there), leaving ~114 KiB of headroom for
# the Ethernet DMA-region descriptor rings + net_buf pool this board conf
# also routes into SRAM0 (&ethernet's memory-region, zephyr/dts/alif/
# ensemble_e8_peripherals.dtsi). SRAM0 usage is UNCHANGED by the NUM_MAX
# 3->4 fix above.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=3751936

# --- JPEG output buffers: 160 KiB x 2 (mjpeg_http.h) ----------------------
# No Kconfig knob here -- MJPEG_HTTP_MAX_JPEG is a #define in
# mjpeg_http.h, already switched to 163,840 B (160 KiB) by
# CONFIG_CAMERA_MJPEG_STREAM_1280X960 above; this comment exists purely
# so the SRAM0 accounting above stays next to the number it depends on.

# The AEN board confs raise the Ethernet TX/RX buffer counts for the
# 640x480 stream (#2285). At 1280x960 SRAM0 has no room for them (the link
# overflows SRAM0 by ~39 KB), so this variant keeps the portable prj.conf
# counts it was bench-verified with (#2286: 7.50 fps delivered, send-bound).
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_PKT_RX_COUNT=8
