#
# Two files, content-identical on purpose: native_sim.conf applies to the
# bare `native_sim` (32-bit) platform_allow entry, and this one applies to
# `native_sim/native/64`. Zephyr's board-conf auto-apply looks
# for `<board>_<qualifiers>.conf` OR (single-SoC boards only) a
# "shortened" `<board>_<qualifiers-minus-the-first-segment>.conf` --
# native_sim's bare target resolves to qualifiers "native" (one segment,
# stripped down to nothing), whose shortened form IS this bare
# `native_sim.conf`; `native_sim/native/64` resolves to qualifiers
# "native/64" (two segments), whose full form is
# `native_sim_native_64.conf` -- a DIFFERENT filename this file's own name
# does NOT match. There is no single filename Zephyr will pick up for
# both qualifier strings; verify both when touching this
# (`west build -b native_sim ...` and `-b native_sim/native/64 ...`), and
# keep the two files in sync by hand -- nothing gates that automatically
# (check_example_board_overlay_content_parity.py only pairs same-PCB SoM
# SKUs, not native_sim qualifier variants).
#
# native_sim links no real camera driver, so alp_camera_open() fails and
# main.c falls back to the synthetic frame -- alp_has(ALP_CAP_ID_HW_MIPI_CSI)
# itself reads TRUE here too (board.yaml still declares som.sku:
# E1M-AEN803; the capability comes from the configured SoM, not the host
# running this binary). native_sim also has no Ethernet; the loopback
# interface (127.0.0.1) is enough to prove the HTTP server end to end via
# src/selftest.c, without needing native_sim's TAP/Ethernet host setup.

CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y

# src/selftest.c opens TWO back-to-back loopback connections (GET
# /snapshot.jpg, then GET /stream) from the same client thread. The
# default 1500ms TCP TIME_WAIT delay (CONFIG_NET_TCP_TIME_WAIT_DELAY)
# left the first connection's local ephemeral port lingering long enough
# that the second connect() got ECONNREFUSED -- confirmed by instrumenting
# both sides: the server's accept() was genuinely still blocked waiting
# (proving the listening socket itself was fine) while the client's own
# connect() failed immediately, which is exactly what a TIME_WAIT port
# collision on this small-ephemeral-range loopback stack looks like. Zero
# delay is the same fix zephyr/samples/net/sockets/dumb_http_server_mt's
# prj.conf uses for the identical reason ("needed so that the sample app
# can respond to queries as fast as possible"). CI-selftest-only, not a
# production concern: a real client on a real network doesn't reconnect
# fast enough to hit this, and this file never applies to the AEN board
# target.
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
