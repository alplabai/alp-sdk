#
# native_sim has no MIPI-CSI camera (alp_has(ALP_CAP_ID_HW_MIPI_CSI) is
# false) and no Ethernet -- the loopback interface (127.0.0.1) is enough
# to prove the HTTP server end to end via src/selftest.c, without needing
# native_sim's TAP/Ethernet host setup.

CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
