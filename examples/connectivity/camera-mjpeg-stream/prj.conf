#
# camera-mjpeg-stream -- PORTABLE config only.  Every AEN-hardware-path
# Kconfig symbol (the ISP capture pipeline, the Hantro VC9000E JPEG
# encoder, the Ethernet DMA-region glue, CONFIG_DCACHE) lives in the
# board-qualified boards/alp_e1m_aen80{1,3}_m55_he_ae822fa0e5597ls0_
# rtss_he.conf files instead, NOT here -- those symbols come from the
# hal_alif west module, which is only pulled into the Kconfig tree via
# EXTRA_ZEPHYR_MODULES for the real board target.  Assigning them in this
# file (applied to every target, including native_sim) is an
# undefined-symbol Kconfig warning that CI (warnings-as-errors) turns
# into a build failure -- the exact trap examples/aen/aen-jpeg-regcheck's
# board-scoped conf documents.

CONFIG_ALP_SDK=y

# TCP/IP + DHCP client + plain BSD sockets.  Portable Zephyr net stack --
# safe on every target, including native_sim's CONFIG_NET_LOOPBACK build
# (boards/native_sim.conf).  mjpeg_http.c/selftest.c call the
# `zsock_*`-prefixed API (CONFIG_NET_SOCKETS) rather than the plain POSIX
# names -- no CONFIG_POSIX_API needed, and it sidesteps a real native_sim
# hazard where the plain names can silently resolve to the HOST's own
# libc socket() instead of Zephyr's (see mjpeg_http.c's file header).
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# SO_RCVTIMEO / SO_SNDTIMEO on every accepted socket (mjpeg_http.c) --
# without these, zsock_recv()/zsock_send() block forever on an idle or
# deliberately-stalled peer, wedging the single server thread (backlog 1,
# one client at a time) indefinitely.
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y

# One MJPEG frame (a few tens of KiB) per send() burst needs more
# in-flight buffers than the net-stack default -- same bump
# examples/aen/aen-ethernet-link's prj.conf uses for its own DHCP test.
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# The camera-capture/JPEG-encode loop (main thread) + the HTTP server
# thread (mjpeg_http.c) each want headroom; the server thread's stack is
# sized in mjpeg_http.c itself.
CONFIG_MAIN_STACK_SIZE=8192

# This app allocates no memory of its own (both JPEG buffers and the
# synthetic-frame source buffer are static arrays); the net stack's own
# internal allocations are what CONFIG_HEAP_MEM_POOL_SIZE covers here.
# 65536 was copied in without measuring -- 8192 is what an actual
# native_sim run under this exact Kconfig needs with headroom; DTCM is
# the scarce resource on the AEN board target (see boards/alp_e1m_aen80{1,3}_
# ..._rtss_he.conf's own budget note), so this is not padded further.
CONFIG_HEAP_MEM_POOL_SIZE=8192
