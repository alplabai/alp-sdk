#
# Empty-by-design Kconfig.  The effective build config is the
# overlay alp.conf emitted from board.yaml by scripts/alp_project.py
# at configure time (see CMakeLists.txt) -- it turns the
# `iot: {wifi, tls}` toggles + `libraries: [mbedtls]` into the
# CONFIG_* the app needs (Wi-Fi, the MQTT client, mbedtls).
#
# mbedtls used to be forced OFF here and in a native_sim.conf, because
# the pinned mbedtls' ssl_misc.h uses `mbedtls_error_pair_t` with PSA
# crypto off and does not compile.  That is fixed at its root -- the SDK
# now turns mbedtls' PSA core on with mbedtls itself, see
# ALP_SDK_MBEDTLS_PSA_CRYPTO in zephyr/Kconfig.alp-libraries (#2173) --
# so every target, native_sim included, builds the same TLS-enabled
# configuration the SoM does.
