# SPDX-License-Identifier: Apache-2.0

sample:
  name: mqtt-telemetry
  description: |
    Publish a sensor reading over MQTT/TLS via the portable
    <alp/iot.h> Wi-Fi + MQTT surface.  AEN-only: the transport is
    the CC3501E Wi-Fi6+BLE bridge on the E1M-AEN801.  On native_sim
    there is no radio, so alp_wifi_open()/alp_mqtt_open() return
    NULL (NOT_READY) and the app prints the telemetry framing it
    would publish, then exits on the done marker.

tests:
  alp_sdk.example.mqtt_telemetry.native_sim:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    tags:
      - alp-sdk
      - example
      - iot
      - mqtt
      - aen
    harness: console
    harness_config:
        type: one_line
        regex:
          - "\\[mqtt\\] done"
    # No native_sim.conf any more: it existed only to turn mbedtls off
    # around the ssl_misc.h break, which is fixed at its root (#2173), so
    # this scenario now builds the same TLS-enabled config the SoM does.
    # native_sim's only entropy driver is FAKE_ENTROPY_NATIVE_SIM, whose own
    # Kconfig help says it "does not generate real entropy", so the weak-RNG
    # refusal in zephyr/CMakeLists.txt applies here too (#2192). A simulator
    # run is exactly what the opt-in exists for. It lives on the SCENARIO,
    # not in the app's prj.conf, so a copy scaffolded by `tan init
    # --from-example` and built for real hardware still refuses.
    extra_configs:
      - CONFIG_ALP_SDK_ALLOW_TEST_ENTROPY=y

  # Issue #2173: the AEN build had no scenario at all, so the one target
  # this app is actually written for -- the CC3501E bridge on an
  # E1M-AEN801 -- was never compiled in CI, and it had stopped compiling
  # (the mbedtls PSA floor, fixed in zephyr/Kconfig.alp-libraries).
  # build_only: there is no radio on a CI runner, so this asserts the
  # image links for the SoM its board.yaml names, nothing more.
  alp_sdk.example.mqtt_telemetry.aen:
    platform_allow:
      - alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
    tags:
      - alp-sdk
      - example
      - iot
      - mqtt
      - aen
    build_only: true
    # There is no Alif Ensemble entropy driver in this tree or upstream
    # (#2192), so this compile check has to acknowledge the weak RNG to run
    # at all -- that is the honest state of AEN TLS today, and build_only
    # means the image never leaves CI. The opt-in is deliberately here and
    # not in the app's prj.conf: a scaffolded copy built for a real SoM gets
    # the refusal, naming #2192 and the entropy driver it needs.
    extra_configs:
      - CONFIG_ALP_SDK_ALLOW_TEST_ENTROPY=y
    harness: console
    harness_config:
        type: one_line
        regex:
          - "\\[mqtt\\] done"
