# board.yaml -- per-app project configuration for the
# iot-fleet-ota demo (secure OTA, verify-only on this SKU).
#
# Production-readiness proof: how do we update 10 000 units in
# the field?  Answer: signed firmware artefact pulled from a
# Mender server, signature verified against the public half of
# an OPTIGA-Trust-M-locked ECDSA-P256 keypair.  On a two-slot AEN
# target the verified artefact would then be written and booted;
# on this SKU (E1M-AEN801) OTA apply is DEFERRED (see [STATUS]
# below), so the device verifies but does not write or boot it.
# Per docs/secure-boot.md the private signing key never leaves
# the SoM's secure NVM.
#
# [STATUS] On this SoM (E1M-AEN801), MCUboot boots single-app
# (CONFIG_SINGLE_APPLICATION_SLOT=y, #1069/#1413) -- both M55 cores
# share the same physical App MRAM, so there is no inactive
# MCUboot slot to write the new image into and no swap-with-revert
# on this core.  A rejected/failed image halts rather than rolling
# back (see docs/secure-boot.md).  This example demonstrates the
# Mender/signing wiring; the swap-with-revert rollback path needs a
# two-slot AEN target, which none of the qualified boards are today.
#
# This board.yaml describes the device side only -- the
# customer-buildable half of the contract.  The Mender server
# side is owned externally (separate repo, Hakan).
libraries:
  - name: mbedtls
    cores: [m55_hp]

som:
  sku: E1M-AEN801          # Alif Ensemble + on-SoM OPTIGA Trust M.
                            # The OPTIGA holds the production
                            # ECDSA-P256 key (slot 0xE0F0); same
                            # key gates both secure boot and OTA
                            # acceptance (single trust root).

preset: e1m-evk
cores:
  a32_cluster:
    os: "off"
  m55_hp:
    app: ./src
    # IoT toggles -- Wi-Fi + TLS only.  MQTT stays off here: Mender's
    # Zephyr client speaks HTTPS poll (see docs/ota.md "Option A").
    iot:
      wifi: true
      tls:  true
    # Libraries.  Schema-valid set is `mbedtls` only -- the SDK
    # schema's enum doesn't include `mcuboot` or `mender` because
    # both are integrated differently:
    #
    #   - mcuboot:  pulled in by sysbuild via the `boot:` block
    #               below.  See docs/secure-boot.md.
    #   - mender:   the mender-mcu-client Zephyr module is pinned
    #               via the west manifest's `mender` group (v0.4
    #               item per docs/ota.md "Option A").
    #
    # mbedtls covers the TLS for the HTTPS poll + the ECDSA-P256
    # signature verification path that wraps imgtool's signed
    # artefact on the way into slot0 (single-app on this SKU today --
    # see the [STATUS] note above).  The v0.6 cross-field validator
    # (P2.3 rule 3) requires `mbedtls`
    # (or `bearssl`) in `libraries:` whenever `iot.tls: true` --
    # native_sim parity is restored at the v0.6 PSA work item.

# No additional chips: the on-SoM OPTIGA Trust M is part of the
# E1M-AEN801 preset and the CC3501E Wi-Fi bridge is wired
# through cores.m55_hp.iot.wifi: true.  No extra `chips:` entries
# needed.

# ----------------------------------------------------------------
# Bootloader (project-wide, board.yaml v0.6 `boot:` block).
# ----------------------------------------------------------------
# MCUboot + ECDSA-P256.  `swap_algorithm:` is intentionally omitted:
# the SDK's per-target default now follows the target's own DT
# (#1413) rather than one value for every AEN SKU, and E1M-AEN801's
# disjoint-slot0 layout has no slot1/scratch partition -- see the
# [STATUS] note above.  Setting `swap_algorithm: scratch` here would
# be a build-time error on this SKU (no slot1/scratch to swap into);
# see docs/secure-boot.md and docs/board-config-features.md
# §Bootloader.
#
# `key_file:` is the SIGNING key, not a verification key: it becomes
# `SB_CONFIG_BOOT_SIGNATURE_KEY_FILE`, which imgtool signs with and
# from which MCUboot extracts the public half at build time.  It must
# therefore be a PRIVATE PEM -- a `.pub.pem` here cannot sign, and the
# generated overlay layers AFTER the curated defaults, so a bad value
# silently overrides `zephyr/sysbuild/aen/sysbuild.conf`.
#
# This points at the local development key, matching that same
# sysbuild.conf.  It is gitignored and generated once per clone:
#     bash keys/generate_dev_key.sh
# Production images are re-signed in the manufacturing CA's HSM, where
# the private key never leaves the signer -- the build-time key is
# never the production one (see docs/secure-boot.md "Signing key
# lifecycle" and keys/README.md).
boot:
  method: mcuboot
  signing:
    algorithm: ecdsa_p256
    key_file:  keys/mcuboot_dev_ecdsa_p256.pem

# ----------------------------------------------------------------
# OTA (project-wide, board.yaml v0.6 `ota:` block).
# ----------------------------------------------------------------
# `provider: mender` triggers two emitters:
#
#   - Yocto slices (`os: yocto`): scripts/alp_orchestrate/'s
#     _slice_local_conf() emits `INHERIT += "mender-full"` and
#     `MENDER_*` weak-assignments into local.conf.  Customers
#     forking this skeleton for V2N101 (Linux + M33) inherit the
#     `storage:` geometry below without re-typing it.
#
#   - Zephyr slices (`os: zephyr`): the mender-mcu-client west
#     module reads the same `provider:` + `server:` + `poll_interval_s:`
#     fields at app init time (HTTPS poll path; `storage:` is
#     ignored -- MCUboot's slot layout owns the on-device geometry,
#     not the OTA block).
#
# Tokens stay outside the repo: `${MENDER_TENANT_TOKEN}` is
# expanded by the build host's environment (Yocto bblayers) or
# the device's Mender provisioning step (Zephyr).  See
# docs/ota.md "Secrets handling".
ota:
  provider: mender
  artifact_name: iot-fleet-ota
  server:
    url:    "https://hosted.mender.io"
    tenant: "${MENDER_TENANT_TOKEN}"
  storage:
    device: /dev/mmcblk0     # Linux variants of this skeleton
    boot_part_mb: 32         # use the same rootfs A/B geometry;
    total_size_mb: 4096      # ignored on the AEN-only Zephyr build.
  poll_interval_s: 1800

diagnostics:
  log_level: info
