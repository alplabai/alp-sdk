# SPDX-License-Identifier: Apache-2.0

sample:
  name: iot-fleet-ota
  description: |
    Secure OTA firmware update.  Trust roots in the on-SoM OPTIGA
    Trust M secure element; signatures are ECDSA-P256; on this SKU
    (E1M-AEN801) MCUboot boots single-app (#1069/#1413), so a
    rejected or failed image halts rather than rolling back;
    downloads speak Mender's HTTPS poll protocol.
    Production-readiness proof for fleets of 10k+ units.
tests:
  alp_sdk.examples.iot_fleet_ota.native_sim:
    platform_allow:
      - native_sim/native/64
    tags:
      - alp-sdk
      - example
      - iot
      - ota
      - security
    build_only: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "\\[ota\\] done"
    # No native_sim.conf any more: it existed only to turn mbedtls off
    # around the ssl_misc.h break, which is fixed at its root (#2173), so
    # this scenario now builds the same TLS-enabled config the SoM does.
  # Issue #2173: this scenario named `ensemble_e8_dk/...` -- Alif's own
  # DevKit board, which no -p flag in this repo selects -- so it was never
  # built by any job, and the app had in fact stopped compiling for AEN
  # entirely (the mbedtls PSA floor, fixed in zephyr/Kconfig.alp-libraries).
  # It now names the board target this app's own board.yaml describes
  # (som.sku E1M-AEN801, preset e1m-evk, core m55_hp), which
  # pr-twister-aen.yml does run.
  alp_sdk.examples.iot_fleet_ota.aen:
    platform_allow:
      - alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
    tags:
      - alp-sdk
      - example
      - iot
      - ota
      - security
    build_only: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "\\[ota\\] done"
