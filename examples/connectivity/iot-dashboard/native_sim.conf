#
# Native-sim Kconfig overlay for iot-dashboard.
#
# Loaded LAST via twister's `extra_args: EXTRA_CONF_FILE=...`
# (see ../testcase.yaml), so the settings here win over the
# alp.conf-emitted CONFIG_MBEDTLS=y that `libraries: [mbedtls]`
# pulls into every iot-dashboard build.
#
# The mbedtls-off block that used to live here is gone: it worked
# around the ssl_misc.h break, which is fixed at its root (#2173),
# so this target now builds the same TLS-enabled configuration the
# SoM does.  What remains is the panel wiring, which is genuinely
# native_sim-only.

# native_sim has no real ST7789 panel, so bind Zephyr's dummy display
# driver: it lets the dashboard link without an SDL/X11 dependency.
# On real silicon this file is NOT applied (the generated alp.conf
# binds the actual ST7789 driver instead), so the dummy-panel knob
# never reaches the real-silicon build.
CONFIG_DUMMY_DISPLAY=y

# native_sim's DTS also carries a zephyr,sdl-dc node, so CONFIG_DISPLAY=y
# (prj.conf) drags in the SDL display driver by default alongside the
# dummy one above -- see examples/display/lvgl-widgets-demo/native_sim.conf
# for why that segfaults headless. This app never opens that device,
# so keep SDL out of the build entirely.
CONFIG_SDL_DISPLAY=n

# native_sim's only entropy driver is FAKE_ENTROPY_NATIVE_SIM, whose own
# Kconfig help says it "does not generate real entropy". mbedTLS' PSA crypto
# core is on here (ALP_SDK_MBEDTLS_PSA_CRYPTO, #2173), so the weak-RNG
# refusal in zephyr/CMakeLists.txt applies and a simulator run has to
# acknowledge it (#2192). This file is native_sim-only and is NOT applied to
# a real-silicon build, so a scaffolded copy built for a SoM still refuses
# until a real entropy driver exists.
CONFIG_ALP_SDK_ALLOW_TEST_ENTROPY=y
