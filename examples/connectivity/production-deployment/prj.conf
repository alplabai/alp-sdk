#
# Empty by design.  The build's effective Kconfig is
# build/generated/alp.conf -- emitted from this app's board.yaml
# by scripts/alp_project.py and layered over this file via
# EXTRA_CONF_FILE (see CMakeLists.txt).
#
# mbedtls used to be forced OFF here (and in native_sim.conf), because
# the pinned mbedtls' ssl_misc.h uses `mbedtls_error_pair_t` with PSA
# crypto off and does not compile.  That is fixed at its root -- the SDK
# now turns mbedtls' PSA core on with mbedtls itself, see
# ALP_SDK_MBEDTLS_PSA_CRYPTO in zephyr/Kconfig.alp-libraries (#2173) --
# so the attestation / OTA-poll call sites build against the real
# library on every target, native_sim included.
