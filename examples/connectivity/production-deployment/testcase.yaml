sample:
  name: production-deployment
  description: |
    v1.0 reference application for a field-deployable IoT product.
    Demonstrates the full manufactured -> deployed -> updated ->
    attested lifecycle on a single app (EEPROM factory-identity
    read-back, MCUboot slot inspection, Mender OTA polling,
    OPTIGA-signed remote attestation).  Native_sim exercises the
    framing path (every stage reaches its open() call); HiL
    verification gates on a staged Mender server, and OTA apply
    is DEFERRED on the qualified single-slot AEN801 target
    (#1069 -- see [STATUS] in board.yaml).
common:
  tags: production secure-boot ota attestation
  harness: console
  harness_config:
    type: one_line
    regex:
      - "\\[prod\\] done"
tests:
  alp_sdk.examples.production_deployment.native_sim:
    platform_allow: native_sim/native/64
    # native_sim.conf loads LAST (after alp.conf's EXTRA_CONF_FILE
    # emit) so it wins over the alp.conf-emitted defaults.  It no
    # longer flips CONFIG_MBEDTLS off -- that break is fixed at its
    # root (#2173) and this target now builds the same TLS-enabled
    # configuration the SoM does.  What is left is the littlefs block
    # and the native_sim weak-RNG opt-in; see native_sim.conf.
    extra_args:
      - "EXTRA_CONF_FILE=native_sim.conf"
  alp_sdk.examples.production_deployment.aen:
    platform_allow:
      - ensemble_e8_dk/ae822fa0e5597ls0/rtss_hp
    build_only: true   # real run needs a staged Mender server.
