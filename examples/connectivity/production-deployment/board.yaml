# board.yaml -- per-app project configuration for the
# production-deployment flagship.
#
# v1.0 reference application for a field-deployable IoT product.
# Designed against AEN801 (the security-target SoM: dual-Cortex-M55
# silicon with on-module OPTIGA Trust M + TF-M secure-boot fabric).
# Demonstrates EVERY v0.6 declarative block applied at production
# stance:
#
#   - `boot:`              MCUboot + ECDSA-P256, single-app boot on
#                           this SKU (slot geometry lives in the
#                           board DT, not `boot:` -- see [STATUS])
#   - `ota:`               Mender HTTPS-poll, A/B rootfs (for the
#                           Linux-fork variant)
#   - `security.psa:`      TF-M secure partition + OPTIGA-rooted
#                           attestation
#   - `storage:`           illustrates the declarative SHAPE only on
#                           this SKU -- E1M-AEN801's `memory_map:`
#                           already claims the full 5632 KiB App MRAM,
#                           so every entry below is BLOCKED at emit
#                           time; see [STATUS]
#   - `cores.<id>.memory:` tuned stack / heap / ISR-stack sizes
#   - `cores.<id>.power:`  standby with multi-source wakeup
#   - `diagnostics.modules:` security / iot at info, everything
#                           else at warn
#
# [STATUS] On this SoM (E1M-AEN801), MCUboot boots single-app
# (CONFIG_SINGLE_APPLICATION_SLOT=y, #1069/#1413) -- both M55 cores
# share the same physical App MRAM, so there is no inactive MCUboot
# slot on the Zephyr side.  The `mcuboot_secondary` / `mcuboot_scratch`
# entries under `storage:` below are a separate, project-declared
# partition table (a customer `storage:` block, not the board DT's
# `slot0_partition` / `slot1_partition` / `scratch_partition` labels
# MCUboot's flash-map actually reads) -- they do not give this SKU a
# second boot slot.  A/B rootfs OTA is real on the Linux-fork variant
# (`os: yocto`, a different core); Zephyr-side MCUboot swap/rollback
# needs a two-slot AEN target, which none of the qualified boards are
# today.  See docs/secure-boot.md.
#
# The `storage:` block below is illustrative-only on E1M-AEN801: its
# `memory_map:` regions (mcuboot + he_slot0 + hp_slot0 + reserved +
# storage + atoc, metadata/e1m_modules/E1M-AEN801.yaml) already occupy
# the full 5632 KiB App MRAM window, so EVERY entry under `storage:`
# below emits `status: blocked` in the generated `dts-partitions.dtsi`
# (measured via `--emit dts-partitions`) -- there is no free MRAM left
# to place any of them, including `settings` / `app_data`.
#
# Real customer shipping variants fork this for V2N or i.MX 93
# boards; the SDK's declarative surface stays identical across
# SoMs.
libraries:
  - name: mbedtls
    cores: [m55_hp]

som:
  sku: E1M-AEN801              # security-target SoM (OPTIGA + TF-M)

preset: e1m-evk
cores:
  a32_cluster:
    os: "off"                  # AEN family is M-class only; the
                               # a32 key is the SoM topology's
                               # placeholder slot.
  m55_hp:
    app: ./src
    # IoT features (Wi-Fi + MQTT + TLS) ride the per-core `iot:` block;
    # the orchestrator resolves the SoM wireless provider, then emits
    # the CC3501E bridge backend plus MQTT/TLS Kconfig for this AEN slice.
    iot:
      wifi: true
      mqtt: true
      tls: true
    # mbedtls covers the TLS stack used by MQTT pub/sub.  OPTIGA
    # handshake offload remains a planned library-profile binding.
    # Required by v0.6 cross-field validator (P2.3 rule 3) whenever
    # `iot.tls: true`.
    # Memory tuning -- production stance keeps headroom for the
    # mender-mcu-client + mbedTLS handshake buffers + the TF-M
    # NS-callable trampoline.
    memory:
      stack_kib:     8         # CONFIG_MAIN_STACK_SIZE
      heap_kib:      64        # CONFIG_HEAP_MEM_POOL_SIZE
      isr_stack_kib: 4         # CONFIG_ISR_STACK_SIZE
    # Power -- the production stance is "wake on network or
    # explicit interrupt, otherwise standby."  Deep sleep is
    # reserved for the low-power sensor profile
    # (examples/power-timing/power-managed-sensor); on the application core
    # we stay in `standby` so the Mender poll thread can resume
    # without losing TLS session state.
    power:
      sleep_mode: standby
      wakeup_sources:
        - uart                 # console for field diagnostics
        - gpio                 # external watchdog / supervisor IRQ
        - rtc                  # periodic Mender poll wake
  m55_he:
    os: "off"                  # this skeleton runs the security
                               # workload on m55_hp; real shipping
                               # variants put TF-M's secure partition
                               # on m55_he and IPC over RPMsg.

chips:
  - optiga_trust_m
  - eeprom_24c128

# ----------------------------------------------------------------
# Bootloader (project-wide).
# ----------------------------------------------------------------
# MCUboot + ECDSA-P256.  `swap_algorithm:` is intentionally omitted:
# the SDK's per-target default now follows the target's own DT
# (#1413) rather than one value for every AEN SKU, and this SKU
# (E1M-AEN801) has no slot1/scratch partition -- see [STATUS] above.
# Setting `swap_algorithm: scratch` here would be a build-time error
# on this SKU (no slot1/scratch to swap into).  MCUboot itself takes
# its actual slot geometry from the board DT `partitions {}` node,
# not from a `boot:` field; there is no sysbuild knob for a partition
# size.  Downgrade prevention is `ota.rollback.min_version` below
# (software floor); a hardware anti-rollback counter tier
# (OPTIGA/OTP fuse) isn't built yet, so this board.yaml doesn't claim
# one.
#
# `key_file:` is the SIGNING key (it becomes
# `SB_CONFIG_BOOT_SIGNATURE_KEY_FILE`, which imgtool signs with and
# from which MCUboot extracts the public half), so it must be a
# PRIVATE PEM -- never a `.pub.pem`.  This points at the local
# development key, matching `zephyr/sysbuild/aen/sysbuild.conf`; it is
# gitignored and generated once per clone by `keys/generate_dev_key.sh`.
# Despite this example's name, a production image is re-signed in the
# manufacturing CA's HSM and never uses a build-time key from the repo
# (see keys/README.md).
boot:
  method: mcuboot
  signing:
    algorithm: ecdsa_p256
    key_file:  keys/mcuboot_dev_ecdsa_p256.pem

# ----------------------------------------------------------------
# OTA (project-wide).
# ----------------------------------------------------------------
# Mender HTTPS-poll fabric with anti-downgrade floor + automatic
# rollback on health-check failure.  The tenant token stays
# outside the repo; it's injected by the device provisioning step.
ota:
  provider:        mender
  artifact_name:   production-deployment
  signing_key:     keys/prod_ecdsa_p256.pub.pem
  server:
    url:    "https://hosted.mender.io"
    tenant: "${MENDER_TENANT_TOKEN}"
  rollback:
    enabled:     true
    retries:     3
    min_version: 1            # anti-downgrade: never accept v0.x
                              # after we've shipped v1.0
  poll_interval_s: 1800
  storage:
    # Linux-fork variants reuse the same A/B geometry; ignored on
    # the AEN-only Zephyr build (MCUboot owns slot management
    # there via `boot:`).
    device:        /dev/mmcblk0
    boot_part_mb:  32
    rootfs_ab:     true
    total_size_mb: 4096

# ----------------------------------------------------------------
# Security (PSA crypto + TF-M secure partition).
# ----------------------------------------------------------------
# TF-M-on-HE-core is the AEN production stance.  Persistent keys
# live in Internal Trusted Storage backed by the secure half of
# MRAM; Protected Storage (encrypted-at-rest) lives in the on-
# module OSPI for app-managed credentials that don't need the
# tamper-resistant tier.  Attestation root is the OPTIGA Trust M
# (single trust root with boot + OTA -- see iot-fleet-ota for the
# shared signing key story).
security:
  psa:
    persistent_slots: 32
    its_storage:      mram_main     # AEN E8: 5.5 MiB MRAM (secure half)
    ps_storage:       ospi0         # on-module OSPI for app-tier creds
    tfm:              true
    attestation_root: optiga_trust_m

# ----------------------------------------------------------------
# Storage partitions.
# ----------------------------------------------------------------
# A project-declared partition table for the Zephyr settings
# subsystem + an app_data littlefs mount.  The `mcuboot_primary` /
# `mcuboot_secondary` / `mcuboot_scratch` entries below are named to
# illustrate a two-slot MCUboot layout, but they are `storage:`
# partitions, NOT the board DT's `slot0_partition` / `slot1_partition`
# / `scratch_partition` labels MCUboot's flash-map actually reads --
# see [STATUS] above.  Sizes below sum to ~2.4 MiB (1024 + 1024 + 64 +
# 64 + 256 KiB), but on E1M-AEN801 there is no remainder to place them
# in: the SoM's own `memory_map:` regions already occupy the full 5632
# KiB App MRAM window (metadata/e1m_modules/E1M-AEN801.yaml), so every
# entry below emits `status: blocked` in the generated
# `dts-partitions.dtsi` for that reason alone.  `mram_main` would ALSO
# not be a working `flash_device:` target even with free room: no AEN
# preset declares a `dt_label:` override for it, so it resolves to a
# Devicetree label of `mram_main`, but the generated board tree never
# defines that node -- only `mram_storage` (#1484; see
# docs/board-config-features.md's "Storage partitions (`storage:`)"
# section).  This block demonstrates the `storage:`
# declarative shape only, not a working layout, on this SKU.
storage:
  - name:         mcuboot_primary
    fs:           raw
    size_kib:     1024
    flash_device: mram_main
  - name:         mcuboot_secondary
    fs:           raw
    size_kib:     1024
    flash_device: mram_main
  - name:         mcuboot_scratch
    fs:           raw
    size_kib:     64
    flash_device: mram_main
  - name:         settings
    fs:           littlefs
    size_kib:     64
    flash_device: mram_main
    mount:        /lfs/settings
  - name:         app_data
    fs:           littlefs
    size_kib:     256
    flash_device: mram_main
    mount:        /lfs/app

# ----------------------------------------------------------------
# Diagnostics (project-wide).
# ----------------------------------------------------------------
# Production log policy: security + iot at info (so the field
# console captures TLS handshake + Mender state transitions);
# everything else at warn (smaller log buffer, less flash chatter).
diagnostics:
  log_level: warn
  modules:
    alp_security:  info
    alp_iot:       info
    alp_storage:   warn
    alp_gpio:      warn
    alp_inference: warn
