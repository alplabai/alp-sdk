# SPDX-License-Identifier: Apache-2.0
#
# aen-npu-inference-alp-u55 -- real person_detect NPU inference through
# <alp/inference.h> on the E1M-AEN801 (Ensemble E8, M55-HE) Ethos-U55 (the
# M55-HE-paired U55, 128-MAC).  The U55 sibling of aen-npu-inference-alp.
# ~263 KiB Vela model -> MRAM slot0, Flow D boot.

# --- MRAM slot0 link --------------------------------------------------------
# Nothing to set: the board _defconfig sets CONFIG_USE_DT_CODE_PARTITION=y, so
# every image for this board links at the slot0 offset (0x80010000), not the
# MRAM base.

# --- alp-sdk inference backend selection ------------------------------------
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_INFERENCE_BACKEND_TFLM=y
CONFIG_ALP_SDK_INFERENCE_BACKEND_ETHOS_U_AEN=y
# U55 variant marker (not U85) -- satisfies the ethos_u_aen.cpp drift #error.
CONFIG_ALP_SDK_INFERENCE_ETHOS_U_VARIANT_U55=y

# --- TFLM + Ethos-U driver stack --------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_ETHOS_U=y
CONFIG_ETHOS_U_DCACHE=y
# THE ACCELERATOR: E8's M55-HE-paired NPU is an Ethos-U55 128-MAC.  Matches
# gen_model.py --accel ethos-u55-128 (CMakeLists.txt).
CONFIG_ETHOS_U55_128=y

# --- Heap / stack -----------------------------------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=16384

# --- DMA coherence ----------------------------------------------------------
CONFIG_DCACHE=n

# --- Console: RAM console (bench observable over SWD) ------------------------
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_LOG=n
