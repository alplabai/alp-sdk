#
# M55-HE-paired Ethos-U55 on this board is 128-MAC (see the SoC peripherals
# dtsi comment on the shared ethosu55@400e1000 node). NPU variant Kconfig is
# per-core (the HP twin sets CONFIG_ETHOS_U55_256), so it lives here rather
# than in prj.conf.
CONFIG_ETHOS_U55_128=y
