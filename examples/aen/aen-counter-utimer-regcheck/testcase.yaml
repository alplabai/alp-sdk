# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the Tier-1.5 UTIMER free-run counter path
# (counter_alif_utimer.c) on the E1M-AEN801 (Ensemble E8, M55-HE): the
# utimer0 counter free-runs through the portable Zephyr counter_* class API.
#
# Compile-checks the driver + DT node on the real E8 board target; filtered OUT
# of the native_sim PR gate (platform_allow = the AEN801 HE board only).

sample:
  name: aen-counter-utimer-regcheck
  description: |
    Bench RAM-run UTIMER (alif,utimer-counter) free-run proof for the
    E1M-AEN801 (Alif Ensemble E8, Cortex-M55-HE): binds utimer0 via the
    alp-sdk Tier-1.5 counter_alif_utimer driver and confirms the
    free-running counter advances through the portable Zephyr counter_* API.

tests:
  alp_sdk.examples.aen.counter_utimer_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - counter
      - utimer
    build_only: true   # the UTIMER advance check is a bench flash, not a CI run.
