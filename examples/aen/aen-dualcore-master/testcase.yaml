# SPDX-License-Identifier: Apache-2.0
#
# MANUAL-INVOCATION regression, not a CI gate: pr-twister.yml is the only
# twister job any alp-sdk workflow runs, and it passes -p native_sim/native/64
# only -- no workflow ever invokes twister with an AEN board platform, so
# BOTH scenarios below are always statically filtered out of every automated
# run (like every other examples/aen/*/testcase.yaml in the tree). Run them
# by hand:
#   west twister -p alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp \
#     -s alp_sdk.examples.aen.dualcore_master.hp_role
#   west twister -p alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he \
#     -s alp_sdk.examples.aen.dualcore_master.he_role_deferred_hp_peer
#
# The HE-role scenario is the only in-tree consumer of
# CONFIG_ALP_SDK_MPROC_BOOT_ALIF_SE_DEFERRED_TOC_PEER_IS_HP=y -- without it
# the deferred-TOC path (mandatory for releasing an HP peer; see
# zephyr/kconfigs/mproc-rpc-usb.kconfig and docs/aen-bench-bringup.md) is
# never build-checked at all, by hand or otherwise.
#
# NOTE: the platform id below MUST match the board .yaml `identifier` exactly
# or twister silently skips the scenario.

sample:
  name: aen-dualcore-master
  description: |
    B1 Option B dual-core master/peer release via the portable
    alp_mproc_boot_core(). Board-aware and symmetric (see main.c): the HP
    build releases an HE peer (default se_service_boot_cpu() path, bench-
    proven fine on 2026-06-17 and 2026-08-01); the HE build releases an HP
    peer, which that same plain-501 path cannot do (Alif SE Host Services
    API, v1.109.0 p.115: resetting the HP core invalidates its TCM) -- so
    the HE-role scenario below builds with the deferred-TOC path
    (PEER_IS_HP=y) that defaults ON for exactly this case.

tests:
  alp_sdk.examples.aen.dualcore_master.hp_role:
    platform_allow:
      - alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
    tags:
      - alp-sdk
      - example
      - aen
      - multicore
      - rtss-hp
    build_only: true   # release-at-runtime is a Flow-A ATOC flash, not a CI run.

  alp_sdk.examples.aen.dualcore_master.he_role_deferred_hp_peer:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    extra_configs:
      - CONFIG_ALP_SDK_MPROC_BOOT_ALIF_SE_DEFERRED_TOC_PEER_IS_HP=y
    tags:
      - alp-sdk
      - example
      - aen
      - multicore
      - rtss-he
      - mproc-deferred-toc
    build_only: true   # release-at-runtime is a Flow-A ATOC flash, not a CI run.
