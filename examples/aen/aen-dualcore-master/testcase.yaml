# SPDX-License-Identifier: Apache-2.0
#
# Filtered OUT of the native_sim pr-twister.yml gate (platform_allow = the
# AEN801 HP board only), but pr-twister-aen.yml (issue #1076) DOES build this
# scenario -- it runs twister against both real AEN801 board targets. Manual
# invocation, for reference:
#   west twister -p alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp \
#     -s alp_sdk.examples.aen.dualcore_master.hp_role
#
# HE-master -> HP-peer (the direction the plain se_service_boot_cpu() path
# cannot do) is not this file's job -- see
# examples/aen/aen-dualcore-he-master/testcase.yaml, the in-tree consumer of
# CONFIG_ALP_SDK_MPROC_BOOT_ALIF_SE_DEFERRED_TOC_PEER_IS_HP=y.
#
# NOTE: the platform id below MUST match the board .yaml `identifier` exactly
# or twister silently skips the scenario.

sample:
  name: aen-dualcore-master
  description: |
    B1 Option B dual-core master/peer release via the portable
    alp_mproc_boot_core(). The HP build releases an HE peer (default
    se_service_boot_cpu() path, bench-proven fine on 2026-06-17 and
    2026-08-01). For the reverse direction (HE releases HP, which that same
    plain-501 path cannot do), see aen-dualcore-he-master.

tests:
  alp_sdk.examples.aen.dualcore_master.hp_role:
    platform_allow:
      - alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
    tags:
      - alp-sdk
      - example
      - aen
      - multicore
      - rtss-hp
    build_only: true   # release-at-runtime is a Flow-A ATOC flash, not a CI run.
