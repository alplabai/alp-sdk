#
# Bench config for the CC3501E command sweep + throughput measurement on the
# E1M-AEN801 (Alif Ensemble E8, M55-HE). See src/main.c for what is swept.

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; set explicitly here so the app is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead -- the same toggle every sibling AEN
# bench app documents (see aen-rtc-tick-probe's prj.conf for the fuller note):
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- CC3501E bridge (SPI1 + WIFI_EN/nRESET/READY GPIOs) -----------------------
# The host-side chip driver (chips/cc3501e/*.c) plus the two peripheral
# classes it rides on: SPI for the inter-chip link (bus 1 -> the alp-spi1
# alias this app's overlay adds) and GPIO for WIFI_EN / nRESET / READY.
# Kconfig already enforces `depends on SPI && GPIO`; both are set explicitly
# here because this app has no board.yaml `peripherals:` block to generate
# them -- it is a standalone Zephyr app (see CMakeLists.txt), same as
# aen-evk-demo's phase 8 block. CONFIG_ALP_SDK_CHIP_CC3501E pulls in every
# chips/cc3501e/*.c TU (wifi/sockets/ble/gpio/spi/camera/power/ota/events),
# so this app can call the wifi/sockets/ble/spi1/gpio/camera/power host
# wrappers directly with no further Kconfig -- it never routes through the
# portable <alp/wifi.h> / <alp/ble.h> backends (CONFIG_ALP_SDK_WIFI_CC3501E /
# CONFIG_ALP_SDK_BLE_CC3501E), which attach a DIFFERENT set of TUs this app
# has no use for.
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_CC3501E=y

# No GPIO proxy (CONFIG_ALP_SDK_GPIO_CC3501E_PROXY) -- the GPIO family below
# is swept with the chip driver's own cc3501e_gpio_*() calls (a raw CC3501E
# pad index), not a proxied alp_gpio_open(ALP_E1M_GPIO_IOxx) id, so the
# proxy's route table would be dead weight here.

# CONFIG_ALP_SDK=y above defaults CONFIG_ALP_SDK_CONSOLE (zephyr/kconfigs/
# core.kconfig) to `y`, which `select`s CONFIG_SHELL -- pulling a `uart:~$`
# shell prompt into the middle of this app's own sweep transcript. This app
# never registers a shell command and never uses the `alp` console tree, so
# turn the console off explicitly rather than let its default drag the
# shell in unasked.
CONFIG_ALP_SDK_CONSOLE=n

# Headroom for main()'s + every sweep helper's own locals -- double
# aen-cc3501e-handshake-probe's 4096, because this app additionally carries
# Wi-Fi/BLE scan-record arrays, a BLE_GATT_REGISTER descriptor buffer, and
# socket send/recv locals across a much longer call chain (nine opcode
# families instead of one probe sequence). Every multi-KB buffer (the bulk
# STREAM_WRITE/SPI1_TRANSFER payload) is STATIC, not a local -- see
# src/main.c's own header for why that discipline is load-bearing here, not
# optional: an earlier app in this tree died on its own prologue for
# exactly the mistake this sizes around.
#
# THIS VALUE IS ONLY SAFE WHILE src/main.c's cc3501e_t IS static. That type
# embeds several ALP_CC3501E_MAX_PAYLOAD scratch buffers (~32 KB); declared
# automatic it asks main() for a 32908-byte frame, and the overflow check
# fires on the first `sub sp` -- before main()'s first printk, so the app
# dies with no output at all and looks like a dead board. That is not
# hypothetical: it happened on the M55-HE 2026-09-10 and cost a bench run
# (see aen-cc3501e-handshake-probe's own prj.conf). A green build will not
# catch it; the frame is legal at link time.
CONFIG_MAIN_STACK_SIZE=8192

# Logging ON, deliberately -- a desynced SPI link reports its decisive fault
# via LOG_ERR in the upstream DesignWare SPI driver, and this app is a bench
# diagnostic, not a shipping image. LOG_MODE_MINIMAL keeps it deferred-free.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# --- Memory/cache: MATCH aen-evk-demo's phase 8, not just its pin config ------
# CONFIG_DCACHE=n for the SoC-wide reason every AEN801 bench app carries it
# (scripts/bench/aen/aen-bench-shared.conf's own header: "the E8 D-cache
# maintenance loop hangs on this silicon"), AND because this app's Part 2
# throughput numbers are measured over the SAME SPI1 link aen-evk-demo's
# phase 8 and aen-cc3501e-handshake-probe exercise -- that link's own overlay
# header documents a DW-SSI master that underruns its TX FIFO deasserting its
# own chip-select mid-frame as timing-sensitive to cache-on vs cache-off on
# this silicon. Running this app's STREAM_WRITE/SPI1_TRANSFER sweep faster
# (cache-on, DTCM) than every other AEN801 bench app that has ever measured
# this link would produce a rate nobody else's run is comparable to. See the
# app overlay's own header for the matching zephyr,sram retarget this
# depends on.
CONFIG_DCACHE=n
