# SPDX-License-Identifier: Apache-2.0
#
# Bench RAM-run config for the E1M-AEN801/AEN803 (M55-HE).
#
# Same ISP library module set as examples/aen/aen-isp-ov5647-capture's
# prj.conf (bench-proven, runs 69-145) -- this app drives the same ISP
# through the portable <alp/camera.h> dispatcher instead of the raw Zephyr
# video_* API, so it needs the same pipeline stages compiled in.

CONFIG_ALP_SDK=y

# Video subsystem, same driver set aen-isp-ov5647-capture pulls in: the
# CSI-2 D-PHY, the DesignWare CSI-2 bridge, the Alif CPI capture controller,
# the OV5647 sensor driver, and the ISP-Pico driver.
CONFIG_VIDEO=y
CONFIG_VIDEO_ISP_VSI=y

# The portable ISP backend (src/backends/camera/alif_isp_pico.c) -- OPT-IN,
# default n.  Its priority (100) outranks the portable zephyr_video backend
# (50) on E8 builds, so leaving CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO at its
# own VIDEO-driven default would just add dead code to this image; turn it
# off explicitly instead.
CONFIG_ALP_SDK_CAMERA_ALIF_ISP=y
CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO=n

# ISP library modules: DMSC+SCALAR+CSM (pipeline), WB+WBM (white balance),
# AE+EXPOSUREM (auto exposure), GAMMAOUT (colour output), BLS (black-level
# subtraction) -- see aen-isp-ov5647-capture's prj.conf for the per-stage
# bench history.  BINNING/FLT stay off, same as that example.
CONFIG_ISP_LIB_SCALAR_MODULE=y
CONFIG_ISP_LIB_DMSC_MODULE=y
CONFIG_ISP_LIB_CSM_MODULE=y
CONFIG_ISP_LIB_WB_MODULE=y
CONFIG_ISP_LIB_WBM_MODULE=y
CONFIG_ISP_LIB_AE_MODULE=y
CONFIG_ISP_LIB_EXPOSUREM_MODULE=y
CONFIG_ISP_LIB_GAMMAOUT_MODULE=y
CONFIG_ISP_LIB_BLS_MODULE=y

# CCM on: run 171's colour-bar test pattern through the ISP comes out with
# all 8 bars at the correct hue and full saturation (U 20..239, V 21..240),
# so the ISP pipeline -- CCM included -- is colour-correct. With CCM off,
# room-scene saturation was mean 0.08 (run 166); with CCM on it was 0.16
# (run 163) -- CCM off is what looked black and white. The residual blue
# tint on the ceiling (runs 163/164) comes from AWB balancing a frame
# dominated by a yellow wall: CCM amplifies it but does not cause it, and a
# grey-card calibration fixes it. See changelog.d/2252.md.
CONFIG_ISP_LIB_CCM_MODULE=y

# Software CRC32 (crc32_ieee(), zephyr/subsys/crc/) for the snapshot
# checksum -- this is the subsys/crc software library, not the hardware
# CRC_DRIVER class (unneeded here; this runs once per bench boot).
CONFIG_CRC=y

# alif_isp_pico.c's isp_open() allocates FOUR struct video_buffer
# descriptors per handle -- CONFIG_ALP_SDK_CAMERA_ALIF_ISP_VBUF_COUNT (3,
# bumped from 2 by the AE-convergence fix: 2 buffers must stay queued to
# the ISP MI while the 3rd converts, see alif_isp_pico.c's file header)
# raw ISP output buffers plus one RGB565 conversion scratch buffer -- but
# drivers/video/video_common.c sizes its pool descriptor array as
# `struct video_buffer video_buf[CONFIG_VIDEO_BUFFER_POOL_NUM_MAX]`
# (default 2): the 3rd/4th video_buffer_aligned_alloc() in open() would
# return NULL (ALP_ERR_NOMEM) without this bump.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4

# The buffer pool defaults into the HE core's local DTCM (256 KB total),
# which the CPI/ISP's AXI DMA master cannot reach at all regardless of
# size -- same reachability gap aen-camera-firstlight's prj.conf documents.
# Move it into the global on-chip SRAM0 bank (4 MiB @ 0x02000000,
# AXI-visible) instead: four 640x480 RGB565-sized buffers (614,400 bytes
# each: the negotiated ISP output, YUYV, is also 2 bytes/pixel) total
# 2,457,600 bytes -- this now EXCEEDS the pool's default 2 MiB
# (2,097,152 byte) heap, so CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE below is
# no longer optional the way it was at 3 buffers.
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM0"

# 2.5 MiB (2,621,440 bytes): covers the 4 buffers' 2,457,600 bytes with
# ~163 KB of sys_heap chunk-header/alignment slack. Plus src/main.c's own
# 614,400-byte frame_copy (also placed in SRAM0), total SRAM0 use is
# ~3,235,840 bytes -- comfortably inside the 4 MiB (4,194,304 byte) bank.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2621440

# The pool is a sys_heap.  With the kernel's SRAM being the 256 KB DTCM,
# Zephyr defaults to SYS_HEAP_SMALL_ONLY, whose heaps top out at 262136
# bytes -- far short of the pool this needs.  AUTO sizes each heap's chunk
# headers to fit it, so the small kernel heaps keep their compact form.
CONFIG_SYS_HEAP_AUTO=y

# A generously-sized frame_copy (614,400 bytes, see src/main.c) plus this
# app's own frame-loop printing stays well under this, but size
# generously anyway -- aen-isp-ov5647-capture's prj.conf hit a stack
# overflow at the default with a comparable printk load.
CONFIG_MAIN_STACK_SIZE=8192

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801/AEN803 carrier console. The board _defconfig
# already selects it; we set it explicitly here so the example is
# self-describing for a standalone (non-bench-conf) build.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench (Flow C ITCM RAM-run)? Don't hand-toggle these -- layer
# scripts/bench/aen/aen-bench-shared.conf via -DEXTRA_CONF_FILE instead (see
# that file for why: UART5 does not route Flow C output on this bench).  It
# sets CONFIG_RAM_CONSOLE=y / CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384 /
# CONFIG_UART_CONSOLE=n, applied AFTER this file so its values win.
CONFIG_PRINTK=y

# Logging off: this app's own printk output is the bench observable, and
# the RAM console's 16 KiB budget (aen-bench-shared.conf) is for that, not
# unrelated driver chatter.
CONFIG_LOG=n
