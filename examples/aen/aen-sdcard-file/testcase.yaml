sample:
  name: aen-sdcard-file
  description: |
    FatFs on the E1M-EVK microSD slot from the Alif M55-HE: bring up the
    CC3501E bridge, enable the SDIO mux (E1M IO20), mount the card, write a
    file, read it back, list the root directory and report free space.

tests:
  alp_sdk.examples.aen.sdcard_file.native_sim:
    extra_args: EXTRA_CONF_FILE=generated/alp.conf
    platform_allow:
      - native_sim/native/64
    tags:
      - alp-sdk
      - example
      - aen
      - sdhc
      - fatfs
    build_only: true

  # Real-target compile: the e1m_evk_microsd shield, the SDHC bounce buffer
  # and the CC3501E bridge only build here (native_sim skips the shield).
  alp_sdk.examples.aen.sdcard_file.aen:
    extra_args: EXTRA_CONF_FILE=generated/alp.conf
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
      - alp_e1m_aen803_m55_he/ae822fa0e5597ls0/rtss_he
      - alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
      - alp_e1m_aen803_m55_hp/ae822fa0e5597ls0/rtss_hp
    tags:
      - alp-sdk
      - example
      - aen
      - sdhc
      - fatfs
    build_only: true

  # The E4 M55-HP.  generated/alp.conf is emitted for board.yaml's SoM
  # (E1M-AEN801), so the E4 capability profile and banner are set here; a
  # tan build with `sku: E1M-AEN401` and `m55_hp` in board.yaml emits them.
  alp_sdk.examples.aen.sdcard_file.aen401:
    extra_args: EXTRA_CONF_FILE=generated/alp.conf
    extra_configs:
      - CONFIG_ALP_SOC_ALIF_ENSEMBLE_E4=y
      - CONFIG_ALP_SDK_SOC_NAME="Alif Ensemble E4"
    platform_allow:
      - alp_e1m_aen401_m55_hp/ae402fa0e5597le0/rtss_hp
    tags:
      - alp-sdk
      - example
      - aen
      - sdhc
      - fatfs
    build_only: true
