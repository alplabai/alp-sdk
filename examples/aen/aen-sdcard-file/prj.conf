#
# aen-sdcard-file: FatFs on the E1M-EVK microSD slot.
#
# The SD host + the "SD" disk come from the e1m_evk_microsd shield (set in
# CMakeLists.txt); FatFs itself comes from `libraries: [fatfs]` in
# board.yaml. SPI/GPIO for the CC3501E bridge come from `peripherals:`.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=8192

# The link address comes from each board's code partition
# (CONFIG_USE_DT_CODE_PARTITION): HE slot0 0x80010000, HP slot0 per board.

# The SDIO mux enable (E1M IO20) is a CC3501E GPIO: route alp_gpio through
# the bridge (cc3501e_gpio_routes[] in src/cc3501e_gpio_routes.c).
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# exFAT: most microSDXC cards (> 32 GB) ship formatted exFAT, and exFAT
# needs long file names. Neither is on by default in Zephyr.
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN=y
# Never format a card that fails to mount -- report the error instead.
CONFIG_FS_FATFS_MOUNT_MKFS=n

# Bridge SPI: keep every phase on PIO (see aen-cc3501e-bringup/prj.conf for
# the measurements behind this threshold).
CONFIG_DMA=y
CONFIG_DMA_PL330_ALIF=y
CONFIG_DMA_ALIF_EVENT_ROUTER=y
CONFIG_SPI_DW_ALIF_USE_DMA=y
CONFIG_SPI_DW_ALIF_DMA_MIN_LEN=8192
CONFIG_SPI_DW_ALIF_PACK32=y
