# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the read-only PORTABLE surfaces the Secure
# Enclave (SE) services back -- SoC identity via <alp/hw_info.h>, RUN/
# STANDBY operating-point profiles via <alp/power.h>, TRNG via
# <alp/security.h> -- on the E1M-AEN801 (Ensemble E8, M55-HE).  Companion to
# aen-se-service-info (the vendor-specific transport regcheck); only
# non-mutating calls are made.
#
# Compile-checks the app + DT node on the real E8 board target; filtered OUT
# of the native_sim PR gate (platform_allow = the AEN801 HE board only).

sample:
  name: aen-se-service-query
  description: |
    Bench RAM-run proof of the portable, SE-backed read-only surfaces
    (<alp/hw_info.h> SoC identity, <alp/power.h> RUN/STANDBY profiles,
    <alp/security.h> TRNG) for the E1M-AEN801 (Alif Ensemble E8,
    Cortex-M55-HE).  Only non-mutating calls are made.

tests:
  alp_sdk.examples.aen.se_service_query.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - security
      - se
      - power
    build_only: true   # the read-only SE surface proof is a bench flash, not a CI run.
