# Bench run 83+, decisive test images: turns on library-level INFO logging,
# so the ISP-Pico libisp's own per-frame AwbRun/AeRun lines (log_level(),
# isp_pico.c:134-141 -- a direct pass-through to the library's
# VsiLogLevel_t, vsios_log.h) actually print. Layer AFTER
# scripts/bench/aen/aen-bench-shared.conf (later files win) so this
# overrides that file's CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384, and AFTER
# prj.conf so this overrides its CONFIG_VIDEO_LOG_LEVEL_ERR/
# CONFIG_LOG_DEFAULT_LEVEL=0.
#
# Layer on top of the example's own prj.conf + the bench conf files:
#   -DEXTRA_CONF_FILE="prj.conf;<bench conf files>;overlay-ae-diag.conf"
#
# Run 85: this file no longer overrides CONFIG_VIDEO_ISP_VSI_AE_TARGET --
# runs 81/83/84's diagnostic values (20, 50) were both BELOW the bench's
# actual black level (~16 on the library's 8-bit meanLum scale), so AE was
# correctly satisfied at the floor, not broken. Run 140 then showed the
# Kconfig's OLD default (255) saturating the frame once meanLum became a
# real measurement; its default is now 90 (see its help text,
# vendor-alif-peripherals.kconfig) -- still nothing to override here.

# Library-level INFO logging (log_level(), isp_pico.c) -- VSI_LOG_LEVEL_INFO
# = 3 = Zephyr's own LOG_LEVEL_INF, same numbering (isp_pico.c's own
# comment on log_level()).
CONFIG_VIDEO_LOG_LEVEL_INF=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bumped from the bench-shared default of 16384: library-level INFO
# logging (above) adds real per-frame volume on top of this example's own
# (now every-5th-frame, src/main.c) prints.
CONFIG_RAM_CONSOLE_BUFFER_SIZE=32768
