#
# Bench run 84, decisive test image F: forces fixed WB gains (isp_pico.c's
# isp_apply_wb(), gated on CONFIG_VIDEO_ISP_VSI_WB_MANUAL_GAIN) instead of
# letting AWB pick them -- an interim proof that the downstream colour
# pipeline (CCM/gamma/output) renders correctly once WB gains are right, run
# independently of whether AWB itself has ever converged. Layer AFTER
# prj.conf + the bench conf files + overlay-ae-diag.conf (still needed for
# this image too: the AEM/WBM measurement-window fix, isp_apply_aem_wbm(),
# still needs the AE side reachable/logged the same way images C-E did):
#
#   -DEXTRA_CONF_FILE="prj.conf;<bench conf files>;overlay-ae-diag.conf;overlay-manual-wb.conf"

CONFIG_VIDEO_ISP_VSI_WB_MANUAL_GAIN=y

# r=0x349 (841), gr=gb=0x1C5 (453), b=0x100 (256) -- range [256, 1023] per
# vsi_comm_awb.h's ISP_WB_GAIN_S ("Range [256, 1023]" on each channel).
# Values as specified for this diagnostic image; not derived from a real
# AWB calibration -- the point is to prove the pipeline renders correctly
# with SOME fixed, known-reasonable gain set, not to claim these are the
# scene's correct gains.
CONFIG_VIDEO_ISP_VSI_WB_GAIN_R=841
CONFIG_VIDEO_ISP_VSI_WB_GAIN_GR=453
CONFIG_VIDEO_ISP_VSI_WB_GAIN_GB=453
CONFIG_VIDEO_ISP_VSI_WB_GAIN_B=256
