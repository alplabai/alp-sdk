#
# issue #2287 Stage B: pool sizing for the IMX296 ROI variant (-DAEN_ISP_IMX296=ON, wired
# automatically by that CMake option -- see CMakeLists.txt). prj.conf's own default pool
# (CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE 2 MiB) fits both OV5647 640x480 YUV420 buffers
# (2 x 460,800 = 921,600 B) but not two IMX296 1280x960 buffers (2 x 1,843,200 = 3,686,400 B) --
# IMX296's 1280x960 crop is 1,843,200 B PER buffer, so N_BUFFERS=2 needs 3,686,400 B just for the buffers
# themselves; bench run 296 (before this file existed) confirmed the shortfall directly:
# video_buffer_aligned_alloc() returned NULL for the SECOND buffer under the unchanged 2 MiB pool.
# 3,751,936 = 3,686,400 + 65,536 (64 KiB slack for the sys_heap AUTO chunk-header overhead each
# allocation carries, and 64-byte alignment padding on each of the 2 allocations) -- fits
# comfortably inside SRAM0's 4 MiB with no separate frame_copy buffer competing for the same
# region (src/main.c holds the DEQUEUED buffer itself for this variant instead of copying it,
# see its own #if !defined(AEN_ISP_IMX296) comment on frame_copy).
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=3751936
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
