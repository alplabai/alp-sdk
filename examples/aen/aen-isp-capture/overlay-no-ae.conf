#
# Bench run 81, decisive test image A ("AWB without AE"): disables the ISP
# AE module entirely (+ its EXPOSUREM measurement stage), keeping
# WB/WBM/CCM/GAMMAOUT on. src/main.c falls back to setting the sensor's
# exposure/gain manually via ctrls directly (its own
# `#if !defined(CONFIG_ISP_LIB_AE_MODULE)` branch) when this is layered in.
#
# Question this answers: does AWB (isp_apply_wb(), applied the current
# once-per-ctrl-change way) ever move ISP_DGAIN_RB/G when the AE module is
# not in the picture at all -- ruling in or out run 81's "AWB gated on AE's
# isStable, which the 3A reset-every-restart regression (fixed this round)
# never let reach 1" hypothesis.
#
# Layer on top of the example's own prj.conf:
#   -DEXTRA_CONF_FILE="prj.conf;overlay-no-ae.conf"
CONFIG_ISP_LIB_AE_MODULE=n
CONFIG_ISP_LIB_EXPOSUREM_MODULE=n
