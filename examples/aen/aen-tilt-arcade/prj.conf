#
# Bench RAM-run config for aen-tilt-arcade.  The app UART is not on USB on
# this bench, so the console is the RAM console (read 'ram_console_buf' over
# SWD) -- same setup as aen-dsi-display, so the bench reads it the same way.

# alp-sdk backends: the portable display surface (src/backends/display/
# zephyr_drv.c) and the portable I2C surface (src/backends/i2c/zephyr_drv.c)
# both live under ALP_SDK; the BMI323 chip driver is separately opt-in
# (zephyr/kconfigs/chips.kconfig) and carries no default, so it must be
# turned on explicitly here too.
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_BMI323=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# --- The display chain -------------------------------------------------------
# Nothing to set here: the e1m_evk_rk055hdmipi4ma0 shield (CMakeLists.txt)
# defaults on DISPLAY, MIPI_DSI(+_DW), MIPI_DPHY(+_DW), DISPLAY_CDC200, the
# HX8394 panel driver, I2C + GPIO + GPIO_PCA_SERIES for the panel-control
# expander, and REGULATOR(+_FIXED) for the panel-enable supply.

# --- RAM console (no app UART on USB on this bench) -----------------------
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# LOG MUST stay off on the RAM-console bench: CONFIG_LOG=y reroutes printk
# into the logging subsystem (no RAM-console backend), so output never lands
# in 'ram_console_buf'.
CONFIG_LOG=n

# The game loop calls alp_display_blit() up to ~64 times/frame worst case
# (erase+draw pairs for the skiff, 4 hazards, 3 pickups and 24 stars, plus
# the occasional score-bar growth blit), each a tiny dirty-rect blit through
# the cdc200 driver's display_write(), which flushes the data cache per
# call, plus the BMI323 I2C read and a handful of printk()s -- deeper than
# the kernel's 1024 B init-thread default (CONFIG_MAIN_STACK_SIZE,
# kernel/Kconfig). All game state (entity arrays, sprite pixel buffers) is
# static, not on this stack.
CONFIG_MAIN_STACK_SIZE=4096

# CONFIG_FPU is deliberately NOT set: the game loop uses Q8 fixed-point
# steering maths (src/main.c), not float, so there is nothing in the hot
# path that needs hardware FPU access. See src/main.c's file header,
# "FIXED POINT, NOT FLOAT", for why.
