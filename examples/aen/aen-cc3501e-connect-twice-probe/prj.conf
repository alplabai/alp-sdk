#
# Bench config for the CC3501E connect-twice probe on the E1M-AEN801 (Alif
# Ensemble E8, M55-HE). See src/main.c for the hypothesis this app tests.

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; set explicitly here so the app is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead -- the same toggle every sibling AEN
# bench app documents (see aen-rtc-tick-probe's prj.conf for the fuller note):
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- CC3501E bridge (SPI1 + WIFI_EN/nRESET/READY GPIOs) -----------------------
# The host-side chip driver (chips/cc3501e/*.c) plus the two peripheral
# classes it rides on: SPI for the inter-chip link (bus 1 -> the alp-spi1
# alias this app's overlay adds) and GPIO for WIFI_EN / nRESET / READY.
# Kconfig already enforces `depends on SPI && GPIO`; both are set explicitly
# here because this app has no board.yaml `peripherals:` block to generate
# them -- it is a standalone Zephyr app (see CMakeLists.txt), same as its
# aen-cc3501e-* siblings. CONFIG_ALP_SDK_CHIP_CC3501E pulls in every
# chips/cc3501e/*.c TU (wifi/sockets/ble/gpio/spi/camera/power/ota/events),
# so this app can call cc3501e_wifi_scan()/cc3501e_wifi_connect()/
# cc3501e_wifi_status()/cc3501e_wifi_disconnect() directly with no further
# Kconfig -- it never routes through the portable <alp/wifi.h> backend
# (CONFIG_ALP_SDK_WIFI_CC3501E), which attaches a DIFFERENT set of TUs this
# app has no use for.
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_CC3501E=y

# CONFIG_ALP_SDK=y above defaults CONFIG_ALP_SDK_CONSOLE (zephyr/kconfigs/
# core.kconfig) to `y`, which `select`s CONFIG_SHELL -- pulling a `uart:~$`
# shell prompt into the middle of this app's own transcript. This app never
# registers a shell command and never uses the `alp` console tree, so turn
# the console off explicitly rather than let its default drag the shell in
# unasked.
CONFIG_ALP_SDK_CONSOLE=n

# main()'s own cc3501e_t bridge handle (~32 KB, embeds several
# ALP_CC3501E_MAX_PAYLOAD scratch buffers) is STATIC in src/main.c, not
# automatic -- see that file's own header for why that discipline is
# load-bearing here, not optional: a sibling app in this tree died on its own
# prologue for exactly the mistake this app avoids by construction. 4096
# matches every other aen-cc3501e-* sibling that calls this driver with the
# same static discipline and carries no bulk sweep buffers of its own.
CONFIG_MAIN_STACK_SIZE=4096

# Logging ON, deliberately -- a desynced SPI link reports its decisive fault
# via LOG_ERR in the upstream DesignWare SPI driver, and this app is a bench
# diagnostic, not a shipping image. LOG_MODE_MINIMAL keeps it deferred-free.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# --- Memory/cache: MATCH aen-cc3501e-command-sweep, not just its pin config --
# CONFIG_DCACHE=n for the SoC-wide reason every AEN801 bench app carries it
# (scripts/bench/aen/aen-bench-shared.conf's own header: "the E8 D-cache
# maintenance loop hangs on this silicon"), AND because this app's PING /
# WIFI_STATUS reads ride the SAME SPI1 link every other AEN801 CC3501E bench
# app measures -- see the app overlay's own header for the matching
# zephyr,sram retarget this depends on.
CONFIG_DCACHE=n
