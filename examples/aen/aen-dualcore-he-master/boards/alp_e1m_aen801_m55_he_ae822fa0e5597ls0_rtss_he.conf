#
# E1M-AEN801 / Alif Ensemble E8: the MASTER role. HE is the SES-booted core
# here (ATOC entry ["load","boot"] @0x58000000); it releases the HP peer at
# runtime over the Secure Enclave boot service.
#
# Tier-2 driver Kconfigs (incl. CONFIG_ARM_MHUV2 / CONFIG_HAS_ALIF_SE_SERVICES)
# are gated under ALP_SDK.
CONFIG_ALP_SDK=y

# SE service transport. CONFIG_ARM_MHUV2 builds the in-tree "arm,mhuv2" IPM
# driver; CONFIG_HAS_ALIF_SE_SERVICES compiles the hal_alif SE client the
# SDK's boot backend consumes -- this app itself calls only the portable
# alp_mproc_boot_core() (<alp/mproc.h>).  Both default y under the relevant
# DT_HAS_*_ENABLED (boards/<this-file-minus-.conf>.overlay okays the SE
# mailbox nodes), set explicitly so the build is self-describing.
CONFIG_ARM_MHUV2=y
CONFIG_HAS_ALIF_SE_SERVICES=y

# The load-bearing selection: this build's peer is M55-HP, not M55-HE.
# Setting only THIS symbol is deliberate -- everything else cascades from its
# Kconfig defaults (zephyr/kconfigs/mproc-rpc-usb.kconfig):
#   - CONFIG_ALP_SDK_MPROC_BOOT_ALIF_SE_DEFERRED_TOC defaults to y once the
#     peer is HP (the plain service-501 release path is vendor-documented
#     broken for an HP peer -- see README.md and
#     src/backends/mproc/alif_se_boot.c); it stays n for an HE peer, where
#     501 is bench-proven fine and flipping the default would break every
#     existing HE-peer ATOC.
#   - CONFIG_ALP_SDK_MPROC_BOOT_ALIF_SE_DEFERRED_TOC_ENTRY_ID defaults to
#     "ALP-HP" once the peer is HP -- the ATOC entry key
#     se_service_process_toc_entry() un-defers at runtime (see README.md's
#     ATOC shape: this string MUST match the flashed entry's JSON key
#     exactly, or the un-defer request silently targets nothing).
# Hardcoding either of those here instead would fight the single-source
# Kconfig default and drift if the defaults ever change.
CONFIG_ALP_SDK_MPROC_BOOT_ALIF_SE_DEFERRED_TOC_PEER_IS_HP=y
