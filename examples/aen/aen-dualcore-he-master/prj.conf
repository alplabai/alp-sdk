#
# Bench RAM-run config, shared by both the HE (master) and HP (peer) builds.
# Role-specific Kconfig (the SE boot backend, the deferred-TOC selection) lives
# in boards/<he-target>.conf -- Zephyr auto-merges a boards/<fully-qualified
# board>.conf into this file, HP gets none of it and stays a lean beacon-only
# image, same split aen-dualcore-doorbell/aen-dualcore-ipc use elsewhere.
#
# Like every other aen-dualcore-* example: both M55 cores are read through one
# SWD buffer (master-agnostic), and a single UART5 can't serve both cores, so
# this stays on the RAM console rather than the newer Alp-UART default.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# Keep the image small + deterministic for a RAM-run. LOG MUST stay off --
# CONFIG_LOG=y reroutes printk into the logging subsystem, which has no
# RAM-console backend, so the RESULT line never reaches 'ram_console_buf'.
CONFIG_LOG=n

# Non-negotiable for this app, both boards: (1) the E8 D-cache maintenance
# loop hangs on this silicon (shared bench rule -- see aen-hp-core-smoke,
# aen-gpu2d-bench); (2) the two beacons this app polls (its own + the peer's)
# live in cross-core global SRAM0, which is NOT coherent between the M55-HE
# and M55-HP D-caches -- a cached read can sit on a stale line forever while
# the other core's write already landed, i.e. an all-else-correct build
# reports RESULT SKIP against a peer that is, in fact, up and heartbeating
# (PR #1080's finding on three sibling dual-core examples that omitted
# this). A cache-on variant would need sys_cache_data_flush_range on every
# beacon write + sys_cache_data_invd_range before every cross-core beacon
# read.
CONFIG_DCACHE=n
