# SPDX-License-Identifier: Apache-2.0
#
# aen-sim-vision -- camera->inference->display + mic->wake-word Renode-sim
# pipelines on the Alif Ensemble E8 M55-HP.  HP-ONLY: its fixed SIM_* buffers
# (src/main.cpp) sit in the M55-HP's 1 MiB DTCM; the M55-HE's DTCM ends short
# of all five buffers, so an HE build bus-faults with no app output. The
# app's own CMakeLists.txt hard-fails configure with a FATAL_ERROR if BOARD
# is not alp_e1m_aen801_m55_hp -- do NOT add the HE target here, it cannot
# build for this app.
#
# Already built directly (plain `west build`, not twister) by
# pr-renode-sim-mode.yml for the HP target; this testcase.yaml additionally
# makes it twister-discoverable via the advisory pr-twister-aen.yml gate.
# Filtered OUT of the native_sim PR gate (platform_allow = the AEN801 HP
# board only, no native_sim overlay).

sample:
  name: aen-sim-vision
  description: |
    Camera->inference->display and mic->wake-word pipelines for the
    E1M-AEN801 (Alif Ensemble E8, Cortex-M55-HP), driven by the studio
    hardware simulator via `tan renode`.  Real TFLM inference on the M55
    (Helium-accelerated, software path -- no NPU dispatch).  HP-only: its
    SIM_* buffers live in HP's DTCM.

tests:
  alp_sdk.examples.aen.sim_vision.aen:
    platform_allow:
      - alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
    tags:
      - alp-sdk
      - example
      - aen
      - vision
      - renode
      - inference
    build_only: true   # the sim pipeline run is a Renode / tan-cli concern, not a twister run.
