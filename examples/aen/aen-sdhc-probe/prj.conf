# Bench RAM-run config for the E1M-AEN801 (M55-HE).

CONFIG_ALP_SDK=y

# ALP-SDK DELTA (#2051), not upstream: no SD/disk, GPIO, SPI or CC3501E
# Kconfig here any more. sdhc0 stays DISABLED on this board (the mux
# hardware defect -- see the board overlay and README.md), and this app
# no longer opens a disk, a GPIO, or the CC3501E bridge at all: the
# controller-level probes it keeps (main.c) touch only the SDHC register
# block directly (sys_read32()/sdhc_hw_reset()/sdhc_request()), which
# needs no Kconfig class beyond CONFIG_ALP_SDK + CONFIG_SDHC_DWC itself
# (pulled in automatically once sdhc0 is enabled -- never true for the
# real board target). CONFIG_SDHC (needed to reach CONFIG_SDHC_DWC at
# all) plus the disk/SDMMC-stack symbols this driver's `zephyr,sdmmc-disk`
# child node needs to build live in testcase.yaml's
# `.sdhc_build_coverage` scenario instead (`extra_configs:`), scoped to
# that build-only, never-flashed coverage build, not the real image.

# ALP-SDK DELTA (#2051), not upstream: main()'s clock-gate proof (runs on
# THIS board, with sdhc0 disabled) needs the `clockctrl` device itself --
# a SoC-level system-control block, present and "okay" independent of
# sdhc0's own status. CONFIG_SDHC_DWC would normally pull CLOCK_CONTROL in
# for us (vendor-alif-peripherals.kconfig's `select CLOCK_CONTROL if
# ...clocks`), but that select is gated on CONFIG_SDHC_DWC itself being
# selectable, which requires sdhc0 == "okay" -- never true here. Set it
# directly instead; CONFIG_CLOCK_CONTROL_ALIF then follows automatically
# (its own `default y depends on DT_HAS_ALIF_CLOCKCTRL_ENABLED`).
CONFIG_CLOCK_CONTROL=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# FIFO/descriptor data path -- keep coherent on this M55 bench.
CONFIG_DCACHE=n

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
