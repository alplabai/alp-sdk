# Bench RAM-run config for the E1M-AEN801 (M55-HE).

CONFIG_ALP_SDK=y

# BENCH-TEST (test/2051-sdhc-enable-on-reworked-mux), not the base branch's
# config: this build's board overlay enables sdhc0 for real (the reworked
# e1m-aen-evk-03 bench board only -- see the overlay and src/main.c headers,
# NOT a general re-enable of #2051/#2122). CONFIG_SDHC is what lets
# CONFIG_SDHC_DWC's own `default y depends on SDHC` actually fire once
# DT_HAS_SNPS_DWC_SDHC_ENABLED is true (vendor-alif-peripherals.kconfig).
# CONFIG_SPI/CONFIG_GPIO back the CC3501E bridge (SPI1 + WIFI_EN/nRESET/
# the GPIO proxy) sd_mux_enable() needs to drive the SDIO mux ENABLE before
# any SD pin is touched -- both set explicitly because this app has no
# board.yaml `peripherals:` block to generate them (standalone Zephyr app,
# see CMakeLists.txt).
CONFIG_SDHC=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# PROBE 3 (src/main.c): a real disk_access_init()/ioctl()/read() enumeration
# through the `sdmmc` child node the board overlay now adds under &sdhc0 --
# PROBE 1/2 stay register-level and cannot answer "does the card actually
# work", which is the maintainer's real question for this bench build.
# DISK_DRIVER_SDMMC would default to y once DT_HAS_ZEPHYR_SDMMC_DISK_ENABLED
# is true anyway; set explicitly for the same self-describing reason as
# CONFIG_SDHC above. SDMMC_STACK pulls in SD_STACK (subsys/sd), which is
# what actually walks CMD0/CMD8/ACMD41/CID/CSD during disk_access_init().
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STACK=y

# `clockctrl` (the SoC-wide clock-gate block sdhc_dwc_init() calls
# clock_control_on() against) is now also pulled in automatically by
# CONFIG_SDHC_DWC's own `select CLOCK_CONTROL if
# dt_compat_any_has_prop(...,clocks)` once sdhc0 is enabled above -- this
# line is kept anyway since it is also what the DISABLED branch's own
# clock-gate proof (main.c's #else arm, compiled on every OTHER board
# target that reuses this app) needs independent of sdhc0's status.
CONFIG_CLOCK_CONTROL=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# FIFO/descriptor data path -- keep coherent on this M55 bench.
CONFIG_DCACHE=n

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# BENCH-TEST discriminator. disk_access_init() returned -134 (-ENOTSUP) on the
# first reworked-mux run, and that code alone cannot tell a dead bus from a
# card that answered: a CMD8 that exhausts its retries returns -ETIMEDOUT
# (subsys/sd/sd_utils.h:69), which sd_common_init() swallows into the legacy
# path (subsys/sd/sd.c:107-109), and a failed sdmmc_card_init() then falls
# through to "Unknown card type" -ENOTSUP (subsys/sd/sd.c:239). The stack
# already logs the deciding line -- "SD CMD8 failed" (sd.c:62) versus "Found
# SDHC with CMD8 support" (sd.c:80) -- but CONFIG_LOG was unset, so every one
# was compiled out. Immediate mode so nothing is lost if init stalls.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_SDHC_LOG_LEVEL_DBG=y

# ADMA needs to actually move data now that a card is reachable (bench
# evidence, this branch): with this Kconfig OFF, ADMA_SA got programmed with
# the CPU-local DTCM address of sdhc_adma_desc_tbl_0 (0x20000a00) -- a system-
# bus master the SDHC controller cannot resolve -- and the FIRST data-bearing
# command after full enumeration (ACMD41/CMD2/CMD3/CMD9/CMD7/CMD55 all cc:1)
# failed: ERR_INT_STAT 0x0200, ADMA_ERR 0x01, sdmmc_read_scr: ACMD51 failed:
# -5. CONFIG_SDHC_DWC_DMA_ADDR_TRANSLATE=y makes sdhc_dwc.c route every ADMA/
# SDMA address (descriptor table base + per-descriptor data buffer) through
# hal_alif's local_to_global(), which now has what it needs: the E8 HE board
# dts (alp_e1m_aen801_m55_he_ae822fa0e5597ls0_rtss_he.dts) already sets
# `global_base` on &itcm/&dtcm (0x58000000/0x58800000, RTSS-HE's global TCM
# alias) via the alif,itcm/alif,dtcm bindings, wired for the Ethos-U/xHCI
# translate path already in this branch -- SDHC only needed this Kconfig.
CONFIG_SDHC_DWC_DMA_ADDR_TRANSLATE=y
