# Single-core TrustZone-M log-window probe. Beacon-driven; RAM console fallback.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
CONFIG_UART_CONSOLE=n
CONFIG_FAULT_DUMP=2
# We drive SAU/TGU by hand; keep Zephyr's own MPU off so it doesn't reattribute.
CONFIG_ARM_MPU=n
# E8 D-cache maintenance loop hangs on this silicon (shared bench rule); and
# the SRAM0 beacon (see src/main.c) is AP-read over SWD, so keep the D-cache
# off so a cached beacon write isn't unseen by the AXI-AP read.
CONFIG_DCACHE=n
