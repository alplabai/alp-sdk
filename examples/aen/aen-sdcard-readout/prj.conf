#
# Bench RAM-run config for the E1M-AEN801 (M55-HE).

CONFIG_ALP_SDK=y

# SD Host Controller + the vendored DWC SDHC driver (CONFIG_SDHC_DWC is default y
# once the sdhc node is enabled) + the SDMMC card stack + the disk-access API.
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STACK=y
CONFIG_GPIO=y

# --- CC3501E Wi-Fi/BLE coprocessor bridge --------------------------------
# The EVK microSD sits behind a 74LVC157 mux whose ENABLE (E1M IO20) is
# CC3501E-side, so the card is electrically disconnected until this app
# brings the inter-chip bridge up and drives the mux -- see main()'s
# comment. Host-side bridge driver (chips/cc3501e/*.c) plus the two
# peripheral classes it rides on: SPI for the inter-chip link (bus 1 ->
# the alp-spi1 alias the board overlay adds) and GPIO for WIFI_EN /
# nRESET / READY. Kconfig already enforces `depends on SPI && GPIO`; both
# are set explicitly here because this app has no board.yaml
# `peripherals:` block to generate them -- it is a standalone Zephyr app
# (see CMakeLists.txt), mirroring examples/aen/aen-evk-demo's prj.conf.
CONFIG_SPI=y
CONFIG_ALP_SDK_CHIP_CC3501E=y

# The mux ENABLE (E1M IO20) reaches CC3501E GPIO_26, so it is only
# drivable over the bridge's GPIO proxy -- without this, alp_gpio_open()
# on IO20 would silently DELEGATE to the Alif's own GPIO driver and drive
# a pad that is not connected to the mux: no error, and a card that never
# enumerates. src/cc3501e_gpio_routes.c carries the one-pad route table
# this needs.
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# FIFO/descriptor data path -- keep coherent on this M55 bench.
CONFIG_DCACHE=n

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
