#
# Bench RAM-run config for the E1M-AEN803 (M55-HE).

CONFIG_ALP_SDK=y
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E8=y

# <alp/power.h> domain API + the SoM power-domain runtime.  CONFIG_ALP_SDK_POWER
# is on by default; CONFIG_ALP_SDK_SOM_POWER follows from the generated
# alp,som-power node plus CONFIG_GPIO.  The Wi-Fi rail-off policy gate
# (CONFIG_ALP_SDK_SOM_PD_WIFI_RAIL_OFF) is deliberately NOT set: the example
# checks that RAIL_OFF is refused.
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# CC3501E over the SPI1 inter-chip bridge.
CONFIG_SPI=y
CONFIG_ALP_SDK_CHIP_CC3501E=y

# TMP112 (BRD_I2C): read straight off the devicetree I2C address.
CONFIG_I2C=y

# External NOR (OSPI0 SS1) JEDEC ID.
CONFIG_FLASH=y
CONFIG_OSPI_ALIF=y
CONFIG_FLASH_JESD216_API=y

# Ethernet MAC: only for its MDIO block (the PHY ID / link check); same wiring
# as aen-ethernet-link.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DWMAC_ALIF=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_DCACHE=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN carrier console.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_LOG=n
