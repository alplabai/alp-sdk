#
# Bench config for the BMI323 register read-back settlement on the
# E1M-AEN801/AEN803 (Alif Ensemble E8), carrier bus ALP_E1M_I2C0.

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- I2C + BMI323 chip driver --------------------------------------------
# CONFIG_ALP_SDK turns on the alp-sdk Zephyr backend (alp_i2c_open /
# alp_i2c_write_read etc, src/backends/i2c/zephyr_drv.c) that
# chips/bmi323/bmi323.c -- and this app's own raw register reads -- call
# into; CONFIG_ALP_SDK_CHIP_BMI323 compiles the driver in (each chip driver
# is opt-in, zephyr/kconfigs/chips.kconfig). Neither symbol carries a
# Kconfig default -- both must be set explicitly.
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_BMI323=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# Logging ON, deliberately -- the upstream i2c_dw driver reports the decisive
# NACK-vs-timeout distinction on this bus via LOG_ERR ("User Abort on %s",
# zephyr/drivers/i2c/i2c_dw.c); see examples/aen/aen-brd-i2c-scan/prj.conf for
# the fuller rationale. Useful evidence if the carrier bus ever stops
# answering at 0x68. LOG_MODE_MINIMAL keeps it deferred-free.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_I2C_LOG_LEVEL_DBG=y
