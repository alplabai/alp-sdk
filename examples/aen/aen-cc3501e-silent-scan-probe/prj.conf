#
# Bench config for the CC3501E silent-scan probe on the E1M-AEN801 (Alif
# Ensemble E8, M55-HE). See src/main.c for what this app does and why.

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; set explicitly here so the app is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead -- the same toggle every sibling AEN
# bench app documents (see aen-rtc-tick-probe's prj.conf for the fuller note):
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- CC3501E bridge (SPI1 + WIFI_EN/nRESET/READY GPIOs) -----------------------
# The host-side chip driver (chips/cc3501e/*.c) plus the two peripheral
# classes it rides on: SPI for the inter-chip link (bus 1 -> the alp-spi1
# alias this app's overlay adds) and GPIO for WIFI_EN / nRESET / READY.
# Kconfig already enforces `depends on SPI && GPIO`; both are set explicitly
# here because this app has no board.yaml `peripherals:` block to generate
# them -- it is a standalone Zephyr app (see CMakeLists.txt), same as
# every aen-cc3501e-* sibling. CONFIG_ALP_SDK_CHIP_CC3501E pulls in every
# chips/cc3501e/*.c TU, so this app can call cc3501e_ping()/cc3501e_request()/
# cc3501e_wifi_scan() directly with no further Kconfig -- it never routes
# through the portable <alp/wifi.h> backend (CONFIG_ALP_SDK_WIFI_CC3501E),
# which attaches a DIFFERENT set of TUs this app has no use for.
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_CC3501E=y

# CONFIG_ALP_SDK=y above defaults CONFIG_ALP_SDK_CONSOLE (zephyr/kconfigs/
# core.kconfig) to `y`, which `select`s CONFIG_SHELL -- pulling a `uart:~$`
# shell prompt into the middle of this app's own transcript, AND -- far more
# importantly for THIS app -- installing a shell thread that can poll the
# console/UART on its own schedule. This app's entire premise is a bus that
# nothing at all touches for 25 seconds; a live shell prompt is exactly the
# kind of unrequested background activity that would call the whole result
# into question, even though the shell talks to the E1M UART, not the
# CC3501E's own SPI1 bridge. Turned off explicitly rather than trusted to a
# default.
CONFIG_ALP_SDK_CONSOLE=n

# Headroom for main()'s + the scan-record decode loop's own locals. Matches
# aen-cc3501e-handshake-probe's 4096 (not aen-cc3501e-command-sweep's doubled
# 8192) -- this app carries none of that app's extra BLE_GATT_REGISTER /
# socket-send/recv buffers, just one PING + one raw WIFI_SCAN_START submit +
# one wrapped cc3501e_wifi_scan() call.
#
# THIS VALUE IS ONLY SAFE WHILE src/main.c's cc3501e_t IS static. That type
# embeds several ALP_CC3501E_MAX_PAYLOAD scratch buffers (~32 KB); declared
# automatic it asks main() for a 32908-byte frame, and the overflow check
# fires on the first `sub sp` -- before main()'s first printk, so the app
# dies with no output at all and looks like a dead board. That is not
# hypothetical: it happened on the M55-HE 2026-09-10 and cost a bench run
# (see aen-cc3501e-handshake-probe's own prj.conf).  A green build will not
# catch it; the frame is legal at link time.
CONFIG_MAIN_STACK_SIZE=4096

# Logging ON, deliberately -- a desynced SPI link reports its decisive fault
# via LOG_ERR in the upstream DesignWare SPI driver, and this app is a bench
# diagnostic, not a shipping image. LOG_MODE_MINIMAL keeps it deferred-free
# (no background log-processing thread that would itself be unrequested
# activity during the silence -- see CONFIG_ALP_SDK_CONSOLE=n above for the
# same concern about the shell).
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# --- Memory/cache: MATCH aen-cc3501e-command-sweep, not just its pin config --
# CONFIG_DCACHE=n for the SoC-wide reason every AEN801 bench app carries it
# (scripts/bench/aen/aen-bench-shared.conf's own header: "the E8 D-cache
# maintenance loop hangs on this silicon"), AND because this app's own
# SCAN_START submit and its two confirming PINGs ride the SAME SPI1 link
# aen-cc3501e-command-sweep and every other AEN801 CC3501E bench app
# measures -- that link's own overlay header documents a DW-SSI master that
# underruns its TX FIFO deasserting its own chip-select mid-frame as
# timing-sensitive to cache-on vs cache-off on this silicon. Running this
# app's transceives faster (cache-on, DTCM) than every other AEN801 bench
# app that has ever measured this link would not be a comparable probe. See
# the app overlay's own header for the matching zephyr,sram retarget this
# depends on.
CONFIG_DCACHE=n
