#
# Build-only regression for the Alif DWC_ssi SPI driver
# (zephyr/drivers/spi/spi_dw_alif.c, "alif,dwc-ssi-spi") on the E1M-AEN801
# (Ensemble E8, M55-HE): validates spi0 through the controller's internal SRL
# loopback (SPI_MODE_LOOP), no external MOSI->MISO jumper required.
#
# Compile-checks the driver + DT node on the real E8 board target; filtered OUT
# of the native_sim PR gate (platform_allow = the AEN801 HE board only).

sample:
  name: aen-spi-regcheck
  description: |
    Bench RAM-run SPI (alif,dwc-ssi-spi, spi0@48103000) loopback proof for
    the E1M-AEN801 (Alif Ensemble E8, Cortex-M55-HE): validates the data path
    through the DWC_ssi controller's internal SRL loopback bit.

tests:
  alp_sdk.examples.aen.spi_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - spi
    build_only: true   # the SPI loopback check is a bench flash, not a CI run.
