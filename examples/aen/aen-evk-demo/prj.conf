# SPDX-License-Identifier: Apache-2.0
#
# Bench config for aen-evk-demo on the E1M-AEN801 (Alif Ensemble E8, M55-HE).

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
# THIS BENCH PLACE HAS NO SE-UART AND ITS APP UART EMITS NOTHING
# under the Flow C RAM-run this app targets -- comment the four lines below
# and uncomment the RAM_CONSOLE pair to read 'ram_console_buf' over SWD
# instead, the same toggle every sibling AEN bench app documents.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- I2C + chip drivers -------------------------------------------------------
# CONFIG_ALP_SDK turns on the alp-sdk Zephyr backend (alp_i2c_open /
# alp_i2c_write_read etc, src/backends/i2c/zephyr_drv.c) every chip driver
# below calls into. Each chip driver is opt-in (zephyr/kconfigs/chips.kconfig)
# and carries no Kconfig default, so every one this app calls must be set
# explicitly:
#   CHIP_RV3028C7      -- BRD_I2C RTC                    (phase 1)
#   CHIP_TMP112        -- BRD_I2C temperature sensor      (phase 1)
#   CHIP_ICM42670      -- carrier-bus IMU                 (phase 2)
#   CHIP_BMI323        -- carrier-bus IMU                 (phase 2)
#   CHIP_BMP581        -- carrier-bus barometer            (phase 2)
#   CHIP_INA236        -- six carrier-bus rail monitors     (phase 3)
#   CHIP_TCAL9538      -- carrier-bus I/O expander          (phase 4)
#   CHIP_EEPROM_24C128 -- carrier-bus manifest EEPROM       (phase 5)
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_RV3028C7=y
CONFIG_ALP_SDK_CHIP_TMP112=y
CONFIG_ALP_SDK_CHIP_ICM42670=y
CONFIG_ALP_SDK_CHIP_BMI323=y
CONFIG_ALP_SDK_CHIP_BMP581=y
CONFIG_ALP_SDK_CHIP_INA236=y
CONFIG_ALP_SDK_CHIP_TCAL9538=y
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# --- SoM identity manifest (issue #2144) --------------------------------------
# This app has no board.yaml, so scripts/alp_orchestrate.py never emits
# CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID / CONFIG_ALP_SDK_SOM_HW_REV --
# both default to "disabled" / "" (see zephyr/kconfigs/hw-info.kconfig,
# zephyr/kconfigs/core.kconfig). Set explicitly here so
# src/backends/gpio/cc3501e_proxy.c's per-pin revision-dependent guard (phase
# 9's IO20 is revision-independent and unaffected either way; phase 11's IO8
# IS revision-dependent -- see cc3501e_gpio_routes.c) can confirm this
# module's hw_rev instead of failing closed on every open of IO8:
#
#   HW_INFO_EEPROM_I2C_BUS_ID=0 -- bus_id 0 is EVK_I2C_BUS_SENSORS /
#     ALP_E1M_I2C0 (SoC I2C2 bridge/DNP-selected onto the E1M portable I2C0
#     pads), the SAME physical bus phase 5 (phase_eeprom_identity) already
#     reads the raw manifest from via ctx->carrier_bus -- see
#     metadata/e1m_modules/E1M-AEN801.yaml's `e1m_i2c0` block. ADDR_7BIT and
#     OFFSET stay at their Kconfig defaults (0x50, 0) -- also what phase 5
#     hardcodes.
#   SOM_HW_REV -- the hw_rev src/cc3501e_gpio_routes.c's cc3501e_gpio_routes[]
#     table was hand-written for (see that file's header): the AEN family's
#     composed EEPROM hw_rev field is "<board_datecode>-<rev key>"
#     (metadata/e1m_modules/aen/hw-revisions.yaml's board_datecode comment;
#     scripts/program_eeprom.py composes it identically), so this must be
#     "2626-r2", not the bare "r2" -- alp_hw_info_assert_matches_build()
#     compares against the manifest's own field verbatim.
#
# PRECONDITION, stated plainly: this only lets IO8 route if the module
# actually carries a CRC-valid manifest reporting hw_rev "2626-r2". A
# factory-fresh or unprovisioned module still fails closed (ALP_ERR_NOSUPPORT
# on IO8) -- correctly, since there would be nothing to confirm it's r2 at
# all. Before relying on this for the silicon check (IO8 + IO20 both route on
# this bench place), confirm on the bench that phase 5 reports magic=OK
# family=OK hw_rev="2626-r2" -- see the bench recipe this issue's report
# cites.
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0
# The Kconfig default (zephyr/kconfigs/hw-info.kconfig) is 400000 (fast-mode).
# ctx.carrier_bus -- the SAME physical bus/controller as this manifest read,
# per the comment above -- is opened at 100000 Hz (see main()'s
# alp_i2c_open(carrier bus) call), and src/backends/i2c/zephyr_drv.c's
# z_open() reconfigures the shared controller's live bitrate on every
# alp_i2c_open() call (.close = NULL never restores it -- no teardown to
# restore TO). Left at the Kconfig default, phase 5/8's manifest read (via
# alp_hw_info_read() -> its own alp_i2c_open() at the default 400 kHz) would
# leave I2C2 running at 400 kHz for the rest of the app's lifetime,
# including phase 11's TAS2563 init over the same carrier_bus -- only
# 100 kHz is bench-validated on this bus. Match it explicitly.
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BITRATE_HZ=100000
CONFIG_ALP_SDK_SOM_HW_REV="2626-r2"

# --- Rotary encoder (phase 7) --------------------------------------------------
# CONFIG_QDEC_ALIF (the vendored UTIMER quadrature decoder, arms channel 12 /
# QEC0 at init -- see the overlay's utimer12/qdec node) is `default y` once
# that node is enabled, and needs only the sensor subsystem turned on here.
CONFIG_SENSOR=y

# --- PWM (RGB LED, phase 6) ---------------------------------------------------
# alp_pwm_open() dispatches to src/backends/pwm/zephyr_drv.c, which needs the
# Zephyr PWM driver class on. The pwm-leds consumer nodes the app overlay adds
# (evk_rgb_red/blue/green) bind Zephyr's upstream led_pwm driver so their
# `pwms` phandle is instantiated for PWM_DT_SPEC_GET to resolve.
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# --- CC3501E Wi-Fi/BLE coprocessor (phase 8) ----------------------------------
# The host-side bridge driver (chips/cc3501e/*.c) plus the two peripheral
# classes it rides on: SPI for the inter-chip link (bus 1 -> the alp-spi1 alias
# this app's overlay adds) and GPIO for WIFI_EN / nRESET / READY. Kconfig
# already enforces `depends on SPI && GPIO`; both are set explicitly here
# because this app has no board.yaml `peripherals:` block to generate them --
# it is a standalone Zephyr app (see CMakeLists.txt).
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y

# CONFIG_ALP_SDK_GPIO_CC3501E_PROXY IS ENABLED, AND IT IS PHASE 9 THAT NEEDS IT.
# This block used to say the proxy was deliberately off because "phase 8 makes
# no proxied-GPIO call and the proxy needs a route table this app does not
# carry". The first half is still true -- phase 8 drives WIFI_EN / nRESET,
# which are Alif pads, not proxied ones. The second half stopped being true
# when phase 9 landed: the SD card's 74LVC157 mux ENABLE is E1M IO20, which
# reaches CC3501E GPIO_26 and is therefore only drivable over the bridge, so
# this app now carries src/cc3501e_gpio_routes.c. With the proxy off, an
# alp_gpio_open(ALP_E1M_GPIO_IO20) would silently DELEGATE to the Alif's own
# GPIO driver and drive a pad that is not connected to the mux -- no error,
# and a card that never enumerates.
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# NOT enabled, deliberately:
#   CONFIG_SPI_DW_ALIF_USE_DMA -- see the overlay's phase-8 block: every frame
#     this phase sends is far below the DMA threshold.
#
# ENABLED WITHOUT A LINE HERE, and worth knowing about: setting
# ALP_SDK_CHIP_CC3501E above also turns ON CONFIG_ALP_SDK_WIFI_CC3501E and
# CONFIG_ALP_SDK_BLE_CC3501E -- both are `default y if ALP_SDK_CHIP_CC3501E`
# (zephyr/kconfigs/iot-audio-inference.kconfig,
# zephyr/kconfigs/ble-security.kconfig), so they are in this image and
# cc3501e_bridge.c's alp_wifi_cc3501e_attach() / alp_ble_cc3501e_attach()
# calls really do run. They register the coprocessor as the portable
# <alp/iot.h> / <alp/ble.h> backend, which phase 8 itself does not use (it
# calls the chip driver directly -- this IS the SoM's own coprocessor
# bring-up, not portable application code). Left at their default rather than
# forced off: that default is what every other AEN application ships, and
# diverging from it here would make this example teach the wrong shape.

# The CC3501E reset sequence sleeps out a ~900 ms boot budget and the driver
# keeps its scratch buffers inside the (static) cc3501e_t rather than on the
# stack, so this is headroom for the phase's own locals, not a tuned minimum.
# It is NOT the 32768 aen-cc3501e-bringup sets: that app puts its cc3501e_t --
# ~32 KB -- on main()'s stack and would blow PSPLIM without it. Phase 8's
# handle is static for exactly that reason, so the stack stays small.
CONFIG_MAIN_STACK_SIZE=4096

# --- SD card (phase 9) --------------------------------------------------------
# ALP-SDK DELTA (#2051), not upstream: no Kconfig here any more. sdhc0 stays
# DISABLED on this board (the maintainer's decision to keep SD off entirely
# on the E1M-EVK 2626-R2 -- see the overlay and phase_sdcard()'s SAFETY
# comment in src/main.c), so CONFIG_SDHC_DWC (`depends on
# DT_HAS_SNPS_DWC_SDHC_ENABLED`) never builds regardless of what is set
# here, and the phase never reaches disk_access_init()/fs_mount(). Removing
# CONFIG_FILE_SYSTEM/CONFIG_FAT_FILESYSTEM_ELM also drops this app's
# dependency on the `fatfs` west module entirely.

# --- Ethernet (phase 10) ------------------------------------------------------
# CONFIG_ETH_DWMAC_ALIF selects the upstream eth_dwmac core and builds the
# alp-sdk Tier-1.5 `alif,ethernet` glue against the ethernet@48100000 node this
# app's overlay enables. IPv4 only -- the phase's proof is a DHCPv4 lease and
# IPv6 would only cost image for nothing here.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DWMAC_ALIF=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y

# AUTO_INIT OFF ON PURPOSE. Zephyr's net-config would try to bring the
# interface up and start DHCP during boot -- i.e. before phase 10 runs, with
# nothing on the wire yet on a bench where the cable may not be plugged in, and
# with its result landing nowhere the phase framework can see. Phase 10 drives
# net_if_up() and net_dhcpv4_start() itself so the verdict is its own.
CONFIG_NET_CONFIG_AUTO_INIT=n

# The end-to-end link proof: a real DHCPv4 lease. NET_MGMT + its event layer are
# what the DHCP client is built on.
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# PINNED, NOT LEFT AT THE DEFAULT. Per RFC 2131 4.4.1 the client waits a random
# interval before its first DISCOVER, and Zephyr's default cap is 10 s -- which
# would spend most of the phase's ~15 s DHCP window doing nothing and turn a
# perfectly good bench segment into a spurious "no DHCP server" SKIPPED. 2 is
# the Kconfig minimum (range 2..10), leaving the bulk of the window for the
# actual DISCOVER/OFFER/REQUEST/ACK exchange. Spec-conformant either way; this
# only narrows the jitter.
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2

# DHCP needs sys_rand_get() for its transaction IDs and no HW RNG is wired on
# this target, so take the timer PRNG. TEST_RANDOM_GENERATOR is the Kconfig
# choice that enables the non-cryptographic entropy source; that is fine for a
# DHCP xid on a bench link test and would NOT be for anything security-bearing.
CONFIG_TEST_RANDOM_GENERATOR=y

# Packet/buffer pool. These net_bufs are what the GMAC DMA writes into,
# which now shares phase 13's 64 KiB SRAM0 linker window (see the overlay's
# SYSTEM-RAM PLACEMENT block) rather than the whole-RAM move
# aen-ethernet-link's first cut used.
#
# CONFIG_NET_BUF_RX_COUNT/TX_COUNT are trimmed to 6 here, NOT 16 like
# aen-ethernet-link: with CONFIG_NET_BUF_DATA_SIZE=1536 (below this app
# also gets ETH_DWMAC_ALIF's default -- see
# zephyr/kconfigs/vendor-alif-peripherals.kconfig), 16+16 buffers of 1536 B
# each (49152 B) plus phase 13's JPEG buffers (14336 B) plus the descriptor
# rings (512 B) plus the fixed net_buf/net_pkt-slab bookkeeping overflowed
# the 64 KiB SRAM0 window by 320 B (measured: `region 'SRAM0' overflowed by
# 320 bytes`, a hard link error, not a silent failure). Phase 10's proof is
# a DHCPv4 lease, not sustained payload throughput -- aen-ethernet-link
# (silicon-verified with a 1536 B fragment size and 16+16 buffers on
# E1M-AEN803, bench run 202) is the app that stresses that path -- so 6+6
# buffers is ample for a handful of DHCP exchange packets and fits this
# app's window with margin.
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=6

# Per-interface RX byte counters. The phase prints them because they are how a
# reader tells a segment that is merely quiet apart from an RX path that is
# dead -- rx_bytes stuck at 0 with the wire link up is the exact signature of
# the DMA-buffers-in-DTCM bug the overlay's placement block exists to prevent.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y

# --- TAS2563 amps (phase 11) ---------------------------------------------------
# TAS2563 x2 over I2C is always exercised. I2S3 (over the 74LVC157 mux) and
# the HP PDM (2 of the EVK's 4 MP34DT05 mics) via <alp/audio.h> are compiled
# in but only OPENED when AEN_EVKDEMO_SOUND_PLAYBACK is set to 1 in
# src/main.c -- off by default on this board revision; see phase 11's row in
# README.md for why. CONFIG_ALP_SDK_AUDIO_IN is `default y if AUDIO_DMIC` and
# CONFIG_ALP_SDK_AUDIO_OUT is `default y if I2S`
# (zephyr/kconfigs/iot-audio-inference.kconfig) -- both come on for free from
# the two lines below, no separate line needed.
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_ALP_SDK_CHIP_TAS2563=y

# The I2S TX slab (alp_i2s_open(), src/backends/i2s/zephyr_drv.c) is
# k_malloc'd -- a 2-block ping-pong slab at 256 stereo S16 frames/block is
# 2048 B total (256 frames x 2 channels x 2 bytes x 2 blocks). The
# PDM/audio_in slab is a static BSS array (CONFIG_ALP_SDK_AUDIO_BLOCK_BYTES *
# _IN_SLAB_BLOCKS, no heap), so this only has to cover the I2S side plus
# headroom. This k_malloc only happens with AEN_EVKDEMO_SOUND_PLAYBACK=1 --
# with it at the default 0, alp_i2s_open() is never called and this pool
# stays unused by phase 11.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Phase 11's r1/r2 hw_rev gate (hw_rev_verdict.h, issue #2138) calls the SDK's
# own alp_hw_info_read() rather than a second hand-rolled EEPROM read, so it
# gets magic/schema_version/CRC32 validation for free. That surface is a
# no-op (returns ALP_ERR_NOSUPPORT, refuses everything) unless its EEPROM bus
# is configured -- CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID defaults to -1
# (disabled). 0 is EVK_I2C_BUS_SENSORS / ALP_E1M_I2C0, the SAME portable bus
# id phase 5's ctx->carrier_bus already opens to read this identical EEPROM
# manifest at 0x50 (CONFIG_ALP_SDK_HW_INFO_EEPROM_ADDR_7BIT's default) --
# confirmed against metadata/e1m_modules/E1M-AEN801.yaml's `e1m_i2c0:` block.
# Bitrate pinned to 100 kHz, matching ctx->carrier_bus's own alp_i2c_open()
# call in main(), rather than left at this Kconfig's 400 kHz default: both
# opens reconfigure the SAME physical Alif I2C2 controller on open()
# (src/backends/i2c/zephyr_drv.c z_open() calls i2c_configure() every time,
# globally, not per-handle), so leaving them mismatched would silently
# reclock every OTHER phase's carrier-bus traffic to whichever bitrate ran
# most recently.
#
# NOT SCOPED TO PHASE 11 -- setting this bus id turns the EEPROM path on
# for the WHOLE image, not just hwrev_verdict.h's read, because it is a
# single global Kconfig with no phase-level switch of its own:
#   - the boot banner (CONFIG_ALP_SDK_BANNER, on by default) reads this
#     SAME EEPROM at boot from a SYS_INIT hook (alp_sdk_banner(),
#     src/zephyr/alp_banner.c) to print the live SKU/hw_rev, and calls
#     alp_check_hw_rev_match() against CONFIG_ALP_SDK_SOM_HW_REV;
#   - alp_gpio_cc3501e_attach() (src/backends/gpio/cc3501e_proxy.c,
#     called from phase 8's cc3501e_bridge_bringup()) ALSO reads it and
#     sets g_hw_rev_mismatch for the CC3501E GPIO proxy's own hw_rev
#     guard (issue #1859).
# Both are safe here, but not by accident. CONFIG_ALP_SDK_SOM_HW_REV is set
# to "2626-r2" above, which is what lets src/backends/gpio/cc3501e_proxy.c
# confirm this module -- and that is only safe because issue #2144 replaced
# the proxy's old all-or-nothing, fail-OPEN hw_rev guard with a PER-PIN,
# fail-CLOSED one: a mismatch now refuses exactly the revision-dependent
# pads listed in src/backends/gpio/cc3501e_rev_dependent_pins.c (IO8 here)
# and leaves phase 9's IO20 SD mux ENABLE -- revision-independent, safe on
# both revisions -- working.
# Under the OLD guard this symbol had to stay at its default "" (unset),
# because alp_hw_info_build_hw_rev_mismatch() returns false unconditionally
# for an empty built_hw_rev (src/zephyr/hw_info_zephyr.c), and a real
# mismatch would otherwise have made alp_gpio_cc3501e_attach() refuse EVERY
# proxied pad, IO20 included, with CONFIG_ALP_SDK_HW_REV_MISMATCH_FATAL
# halting boot outright. That is why this app left it unset until #2144
# landed -- the constraint is gone, not forgotten.
# Phase 11's own guard (hw_rev_verdict.h, issue #2138) still runs for IO8 as
# well: the app-level and proxy-level checks are independent layers, and
# neither replaces the other.
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BITRATE_HZ=100000

# --- JPEG encode (phase 13) ---------------------------------------------------
# WITHOUT THE SoC SELECT BELOW THIS PHASE PROVES NOTHING. The backend
# selector (src/backend.c) matches on ALP_SOC_REF_STR: unset, the build
# resolves CONFIG_ALP_SOC_NONE=1 ("unknown"), alif_hantro
# (silicon_ref="alif:ensemble:e8", priority 100) is filtered out, and the
# portable software fallback (src/backends/jpeg/sw_baseline.c, "*", priority
# 50) silently wins -- the app still encodes a valid JPEG and the silicon is
# never touched. That is the exact defect a real AEN801 bench run caught on
# aen-jpeg-regcheck; see that app's file header.
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E8=y

# The ported Hantro VC9000E driver TU (zephyr/drivers/video/
# jpeg_hantro_vc9000e.c) against the jpeg0 node this app's overlay enables,
# plus the hal_alif libjpeg_hantro_sw_gcc.a helper lib it links for the
# quantization-table / header pieces. Unlike aen-jpeg-regcheck these live in
# prj.conf rather than a board-scoped .conf: this app only ever builds for
# the AEN801 board (testcase.yaml platform_allow), so there is no native_sim
# scenario that would see CONFIG_USE_ALIF_JPEG_SW_LIB as an undefined symbol.
CONFIG_VIDEO=y
CONFIG_VIDEO_JPEG_HANTRO_VC9000E=y
CONFIG_USE_ALIF_JPEG_SW_LIB=y
CONFIG_ALP_SDK_JPEG_ALIF_HANTRO=y

# CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO is `default y if VIDEO`, and turning
# VIDEO on above would drag in the portable camera backend this app neither
# needs nor exercises -- no camera is attached to this bench.
CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO=n

# E8 D-cache maintenance loop hangs on this silicon; keep it off (shared bench
# rule -- scripts/bench/aen/aen-bench-shared.conf carries the same line, as do
# seven sibling bench apps).  Note what this is NOT: it is not a JPEG coherency
# workaround.  The ported driver DOES issue its own maintenance around the
# encode -- sys_cache_data_flush_and_invd_range() on the source and on the
# output buffer, sys_cache_data_invd_range() after -- and its own comment says
# that "matters for real DCACHE-on callers"
# (zephyr/drivers/video/jpeg_hantro_vc9000e.c:450, :488, :601).  So the Hantro
# AXI master would be coherent with the M55 either way; the constraint is
# silicon-wide, not this block's.  The cost of getting that backwards is real:
# a reader who checks the driver, finds the coherency claim false and "narrows"
# this back to CONFIG_DCACHE=y lands on the configuration that hangs.
# One consequence worth naming: with the D-cache off, those three maintenance
# calls are no-ops, so this app never exercises the DCACHE=y coherency path.
#
# SINCE PHASE 10 THIS LINE IS ALSO LOAD-BEARING FOR ETHERNET -- but it is no
# longer solely this comment's job to protect it. The GMAC descriptor rings
# and the net_buf pool it DMAs into must be coherent with the CPU, and
# eth_dwmac_alif's BUILD_ASSERT now enforces that UNCONDITIONALLY:
#
#   BUILD_ASSERT(!IS_ENABLED(CONFIG_DCACHE))
#
# zephyr/kconfigs/vendor-alif-peripherals.kconfig no longer `select
# NOCACHE_MEMORY` from ETH_DWMAC_ALIF (that section landed in the M55 DTCM,
# which the GMAC DMA cannot see, so it bought nothing real) and the driver no
# longer has a __nocache descriptor-ring arm to fall back on -- coherency now
# comes ONLY from the cache being off, everywhere, with no escape hatch. So
# setting CONFIG_DCACHE=y here now fails the BUILD at compile time with the
# driver's own BUILD_ASSERT message, rather than compiling clean and hanging
# on the bench (the old failure mode this comment used to warn about). This
# line is still the right place to keep the rule documented and explicit, but
# it is a belt to the driver's braces now, not the only thing standing
# between this app and a silicon hang.
CONFIG_DCACHE=n

# Logging ON, deliberately -- several phases (I2C reads, the PWM driver) report
# their decisive fault via LOG_ERR, and this app is a bench diagnostic, not a
# shipping image. LOG_MODE_MINIMAL keeps it deferred-free.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
