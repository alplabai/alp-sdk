# SPDX-License-Identifier: Apache-2.0
#
# Bench config for aen-evk-demo on the E1M-AEN801 (Alif Ensemble E8, M55-HE).

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
# THIS BENCH (e1m-aen-evk-03) HAS NO SE-UART AND ITS APP UART EMITS NOTHING
# under the Flow C RAM-run this app targets -- comment the four lines below
# and uncomment the RAM_CONSOLE pair to read 'ram_console_buf' over SWD
# instead, the same toggle every sibling AEN bench app documents.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- I2C + chip drivers -------------------------------------------------------
# CONFIG_ALP_SDK turns on the alp-sdk Zephyr backend (alp_i2c_open /
# alp_i2c_write_read etc, src/backends/i2c/zephyr_drv.c) every chip driver
# below calls into. Each chip driver is opt-in (zephyr/kconfigs/chips.kconfig)
# and carries no Kconfig default, so every one this app calls must be set
# explicitly:
#   CHIP_RV3028C7      -- BRD_I2C RTC                    (phase 1)
#   CHIP_TMP112        -- BRD_I2C temperature sensor      (phase 1)
#   CHIP_ICM42670      -- carrier-bus IMU                 (phase 2)
#   CHIP_BMI323        -- carrier-bus IMU                 (phase 2)
#   CHIP_BMP581        -- carrier-bus barometer            (phase 2)
#   CHIP_INA236        -- six carrier-bus rail monitors     (phase 3)
#   CHIP_TCAL9538      -- carrier-bus I/O expander          (phase 4)
#   CHIP_EEPROM_24C128 -- carrier-bus manifest EEPROM       (phase 5)
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_RV3028C7=y
CONFIG_ALP_SDK_CHIP_TMP112=y
CONFIG_ALP_SDK_CHIP_ICM42670=y
CONFIG_ALP_SDK_CHIP_BMI323=y
CONFIG_ALP_SDK_CHIP_BMP581=y
CONFIG_ALP_SDK_CHIP_INA236=y
CONFIG_ALP_SDK_CHIP_TCAL9538=y
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# --- PWM (RGB LED, phase 6) ---------------------------------------------------
# alp_pwm_open() dispatches to src/backends/pwm/zephyr_drv.c, which needs the
# Zephyr PWM driver class on. The pwm-leds consumer nodes the app overlay adds
# (evk_rgb_red/blue/green) bind Zephyr's upstream led_pwm driver so their
# `pwms` phandle is instantiated for PWM_DT_SPEC_GET to resolve.
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# --- CC3501E Wi-Fi/BLE coprocessor (phase 8) ----------------------------------
# The host-side bridge driver (chips/cc3501e/*.c) plus the two peripheral
# classes it rides on: SPI for the inter-chip link (bus 1 -> the alp-spi1 alias
# this app's overlay adds) and GPIO for WIFI_EN / nRESET / READY. Kconfig
# already enforces `depends on SPI && GPIO`; both are set explicitly here
# because this app has no board.yaml `peripherals:` block to generate them --
# it is a standalone Zephyr app (see CMakeLists.txt).
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y

# NOT enabled, deliberately, and each omission is load-bearing:
#   CONFIG_ALP_SDK_GPIO_CC3501E_PROXY -- routes proxied E1M IOs over the
#     bridge. Phase 8 makes no proxied-GPIO call, and the proxy needs a
#     board-specific cc3501e_gpio_routes[] table this app does not carry.
#   CONFIG_SPI_DW_ALIF_USE_DMA -- see the overlay's phase-8 block: every frame
#     this phase sends is far below the DMA threshold.
#
# ENABLED WITHOUT A LINE HERE, and worth knowing about: setting
# ALP_SDK_CHIP_CC3501E above also turns ON CONFIG_ALP_SDK_WIFI_CC3501E and
# CONFIG_ALP_SDK_BLE_CC3501E -- both are `default y if ALP_SDK_CHIP_CC3501E`
# (zephyr/kconfigs/iot-audio-inference.kconfig,
# zephyr/kconfigs/ble-security.kconfig), so they are in this image and
# cc3501e_bridge.c's alp_wifi_cc3501e_attach() / alp_ble_cc3501e_attach()
# calls really do run. They register the coprocessor as the portable
# <alp/iot.h> / <alp/ble.h> backend, which phase 8 itself does not use (it
# calls the chip driver directly -- this IS the SoM's own coprocessor
# bring-up, not portable application code). Left at their default rather than
# forced off: that default is what every other AEN application ships, and
# diverging from it here would make this example teach the wrong shape.

# The CC3501E reset sequence sleeps out a ~900 ms boot budget and the driver
# keeps its scratch buffers inside the (static) cc3501e_t rather than on the
# stack, so this is headroom for the phase's own locals, not a tuned minimum.
# It is NOT the 32768 aen-cc3501e-bringup sets: that app puts its cc3501e_t --
# ~32 KB -- on main()'s stack and would blow PSPLIM without it. Phase 8's
# handle is static for exactly that reason, so the stack stays small.
CONFIG_MAIN_STACK_SIZE=4096

# --- Ethernet (phase 10) ------------------------------------------------------
# CONFIG_ETH_DWMAC_ALIF selects the upstream eth_dwmac core and builds the
# alp-sdk Tier-1.5 `alif,ethernet` glue against the ethernet@48100000 node this
# app's overlay enables. IPv4 only -- the phase's proof is a DHCPv4 lease and
# IPv6 would only cost image for nothing here.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DWMAC_ALIF=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y

# AUTO_INIT OFF ON PURPOSE. Zephyr's net-config would try to bring the
# interface up and start DHCP during boot -- i.e. before phase 10 runs, with
# nothing on the wire yet on a bench where the cable may not be plugged in, and
# with its result landing nowhere the phase framework can see. Phase 10 drives
# net_if_up() and net_dhcpv4_start() itself so the verdict is its own.
CONFIG_NET_CONFIG_AUTO_INIT=n

# The end-to-end link proof: a real DHCPv4 lease. NET_MGMT + its event layer are
# what the DHCP client is built on.
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# DHCP needs sys_rand_get() for its transaction IDs and no HW RNG is wired on
# this target, so take the timer PRNG. TEST_RANDOM_GENERATOR is the Kconfig
# choice that enables the non-cryptographic entropy source; that is fine for a
# DHCP xid on a bench link test and would NOT be for anything security-bearing.
CONFIG_TEST_RANDOM_GENERATOR=y

# Packet/buffer pool sized to match the bench-verified aen-ethernet-link. These
# net_bufs are what the GMAC DMA writes into, which is the other half of the
# system-RAM relocation documented at the top of the app overlay.
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# Per-interface RX byte counters. The phase prints them because they are how a
# reader tells a segment that is merely quiet apart from an RX path that is
# dead -- rx_bytes stuck at 0 with the wire link up is the exact signature of
# the DMA-buffers-in-DTCM bug the overlay's placement block exists to prevent.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y

# --- JPEG encode (phase 13) ---------------------------------------------------
# WITHOUT THE SoC SELECT BELOW THIS PHASE PROVES NOTHING. The backend
# selector (src/backend.c) matches on ALP_SOC_REF_STR: unset, the build
# resolves CONFIG_ALP_SOC_NONE=1 ("unknown"), alif_hantro
# (silicon_ref="alif:ensemble:e8", priority 100) is filtered out, and the
# portable software fallback (src/backends/jpeg/sw_baseline.c, "*", priority
# 50) silently wins -- the app still encodes a valid JPEG and the silicon is
# never touched. That is the exact defect a real AEN801 bench run caught on
# aen-jpeg-regcheck; see that app's file header.
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E8=y

# The ported Hantro VC9000E driver TU (zephyr/drivers/video/
# jpeg_hantro_vc9000e.c) against the jpeg0 node this app's overlay enables,
# plus the hal_alif libjpeg_hantro_sw_gcc.a helper lib it links for the
# quantization-table / header pieces. Unlike aen-jpeg-regcheck these live in
# prj.conf rather than a board-scoped .conf: this app only ever builds for
# the AEN801 board (testcase.yaml platform_allow), so there is no native_sim
# scenario that would see CONFIG_USE_ALIF_JPEG_SW_LIB as an undefined symbol.
CONFIG_VIDEO=y
CONFIG_VIDEO_JPEG_HANTRO_VC9000E=y
CONFIG_USE_ALIF_JPEG_SW_LIB=y
CONFIG_ALP_SDK_JPEG_ALIF_HANTRO=y

# CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO is `default y if VIDEO`, and turning
# VIDEO on above would drag in the portable camera backend this app neither
# needs nor exercises -- no camera is attached to this bench.
CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO=n

# E8 D-cache maintenance loop hangs on this silicon; keep it off (shared bench
# rule -- scripts/bench/aen/aen-bench-shared.conf carries the same line, as do
# seven sibling bench apps).  Note what this is NOT: it is not a JPEG coherency
# workaround.  The ported driver DOES issue its own maintenance around the
# encode -- sys_cache_data_flush_and_invd_range() on the source and on the
# output buffer, sys_cache_data_invd_range() after -- and its own comment says
# that "matters for real DCACHE-on callers"
# (zephyr/drivers/video/jpeg_hantro_vc9000e.c:450, :488, :601).  So the Hantro
# AXI master would be coherent with the M55 either way; the constraint is
# silicon-wide, not this block's.  The cost of getting that backwards is real:
# a reader who checks the driver, finds the coherency claim false and "narrows"
# this back to CONFIG_DCACHE=y lands on the configuration that hangs.
# One consequence worth naming: with the D-cache off, those three maintenance
# calls are no-ops, so this app never exercises the DCACHE=y coherency path.
#
# SINCE PHASE 10 THIS LINE IS ALSO LOAD-BEARING FOR ETHERNET, and that half is
# enforced at build time rather than left to a comment: eth_dwmac_alif's
# BUILD_ASSERT rejects the combination (data cache on, no nocache region,
# cache-incoherent DMA) outright, because the GMAC descriptor rings and the
# net_buf pool it DMAs into must be coherent with the CPU. Turning the cache
# back on therefore needs CONFIG_NOCACHE_MEMORY -- which would cover the rings
# but NOT the net_buf pool or phase 13's SRAM0 buffers, so it is not the
# one-line swap it looks like.
CONFIG_DCACHE=n

# Logging ON, deliberately -- several phases (I2C reads, the PWM driver) report
# their decisive fault via LOG_ERR, and this app is a bench diagnostic, not a
# shipping image. LOG_MODE_MINIMAL keeps it deferred-free.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
