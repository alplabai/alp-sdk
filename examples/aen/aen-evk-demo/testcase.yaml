# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the aen-evk-demo phased bench app on the
# E1M-AEN801 (Ensemble E8, M55-HE): compiles the RTC/temperature, sensor,
# power-rail, I/O-expander, EEPROM, RGB-LED, CC3501E Wi-Fi/BLE, SD-card,
# Ethernet and JPEG-encode phases -- plus the four not-yet-implemented
# phases' SKIPPED stubs -- against the real board target.
#
# WHAT THIS CASE WILL BE WORTH FOR PHASE 9, once it can actually run --
# west.yml:269 adds the `fatfs` module, but a west workspace's manifest
# repo is whatever its own `.west/config` points at, and an already-
# bootstrapped workspace keeps pointing at the checkout it was set up
# against until that checkout picks up this entry and `west update` pulls
# modules/fs/fatfs down. On a workspace still pointed at a checkout without
# this entry, this case is not yet green -- it dies on a missing <ff.h>
# today, same failure the gap was originally found by. Once the manifest
# entry reaches the checkout in use, a green build here will prove two
# things a CI-less card cannot: first, that the `fatfs` west module
# actually RESOLVES (CONFIG_FAT_FILESYSTEM_ELM `depends on
# ZEPHYR_FATFS_MODULE`, so a workspace missing the module drops it and
# CONFIG_FILE_SYSTEM from the solve SILENTLY); second, that the image still
# fits ITCM with an SDHC driver and a FAT filesystem in it -- phase 14 is
# stubbed precisely because that budget is finite, and a link that
# overflows FLASH should fail here, not on the bench.
#
# Filtered OUT of the native_sim PR gate (platform_allow = the AEN801 +
# AEN803 HE boards): every phase needs real I2C/PWM/GMAC silicon to produce a
# meaningful verdict, so this is a build-only compile check, not a
# behavioural CI run -- the actual PASS/SKIPPED/FAIL verdicts only mean
# something on an AEN EVK bench unit, and phase 10's need a switch on the far end
# of a cable as well.
#
# WHAT THE COMPILE ALONE IS WORTH FOR PHASE 10, since it can never run here:
# exactly one invariant, and it is a real one. The Ethernet phase forced
# system RAM out of the M55 DTCM into a carved window of the global SRAM0
# bank, disjoint from the SRAM0 linker region phase 13's JPEG buffers live
# in -- and the overlay deliberately shrinks &sram0 to that window, so an
# oversized SRAM0-tagged buffer added later fails HERE with
# "region `SRAM0' overflowed" instead of silently aliasing system RAM on the
# bench. Verified by adding one.
#
# WHAT IT IS NOT WORTH, so nobody reads more into a green run than is there:
# it does NOT itself prove the GMAC's DMA memory is cache-coherent on real
# silicon -- that needs a bench run (aen-ethernet-link's bench run 202 proved
# the mechanism end-to-end: DHCP lease + ping, rings/pools in SRAM0, main RAM
# on DTCM -- but not this app's own SRAM0-window-sharing layout, which is
# build-verified only). What compiling here DOES now catch: eth_dwmac_alif's
# BUILD_ASSERT is UNCONDITIONAL (`!IS_ENABLED(CONFIG_DCACHE)`) --
# zephyr/kconfigs/vendor-alif-peripherals.kconfig no longer selects
# CONFIG_NOCACHE_MEMORY from ETH_DWMAC_ALIF, so there is no more OR-escape
# hatch. A CONFIG_DCACHE=y build of this scenario now FAILS at compile time
# with that assert's message, rather than passing clean. The CONFIG_DCACHE=n
# line in prj.conf is a rule backed by a real build-time check now, not just
# a comment.

sample:
  name: aen-evk-demo
  description: |
    Phased full-board demo for the E1M-AEN801/803 (Alif Ensemble E8, M55-HE) on
    the E1M EVK carrier. Runs fourteen named phases in a fixed order, each
    reporting PASS, SKIPPED, or FAIL -- never counting an absent part or an
    unimplemented phase as PASS -- and finishes with a summary table plus a
    single RESULT line. This slice implements the framework plus the ten
    phases whose drivers are bench-proven: RTC + temperature (BRD_I2C),
    sensors (BMI323/ICM-42670/BMP581), power rails (six INA236), the
    TCAL9538 I/O expander, the 24C128 EEPROM identity (read-only), the
    RGB LED (PWM0/1/3, register-readback verified), the CC3501E Wi-Fi 6 /
    BLE 5.4 coprocessor over the inter-chip SPI1 bridge -- power + reset,
    PING, GET_VERSION checked against the host's protocol version, GET_MAC
    checked for a structurally valid station address AND read twice so a
    transient single-bit corruption cannot pass as a plausible one,
    GET_CAPABILITIES, a
    passive Wi-Fi scan that never associates, and BLE_ENABLE, with a PING
    alone explicitly not sufficient for PASS -- the microSD card phase,
    which always reports SKIPPED on this board revision (#2051): the
    74LVC157 SDIO mux (U38/U39) has no high-impedance state, so its
    SoC-facing outputs are held low whenever the mux is powered regardless
    of its ENABLE input, and the SD host controller (snps,dwc-sdhc) stays
    DISABLED in the devicetree rather than fight those pads -- a hardware
    defect pending a component change, not a firmware gap -- RMII Ethernet
    through the
    GMAC and the on-module TI DP83825 PHY, which powers the PHY from a
    SYS_INIT hook ahead of the driver's ref-clock probe, reads the real
    wire state over MDIO because a fixed-link PHY's carrier_ok is
    synthetic, and gates PASS on a DHCPv4 LEASE, never on carrier_ok or on
    the MAC merely initialising -- and JPEG encode on the
    Alif Hantro VC9000E: a synthetic 64x64 NV12 frame through
    <alp/jpeg.h>, verified by the SOI/EOI markers and a plausible encoded
    length, never by the return code alone. The remaining four phases
    (encoder, sound, screen, NPU) are stubs
    that report SKIPPED with a phase-specific reason.

tests:
  alp_sdk.examples.aen.evk_demo.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
      - alp_e1m_aen803_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - i2c
      - pwm
      - sensors
      - jpeg
      - video
      - spi
      - wifi
      - ble
      - sdhc
      - disk
      - filesystem
      - ethernet
      - dwmac
      - net
    build_only: true   # verdicts need the real bench; not a CI behavioural run.

  alp_sdk.examples.aen.evk_demo.probe_fault_pin.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
      - alp_e1m_aen803_m55_he/ae822fa0e5597ls0/rtss_he
    extra_args:
      - ALP_AEN_EVK_DEMO_PROBE_FAULT_PIN=1
    tags:
      - alp-sdk
      - example
      - aen
      - i2c
      - sound
    # #2182's seeded-RMW discriminator + TDM-clock-fault stimulus never
    # builds in the scenario above (the default is OFF), so a regression in
    # this compile-time-gated block was invisible to CI. Mirrors
    # firmware-update-log's he_client.firewall_probe.aen scenario. Build-only:
    # the probe is a bench discriminator, not a CI-console assertion.
    build_only: true
