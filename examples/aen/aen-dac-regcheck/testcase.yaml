# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the Alif DAC driver (zephyr/drivers/dac/dac_alif.c,
# compatible "alif,dac") on the E1M-AEN801 (Ensemble E8, M55-HE).
#
# Compile-checks the driver + DT node on the real E8 board target; filtered OUT
# of the native_sim PR gate (platform_allow = the AEN801 HE board only).

sample:
  name: aen-dac-regcheck
  description: |
    Bench RAM-run DAC (alif,dac) bind proof for the E1M-AEN801 (Alif Ensemble
    E8, Cortex-M55-HE): validates the Alif DAC driver against the real DAC
    DT node through the bench RAM-run + RAM-console flow.

tests:
  alp_sdk.examples.aen.dac_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - dac
    build_only: true   # the DAC bind check is a bench flash, not a CI run.
