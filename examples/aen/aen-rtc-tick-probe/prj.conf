# Bench config for the RV-3028-C7 tick probe (#2037) on the E1M-AEN801
# (Alif Ensemble E8).

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- I2C + RV-3028-C7 chip driver --------------------------------------------
# CONFIG_ALP_SDK turns on the alp-sdk Zephyr backend (alp_i2c_open /
# alp_i2c_write_read etc, src/backends/i2c/zephyr_drv.c) that
# chips/rv3028c7/rv3028c7.c calls into; CONFIG_ALP_SDK_CHIP_RV3028C7 compiles
# that driver in (each chip driver is opt-in, zephyr/kconfigs/chips.kconfig).
# Neither symbol carries a Kconfig default -- both must be set explicitly.
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_RV3028C7=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# Logging ON, deliberately -- see examples/aen/aen-rtc-control2-probe's
# prj.conf for the fuller rationale (the upstream i2c_dw driver reports the
# decisive NACK-vs-timeout distinction via LOG_ERR). LOG_MODE_MINIMAL keeps
# it deferred-free.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_I2C_LOG_LEVEL_DBG=y
