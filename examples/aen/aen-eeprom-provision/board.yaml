# board.yaml -- per-app project configuration for aen-eeprom-provision.
#
# WRITE the 128-byte Alp manifest into the on-module 24C128 EEPROM on the
# E1M-AEN (Alif Ensemble) SoM. Write sibling of examples/aen/aen-eeprom-manifest,
# which reads the same bytes back. The EEPROM is on SoC I2C2 (DesignWare master,
# upstream i2c_dw) -- the per-example board overlay
# (boards/alp_e1m_aen801_m55_he_ae822fa0e5597ls0_rtss_he.overlay) enables i2c2 +
# pinctrl + the alp-i2c0 alias. The filename must be the FULLY-QUALIFIED board
# id or Zephyr's auto-apply-by-board-name silently skips it.
#
# This is a PROVISIONING tool, run from RAM over SWD (Flow C) on the line -- it
# is deliberately not a slot0/shipping image.

som:
  sku: E1M-AEN801

preset: e1m-evk

cores:
  a32_cluster:
    os: "off"
  m55_he:
    app: ./src
    peripherals:
      - i2c

chips:
  - eeprom_24c128         # on-module Alp manifest EEPROM @ 0x50.

diagnostics:
  log_level: info
