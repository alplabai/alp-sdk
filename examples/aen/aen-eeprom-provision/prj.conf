CONFIG_PRINTK=y
CONFIG_LOG=y

# NOTE: unlike aen-eeprom-manifest, this app does NOT set
# CONFIG_FLASH_LOAD_OFFSET=0x10000. It is a provisioning tool that runs from
# ITCM via a J-Link RAM-run (Flow C) and is never flashed to MRAM slot0, so it
# has no ATOC load address to match. Leaving the offset unset keeps the Flow C
# ITCM retarget (scripts/bench/aen/aen-flowc-itcm.{conf,overlay}) sufficient on
# its own -- see that conf's note about hard-coded offsets surviving the
# retarget and silently re-linking an ITCM build at 0x10000.
