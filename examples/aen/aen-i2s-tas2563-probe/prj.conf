# SPDX-License-Identifier: Apache-2.0
#
# aen-i2s-tas2563-probe -- bench RAM-run config for the E1M-AEN801 (M55-HE).
#
# BENCH-TEST (test/u46-i2s-tas2563-on-reworked-mux): proves the I2S0 path
# through the reworked U46 mux reaches the TAS2563 amps -- SEPARATE from
# test/2051-sdhc-enable-on-reworked-mux's SD test. See src/main.c and the
# board overlay for the full rationale.

CONFIG_ALP_SDK=y

# --- CC3501E bridge (drives the I2S0 mux SELECT + ENABLE) --------------------
# CONFIG_SPI/CONFIG_GPIO back the bridge (SPI1 + WIFI_EN/nRESET) and the GPIO
# proxy the mux drive needs -- both set explicitly because this app has no
# board.yaml `peripherals:` block to generate them (standalone Zephyr app,
# see CMakeLists.txt).
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# --- I2S3 + TAS2563 x2 over I2C -----------------------------------------------
# CONFIG_ALP_SDK_AUDIO_OUT is `default y if I2S` (zephyr/kconfigs/
# iot-audio-inference.kconfig), so it comes on for free from CONFIG_I2S below
# -- alp_audio_out_open() (<alp/audio.h>) is what src/main.c uses to start
# I2S3 TX with volume control, the same lever examples/aen/aen-evk-demo's
# phase 11 uses to keep the amp quiet at first ACTIVE.
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_ALP_SDK_CHIP_TAS2563=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# --- PDM mics (the acoustic-loopback listener) --------------------------------
# CONFIG_ALP_SDK_AUDIO_IN is `default y if AUDIO_DMIC` (zephyr/kconfigs/
# iot-audio-inference.kconfig), so it comes on for free from CONFIG_AUDIO_DMIC
# below -- alp_audio_in_open() (<alp/audio.h>) is what src/main.c uses to
# capture from the pdm@4902d000 node the board overlay adds, the same
# portable capture surface examples/aen/aen-evk-demo's phase 11 uses for
# this exact mic pair. Real driver only, not the DMIC test-double behind
# CONFIG_ALP_SDK_AUDIO_SW_FALLBACK -- that one only auto-selects on
# native_sim.
CONFIG_AUDIO_DMIC=y

# The I2S TX slab (alp_i2s_open(), src/backends/i2s/zephyr_drv.c) is
# k_malloc'd -- a 2-block ping-pong slab at 256 stereo S16 frames/block is
# 2048 B total (256 frames x 2 channels x 2 bytes x 2 blocks). Headroom on
# top for the driver's own scratch. The audio_in (PDM) side is NOT heap in
# THIS backend -- its slab lives in a static per-handle pool
# (src/backends/audio/zephyr_drv.c's g_in_be_pool + hw_in_be.slab_buf[],
# confirmed by reading the struct -- a plain array, not a k_malloc), so it
# does not add to this budget by itself. Aligned to 16384 anyway, matching
# examples/aen/aen-pdm-mic-alif's bench-verified CONFIG_HEAP_MEM_POOL_SIZE
# (its own comment there claims the PCM path needs "a k_mem_slab + the
# kernel heap" -- that app's K_MEM_SLAB_DEFINE_STATIC is also a static
# array, not heap, so the exact mechanism that value covers is unclear from
# either app's own code; matching it costs nothing at our current headroom
# and removes heap size as a variable when comparing runs).
CONFIG_HEAP_MEM_POOL_SIZE=16384
# Bumped from 4096: the acoustic-loopback addition adds float locals
# (Goertzel state, composite dB tables) and a few hundred bytes of
# chan_result_t arrays on main()'s own frame -- the large buffers
# (tone_buf, mic_buf) stay static/BSS, not stack.
CONFIG_MAIN_STACK_SIZE=8192

# Float printf (%f/%e/%g) for the Goertzel tone-bin / RMS dB table below --
# picolibc's math functions (cosf/sqrtf/log10f) link without any extra
# Kconfig on this toolchain (same as examples/audio/butterworth-lowpass and
# several AI examples), but the *printf* float path is opt-in.
CONFIG_CBPRINTF_FP_SUPPORT=y

# FIFO is fed by the CPU from a plain buffer on BOTH audio peripherals here
# (i2s_dw and alif_pdm.c are both interrupt-driven, NOT DMA -- see
# src/main.c's file header) -- keep the data path coherent on this M55
# bench by disabling the D-cache, matching every other AEN801 bench app.
# Neither peripheral needs the sram0/DTCM-reachability workaround the SD
# test (test/2051-sdhc-enable-on-reworked-mux) needed for its ADMA
# descriptor table, for the same reason: no external bus master ever
# touches this app's audio buffers.
CONFIG_DCACHE=n

# --- Console -------------------------------------------------------------
# Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200 8N1,
# NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
