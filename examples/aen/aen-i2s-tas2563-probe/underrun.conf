#
# PROBE_UNDERRUN-only overlay (issue #2149 bench verification). Pulled in by
# CMakeLists.txt ONLY when `-DPROBE_UNDERRUN=1` is set -- every other PROBE_*
# mode's build stays on the base prj.conf, which carries no CONFIG_LOG at
# all, so this file changes nothing for them.
#
# CONFIG_LOG_DEFAULT_LEVEL=2 (WRN) is the exact knob the alp_i2s_zephyr
# backend reads for its own compiled-in level -- src/backends/i2s/zephyr_drv.c:
# `LOG_MODULE_REGISTER(alp_i2s_zephyr, CONFIG_LOG_DEFAULT_LEVEL)` -- so this
# is what makes its `LOG_WRN_RATELIMIT("i2s: recovered from I2S_STATE_ERROR
# on write()", ...)` line actually reach the console during this bench run.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
