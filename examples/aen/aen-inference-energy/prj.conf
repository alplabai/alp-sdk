# SPDX-License-Identifier: Apache-2.0
#
# aen-inference-energy -- measure the INCREMENTAL carrier-rail energy of one
# Ethos-U inference on the E1M-AEN801 (Ensemble E8, M55-HE), by integrating
# INA236 Power-register samples across an active window and an idle window of
# equal length.  The NPU stack below is transcribed from
# examples/aen/aen-npu-inference-alif (silicon-proven); the I2C + chip-driver
# and console settings are what this app adds.

# --- TFLM + Ethos-U stack (see aen-npu-inference-alif for the derivation) ---

# TFLM is C++17; the MicroInterpreter is C++.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# TFLM module: MicroInterpreter, op resolver, reference kernels, and -- because
# the Ethos-U driver is enabled -- the Ethos-U custom-op kernel whose
# Register_ETHOSU() -> ethosu_invoke dispatches onto the NPU.
CONFIG_TENSORFLOW_LITE_MICRO=y

# The Arm Ethos-U core driver (ethosu_driver.c / ethosu_device_u85.c) + the
# Zephyr frontend that auto-instantiates the arm,ethos-u node at POST_KERNEL.
CONFIG_ETHOS_U=y

# CONFIG_ARM_ETHOS_U is intentionally NOT set: hal_alif's ethosu_callback.c
# carries the strong ethosu_address_remap we want, but also defines the dcache
# hooks with a signature that is stale vs the pinned Arm core driver (duplicate
# symbols against upstream ethos_u_common.c).  src/main.cpp re-provides ONLY
# the remap, calling hal_alif's own local_to_global().
CONFIG_ETHOS_U_DCACHE=y

# The AE822 (E8) NPU is an Ethos-U85; the 256-MAC config matches the silicon
# and the Vela ethos-u85-256 command stream.
CONFIG_ETHOS_U85_256=y

# --- I2C + the rail monitor -------------------------------------------------

# The six EVK INA236 rail monitors sit on SoC I2C2 (the E1M I2C0 bus -- see the
# board overlay for the pad map).  ALP_SDK_CHIP_INA236 depends on I2C.
CONFIG_I2C=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_INA236=y

# --- Heap / stack -----------------------------------------------------------

# TFLM + the Ethos-U Zephyr glue allocate from the system heap.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# AllocateTensors + Invoke run on the main thread.
CONFIG_MAIN_STACK_SIZE=16384

# --- DMA correctness --------------------------------------------------------

# The Ethos-U is a DMA master reading the model + arena out of SRAM0.  With the
# M55 D-cache on, the CPU could leave the model/input dirty in cache or read a
# stale output.  DCACHE=n gives the NPU and CPU a coherent view with no cache
# maintenance -- the same choice the bench-proven inference app makes.
CONFIG_DCACHE=n

# --- Console: RAM console, and it must be BIG --------------------------------

# This app streams one console line PER INA236 CONVERSION so the host can
# re-integrate the energy with its own (unit-tested) trapezoidal math instead
# of trusting a single number computed on-target.  At 250 samples x 6 windows
# that is ~1500 lines of ~36 bytes = ~54 KB, so the default 2048-byte RAM
# console would silently truncate the capture mid-window -- and a truncated
# window reads as a real (shorter) window, i.e. a wrong energy number rather
# than an obvious failure.  80 KB leaves headroom; DTCM is 256 KB and the
# model + arena live in SRAM0, not here.
#
# Read it back with:  scripts/bench/aen/ram-run.sh <build-dir> 15000 0x14000
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=81920
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# The ENERGY-CFG header reports the INA236 scaling factors (current LSB in amps,
# power LSB in watts) as real numbers, because the host multiplies raw POWER
# counts by them -- rounding them to integers here would quantise every energy
# figure downstream.  printk needs FP support to format them.
CONFIG_CBPRINTF_FP_SUPPORT=y

# Logging off: the RESULT + ENERGY-* lines are printk, and deferred log mode has
# no ram_console backend (it would eat them).  See the LOG-eats-printk trap in
# the AEN bench skill.
CONFIG_LOG=n
