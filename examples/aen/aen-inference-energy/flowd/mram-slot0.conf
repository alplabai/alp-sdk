# SPDX-License-Identifier: Apache-2.0
#
# Flow-D companion to flowd/mram-slot0.overlay: link the image at the slot0
# OFFSET, not the MRAM base.
#
# Without this, FLASH_LOAD_OFFSET stays 0 and the reset vector lands at
# 0x80000xxx, which faults when the Secure Enclave boots slot0.  The check is
# mechanical: `xxd -e -l 8 zephyr.bin` word 2 must read 8001xxxx, and
# flash-jlink-mramxip.sh aborts if it reads 8000xxxx.
CONFIG_USE_DT_CODE_PARTITION=y
