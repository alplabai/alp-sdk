#
# Sysbuild configuration for E1M-AEN secure-boot images.
#
# Loaded when a Zephyr application is built with sysbuild against
# this directory, e.g.:
#
#   west build -b alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he path/to/app \
#       --sysbuild -- -DSB_CONF_FILE=<abs>/alp-sdk/zephyr/sysbuild/aen/sysbuild.conf
#
# Produces:
#   build/zephyr/zephyr.signed.bin     -- MCUboot-signed application image
#   build/mcuboot/zephyr/zephyr.bin    -- MCUboot bootloader
#
# Boot chain on the Alif Ensemble (E1M-AEN): the Secure Enclave (SES)
# launches an ATOC image; here that image is MCUboot, which then verifies
# and chain-loads the application from MRAM slot0.  The MRAM partition map
# lives in the board DT (mcuboot @ 0x80000000, HE slot0 @ 0x80010000,
# HP slot0 @ 0x802b0000 (was slot1/OTA), reserved (ex-scratch), storage --
# MRAM base 0x80000000).  No slot1/scratch partition exists on this board;
# see zephyr/sysbuild/aen/sysbuild.conf and ADR-0006's AEN amendment.
#
#   SES --ATOC--> MCUboot (this build) --verify slot0--> application
#
# This is also the SoM-maker provisioning model: Alp Lab pre-provisions this
# MCUboot as the factory ATOC over the SE-UART so a shipped module boots
# out-of-box, and the customer then loads apps into slot0 with only a J-Link --
# no SETOOLS, no ATOC, no SE-UART day-1.  BOTH halves are bench-measured.
#
# The customer half, proven on E1M-AEN801: an imgtool-signed image written to
# slot0 by plain `JLinkExe loadbin` is verified by MCUboot and chainloaded, and
# survived three cold power-cycles.  Both refusal shapes leave the debug port
# ALIVE -- a tampered signature gives `E: Unable to find bootable image` with
# VTOR = 0x00000000, a non-MCUboot image gives `E: Bad image magic 0x20004c60`,
# and in both `Secure debug: enabled` with DHCSR (0xE000EDF0) = 00130003.
# A customer cannot brick their debug port with a bad slot0 image.
#
# TWO LIMITS travel with that promise and must not be dropped:
#   * ADDRESS: proven for slot0 writes at 0x80010000 ONLY.  Writing the ATOC
#     region, or erasing MCUboot itself, was NOT tested and is a different risk.
#   * NO A/B YET: both sessions ran CONFIG_SINGLE_APPLICATION_SLOT=y, so the
#     swap/upgrade path is UNTESTED.  Do not promise A/B or OTA on this basis.
# See docs/aen-provisioning.md.
#
# Verification policy -- DEFENCE IN DEPTH (updated 2026-07-31):
#   The Alif Secure Enclave (SES) is the hardware root of trust. It ECDSA-verifies
#   every signed ATOC entry against the device key BEFORE launch -- both this
#   MCUboot AND the signed slot0 application (app-cfg `signed:true`). That has not
#   changed and remains the factory path.
#
#   What HAS changed: MCUboot now ALSO verifies in software (ECDSA-P256 +
#   VALIDATE_SLOT0=y). The previous policy here was SIGNATURE_TYPE_NONE, justified
#   by "on the E8/M55 the software ECDSA-P256 verify (TinyCrypt uECC AND
#   mbedTLS-PSA) does NOT terminate". THAT JUSTIFICATION IS RETRACTED -- it does
#   not reproduce at 0da1f1b4, and the verify was proven live by flipping a
#   signature byte and observing a correct REJECT. See the CORRECTION block in
#   sysbuild/mcuboot.conf for the measurement.
#
#   The SE verify is not redundant with this one: the SE authenticates the ATOC
#   that launches MCUboot, MCUboot authenticates the slot0 image it chainloads.
#   They cover different links in the chain, which is why both are on.
#
# Status: bench-VALIDATED end-to-end on E1M-AEN801 (AE822FA0E5597LS0 Rev A0) at
# alp-sdk 0da1f1b4: SES -> MCUboot (ITCM) -> slot0 app (MRAM XIP) -> app main(),
# with ECDSA-P256 + VALIDATE_SLOT0=y confirmed in the built mcuboot/zephyr/.config
# rather than assumed. PC=80012FBC, VTOR=80010800, CFSR=00000000, IPSR=000.
# Still required: CONFIG_DCACHE=n + board ROM_START_OFFSET=0x800 + the mcuboot
# do_boot flash-base patch (zephyr/patches/mcuboot, carried via west patch -- do_boot
# used CONFIG_FLASH_BASE_ADDRESS=0x0/ITCM for the MRAM slot vector address). That
# patch should be upstreamed rather than carried indefinitely.

# Pull MCUboot into the build graph.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Single-application slot: MCUboot reads the slot0 header and boots it; no swap
# machinery. Kept for this smoke test because it is the smallest configuration
# that exercises SES -> MCUboot -> slot0, NOT because swap-scratch fails -- the
# trailing claim here that "swap-scratch + software ECDSA hang" is retracted:
# swap-scratch boots at 0da1f1b4 and logs
#   I: Bootloader chainload address offset: 0x10000
# See the CORRECTION block in sysbuild/mcuboot.conf.
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y

# Verify the slot0 signature in the bootloader with ECDSA-P256. Was TYPE_NONE on
# the premise that software ECDSA does not terminate on this part; that premise
# is retracted. Measured on E1M-AEN801 (AE822FA0E5597LS0 Rev A0) at 0da1f1b4:
# the verify completes, and a single flipped byte in the signature TLV is
# correctly REJECTED (`E: Unable to find bootable image`) rather than hanging.
# Trust is no longer delegated to the SES alone -- the SES verifies the ATOC on
# the factory path, and this verifies the image MCUboot is about to chainload.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# NO key file is set here, deliberately. Selecting a signature type without a key
# leaves nothing to sign with, so this file REQUIRES the documented invocation at
# the top: `-DSB_CONF_FILE=<abs>/alp-sdk/zephyr/sysbuild/aen/sysbuild.conf`, which
# supplies the key. Build this example without SB_CONF_FILE and sysbuild will
# auto-load THIS file alone, with no key -- that is a hard configure error, which
# is the correct outcome: it is louder than signing against a path that does not
# resolve.
#
# A relative key path cannot be fixed here. `SB_CONFIG_BOOT_SIGNATURE_KEY_FILE`
# is passed through verbatim (zephyr/share/sysbuild/images/bootloader/
# CMakeLists.txt:20) and MCUboot resolves a relative value against WEST_TOPDIR,
# not the repo -- while `keys/generate_dev_key.sh` writes to <alp-sdk>/keys/.
# With alp-sdk as a west module those are different directories. See the note in
# README.md; pass an absolute path for a key outside the shared profile.
