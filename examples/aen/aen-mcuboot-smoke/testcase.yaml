#
# aen-mcuboot-smoke -- minimal slot0 application bench-validating the
# SES -> MCUboot -> slot0 -> app boot chain on the E1M-AEN801 (M55-HE).
# Requires `--sysbuild` (this app never links standalone: it is the slot0
# image MCUboot chainloads) -- sysbuild: true below is what makes twister
# build it that way, per issue #1076 Q2 / pr-twister-aen.yml's own header
# note.  Bench-VALIDATED end-to-end (alp-sdk 0da1f1b4): SES -> MCUboot
# (ITCM) -> slot0 app (MRAM XIP) -> app main(), ECDSA-P256 + VALIDATE_SLOT0.
#
# NOT covered here: signing with the alp-sdk dev key.  This app's own
# sysbuild.conf deliberately ships no SB_CONFIG_BOOT_SIGNATURE_KEY_FILE (a
# relative key path cannot be fixed in-repo -- MCUboot resolves it against
# WEST_TOPDIR, not the alp-sdk module root -- see the README + the file's own
# comment) and the documented invocation passes an absolute
# -DSB_CONF_FILE=<abs>/alp-sdk/zephyr/sysbuild/aen/sysbuild.conf to supply it.
# Neither testcase.yaml `extra_args` nor `sysbuild: true` can synthesize an
# absolute CI-runner path, so this entry builds with sysbuild's OWN
# auto-loaded app-local sysbuild.conf instead.  That does NOT hard-fail
# configure -- Zephyr's bootloader/Kconfig falls back to MCUboot's own bundled
# $(ZEPHYR_MCUBOOT_MODULE_DIR)/root-ec-p256.pem when no key file is set (build
# confirmed clean under `sysbuild: true` in CI), so this scenario proves the
# boot chain builds but signs with mcuboot's upstream test key, not the
# alp-sdk dev key -- left in deliberately (see note above) rather than
# silently dropped from this sweep.
#
# Filtered OUT of the native_sim PR gate (platform_allow = AEN801 M55-HE
# only, no native_sim overlay); build_only in the advisory pr-twister-aen.yml
# gate -- the boot-chain proof is a slot0 bench flash, not a CI run.

sample:
  name: aen-mcuboot-smoke
  description: |
    SES -> MCUboot -> slot0 -> app boot-chain bench test for the
    E1M-AEN801: a signed slot0 app that only proves it BOOTED (RAM console +
    VTOR).  Bench-VALIDATED end-to-end (alp-sdk 0da1f1b4) with ECDSA-P256 +
    VALIDATE_SLOT0.

tests:
  alp_sdk.examples.aen.mcuboot_smoke.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    sysbuild: true
    tags:
      - alp-sdk
      - example
      - aen
      - mcuboot
      - sysbuild
      - secure-boot
    build_only: true   # the SES->MCUboot->slot0 chain is a bench flash, not a CI run.
