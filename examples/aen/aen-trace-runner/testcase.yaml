# SPDX-License-Identifier: Apache-2.0
#
# Build-only regressions for the M55-HE half of the Trace Runner game.
# Twister has no bench, so these prove the game compiles in each render /
# input mode, not that it runs. The M55-HP image (hp_vision/testcase.yaml,
# needs the tflite-micro module) is its own twister target. The A32 renderer
# (a32/, arm-none-eabi Makefiles) and the sound image (sound/, reworked
# carriers only) are not; see README.md for their builds and
# tests/host/runner.sh for their tests.

sample:
  name: aen-trace-runner
  description: |
    Exhibition endless-runner game on the E1M-AEN803 + E1M-EVK: M55-HE game
    logic and HUD, M55-HP camera + Ethos-U55 pose input, Cortex-A32 3D
    renderer, RK055HDMIPI4MA0 MIPI-DSI panel.

common:
  tags: aen display game demo example
  build_only: true
  platform_allow:
    - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    - alp_e1m_aen803_m55_he/ae822fa0e5597ls0/rtss_he

tests:
  alp_sdk.examples.aen.trace_runner.a32_render:
    extra_args:
      - "EXTRA_DTC_OVERLAY_FILE=panel_30hz.overlay"
  alp_sdk.examples.aen.trace_runner.a32_render_npu_input:
    extra_args:
      - "EXTRA_DTC_OVERLAY_FILE=panel_30hz.overlay"
      - "TR_INPUT_NPU=ON"
      - "TR_CAM_ROTATE=90"
  # The EVK bench release: the camera upright and shown landscape (README "Controls").
  alp_sdk.examples.aen.trace_runner.a32_render_npu_input_landscape:
    extra_args:
      - "EXTRA_DTC_OVERLAY_FILE=panel_30hz.overlay"
      - "TR_INPUT_NPU=ON"
      - "TR_CAM_ROTATE=0"
      - "TR_CAM_MIRROR=ON"
  alp_sdk.examples.aen.trace_runner.m55_render:
    extra_args:
      - "TR_RENDER=M55"
  # The same game on the Riverdi RVT121 LVDS panel: only the shield changes.
  alp_sdk.examples.aen.trace_runner.rvt121_a32_render:
    extra_args:
      - "SHIELD=e1m_evk_rvt121hvdfwca0"
  alp_sdk.examples.aen.trace_runner.rvt121_a32_render_npu_input:
    extra_args:
      - "SHIELD=e1m_evk_rvt121hvdfwca0"
      - "TR_INPUT_NPU=ON"
      - "TR_CAM_ROTATE=90"
  # The HE half of the combined HP image: leases I2C2 + GPIO5 to the HP's game sound
  # (TR_HP_SOUND, src/platform/bus2_he.c). Needs a shield that leaves GPIO5 alone (the RVT121) and
  # the NPU input (the HP is the vision HP); no clockctrl patch is involved on this core.
  alp_sdk.examples.aen.trace_runner.rvt121_hp_sound:
    extra_args:
      - "SHIELD=e1m_evk_rvt121hvdfwca0"
      - "TR_INPUT_NPU=ON"
      - "TR_HP_SOUND=ON"
      - "TR_CAM_ROTATE=90"
