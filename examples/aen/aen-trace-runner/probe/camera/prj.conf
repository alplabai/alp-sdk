#
# Camera bring-up diagnostic probe. Video Kconfig copied verbatim from
# alp-sdk-lcd/examples/aen/aen-camera-firstlight/prj.conf (bench-verified
# on E1M-AEN803, 2026-09-21) -- do not invent new values here.

CONFIG_ALP_SDK=y

# Video subsystem: CONFIG_VIDEO=y enables the v4.4 video_* API and, with it,
# every driver Kconfig default-y'd under its DT_HAS_*_ENABLED -- the CSI-2
# D-PHY, the DesignWare CSI-2 bridge, the Alif CPI capture controller, and
# the OV9281 sensor driver the stacked innomaker_cam_ov9281 shield's DT node
# enables (CONFIG_VIDEO_OV9281, which itself `select I2C`s -- no separate
# CONFIG_I2C=y needed).
CONFIG_VIDEO=y

# The camera buffer pool defaults to a 2 MB heap in the HE core's local
# DTCM (256 KB total) -- does not fit, and the CPI's AXI capture master
# cannot reach core-local DTCM at all. Move the pool into the global SRAM0
# bank (4 MiB @ 0x02000000, AXI-visible) instead. NEVER SRAM1 (0x02400000+):
# it is power-gated and unpowered on this board, even a read bus-faults.
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM0"

# The pool is a sys_heap. Zephyr's kernel SRAM here is the 256 KB DTCM, so
# it defaults to SYS_HEAP_SMALL_ONLY (heaps top out at 262136 B) -- short of
# this pool. AUTO sizes each heap's chunk headers to fit it.
CONFIG_SYS_HEAP_AUTO=y

# Console MUST be the RAM console: this board's console FTDI passes zero
# bytes, so a UART print is invisible and a run with it produces nothing.
# Keep total output well under this buffer -- it wraps with no marker.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
