#
# M55-HP NPU probe. Inference Kconfig from alp-sdk-lcd
# examples/aen/aen-npu-inference-alp-u55/prj.conf (silicon-proven on the HE's
# U55-128), with the HP's U55-256; console from aen-hp-core-smoke (RAM
# console, D-cache off so SWD reads of SRAM0 are coherent).

CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_INFERENCE_BACKEND_TFLM=y
CONFIG_ALP_SDK_INFERENCE_BACKEND_ETHOS_U_AEN=y
CONFIG_ALP_SDK_INFERENCE_ETHOS_U_VARIANT_U55=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_ETHOS_U=y
CONFIG_ETHOS_U_DCACHE=y
# E8's M55-HP-paired NPU: Ethos-U55 256-MAC (metadata/socs/alif/ensemble/e8.json,
# paired_core m55_hp). Matches npu_probe_payload.py --accel ethos-u55-256.
CONFIG_ETHOS_U55_256=y

CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_DCACHE=n

CONFIG_TIMING_FUNCTIONS=y

CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_SERIAL=n
CONFIG_PRINTK=y
CONFIG_LOG=n

# ITCM link (Flow D HP_APP load 0x50000000), not the board default MRAM slot0.
CONFIG_USE_DT_CODE_PARTITION=n

# crc32_ieee() for the payload and output-map checks.
CONFIG_CRC=y
