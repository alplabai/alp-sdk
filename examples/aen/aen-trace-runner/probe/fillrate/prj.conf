CONFIG_ALP_SDK=y

# This board's console FTDI passes zero bytes -- the bench reads
# ram_console_buf over SWD (same convention as the game's prj.conf and every
# AEN bench app in alp-sdk-lcd/examples/aen). Keep the buffer at 8192 B and
# keep the probe's own output well under it: the RAM console has no wrap
# marker, so an overrun silently destroys the run's own results.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=8192

# E8 M55: D-cache maintenance (SCB_EnableDCache) hangs on this silicon --
# every RAM-run bench app in alp-sdk-lcd/examples/aen keeps CONFIG_DCACHE=n
# for exactly this reason (see e.g. aen-mcuboot-smoke/prj.conf,
# aen-hp-core-smoke/prj.conf). A hang produces no number at all, which is
# worse than the number this probe exists to produce, so this follows the
# same standing convention rather than trusting the game's untested default.
# One consequence worth stating where the numbers are printed: with DCACHE=n
# every measurement below already reflects raw memory latency, not a
# cache-warm figure, so the "buffer exceeds any cache" methodology in Phase 1
# is moot on this silicon -- there is no cache in the path to exceed.
CONFIG_DCACHE=n
CONFIG_CBPRINTF_FULL_INTEGRAL=y
