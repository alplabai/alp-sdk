# volume_he.conf -- TR_HP_SOUND builds (CMakeLists.txt): the HE's volume controls, the EVK rotary
# encoder (<alp/counter.h> alp_qenc_*, the gpio-qdec backend) and its push switch (alp_gpio_*).
# CONFIG_INPUT is what compiles the gpio-qdec qenc backend and Zephyr's gpio-qdec driver.
CONFIG_GPIO=y
CONFIG_GPIO_DW=y
CONFIG_INPUT=y
CONFIG_PINCTRL=y
