CONFIG_ALP_SDK=y

# This board's console FTDI passes zero bytes, so the bench reads ram_console_buf
# over SWD.  Keep this identical to the display example so one reader works for both.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=8192

# Tilt input: BMI323 IMU on the EVK carrier bus (U13, I2C0).
CONFIG_ALP_SDK_CHIP_BMI323=y
CONFIG_I2C=y
CONFIG_PINCTRL=y


# TR_RENDER=A32 (plan section 3): the M55 sees the SRAM1 mailbox and the
# framebuffers uncached, so no clean/invalidate is ever needed -- pinned off.
# TR_RENDER=M55 turns it back on in m55_render.conf.
CONFIG_DCACHE=n
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=y
# 10 kHz tick: src/platform/a32.c / display_a32.c poll out_seq and the flip
# landing every 100 us (k_usleep(100) == one tick). A coarser tick turns
# those polls back into >= 1 ms sleeps.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# HE busy % on the HUD perf panel (src/platform/hud_l2.c): the kernel's
# non-idle vs all cycles, k_thread_runtime_stats_all_get(). Costs a cycle
# counter read per context switch.
CONFIG_THREAD_RUNTIME_STATS=y
