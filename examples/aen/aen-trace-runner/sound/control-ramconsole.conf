# Extra conf for the 2026W36-0002 CONTROL images (alp-sdk aen-i2s-amp-alif and the
# aen-i2s-tas2563-probe): route printk to 'ram_console_buf', which the Flow C
# helper in alp-sdk scripts/bench/aen reads back (it requires the symbol).
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384
CONFIG_UART_CONSOLE=n
