# Trace Runner sound firmware (sound/): I2S3 -> both TAS2563 amps, fed by
# src/audio/tr_audio.c. Kconfig set taken from the bench-proven
# aen-i2s-tas2563-probe (2026W36-0002, 2026-09-15) and alp-sdk aen-evk-demo.
CONFIG_ALP_SDK=y

# CC3501E bridge: the I2S0 mux /E + S are CC3501E GPIOs (E1M IO8/IO13).
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y
# IO8 is revision-dependent: the proxy opens it only once the identity
# EEPROM (carrier bus 0 @ 0x50) confirms this hw_rev.
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BITRATE_HZ=100000
CONFIG_ALP_SDK_SOM_HW_REV="2626-r2"

# I2S3 TX (<alp/audio.h> audio_out) + TAS2563 x2 over I2C.
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_ALP_SDK_CHIP_TAS2563=y
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

# D-cache maintenance hangs on this silicon, and the event ring in SRAM0 is
# shared with the other M55 -- off (as every AEN bench app and the game).
CONFIG_DCACHE=n
CONFIG_FPU=y
CONFIG_SPEED_OPTIMIZATIONS=y

# RAM console only ('ram_console_buf' over SWD); the HE game owns the UART.
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_LOG=n
