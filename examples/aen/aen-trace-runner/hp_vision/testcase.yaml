# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the M55-HP vision image of the Trace Runner
# (camera + Ethos-U55 pose input). Needs the tflite-micro Zephyr module; the
# image is HP-only and the same for every display (it waits for the HE's I2C1
# release through the alp,i2c-handover node in boards/*.overlay).

sample:
  name: aen-trace-runner-hp-vision
  description: |
    M55-HP camera + Ethos-U55 MoveNet pose input for the Trace Runner game.

common:
  tags: aen camera npu game demo example
  build_only: true
  platform_allow:
    - alp_e1m_aen803_m55_hp/ae822fa0e5597ls0/rtss_hp

tests:
  alp_sdk.examples.aen.trace_runner.hp_vision:
    extra_args:
      - "TR_CAM_ROTATE=90"
      - "TR_CAM_MIRROR=ON"
  # The combined HP: camera + NPU + the TAS2563 game sound in ONE image (TR_HP_SOUND). Needs the
  # clockctrl-patched ZEPHYR_BASE (hp_vision/CMakeLists.txt); a CI tree without it filters this
  # scenario out instead of failing it.
  alp_sdk.examples.aen.trace_runner.hp_vision_sound:
    filter: CONFIG_TR_CLKCTL_PATCHED
    extra_args:
      - "TR_CAM_ROTATE=90"
      - "TR_CAM_MIRROR=ON"
      - "TR_SND_REWORKED_U46=ON"
      - "TR_HP_SOUND=ON"
