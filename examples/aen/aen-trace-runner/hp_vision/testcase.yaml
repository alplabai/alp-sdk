# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the M55-HP vision image of the Trace Runner
# (camera + Ethos-U55 pose input). Needs the tflite-micro Zephyr module; the
# image is HP-only and the same for every display (it waits for the HE's I2C1
# release through the alp,i2c-handover node in boards/*.overlay).

sample:
  name: aen-trace-runner-hp-vision
  description: |
    M55-HP camera + Ethos-U55 MoveNet pose input for the Trace Runner game.

common:
  tags: aen camera npu game demo example
  build_only: true
  platform_allow:
    - alp_e1m_aen803_m55_hp/ae822fa0e5597ls0/rtss_hp

tests:
  alp_sdk.examples.aen.trace_runner.hp_vision:
    extra_args:
      - "TR_CAM_ROTATE=90"
      - "TR_CAM_MIRROR=ON"
  # The EVK bench release: the camera upright, landscape (../README.md "Controls").
  alp_sdk.examples.aen.trace_runner.hp_vision_landscape:
    extra_args:
      - "TR_CAM_ROTATE=0"
      - "TR_CAM_MIRROR=ON"
