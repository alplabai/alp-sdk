# hp_vision/sound.conf -- TR_HP_SOUND=ON only (hp_vision/CMakeLists.txt): the game sound's Kconfig,
# every line from sound/prj.conf (its reasons are there), on top of hp_vision/prj.conf.

# CC3501E bridge: the I2S0 mux /E + S are CC3501E GPIOs (E1M IO8/IO13).
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y
# IO8 is revision-dependent: the proxy opens it only once the identity EEPROM (carrier bus 0
# @ 0x50) confirms this hw_rev.
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BITRATE_HZ=100000
CONFIG_ALP_SDK_SOM_HW_REV="2626-r2"

# I2S3 TX (<alp/audio.h> audio_out) + TAS2563 x2 over I2C.
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_ALP_SDK_CHIP_TAS2563=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# hp_vision only: the FPU is off in the plain image (hp_vision/prj.conf). The synth's thread may use
# the FP/MVE register file (-mcpu=cortex-m55 auto-vectorisation) beside the vision (main) thread:
# save it per thread (FPU_SHARING needs FPU; sound/src/main.c asserts it).
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
# The ALP boot banner would read the identity EEPROM on carrier bus 0 at APPLICATION init --
# before the HE leases I2C2. The deferred I2C2 is not ready then (the read fails, no bus
# traffic), but keep the banner's I2C2 attempt out of the image altogether.
CONFIG_ALP_SDK_BANNER=n
