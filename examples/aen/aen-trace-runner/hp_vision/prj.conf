#
# M55-HP vision app: camera Kconfig from probe/camera/prj.conf
# (bench-verified on E1M-AEN803 2026W36-0009, 2026-09-21), inference Kconfig
# from probe/npu/prj.conf (the HP-paired Ethos-U55-256). See both files'
# comments for why each line is here -- not repeated below.

CONFIG_ALP_SDK=y

# --- camera (probe/camera/prj.conf for CONFIG_VIDEO / CONFIG_SYS_HEAP_AUTO;
# NOT its SRAM0 pool placement -- probe/camera is standalone, no renderer.
# This app runs ALONGSIDE the A32 renderer (a pool at SRAM0's base would sit
# on FB A, which is why the HE's old TR_CAMERA option is refused), so the
# pool goes where design sec 2 puts it instead: SRAM1
# 0x02480000..0x024FFFFF, this app's own board overlay (sram1_cam_pool node,
# region name CAM_POOL) -- needs the A32/stub boot to have already powered
# SRAM1 (bus-faults cold otherwise, AEN memory note), a real ordering
# dependency for the bench-runner, not provable here.) ---
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="CAM_POOL"
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=524288
CONFIG_SYS_HEAP_AUTO=y

# --- inference (probe/npu/prj.conf) ---
CONFIG_ALP_SDK_INFERENCE_BACKEND_TFLM=y
CONFIG_ALP_SDK_INFERENCE_BACKEND_ETHOS_U_AEN=y
CONFIG_ALP_SDK_INFERENCE_ETHOS_U_VARIANT_U55=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_ETHOS_U=y
CONFIG_ETHOS_U_DCACHE=y
CONFIG_ETHOS_U55_256=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_DCACHE=n
# No CONFIG_TIMING_FUNCTIONS: stage timing is k_cycle_get_64() (SysTick),
# not the DWT -- see src/main.c now_cyc(); left off so the DWT path cannot
# creep back in unnoticed (timing_counter_get() would not link).

# --- console (probe/npu/prj.conf: this board's console FTDI has been
# unreliable; RAM console is always readable over SWD regardless) ---
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_SERIAL=n
CONFIG_PRINTK=y
CONFIG_LOG=n
# fix round 12 (silicon finding + review): CONFIG_SERIAL=n above was a dead
# letter -- zephyr/kconfigs/core.kconfig ALP_SDK_CONSOLE
# defaults y (nothing here said otherwise) and `select`s SHELL, which
# selects SHELL_BACKEND_SERIAL, which selects SERIAL back to y: a Kconfig
# `select` always wins over a plain default set elsewhere. The result ran
# a shell on &uart5 (0x4901D000) -- the SAME UART the HE's own console and
# shell use -- so the HP's UART init reset the port out from under the HE
# and both cores fought over the one RX line. Both explicit: ALP_SDK_CONSOLE
# off breaks the select chain at its root; SHELL=n is the same fix one
# level up, belt and braces. The HP keeps only its RAM console (above).
CONFIG_ALP_SDK_CONSOLE=n
CONFIG_SHELL=n

# ITCM link (Flow D HP_APP load 0x50000000), not the board default MRAM slot0.
CONFIG_USE_DT_CODE_PARTITION=n

# crc32_ieee(): none used in this app (unlike probe/npu, there is no host
# reference to check against) -- kept OFF; re-enable if a future bench check
# wants one.
