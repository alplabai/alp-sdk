# camera.conf -- only for camera builds: cmake -DTR_CAMERA=ON (see CMakeLists.txt).
#
# Split out of prj.conf because the video buffer pool below is a 512 KiB
# allocation at the base of SRAM0, and a build with no camera was carrying it
# anyway: the E1M-AEN803 2026W36-0009 EVK has the display panel and nothing on J5. Without the
# pool, SRAM0's 2 MiB partition is free for the renderer's back buffer, which
# otherwise has nowhere to go -- SRAM1 is power-gated and unpowered at boot.

# Camera: InnoMaker CAM-OV9281 on the EVK's J5 CSI connector, via the
# portable <alp/camera.h> API (see src/platform/camera.c). CONFIG_VIDEO=y
# pulls in every driver Kconfig the stacked shields default-y under their
# DT_HAS_*_ENABLED (CSI-2 D-PHY, DesignWare CSI-2 bridge, the Alif CPI
# capture controller, the OV9281 sensor driver) -- and, with it,
# CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO (`default y if VIDEO`), the backend
# camera.c actually calls.
CONFIG_VIDEO=y

# The video buffer pool's sys_heap defaults into the HE core's local DTCM
# (256 KB total, the same RAM this ITCM RAM-run project's stack and data
# already live in) -- one GREY8 frame alone is 640*400 = 256,000 bytes, and
# the CPI's AXI capture master cannot reach core-local DTCM at all. Move the
# pool into the global on-chip SRAM0 bank instead: the display shield
# (e1m_evk_rk055hdmipi4ma0) already shrinks the SoC dtsi's sram0 node to the
# 2 MiB below its own lcd_fb framebuffer (0x02000000..0x021FFFFF), which is
# exactly the "SRAM0" Zephyr memory-region this places the pool in -- no
# overlap with lcd_fb, and the video_alif.c driver does its own cache
# flush/invalidate per buffer, so no CONFIG_DCACHE=n is needed here.
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM0"

# The pool is a sys_heap; Zephyr defaults to SYS_HEAP_SMALL_ONLY (262,136
# bytes max) because the kernel's own SRAM is the 256 KB DTCM, which is far
# short of the pool's heap. AUTO sizes each heap's chunk headers to fit it,
# so the small kernel heaps keep their compact form.
CONFIG_SYS_HEAP_AUTO=y

# Fix round 1, finding 7 (review): CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE's
# 2,097,152-byte (2 MiB) default claimed the ENTIRE SRAM0 partition above
# (also 2 MiB) for a pool that only ever holds
# CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO_VBUF_COUNT (2) buffers of
# ROUND_UP(640*400, CONFIG_VIDEO_BUFFER_POOL_ALIGN=64) = 256,000 bytes each
# (256,000 is already 64-aligned) = 512,000 bytes actually used -- leaving
# zero bytes of link headroom in this project's only AXI-reachable SRAM for
# Task 10's L2 framebuffer or Task 11's sprite data. Size it to what the two
# buffers need (512,000 B) plus ~12 KB of sys_heap slack: 524,288 B (512
# KiB). That gives back 1,572,864 B (1.5 MiB) of SRAM0 for later tasks while
# still fitting comfortably inside the 2 MiB partition.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=524288
