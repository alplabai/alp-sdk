#
# Bench config for the ICM-42670 / BMP581 / TCAL9538 interrupt-chain probe on
# the E1M-AEN801 (Alif Ensemble E8), carrier bus ALP_E1M_I2C0.

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- I2C + chip drivers -------------------------------------------------------
# CONFIG_ALP_SDK turns on the alp-sdk Zephyr backend (alp_i2c_open /
# alp_i2c_write_read etc, src/backends/i2c/zephyr_drv.c) every chip driver
# below calls into. Each chip driver is opt-in (zephyr/kconfigs/chips.kconfig)
# and carries no Kconfig default, so all four symbols must be set explicitly:
#   CHIP_ICM42670  -- chips/icm42670/icm42670.c  (IMU, data-ready -> INT1)
#   CHIP_BMP581    -- chips/bmp581/bmp581.c      (barometer, data-ready -> INT)
#   CHIP_TCAL9538  -- chips/tcal9538/tcal9538.c  (I/O expander, Agile-IO IRQ
#                      block -- mask/latch/status, TCAL9538-only)
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_ICM42670=y
CONFIG_ALP_SDK_CHIP_BMP581=y
CONFIG_ALP_SDK_CHIP_TCAL9538=y
CONFIG_I2C=y
CONFIG_PINCTRL=y

# Logging ON, deliberately -- the upstream i2c_dw driver reports the decisive
# NACK-vs-timeout distinction on this bus via LOG_ERR; see
# examples/aen/aen-brd-i2c-scan/prj.conf for the fuller rationale. Useful
# evidence if any of the three parts stops answering. LOG_MODE_MINIMAL keeps
# it deferred-free.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_I2C_LOG_LEVEL_DBG=y
