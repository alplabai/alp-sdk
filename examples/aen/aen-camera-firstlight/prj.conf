#
# Bench RAM-run config for the E1M-AEN801/AEN803 (M55-HE). Console is the
# Alp UART console on the E1M edge UART0.

CONFIG_ALP_SDK=y

# Software CRC32 (crc32_ieee(), zephyr/subsys/crc/) for the captured frame's
# checksum -- this is the subsys/crc software library, not the hardware
# CRC_DRIVER class (unneeded here; the frame is small and this runs once).
CONFIG_CRC=y

# Video subsystem: CONFIG_VIDEO=y enables the v4.4 video_* API and, with it,
# every driver Kconfig default-y'd under its DT_HAS_*_ENABLED -- the CSI-2
# D-PHY (CONFIG_MIPI_DPHY_DW), the DesignWare CSI-2 bridge
# (CONFIG_VIDEO_MIPI_CSI2_DW), the Alif CPI capture controller
# (CONFIG_VIDEO_ALIF_CAM), and whichever ONE sensor driver the stacked
# camera shield's DT node enables (CONFIG_VIDEO_IMX219 / CONFIG_VIDEO_OV5647
# / CONFIG_VIDEO_OV9281 / CONFIG_VIDEO_IMX296).
# CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO (the <alp/camera.h> backend main.c
# actually calls) is itself `default y if VIDEO`, so this one line pulls the
# whole portable path in.
CONFIG_VIDEO=y

# The portable camera backend's video_buffer_alloc() pool defaults to a 2 MB
# heap in the HE core's local DTCM (256 KB total) -- it does not fit, and
# even if it did, the CPI's AXI capture master cannot reach core-local DTCM
# at all (same reachability gap the JPEG/DMA/Ethernet examples hit -- see
# their overlays/prj.conf for the identical finding). Move the pool into the
# global on-chip SRAM0 bank (4 MiB @ 0x02000000, AXI-visible, declared by the
# SoC dtsi) instead: 2 MiB comfortably fits, and video_alif.c's own
# enqueue/dequeue path (zephyr/drivers/video/video_alif.c) does its own
# sys_cache_data_flush_and_invd_range / sys_cache_data_invd_range on every
# buffer, so no CONFIG_DCACHE=n is needed here the way the DMA/Ethernet
# examples require it -- the driver already handles coherency per-buffer.
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM0"

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801/AEN803 carrier console. The board _defconfig
# already selects it; set explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# Keep the image small + deterministic for this bench run.
CONFIG_LOG=n
