#
# Issue #2327: bench conf for the innomaker_cam_imx335 shield's FIRST bench
# pass. prj.conf's own CONFIG_LOG=n (kept for the OV5647/OV9281/IMX296 bench
# runs' image-size/determinism reasons) hides video_csi_dw.c's own
# CSI2_IPI_MODE_TIMINGS_CTRL LOG_INF -- the one line that reports the ACTUAL
# programmed pixclk and the resulting IPI line time against csi-hline for
# comparison (csi2_dw_validate_data(), issue #2287's own log line, reused
# unchanged for csi-pixclk-hz) -- without it, whether this shield's
# Controller-mode timing landed where the overlay's derivation comment
# claims is invisible on the console.
#
# Layer on top of the example's own prj.conf:
#   -DEXTRA_CONF_FILE="prj.conf;overlay-imx335-bench-log.conf"
#
# (Same layering shape as aen-isp-capture/overlay-ae-diag.conf -- later
# files win, so this overrides prj.conf's CONFIG_LOG=n.)

CONFIG_LOG=y
CONFIG_VIDEO_LOG_LEVEL_INF=y
CONFIG_LOG_DEFAULT_LEVEL=3
