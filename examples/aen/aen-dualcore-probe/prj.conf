#
# Minimal bench probe: a per-core global-SRAM0 beacon loop. Unlike the
# single-core peripheral examples (which now default to the Alp UART console),
# this probe deliberately keeps the RAM console: the load-bearing signal is the
# SRAM0 beacon read raw over SWD (master-agnostic, one buffer for both cores);
# the console is just an optional banner. Flow A (SES-booted dual ATOC).
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=1024
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=n
CONFIG_LOG=n

# Shared global-SRAM0 beacon is read/written by BOTH M55 cores, each with its
# own D-cache -> the region must be coherent. Disable the D-cache (the AEN
# SRAM-coherency precedent: the NPU apps do the same) so cross-core reads see
# the other core's writes without explicit clean/invalidate. (A cache-on variant
# would sys_cache_data_flush_range on the writer + invd_range on the reader.)
CONFIG_DCACHE=n
