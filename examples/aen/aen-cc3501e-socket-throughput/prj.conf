#
# Bench config for the CC3501E socket-throughput measurement on the
# E1M-AEN801 (Alif Ensemble E8, M55-HE). See src/main.c for what is measured
# and why the window is sized the way it is.

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; set explicitly here so the app is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead -- the same toggle every sibling AEN
# bench app documents (see aen-rtc-tick-probe's prj.conf for the fuller note):
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- CC3501E bridge (SPI1 + WIFI_EN/nRESET/READY GPIOs) -----------------------
# The host-side chip driver (chips/cc3501e/*.c) plus the two peripheral
# classes it rides on: SPI for the inter-chip link (bus 1 -> the alp-spi1
# alias this app's overlay adds) and GPIO for WIFI_EN / nRESET / READY.
# Kconfig already enforces `depends on SPI && GPIO`; both are set explicitly
# here because this app has no board.yaml `peripherals:` block to generate
# them -- it is a standalone Zephyr app (see CMakeLists.txt), same as
# aen-cc3501e-command-sweep. CONFIG_ALP_SDK_CHIP_CC3501E pulls in every
# chips/cc3501e/*.c TU (wifi/sockets/ble/gpio/spi/camera/power/ota/events),
# so this app can call cc3501e_wifi_connect()/cc3501e_sock_*() directly with
# no further Kconfig -- it never routes through the portable <alp/wifi.h>
# backend (CONFIG_ALP_SDK_WIFI_CC3501E), which attaches a DIFFERENT set of
# TUs this app has no use for.
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ALP_SDK=y
CONFIG_ALP_SDK_CHIP_CC3501E=y
# Pack 2 bytes per SPI FIFO slot on the polled bulk phases (#1725). The
# polled loop's MMIO accesses, not the 25 MHz wire, bound the bridge; the
# bits on the wire are identical. aen-cc3501e-bringup carries the same line.
CONFIG_SPI_DW_ALIF_PACK32=y

# CONFIG_ALP_SDK=y above defaults CONFIG_ALP_SDK_CONSOLE (zephyr/kconfigs/
# core.kconfig) to `y`, which `select`s CONFIG_SHELL -- pulling a `uart:~$`
# shell prompt into the middle of this app's own throughput transcript. This
# app never registers a shell command and never uses the `alp` console tree,
# so turn the console off explicitly rather than let its default drag the
# shell in unasked.
CONFIG_ALP_SDK_CONSOLE=n

# main()'s own locals + the HTTP header-scan state stay small: the recv
# buffer (SOCKTP_RECV_CEILING bytes, ~4 KB) and the cc3501e_t bridge handle
# (~32 KB, embeds several ALP_CC3501E_MAX_PAYLOAD scratch buffers) are BOTH
# STATIC in src/main.c, not automatic -- see that file's own header for why
# that discipline is load-bearing here, not optional: a sibling app in this
# tree died on its own prologue for exactly the mistake this app avoids by
# construction. 4096 matches aen-cc3501e-companion-tour, the other sibling
# that calls the socket API with the same static discipline.
CONFIG_MAIN_STACK_SIZE=4096

# Logging ON, deliberately -- a desynced SPI link reports its decisive fault
# via LOG_ERR in the upstream DesignWare SPI driver, and this app is a bench
# diagnostic, not a shipping image. LOG_MODE_MINIMAL keeps it deferred-free.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# --- Memory/cache and optimisation: this app measures the link, so build it
# the way a product would run it (#2052) --------------------------------------
# D-cache ON is the board default (the M55's CPU_HAS_DCACHE), and the host side
# of the bridge is CPU-bound without it: with the cache off the polled payload
# loop reads its source from uncached SRAM and a 4092-byte STREAM_WRITE frame
# takes 4.7 ms instead of 1.3 ms, so the whole link runs at ~560 KB/s instead of
# ~1.27 MB/s (E1M-AEN803 2026W36-0009, 2026-09-29).  Older notes kept it off for
# a D-cache maintenance hang and for comparability with earlier cache-off runs;
# dozens of cache-on cold boots of this app on 2026-09-28/29 showed no hang.
# NOTE: scripts/bench/aen/aen-bench-shared.conf still forces CONFIG_DCACHE=n
# for every bench flow, so a Flow C measurement run must pass
# -DCONFIG_DCACHE=y on the west command line to get this app's real number.
CONFIG_DCACHE=y
# -O2, not -Os: -Os links picolibc's size-optimised libc whose memcpy/memset
# are byte loops, which cost the bridge ~0.15 ms per 4 KiB request (#2052).
CONFIG_SPEED_OPTIMIZATIONS=y
