# SPDX-License-Identifier: Apache-2.0
#
# aen-temp-sensor -- on-module TMP112 read over the upstream Zephyr sensor API
# on the E1M-AEN801 (Alif Ensemble E8, M55-HE).

# --- Console -----------------------------------------------------------------
# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console. The board _defconfig already
# selects it; we set it explicitly here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- Sensor ------------------------------------------------------------------
# CONFIG_SENSOR turns on the sensor subsystem (sensor_sample_fetch_chan() /
# sensor_channel_get() / SENSOR_CHAN_AMBIENT_TEMP).
#
# CONFIG_TMP112 is deliberately NOT set here.  Upstream's Kconfig declares it
# `default y depends on DT_HAS_TI_TMP112_ENABLED`, so the driver switches
# itself on from the board layer's enabled "ti,tmp112" node and pulls
# CONFIG_I2C in with it (`select I2C`).  Writing `CONFIG_TMP112=y` by hand
# would ALSO make the build fail on any target that has no such node -- the
# assignment then has an unmet dependency, which Zephyr treats as a hard
# Kconfig warning.  Letting the DT drive it keeps one source of truth.
CONFIG_SENSOR=y
# The i2c_dw controller under the sensor needs PINCTRL for its pad config; the
# board's pinctrl-0 pulls it in, set here for clarity.
CONFIG_PINCTRL=y

# --- Logging -----------------------------------------------------------------
# ON, deliberately.  Upstream tmp112_init() reports its failures through
# LOG_ERR ("Failed to set configuration (%d)"), and that line is the first
# concrete evidence when the sensor does not ACK.  With CONFIG_LOG=n it is
# compiled out and the app can only report "not ready" without the errno
# behind it.  LOG_MODE_MINIMAL keeps logging deferred-free, so nothing is
# lost if the app returns from main() before a log thread would have flushed.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# --- Link address ------------------------------------------------------------
# Link the app at the HE MRAM app partition (0x80010000) so its vector table
# matches the ATOC load address (app-zephyr-he.json mramAddress=0x80010000).
# FLASH_BASE is the full MRAM (0x80000000); without this 0x10000 offset the
# image links at 0x80000000 and the SES boots it 64 KB low -> fault/no-boot.
# This is a flashed Flow A / slot0 target, not an ITCM RAM-run -- for Flow C,
# add scripts/bench/aen/aen-flowc-itcm.{conf,overlay} on the build command
# line rather than editing this file.
CONFIG_FLASH_LOAD_OFFSET=0x10000
