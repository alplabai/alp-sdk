# SPDX-License-Identifier: Apache-2.0
#
# Build-only presence/clock probe of the HE-core-local Ethos-U55 (128-MAC) on
# the E1M-AEN801 (Ensemble E8, M55-HE).  Sibling of aen-npu-ethosu-regcheck
# (which targets the global Ethos-U85 @ 0x49042000); the U85 and U55 are a
# single Kconfig `choice`, so they are SEPARATE builds.  vendor-ext,
# BENCH (re-)VERIFICATION target -- ID reads back 0x10104201 (arch 1.1.0,
# product=U55).
#
# hal_ethos_u is already an unconditional west.yml group (issue #1076 Q2), so
# no extra module wiring is needed here.  Compile-checks the driver + DT node
# on the real E8 board target; filtered OUT of the native_sim PR gate
# (platform_allow = the AEN801 HE board only).

sample:
  name: aen-npu-ethosu55-regcheck
  description: |
    Bench RAM-run Ethos-U55 (128-MAC, HE-core-local @0x400e1000) presence/
    clock probe for the E1M-AEN801 (Alif Ensemble E8, Cortex-M55-HE) through
    the Arm Ethos-U core driver.  vendor-ext, BENCH (re-)VERIFICATION target.

tests:
  alp_sdk.examples.aen.npu_ethosu55_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - npu
      - ethos-u
    build_only: true   # the U55 ID-register probe is a bench flash, not a CI run.
