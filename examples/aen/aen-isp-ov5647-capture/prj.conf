# SPDX-License-Identifier: Apache-2.0
#
# Bench RAM-run config for the E1M-AEN801/AEN803 (M55-HE).
#
# The ISP-Pico bring-up: a REAL OV5647 frame through the ISP
# (sensor -> csi -> cam -> isp -> memory), mirroring Alif's own sdk-alif
# samples/drivers/viewfinder recipe, with AE + AWB running through
# isp_pico.c's standard Zephyr video ctrl path -- see boards/*.overlay and
# src/main.c.

CONFIG_ALP_SDK=y

# Video subsystem: CONFIG_VIDEO=y enables the v4.4 video_* API and, with it,
# every driver Kconfig default-y'd under its DT_HAS_*_ENABLED -- the CSI-2
# D-PHY (CONFIG_MIPI_DPHY_DW), the DesignWare CSI-2 bridge
# (CONFIG_VIDEO_MIPI_CSI2_DW), the Alif CPI capture controller
# (CONFIG_VIDEO_ALIF_CAM), the OV5647 sensor driver (CONFIG_VIDEO_OV5647,
# which itself `select`s CONFIG_I2C), and the ISP-Pico driver
# (CONFIG_VIDEO_ISP_VSI, its DT node enabled by this example's board
# overlays).
CONFIG_VIDEO=y
CONFIG_VIDEO_ISP_VSI=y
# Frame-end IRQ counter (isp_mi_frame_end_count) -- off by default in the
# driver (debug-only instrumentation); this bench example reports it.
CONFIG_VIDEO_ISP_VSI_FRAME_STATS=y

# Stage 4 (run 70/71 follow-up): WB + WBM added on top of Alif's own
# DMSC+SCALAR+CSM set (SCALAR/DMSC/CSM proved the pipeline runs end to end;
# run 70/71's bench frames showed chroma present but weak with a colour
# cast when amplified -- AWB is the next thing to prove).  WB is the
# white-balance GAIN application, WBM its MEASUREMENT stage -- both are
# needed together for the AWB loop to run at all: the wrapper's
# VSI_MPI_ISP_AwbRegCallBack() registration (isp_api_wrapper.c:386-392) is
# gated ONLY on CONFIG_ISP_LIB_WB_MODULE, and isp_wrapper/inc/isp_conf.h's
# ISP_WBM_V10 needed this branch's hal_alif patch
# (0004-isp-fix-wbm-v10-config-prefix.patch) to even respond to the
# Kconfig at all (it checked the unprefixed ISP_LIB_WBM_MODULE, which
# Kconfig never defines). CCM (colour correction matrix, a separate
# downstream colour-crosstalk correction) is NOT required for AWB itself --
# checked isp_api_wrapper.c: AwbRegCallBack's gate names only
# CONFIG_ISP_LIB_WB_MODULE, no CCM dependency -- so it stays off for this
# stage, added later alongside gamma (CONFIG_ISP_LIB_GAMMAOUT_MODULE) if a
# full colour pipeline is needed.
CONFIG_ISP_LIB_SCALAR_MODULE=y
CONFIG_ISP_LIB_DMSC_MODULE=y
CONFIG_ISP_LIB_CSM_MODULE=y
CONFIG_ISP_LIB_WB_MODULE=y
CONFIG_ISP_LIB_WBM_MODULE=y

# Stage 5 (run 74 follow-up, task B/C): AE (auto exposure/gain, its
# EXPOSUREM measurement stage) and colour output (GAMMAOUT). AE needs this
# branch's hal_alif patches 0005 (ports isp_vsi_bottom_half()'s sensor
# write-back to the v4.4 struct video_control API, unreachable before now
# the same way WB's registration was) and 0006 (OV5647's real
# exposure-line/gain-register facts instead of a generic placeholder
# sensor). Gamma uses isp_param_conf.h's own default curve (the lib's own
# table, not a new calibration).
CONFIG_ISP_LIB_AE_MODULE=y
CONFIG_ISP_LIB_EXPOSUREM_MODULE=y
CONFIG_ISP_LIB_GAMMAOUT_MODULE=y

# CCM off (runs 163/164): patch 0008's RPi-derived OV5647 CCM (the ONE
# place isp_param_conf.h's illuminant table lives, isp_pico.c only flips
# enable/op_mode via isp_apply_wb()) added a blue cast on this INNO-MAKER
# module -- run 163 (CCM on) centre RGB [121 127 142] vs run 164 (CCM off,
# same frame) centre RGB [128 126 135], with AWB post-gain stats already
# neutral in both (R/G/B 87/86/86 vs 89/87/85). Stays off until a grey-card
# calibration replaces patch 0008's table. See changelog.d/2252.md.
# CONFIG_ISP_LIB_CCM_MODULE is not set
# BLS (black-level subtraction): bench run 140 found CONFIG_ISP_LIB_BLS_MODULE
# unset, so isp_param_conf.h's compiled-in .bls block (64, the sensor's 10-bit
# black pedestal -- unrelated to the OV5647-vs-ARX3A0 AWB/CCM split above,
# both sensors share the same 10-bit RAW pedestal) never gets loaded, biasing
# every downstream stat. isp_param_conf.h's .bls.enable is already 1 in the
# struct literal, and patch 0007's SetCalib guard loads the WHOLE
# isp_calib_param blob (including .bls, gated only by this Kconfig) once at
# stream start -- no separate wrapper init call needed.
CONFIG_ISP_LIB_BLS_MODULE=y
# BINNING/FLT deliberately still OFF -- the full ISP_LIB_*_MODULE list
# (hal_alif's drivers/isp/Kconfig) is SCALAR, AE, WB, BINNING, BLS, DMSC,
# FLT, CCM, GAMMAOUT, EXPOSUREM, CSM, WBM.

# This bench app drives the RAW Zephyr video API directly (ISP INPUT/OUTPUT
# formats, not the portable <alp/camera.h> dispatcher), so turn OFF
# CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO (default y if VIDEO): its portable
# backend expects a bound video device wired the ordinary (ISP-less) way,
# not what this app validates.
CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO=n

# Software CRC32 (crc32_ieee(), zephyr/subsys/crc/) for the captured frame's
# checksum -- this is the subsys/crc software library, not the hardware
# CRC_DRIVER class (unneeded here; this runs once per bench boot).
CONFIG_CRC=y

# The captured frame is 640x480 YUV420 planar = 460,800 bytes (width * height
# * 3/2), and this app allocates TWO of them -- 921,600 bytes total.  Far
# bigger than the HE core's 256 KB local DTCM the video buffer pool defaults
# into (and the CPI/ISP's AXI DMA master cannot reach core-local DTCM at all
# regardless of size -- same reachability gap aen-camera-firstlight's
# prj.conf documents).  Move the pool into the global on-chip SRAM0 bank
# (4 MiB @ 0x02000000, AXI-visible, declared by the SoC dtsi's sram0 node)
# instead -- do NOT use SRAM1 (0x02400000): it BUS-FAULTS on this
# silicon/batch.
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM0"
# The pool is a sys_heap.  With the kernel's SRAM being the 256 KB DTCM,
# Zephyr defaults to SYS_HEAP_SMALL_ONLY, whose heaps top out at 262136
# bytes -- far short of the (default 2 MiB) pool this needs.  AUTO sizes
# each heap's chunk headers to fit it, so the small kernel heaps keep their
# compact form.  The default CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE (2 MiB) and
# CONFIG_VIDEO_BUFFER_POOL_NUM_MAX (2) are untouched: this app allocates
# exactly 2 buffers (matching Alif's own N_FRAMES), 921,600 bytes total,
# which fits comfortably.
CONFIG_SYS_HEAP_AUTO=y

# A 19-arg printk once overflowed main()'s default stack; this app's own
# frame-summary printing stays well under that, but size generously anyway.
CONFIG_MAIN_STACK_SIZE=8192

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801/AEN803 carrier console. The board _defconfig
# already selects it; we set it explicitly here so the example is
# self-describing for a standalone (non-bench-conf) build.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench (Flow C ITCM RAM-run)? Don't hand-toggle these -- layer
# scripts/bench/aen/aen-bench-shared.conf via -DEXTRA_CONF_FILE instead (see
# that file for why: UART5 does not route Flow C output on this bench).  It
# sets CONFIG_RAM_CONSOLE=y / CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384 /
# CONFIG_UART_CONSOLE=n, applied AFTER this file so its values win.
CONFIG_PRINTK=y

# Logging ON, deliberately -- same reasoning as aen-isp-regcheck's prj.conf:
# this is a brand-new pipeline (real sensor + CSI + CPI + ISP all at once),
# and isp_pico.c / the hal_alif isp_wrapper / video_alif.c / video_csi_dw.c
# all carry LOG_ERR lines naming exactly which call failed.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_VIDEO_LOG_LEVEL_ERR=y
# Every OTHER subsystem's logging stays off (CONFIG_VIDEO_LOG_LEVEL_ERR above
# is a per-module override, independent of this default) -- keeps the image
# small + the RAM console's 16 KiB budget for this app's own output, not
# unrelated kernel/driver chatter.
CONFIG_LOG_DEFAULT_LEVEL=0
