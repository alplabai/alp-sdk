#
# CONFIG_SPI / CONFIG_GPIO are pulled in from board.yaml's `peripherals:`
# block (via the generated alp.conf); this file carries only the console.
CONFIG_PRINTK=y
CONFIG_LOG=y

# The reset sequence + soak use busy/sleep waits; a generous main-thread
# stack keeps the (modest) driver scratch buffers comfortable.
CONFIG_MAIN_STACK_SIZE=4096

# Link the app at the HE MRAM app partition (0x80010000) so its vector table
# matches the ATOC load address (app-zephyr-he.json mramAddress=0x80010000).
# FLASH_BASE is the full MRAM (0x80000000); without this 0x10000 offset the
# image links at 0x80000000 and the SES boots it 64 KB low -> fault/no-boot.
# (Bench recovery 2026-06-16 after a --pristine rebuild reset FLASH_LOAD_OFFSET.)
CONFIG_FLASH_LOAD_OFFSET=0x10000

# Route the proxied E1M IOs (cc3501e_gpio_routes[] in src/cc3501e_gpio_routes.c)
# through the CC3501E bridge: alp_gpio_open(ALP_E1M_GPIO_IOxx) for a mapped IO goes over
# the inter-chip link; the Alif's own pins delegate to the platform GPIO driver.
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# Host-side peripheral DMA for continuous SPI streams (CC3501E bridge).
# Vendored peripheral-flow PL330 + event-router mux + the spi_dw_alif DMA path.
CONFIG_DMA=y
CONFIG_DMA_PL330_ALIF=y
CONFIG_DMA_ALIF_EVENT_ROUTER=y
CONFIG_SPI_DW_ALIF_USE_DMA=y
# KEEP THIS ABOVE THE BRIDGE FRAME SIZE.  Silicon-measured 2026-08-23 on
# e1m-aen-evk-01: at 64 the 512-byte CC3501E request-payload phase took the DMA
# path and cost 15723 us against 286 us of wire time at ~14.3 MHz -- 55x -- and
# then FAILED, so 2156 of 2157 OTA_WRITEs lost their reply and had to be
# recovered by polling OTA_STATUS to discover the chunk had landed anyway.  The
# 4-byte header phases stayed on PIO and cost 15 us, which is what made the
# DMA path identifiable at all.
#
# Above the frame size every phase is PIO: the payload phase drops to 256 us
# (i.e. wire speed), 2156 of 2157 writes ack cleanly, and a full 1095276 B OTA
# goes from 101 s to 8 s -- ~10.8 kB/s to ~137 kB/s.
#
# The underlying spi_dw DMA defect is NOT fixed by this; it is avoided.  Anything
# that raises ALP_CC3501E_MAX_PAYLOAD must raise this too.
CONFIG_SPI_DW_ALIF_DMA_MIN_LEN=2048
