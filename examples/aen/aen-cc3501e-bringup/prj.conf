#
# CONFIG_SPI / CONFIG_GPIO are pulled in from board.yaml's `peripherals:`
# block (via the generated alp.conf); this file carries only the console.
CONFIG_PRINTK=y
CONFIG_LOG=y

# The reset sequence + soak use busy/sleep waits; a generous main-thread
# stack keeps the (modest) driver scratch buffers comfortable.
CONFIG_MAIN_STACK_SIZE=32768

# Link the app at the HE MRAM app partition (0x80010000) so its vector table
# matches the ATOC load address (app-zephyr-he.json mramAddress=0x80010000).
# FLASH_BASE is the full MRAM (0x80000000); without this 0x10000 offset the
# image links at 0x80000000 and the SES boots it 64 KB low -> fault/no-boot.
# (Bench recovery 2026-06-16 after a --pristine rebuild reset FLASH_LOAD_OFFSET.)
CONFIG_FLASH_LOAD_OFFSET=0x10000

# Route the proxied E1M IOs (cc3501e_gpio_routes[] in src/cc3501e_gpio_routes.c)
# through the CC3501E bridge: alp_gpio_open(ALP_E1M_GPIO_IOxx) for a mapped IO goes over
# the inter-chip link; the Alif's own pins delegate to the platform GPIO driver.
CONFIG_ALP_SDK_GPIO_CC3501E_PROXY=y

# Host-side peripheral DMA for continuous SPI streams (CC3501E bridge).
# Vendored peripheral-flow PL330 + event-router mux + the spi_dw_alif DMA path.
CONFIG_DMA=y
CONFIG_DMA_PL330_ALIF=y
CONFIG_DMA_ALIF_EVENT_ROUTER=y
CONFIG_SPI_DW_ALIF_USE_DMA=y
# KEEP THIS ABOVE THE BRIDGE FRAME SIZE.  Silicon-measured 2026-08-23 on
# e1m-aen-evk-01: at 64 the 512-byte CC3501E request-payload phase took the DMA
# path and cost 15723 us against 286 us of wire time at ~14.3 MHz -- 55x -- and
# then FAILED, so 2156 of 2157 OTA_WRITEs lost their reply and had to be
# recovered by polling OTA_STATUS to discover the chunk had landed anyway.  The
# 4-byte header phases stayed on PIO and cost 15 us, which is what made the
# DMA path identifiable at all.
#
# Above the frame size every phase is PIO: the payload phase drops to 256 us
# (i.e. wire speed), 2156 of 2157 writes ack cleanly, and a full 1095276 B OTA
# goes from 101 s to 8 s -- ~10.8 kB/s to ~137 kB/s.
#
# The underlying spi_dw DMA defect is NOT fixed by this; it is avoided.  Anything
# that raises ALP_CC3501E_MAX_PAYLOAD must raise this too.
# KEEP THIS ABOVE THE BRIDGE FRAME SIZE -- every phase stays on PIO.
#
# Two genuine DMA defects were found and FIXED while chasing throughput (an odd
# transfer length collapsed the burst to 1, i.e. one DMA transaction per BYTE;
# and every transfer rebuilt the PL330 microcode instead of reloading the
# existing descriptor).  With both fixed DMA went 113 kB/s -> 702 kB/s and
# actually BEAT PIO's 657-678 kB/s on socket traffic.
#
# It still stays off, because OTA breaks on it.  Silicon-measured 2026-08-24:
# with payloads on DMA, OTA_WRITE returns -5 and the device latches ERROR at
# off=2044 (`OTA -> -5 ... signed image did NOT stage`); with every phase on PIO
# the same build streams the full 1095276 B image -- `OTA all 1095276 B accepted
# -- FINISH`, `OTA finish -> 0`, 8133 ms.  So a THIRD DMA problem remains,
# specific to the OTA path, and it is not worth 7% of socket throughput.
#
# A size threshold cannot split the two AT TODAY'S SIZES -- but not for the
# reason this comment used to give, and the difference matters to anyone
# re-deriving the decision.
#
# It used to read: "socket replies are ~1732 B and OTA writes are 2044 B, so
# keeping OTA on PIO while socket takes DMA would need a threshold both <=1732
# and >2044".  Those figures are from when ALP_CC3501E_MAX_PAYLOAD was 2048.
# It is 4096 now and both moved with it:
#   socket reply: want_max = MAX_PAYLOAD - CC3501E_SOCK_RECV_RESP_HDR - 1
#                 = 4096 - 24 - 1 = 4071 data bytes, ~4095 B on the wire
#   OTA write:    the CALLER picks the chunk; aen-cc3501e-bringup picks the max,
#                 ALP_CC3501E_OTA_MAX_CHUNK = MAX_PAYLOAD - 4 = 4092, ~4096 B
# So they are ~4095 vs ~4096 -- effectively identical, not 1732 vs 2044.
#
# That also shows the way out, because the two sizes are NOT equally fixed.
# The socket reply size is bounded by MAX_PAYLOAD and wants to be large; the
# OTA chunk is only capped by MAX_CHUNK and is free to shrink.  Silicon-measured
# 2026-08-26 with the OTA chunk at 1024 (~1028 B on the wire) and this threshold
# at 2048, so socket replies take DMA and every OTA write stays on PIO:
#
#   socket throughput  782205 B/s -> 858514 B/s   (+9.8%, 3 samples each)
#   full 1095900 B OTA 8.1 s      -> 16.1 s       (2.0x slower)
#   link health        ping_fail=0 both ways
#   #1123 staged FINISH-then-ABORT proof: still PASS on the DMA build
#
# The OTA path is byte-for-byte unchanged there -- its writes never reach the
# threshold -- which is why the #1123 proof still passes.  No driver change, no
# public API change, no per-transfer flag: one caller-side constant and this
# value.
#
# NOT taken, deliberately: doubling update time to gain ~10% on socket streams
# is a per-deployment judgement, not an engineering one.  Both numbers are
# recorded so it can be decided rather than re-measured.  See #1677.
#
# #1818 investigation, 2026-09-02 (root cause NOT established -- do not lower
# this on the strength of what follows without a fresh bench run):
#
# The DMASTP src_id/dst_id operand fix (dma_pl330_alif.c, this issue) is real
# but was PROVEN behaviour-neutral on silicon -- see that file's comment and
# #1818's own bench log.
#
# Re-reading the PL330 microcode generator and the DW_SSI/event-router wiring
# for a SECOND defect found that spi_dw_dma_setup_tx_channel() wrote DMATDLR
# from the UNREDUCED half-FIFO default while separately computing a possibly
# SMALLER burst_length for the PL330 dma_cfg -- disagreeing for a dummy-TX
# chunk (reached when a supplied tx_buf_set's current buffer has
# `buf == NULL`, or its buffers are exhausted while RX continues -- never for
# an RX-only transfer, which does not call this function at all) or for a
# chunk that does not divide the default burst evenly, which
# ALP_CC3501E_OTA_MAX_CHUNK (4092) is: 4092 % 8 != 0.  A first pass made the
# two match by writing burst_length into DMATDLR instead; that was REVERTED
# on review, because DMATDLR is a LOW WATERMARK, not a burst count -- it
# asserts dma_tx_req once the TX FIFO holds <= DMATDLR entries, and the only
# hardware constraint is DMATDLR + burst <= fifo_depth.  With fifo_depth=16
# (zephyr/dts/alif/ensemble_e8_peripherals.dtsi) the existing DMATDLR=8 with
# burst<=8 already satisfied that; moving DMATDLR to 4 (the OTA tail) or 1
# (a dummy-TX chunk) instead makes the PL330 refill in much smaller
# increments against a DW_apb_ssi master that gates SCLK on TX underrun --
# an unproven, potentially-regressive behavioural change with no bench
# evidence either way, so it was not made.  DMATDLR now stays the unreduced
# default (see spi_dw_alif.c, spi_dw_alif_dma_burst.h); the extracted,
# host-tested burst-length calculation the #1818 pass left behind is kept --
# it only feeds the PL330 dma_cfg, which does need to match the actual
# burst, unlike DMATDLR.
#
# Also corrected in that pass: ALP_CC3501E_OTA_MAX_CHUNK (4092) never itself
# reaches spi_dw_dma_setup_tx_channel() as a chunk -- the bulk/tail split in
# spi_dw_dma_transceive() (zephyr/drivers/spi/spi_dw_alif.c) aligns it down
# to a 4088 B bulk chunk first, leaving a separate 4-item tail chunk.
#
# A second candidate was examined and NOT acted on: cc3501e_t's rx_scratch/
# tx_scratch/*_scan_buf/sock_buf fields (include/alp/chips/cc3501e/core.h) are
# plain adjacent uint8_t arrays with no cache-line alignment or padding, and
# Zephyr's sys_cache_data_invd_range() contract is explicit that a
# partially-covered line is invalidated in full (also written down at
# include/alp/peripheral.h's "DMA and the data cache" section, added by
# #1830).  That is a latent hazard once DMA is used below
# ALP_CC3501E_MAX_PAYLOAD (4096) -- currently never, since MIN_LEN stays above
# it -- but socket traffic reportedly reached 702 kB/s over DMA through this
# exact rx_scratch buffer via the identical cc3501e_request_locked() code
# path, which argues against it being what selectively breaks OTA_WRITE.  Not
# fixed here: no struct-layout/offset evidence was gathered (would need a
# compiled build, not available in this investigation), and restructuring a
# public driver context's buffer layout on that strength would be a guess.
#
# At this MIN_LEN (8192), DMA is not merely gating OTA_WRITE: the CC3501E's
# largest single transceive is ALP_CC3501E_MAX_PAYLOAD = 4096
# (include/alp/protocol/cc3501e.h), always below 8192, so DMA is disabled for
# EVERY CC3501E SPI transfer this example makes, not just OTA writes.
#
# What is still unknown: a concrete, silicon-observed explanation for why the
# bridge's actual OTA_WRITE traffic -- not a synthetic round-size probe --
# either times out or corrupts data on the DMA TX path below this threshold.
# See #1818 for history; the next bench step is a register dump of
# DBGSTATUS/FSRC/CS0 and a scope trace of DMA_TX_REQ/DMA_TX_ACK on a real,
# non-power-of-two OTA_WRITE chunk.
#
# Also open, and not resolvable from source reading alone:
# spi_dw_dma_enable_channels() (zephyr/drivers/spi/spi_dw_alif.c) clears
# SSIENR, writes DMACR, then sets SSIENR again before returning -- so every
# write_dmatdlr() / write_dmardlr() call in spi_dw_dma_setup_tx_channel() /
# _rx_channel() executes with the controller already enabled.  Whether the
# DW_apb_ssi honours a watermark-register write in that state is unverified;
# one bench read-back via the driver's existing read_dmatdlr()/read_dmardlr()
# helpers, immediately after the write, would settle it.  Do not assume
# either answer.
CONFIG_SPI_DW_ALIF_DMA_MIN_LEN=8192

# perf(#1677): pack 2 bytes per FIFO slot on the polled bulk phases.  The DR
# shifts MSB-first, so writing the stream's next bytes big-endian into a
# 16-bit frame puts exactly the same bits on the wire as two 8-bit frames --
# the peer cannot tell.  What it buys is MMIO accesses, which are what the
# polled loop actually costs: measured 912 -> 1139 KB/s on e1m-aen-evk-01.
CONFIG_SPI_DW_ALIF_PACK32=y
