# SPDX-License-Identifier: Apache-2.0
#
# Bench RAM-run config for the E1M-AEN801/AEN803 (M55-HE).
#
# Stage 1 ("ISP alive, MI writes"): drives one real TPG-sourced frame through
# the ISP's MI (memory interface) DMA -- see src/main.c and the board
# overlays' tpg-* properties.

# Tier-2 driver Kconfigs (incl. the CONFIG_VIDEO_ISP_VSI family) are gated under
# ALP_SDK.
CONFIG_ALP_SDK=y

# This regcheck is specifically for E1M-AEN801 / Ensemble E8.
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E8=y

# Video subsystem (the portable Zephyr v4.4 video API: video_get_caps).
# CONFIG_VIDEO=y makes the video class + its inline helpers available.
CONFIG_VIDEO=y

# CONFIG_VIDEO_ISP_VSI=y builds + links the isp_pico.c driver TU against
# hal_alif v2.3.0 (west.yml pinned) + the vendored isp-vsi.h / isp_ctrl_params.h
# headers (zephyr/include/zephyr/drivers/video/, ADR 0017 Tier-2).  Stage 1
# proves this builds+links AND actually streams: the board overlays enable the
# TPG, and src/main.c drives a real capture -- see its file header.
#
# AEN-only board scope: this example has no native_sim scenario (single AEN
# board overlay, no testcase.yaml), so CONFIG_VIDEO_ISP_VSI belongs safely in
# this shared prj.conf -- there is no other platform build to break.
CONFIG_VIDEO_ISP_VSI=y
# Review round (post-3511cd180): isp_mi_frame_end_count is now gated behind
# this Kconfig (off by default -- debug-only instrumentation); this example
# references it (src/main.c) so needs it explicitly on.
CONFIG_VIDEO_ISP_VSI_FRAME_STATS=y

# Run 66: the hal_alif ISP library rejects a Bayer OUTPUT format --
# isp_pixelfmt_from_fourcc() (isp_api_wrapper.c) maps every VIDEO_PIX_FMT_
# {B,G}*{8,10,12} straight to a Bayer PIXEL_FORMAT_*, valid on the INPUT
# port but rejected by VSI_MPI_ISP_SetChnAttr on the OUTPUT channel (see
# the comment above isp_pico.c's supported_output_fmts[]).  10-bit raw
# passthrough is impossible through this wrapper as shipped (no fourcc maps
# to PIXEL_FORMAT_RAW10 -- see isp_pico.c's "PLANNED FIX" comment above
# isp_stream_start()).  This stage now requests YUYV output instead (Alif's
# own DFP default MI output format, RTE_Device.h RTE_ISP_OUTPUT_FORMAT=32 ==
# PIXEL_FORMAT_YUYV) -- src/main.c -- which needs the demosaic (Bayer->YUV)
# + colour pipeline actually enabled, so build with Alif's own
# vendor-validated module set (stage 0 already proved this set links):
CONFIG_ISP_LIB_DMSC_MODULE=y
CONFIG_ISP_LIB_CCM_MODULE=y
CONFIG_ISP_LIB_WB_MODULE=y
CONFIG_ISP_LIB_WBM_MODULE=y
CONFIG_ISP_LIB_SCALAR_MODULE=y

# This bench app drives the RAW Zephyr video API directly, so turn OFF the alp
# <alp/camera.h> dispatcher: CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO is `default y if
# VIDEO`, and its portable backend expects a bound video device (absent here),
# which is not what we are validating.
CONFIG_ALP_SDK_CAMERA_ZEPHYR_VIDEO=n

# Software CRC32 (crc32_ieee(), zephyr/subsys/crc/) for the captured frame's
# checksum -- this is the subsys/crc software library, not the hardware
# CRC_DRIVER class (unneeded here; this runs once per bench boot).
CONFIG_CRC=y

# The captured frame is 1280x720 packed YUYV = 1,843,200 bytes (same size as
# the SBGGR10 this stage originally targeted -- both are 2 bytes/pixel) --
# far bigger than the HE core's 256 KB local DTCM the video buffer pool defaults
# into (and the CPI/ISP's AXI DMA master cannot reach core-local DTCM at all
# regardless of size -- same reachability gap aen-camera-firstlight's prj.conf
# documents).  Move the pool into the global on-chip SRAM0 bank (4 MiB @
# 0x02000000, AXI-visible, declared by the SoC dtsi's sram0 node) instead --
# do NOT use SRAM1 (0x02400000): it BUS-FAULTS on this silicon/batch.
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM0"
# The pool is a sys_heap.  With the kernel's SRAM being the 256 KB DTCM,
# Zephyr defaults to SYS_HEAP_SMALL_ONLY, whose heaps top out at 262136
# bytes -- far short of the (default 2 MiB) pool this needs.  AUTO sizes
# each heap's chunk headers to fit it, so the small kernel heaps keep their
# compact form.  The default CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE (2 MiB) and
# CONFIG_VIDEO_BUFFER_POOL_NUM_MAX (2) are untouched: this app allocates only
# ONE 1,843,200-byte buffer, which fits comfortably.
CONFIG_SYS_HEAP_AUTO=y

# A 19-arg printk once overflowed main()'s default stack; this app's own
# frame-summary printing stays well under that, but size generously anyway.
CONFIG_MAIN_STACK_SIZE=8192

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801/AEN803 carrier console. The board _defconfig
# already selects it; we set it explicitly here so the example is
# self-describing for a standalone (non-bench-conf) build.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench (Flow C ITCM RAM-run)? Don't hand-toggle these -- layer
# scripts/bench/aen/aen-bench-shared.conf via -DEXTRA_CONF_FILE instead (see
# that file for why: UART5 does not route Flow C output on this bench).  It
# sets CONFIG_RAM_CONSOLE=y / CONFIG_RAM_CONSOLE_BUFFER_SIZE=16384 /
# CONFIG_UART_CONSOLE=n, applied AFTER this file so its values win.  This
# app's frame + CRC + ISR-count report is short enough to fit that shared
# 16 KiB buffer; raising it further is unnecessary here.
CONFIG_PRINTK=y

# Logging ON, deliberately -- video_stream_start()'s -EINVAL (run 65) proved
# opaque with logging off: isp_pico.c's isp_stream_start()/isp_vsi_* call
# sites AND the hal_alif isp_wrapper (isp_api_wrapper.c, LOG_MODULE_REGISTER
# under the SAME CONFIG_VIDEO_LOG_LEVEL) both carry LOG_ERR lines naming
# exactly which call failed -- useless if compiled out.  LOG_MODE_MINIMAL
# keeps it deferred-free (same pattern as examples/aen/aen-bmi323-regcheck
# and examples/aen/aen-brd-i2c-scan's prj.conf).  ERR-only (not DBG): the
# RAM console is bench-observed at 16384 bytes (aen-bench-shared.conf); ERR
# is enough to pin the failing step without risking an overrun.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_VIDEO_LOG_LEVEL_ERR=y
