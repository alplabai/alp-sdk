# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression (in CI) for the Alif ISP-Pico (Verisilicon ISP Nano
# "Pico", zephyr/drivers/video/isp_pico.c, "vsi,isp-pico") on the
# E1M-AEN801/AEN803 (Ensemble E8, M55-HE).  CI only compile-checks the
# driver + DT node -- there is no silicon in the runner -- but this image is
# a real bench capture on the actual hardware: the board overlays enable the
# ISP's Test-Pattern Generator (no camera sensor is wired on this hardware
# batch; the TPG needs none), and src/main.c drives one real frame through
# the ISP's MI DMA.
#
# Filtered OUT of the native_sim PR gate (platform_allow = the AEN801 +
# AEN803 HE boards).

sample:
  name: aen-isp-regcheck
  description: |
    Bench RAM-run ISP-Pico (vsi,isp-pico) TPG capture for the E1M-AEN801/803
    (Alif Ensemble E8, Cortex-M55-HE): compiles + links isp_pico.c against
    hal_alif's vendored ISP headers, and on real hardware streams one
    TPG-sourced frame through the ISP's MI DMA (IRQ 368) to a CRC32'd SRAM0
    buffer.  CI only proves the build; no camera sensor is wired.

tests:
  alp_sdk.examples.aen.isp_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
      - alp_e1m_aen803_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - isp
      - video
      - camera
    build_only: true   # the ISP-Pico build check is a bench flash, not a CI run.
