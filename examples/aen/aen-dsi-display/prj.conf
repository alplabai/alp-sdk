#
# Bench RAM-run config for the E1M-AEN (M55-HE) DSI-display app.  The app UART
# is NOT on USB on this bench, so the console is the RAM console (read
# 'ram_console_buf' over SWD).

# The display-chain drivers (CDC200, DesignWare DSI host + D-PHY) are alp-sdk
# ADR 0017 Tier-2 copies, defined under ALP_SDK.
CONFIG_ALP_SDK=y

# --- The display chain -------------------------------------------------------
# Nothing to set here: the e1m_evk_rk055hdmipi4ma0 shield (CMakeLists.txt)
# defaults on DISPLAY, MIPI_DSI(+_DW), MIPI_DPHY(+_DW), DISPLAY_CDC200, the
# HX8394 panel driver, I2C + GPIO + GPIO_PCA_SERIES for the panel-control
# expander, and REGULATOR(+_FIXED) for the panel-enable supply.  None of the
# chain's drivers allocates from the system heap.  Their default init
# priorities already give the order the chain needs: I2C bus, then expander
# (same level, after it by devicetree dependency), fixed regulator (75), DSI
# host + CDC (85), panel (90).

# --- SoM identity EEPROM (boot banner shows live SKU + hw-rev) ------------
# 24C128 manifest on I2C2 @0x50, mapped to portable bus alp-i2c0 (board DT).
# alp_hw_info_read() (called by the SDK banner) reads + CRC-checks the 128-byte
# manifest; on a blank/absent EEPROM it returns NOT_PROVISIONED and the banner
# falls back to CONFIG_BOARD -- never fatal.
CONFIG_ALP_SDK_HW_INFO=y
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0
CONFIG_ALP_SDK_HW_INFO_EEPROM_ADDR_7BIT=0x50

# --- RAM console (no app UART on USB on this bench) -----------------------
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# LOG MUST stay off on the RAM-console bench: CONFIG_LOG=y reroutes printk into
# the logging subsystem (no RAM-console backend), so output never lands in
# 'ram_console_buf'.
CONFIG_LOG=n

# The bench diagnostics (I2C scan, DCS probe table, per-stage printk) need a
# roomier main stack than the default.
CONFIG_MAIN_STACK_SIZE=4096
