# Single-core TrustZone-M enforced append. Beacon-driven; RAM console fallback.
# ITCM-linked by the boards/*.overlay for a non-destructive Flow C RAM-run. To
# SES-boot it via Flow D instead, just drop that overlay: the board _defconfig
# links into slot0 by default (reset vector 0x8001xxxx).
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=1024
CONFIG_UART_CONSOLE=n
CONFIG_ARM_MPU=n
# E8 D-cache maintenance loop hangs on this silicon (shared bench rule); and
# the SRAM0 beacon (see src/main.c) is AP-read over SWD, so keep the D-cache
# off so a cached beacon write isn't unseen by the AXI-AP read.
CONFIG_DCACHE=n
