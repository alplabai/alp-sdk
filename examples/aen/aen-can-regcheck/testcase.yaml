#
# Build-only regression for the Alif CAN-FD controller staging
# (zephyr/drivers/can/can_cast.c "cast,can") on the E1M-AEN801 (Ensemble E8,
# M55-HE).  Live bus traffic is HW-blocked this batch (no CAN transceiver
# wired); this proves the driver + alp_can0 alias bind.
#
# Compile-checks the driver + DT node on the real E8 board target; filtered OUT
# of the native_sim PR gate (platform_allow = the AEN801 HE board only).

sample:
  name: aen-can-regcheck
  description: |
    Bench RAM-run CAN-FD (cast,can) bind proof for the E1M-AEN801 (Alif
    Ensemble E8, Cortex-M55-HE): binds can0@49036000 via the vendored Tier-2
    can_cast driver and confirms the alp_can0 alias resolves.  Live bus
    traffic is HW-blocked this batch (no transceiver wired).

tests:
  alp_sdk.examples.aen.can_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - can
    build_only: true   # the CAN bind check is a bench flash, not a CI run.
