# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the upstream ARM PL330 DMA controller (ADR 0017
# Tier-1, drivers/dma/dma_pl330.c, "arm,dma-pl330") on the E1M-AEN801
# (Ensemble E8, M55-HE).  Unlike the bind-only *-regcheck siblings, this app
# runs a real memory-to-memory copy through the PL330 and verifies the bytes.
#
# Compile-checks the driver + DT node on the real E8 board target; filtered OUT
# of the native_sim PR gate (platform_allow = the AEN801 HE board only).

sample:
  name: aen-dma-regcheck
  description: |
    Bench RAM-run PL330 DMA (arm,dma-pl330) memory-to-memory copy proof for
    the E1M-AEN801 (Alif Ensemble E8, Cortex-M55-HE): binds dma2 via the
    upstream Zephyr DMA class API and verifies a real copy through global
    SRAM0 byte-exact.

tests:
  alp_sdk.examples.aen.dma_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - dma
    build_only: true   # the memcpy verification is a bench flash, not a CI run.
