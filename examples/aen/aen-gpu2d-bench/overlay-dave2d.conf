# SPDX-License-Identifier: Apache-2.0
# Opt-in: drive <alp/gpu2d.h> through the D/AVE 2D hardware backend. Needs
# Alif's D/AVE 2D driver module on the build (see README.md) and dave2d.overlay.
CONFIG_DAVE2D=y
CONFIG_ALP_SDK_GPU2D_ALIF_DAVE2D=y
# The backend requires the D-cache (see its Kconfig); prj.conf turns it off for
# the software-fallback run.
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y
