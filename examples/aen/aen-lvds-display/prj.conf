#
# Bench RAM-run config for the E1M-AEN (M55-HE) LVDS-display app.  The app
# UART is NOT on USB on this bench, so the console is the RAM console (read
# 'ram_console_buf' over SWD).

# The display-chain drivers (CDC200, DesignWare DSI host + D-PHY, the
# SN65DSI83 bridge) are alp-sdk ADR 0017 / ADR-0017-ADJACENT copies, defined
# under ALP_SDK.
CONFIG_ALP_SDK=y

# --- The display chain -------------------------------------------------------
# Nothing to set here: the e1m_evk_rvt121hvdfwca0 shield (CMakeLists.txt)
# defaults on DISPLAY, MIPI_DSI(+_DW), MIPI_DPHY(+_DW), DISPLAY_CDC200,
# SN65DSI83, I2C + GPIO + GPIO_PCA_SERIES for the panel-control expander.
# Uncomment to bench-isolate the PLL + LVDS link + panel from the DSI video
# path (see Kconfig.defconfig's SN65DSI83_TEST_PATTERN help):
# CONFIG_SN65DSI83_TEST_PATTERN=y

# --- SoM identity EEPROM (boot banner shows live SKU + hw-rev) ------------
# 24C128 manifest on I2C2 @0x50, mapped to portable bus alp-i2c0 (board DT).
CONFIG_ALP_SDK_HW_INFO=y
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0
CONFIG_ALP_SDK_HW_INFO_EEPROM_ADDR_7BIT=0x50

# --- RAM console (no app UART on USB on this bench) -----------------------
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# LOG MUST stay off on the RAM-console bench: CONFIG_LOG=y reroutes printk into
# the logging subsystem (no RAM-console backend), so output never lands in
# 'ram_console_buf'.
CONFIG_LOG=n

# main() calls display_write() (800 rows through the cdc200 driver, each
# flushing the data cache), an I2C error-register read through the bridge
# driver's sn65dsi83_read_errors(), display_blanking_off(), and several
# multi-arg printk()s -- all deeper than the kernel's 1024 B init-thread
# default budget (CONFIG_MAIN_STACK_SIZE, kernel/Kconfig).  row_buf itself is
# static, not on this stack.
CONFIG_MAIN_STACK_SIZE=4096
