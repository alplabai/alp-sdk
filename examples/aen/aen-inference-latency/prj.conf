# SPDX-License-Identifier: Apache-2.0
#
# aen-inference-latency -- per-inference latency of a Vela-compiled model on the
# E1M-AEN801 / AEN803 Ethos-U85 (M55-HE).  The NPU stack below is transcribed
# from examples/aen/aen-inference-energy / aen-npu-inference-alif
# (silicon-proven); this app adds no I2C and no chip driver.

# --- TFLM + Ethos-U stack (see aen-npu-inference-alif for the derivation) ---

# TFLM is C++17; the MicroInterpreter is C++.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# TFLM module + the Ethos-U custom-op kernel that dispatches onto the NPU.
CONFIG_TENSORFLOW_LITE_MICRO=y

# The Arm Ethos-U core driver + the Zephyr frontend that instantiates the
# arm,ethos-u node at POST_KERNEL.  CONFIG_ARM_ETHOS_U stays unset for the same
# reason as aen-inference-energy: src/main.cpp provides the address remap.
CONFIG_ETHOS_U=y
CONFIG_ETHOS_U_DCACHE=y

# The AE822 (E8) NPU is an Ethos-U85, 256-MAC.
CONFIG_ETHOS_U85_256=y

# --- Heap / stack -----------------------------------------------------------

CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=16384

# --- DMA correctness --------------------------------------------------------

# The NPU is a DMA master; DCACHE=n keeps the CPU and NPU views coherent.
CONFIG_DCACHE=n

# --- Console: RAM console ----------------------------------------------------

# The whole capture is a few KB (header + one ENERGY-W and a handful of
# per-inference lines per window), so 8 KiB with headroom replaces
# aen-inference-energy's 64 KiB sample-stream buffer.  A truncated RAM console
# reads as a shorter capture, so the size is generous on purpose.  The buffer is
# DTCM (not the ITCM image), so it does not eat the Flow C budget.
# Read back with the AEN RAM-run helper; for a large model use the Flow D
# overlay in flowd/ and read the console over SWD/UART as usual.
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# ms-per-inference is printed as a decimal; the ENERGY-CFG header carries the
# measured arena sizes as integers, but the per-window mean latency uses %f.
CONFIG_CBPRINTF_FP_SUPPORT=y

# Logging off: deferred log mode has no ram_console backend and would eat the
# printk protocol lines.
CONFIG_LOG=n
