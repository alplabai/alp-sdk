#
# Bench config for the MRAM flash erase/program/readback RAM-run on the
# E1M-AEN801 (Alif Ensemble E8, M55-HE).

# Console: the Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200
# 8N1, NS16550), the E1M-AEN801 carrier console.  UART5 is USB-routed on the
# bench (the labgrid `console` resource, @115200), so the app's RESULT
# PASS/FAIL line streams live over the console as the SES boots the slot0
# image -- no SWD readback needed.  The board _defconfig already selects it;
# we set it explicitly so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y

# --- slot0 link (Flow D, SES-booted) -----------------------------------------
# The SES boots the RESIDENT slot0 image in preference to a Flow-C ITCM
# RAM-run, so this bench app is flashed into MRAM slot0 and SE-booted.
# The board _defconfig's CONFIG_USE_DT_CODE_PARTITION=y links it at the slot0
# offset (FLASH_LOAD_OFFSET 0x10000 -> reset vector 0x8001xxxx) so app-gen-toc
# can sign it in place (mramAddress 0x80010000) -- see
# scripts/bench/aen/flash-jlink-mramxip.sh.  Nothing to set here.

# --- MRAM flash driver -------------------------------------------------------
# CONFIG_FLASH surfaces the Zephyr flash subsystem; the in-tree Tier-2
# flash_mram_alif driver binds the "alif,mram-flash-controller" node the board
# DTS declares and sets FLASH_HAS_DRIVER_ENABLED.  FLASH_MAP + FIXED_PARTITION
# give us the storage-partition offset/size without hard-coding 0x560000.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Do NOT set CONFIG_MPU_ALLOW_FLASH_WRITE: it widens the generic 2-region MPU
# table's whole-flash window to P_RW_U_RW (arm_mpu_v8.h:316-322), which makes
# ALL of MRAM -- including slot0 and MCUboot -- writable by UNPRIVILEGED code
# (see the MRAM MPU split comment in zephyr/dts/alif/ensemble_e8_peripherals.dtsi,
# the shared SoC overlay both the M55-HE and M55-HP board DTS include). The
# write access flash_mram_alif's direct memory-mapped stores need is supplied
# instead by that shared MRAM_DEVICE region (privileged-only, storage-partition
# + slot0-trailer..end), which covers this app's target (storage_partition) --
# main() runs privileged (no CONFIG_USERSPACE here), so it can write there
# without granting unprivileged write across the whole chip.

# Keep the image small + deterministic for a RAM-run; the driver's own LOG_ERR
# lines are not needed for the PASS gate (the app prints every rc explicitly).
CONFIG_LOG=n
