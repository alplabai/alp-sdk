# SPDX-License-Identifier: Apache-2.0
#
# Build-only compile + DT-bind proof of the Alif Ensemble OSPI/HexSPI
# controller (Synopsys DesignWare OSPI, zephyr/drivers/flash/
# flash_ospi_alif.c, "snps,designware-ospi") staging on E1M-AEN801 and
# E1M-AEN803 (Ensemble E8, M55-HE). AEN803 is additionally the live bench
# target for the JEDEC-ID path on its populated OSPI0 CS1 NOR (see src/main.c).
#
# Compile-checks the driver + DT node on the real E8 board targets; filtered
# OUT of the native_sim PR gate (platform_allow = the AEN801 + AEN803 HE
# boards only).

sample:
  name: aen-ospi-regcheck
  description: |
    Bench RAM-run OSPI/HexSPI proof for E1M-AEN801/E1M-AEN803. Both confirm
    ospi0 binds and its controller registers are live; AEN803 additionally
    targets the fitted ISSI NOR's JEDEC ID through flash_driver_api.

tests:
  alp_sdk.examples.aen.ospi_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
      - alp_e1m_aen803_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - ospi
      - flash
    build_only: true   # the OSPI bind check is a bench flash, not a CI run.
