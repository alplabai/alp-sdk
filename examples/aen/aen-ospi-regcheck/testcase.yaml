# SPDX-License-Identifier: Apache-2.0
#
# Build-only compile + DT-bind proof of the Alif Ensemble OSPI/HexSPI
# controller (Synopsys DesignWare OSPI, zephyr/drivers/flash/
# flash_ospi_alif.c, "snps,designware-ospi") staging on the E1M-AEN801/
# E1M-AEN803 board target (Ensemble E8, M55-HE).  BUILD-ONLY in CI (this is
# a compile+link gate, not a HIL run) -- but bench-verified on real
# E1M-AEN803 silicon (#2041/#915): OSPI0 CS1 (the IS25WX256-JHLE NOR) answers
# a JEDEC ID read through this driver's flash_driver_api.
#
# Compile-checks the driver + DT node on the real E8 board target; filtered OUT
# of the native_sim PR gate (platform_allow = the AEN801 HE board only).

sample:
  name: aen-ospi-regcheck
  description: |
    Bench RAM-run OSPI/HexSPI (snps,designware-ospi) bind + device proof for
    the E1M-AEN801/E1M-AEN803 board target (Alif Ensemble E8,
    Cortex-M55-HE): confirms ospi0 binds, alif_hal_ospi_initialize()
    compiles, links, and reads back live registers, and (on a populated
    E1M-AEN803) the OSPI0 CS1 NOR answers a JEDEC ID read through
    flash_driver_api.  BUILD-ONLY in CI; see #2041/#915 for the bench
    measurement.

tests:
  alp_sdk.examples.aen.ospi_regcheck.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - ospi
      - flash
    build_only: true   # the OSPI bind check is a bench flash, not a CI run.
