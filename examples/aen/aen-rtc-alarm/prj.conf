#
# On-module RV-3028-C7 RTC + alarm example for the E1M-AEN801 (Alif Ensemble E8).

# --- Console -----------------------------------------------------------------
# E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200 8N1, NS16550) -- the
# E1M-AEN801 carrier console. The board _defconfig already selects it; it is
# repeated here so the example is self-describing.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Serial-less bench? Comment the four lines above and uncomment these to read
# 'ram_console_buf' over SWD instead:
# CONFIG_RAM_CONSOLE=y
# CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
# CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y

# --- BRD_I2C (SoC I2C0) ------------------------------------------------------
# The upstream i2c_dw driver (CONFIG_I2C_DW) self-selects `default y` from the
# okay'd "snps,designware-i2c" i2c0 node, so only the subsystem needs enabling.
# PINCTRL is pulled in by i2c0's pinctrl-0; set explicitly for clarity.
CONFIG_I2C=y
CONFIG_PINCTRL=y

# --- Alarm interrupt line ----------------------------------------------------
# The RV-3028 /INT lands on P15_0 = lpgpio bit 0 = IRQ 171, so the driver needs
# the GPIO subsystem to install its edge-triggered callback on that pin.
# CONFIG_GPIO_DW self-selects from the okay'd "snps,designware-gpio" lpgpio node.
CONFIG_GPIO=y

# --- RTC ---------------------------------------------------------------------
# CONFIG_RTC_RV3028 is `default y` off the "microcrystal,rv3028" node in the
# board overlay; it is named here so the example states its own dependency.
# CONFIG_RTC_ALARM is what compiles the alarm half of the driver -- WITHOUT it,
# rtc_alarm_set_callback() and friends are not built and this app does not link.
CONFIG_RTC=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_RV3028=y

# Link at the HE MRAM app partition (0x80010000) so the vector table matches the
# ATOC load address (app-zephyr-he.json mramAddress=0x80010000). FLASH_BASE is
# the full MRAM (0x80000000); without this offset the image links 64 KB low and
# the SES boots into a fault. This is a flashed SES/slot0 target, not a RAM-run
# -- for a Flow C ITCM RAM-run, pass scripts/bench/aen/aen-flowc-itcm.{conf,overlay}
# on the build command line rather than editing this file.
CONFIG_FLASH_LOAD_OFFSET=0x10000

# Logging OFF: this is a teaching example and every line it needs is a printk.
CONFIG_LOG=n
