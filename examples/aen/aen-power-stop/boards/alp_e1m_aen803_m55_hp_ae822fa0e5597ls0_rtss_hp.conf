#
# M55-HP: restore-clocks bench-proven on the E1M-AEN803 HP (2026-10-10, 400 MHz, 3/3 STOP
# cycles, HP-only and with the HE running).  A STOP wake is a cold boot into the clock tree
# the Secure Enclave left (all-RC on the HE, bench U8c); re-apply the HP RUN profile
# (400 MHz, as the vendor sample does) before any peripheral init.  The Kconfig default is
# on for the HE board only, so the HP asks for it here.
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=y
