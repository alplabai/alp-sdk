#
# M55-HP: BUILT, NOT BENCH-VERIFIED.  A STOP wake is a cold boot into the clock tree the
# Secure Enclave left (all-RC on the HE, bench U8c); re-apply the HP RUN profile (400 MHz,
# as the vendor sample does) before any peripheral init.  The Kconfig default is on for the
# HE board only, so the HP asks for it here.
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=y
