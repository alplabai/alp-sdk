#
# M55-HP on the E1M-AEN401 (Ensemble E4).  Built, not bench-run by Alp Lab.

# prj.conf names the E8 capability profile; the E4 HP is alif:ensemble:e4, so the
# backend's E4 registration is the one selected.
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E4=y

# The AEN401 board has no `alp,som-power` node yet, so the SoM power layer is not
# default-on; the STOP backend depends on it (the wake record and the RV-3028 hooks).
CONFIG_ALP_SDK_SOM_POWER=y

# No `bkram` node on the E4 yet: a BKRAM bench cell would land in ordinary RAM and be
# lost across the STOP cold boot, so the cycle counter uses the RV-3028 User RAM path.
# The wake record itself is not retained either, so the per-cycle wake-source and
# record_valid checks are expected to FAIL on this board until a bkram node exists.
CONFIG_ALP_SDK_SOM_POWER_BKRAM_BENCH_SCRATCH=n

# The boot-time clock restore (ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS) stays off: it is
# bench-proven on the AEN803 HP only, and its PLL_CLK_SEL health check is unverified on E4.
