# MRAM-image config for the STOP bench on the E1M-AEN803 (M55-HE).

CONFIG_ALP_SDK=y
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E8=y

# The Alif SE client the backend talks to the Secure Enclave through.
CONFIG_ARM_MHUV2=y
CONFIG_HAS_ALIF_SE_SERVICES=y

# <alp/power.h> + the SoM power-domain runtime (quiesce / restore / wake record)
# + the STOP backend itself.  The backend is EXPERIMENTAL and off by default.
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_ALP_SDK_POWER_ALIF_SE=y
# BKRAM is SDK-reserved; this adds a counter cell beside the wake record so the
# bench can prove the Utility SRAM survived STOP.  Bench images only.
CONFIG_ALP_SDK_SOM_POWER_BKRAM_BENCH_SCRATCH=y

# The short timed wake: the LPTIMER (the alp,power-wake-timer chosen node).
CONFIG_COUNTER=y

# The long timed wake and the time base: the on-module RV-3028 on BRD_I2C.
CONFIG_I2C=y
CONFIG_ALP_SDK_CHIP_RV3028C7=y

# The cache-clean loop hangs on this silicon (shared bench rule); the backend
# refuses STOP with the D-cache on.
CONFIG_DCACHE=n

CONFIG_MAIN_STACK_SIZE=4096

# Console: Alp UART console -- E1M edge UART0 (Alif UART5, P3_4/P3_5, 115200 8N1).
# After each wake the boot is cold, so the line a bench script greps is printed
# again from the start.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_LOG=n
