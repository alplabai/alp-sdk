# (R-vendor) restore-repro with the FIXED restore: the boot-time restore is forced on a cold
# boot that never slept (vendor power domains, BACKUP4K named, retention re-asserted, BKRAM
# shadowed until proved), then main prints the BKRAM self-test and diag, then cycle 1 (LPTIMER
# 5 s) is attempted in the same boot.
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=y
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_FORCE_RESTORE=y
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_LPTIMER_MAX_MS=10000
CONFIG_AEN_STOP_LPTIMER_MS=5000
CONFIG_AEN_STOP_RTC_MS=11000
