# (R-legacy) restore-repro with the c6de654ff profile (0x16d, memory 0x00108000, no BKRAM
# re-assert): expected to reproduce the U8e loss of the Utility SRAM -- `bkram live=0` (served
# from the shadow, self-test failed) and w52 = 2 in the BOOT diag -- while the SDK data survives.
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=y
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_FORCE_RESTORE=y
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_RESTORE_LEGACY=y
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_LPTIMER_MAX_MS=10000
CONFIG_AEN_STOP_LPTIMER_MS=5000
CONFIG_AEN_STOP_RTC_MS=11000
