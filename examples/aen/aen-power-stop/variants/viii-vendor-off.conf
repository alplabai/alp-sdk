# (V) A-vendorOFF: LPTIMER 5 s with the OFF profile of the vendor system_off sample --
# vtor_address = SCB->VTOR, memory_blocks MRAM | SERAM (| BKRAM, always present).  No boot-time
# restore.  The same image can ablate at run time: during the awake window send 'v' (vtor) or
# 'm' (MRAM|SERAM) on the console to toggle one knob, 'l' (LFXO) and 's' (stby 76.8 MHz) for
# the other two vendor differences.
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=n
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_LPTIMER_MAX_MS=10000
CONFIG_AEN_STOP_LPTIMER_MS=5000
CONFIG_AEN_STOP_RTC_MS=11000
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_VTOR_SELF=y
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_MRAM_SERAM=y
