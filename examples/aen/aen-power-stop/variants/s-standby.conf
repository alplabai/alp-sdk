# (S) STANDBY: every cycle requests ALP_POWER_MODE_STANDBY instead of STOP; the mode check is
# "mode_standby" (the wake record's realised_mode must read STANDBY).  Cycles are the default ones
# (LPTIMER 500 ms, RV-3028 countdown 3 s, RV-3028 alarm).  Untested on silicon.
CONFIG_AEN_STOP_MODE_STANDBY=y
