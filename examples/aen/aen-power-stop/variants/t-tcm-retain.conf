# (T) TCM retention, both DTCM banks: ALP_POWER_RETAIN_TCM with retain_kb = 256 (SRAM5_1 + SRAM5_2).
# A CRC-checked pattern in a 160 KiB .noinit array is written before each STOP and checked after
# the wake: verdict "tcm_retained", evidence "POWER_STOP: tcm ...".  Untested on silicon.
CONFIG_CRC=y
CONFIG_AEN_STOP_RETAIN_TCM_KB=256
