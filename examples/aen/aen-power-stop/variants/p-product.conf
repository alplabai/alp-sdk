# (P) the product combination: vendor OFF profile (vtor = SCB->VTOR, MRAM | SERAM | BKRAM, the
# backend default) plus the fixed boot-time restore.  LPTIMER 5 s first, then the RV-3028
# countdown, then the alarm.  Expect: a wake at 115200 baud, `bkram live=1 selftest=1`.
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=y
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_LPTIMER_MAX_MS=10000
CONFIG_AEN_STOP_LPTIMER_MS=5000
CONFIG_AEN_STOP_RTC_MS=11000
