# (E) cycle 3 wakes from the RV-3028 External Event input (EVI = MODULE_STBY, E1.O2) instead of
# the alarm: ALP_POWER_WAKE_EXT_EVENT, low level, no timer.  Needs one jumper on the EVK:
# WIFI_GPIO18 (M2E_SDIO_WAKEn, M.2 J16 pin 21) -> MODULE_STBY (header P14 pin 1), then drive
# GPIO18 low (open-drain) or touch P14 pin 1 to GND while cycle 3 is asleep.  Bench-pending.
CONFIG_AEN_STOP_EVI_WAKE=y
