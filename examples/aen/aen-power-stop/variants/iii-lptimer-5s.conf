# (iii) LPTIMER interval 5000 ms instead of 500 ms.  The ceiling is raised so the LPTIMER can
# serve it, and the RV-3028 countdown cycle moves to 11000 ms (above the ceiling) so it is
# still served by the RV-3028: the LPTIMER interval is the only variable.
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_LPTIMER_MAX_MS=10000
CONFIG_AEN_STOP_LPTIMER_MS=5000
CONFIG_AEN_STOP_RTC_MS=11000
