# (A-norestore) variant (iii) with the boot-time clock restore OFF: the control for bench U8e.
# The wake path then runs on whatever clocks the SE leaves (UART slow, tick slow) but BKRAM
# is never disturbed by a set_run_cfg.
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=n
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_LPTIMER_MAX_MS=10000
CONFIG_AEN_STOP_LPTIMER_MS=5000
CONFIG_AEN_STOP_RTC_MS=11000
