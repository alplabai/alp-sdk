# (A-norestore) (P) without the boot-time clock restore: the OFF profile is the vendor one
# (backend default), RESTORE_CLOCKS=n.  The wake then runs on the SE-left clocks (UART at 1/5 baud)
# but BKRAM is never disturbed by a set_run_cfg.
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=n
CONFIG_ALP_SDK_POWER_ALIF_SE_BENCH_LPTIMER_MAX_MS=10000
CONFIG_AEN_STOP_LPTIMER_MS=5000
CONFIG_AEN_STOP_RTC_MS=11000
