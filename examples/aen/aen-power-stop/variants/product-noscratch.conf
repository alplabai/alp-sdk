# (product-noscratch) The shipping configuration: no bench scratch option (so no BKRAM bench
# cell, no diag slots, no image CRC, no LPRTC witness, no VBAT RTC_CLK_EN write, the default 1 s
# LPTIMER ceiling), the boot-time clock restore on (the AEN803 board default), the vendor OFF
# profile.  The cycle number lives in the RV-3028 User RAM 1; the verdicts come from
# alp_power_boot_wake_info().  Cycles: LPTIMER 500 ms, RV-3028 countdown 3 s, RV-3028 alarm.
CONFIG_ALP_SDK_SOM_POWER_BKRAM_BENCH_SCRATCH=n
CONFIG_ALP_SDK_POWER_ALIF_SE_RESTORE_CLOCKS=y
