# (H) HE STOP while the M55-HP keeps running: flash with examples/aen/aen-hp-core-smoke on the
# HP in one ATOC (tan flash, one system manifest naming both cores).  Adds the verdict
# hp_kept_running per cycle, from the HP's SRAM0 heartbeat.  The HP's SRAM0 must stay powered
# through the HE's STOP: without the keep mask the SE turns SRAM0 off and the HP faults.
CONFIG_AEN_STOP_HP_BEACON=y
CONFIG_ALP_SDK_POWER_ALIF_SE_OFF_KEEP_MEMORY=0x3
