# (T-128) TCM retention, one DTCM bank: retain_kb = 128 asks for SRAM5_1 only.  Same probe as
# t-tcm-retain.conf; the verdict covers bank 0.  The backend ORs BOTH RET_CTRL HETCM1|HETCM2
# after the SE call (alif_se_power.c:780-782), so both halves stay powered and bank1= does NOT
# show which half SRAM5_1 covers.  Untested on silicon.
CONFIG_CRC=y
CONFIG_AEN_STOP_RETAIN_TCM_KB=128
