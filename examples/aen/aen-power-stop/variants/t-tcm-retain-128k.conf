# (T-128) TCM retention, one DTCM bank: retain_kb = 128 asks for SRAM5_1 only.  Same probe as
# t-tcm-retain.conf; the verdict covers bank 0 and bank 1 is evidence only (which half of the
# address range SRAM5_1 covers is exactly what this variant shows).  Untested on silicon.
CONFIG_CRC=y
CONFIG_AEN_STOP_RETAIN_TCM_KB=128
