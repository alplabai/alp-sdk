# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the aen-power-stop bench app on the E1M-AEN803
# (Ensemble E8, M55-HE; the M55-HP entries below are built, not bench-verified): compiles the Alif SE STOP backend
# (src/backends/power/alif_se_power*.c), the SoM power-domain runtime and the app
# against the real board target, and links the BKRAM region.  The behaviour is a
# bench signal (MRAM image, three STOP cycles, a cold boot after each); native_sim
# cannot carry it -- the logic is covered by tests/unit/power_alif_se.

sample:
  name: aen-power-stop
  description: |
    Bench proof of the Alif SE STOP backend on the E1M-AEN803: stay awake 10 s,
    then STOP with a timed wake three times (LPTIMER, RV-3028 countdown,
    RV-3028 alarm on INT -> P15_0), checking after each cold-boot wake the wake
    source, the BKRAM counter and that every quiesced domain was restored; then
    stay awake.  STOP bench-proven (U8h).

tests:
  alp_sdk.examples.aen.power_stop.aen:
    platform_allow:
      - alp_e1m_aen803_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - power
    build_only: true   # the cycles are a bench flash, not a CI run.

  # The M55-HP builds of the same backend (CONFIG_SOC_AE822FA0E5597LS0_RTSS_HP): the
  # HP-only branches (own AON registers, 400 MHz restore profile, STANDBY / TCM-retention /
  # TCM-boot refusals) are covered on native_sim by tests/unit/power_alif_se.  BUILT, NOT
  # BENCH-VERIFIED.
  alp_sdk.examples.aen.power_stop.aen.hp:
    platform_allow:
      - alp_e1m_aen803_m55_hp/ae822fa0e5597ls0/rtss_hp
      - alp_e1m_aen801_m55_hp/ae822fa0e5597ls0/rtss_hp
    tags:
      - alp-sdk
      - example
      - aen
      - power
    build_only: true   # not bench-verified on the HP yet.
