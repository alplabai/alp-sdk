# SPDX-License-Identifier: Apache-2.0
#
# Build-only regression for the upstream DesignWare gpio_dw driver (Tier-1)
# on the E1M-AEN801 (Ensemble E8, M55-HE): drives a safe GPIO pin (P8_0 /
# gpio8 pin 0) high then low.
#
# Compile-checks the driver + DT node on the real E8 board target; filtered OUT
# of the native_sim PR gate (platform_allow = the AEN801 HE board only).

sample:
  name: aen-gpio-bench
  description: |
    Bench RAM-run GPIO (DesignWare gpio_dw) drive proof for the E1M-AEN801
    (Alif Ensemble E8, Cortex-M55-HE): drives a safe GPIO pin (P8_0 / gpio8
    pin 0) high then low and cross-checks the DR/DDR registers over J-Link.

tests:
  alp_sdk.examples.aen.gpio_bench.aen:
    platform_allow:
      - alp_e1m_aen801_m55_he/ae822fa0e5597ls0/rtss_he
    tags:
      - alp-sdk
      - example
      - aen
      - gpio
    build_only: true   # the GPIO drive check is a bench flash, not a CI run.
