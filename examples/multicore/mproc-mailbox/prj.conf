#
# Otherwise empty by design.  The build's effective Kconfig is
# build/generated/alp.conf -- emitted from this app's board.yaml
# by scripts/alp_project.py and layered over this file via
# EXTRA_CONF_FILE (see CMakeLists.txt). board.yaml's `ipc:` block (kind:
# raw_shmem, endpoints: [m55_hp, m55_he]) now makes kconfig.py's
# `_emit_cross_core_shmem_cache` emit CONFIG_DCACHE=n into the generated
# conf too (PR #1080 follow-up -- this used to be the Ethos-U inference
# branch's job alone).  The line below is kept anyway: it predates the
# generator support, is bench-proven, and removing a hand-written line in
# the same change that adds the generator path would make it impossible
# to tell which one was doing the work if something regressed.  Dropping
# it is a clean follow-up once the generator path is trusted.

# Shared global-SRAM0 mailbox is read/written by BOTH M55 cores, each with its
# own D-cache -> the region must be coherent. Disable the D-cache (the AEN
# SRAM-coherency precedent: the NPU apps do the same) so cross-core reads see
# the other core's writes without explicit clean/invalidate. (A cache-on variant
# would sys_cache_data_flush_range on the writer + invd_range on the reader, on
# silicon where the D-cache can be enabled at all.)
CONFIG_DCACHE=n
