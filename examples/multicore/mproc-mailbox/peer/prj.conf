#
# Peer image stays small -- no IoT stack, no inference runtime,
# just the mproc framing + a printk console.  Sysbuild will layer
# its own overlay once the v0.4 dual-image flow lands.

CONFIG_PRINTK=y
CONFIG_ALP_SDK=y

# Shared global-SRAM0 mailbox+shmem region is read/written by BOTH M55 cores
# (this peer and ../src, its HP-side sibling), each with its own D-cache ->
# the region must be coherent. Disable the D-cache (the AEN SRAM-coherency
# precedent: the NPU apps do the same) so cross-core reads see the other
# core's writes without explicit clean/invalidate. (A cache-on variant would
# sys_cache_data_flush_range on the writer + invd_range on the reader, on
# silicon where the D-cache can be enabled at all.)
CONFIG_DCACHE=n
