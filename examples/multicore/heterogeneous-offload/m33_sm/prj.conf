#
# Raw OpenAMP on the M33-SM, same as rpmsg-v2n: <alp/rpc.h> is not used on
# this side (see src/main.c).  The remaining Kconfig is
# build/generated/alp.conf, emitted from board.yaml.  CMSIS-DSP comes in via
# the `cmsis-dsp` library knob in board.yaml.
CONFIG_ALP_SDK=y
CONFIG_MBOX=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=n
# This example keeps its own raw OpenAMP; keep the generic <alp/rpc.h>
# ipc_service backend (implied by the rpmsg link) out of this image.
CONFIG_IPC_SERVICE_BACKEND_ALP_V2N_RPMSG=n
