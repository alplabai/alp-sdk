#
# The rest of this app's Kconfig comes from build/generated/alp.conf
# (emitted from ../board.yaml, layered via EXTRA_CONF_FILE).

# --- micro-ROS (module pinned in west.yml, ADR 0018) --------------------
# Master enable of micro_ros_zephyr_module.  The module cross-builds the
# whole micro-ROS client stack (rcl/rclc/rmw_microxrcedds/Micro XRCE-DDS
# Client) with colcon at configure time.
CONFIG_MICROROS=y
# Transport: the app supplies its own (RPMsg).  CUSTOM comes from
# m33_sm/patches/ (the pinned module ships only serial/serial-usb/udp).
CONFIG_MICROROS_TRANSPORT_CUSTOM=y
# XRCE datagram MTU must fit one RPMsg payload: 496-byte buffer minus the
# 5-byte "xrce\0" method header = 491 (module default is 512).
CONFIG_MICROROS_XRCE_DDS_MTU="491"
# rclc + rcl make deep call chains.  The module's own sample sets
# MAIN_STACK_SIZE=25000 and also NEWLIB_LIBC=y, NEWLIB_LIBC_NANO=n,
# POSIX_CLOCK=y, CPP=y, PTHREAD_IPC=n.  The values below deviate from that:
# stack 10000 (unproven at runtime), POSIX_API, and the default (picolibc)
# libc instead of newlib -- the combination the build was verified with
# (m33_sm/patches/0002).
CONFIG_MAIN_STACK_SIZE=10000
CONFIG_HEAP_MEM_POOL_SIZE=32768
# micro-ROS needs a POSIX clock (rmw_uros_sync_session, rcutils time).
CONFIG_POSIX_API=y

# --- RPMsg link (identical to ../../rpmsg-v2n/m33_sm/prj.conf) -----------
CONFIG_MBOX=y
CONFIG_OPENAMP=y
# Ship our own vendor-shaped resource table (../../rpmsg-v2n/m33_sm/src).
CONFIG_OPENAMP_RSC_TABLE=n

# This firmware drives the link with raw OpenAMP itself (src/); the board.yaml
# ipc: rpmsg entry must not also pull in the <alp/rpc.h> ipc_service backend.
CONFIG_IPC_SERVICE_BACKEND_ALP_V2N_RPMSG=n
