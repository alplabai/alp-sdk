# Auto-generated by scripts/alp_orchestrate.py -- do not edit.
# Per-core Kconfig fragment for slice `m55_hp` (zephyr).

CONFIG_ALP_SDK=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_THREAD_LOCAL_STORAGE=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Console: Alp UART console (auto-selected for os: zephyr).
# printf/LOG land on the module's console UART (the board layer
# owns the `zephyr,console` DT chosen + pinmux -- e.g. E1M edge
# UART0).  Override in board.yaml with `diagnostics.console: ram`
# (SWD bench flow) or `none` (inherit the board default).
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Boot-banner SoC identity + system summary (from the SoC spec JSON + SoM preset `memory:`; see alp_banner.c).
CONFIG_ALP_SDK_SOC_NAME="Alif Ensemble E8"
CONFIG_ALP_SDK_SOC_CPUS="M55-HP @400MHz (active)|rtss_hp + 2x Cortex-A32 @800MHz + M55-HE @160MHz|rtss_he"
CONFIG_ALP_SDK_SOC_NPUS="Ethos-U85 + 2x Ethos-U55"
CONFIG_ALP_SDK_SOC_SRAM_KB=9984
CONFIG_ALP_SDK_SOC_MRAM_KB=5632
CONFIG_ALP_SDK_SOM_DRAM_MBIT=512
CONFIG_ALP_SDK_SOM_FLASH_MBIT=256

# On-module HW manifest EEPROM -> portable bus 0 (alp-i2c0);
# enables alp_hw_info_read() + the console banner manifest line.
CONFIG_ALP_SDK_HW_INFO_EEPROM_I2C_BUS_ID=0

CONFIG_ALP_SDK_SOM_HW_REV="2626-r2"

# SoM silicon (alif:ensemble:e8 via E1M-AEN803)
CONFIG_ALP_SOC_ALIF_ENSEMBLE_E8=y

# Cross-EVK board facade selector (<alp/board.h>); CONFIG_COMPILER_OPT is single-value (do not also set in prj.conf).
CONFIG_COMPILER_OPT="-DALP_BOARD_E1M_EVK"

# SoM-intrinsic chip drivers (from `E1M-AEN803` on_module + helper_firmware)
CONFIG_ALP_SDK_CHIP_CC3501E=y
CONFIG_ALP_SDK_CHIP_EEPROM_24C128=y
CONFIG_ALP_SDK_CHIP_RV3028C7=y
CONFIG_ALP_SDK_CHIP_TMP112=y

# Board-populated chip drivers (from the resolved board definition)
CONFIG_ALP_SDK_CHIP_BME280=n
CONFIG_ALP_SDK_CHIP_BMI323=y
CONFIG_ALP_SDK_CHIP_BMP581=y
CONFIG_ALP_SDK_BLOCK_BUTTON_LED=y
CONFIG_ALP_SDK_CHIP_CAM_MUX_PI3WVR626=y
CONFIG_ALP_SDK_CHIP_ICM42670=y
CONFIG_ALP_SDK_CHIP_INA236=y
CONFIG_ALP_SDK_CHIP_LIS2DW12=n
CONFIG_ALP_SDK_CHIP_OV5640=n
CONFIG_ALP_SDK_BLOCK_PDM_MIC=y
CONFIG_ALP_SDK_CHIP_SSD1331=n
CONFIG_ALP_SDK_CHIP_TAS2563=y
CONFIG_ALP_SDK_CHIP_TCAL9538=y

# Zephyr subsystems required on core `m55_hp` (chip drivers + peripherals)
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y

# Libraries declared on core `m55_hp`
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y
CONFIG_CMSIS_DSP_CONTROLLER=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_CMSIS_DSP_INTERPOLATION=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_SUPPORT=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_ALP_CMSIS_DSP_SCALAR=y

# §D.lib.loader -- per-library HW-accelerator wiring (auto-emitted).
CONFIG_ALP_CMSIS_DSP_HELIUM=y  # cmsis_dsp / simd
CONFIG_ALP_CMSIS_DSP_ADC_DMA=y  # cmsis_dsp / dma

# board.yaml ipc[].kind: raw_shmem or rpmsg names this core as
# an endpoint with no explicit cacheable: true opt-out.
# <alp/mproc.h> (raw_shmem) and <alp/rpc.h> (rpmsg) both have no
# cache-maintenance layer, so the D-cache must stay off (not
# just the carve-out's own region) for both sides to see each
# other's writes without explicit clean/invalidate (PR #1080,
# #1088).
CONFIG_DCACHE=n

