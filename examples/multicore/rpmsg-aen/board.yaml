# board.yaml -- rpmsg-aen
#
# Heterogeneous compute demo for E1M-AEN801 (Alif Ensemble E8).  The
# E8 die carries a 2-core Cortex-A32 cluster plus 2 Cortex-M55 cores
# (HP + HE).  This example wires:
#
#   * `a32_cluster` -- Yocto Linux consumer under `linux/`.
#   * `m55_hp`      -- Zephyr producer under `m55_hp/` reading the
#                       board's on-board BMP581 + BMI323 sensors
#                       and publishing them over RPMsg.
#   * `m55_he`      -- left at the SoM topology default (stock-shim
#                       Zephyr image); the always-on M55-HE core
#                       stays alive for future low-power offload
#                       work but doesn't participate in this demo's
#                       RPMsg channel.
#
# See docs/heterogeneous-builds.md for the full walk-through; the
# `examples/multicore/rpmsg-v2n/` example is the canonical V2N counterpart of
# this AEN setup.
#
# AEN801's SoC variant supplies the memory envelope and the SoM
# preset supplies the mailbox controller, so the orchestrator can
# allocate the RPMsg carve-out without app-specific SoC knowledge.

libraries:
  - name: mbedtls
    cores: [a32_cluster]
  - name: nlohmann-json
    cores: [a32_cluster]
  - name: cmsis-dsp
    cores: [m55_hp]

som:
  sku: E1M-AEN801
  hw_rev: r2

preset: e1m-evk             # BMP581 + BMI323 (on-board IMU) are
                            # populated by the EVK preset defaults.

# E1M pads this app uses (subset of the EVK preset's `e1m_routes:`).
pins:
  - { e1m: E1M_I2C0, macro: EVK_I2C_BUS_SENSORS, doc: "Shared sensor + IO-expander + INA236 bus" }
cores:
  a32_cluster:
    app: ./linux
    image: alp-image-edge
  m55_hp:
    app: ./m55_hp
    peripherals: [i2c]

# Cross-core RPMsg carve-out.  The orchestrator allocates from
# E1M-AEN801's `memory_map:` (added by #1069) -- the only region
# accessible from all three cores is `mram_main`, and it deliberately
# keeps `base: TBD` (see the field's own comment in
# metadata/e1m_modules/E1M-AEN801.yaml) so this carve-out still lands
# `status: blocked` rather than resolving into a coarse whole-MRAM
# address that could overlap the real mcuboot/slot0/reserved/storage
# regions.  spec §6.8 flips to cacheable: true on AEN by default because
# the M55 cache is on -- but <alp/rpc.h> has no cache-maintenance layer
# behind that flag (#1088), so it is deliberately left unset here: the
# orchestrator now forces CONFIG_DCACHE=n for this core instead (the
# same conservative posture V2N already has) and the loader rejects an
# explicit `cacheable: true` on a rpmsg entry until real cache
# maintenance ships.
ipc:
  - kind: rpmsg
    endpoints: [a32_cluster, m55_hp]
    carve_out_kb: 256
    name: alp_default_rpmsg

diagnostics:
  log_level: info
