# SPDX-License-Identifier: Apache-2.0

sample:
  name: ai-object-detection-realtime
  description: |
    Realtime YOLOv8-tiny object detection on a DEEPX NPU.
    OV5640 camera + <alp/inference.h> dispatch to DEEPX DX-M1
    (29 TOPS on V2M101) + bounding-box overlay on the ST7789
    display + live FPS counter.  Showcase for the V2N-M1
    edge-AI story; the same source compiles for V2N /
    V2N-M1 by flipping `som.sku` in board.yaml.
common:
  tags: ai inference object-detection vision marketing showcase
tests:
  alp_sdk.examples.ai_object_detection.native_sim:
    extra_args: EXTRA_CONF_FILE=generated/alp.conf
    platform_allow:
      - native_sim/native/64
    tags:
      - alp-sdk
      - example
      - ai
      - vision
    build_only: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "\\[obj-det\\] done"
  alp_sdk.examples.ai_object_detection.v2n_m1:
    extra_args: EXTRA_CONF_FILE=generated/alp.conf
    # The in-tree E1M-V2M101 CM33 board this example's board.yaml
    # describes (som.sku E1M-V2M101, cores.m33_sm).  No CI job passes
    # this target as a -p flag yet, so the scenario is selected only
    # by a local `twister -p` run (#2885).
    platform_allow:
      - alp_e1m_v2m101_m33_sm/r9a09g056n48gbg/cm33
    tags:
      - alp-sdk
      - example
      - ai
      - vision
    build_only: true
