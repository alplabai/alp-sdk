# board.yaml -- realtime YOLOv8-tiny object detection demo.
#
# Camera -> inference -> bounding-box overlay on display + live FPS
# counter.  The checked-in project is the V2N-M1 supervisor-M33
# skeleton, so it has TFLM CPU inference only.  A production DEEPX
# deployment adds the A55/Yocto consumer that owns the DX-M1 runtime.
#
# Pipeline:
#
#     OV5640  -->  <alp/camera.h>  -->  <alp/inference.h>  -->  <alp/display.h>
#     (MIPI)        RGB565 frame       TFLM on this M33         bounding-box
#                                      (DEEPX on A55/Yocto)    overlay + FPS
#
# The dispatcher is slice-scoped: Zephyr/M33 gets TFLM, while the
# DRP-AI3 and DEEPX runtimes live on A55/Linux.  Board-level SoM
# capabilities must not be mistaken for M33 backend availability.

libraries:
  - name: tflite-micro
    cores: [m33_sm]
  - name: cmsis-dsp
    cores: [m33_sm]

som:
  # E1M-V2M101 == V2N-M1 (Renesas RZ/V2N host + DEEPX DX-M1 NPU
  # on-module via PCIe).  V2M101's `capabilities:` block declares
  # both engines for its A55/Linux side; neither is an M33/Zephyr
  # inference backend.  This M33-only skeleton therefore gets TFLM.
  sku: E1M-V2M101

preset: e1m-x-evk

# E1M-X pads this app uses (subset of the X-EVK preset's `e1m_routes:`).
pins:
  - { e1m: E1M_X_I2C0, macro: XEVK_I2C_BUS_SENSORS, doc: "Shared sensor + IO-expander + INA236 bus" }
  - { e1m: E1M_X_SPI1, macro: XEVK_SPI_BUS_ARDUINO, doc: "Arduino UNO header SPI on the X-EVK expansion header" }

# OV5640 + ST7789 plug into the X-EVK headers for this demo (not part
# of the X-EVK's default `populated:` table).  Listing them in the
# project's `chips:` array flips on the matching chip drivers without
# needing a per-project board fork.
chips:
  - ov5640                      # 5 MP MIPI camera on the EVK camera connector
  - st7789                      # 240x320 TFT for preview + bounding-box overlay

# The V2M101 silicon carries a Cortex-A55 cluster (Linux/Yocto) plus
# an M33 system-manager.  This example currently builds only the M33
# producer half (Zephyr); the Yocto Linux consumer remains stubbed in
# the SoM topology default until the customer adds an app: ./linux
# override.  With a55_cluster off, neither DRP-AI3 nor DEEPX is
# available to this M33 skeleton; a real accelerated V2M deployment
# needs an A55/Yocto app for those runtimes.
cores:
  a55_cluster:
    os: "off"
  m33_sm:
    app: ./src
    # Library set: tflite_micro supplies the M33 CPU kernels.
    # CMSIS-DSP handles the pre-/post-process (resize, NMS) on the
    # host CPU; the A55-side accelerator runtimes are out of scope
    # while a55_cluster is off.
    peripherals:
      - i2c                   # OV5640 SCCB + display init.
      - spi                   # ST7789 framebuffer push.
      - gpio                  # Camera RST/PWDN + display D/C#.
# NOTE: there's no dedicated `csi` / `display` peripheral kind in
# board.yaml -- that's not a version gap, it's how every camera/
# display example expresses this (see
# examples/ai/visual-defect-detection, examples/display/lvgl-widgets-
# demo): the OV5640 + ST7789 chip drivers in the project `chips:`
# array pull in I2C / SPI / GPIO, and the portable <alp/camera.h> +
# <alp/display.h> APIs route through those drivers under the hood.

diagnostics:
  log_level: info
