# board.yaml -- per-app project configuration for the
# fmt-formatting example.
#
# Customer workflow: `tan init --from-example peripheral-io/fmt-formatting`, change `som.sku` to
# your MPN, edit the `preset:` (or use an inline board) if you're on a non-EVK board,
# and `tan build`, which plans alp.conf from this file; twister and a bare
# west build read the pre-generated generated/alp.conf instead
# (scripts/gen_example_alp_conf.py).
libraries:
  - name: fmt
    cores: [m55_hp]

som:
  sku: E1M-AEN801

preset: e1m-evk
supported_boards:
  - e1m-evk
  - e1m-x-evk
cores:
  m55_hp:
    app: ./src
    peripherals: []
    # Pulls vendors/fmt/include (the vendored fmt 11.0.2 headers,
    # Task 0 of the 3p-library-examples batch) and
    # metadata/library-profiles/fmt/fmt_config.h onto the include
    # path. fmt is header-only in this profile (FMT_HEADER_ONLY=1) --
    # no Kconfig knob of its own; the loader emits a
    # documentation-only comment line in alp.conf for this entry
    # (emitted from the manifest's own
    # integration.zephyr.hw_backends.sw_fallback.kconfig array
    # by scripts/alp_orchestrate/libraries.py:283 -- the per-library
    # _LIBRARY_KCONFIG dict this used to cite no longer exists).

diagnostics:
  log_level: info
