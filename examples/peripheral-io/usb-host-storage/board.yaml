# board.yaml -- per-app project configuration for the usb-host-storage example.
#
# Target: E1M-AEN401 (Alif Ensemble E4) M55-HP core.
#
# Customer workflow: `tan init --from-example peripheral-io/usb-host-storage`, change `som.sku` to your MPN,
# and `tan build`.
#
# USB host bring-up is bench-gated:
#   - CONFIG_USB_HOST_STACK=y + CONFIG_UHC_XHCI_ALIF=y (in prj.conf)
#   - uhc_xhci_alif.c implements the full uhc_api; end-to-end enumeration on
#     this EVK needs a D+/D- signal-path fix + a bench pass (see issue #388)
#   - The zephyr_uhc0 node in the board DTS carries the DFP-grounded 0x48200000 / IRQ 101
som:
  sku: E1M-AEN401

preset: e1m-evk

cores:
  m55_hp:
    app: ./src
    peripherals:
      - usb

diagnostics:
  log_level: info
