#
# USB host stack + ALP SDK.  The alp_usb_host_* backend wires to Zephyr's
# usbh_* subsystem when CONFIG_USB_HOST_STACK=y and an alif,xhci-uhc DT
# node is present (label zephyr_uhc0) in the board.
#
# Bring-up note: the xHCI uhc driver (uhc_xhci_alif) implements the full
# uhc_api (see Kconfig.xhci_alif); only *_enable()'s controller bring-up
# (DWC3 host-mode init, xHCI reset, command/event-ring round trip) has
# actually been bench-run.  Everything past that -- ep_enqueue/ep_dequeue,
# bus suspend/resume, disable/shutdown, the event-ring ISR -- follows the
# same register sequencing but still needs its own bench pass (issue #388).
CONFIG_ALP_SDK=y
CONFIG_USB_HOST_STACK=y
CONFIG_UHC_DRIVER=y
CONFIG_UHC_XHCI_ALIF=y
