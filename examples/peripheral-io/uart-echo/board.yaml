# board.yaml -- per-app project configuration for the
# uart-echo example.
#
# Customer workflow: `tan init --from-example peripheral-io/uart-echo`, change `som.sku` to
# your MPN, edit the `preset:` (or use an inline board) if you're on a non-EVK board,
# and `tan build`, which plans alp.conf from this file; twister and a bare
# west build read the pre-generated generated/alp.conf instead
# (scripts/gen_example_alp_conf.py).
som:
  sku: E1M-AEN801

preset: e1m-evk
supported_boards:
  - e1m-evk
  - e1m-x-evk

# E1M pads this app uses (subset of the EVK preset's `e1m_routes:`).
pins:
  - { e1m: E1M_UART0, macro: EVK_UART_PORT_DEBUG, doc: "Console UART exposed on the JTAG/SWD-side debug header" }
cores:
  m55_hp:
    app: ./src
    # Zephyr peripheral subsystem exercised by this example.  The
    # loader translates the entry to CONFIG_<X>=y in alp.conf.
    peripherals:
      - uart

diagnostics:
  log_level: info
