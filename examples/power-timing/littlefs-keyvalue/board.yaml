# board.yaml -- per-app project configuration for the
# littlefs-keyvalue example.
#
# Customer workflow: `tan init --from-example power-timing/littlefs-keyvalue`, change `som.sku` to
# your MPN, edit the `preset:` (or use an inline board) if you're on a non-EVK board,
# and `tan build`.  CMakeLists.txt invokes
# scripts/alp_project.py at configure time + layers the
# generated alp.conf over prj.conf via EXTRA_CONF_FILE.
libraries:
  - name: littlefs
    cores: [m55_hp]

som:
  sku: E1M-AEN801

preset: e1m-evk
supported_boards:
  - e1m-evk
  - e1m-x-evk
cores:
  m55_hp:
    app: ./src
    # `libraries: [littlefs]` makes the loader emit
    # CONFIG_FILE_SYSTEM_LITTLEFS=y + CONFIG_FILE_SYSTEM=y +
    # CONFIG_ALP_LITTLEFS_SYNC_IO=y (from littlefs.yaml's
    # integration.zephyr.kconfig array, transcribed by
    # scripts/alp_orchestrate/libraries.py:283 -- the per-library
    # _LIBRARY_KCONFIG dict this used to cite no longer exists).
    # The flash-backend Kconfig
    # (CONFIG_FLASH / CONFIG_FLASH_MAP) is app-local, not
    # library-selection, so it lives in this example's prj.conf.
    peripherals: []

diagnostics:
  log_level: info
