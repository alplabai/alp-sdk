# board.yaml -- per-app project configuration for the
# v2n-ros2-som-temperature example.
#
# A ROS 2 (Humble) node on the V2N / V2M Cortex-A55 cluster (Yocto) that
# republishes the portable alp_temperature_read_die_milli_c() and
# alp_temperature_read_milli_c() readings as sensor_msgs/Temperature.  Uses only <alp/temperature.h>; see README.md.
#
# The ROS 2 stack is NOT a `libraries:` entry here -- it arrives with the
# image (IMAGE_FEATURES "alp-ros", ALP_ENABLE_ROS2; docs/bring-up-ros2.md).
som:
  sku: E1M-V2N101

preset: e1m-x-evk

cores:
  a55_cluster:
    app: ./src
    recipe: alp-ros2-temperature   # meta-alp-sdk/dynamic-layers/ros2-humble-layer/

diagnostics:
  log_level: info
