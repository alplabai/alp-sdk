# board.yaml -- per-app project configuration for the
# v2n-brd-i2c-bringup example.
#
# Patch-day diagnostic for the V2N SoM's BRD_I2C management bus, run
# from a Linux/Yocto user-space app on the V2N Cortex-A55 cluster.
# RIIC8/BRD_I2C is Cortex-A55/Linux-exclusive (metadata/e1m_modules/
# v2n/core-ownership.yaml) -- the CM33 must never master it.  See
# README.md for the A55/Yocto build.
som:
  sku: E1M-V2N101

preset: e1m-x-evk

cores:
  a55_cluster:
    app: ./src
    # Linux/Yocto user-space C app; links libalp_chips.a (every
    # BRD_I2C chip driver this diagnostic probes) ahead of
    # libalp_sdk.so (alp_i2c backend).
    #
    # No meta-alp-sdk recipe packages this app yet, so `--emit
    # build-plan` / `tan build` block this slice with a
    # `yocto-recipe-missing` warning rather than guess a bitbake
    # target -- add `recipe: <name>` here once one exists.
    peripherals:
      - i2c

chips:
  - rv3028c7
  - tmp112
  - clk_5l35023b
  - act8760
  - da9292
  - tps628640
  - optiga_trust_m
  - gd32g553

diagnostics:
  log_level: info
