# board.yaml -- two models on two NPUs at once on E1M-V2M: one on the
# on-die DRP-AI3, one on the DEEPX DX-M1 behind PCIe.
#
# Customer workflow: build an alp-image-edge image for an E1M-V2M SKU with
# both NPU stacks (meta-deepx-m1 and meta-rz-drpai in bblayers.conf) AND
# RUHMI_DRPAI_TVM_DIR set in local.conf -- the SDK's DRP-AI backend only
# compiles with that account-gated Renesas checkout (see
# docs/bring-up-drpai-v2n.md Sec 4).  Boot, then run
#   v2n-two-models <drpai-model.tar> <drpai-frame.bin> \n#                  <model.dxnn> <dxnn-frame.bin> [seconds] [mode]
#
# E1M-V2M103 is the SKU the V2M HIL bench runs; the DRP-AI3 + DX-M1 pair is
# the same on every V2M SKU.
som:
  sku: E1M-V2M103

preset: e1m-x-evk

cores:
  a55_cluster:
    app: ./src                      # Linux userspace app -- <alp/inference.h> only
    recipe: alp-two-models-inference # meta-alp-sdk/recipes-examples/alp-two-models-inference
                                    # packages `app:` above (issue #597).
  m33_sm:
    os: "off"                       # Both NPUs are A55/Linux-owned; no M33 app.

# No `chips:` entry: DRP-AI3 is on-die, and the DX-M1 is reached through
# libdxrt from Linux, so no chip driver is linked into this app.

diagnostics:
  log_level: info
