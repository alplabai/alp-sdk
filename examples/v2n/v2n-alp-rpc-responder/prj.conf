#
# The rest of this app's Kconfig comes from generated/alp.conf -- emitted from
# board.yaml by `tan build` and layered over this file via EXTRA_CONF_FILE (see
# scripts/gen_example_alp_conf.py).  Its `ipc:` rpmsg entry sets
# CONFIG_ALP_SDK_RPC_LINK=y, which brings in MBOX + IPC_SERVICE + OPENAMP + the
# V2N/V2M CM33 ipc_service backend, and ALP_SDK_RPC with them.
CONFIG_ALP_SDK=y

# The backend ships its own vendor-shaped resource table (the A55's Renesas
# Multi-OS tooling dials that shape), so Zephyr's generated one must be off.
CONFIG_OPENAMP_RSC_TABLE=n

# OpenAMP / libmetal allocate the rpmsg virtio state from the heap; the
# orchestrator leaves its size to the app.
CONFIG_HEAP_MEM_POOL_SIZE=16384
