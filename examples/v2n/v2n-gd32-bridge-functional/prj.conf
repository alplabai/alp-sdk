#
# Feature-selection lives in board.yaml; this file is intentionally
# minimal.  Add app-specific tuning knobs here only when they are
# NOT board-/peripheral-selection (e.g. CONFIG_HEAP_MEM_POOL_SIZE).

CONFIG_PRINTK=y
CONFIG_LOG=y

# The CM33 test image has no console, so a main-thread stack overflow is a
# silent freeze.  Zephyr's 1024 B default is too small for the deepest call
# chain here (ADC_STREAM2 / BATCH frames: ~242 B of locals plus the SPI link
# stack), so size it explicitly; HW_STACK_PROTECTION turns an overflow into a
# MemManage fault instead of silent corruption, and THREAD_NAME lets the fault
# block (k_sys_fatal_error_handler in main.c) record which thread died.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_NAME=y
