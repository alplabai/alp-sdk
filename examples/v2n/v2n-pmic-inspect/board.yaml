# board.yaml -- per-app project configuration for the
# v2n-pmic-inspect example.
#
# Read-only-by-default inspector for the V2N SoM's on-module power
# chips (ACT88760, DA9292, TPS628640) on BRD_I2C, run from a
# Linux/Yocto user-space app on the V2N Cortex-A55 cluster.  Guarded
# write actions (--write + one action flag) go through the drivers'
# metadata-generated limits tables -- see README.md.
som:
  sku: E1M-V2N101

preset: e1m-x-evk

cores:
  a55_cluster:
    app: ./src
    # Linux/Yocto user-space C app; links libalp_chips.a (act8760,
    # da9292, tps628640) ahead of libalp_sdk.so (alp_i2c + alp_gpio
    # backends).
    #
    # No meta-alp-sdk recipe packages this app yet, so `--emit
    # build-plan` / `tan build` block this slice with a
    # `yocto-recipe-missing` warning rather than guess a bitbake
    # target -- add `recipe: <name>` here once one exists.
    peripherals:
      - i2c
      - gpio

chips:
  - act8760
  - da9292
  - tps628640

diagnostics:
  log_level: info
